  { id:"straits_settlements", name:"海峡植民地", category:"nation", lat:1.35, lng:103.82, start:1826, end:1946, region:"マレー半島(ペナン・マラッカ・シンガポール)", desc:{background:'ペナン・マラッカ・シンガポールという3つの英領港市を一体的に経営することで、マラッカ海峡全域の交易を統制しようとする戦略的意図が背景にあった。', process:'イギリス東インド会社が統合して成立させ、1867年には本国直轄の直轄植民地に昇格し、自由貿易港政策のもとで中国系・インド系移民や商人を惹きつけて東西交易の一大中継拠点に発展した。', significance:'後の英領マラヤ経営の橋頭堡となり、第二次世界大戦後の再編でシンガポールは分離した直轄植民地として独自の道を歩むこととなった。', debate:'自由貿易港政策が現地マレー人社会にもたらした影響(中国系・インド系移民の大量流入による人口構成の激変)を、経済的繁栄の代償として不可避なものとみるか、植民地統治の構造的問題とみるかで議論がある。'} },
  { id:"british_malaya", name:"英領マラヤ(マレー連合州)", category:"nation", lat:3.14, lng:101.69, start:1874, end:1957, region:"マレー半島(クアラルンプール)", relatedIds:["malayan_emergency", "malaya_independence"], desc:{background:'パンコール条約(1874年)を機にイギリスがマレー半島内陸の諸スルタン国に「保護」の名目で介入したことが、間接統治体制構築の出発点となった。', process:'1895年にはペラ・スランゴールなど4州をマレー連合州として統合し、さらに非連合州も間接支配下に置き、豊富な錫鉱山とゴムプランテーション経営のため大量の中国系・インド系移民労働者が導入された。', significance:'この移民導入政策が今日にまで続くマレーシアの多民族社会構成(マレー系・中国系・インド系)の起源となり、独立後の民族融和政策の必要性を規定する歴史的与件となった。', debate:'「保護」の名目による間接統治を、現地スルタンの権威を尊重した穏健な統治とみるか、実質的な主権剥奪を糊塗する方便とみるかで評価が分かれる。'} },
  { id:"fall_of_singapore_1942", name:"シンガポール陥落", category:"war", lat:1.35, lng:103.82, start:1942, end:1942, region:"シンガポール", desc:{background:'「東洋の要塞」としてのシンガポールが海側の防衛に偏重し、マレー半島からの陸上侵攻を軽視していたことが、日本軍の奇襲的成功を許す構造的弱点となった。', process:'山下奉文率いる日本軍のマレー半島縦断作戦(自転車部隊を用いた電撃的南下)を経て、わずか1週間の攻防で陥落し、10万人以上のイギリス軍・イギリス連邦軍が降伏する史上最大級の敗北を喫した。', significance:'アジアにおけるイギリスの威信は決定的に失墜し、戦後の東南アジア各地での民族独立運動の高まりを促す大きな要因となった、「西洋不敗神話」崩壊の象徴的事件である。', debate:'この大敗の主因を、イギリス軍の戦略的誤算(要塞砲の向きなど)に求めるか、日本軍の機動力を活かした戦術的革新に求めるかで軍事史上の評価が分かれる。'} },
  { id:"malayan_emergency", name:"マラヤ危機(共産ゲリラ戦)", category:"war", lat:3.14, lng:101.69, start:1948, end:1960, region:"マレー半島(ジャングル地帯)", desc:{background:'日本占領期に抗日ゲリラとして組織され武器・経験を蓄えたマラヤ共産党が、戦後の独立をめぐる主導権争いでイギリスとの対立を先鋭化させたことが背景にある。', process:'マラヤ共産党が指導するゲリラ(主に中国系住民が中心の民族解放軍)とイギリス植民地当局との間で戦われ、イギリスは「ブリッグス・プラン」による住民の集団移住(新村建設)でゲリラと住民の分断を図る対ゲリラ戦術を確立して鎮圧に成功した。', significance:'この対ゲリラ戦術(住民分離による兵站遮断)は後の米軍のベトナムでの「戦略村」政策にも影響を与えた対反乱作戦の古典的成功例として軍事史上重要視される一方、マレー人優遇・多民族融和という独立後のマレーシアの国家統合方針にも大きな影響を与えた。', debate:'共産ゲリラの主体が中国系住民に偏っていたことが、独立後のマレー人優遇政策(ブミプトラ政策)の正当化に利用された側面をどう評価するかで議論がある。'} },
  { id:"malaya_independence", name:"マラヤ連邦独立", category:"event", lat:3.14, lng:101.69, start:1957, end:1957, region:"マラヤ連邦(クアラルンプール)", relatedIds:["tunku_abdul_rahman"], desc:{background:'マラヤ危機を通じてイギリスが多民族融和的な穏健路線の政党連合を独立の交渉相手として選好したことが、独立の枠組みを決定づけた。', process:'マレー人政党UMNOを中心に中国系・インド系政党が連合(アライアンス)を組み、イギリスとの交渉により独立を達成した。', significance:'主要3民族の政党連合による民族融和路線のもとで独立を実現したことは、多民族国家における政治的統合モデルの一例として、この統治体制は後のマレーシア連邦結成の政治的基盤ともなった。', debate:'この「民族融和」路線を真の平等な連合とみるか、実質的にはマレー人優位を前提とした連合であったとみるかは、独立後のマレーシア政治における民族間格差論争の出発点となっている。'} },
  { id:"tunku_abdul_rahman", name:"トゥンク・アブドゥル・ラーマン", category:"person", parentId:"malaya_independence", lat:3.14, lng:101.69, start:1903, end:1990, region:"マラヤ連邦(クアラルンプール)", desc:{background:'UMNOの穏健な指導者としての立場と、中国系・インド系政党との連合形成の政治手腕が、独立交渉の主導権掌握を可能にした。', process:'中国系・インド系政党との連合(アライアンス党)を組織し1957年のマラヤ連邦独立を実現させて初代首相に就任し、1963年にはシンガポール・北ボルネオ(サバ)・サラワクを統合したマレーシア連邦の結成を主導した。', significance:'「独立の父」として東南アジアにおける多民族国家建設の指導者の代表例となったが、1965年のシンガポール分離や1969年の民族暴動などマレーシアの国家統合をめぐる困難な課題にも直面した。', debate:'1969年の民族暴動を招いた責任の一端が、彼の穏健な融和路線の限界(経済格差是正の遅れ)にあったのかどうかは、マレーシア政治史上の重要な論点である。'} },
  { id:"formation_malaysia", name:"マレーシア連邦の結成", category:"event", lat:3.14, lng:101.69, start:1963, end:1963, region:"マレーシア(クアラルンプール)", relatedIds:["singapore_separation"], desc:{background:'イギリスが東南アジアの植民地を段階的に手放す過程で、単独では経済的に脆弱な諸邦を統合することで安定した独立国家を作ろうとした意図が背景にあった。', process:'マラヤ連邦にシンガポール・サバ(北ボルネオ)・サラワクを統合して成立したが、フィリピンが北ボルネオの領有権を主張して反発し、インドネシアのスカルノ政権が「マレーシア粉砕」を掲げて軍事的圧力をかける「マレーシア紛争(コンフロンタシ)」を引き起こすなど、周辺国との緊張を伴う難産の統合過程であった。', significance:'この結成は東南アジアにおける新植民地主義的国境画定への周辺国の反発を招いた事例として、地域国際政治における国家形成の複雑さを示す典型例となっている。', debate:'スカルノの「マレーシア粉砕」政策を、正当な反植民地主義的抵抗とみるか、単なる地域覇権主義的な軍事的威嚇とみるかで、インドネシア・マレーシア双方の歴史認識が対立する。'} },
  { id:"singapore_separation", name:"シンガポールのマレーシアからの分離独立", category:"event", lat:1.35, lng:103.82, start:1965, end:1965, region:"シンガポール", relatedIds:["lee_kuan_yew", "singapore_republic"], desc:{background:'マレー人優遇政策をめぐるマレー系・中国系間の対立の先鋭化(1964年の人種暴動なども背景)が、連邦内における民族的緊張を高めていた。', process:'リー・クアンユー率いる人民行動党と連邦政府との協議の末、シンガポールがマレーシア連邦から分離・独立を余儀なくされた。', significance:'当初は望まぬ形での独立であったが、以後シンガポールは独自路線での急速な経済発展を遂げることとなり、結果的に「予期せぬ独立からの成功」という稀有な事例となった。', debate:'分離の主因を人民行動党の「マレーシア人のマレーシア(民族平等)」路線とUMNOのマレー人優遇路線との理念的対立に求めるか、単なる政治的権力闘争の帰結に求めるかで議論がある。'} },
  { id:"singapore_republic", name:"シンガポール共和国", category:"nation", lat:1.35, lng:103.82, start:1965, end:2030, region:"シンガポール", relatedIds:["lee_kuan_yew"], desc:{background:'天然資源に乏しく国内市場も狭小という不利な条件下で、独立を強いられたことが、外資依存型の開発戦略を不可避にした。', process:'外資導入・自由貿易・法の支配の徹底による国際金融・製造業拠点化を進め、独立からわずか一世代余りで「アジアNIEs」の一角として世界有数の高所得国へと発展を遂げた。', significance:'資源に乏しい都市国家が「開発独裁」的な手法により先進国水準の経済発展を達成した代表的成功例として、開発経済学・比較政治学で頻繁に参照される事例となっている。', debate:'急速な経済発展を可能にした要因を人民行動党の一党優位体制による政治的安定に求めるか、地理的立地(国際海運の要衝)という与件に求めるかで評価が分かれ、経済的自由と政治的統制の共存モデルとしても論じられる。'} },
  { id:"lee_kuan_yew", name:"リー・クアンユー", category:"person", parentId:"singapore_republic", lat:1.35, lng:103.82, start:1923, end:2015, region:"シンガポール", desc:{background:'分離独立という予期せぬ事態の中、資源も後背地も持たない小国をいかに存続させるかという危機感が、徹底した実利主義的統治の背景となった。', process:'清潔で効率的な行政、外資誘致による工業化、多民族融和と英語を軸とした教育政策などを通じて「開発独裁」的な手法により経済発展を実現し、1990年まで首相として国家建設を担った。', significance:'東南アジアの中でも際立った統治モデル(「シンガポール・モデル」)を築いたことで知られ、中国をはじめとする多くの発展途上国の指導者から統治手法の模範として参照されている。', debate:'言論・集会の自由を制限する強権的手法を、小国存続のための必要な代償とみるか、経済発展の美名のもとでの権威主義の正当化とみるかで、国際的な評価が大きく分かれる。'} },
  { id:"malaysia_federation", name:"マレーシア連邦", category:"nation", lat:3.14, lng:101.69, start:1963, end:2030, region:"マレーシア(クアラルンプール)", relatedIds:["malaysia_1969_riots", "mahathir"], desc:{background:'1965年のシンガポール分離という国家的な危機を経て、残った領域でマレー人優位を軸とする国民統合の再構築が課題となった。', process:'マレー系・中国系・インド系という多民族構成のもとブミプトラ(マレー系優遇)政策による経済格差是正と国民統合を国是とし、マハティール首相のもとでの工業化政策を経て東南アジアの中進国として発展を続けている。', significance:'資源(錫・ゴム・後にパーム油)輸出から製造業への産業構造転換を成功させた事例として、東南アジアにおける「中進国の罠」回避のモデルケースとしてしばしば参照される。', debate:'ブミプトラ政策を民族間格差是正のための正当な積極的差別是正措置とみるか、非マレー系(特に中国系)への逆差別とみるかで、マレーシア国内外で評価が大きく対立している。'} },
  { id:"malaysia_1969_riots", name:"5月13日事件と新経済政策(NEP)", category:"event", lat:3.14, lng:101.69, start:1969, end:1971, region:"マレーシア(クアラルンプール)", desc:{background:'独立後も経済的実権の多くを中国系住民が握り続ける一方、政治的多数派であるマレー系との経済格差が拡大していたことが、対立の構造的背景となった。', process:'総選挙での野党(主に中国系支持層)の躍進を機にクアラルンプールで発生したマレー系・中国系住民間の大規模な流血の民族衝突を受け、政府は経済格差の是正を掲げる新経済政策(NEP)を導入した。', significance:'教育・雇用・企業株式保有などの分野でマレー系(ブミプトラ)を優遇する措置を長期にわたり制度化し、以後半世紀以上に及ぶマレーシアの民族別優遇政策の起点となった。', debate:'NEPによる格差是正が民族融和に寄与したとみるか、逆に民族間の分断・非マレー系の不満を制度的に固定化したとみるかで、政策評価が大きく分かれる。'} },
  { id:"mahathir", name:"マハティール・ビン・モハマド", category:"person", parentId:"malaysia_federation", lat:3.14, lng:101.69, start:1925, end:2035, region:"マレーシア(クアラルンプール)", desc:{background:'植民地時代からの一次産品輸出依存経済からの脱却という国家的課題が、強力な指導力を求める政治的要請を生んでいた。', process:'「ルックイースト政策」により日本・韓国の経済発展モデルを範として工業化を推進し、ペトロナス・ツインタワーに象徴される「2020年構想(ビジョン2020)」を掲げて先進国入りを目指した。', significance:'強権的な統治手法や司法・言論への介入もたびたび批判されたが、マレーシアの経済近代化を主導した長期政権指導者として国内外に大きな足跡を残した。', debate:'「アジア的価値観」を掲げ西洋型民主主義とは異なる開発優先の統治モデルを主張した彼の言説は、開発途上国における民主主義と経済発展の関係をめぐる比較政治学上の重要な論争点を提供している。'} },

  // ===================== フィリピン =====================
  { id:"spanish_arrival_philippines", name:"マゼラン到達とマクタン島の戦い", category:"event", lat:10.31, lng:123.95, start:1521, end:1521, region:"フィリピン(セブ・マクタン島)", desc:{background:'スペインが大航海時代を通じアジアの香辛料交易への参入路を西回りに求めたことが、マゼラン艦隊派遣の背景となった。', process:'マゼランがフィリピンに到達しセブ島でキリスト教布教を試みたが、服属を拒んだマクタン島の首長ラプ・ラプの軍との戦いでマゼラン自身が戦死し、遠征隊は撤退を余儀なくされた。', significance:'スペインはフィリピン諸島の存在をヨーロッパに知らしめ、約40年後のレガスピによる本格的な植民地化事業の端緒を開いた点で、フィリピン史の画期をなす出来事である。', debate:'ラプ・ラプの抵抗を「フィリピン最初の反植民地主義的英雄」として顕彰する近代のナショナリズム的評価と、当時の一地域首長の局地的な自衛行動という史実との間の距離が論じられる。'} },
  { id:"spanish_philippines", name:"スペイン領フィリピン", category:"dynasty", lat:14.6, lng:120.98, start:1565, end:1898, region:"フィリピン(マニラ)", relatedIds:["jose_rizal", "philippine_revolution"], desc:{background:'レガスピによる征服後、太平洋を挟んでメキシコと結びつく貿易ルートの構築という経済的思惑と、カトリック布教という宗教的使命とが植民地経営の両輪となった。', process:'マニラを拠点にメキシコ(アカプルコ)との間でガレオン船による中継貿易(アカプルコ貿易)が展開され中国産の絹・陶磁器とメキシコ産銀が交換される太平洋交易の要となる一方、修道会が広大な土地(教会領)を集積したが、19世紀後半には土地収奪と重税への不満、啓蒙思想の流入を背景に民族運動が高まり、1898年の米西戦争を機に統治は終焉した。', significance:'約330年に及ぶこの統治により、フィリピンは東南アジアで唯一カトリックが多数派の国となり、この宗教的性格は今日まで続く同国社会の最大の特徴の一つとなっている。', debate:'アカプルコ貿易を、フィリピンをアジア・アメリカ間の単なる中継地に留め本来の経済発展を阻害した「収奪的植民地経済」とみるか、当時としては先進的なグローバル交易への統合とみるかで評価が分かれる。'} },
  { id:"jose_rizal", name:"ホセ・リサール", category:"person", parentId:"spanish_philippines", lat:14.6, lng:120.98, start:1861, end:1896, region:"スペイン領フィリピン(マニラ)", desc:{background:'ヨーロッパ留学を通じて啓蒙思想・民族主義思想に触れた経験が、スペイン植民地統治の矛盾を批判的に見つめる知的基盤を形成した。', process:'小説『ノリ・メ・タンヘレ』などでスペイン植民地統治の不正と教会の腐敗を告発し、穏健な改革(スペイン議会への参政権付与など)を求める合法的運動団体「ラ・リガ・フィリピナ」を組織したが、急進化を恐れたスペイン当局により反乱扇動の疑いで逮捕され、1896年にマニラで銃殺刑に処された。', significance:'その死は直後のフィリピン革命の引き金となり、今日「国民的英雄」として讃えられ、その処刑の地(現リサール公園)は国民的記憶の場となっている。', debate:'改革を求めた穏健派リサールと武装蜂起を主導した急進派ボニファシオという二つの民族運動路線のどちらをフィリピン独立運動の正統な起点とすべきかは、フィリピン史学における継続的な論争点である。'} },
  { id:"philippine_revolution", name:"フィリピン革命", category:"revolution", lat:14.65, lng:121.02, start:1896, end:1898, region:"フィリピン(マニラ近郊)", relatedIds:["emilio_aguinaldo"], desc:{background:'リサールの処刑を含むスペイン当局の弾圧強化と、啓蒙思想の浸透による民族意識の高揚が、武装蜂起への機運を決定的に高めた。', process:'ボニファシオが結成した秘密結社カティプナンが指導し1896年に武装蜂起したが、当初は苦戦を強いられ、エミリオ・アギナルドが指導権を握ると勢力を拡大し1898年6月には独立を宣言した。', significance:'アジアにおける最初期の反植民地独立革命の一つとして東南アジア各地の民族運動に先駆的な影響を与えたが、同年の米西戦争でスペインが敗北すると独立の主導権はまもなくアメリカとの対立へと移行した。', debate:'カティプナン内部でのボニファシオ(急進的大衆運動路線)からアギナルド(エリート主導路線)への指導権移行の正当性(処刑を含む)については、フィリピン革命史上最大の内部対立として今も評価が分かれる。'} },
  { id:"treaty_paris_1898", name:"パリ条約(米西戦争講和)", category:"treaty", lat:48.86, lng:2.35, start:1898, end:1898, region:"フランス・パリ", desc:{background:'米西戦争でスペインが劣勢に立たされたことが、アメリカとの講和交渉においてフィリピンの帰属という重大な決定を迫る背景となった。', process:'敗れたスペインはキューバの独立を承認するとともに、プエルトリコ・グアム・フィリピンをアメリカに割譲(フィリピンについては2000万ドルの支払いを伴う事実上の売却)することとなった。', significance:'独立を宣言していたアギナルドらフィリピン革命勢力の頭越しに統治権がアメリカへ移されたことが、直後のフィリピン=アメリカ戦争の火種となった、植民地の当事者不在の主権移譲の典型例である。', debate:'「金銭による領土売却」という形式を、通常の帝国主義的領土獲得とみるか、アメリカの当時の反植民地主義的建前(自国も独立革命の産物)との矛盾を示す事例とみるかで論じられる。'} },
  { id:"philippine_american_war", name:"フィリピン=アメリカ戦争", category:"war", lat:14.6, lng:120.98, start:1899, end:1902, region:"フィリピン全土", relatedIds:["emilio_aguinaldo"], desc:{background:'パリ条約でフィリピンの統治権を得たアメリカが独立を認めなかったことが、独立を宣言していたフィリピン第一共和国との軍事衝突を不可避にした。', process:'当初は正規戦で応戦したフィリピン軍もまもなくゲリラ戦に転じたが、アメリカ軍は苛烈な鎮圧作戦(集落の焼き討ちや強制収容)と分断統治により抵抗を制圧し、1902年に戦争終結を宣言した(ただし一部地域の抵抗は継続)。', significance:'この戦争を通じてフィリピンは正式にアメリカの植民地となったが、この戦争でのアメリカ軍の残虐行為は、自国を「反植民地主義の産物」と自認するアメリカの自己認識との深刻な矛盾を露呈させた。', debate:'アメリカ国内でもこの戦争の正当性(「文明化の使命」か帝国主義的侵略か)をめぐり反帝国主義者連盟などによる激しい国内論争が起こり、アメリカ史における帝国主義論争の重要な事例となっている。'} },
  { id:"emilio_aguinaldo", name:"エミリオ・アギナルド", category:"person", parentId:"philippine_american_war", lat:14.44, lng:120.85, start:1869, end:1964, region:"フィリピン(カビテ)", desc:{background:'カティプナン内部での急進派(ボニファシオ)との路線対立の中、より穏健で組織的な指導力を求める勢力からの支持が、彼の台頭を後押しした。', process:'カティプナン内部の派閥抗争でボニファシオを排除して革命の主導権を握り、1898年6月にフィリピン独立を宣言、翌年マロロス憲法のもとフィリピン第一共和国の初代大統領に就任したが、アメリカがフィリピンの統治権を得ると独立を認めないアメリカ軍との戦争を強いられ、1901年に捕縛されてアメリカへの服従を宣誓した。', significance:'アジア最初期の共和国憲法(マロロス憲法)を制定した指導者として評価される一方、その捕縛と服従宣誓により初期の武装抵抗運動は終結を迎えた。', debate:'ボニファシオの処刑を命じた事実が、彼の「独立の英雄」としての評価にどう影響すべきかについては、フィリピン国内でも意見が分かれる論争的な問題である。'} },
  { id:"american_philippines", name:"アメリカ統治下のフィリピン", category:"nation", lat:14.6, lng:120.98, start:1898, end:1946, region:"フィリピン(マニラ)", relatedIds:["japan_occupation_philippines"], desc:{background:'フィリピン=アメリカ戦争を経て統治権を確立したアメリカが、旧宗主国スペインとは異なる統治理念(「恩恵的同化」)を掲げたことが、この時代の性格を規定した。', process:'公教育の英語による普及や自治制度の段階的導入など「恩恵的同化」政策を進め、1935年には10年後の完全独立を約定するフィリピン・コモンウェルス(自治領)が発足しケソンが初代大統領に就任したが、第二次世界大戦中の日本軍占領により独立準備は中断された。', significance:'英語教育の普及とアメリカ式教育制度・政治制度の移植は、独立後のフィリピンの言語状況(英語の公用語化)と政治文化に長期的な影響を残した。', debate:'「恩恵的同化」を、他の欧州植民地主義とは異なる進歩的な統治理念とみるか、経済的収奪(農産物輸出への依存構造の固定化)を糊塗する美名にすぎないとみるかで評価が分かれる。'} },
  { id:"japan_occupation_philippines", name:"日本軍のフィリピン占領", category:"event", lat:14.6, lng:120.98, start:1942, end:1945, region:"フィリピン(マニラ・レイテ島)", relatedIds:["philippines_republic"], desc:{background:'太平洋戦争開戦後、東南アジア資源地帯への進出を図る日本の南進政策が、アメリカ領フィリピンへの侵攻を招いた。', process:'日本軍がフィリピンに侵攻しアメリカ・フィリピン軍を降伏させて(「バターン死の行進」などの悲劇を伴いつつ)全土を占領し、マッカーサーは「アイ・シャル・リターン」の言葉を残して撤退したが、1944年のレイテ沖海戦・レイテ島上陸により反攻を開始し1945年にマニラ市街戦などの激しい戦闘を経て奪回した。', significance:'特にマニラ市街戦は日本軍による住民虐殺を伴う激戦となり、フィリピンにおける対日感情と戦後の戦争責任認識の重要な原点となっている。', debate:'バターン死の行進における死者数・原因(意図的虐待か補給破綻による混乱かの複合)については史料的検証が続けられている。'} },
  { id:"philippine_independence", name:"フィリピン独立", category:"event", lat:14.6, lng:120.98, start:1946, end:1946, region:"フィリピン(マニラ)", desc:{background:'1935年のフィリピン・コモンウェルス発足時に約定されていた10年後の完全独立という取り決めが、戦争による中断を経てそのまま履行された。', process:'第二次世界大戦後の1946年7月4日にアメリカからの完全独立を達成したが、独立後もアメリカとの間で軍事基地の設置や経済面での特権的地位を認める協定が結ばれた。', significance:'政治的独立とは裏腹に経済的・軍事的にはアメリカへの強い依存が続く「新植民地主義的」な関係が長く指摘されることとなり、この構造は冷戦期を通じたアメリカのアジア戦略の拠点としてのフィリピンの位置づけを規定した。', debate:'独立の「完全性」について、法的独立と実質的な経済的従属(パリティ権条項など対米特権の存続)との乖離をどう評価するかが、新植民地主義論の文脈でしばしば論じられる。'} },
  { id:"philippines_republic", name:"フィリピン共和国", category:"nation", lat:14.6, lng:120.98, start:1946, end:2030, region:"フィリピン(マニラ)", relatedIds:["marcos_regime", "edsa_revolution"], desc:{background:'地主層を基盤とする寡頭的な議会政治が独立当初から続いていたことが、貧富の格差と社会不安の構造的背景となった。', process:'貧富の格差や共産主義ゲリラ(フクバラハップ、後の新人民軍)の活動が深刻化する中、1965年に大統領に就任したマルコスは1972年に戒厳令を敷いて独裁体制を築いたが、1986年のピープルパワー革命でマルコスが追放されて以降は民主政治が回復した。', significance:'東南アジアの中でも活発な市民社会と選挙政治を特徴とする国家として推移しているが、地主エリート層による寡頭政治構造は現在も根強く残存する社会的課題である。', debate:'独立後の土地改革の度重なる停滞を、地主層の政治的影響力という構造的要因に求めるか、歴代政権の政策的怠慢に求めるかで議論がある。'} },
  { id:"marcos_regime", name:"マルコス独裁政権(戒厳令体制)", category:"nation", lat:14.6, lng:120.98, start:1965, end:1986, region:"フィリピン(マニラ)", relatedIds:["ferdinand_marcos"], desc:{background:'共産主義ゲリラの活発化と、マルコス自身の三選禁止の憲法規定という政治的制約が、非常措置(戒厳令)による権力延命の動機となった。', process:'「新社会(バゴン・リプナン)」建設を掲げ戒厳令下で独裁体制を敷き、汚職と縁故主義(クロニー・キャピタリズム)、反対派弾圧が横行する一方、対外的には親米路線を維持したが、1983年の野党指導者ベニグノ・アキノ暗殺事件を機に反政権運動が爆発的に拡大し、1986年のピープルパワー革命によりマルコスはハワイへ亡命し政権は崩壊した。', significance:'「開発独裁」を標榜しながら実際には国富の私物化と対外債務の急増を招いた失敗例として、東南アジアの他の開発独裁(インドネシア・韓国など)との対比でしばしば論じられる。', debate:'アメリカがマルコス政権を長年支持し続けた背景(冷戦下の反共同盟国としての戦略的価値)が、独裁の長期化にどこまで寄与したかは、米比関係史上の重要な論点である。'} },
  { id:"ferdinand_marcos", name:"フェルディナンド・マルコス", category:"person", parentId:"marcos_regime", lat:14.6, lng:120.98, start:1917, end:1989, region:"フィリピン(マニラ)", desc:{background:'対日抗戦の英雄としての(誇張された)経歴と、弁舌に長けた政治的才覚が、その当初の高い人気の基盤となった。', process:'1965年に大統領に就任し1972年に戒厳令を布告して憲法上の三選禁止規定を回避し長期独裁体制を築き、夫人イメルダとともに国家財政を私物化し莫大な蓄財を行ったが、1983年に亡命先から帰国しようとした政敵ベニグノ・アキノをマニラ空港で暗殺させた事件が国民の怒りに火をつけ、1986年の大統領選挙不正を機にピープルパワー革命が発生し失脚してハワイへ亡命し同地で死去した。', significance:'その蓄財規模(数十億ドルとも言われる)は「クレプトクラシー(泥棒政治)」の世界的代表例として国際的に記憶され、亡命後の資産返還・追及は今日まで続くフィリピンの重要な政治課題であり続けている。', debate:'対日戦争中の抗日ゲリラとしての経歴・戦功が誇張・捏造であったとする研究があり、その政治的経歴の出発点そのものの史実性が近年の歴史検証で問い直されている。'} },
  { id:"edsa_revolution", name:"ピープルパワー革命(エドゥサ革命)", category:"revolution", lat:14.63, lng:121.03, start:1986, end:1986, region:"フィリピン(マニラ・エドゥサ通り)", relatedIds:["corazon_aquino"], desc:{background:'不正が疑われた1986年大統領選挙の結果発表と、ベニグノ・アキノ暗殺事件以来蓄積されていた反マルコス感情が、大規模な市民蜂起の直接的引き金となった。', process:'コラソン・アキノを支持する市民・修道女・軍の一部反乱勢力がエドゥサ(EDSA)通りに集結し、非暴力の抗議行動によってマルコス独裁を退陣に追い込み、カトリック教会や在郷軍人らの離反も政権崩壊を後押しした。', significance:'流血をほとんど伴わずに独裁政権を打倒した「非暴力革命」の成功例として、後の世界各地(東欧・アジア)の民主化運動にも大きな影響を与えたとされる。', debate:'この「非暴力革命」の成功要因を市民の自発的動員に求めるか、軍内部の反乱勢力(エンリレ国防相ら)の離反という制度内部からの動きに求めるかで、革命の性格づけが分かれる。'} },
  { id:"corazon_aquino", name:"コラソン・アキノ", category:"person", parentId:"edsa_revolution", lat:14.6, lng:120.98, start:1933, end:2009, region:"フィリピン(マニラ)", desc:{background:'暗殺された野党指導者ベニグノ・アキノの妻という立場が、政治経験がなかったにもかかわらず民主化運動の象徴的存在として担ぎ出される背景となった。', process:'夫の死後に民主化運動の象徴的存在として担ぎ出され、ピープルパワー革命後に大統領に就任し、新憲法の制定や政治犯の釈放など民主化改革を進めたが、旧来の地主層の抵抗による土地改革の停滞や度重なる軍のクーデター未遂に直面した。', significance:'アジアにおける女性初の大統領(近代的選挙による)として、民主化と権威主義克服のシンボルとなったが、その統治の限界は民主化後のフィリピン政治が抱える構造的課題を象徴する存在ともなった。', debate:'自らも大地主一族出身であったアキノが、なぜ包括的土地改革(自家所有地を含む)を徹底できなかったのかは、フィリピンにおける「エリート民主主義」の限界を示す事例として批判的に論じられる。'} },
];

function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

  worldCopyJump:true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19,
}).addTo(map);

const markerLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 11,
  iconCreateFunction: function(cluster){
    return L.divIcon({
      html: `<div class="cluster-badge">${cluster.getChildCount()}</div>`,
      className: 'cluster-marker-wrap',
      iconSize: L.point(32, 32),
    });
  },
}).addTo(map);
const markerById = {}; // id -> {marker, entry}

/* =========================================================================
   フィルタ状態
   ========================================================================= */
const activeCategories = new Set(Object.keys(CATEGORY_CONFIG));
let searchTerm = '';

/* =========================================================================
   サイドバー: フィルタリスト生成
   ========================================================================= */
const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

/* =========================================================================
   詳細パネル
   ========================================================================= */
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');

let currentDetailEntry = null;

function getCurrentYear(){
  return parseInt(document.getElementById('yearSlider').value, 10);
}

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];

function renderDesc(desc){
  if(!desc) return '';
  // 後方互換: 万一プレーン文字列のdescが残っていた場合はそのまま1段落で表示
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -1000, MAX_YEAR = 2030;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
</body>
</html>
