    desc:{background:'亡命中の国王のアメリカ入国(治療目的)を認めたことへのイラン国内の激しい反発が、この事件の直接的契機となった。', process:'急進派学生がアメリカ大使館を占拠し外交官ら52人を444日間にわたり人質にとり、カーター政権による軍事的救出作戦も失敗に終わった。', significance:'この長期化した危機はカーター大統領の再選失敗の一因ともなり、以後の米イラン関係を決定的に悪化させ今日まで続く断交状態の直接の起点となった。', debate:'この事件を「学生の自発的な革命的熱情」とみるか、新体制(ホメイニー派)による意図的な政治的道具化とみるかで、その性格づけが論じられる。'} },
  { id:'iran_iraq_war', name:'イラン・イラク戦争', category:'war', lat:31.32, lng:47.65, start:1980, end:1988, region:'イラン・イラク国境地帯',
    desc:{background:'イラン革命による地域の勢力均衡の変化に乗じ、フセイン政権のイラクがイラン領内の油田地帯(フーゼスターン)への野心と国境紛争(シャットゥルアラブ川)を背景に侵攻したことが開戦の契機となった。', process:'第一次世界大戦さながらの塹壕戦・化学兵器使用を伴う消耗戦が8年間続き、双方あわせて100万人規模ともされる犠牲者を出しながら国境線にほぼ変化のないまま1988年に停戦した。', significance:'冷戦下で米ソ双方がイラクを間接的に支援するなど国際的な思惑が絡み合った代理戦争的性格を持ち、この戦争での経験(化学兵器使用など)は後の湾岸戦争・イラク戦争にまで続くフセイン政権への国際的警戒の背景となった。', debate:'国際社会(特にアメリカ)がイラクによる化学兵器使用を黙認・支援した経緯は、後の湾岸戦争でこれを「大義」として非難した姿勢との整合性が厳しく問われる論点である。'} },

  // ===================== イラク共和国(バアス党政権期) =====================
  { id:'iraq_republic_baath', name:'イラク共和国(バアス党政権期)', category:'nation', lat:33.34, lng:44.39, start:1968, end:2003, region:'イラク',
    relatedIds:['saddam_hussein','iran_iraq_war','gulf_war_1991','iraq_war_2003'],
    desc:{background:'1958年の王政打倒後も相次いだ軍事クーデタによる政情不安が、汎アラブ社会主義を掲げるバアス党の台頭を許す土壌となった。', process:'バアス党が複数回のクーデタを経て権力を掌握し、党内の権力闘争を勝ち抜いたサダム=フセインが1979年に実権を完全掌握し、以後は個人崇拝と秘密警察による恐怖統治を特徴とする独裁体制を確立した。', significance:'石油収入を背景とした国家主導の近代化と、クルド人・シーア派への弾圧という二面性を持つ統治体制は、2003年のアメリカ主導のイラク戦争による政権崩壊まで四半世紀続いた。', debate:'バアス党の世俗的汎アラブ主義イデオロギーと、実際の統治における恐怖政治・個人崇拝との乖離をどう理解すべきか、イデオロギーと権力の道具化の関係が論じられる。'} },
  { id:'saddam_hussein', name:'サダム=フセイン', category:'person', parentId:'iraq_republic_baath', lat:33.34, lng:44.39, start:1937, end:2006, region:'イラク',
    desc:{background:'バアス党内での권力闘争を経て次第に実権を掌握し、1979年に正式に大統領・党書記長に就任したことが治世の背景となった。', process:'イラン・イラク戦争(化学兵器使用を含む)、クウェート侵攻(湾岸戦争)、国内のクルド人・シーア派への弾圧(ハラブジャ化学兵器攻撃など)を通じて強権的な統治を続けたが、2003年のアメリカ主導のイラク戦争により政権は崩壊し、後に戦争犯罪で処刑された。', significance:'冷戦期には反イラン・反イスラーム主義の砦として西側諸国から一定の支持を得ていたが、湾岸戦争以降は国際社会から「ならず者国家」の指導者として孤立を深め、大量破壊兵器問題は2003年イラク戦争の(結果的に誤りと判明した)開戦根拠となった。', debate:'彼の統治への評価は、世俗的な近代化と一定の社会インフラ整備という側面と、民族・宗派弾圧という残虐な側面のどちらを重視するかで大きく分かれ、彼の処刑後のイラクの混迷は「独裁の除去が必ずしも安定をもたらさない」という教訓として論じられる。'} },

  // ===================== イスラエル建国とアラブ・イスラエル紛争 =====================
  { id:'zionism', name:'シオニズム運動', category:'event', lat:31.78, lng:35.22, start:1897, end:1948, region:'ヨーロッパ・パレスチナ',
    desc:{background:'19世紀ヨーロッパにおける反ユダヤ主義の高まり(ドレフュス事件など)が、テオドール=ヘルツルによるユダヤ人国家建設運動提唱の直接的背景となった。', process:'『ユダヤ人国家』の刊行と世界シオニスト機構の結成を通じてパレスチナへのユダヤ人入植を組織的に推進し、バルフォア宣言による国際的な支持獲得を経て、ホロコーストという未曾有の悲劇がこの運動への国際的共感を決定的に強めた。', significance:'1948年のイスラエル建国という形でこの運動の目標は実現したが、同時に同地に居住していたパレスチナ人アラブ住民の権利・存在をめぐる対立という、今日まで続く中東紛争の根源を生んだ。', debate:'シオニズムを「迫害されたユダヤ民族の正当な民族自決運動」とみるか「先住のパレスチナ人を無視した植民地主義的入植運動」とみるかは、パレスチナ問題全体の評価に直結する最も根本的な論争軸である。'} },
  { id:'israel_founding', name:'イスラエル建国', category:'event', lat:32.08, lng:34.78, start:1948, end:1948, region:'パレスチナ',
    desc:{background:'ホロコーストという未曾有の悲劇への国際的な同情と、シオニズム運動の組織的な入植活動の蓄積が、国連によるパレスチナ分割決議(1947年)を後押しした。', process:'国連分割決議に基づきユダヤ人指導部が独立を宣言し、直後にアラブ諸国連合軍との第一次中東戦争に突入したが、これに勝利して国連決議案よりも広い領土を実効支配することとなった。', significance:'ユダヤ人にとっては二千年来の悲願である国家再建の達成であったが、この過程で70万人以上のパレスチナ人が難民化(ナクバ=大災厄)し、以後今日まで続くパレスチナ難民問題の起点となった。', debate:'建国を「ユダヤ民族の歴史的権利の回復」とみるか、パレスチナ人にとっての「ナクバ(大災厄)」とみるかという評価の根本的対立は、この地域の紛争理解における最も先鋭な論争点である。'} },
  { id:'arab_israeli_war_1948', name:'第1次中東戦争(パレスチナ戦争)', category:'war', lat:31.78, lng:35.22, start:1948, end:1949, region:'パレスチナ',
    desc:{background:'国連分割決議へのアラブ側の不承認と、イスラエル建国宣言直後のアラブ諸国連合軍による侵攻が、この戦争の背景となった。', process:'当初劣勢と見られていたイスラエル軍が態勢を立て直し、国連決議案よりも広い領土を確保する形で1949年に休戦協定を締結、エジプトがガザ地区を、ヨルダンがヨルダン川西岸を占領する形で分割された。', significance:'この戦争でパレスチナ人70万人以上が難民化する「ナクバ(大災厄)」を経験し、以後周辺アラブ諸国の難民キャンプで生活する世代を超えた難民問題を生み出し、今日まで中東和平の最大の障害の一つであり続けている。', debate:'この難民化の経緯(自主的な避難かイスラエル側による組織的追放か)については、イスラエル人「新歴史家」による近年の実証研究が後者の要素を重視する立場を示すなど、歴史認識をめぐる激しい論争が続いている。'} },
  { id:'egypt_republic', name:'エジプト共和国', category:'nation', lat:30.04, lng:31.24, start:1952, end:2026, region:'エジプト',
    relatedIds:['nasser','sadat','hosni_mubarak','suez_crisis','six_day_war','yom_kippur_war','camp_david_accords','arab_spring'],
    desc:{background:'パレスチナ戦争敗北による王政の権威失墜と、国王ファールーク1世の腐敗した統治への軍部の不満が、王政打倒運動の背景となった。', process:'自由将校団によるクーデタで王政を廃止し共和政を樹立し、ナセルの指導下でスエズ運河国有化・アラブ民族主義の盟主としての地位を確立、その後継サダトの代には対イスラエル講和(キャンプデービッド合意)へと路線転換した。', significance:'アラブ世界における最大の人口・軍事力を持つ国家として、汎アラブ主義の中心的な担い手から後にアメリカとの緊密な同盟関係への転換という、アラブ世界の政治的方向性の変遷を体現する存在であり続けている。', debate:'ナセルの汎アラブ社会主義路線とサダト以降の親米路線という180度の転換を、時代状況への合理的適応とみるか、理念の放棄とみるかで評価が分かれる。'} },
  { id:'nasser', name:'ガマール=アブドゥル=ナーセル', category:'person', parentId:'egypt_republic', lat:30.04, lng:31.24, start:1918, end:1970, region:'エジプト共和国',
    desc:{background:'自由将校団によるクーデタで王政を打倒した後、内部の権力闘争を勝ち抜いて実権を掌握したことが治世の背景となった。', process:'スエズ運河国有化を断行して英仏イスラエルの軍事介入(スエズ危機)を招いたが米ソの圧力で撃退に成功して国際的な威信を高め、汎アラブ主義・非同盟主義の盟主として活動したが、第三次中東戦争(六日間戦争)での壊滅的敗北により威信を大きく損なった。', significance:'アラブ民族主義・第三世界連帯の象徴的指導者として絶大な人気を誇ったが、その理想主義的な汎アラブ統合の試み(アラブ連合共和国など)は現実の国益対立の前に短命に終わった。', debate:'彼のカリスマ的指導力への評価と、六日間戦争での軍事的失策への批判との間で、その歴史的評価は今も大きく揺れ動いている。'} },
  { id:'suez_crisis', name:'スエズ危機(第2次中東戦争)', category:'war', lat:30.58, lng:32.27, start:1956, end:1957, region:'エジプト(スエズ運河)',
    desc:{background:'ナセルによるスエズ運河国有化宣言が、運河の主要株主であったイギリス・フランスの経済的・戦略的利益を直接脅かしたことが開戦の背景となった。', process:'英仏がイスラエルと共謀してエジプトへ軍事侵攻したが、アメリカ・ソ連双方がこれに強く反対する異例の共同歩調をとり、国際的圧力により英仏イスラエルは撤退を余儀なくされた。', significance:'この事件は旧宗主国イギリス・フランスの帝国的な単独軍事行動がもはや通用しない時代の到来を象徴し、以後の英仏の国際的影響力後退と、逆にアメリカ・ソ連が中東問題の主導権を握る冷戦構造への転換点となった。', debate:'英仏イスラエルの共謀を「時代錯誤な帝国主義の最後の発露」とみるこの通説的評価に対し、当時の冷戦下における戦略的計算の複雑さも重視すべきとする視点がある。'} },
  { id:'six_day_war', name:'第3次中東戦争(六日間戦争)', category:'war', lat:31.78, lng:35.22, start:1967, end:1967, region:'シナイ半島・ゴラン高原・ヨルダン川西岸',
    desc:{background:'エジプト・シリア・ヨルダンなどアラブ諸国の軍事的威嚇の高まりと国境紛争の緊張が、イスラエルによる先制攻撃の背景となった。', process:'イスラエル軍が緒戦での航空奇襲によりエジプト空軍を壊滅させ、わずか6日間でシナイ半島・ヨルダン川西岸(東エルサレム含む)・ゴラン高原を制圧する圧倒的勝利を収めた。', significance:'この占領地問題(特にヨルダン川西岸・ガザ地区の占領継続)は今日まで続くイスラエル・パレスチナ紛争の最大の争点であり続け、この戦争でのアラブ側の壊滅的敗北はアラブ民族主義の威信を大きく傷つけた。', debate:'この占領地の法的地位(国連決議242号が求める「占領地からの撤退」の解釈)をめぐる対立は、今日のイスラエル・パレスチナ紛争の国際法上の中心的論点であり続けている。'} },
  { id:'yom_kippur_war', name:'第4次中東戦争(十月戦争)', category:'war', lat:31.78, lng:35.22, start:1973, end:1973, region:'シナイ半島・ゴラン高原',
    desc:{background:'六日間戦争での屈辱的敗北の雪辱を期すエジプト・シリアが、ユダヤ教の贖罪日(ヨム・キプル)という奇襲のタイミングを選んで開戦したことが背景となった。', process:'緒戦でイスラエル軍は不意を突かれ大きな損害を受けたが、態勢を立て直して反撃に転じ最終的に軍事的優位を回復したものの、緒戦の苦戦は「無敵神話」を大きく揺るがした。', significance:'この戦争を機にOPEC諸国が石油戦略(禁輸・大幅値上げ)を発動して第一次石油危機を引き起こし、中東の地域紛争が世界経済全体を揺るがす構造を初めて明確に示した。', debate:'この緒戦の奇襲成功にもかかわらず最終的な軍事的劣勢を挽回できなかったエジプト側の判断が、結果的に対イスラエル講和路線(サダトのキャンプデービッド合意)への転換をどこまで準備したかが論じられる。'} },
  { id:'camp_david_accords', name:'キャンプ・デーヴィッド合意とエジプト・イスラエル平和条約', category:'treaty', lat:30.04, lng:31.24, start:1978, end:1979, region:'エジプト・イスラエル',
    desc:{background:'ヨム・キプル戦争後の相互不信と国力消耗が、サダト大統領による大胆な対イスラエル講和路線への転換を促した背景となった。', process:'サダトの電撃的なエルサレム訪問(1977年)を経て、アメリカ大統領カーターの仲介によりキャンプデービッドで集中協議が行われ、エジプトのシナイ半島返還とイスラエルとの国交正常化を定めた歴史的な和平条約が締結された。', significance:'アラブ諸国として初めてイスラエルとの正式な平和条約を締結した画期的な事例となったが、他のアラブ諸国からは「アラブの大義への裏切り」として激しい非難を浴び、エジプトはアラブ連盟から一時追放された。', debate:'この講和を「現実主義的な地域安定への貢献」と評価するか「パレスチナ問題を置き去りにした個別和平」と批判するかで、アラブ世界内部でも評価が大きく分かれた。'} },
  { id:'sadat', name:'アンワル=サダト', category:'person', parentId:'egypt_republic', lat:30.04, lng:31.24, start:1918, end:1981, region:'エジプト共和国',
    desc:{background:'ナセル死去による後継として、疲弊した経済とヨム・キプル戦争後の国際情勢の変化への対応を迫られたことが治世の背景となった。', process:'ヨム・キプル戦争緒戦での軍事的成功で一定の威信を回復した後、電撃的なエルサレム訪問という大胆な政策転換によりイスラエルとの歴史的和平(キャンプデービッド合意)を実現し、経済開放政策(インフィタート)も推進したが、この和平路線への反発からイスラーム過激派により1981年に暗殺された。', significance:'アラブ・イスラエル和平の先駆者としてノーベル平和賞を受賞したが、その暗殺は中東和平プロセスに内在する国内的リスク(イスラーム主義勢力の反発)を象徴する事件となった。', debate:'彼の対イスラエル和解路線を「歴史的な政治的勇気」と評価する国際的な見方と、「アラブの大義を裏切った」とするアラブ世界内の批判的な見方との間で、評価が今も分かれている。'} },
  { id:'hosni_mubarak', name:'ホスニー=ムバーラク', category:'person', parentId:'egypt_republic', lat:30.04, lng:31.24, start:1928, end:2020, region:'エジプト共和国',
    desc:{background:'サダト暗殺という緊急事態の中、副大統領として権力を継承したことが治世の背景となった。', process:'30年近くにわたり非常事態法を維持した強権的な統治を続け、対イスラエル和平・親米路線は継続したが、経済格差の拡大と汚職・言論統制への国民的不満が蓄積し、2011年のアラブの春の民衆デモにより退陣を余儀なくされた。', significance:'その長期政権の崩壊はチュニジアに端を発する「アラブの春」の中でも最も象徴的な事例の一つとなり、中東における長期独裁体制の脆弱性を国際的に印象づけた。', debate:'彼の親米・対イスラエル和平路線の維持という「地域安定への貢献」と、国内の抑圧的統治のどちらを重視して評価すべきかが論じられる。'} },
  { id:'oslo_accords', name:'オスロ合意', category:'treaty', lat:31.78, lng:35.22, start:1993, end:1993, region:'パレスチナ(ヨルダン川西岸・ガザ)',
    desc:{background:'第一次インティファーダ(パレスチナ人の民衆蜂起)の長期化と、冷戦終結後の国際情勢の変化が、イスラエル・PLO間の直接交渉という画期的な展開を可能にした背景となった。', process:'ノルウェーの仲介による秘密交渉を経て、イスラエルとパレスチナ解放機構(PLO)が相互承認し、ヨルダン川西岸・ガザ地区における暫定的なパレスチナ自治政府樹立で合意した。', significance:'「土地と平和の交換」という枠組みで恒久的な二国家解決への道筋を示した歴史的合意として国際的に高く評価されたが、最終地位交渉(エルサレムの帰属・入植地・難民の帰還権)は先送りされ、以後の交渉は行き詰まりを見せている。', debate:'この合意が真の和平への一歩であったか、それとも占領を実質的に固定化する枠組みにすぎなかったかについて、パレスチナ側内部でも評価が大きく分かれている。'} },
  { id:'abraham_accords', name:'アブラハム合意', category:'treaty', lat:24.45, lng:54.38, start:2020, end:2020, region:'アラブ首長国連邦・バーレーンなど',
    desc:{background:'イラン封じ込めという地域的な戦略的利害の共有が、イスラエルと一部アラブ諸国(UAE・バーレーンなど)の関係正常化を後押しした背景となった。', process:'アメリカ・トランプ政権の仲介のもと、パレスチナ問題の解決を前提条件とせずにイスラエルとUAE・バーレーン・モロッコ・スーダンとの国交正常化が実現した。', significance:'従来「パレスチナ問題解決が先」とされてきたアラブ諸国とイスラエルの関係正常化の順序を覆す画期的な外交的転換となり、中東の地域秩序における新たな地政学的枠組み(対イラン包囲網)の形成を示した。', debate:'この合意を「地域安定への現実的な前進」とみるか「パレスチナ問題を置き去りにする新たな『裏切り』」とみるかで、パレスチナ側及びアラブ世論の評価は厳しく分かれている。'} },
  { id:'gaza_war_2023', name:'ガザ戦争(2023年〜)', category:'war', lat:31.50, lng:34.47, start:2023, end:2025, region:'ガザ地区・イスラエル',
    desc:{background:'ガザ地区の長期封鎖とヨルダン川西岸での入植地拡大への不満、およびイスラエル・サウジアラビア間の関係正常化交渉の進展が、この軍事衝突の複合的な背景となった。', process:'ハマスによる大規模な越境攻撃と多数の民間人殺害・人質拉致を受け、イスラエルはガザ地区への大規模な軍事作戦を展開し、多数のパレスチナ人民間人犠牲者を出す人道危機を引き起こした。', significance:'国際社会における人道法違反疑惑をめぐる評価の対立が先鋭化し、国際司法裁判所へのジェノサイド提訴を含め、パレスチナ問題が改めて国際政治の最重要課題として浮上する契機となった。', debate:'イスラエルの軍事行動を自衛権の行使とみるか均衡を欠いた過剰な報復とみるか、そしてハマスの越境攻撃の性格づけ(テロ行為か抵抗権の行使か)をめぐり、国際世論は根本的に分裂している。'} },

  // ===================== 湾岸戦争・シリア・アラブの春・現代 =====================
  { id:'gulf_war_1991', name:'湾岸戦争', category:'war', lat:29.38, lng:47.98, start:1990, end:1991, region:'クウェート・イラク',
    desc:{background:'イラン・イラク戦争で疲弊した経済を立て直すため、フセイン政権が石油資源をめぐりクウェートへの野心を強めたことが侵攻の背景となった。', process:'イラク軍がクウェートを電撃的に占領・併合を宣言したが、国連安保理決議に基づきアメリカ主導の多国籍軍が「砂漠の嵐作戦」で短期間のうちにイラク軍を撃退した。', significance:'冷戦終結後初の大規模な国際協調型の軍事行動として、国連安保理決議に基づく多国籍軍編成という「新世界秩序」の理念を体現する事例となった。', debate:'戦争終結時にフセイン政権打倒まで進まなかった判断を、国際法上の委任範囲の遵守として評価するか、後の混乱(2003年イラク戦争)を招いた不徹底な結末として批判するかで議論がある。'} },
  { id:'iraq_war_2003', name:'イラク戦争', category:'war', lat:33.34, lng:44.39, start:2003, end:2011, region:'イラク',
    desc:{background:'9・11同時多発テロ後の「テロとの戦い」の文脈で、フセイン政権による大量破壊兵器保有疑惑がアメリカの主要な開戦根拠とされたことが背景となった。', process:'国連安保理の明確な武力行使容認決議を得られないままアメリカ・イギリス主導の有志連合が侵攻しフセイン政権を短期間で打倒したが、大量破壊兵器は結局発見されず、その後は宗派対立(スンナ派・シーア派)の激化と武装勢力の台頭により長期の占領統治の混迷を招いた。', significance:'開戦根拠の誤り(大量破壊兵器不在)が判明したことでアメリカの対外軍事介入の正当性・情報機関の信頼性に深刻な打撃を与え、この統治の失敗は後のISIS台頭の土壌を作る一因ともなった。', debate:'この戦争の正当性(国際法上の合法性、開戦根拠の正確性)をめぐる論争は21世紀の国際政治における最も重要な論争の一つであり続けており、「国家建設」の困難さを示す典型例として今も参照される。'} },
  { id:'arab_spring', name:'アラブの春', category:'revolution', lat:36.81, lng:10.18, start:2010, end:2012, region:'チュニジア・エジプト・リビア・シリアなど中東・北アフリカ各国',
    desc:{background:'長期独裁政権下での若年層の失業率の高さ・経済格差・言論統制への蓄積した不満と、SNSを通じた情報拡散の容易化が、この一連の民主化運動の背景となった。', process:'チュニジアでの一青年の焼身自殺を発端に、エジプト・リビア・イエメン・シリアなど中東・北アフリカ各地に民衆蜂起の波が急速に広がり、複数の長期独裁政権が崩壊したが、その後の帰結は国によって大きく異なりリビア・シリア・イエメンでは内戦へと転落した。', significance:'一部で民主化を実現した(チュニジア)一方、多くの国では内戦・軍事政権復活・権威主義体制の強化という形で「民主化の冬」を迎え、単純な民主化の物語では説明できない多様な帰結を示す事例となった。', debate:'この運動の帰結の多様性(成功例・内戦化・権威主義復活)を分けた要因が、各国の軍・部族・宗派構成の違いに求められるか、外部勢力の介入の有無に求められるかが比較政治学上の重要な論点である。'} },
  { id:'assad_family_dynasty', name:'アサド家', category:'dynasty', lat:33.51, lng:36.29, start:1971, end:2024, region:'シリア',
    relatedIds:['hafez_al_assad','bashar_al_assad','syrian_civil_war'],
    desc:{background:'バアス党内の権力闘争を制したハーフィズ=アル=アサドが、少数派アラウィー派出身ながら軍事力を背景に実権を掌握したことが王朝的支配の背景となった。', process:'ハーフィズが強権的な世俗的独裁体制を確立し、その死後は息子バッシャールが権力を継承したが、2011年のアラブの春を機に発生した反政府デモへの武力弾圧が泥沼の内戦へと発展した。', significance:'共和政国家でありながら事実上の世襲統治(「共和政的王朝」)を実現した事例として、この統治構造の脆弱性がシリア内戦という未曾有の人道危機を招く一因となった。', debate:'少数派(アラウィー派)による多数派(スンナ派)統治という宗派的権力構造が、この長期独裁とその後の内戦の根本的要因としてどこまで決定的であったかが論じられる。'} },
  { id:'hafez_al_assad', name:'ハーフィズ=アサド', category:'person', parentId:'assad_family_dynasty', lat:33.51, lng:36.29, start:1930, end:2000, region:'シリア(アサド家)',
    desc:{background:'軍のクーデタを通じてバアス党内の権力闘争を制したことが、彼の30年に及ぶ長期統治の背景となった。', process:'少数派アラウィー派出身ながら軍・治安機関を掌握して強権的な世俗的独裁体制を確立し、対イスラエル強硬路線を維持する一方、国内の反体制派(特にムスリム同胞団)への弾圧(ハマー虐殺など)を徹底した。', significance:'宗派・部族・地域の複雑なモザイク国家シリアを強権によって統合し続け、この統治モデルは息子バッシャールに引き継がれたが、その抑圧的性格は後の内戦の火種を残すこととなった。', debate:'彼の統治を「複雑な多宗派国家を安定させた現実主義的統治」と評価するか「恐怖政治による表面的安定にすぎなかった」と評価するかで、後のシリア内戦の原因分析にも関わる評価が分かれる。'} },
  { id:'bashar_al_assad', name:'バッシャール=アサド', category:'person', parentId:'assad_family_dynasty', lat:33.51, lng:36.29, start:1965, end:2024, region:'シリア(アサド家)',
    desc:{background:'本来医師を志していたが兄の事故死により後継者として政治の道に進むことになった経緯が、父の死後の政権継承の背景となった。', process:'当初は改革派としての期待を集めたが実際には父の強権的統治を継承し、2011年のアラブの春を機に発生した反政府デモへの武力弾圧が内戦へと発展、ロシア・イランの軍事支援を受けて政権を維持し続けたが、2024年末に反体制派の攻勢により政権は崩壊し国外へ逃亡した。', significance:'内戦は推定50万人以上の死者と国民の半数近くが避難民となる未曾有の人道危機を招き、化学兵器使用疑惑を含め国際的な戦争犯罪追及の対象ともなった。', debate:'当初の「改革派」への期待がなぜ裏切られたのか、権威主義体制における個人の意思と構造的な統治システムの制約との関係がどう働いたかが論じられる。'} },
  { id:'syrian_civil_war', name:'シリア内戦', category:'war', lat:33.51, lng:36.29, start:2011, end:2024, region:'シリア全土',
    desc:{background:'アラブの春の波及によるアサド政権への抗議デモへの武力弾圧が、この内戦の直接的な発端となった。', process:'反体制派・クルド人勢力・イスラーム過激派(ISISを含む)・政府軍という複数の勢力が入り乱れる複雑な内戦に発展し、ロシア・イランが政府軍を、アメリカ・トルコ・湾岸諸国が反体制派をそれぞれ支援する国際的な代理戦争の様相を呈し、2024年末についに政権が崩壊した。', significance:'21世紀最大級の人道危機として推定50万人以上の死者と1000万人を超える難民・避難民を生み、この難民流出は欧州における難民政策・排外主義の高まりという政治的影響も及ぼした。', debate:'国際社会の介入のあり方(限定的な軍事支援にとどめたことの是非)や、ロシア・イランの介入継続が内戦を長期化させた主因かどうかが、国際政治学上の重要な論点である。'} },
  { id:'isis_islamic_state', name:'「イスラーム国」(ISIL/ISIS)の台頭と崩壊', category:'war', lat:36.34, lng:43.13, start:2014, end:2019, region:'イラク・シリア',
    desc:{background:'イラク戦争後の宗派対立(スンナ派の疎外)とシリア内戦の混乱という二重の権力空白が、この過激派組織台頭の温床となった。', process:'イラク・シリア両国にまたがる広大な地域を制圧し「カリフ制国家」の樹立を宣言、SNSを駆使した過激な宣伝戦術で世界中から外国人戦闘員を集める一方、支配地域では住民への過酷な統治と大量虐殺・性奴隷制度などの人道に対する罪を行ったが、国際的な有志連合の軍事作戦により2019年までに支配領域の大半を喪失した。', significance:'SNSを駆使した過激派の国際的な人材募集・宣伝という新たなテロの形態を世界に示し、以後の対テロ対策における情報戦・オンライン対策の重要性を国際社会に痛感させた。', debate:'この組織の急速な台頭を可能にした要因を、イラク戦争後の統治失敗という外的要因に求めるか、過激なイデオロギー自体の訴求力に求めるかで議論があり、その残存勢力の脅威は今も完全には払拭されていない。'} },

  // ===================== 古代インド =====================
  { id:'indus_valley_civilization', name:'インダス文明', category:'nation', lat:27.33, lng:68.14, start:-3300, end:-1300, region:'インダス川流域(現パキスタン・北西インド)',
    desc:{background:'インダス川流域の肥沃な氾濫原における農業生産力の高さが、モヘンジョダロ・ハラッパーなど計画都市の形成を可能にする経済的基盤となった。', process:'整然とした格子状の街路・排水システムを備えた高度な都市計画を持ち、メソポタミアとの交易を行っていたことが印章の出土から確認されているが、文字(インダス文字)は未解読のままであり、前1900年頃気候変動や河川流路の変化により都市文明は急速に衰退・放棄された。', significance:'エジプト・メソポタミアと並ぶ世界最古級の都市文明として、その高度な衛生・排水設備は同時代の他文明を凌駕する水準にあったと評価される。', debate:'インダス文字が未解読であるため王権や宗教の実態が不明であり、この文明とその後のヴェーダ文化(アーリヤ人)との連続性・断絶性については「アーリヤ人侵入説」対「土着発展説」という根強い論争が続いている。'} },
  { id:'vedic_period', name:'ヴェーダ時代(アーリヤ人の移住と定着)', category:'event', lat:30.90, lng:75.85, start:-1500, end:-600, region:'パンジャーブ地方〜ガンジス川流域',
    desc:{background:'インダス文明衰退後、中央アジア方面からアーリヤ人と呼ばれる集団がインド亜大陸北西部に移住・定着したとされることが、この時代の宗教・社会形成の背景となった。', process:'サンスクリット語による聖典『リグ・ヴェーダ』をはじめとするヴェーダ文献群が編纂され、祭祀を中心とする宗教体系とヴァルナ(後のカースト制度の原型)と呼ばれる身分階層秩序が形成された。', significance:'この時代に形成された宗教思想・社会制度(ヴァルナ制)はヒンドゥー教の直接の原型となり、以後3000年以上にわたるインド社会の基層構造を規定し続けている。', debate:'アーリヤ人の「侵入」が軍事的征服を伴うものであったか、より緩やかな移住・文化的融合であったかについては、遺伝学的研究の進展も踏まえて現在も活発な論争が続いている。'} },
  { id:'maurya_empire', name:'マウリヤ朝', category:'nation', lat:25.61, lng:85.14, start:-321, end:-185, region:'インド亜大陸(パータリプトラを都に北インド中心)',
    relatedIds:['chandragupta_maurya','ashoka','kalinga_war'],
    desc:{background:'アレクサンドロス大王の遠征がインダス川流域にまで及んだことで生じた政治的混乱に乗じ、チャンドラグプタ=マウリヤが勢力を拡大したことが建国の背景となった。', process:'北インドの大半を統一し孫のアショーカ王の代にカリンガ征服を経て仏教への深い帰依へ転じ、インド亜大陸のほぼ全域を統一する史上最大級の帝国を築いたが、アショーカ死後は急速に分裂・弱体化した。', significance:'インド亜大陸を史上初めてほぼ統一した帝国として、アショーカ王による仏教の国家的保護は仏教が南アジア・東南アジアへ広く伝播する決定的な契機となった。', debate:'アショーカ死後の急速な崩壊の要因を、彼の仏教的な非暴力志向が軍事的統制の弛緩を招いたとする見方と、単に広大すぎる版図の構造的な統治の困難によるものとする見方とで議論がある。'} },
  { id:'chandragupta_maurya', name:'チャンドラグプタ(マウリヤ朝)', category:'person', parentId:'maurya_empire', lat:25.61, lng:85.14, start:-340, end:-297, region:'マウリヤ朝',
    desc:{background:'アレクサンドロス大王の遠征とその後の混乱によりインダス川流域の政治秩序が動揺していたことが、彼の台頭の背景となった。', process:'宰相カウティリヤ(チャーナキヤ)の助言のもとナンダ朝を打倒しマウリヤ朝を建国し、アレクサンドロスの後継者セレウコス1世との戦いに勝利して北西インドの領土を確保した。', significance:'インド亜大陸の大部分を統一した史上初の帝国を築き上げ、晩年はジャイナ教に帰依して王位を退き苦行の末に没したとされる。', debate:'彼に仕えたとされる宰相カウティリヤの著作とされる政治指南書『実利論(アルタシャーストラ)』の成立年代・実際の著者については、後世の編纂物である可能性も含め史料批判上の議論がある。'} },
  { id:'ashoka', name:'アショーカ王', category:'person', parentId:'maurya_empire', lat:20.27, lng:85.83, start:-304, end:-232, region:'マウリヤ朝',
    desc:{background:'祖父チャンドラグプタが築いた帝国基盤の上に、南インドの独立勢力カリンガ王国への征服戦争を決断したことが治世の転機の背景となった。', process:'カリンガ征服での凄惨な殺戮への深い後悔から仏教に帰依し、以後は非暴力(ダルマ)を統治理念に掲げて各地に勅令を刻んだ石柱・磨崖碑を建て、仏典結集の後援や仏教僧団のスリランカ・中央アジアへの派遣を行った。', significance:'仏教を国家的に保護した最初の大帝国の王として、この保護がなければ仏教はインド国内の一地方宗教にとどまっていた可能性が高く、南アジア・東南アジア全域への仏教伝播の決定的な契機を作った。', debate:'カリンガ征服後の「回心」の劇的な物語がどこまで史実か、後世の仏教側史料による理想化・脚色がどの程度含まれるかについて、史料批判上の検討が必要である。'} },
  { id:'kalinga_war', name:'カリンガ戦争', category:'war', lat:20.27, lng:85.83, start:-262, end:-261, region:'カリンガ(現オリッサ州)',
    desc:{background:'北インドの大半を統一したマウリヤ帝国にとって、独立を保っていた南東部の有力勢力カリンガ王国の征服は、帝国統一の最終段階として位置づけられていた。', process:'アショーカ王自らが指揮した征服戦争は凄惨を極め、勅令碑文によれば10万人以上が殺害され15万人以上が捕虜として連行されたとされる。', significance:'この戦争の惨禍への深い後悔がアショーカ王を仏教への帰依と非暴力(ダルマ)統治への転換に導いたとされ、以後の彼の統治理念と仏教政策の全ての出発点となった画期的な事件である。', debate:'アショーカ王自身の勅令に記された犠牲者数がどこまで史実に基づく数字か、後世への教訓として意図的に誇張された可能性も含め史料批判上の議論がある。'} },
  { id:'gupta_empire', name:'グプタ朝', category:'nation', lat:25.61, lng:85.14, start:320, end:550, region:'北インド(パータリプトラを都に)',
    relatedIds:['chandragupta_i','samudragupta','chandragupta_ii','nalanda','huna_invasions'],
    desc:{background:'クシャーナ朝衰退後の北インドの政治的空白の中、チャンドラグプタ1世が有力な王国との婚姻同盟を通じて勢力を拡大したことが建国の背景となった。', process:'サムドラグプタ・チャンドラグプタ2世の代に北インドの大半を統一する最盛期を築き、数学(ゼロの概念の確立)・天文学・サンスクリット文学(カーリダーサ)が花開く「インドの黄金時代」を現出したが、5世紀後半のフン族(エフタル)の侵入により急速に衰退した。', significance:'この時代に確立された十進法とゼロの概念は後にアラビア世界を経て西欧に伝わり(「アラビア数字」の実際の起源)、世界の数学・科学史に計り知れない影響を残した。', debate:'「黄金時代」という評価は主に上層階級の文化的達成に基づくものであり、この繁栄が社会全体(特に下層カースト)にどこまで及んでいたかについては史料的制約から評価が分かれる。'} },
  { id:'chandragupta_i', name:'チャンドラグプタ1世', category:'person', parentId:'gupta_empire', lat:25.61, lng:85.14, start:319, end:335, region:'グプタ朝',
    desc:{background:'リッチャヴィ族という有力な王家との婚姻同盟が、彼の勢力拡大と帝国建設の決定的な背景となった。', process:'この婚姻同盟を通じて政治的・軍事的基盤を強化し、マガダ地方を中心にグプタ朝の実質的な建国者としての地位を確立した。', significance:'この婚姻同盟という手法は、以後の子サムドラグプタによる大規模な征服事業の基盤を提供し、グプタ朝の勢力拡大の出発点となった。', debate:'この婚姻同盟の政治的意義(単なる縁組か、意図的な王朝戦略か)についての史料は限られており、その実態解明が課題となっている。'} },
  { id:'samudragupta', name:'サムドラグプタ', category:'person', parentId:'gupta_empire', lat:25.61, lng:85.14, start:335, end:375, region:'グプタ朝',
    desc:{background:'父チャンドラグプタ1世が築いた婚姻同盟による勢力基盤の上に、さらなる領土拡大を目指したことが治世の背景となった。', process:'北インド全域と南インドの一部にまで軍事遠征を行い、征服した南インドの王たちを臣従させつつも直接統治は行わない緩やかな覇権体制を築いた。', significance:'「インドのナポレオン」とも称される軍事的才能により帝国の最大版図を実現し、詩人・音楽家としての才能も持つ「文武両道」の王として碑文(アラーハーバード碑文)に称えられている。', debate:'南インドへの遠征が実効支配を伴うものであったか、儀礼的な服属関係にとどまるものであったかについて、碑文の記述の解釈をめぐり議論がある。'} },
  { id:'chandragupta_ii', name:'チャンドラグプタ2世(ヴィクラマーディティヤ)', category:'person', parentId:'gupta_empire', lat:25.61, lng:85.14, start:380, end:415, region:'グプタ朝',
    desc:{background:'父サムドラグプタが築いた広大な版図と軍事的威信の上に、さらなる文化的洗練を追求する治世が可能になったことが背景となった。', process:'西方のシャカ族(サカ人)王朝を征服して領土を拡大する一方、宮廷には「九宝(ナヴァラトナ)」と呼ばれる9人の学者・詩人を擁し、この時代に中国の仏僧法顕がインドを訪れ仏教研究の記録を残した。', significance:'グプタ朝の最盛期を体現する治世として、この時代のサンスクリット文学・彫刻美術・天文学の発展は「インドの古典時代」の頂点と評価される。', debate:'法顕の旅行記に描かれる当時のインド社会の様子(仏教の隆盛、寛容な統治)がどこまで正確な同時代の実態を反映しているか、外国人観察者の記録の史料的価値が論じられる。'} },
  { id:'nalanda', name:'ナーランダー僧院大学', category:'event', lat:25.14, lng:85.44, start:427, end:1200, region:'マガダ地方(現ビハール州)',
    desc:{background:'グプタ朝の仏教保護政策のもと、仏教研究の一大拠点となる学問機関の設立が求められたことが背景となった。', process:'最盛期には数千人の学僧が学ぶ国際的な仏教大学として発展し、中国から玄奘・義浄ら著名な求法僧が訪れて長期間学び、仏教の哲学・論理学・医学・天文学など幅広い学問が教授された。', significance:'世界最古級の国際的な高等教育機関として、その学術的成果は東アジア・チベット・東南アジアへの仏教伝播に決定的な役割を果たしたが、13世紀初頭にイスラーム軍(ゴール朝)の侵攻により破壊され焼失した。', debate:'この破壊がインドにおける仏教衰退の決定的な転換点であったとする見方が有力だが、それ以前からのヒンドゥー教の復興による仏教の相対的衰退という長期的トレンドとの関係が論じられる。'} },
  { id:'huna_invasions', name:'エフタル(白色フン族)の侵入', category:'war', lat:33.94, lng:67.71, start:450, end:528, region:'中央アジア・北西インド',
    desc:{background:'中央アジアの遊牧民フン族(エフタル、「白いフン」とも呼ばれる)が西進する中、インド北西部への侵入を繰り返したことが背景となった。', process:'グプタ朝の軍事力を著しく消耗させ帝国の中央集権的統治を弱体化させ、最終的には北インドが多数の地方勢力に分裂する政治的混乱を招いた。', significance:'グプタ朝の黄金時代を終焉させる決定的な外的要因となり、以後の北インドは統一的な大帝国が長く不在となる分裂期に入った。', debate:'この侵入とほぼ同時期にヨーロッパでもフン族(アッティラ)が西ローマ帝国を揺るがしていたことから、両者の関係(同一の遊牧民集団の東西分岐か)についてユーラシア史規模での議論がある。'} },
  { id:'harsha_vardhana', name:'ハルシャ王(ハルシャ=ヴァルダナ)', category:'person', lat:27.05, lng:79.92, start:590, end:647, region:'北インド(カナウジを都に)',
    desc:{background:'グプタ朝崩壊後の北インドの政治的分裂状態の中、有力な地方王国の後継者として台頭したことが治世の背景となった。', process:'北インドの広範な地域を再統一し仏教を篤く保護して中国僧玄奘の長期滞在・厚遇でも知られ、詩人・劇作家としても活動した文武両道の王であったが、彼の死後は再び急速に分裂状態に戻った。', significance:'グプタ朝崩壊後の北インドにおける最後の大規模な統一王朝として、彼の宮廷を訪れた玄奘の記録(『大唐西域記』)は当時のインド社会を知る最重要の一次史料となっている。', debate:'彼の死後直ちに帝国が瓦解したことは、この統一が個人のカリスマ性に依存する脆弱な統治構造であったことを示しており、中央集権的制度の未整備という古代インド国家に共通する構造的課題を論じる好例となる。'} },
  { id:'chola_empire', name:'チョーラ朝', category:'nation', lat:10.79, lng:79.14, start:848, end:1279, region:'南インド(タミル地方)',
    relatedIds:['rajendra_chola_i'],
    desc:{background:'南インドのタミル地方における豊かな稲作生産力と海上交易の伝統が、この王朝の経済的・軍事的発展の基盤となった。', process:'ラージャラージャ1世・ラージェーンドラ1世の代に南インド全域と海を越えたスリランカ・東南アジア(シュリーヴィジャヤ)への遠征を行う強力な海洋帝国を築き、精緻な地方行政制度(村落自治)と壮麗なヒンドゥー教寺院建築(ブリハディーシュヴァラ寺院)で知られた。', significance:'インド史上稀な海洋進出型の帝国として、東南アジアとの交易・文化的関係を深めタミル文化圏を海外に拡大させ、村落レベルの自治制度は古代インドの高度な行政能力を示す事例として評価される。', debate:'シュリーヴィジャヤ遠征の主目的を交易路の確保という経済的動機に求めるか、純粋な領土的覇権の追求に求めるかで、この稀有な海洋遠征の性格づけが論じられる。'} },
  { id:'rajendra_chola_i', name:'ラージェンドラ・チョーラ1世', category:'person', parentId:'chola_empire', lat:10.79, lng:79.14, start:971, end:1044, region:'チョーラ朝',
    desc:{background:'父ラージャラージャ1世が築いた海軍力と南インド支配の基盤の上に、さらなる対外拡張を志向したことが治世の背景となった。', process:'スリランカを征服し、さらに海を越えてガンジス川流域への遠征(「ガンジスの勝利者」の称号を得た)や東南アジアのシュリーヴィジャヤ王国への大規模な海上遠征を行った。', significance:'インド亜大陸の枠を超えて東南アジアにまで軍事的影響力を及ぼした稀有な事例として、この時代のタミル文化の東南アジアへの伝播(碑文・建築様式)を促進した。', debate:'シュリーヴィジャヤ遠征後もこの地域を恒久的に領有した形跡がないことから、この遠征の実態を一時的な威力偵察・交易路確保のための懲罰的遠征とみるか、本格的な征服意図によるものとみるかで議論がある。'} },
  { id:'ghaznavid_invasions', name:'ガズナ朝のインド侵攻', category:'war', lat:20.89, lng:70.40, start:1000, end:1027, region:'北インド・グジャラート地方',
    desc:{background:'アフガニスタンを拠点とするガズナ朝が、インド亜大陸の豊かな富(特に寺院に蓄積された金銀財宝)に着目したことが、度重なる侵攻の背景となった。', process:'マフムード=ガズナヴィーが17回にわたりインドへ侵攻し、特にソームナート寺院の破壊・略奪で知られる大規模な収奪遠征を繰り返したが、恒久的な領土支配よりも略奪と撤退を基本パターンとした。', significance:'この侵攻はインド亜大陸へのイスラーム勢力の本格的な軍事的進出の先駆けとなり、以後のデリー=スルタン朝建国への道を開いた歴史的な転換点である。', debate:'これらの侵攻を主に宗教的動機(偶像破壊)によるものとみるか、純粋な経済的略奪を目的としたものとみるかで、この時代の征服行動の性格づけが論じられる。'} },

  // ===================== デリー=スルタン朝・ヴィジャヤナガル王国 =====================
  { id:'delhi_sultanate', name:'デリー=スルタン朝', category:'nation', lat:28.61, lng:77.21, start:1206, end:1526, region:'北インド(デリーを都に)',
    relatedIds:['qutb_al_din_aibak','alauddin_khalji','muhammad_bin_tughlaq','battle_of_panipat_1526'],
    desc:{background:'ゴール朝の将軍クトゥブッディーン=アイバクが北インド征服後に自立を図ったことが建国の背景となった。', process:'奴隷王朝・ハルジー朝・トゥグルク朝など複数の王朝が交代しながら約320年にわたり北インドを統治し、イスラーム建築(クトゥブ・ミナールなど)と行政制度をインドにもたらしたが、ティムールの侵攻(1398年)による大打撃を経て弱体化し、最終的にムガル帝国のバーブルにより滅ぼされた。', significance:'インド亜大陸北部における最初の本格的なイスラーム王朝として、以後のムガル帝国に至るインド・イスラーム文化の融合(インド・イスラーム建築様式など)の礎を築いた。', debate:'この王朝の統治(ヒンドゥー教寺院の破壊や人頭税ジズヤの賦課)を宗教的不寛容の表れとみるか、当時の統治慣行として一定の現地慣習との共存も図られていたとみるかで評価が分かれる。'} },
  { id:'qutb_al_din_aibak', name:'クトゥブッディーン=アイバク', category:'person', parentId:'delhi_sultanate', lat:28.61, lng:77.21, start:1150, end:1210, region:'デリー=スルタン朝(奴隷王朝)',
    desc:{background:'ゴール朝の将軍(元奴隷軍人=マムルーク)としてインド遠征を指揮した経験が、主君の死後の自立の背景となった。', process:'ゴール朝の君主ムハンマド=ゴーリーの死後、インド領を継承する形でデリーを都に自立し、デリー=スルタン朝(奴隷王朝)を開いた。', significance:'インド亜大陸北部における最初の本格的なイスラーム王朝の創始者として、彼が建設に着手したクトゥブ・ミナールは現在も世界遺産として残る。', debate:'奴隷出身者(マムルーク)が最高権力者にまで上り詰めるこの統治構造が、イスラーム世界に広く見られる現象(マムルーク朝など)としてどう理解されるべきかが論じられる。'} },
  { id:'alauddin_khalji', name:'アラーウッディーン=ハルジー', category:'person', parentId:'delhi_sultanate', lat:28.61, lng:77.21, start:1266, end:1316, region:'デリー=スルタン朝(ハルジー朝)',
    desc:{background:'デリー=スルタン朝内での権力闘争を勝ち抜き、モンゴル軍の度重なる侵攻という外的脅威に対処する必要があったことが治世の背景となった。', process:'モンゴル軍の侵攻を複数回撃退する一方、南インドへの積極的な遠征で領土を大きく拡大し、市場統制・価格統制という当時としては先進的な経済政策を導入して軍事費を賄った。', significance:'モンゴルの脅威を退けつつデリー=スルタン朝の最大版図を実現し、その統制経済政策はイスラーム世界でも稀な事例として経済史上注目される。', debate:'彼の統制経済政策が実際にどこまで持続的な効果を持ったか、単なる戦時の非常措置にとどまったかについて経済史上の評価が分かれる。'} },
  { id:'muhammad_bin_tughlaq', name:'ムハンマド=ビン=トゥグルク', category:'person', parentId:'delhi_sultanate', lat:28.61, lng:77.21, start:1290, end:1351, region:'デリー=スルタン朝(トゥグルク朝)',
    desc:{background:'先代諸王が築いた広大な版図の統治をさらに合理化しようとする野心的な構想が、彼の急進的な政策の背景となった。', process:'首都をデリーから南方のダウラターバードへ強制的に移転させる政策や、銅貨を金貨と等価とする通貨改革を断行したが、いずれも十分な準備・住民の合意なく実行されたため大混乱を招き失敗に終わった。', significance:'「賢明だが常軌を逸した王」として、その野心的だが性急な改革の失敗は、理念先行の政策が現実の統治にもたらす破綻の典型例として歴史的に頻繁に言及される。', debate:'彼の政策を単なる「狂気の沙汰」として片付けるか、当時としては先見的だが時期尚早であった改革構想として再評価すべきかで、歴史家の間で評価が分かれる。'} },
  { id:'vijayanagara_empire', name:'ヴィジャヤナガル王国', category:'nation', lat:15.34, lng:76.46, start:1336, end:1646, region:'南インド(ハンピを都に)',
    desc:{background:'デリー=スルタン朝の南インドへの進出に対抗するため、ヒンドゥー教徒の諸勢力が結集して建国したことが背景となった。', process:'南インドの大部分を統一しイスラーム勢力(バフマニー朝など)との抗争を繰り返しながら、都ハンピを中心に壮麗な寺院建築と国際交易(スパイス・繊維)で繁栄を築いたが、1565年のターリコータの戦いでの敗北により急速に衰退した。', significance:'南インドにおけるヒンドゥー教文化の最後の大帝国として、その建築・彫刻はドラヴィダ様式の集大成とされ、この時代の繁栄は後世「黄金時代」として理想化されている。', debate:'この帝国を「ヒンドゥー対イスラームの対立軸」で単純化して理解すべきか、実際には複雑な同盟関係(イスラーム勢力とも協力関係を持つ場合があった)を含む政治的実態があったとみるべきかが論じられる。'} },
  { id:'battle_of_talikota', name:'ターリコータの戦い', category:'war', lat:16.48, lng:76.32, start:1565, end:1565, region:'デカン高原',
    desc:{background:'ヴィジャヤナガル王国の急速な勢力拡大が、周辺のイスラーム諸侯国(デカン=スルタン朝群)の警戒感と一時的な連合結成を促したことが背景となった。', process:'通常は互いに抗争していた複数のイスラーム系デカン諸侯国が一時的に連合してヴィジャヤナガル軍と激突し、ヴィジャヤナガル軍は壊滅的な敗北を喫した。', significance:'この敗北により王国は都ハンピを含む中枢部を略奪・破壊され、以後急速に衰退し南インドにおけるヒンドゥー教勢力の政治的優位は事実上終焉した。', debate:'この戦いの結果を「ヒンドゥー・イスラーム対立の決定的瞬間」として単純化する見方に対し、実際には複雑な同盟関係や内部の裏切りが絡む戦争であったことをどこまで重視すべきかが論じられる。'} },

  // ===================== ムガル帝国 =====================
  { id:'mughal_empire', name:'ムガル帝国', category:'nation', lat:27.18, lng:78.02, start:1526, end:1857, region:'インド亜大陸(アグラ・デリーを都に)',
    relatedIds:['babur','akbar','shah_jahan','aurangzeb','battle_of_panipat_1526','taj_mahal'],
    desc:{background:'中央アジアの遊牧民ティムールの子孫バーブルが、中央アジアでの領土喪失を経てインドへの進出を図ったことが建国の背景となった。', process:'パーニーパットの戦いでデリー=スルタン朝を破って建国し、アクバルの代に宗教融和政策により最盛期の基盤を固め、シャー=ジャハーンの壮麗な建築事業(タージ=マハル)を経て、アウラングゼーブの厳格なイスラーム化政策への反発から諸勢力(マラーター王国など)が台頭し急速に衰退、最終的に1857年のインド大反乱後にイギリスにより完全に廃止された。', significance:'インド・イスラーム文化とペルシア・中央アジア文化が融合した独自の宮廷文化・建築様式(ムガル様式)を生み出し、その繁栄は当時の世界経済において最大級の生産力を誇ったとされる。', debate:'この帝国の衰退の要因を、アウラングゼーブの宗教的不寛容政策(非ムスリムへのジズヤ復活)に求めるか、広大すぎる版図の統治コスト増大という構造的問題に求めるかで議論が分かれる。'} },
  { id:'babur', name:'バーブル', category:'person', parentId:'mughal_empire', lat:27.18, lng:78.02, start:1483, end:1530, region:'ムガル帝国',
    desc:{background:'中央アジアのティムール朝の血を引きながら故地フェルガナでの領土争いに敗れ、新天地を求めてインドへの遠征を志したことが建国の背景となった。', process:'パーニーパットの戦いで数的に劣勢ながら火器(大砲・銃)を効果的に用いてデリー=スルタン朝の大軍を撃破し、ムガル帝国の礎を築いたが、即位後わずか数年で没した。', significance:'中央アジアの軍事技術(火器)をインドに持ち込むことで、以後300年以上続くムガル帝国の礎を築き、その回想録『バーブル・ナーマ』は当時の中央アジア・インド社会を知る貴重な一次史料となっている。', debate:'火器という新技術の導入がこの戦いの勝敗にどこまで決定的であったか、それとも巧みな戦術・地形利用の要素も同等に重要であったかが軍事史上論じられる。'} },
  { id:'battle_of_panipat_1526', name:'第1次パーニーパットの戦い', category:'war', lat:29.39, lng:76.97, start:1526, end:1526, region:'北インド(パーニーパット)',
    desc:{background:'デリー=スルタン朝(ロディー朝)内部の権力争いに乗じ、バーブルがインド遠征の好機を捉えたことが背景となった。', process:'数的に劣勢なバーブル軍が、オスマン帝国から学んだとされる火器(マスケット銃・大砲)と荷車を用いた防御陣形を効果的に運用し、ロディー朝の大軍(象部隊を含む)を撃破した。', significance:'この勝利によりムガル帝国建国の道が開かれ、以後300年以上に及ぶインド史上最も重要な王朝の一つの出発点となった画期的な戦いである。', debate:'この戦術的勝利における火器使用の革新性を、当時のインドの軍事技術水準との対比でどこまで決定的な要因として評価すべきかが軍事史研究上の論点となる。'} },
  { id:'akbar', name:'アクバル', category:'person', parentId:'mughal_empire', lat:27.18, lng:78.02, start:1542, end:1605, region:'ムガル帝国',
    desc:{background:'父フマーユーンの代に一時失われた帝国領土を回復する必要があったことと、多様な宗教・民族から成るインド社会を統治する現実的な必要性が、彼の治世の政策形成の背景となった。', process:'軍事的拡張により帝国領土を大きく広げる一方、非ムスリムへの人頭税(ジズヤ)廃止やヒンドゥー教徒有力者(ラージプート諸侯)との婚姻同盟を通じた融和策を進め、諸宗教の要素を融合した独自の宗教「ディーネ・イラーヒー」も提唱した。', significance:'宗教融和政策によりムガル帝国の統治基盤を安定させ、この統治モデルは「寛容な帝国」の代表例として評価され、後継者たちの統治理念にも大きな影響を残した。', debate:'「ディーネ・イラーヒー」が実際にどこまで組織的な新宗教として機能したか、それとも彼個人の宗教的関心の表明にとどまったかについて、史料的評価が分かれる。'} },
  { id:'shah_jahan', name:'シャー=ジャハーン', category:'person', parentId:'mughal_empire', lat:27.18, lng:78.02, start:1592, end:1666, region:'ムガル帝国',
    desc:{background:'父ジャハーンギールの治世で安定した帝国基盤の上に、王朝の威信を示す壮大な建築事業への意欲が、治世の背景となった。', process:'最愛の妃ムムターズ=マハルの死を悼みタージ=マハルを建設させるなど壮麗な建築事業を進め帝国の文化的最盛期を築いたが、晩年は息子たちの間の後継争いに巻き込まれ、勝利した息子アウラングゼーブにより幽閉されて没した。', significance:'タージ=マハルをはじめとするムガル建築の傑作群は今日世界的な観光資源・文化遺産となっており、この時代の建築的達成はインド・イスラーム文化の頂点と評価される。', debate:'壮大な建築事業への莫大な財政支出が、帝国の財政基盤にどこまで長期的な負担を残したか、後の衰退との因果関係が経済史上議論される。'} },
  { id:'taj_mahal', name:'タージ=マハルの造営', category:'event', lat:27.17, lng:78.04, start:1632, end:1653, region:'アグラ',
    desc:{background:'シャー=ジャハーンの最愛の妃ムムターズ=マハルが出産に伴う合併症で若くして死去したことが、この霊廟建設の直接的な動機となった。', process:'ペルシア・インド・中央アジアの建築様式を融合させ、白大理石と precious stone による象嵌細工を用いた対称性の美を追求する設計のもと、約20年の歳月をかけて建設された。', significance:'「愛の記念碑」として世界的に最も著名な建造物の一つとなり、ムガル建築の最高傑作として1983年にユネスコ世界遺産に登録された。', debate:'膨大な建設費用が帝国財政に与えた影響と、この建築的偉業の文化的価値のどちらに重きを置いて評価すべきかという論点は、壮大な建築事業一般の評価軸として繰り返し議論される。'} },
  { id:'aurangzeb', name:'アウラングゼーブ', category:'person', parentId:'mughal_empire', lat:27.18, lng:78.02, start:1618, end:1707, region:'ムガル帝国',
    desc:{background:'父シャー=ジャハーンの晩年に発生した後継争いを勝ち抜き、父を幽閉して即位したことが治世の背景となった。', process:'版図をインド亜大陸のほぼ全域にまで拡大する一方、厳格なイスラーム法(シャリーア)に基づく統治を志向して非ムスリムへの人頭税(ジズヤ)を復活させヒンドゥー教寺院の破壊も行ったため、マラーター王国をはじめとする諸勢力の反発と反乱を招いた。', significance:'版図的には帝国最大を実現したが、その宗教的不寛容政策と度重なる軍事遠征による財政負担は帝国の統治基盤を著しく弱体化させ、彼の死後の急速な帝国衰退の直接的要因となった。', debate:'彼の統治を「イスラーム法への忠実な回帰」と評価するか「先代アクバルが築いた宗教融和路線の破壊」と評価するかで、ムガル帝国衰退の要因分析における評価が大きく分かれる。'} },
  { id:'maratha_empire', name:'マラーター王国(マラーター同盟)', category:'nation', lat:18.52, lng:73.86, start:1674, end:1818, region:'デカン高原西部(現マハーラーシュトラ州)',
    relatedIds:['shivaji','third_battle_panipat'],
    desc:{background:'デカン高原西部の丘陵地帯という地理的条件を活かしたゲリラ戦術の伝統と、ヒンドゥー教徒としてのアイデンティティ意識が、この王国建国の背景となった。', process:'シヴァージーが建国しアウラングゼーブの軍と長期にわたり抗争を続け、その死後は緩やかな連合体(マラーター同盟)としてムガル帝国衰退後のインド亜大陸に急速に勢力を拡大し一時は北インドの大半を影響下に置いたが、第三次パーニーパットの戦いでの大敗と内部対立により弱体化し、最終的にイギリス東インド会社との戦争(マラーター戦争)を経て19世紀初頭に解体した。', significance:'ムガル帝国衰退後のインド亜大陸における最大の在地勢力として、イギリスによるインド支配確立以前の最後の有力な抵抗勢力であった。', debate:'この勢力を統一的な「帝国」とみるか、緩やかな諸侯連合(同盟)にすぎなかったとみるかで、その統治構造の性格づけが論じられる。'} },
  { id:'shivaji', name:'シヴァージー', category:'person', parentId:'maratha_empire', lat:18.52, lng:73.86, start:1630, end:1680, region:'マラーター王国',
    desc:{background:'父の所領を継承しつつ、ムガル帝国とビジャープル王国という二大勢力の狭間で自立を模索したことが建国の背景となった。', process:'巧みなゲリラ戦術と山岳要塞の活用により周農の勢力を打ち破って独自の王国を樹立し、ムガル皇帝アウラングゼーブの大軍にも屈することなく抵抗を続けた。', significance:'ヒンドゥー教国家再興の英雄として、後のインド民族主義運動においてもヒンドゥー・ナショナリズムの象徴的存在として繰り返し参照される重要な歴史的人物となっている。', debate:'彼を「ヒンドゥー・ナショナリズムの先駆者」として顕彰する近代以降の政治的利用と、実際の同時代における彼の統治理念(宗教融和的な側面も指摘される)との乖離が論じられる。'} },
  { id:'third_battle_panipat', name:'第3次パーニーパットの戦い', category:'war', lat:29.39, lng:76.97, start:1761, end:1761, region:'北インド(パーニーパット)',
    desc:{background:'マラーター同盟が北インドへの勢力拡大を進める中、アフガニスタンのドゥッラーニー朝アフマド=シャーがこれに対抗する軍事行動を起こしたことが背景となった。', process:'マラーター軍とアフガン軍がパーニーパットで激突し、マラーター側は補給線の途絶と同盟内の足並みの乱れもあり壊滅的な敗北を喫した。', significance:'この敗北によりマラーター同盟の北インドにおける覇権的地位は大きく後退し、この政治的空白が結果的にイギリス東インド会社の勢力拡大を容易にする一因となった。', debate:'この敗北がなければインド亜大陸の統一的な在地勢力(マラーター)による統治が実現し、イギリスの完全な植民地化を防げた可能性があるという「if」の議論が、インド近代史の分岐点として論じられる。'} },

  // ===================== イギリス植民地支配とインド独立運動 =====================
  { id:'east_india_company', name:'イギリス東インド会社', category:'nation', lat:22.57, lng:88.36, start:1600, end:1858, region:'インド全域(カルカッタを拠点に)',
    desc:{background:'ヨーロッパにおける香辛料・繊維製品需要の高まりを背景に、イギリス商人がアジア交易への参入を求めて設立した勅許会社であることが背景となった。', process:'当初は交易拠点(商館)の設置にとどまっていたが、プラッシーの戦い(1757年)での勝利を機にベンガル地方の徴税権を獲得し、以後インド亜大陸の広範囲を軍事力・外交手腕により実質的に支配下に置く「会社による統治」を確立したが、1857年のインド大反乱を機にイギリス本国政府が直接統治(インド帝国)に乗り出し会社は解散された。', significance:'一私企業が広大な亜大陸を事実上統治するという世界史上稀有な事例として、この「会社植民地主義」のあり方は近代帝国主義の特異な形態を示す重要な研究対象である。', debate:'私企業による統治という形態が、国家による直接統治よりも収奪的であったか、あるいは一定の現地慣行との共存を可能にしたかについて、経済史・植民地史上の評価が分かれる。'} },
  { id:'battle_of_plassey', name:'プラッシーの戦い', category:'war', lat:23.80, lng:88.26, start:1757, end:1757, region:'ベンガル地方(プラッシー)',
    desc:{background:'ベンガル太守とイギリス東インド会社との貿易・関税をめぐる対立が、この戦いの直接的な背景となった。', process:'ロバート=クライヴ率いる会社軍が、ベンガル太守軍内部の有力武将ミール=ジャアファルを買収して寝返らせるという謀略を用い、数的に劣勢ながら勝利を収めた。', significance:'この勝利により会社はベンガル地方の徴税権を実質的に掌握し、以後インド亜大陸における本格的な領土的支配拡大の出発点となった、イギリスのインド支配史上最も重要な戦いである。', debate:'この勝利が正面からの軍事的優位によるものではなく買収・謀略によるものであったことは、イギリスのインド支配の起源における「公正さ」の欠如を象徴する事例としてしばしば批判的に言及される。'} },
  { id:'battle_of_buxar', name:'ブクサールの戦い', category:'war', lat:25.57, lng:83.98, start:1764, end:1764, region:'ビハール地方(ブクサール)',
    desc:{background:'プラッシーの戦い後の会社の勢力拡大に対し、ムガル皇帝・ベンガル太守・アワド太守の連合勢力がこれに対抗しようとしたことが背景となった。', process:'会社軍がこの三者連合軍を打ち破り、この勝利によりムガル皇帝から正式にベンガル・ビハール・オリッサの徴税権(ディーワーニー)を認めさせた。', significance:'この勝利によって会社の支配は名目上もムガル皇帝の権威によって正当化される形となり、以後の東インド会社によるインド統治の法的基盤を確立する画期的な戦いとなった。', debate:'この勝利によって会社が獲得した徴税権が、その後のベンガル大飢饉(1770年)における会社の収奪的な徴税政策とどう関連していたかが、植民地統治の経済的帰結として論じられる。'} },
  { id:'indian_rebellion_1857', name:'インド大反乱(セポイの反乱)', category:'revolution', lat:28.98, lng:77.71, start:1857, end:1858, region:'北インド一帯',
    desc:{background:'東インド会社軍のインド人傭兵(セポイ)への新型銃の薬包(牛・豚の脂が塗布されているとの噂)への宗教的反発が、この大反乱の直接的な発端となった。', process:'デリー・ラクナウなど北インド各地で反乱が広がり一時は名目的にムガル皇帝を擁立する動きも見せたが、統一的な指導体制の欠如もあり会社軍・イギリス本国軍により1年余りで鎮圧された。', significance:'この反乱を機にイギリス本国政府は東インド会社を解散させインドを直接統治する「インド帝国」体制に移行し、名目上存続していたムガル帝国も完全に廃止された。', debate:'この反乱を「単なる傭兵の反乱(セポイの乱)」とみるイギリス側の伝統的な呼称に対し、インド側では「第一次インド独立戦争」として広範な民族的抵抗運動と再評価する見方が対立し続けている。'} },
  { id:'british_raj', name:'イギリス領インド帝国', category:'nation', lat:28.61, lng:77.21, start:1858, end:1947, region:'インド亜大陸全域',
    relatedIds:['indian_national_congress','partition_of_bengal_1905','gandhi','jinnah','salt_march','quit_india_movement','indian_independence_partition'],
    desc:{background:'1857年の大反乱を機に東インド会社による統治の限界が露呈し、イギリス本国政府による直接統治への転換が図られたことが背景となった。', process:'ヴィクトリア女王を「インド皇帝」とする直接統治体制のもと鉄道・電信網の整備や近代教育制度を導入する一方、飢饉への対応の遅れや経済的収奪(綿花・アヘンなどの一次産品輸出への従属構造)により多くの犠牲者を出し、20世紀にはインド国民会議・ムスリム連盟を中心とする独立運動が高まった。', significance:'近代インフラの整備は独立後のインドの経済的基盤の一部となったが、この統治下での度重なる大飢饉(推定数千万人規模の犠牲)は植民地統治の収奪的性格の象徴として今日まで厳しく問われている。', debate:'イギリスの統治が近代化に貢献したとする見方(鉄道・教育制度)と、収奪的な経済構造・飢饉対応の不作為による甚大な人的犠牲を重視する見方との間で、植民地統治の功罪評価が根本的に対立している。'} },
  { id:'indian_national_congress', name:'インド国民会議の結成', category:'event', lat:19.08, lng:72.88, start:1885, end:1947, region:'インド全域(ボンベイで結成)',
    desc:{background:'イギリス統治下で近代教育を受けたインド人エリート層が、統治への参加拡大や不公正な政策への異議申し立ての場を求めたことが結成の背景となった。', process:'当初は穏健な請願運動として出発したが、ベンガル分割(1905年)への反発を機に自治要求がより急進化し、ガンディーの指導下で非暴力・非協力運動(サティヤーグラハ)を軸とする大衆運動組織へと発展した。', significance:'インド独立運動の中心的な政治組織として、独立後も長くインドの支配的政党であり続け、その活動はアジア・アフリカの他の反植民地運動にも大きな影響を与えた。', debate:'この組織が当初主にヒンドゥー教徒エリート層を中心としていたことが、後のムスリム連盟の分離主義的傾向とインド分割(パーティション)を招く一因となったかどうかが論じられる。'} },
  { id:'partition_of_bengal_1905', name:'ベンガル分割令', category:'event', lat:23.81, lng:90.41, start:1905, end:1911, region:'ベンガル地方',
    desc:{background:'ベンガル州の広大な人口・行政負担を口実に、イギリス総督カーゾンがヒンドゥー教徒とムスリムの居住地域を分割する統治改編を進めたことが背景となった。', process:'この分割は「分割統治」の意図(民族運動の分断)が透けて見えるとしてベンガルのヒンドゥー教徒を中心に激しい反発(スワデーシー運動=国産品愛用運動)を招き、大規模な抗議運動の末に1911年に分割は撤回された。', significance:'この抗議運動の成功はインド独立運動における大衆動員の有効性を実証する重要な先例となったが、同時にこの分割によりムスリムを中心とする独自の政治的結集(ムスリム連盟結成)も促され、後の宗教別分離の萌芽ともなった。', debate:'イギリスの意図を「行政効率化」の名目とみるか「分割統治による民族運動分断」の意図的策略とみるかで、この政策の評価が分かれる。'} },
  { id:'gandhi', name:'ガンディー(マハトマ=ガンディー)', category:'person', lat:23.06, lng:72.58, start:1869, end:1948, region:'インド(アフマダーバードを拠点に)',
    desc:{background:'南アフリカでの人種差別体験を通じて非暴力抵抗(サティヤーグラハ)の思想と実践手法を確立したことが、帰国後のインド独立運動指導の背景となった。', process:'塩税に対する抗議行動である「塩の行進」など数々の非暴力・非協力運動を組織してインド国民会議を大衆運動組織へと変貌させ、第二次世界大戦中の「クイット・インディア運動」でも指導的役割を果たしたが、独立直後にヒンドゥー・ムスリム融和を訴えていたことへの反発から急進的ヒンドゥー主義者により暗殺された。', significance:'非暴力抵抗という思想・戦術は世界中の公民権運動・反植民地運動(キング牧師など)に大きな影響を与え、「マハトマ(偉大なる魂)」として世界的に尊敬される20世紀最も影響力の大きい思想家・運動家の一人となった。', debate:'非暴力抵抗が独立達成の決定的要因であったとする見方に対し、第二次世界大戦によるイギリスの国力消耗という国際情勢の変化もまた同等に重要であったとする見方があり、独立達成の主要因についての評価が分かれる。'} },
  { id:'salt_march', name:'塩の行進(ダンディー行進)', category:'event', lat:21.05, lng:72.81, start:1930, end:1930, region:'グジャラート地方(アフマダーバード〜ダンディー)',
    desc:{background:'イギリス植民地政府による塩の専売制度と課税が、貧困層を含む全インド国民に等しく影響する不公正な政策として広く認識されていたことが背景となった。', process:'ガンディーが数十人の同志と共に約380キロメートルを24日間かけて徒歩で行進し、海岸で自ら塩を製造するという象徴的な法律違反行為を行い、これが全国的な市民的不服従運動へと波及した。', significance:'この運動はメディア(国際的な報道)を通じてイギリス統治の不当性を世界に印象づけ、非暴力・非協力運動の有効性を実証する象徴的な出来事として、ガンディーの指導力を国際的に確立した。', debate:'この運動の直接的な政治的成果(塩税制度自体は短期的には変わらなかった)と、その象徴的・宣伝的効果(国際世論への訴求力)のどちらをより重視して評価すべきかが論じられる。'} },
  { id:'jinnah', name:'ジンナー(ムハンマド=アリー=ジンナー)', category:'person', parentId:'pakistan_republic', lat:24.86, lng:67.01, start:1876, end:1948, region:'全インド=ムスリム連盟→パキスタン',
    desc:{background:'当初はインド国民会議にも所属しヒンドゥー・ムスリム融和を志向していたが、会議派の運動戦術(ガンディーの宗教的色彩を帯びた大衆動員)との路線対立から次第に距離を置くようになったことが、彼の政治的立場変化の背景となった。', process:'ムスリム連盟の指導者として当初は自治拡大の枠内での協調を模索したが、次第にヒンドゥー教徒主体の統一インドではムスリムの権利が保障されないとの危機感を強め、独自のムスリム国家(パキスタン)建国を要求する「二民族論」を掲げるに至った。', significance:'パキスタンの建国の父として、彼の主導した分離独立要求は最終的にインド・パキスタン分割という現実を生み出し、南アジアの地政学的構造を根本的に規定する結果となった。', debate:'彼の分離独立要求が当初から独立国家建設を意図したものか、統一インド内でのムスリムの自治権拡大を求める交渉戦術であったのが後に後戻りできなくなったのかについて、歴史家の間で解釈が分かれている。'} },
  { id:'quit_india_movement', name:'クイット=インディア運動(インドを立ち去れ運動)', category:'revolution', lat:19.08, lng:72.88, start:1942, end:1942, region:'インド全域',
    desc:{background:'第二次世界大戦においてインドの参戦がインド人自身の同意なしに決定されたことへの反発と、イギリスの戦時中の国力消耗という好機認識が、この運動の背景となった。', process:'ガンディーとインド国民会議が「イギリスは直ちにインドを立ち去れ」と要求する大規模な市民的不服従運動を開始したが、イギリス植民地政府は指導部を一斉に逮捕し武力で徹底的に弾圧した。', significance:'この運動自体は短期的には鎮圧されたが、戦後のイギリスの国力衰退と国際世論の変化とも相まって、独立への機運を決定的に不可逆なものとした。', debate:'この運動の弾圧の過酷さ(投獄・武力鎮圧)が、戦後のイギリスにおける「もはや統治コストに見合わない」という判断にどこまで直接的に影響したかが論じられる。'} },
  { id:'indian_independence_partition', name:'インド独立と印パ分離独立', category:'event', lat:28.61, lng:77.21, start:1947, end:1947, region:'インド亜大陸全域',
    desc:{background:'ムスリム連盟による分離国家(パキスタン)建国要求と、ヒンドゥー・ムスリム両教徒間の宗教的緊張の高まりが、この分割という選択の背景となった。', process:'イギリスの急速な撤退方針(モウントバッテン総督による前倒しされた独立日程)のもと、宗教別の境界線画定が拙速に進められ、独立と同時に大規模な住民移動(ヒンドゥー教徒・シク教徒はインドへ、ムスリムはパキスタンへ)が発生し、この過程で推定100万人規模の虐殺と1500万人規模の難民が生じた。', significance:'20世紀最大級の人口移動と流血を伴ったこの分割は、以後のインド・パキスタン間の複数回の戦争とカシミール紛争という長期の地域紛争の直接的起源となった。', debate:'この分割の悲劇的結果の責任を、拙速な境界画定を急いだイギリスの撤退政策に求めるか、ヒンドゥー・ムスリム両指導者間の政治的妥協の失敗に求めるかで、この分割の歴史的責任をめぐる評価が分かれている。'} },
  { id:'nehru', name:'ネルー(ジャワハルラール=ネルー)', category:'person', parentId:'india_republic', lat:28.61, lng:77.21, start:1889, end:1964, region:'インド共和国',
    desc:{background:'インド国民会議の中でガンディーの後継者として広範な支持を集めていたことが、独立後の初代首相就任の背景となった。', process:'世俗主義・非同盟外交・計画経済(混合経済モデル)を国是に掲げ、多民族・多宗教国家インドの民主的統合を主導し、非同盟諸国会議の中心的指導者としても国際的な存在感を高めたが、中印国境紛争(1962年)での敗北は威信に打撃を与えた。', significance:'世界最大の民主主義国家としてのインドの基本的な国家理念(世俗主義・民主政・非同盟)を確立した「近代インドの建築家」として、その理念は今日まで(近年の変化はありつつも)インドの国是の基盤であり続けている。', debate:'彼の掲げた社会主義的計画経済路線が、インドの経済成長を長期にわたり遅らせた要因であったかどうかについて、1991年の経済自由化以降の視点から批判的な再評価が進んでいる。'} },

  // ===================== 現代の印パ関係とバングラデシュ =====================
  { id:'india_republic', name:'インド共和国', category:'nation', lat:28.61, lng:77.21, start:1947, end:2026, region:'インド',
    relatedIds:['nehru','indira_gandhi','india_pakistan_war_1947','india_pakistan_war_1965','bangladesh_liberation_war','india_nuclear_tests','kargil_war'],
    desc:{background:'独立とインド・パキスタン分割という激動を経て、多民族・多宗教・多言語からなる世界最大の民主主義国家の建設が求められたことが背景となった。', process:'1950年に共和国憲法を施行し世俗主義・議会制民主主義・連邦制を国是として採用し、社会主義的な計画経済から1991年の経済自由化を経て高度経済成長路線に転換、核保有国としても国際的地位を確立し、近年はヒンドゥー・ナショナリズムを掲げるBJPが政権を担っている。', significance:'世界最大の人口を擁する民主主義国家として、その多様性を包摂しながら民主的な政権交代を維持し続けている点で、比較政治学上「多様性における統一」の重要な事例と評価される。', debate:'近年のヒンドゥー・ナショナリズムの台頭(BJP政権下での世俗主義原則の後退傾向)が、建国以来の国是(世俗主義)をどこまで変容させつつあるかが、現在進行形の重要な政治的論点となっている。'} },
  { id:'pakistan_republic', name:'パキスタン', category:'nation', lat:33.68, lng:73.05, start:1947, end:2026, region:'パキスタン',
    relatedIds:['jinnah','india_pakistan_war_1947','india_pakistan_war_1965','bangladesh_liberation_war'],
    desc:{background:'ムスリム連盟によるムスリムのための独立国家建設要求が、インド分割という形で実現したことが建国の背景となった。', process:'建国当初から東西に地理的に分断された国土(東パキスタン=現バングラデシュ)という構造的課題を抱え、たびたびの軍事クーデタによる文民統治の中断を経験し、1971年には東西の対立が激化しバングラデシュ独立戦争により東パキスタンが分離独立した。', significance:'「イスラームのための国家」という建国理念のもと核保有国としての地位も確立したが、軍部の政治的影響力の強さと文民統治の不安定さが今日まで続く同国政治の基本的な特徴となっている。', debate:'建国理念(イスラーム国家)と実際の統治(軍部主導の世俗的統治と宗教勢力の緊張)との間の一貫した緊張関係が、この国の政治的不安定性の根本的要因としてどう評価されるべきかが論じられる。'} },
  { id:'india_pakistan_war_1947', name:'第1次印パ戦争(第1次カシミール戦争)', category:'war', lat:34.08, lng:74.80, start:1947, end:1948, region:'カシミール地方',
    desc:{background:'藩王国カシミールの帰属をめぐり、ヒンドゥー教徒の藩王とムスリムが多数を占める住民との間で意見の相違があったことが、この戦争の直接的な背景となった。', process:'パキスタン側の非正規部族民兵の侵入を受けたカシミール藩王がインドへの帰属を決定し、これに応じてインド軍が介入したことで両国間の全面的な軍事衝突に発展し、国連の仲介による停戦ラインが暫定的な実効支配線として設定された。', significance:'この戦争により生じたカシミール紛争は未解決のまま今日まで両国間の最大の懸案として残り続け、以後複数回の印パ戦争の火種となっている。', debate:'カシミール藩王の帰属決定の正統性(住民投票を経ない決定)をめぐる法的・政治的論争は、この紛争の国際法上の解決を困難にしている根本的な要因である。'} },
  { id:'india_pakistan_war_1965', name:'第2次印パ戦争', category:'war', lat:32.00, lng:74.50, start:1965, end:1965, region:'カシミール・パンジャーブ地方国境',
    desc:{background:'未解決のカシミール問題をめぐる緊張の継続と、パキスタンによる同地域への軍事的浸透工作(ジブラルタル作戦)が、この戦争の直接的な引き金となった。', process:'カシミールをめぐり本格的な軍事衝突に発展したが決定的な戦況の変化はなく、ソ連の仲介によるタシケント宣言により停戦・現状復帰が合意された。', significance:'この戦争は冷戦下の大国(米ソ)がそれぞれ介入を控えつつソ連が仲介役を担うという、南アジアにおける新たな国際関係の力学を示す事例となった。', debate:'決定的な軍事的決着がつかないまま終結したこの戦争が、根本問題(カシミール帰属)を全く解決せず、むしろ両国間の対立構造を固定化させただけではないかという評価がある。'} },
  { id:'bangladesh_liberation_war', name:'バングラデシュ独立戦争(第3次印パ戦争)', category:'war', lat:23.81, lng:90.41, start:1971, end:1971, region:'東パキスタン(現バングラデシュ)',
    desc:{background:'地理的に分断された東西パキスタンの間の経済的格差と、東パキスタン(ベンガル人)への西パキスタン主導の政治・軍事エリートによる抑圧的統治への不満が、独立運動の背景となった。', process:'東パキスタンでの選挙結果を西パキスタン側が無視したことへの抗議運動に対しパキスタン軍が凄惨な弾圧(推定数十万人規模の虐殺とされる)を行い、これを受けてインドが軍事介入し東パキスタン独立勢力を支援、パキスタン軍の降伏によりバングラデシュの独立が達成された。', significance:'この戦争は単一の宗教(イスラーム)を国是とする建国理念だけでは民族・言語・地域の相違を超えた国家統合が困難であることを示す事例として、国民国家建設論において重要な教訓を提供している。', debate:'パキスタン軍による虐殺行為(ジェノサイドと認定すべきかの議論を含む)への国際的な対応の遅れ・不十分さは、大国の地政学的思惑(冷戦下でのアメリカのパキスタン支持)が人道的介入をどこまで妨げるかという問題を提起する。'} },
  { id:'bangladesh_republic', name:'バングラデシュ', category:'nation', lat:23.81, lng:90.41, start:1971, end:2026, region:'バングラデシュ',
    desc:{background:'バングラデシュ独立戦争でのパキスタンからの分離独立達成が、建国の直接的背景となった。', process:'独立当初は深刻な貧困・自然災害・政情不安(度重なるクーデタ)に見舞われたが、近年は縫製産業を中心とする輸出主導型の経済成長や、マイクロファイナンス(グラミン銀行)に代表される貧困削減の取り組みで国際的に注目されている。', significance:'「開発の実験室」とも呼ばれ、世界最貧国の一つからの脱却を目指す発展途上国の経済発展モデルとして、国際開発研究上重要な事例となっている。', debate:'縫製産業依存の経済成長モデルが、労働環境問題(ラナ・プラザ崩落事故など)を伴いながらも持続可能な発展をもたらし得るかについて、開発経済学上の議論が続いている。'} },
  { id:'indira_gandhi', name:'インディラ=ガンディー', category:'person', parentId:'india_republic', lat:28.61, lng:77.21, start:1917, end:1984, region:'インド共和国',
    desc:{background:'ネルーの娘という血統的背景と、党内の権力闘争を勝ち抜いた政治的手腕が、首相就任の背景となった。', process:'バングラデシュ独立戦争でのパキスタンへの勝利や「緑の革命」による食糧自給達成など実績を残す一方、1975年には反対派弾圧を伴う非常事態宣言を発令し民主的統治を一時中断、シク教徒の分離独立運動拠点(黄金寺院)への軍事作戦の報復として1984年にシク教徒の護衛官により暗殺された。', significance:'「インドの鉄の女」として強力な指導力を発揮したが、非常事態宣言という権威主義的統治への傾斜は、世界最大の民主主義国家における民主制の脆弱性を示す重要な事例として記憶されている。', debate:'非常事態宣言を、国内の政治的混乱への必要な秩序回復措置とみるか、権力保持のための民主制の一時的破壊とみるかで評価が分かれる。'} },
  { id:'india_nuclear_tests', name:'インドの核実験', category:'event', lat:26.91, lng:71.92, start:1974, end:1998, region:'ラージャスターン州(ポカラン)',
    desc:{background:'中国の核保有(1964年)とパキスタンとの度重なる軍事対立が、インドによる核開発の安全保障上の動機となった。', process:'1974年に「平和的核爆発」と称する最初の核実験を行い、1998年には複数回の核実験を実施して正式に核保有国であることを宣言し、これに対抗してパキスタンも同年に核実験を実施した。', significance:'南アジアにおける核保有国同士の対峙という新たな安全保障環境を生み出し、この地域における核抑止と紛争の危険性という国際政治学上の重要な研究対象となっている。', debate:'核不拡散条約(NPT)体制の外側での事実上の核保有国化を国際社会がどう扱うべきか(事実上の黙認)は、核不拡散体制の実効性を問う重要な事例として論じられる。'} },
  { id:'kargil_war', name:'カルギル紛争', category:'war', lat:34.55, lng:76.13, start:1999, end:1999, region:'カシミール地方(カルギル)',
    desc:{background:'カシミール実効支配線を越えたパキスタン軍(正規軍と民兵を偽装した部隊)の越境浸透が、この紛争の直接的契機となった。', process:'インド軍が高地の要衝を奪還すべく激しい山岳戦を展開し、国際世論(特にアメリカ)の圧力もありパキスタンは部隊撤退に応じ、インドが実効支配線を回復する形で終結した。', significance:'両国が核保有国となって以降初めての本格的な軍事衝突として、核保有国間でも限定的な通常戦争が発生し得ることを示す「核の安定・不安定パラドックス」の重要な実証事例となった。', debate:'核保有国同士の紛争がエスカレーションをどこまで抑制する効果を持つか(あるいは逆に限定戦争を誘発しやすくするか)についての国際安全保障論上の議論において、この戦争は頻繁に参照される。'} },

  // ===================== アフガニスタン史 =====================
  { id:'durrani_empire', name:'ドゥッラーニー朝(アフガン王国)', category:'nation', lat:31.61, lng:65.71, start:1747, end:1823, region:'アフガニスタン',
    relatedIds:['ahmad_shah_durrani'],
    desc:{background:'ペルシアのナーディル=シャー暗殺後の権力空白の中、その部将であったアフマド=シャーがアフガン諸部族の支持を得たことが建国の背景となった。', process:'パシュトゥーン人諸部族を統合してアフガニスタン最初の統一国家を樹立し、インド北西部への遠征(第三次パーニーパットの戦いでのマラーター同盟撃破)を行うなど最盛期には広大な版図を築いたが、彼の死後は部族間対立により急速に分裂・弱体化した。', significance:'現代アフガニスタンの直接の起源となる国家であり、パシュトゥーン人を中心とする多部族国家という統治構造上の課題は今日のアフガニスタンにも通じる歴史的な特徴を成している。', debate:'部族連合的な統治構造がこの国家の急速な拡大を可能にした一方、同じ構造が持続的な中央集権化を妨げたのではないかという、アフガニスタン国家形成史における構造的問題が論じられる。'} },
  { id:'ahmad_shah_durrani', name:'アフマド=シャー=ドゥッラーニー', category:'person', parentId:'durrani_empire', lat:31.61, lng:65.71, start:1722, end:1772, region:'ドゥッラーニー朝',
    desc:{background:'ペルシアのナーディル=シャーに仕える武将としての軍事的経験が、その暗殺後にアフガン諸部族を統合する自立の背景となった。', process:'カンダハールを都にドゥッラーニー朝を建国し、インド方面への複数回の遠征(パーニーパットの戦いでのマラーター同盟撃破を含む)により広大な版図を一代で築き上げた。', significance:'「アフガニスタン建国の父」として今日でも国民的英雄とされ、彼が築いた版図(現在のアフガニスタン・パキスタン北西部を含む)は現代アフガニスタンの領域的基盤の直接の起源となっている。', debate:'彼の死後の急速な帝国分裂は、部族連合的な統治構造がカリスマ的指導者の個人的権威に過度に依存していたことを示しており、アフガニスタン国家建設における構造的脆弱性の先例として論じられる。'} },
  { id:'first_anglo_afghan_war', name:'第1次アフガン戦争', category:'war', lat:34.53, lng:69.17, start:1839, end:1842, region:'アフガニスタン',
    desc:{background:'ロシアの中央アジアへの南下政策(「グレート・ゲーム」)を警戒したイギリスが、アフガニスタンを親英政権のもとに置こうとしたことが開戦の背景となった。', process:'イギリス軍は一時カブールを占領し親英派の王を擁立したが、現地住民の激しい抵抗により撤退を強いられ、退却する軍勢はほぼ全滅するという壊滅的な敗北を喫した。', significance:'「帝国の墓場」としてのアフガニスタンという後世繰り返し言及されるイメージの原点となり、大国による軍事介入の困難さを象徴する初期の代表的事例となった。', debate:'この撤退時の壊滅がイギリス軍の戦術的失策によるものか、アフガン地形・民衆の組織的抵抗という構造的要因によるものかで、軍事史上の評価が分かれる。'} },
  { id:'second_anglo_afghan_war', name:'第2次アフガン戦争', category:'war', lat:34.53, lng:69.17, start:1878, end:1880, region:'アフガニスタン',
    desc:{background:'ロシアの影響力拡大への警戒が再燃し、アフガニスタンの外交を制御下に置く必要性をイギリスが再認識したことが開戦の背景となった。', process:'イギリス軍が再度侵攻し軍事的には勝利を収めたが、直接統治の困難さを踏まえ、外交権をイギリスが掌握し内政には介入しない「保護国」的な統治形態(ガンダマク条約)で決着した。', significance:'この結果、アフガニスタンは完全な植民地化を免れつつも外交的自律性を制限される緩衝国としての地位を確立し、この構造は英露の勢力均衡(グレート・ゲーム)における重要な地政学的解決策となった。', debate:'この「保護国化」を、完全な植民地化に比べ相対的にアフガニスタンの自律性を尊重した現実的解決策とみるか、実質的な主権制限にすぎなかったとみるかで評価が分かれる。'} },
  { id:'third_anglo_afghan_war', name:'第3次アフガン戦争', category:'war', lat:34.53, lng:69.17, start:1919, end:1919, region:'アフガニスタン',
    desc:{background:'第一次世界大戦後の国際情勢の変化とアフガニスタン国内の民族主義的機運の高まりが、完全な独立回復を求める機運の背景となった。', process:'アフガニスタン側からの短期間の軍事行動を経て、イギリスは大戦後の疲弊もあり交渉に応じ、ラワルピンディー条約によりアフガニスタンの完全な外交的独立が認められた。', significance:'この勝利によりアフガニスタンは名実ともに完全な主権国家としての地位を回復し、この独立達成日(8月19日)は現在も同国の独立記念日として祝われている。', debate:'軍事的には限定的な衝突にとどまったこの戦争が、なぜ完全独立という大きな外交的成果につながったのか、第一次大戦後の国際情勢変化の影響がどこまで決定的であったかが論じられる。'} },
  { id:'soviet_afghan_war', name:'ソ連=アフガン戦争', category:'war', lat:34.53, lng:69.17, start:1979, end:1989, region:'アフガニスタン',
    desc:{background:'共産主義政権(人民民主党)の急進的な社会改革への農村部・イスラーム勢力の反発と内部の権力闘争激化が、ソ連による軍事介入の直接的契機となった。', process:'ソ連軍が侵攻して傀儡政権を支援したが、アメリカ・パキスタン・サウジアラビアなどの支援を受けたイスラーム系ゲリラ(ムジャヒディーン)の頑強な抵抗に苦しみ、10年に及ぶ消耗戦の末1989年に撤退した。', significance:'この戦争でのソ連の敗北は財政的・軍事的消耗を通じてソ連崩壊の一因ともなり、同時にこの戦争を通じて国際的ネットワークを築いたイスラーム過激派勢力(アルカイダの前身となる人脈)の形成にもつながった。', debate:'アメリカによるムジャヒディーンへの軍事支援(冷戦下の対ソ戦略)が、結果的に後の国際テロ組織台頭の土壌を作ったという「意図せざる帰結」は、冷戦期代理戦争の長期的リスクを考える上で重要な教訓とされる。'} },
  { id:'first_taliban_regime', name:'ターリバーン政権(第1次)', category:'event', lat:34.53, lng:69.17, start:1996, end:2001, region:'アフガニスタン',
    desc:{background:'ソ連撤退後のムジャヒディーン諸勢力間の内戦による社会の荒廃と無秩序状態が、厳格なイスラーム法解釈を掲げるタリバンの台頭を可能にする土壌となった。', process:'パキスタンの支援も受けつつ急速に勢力を拡大し首都カブールを制圧して国土の大半を支配下に置き、女性教育の禁止など極めて厳格なイスラーム法解釈に基づく統治を行いアルカイダの活動拠点提供も行ったが、9・11同時多発テロ後のアメリカ主導の軍事作戦により2001年に政権は崩壊した。', significance:'国際的にほとんど承認されない孤立した統治でありながら国内の治安回復(一定の秩序確立)には一定の実績を上げたとされ、この二面性は権威主義的統治の評価における複雑さを示す事例である。', debate:'内戦の混乱に比して一定の治安回復をもたらした側面と、女性の権利をはじめとする深刻な人権侵害のどちらを重視して評価すべきかという問題が、この政権の評価をめぐり継続的に論じられている。'} },
  { id:'taliban_return_2021', name:'ターリバーンの政権奪還', category:'event', lat:34.53, lng:69.17, start:2021, end:2026, region:'アフガニスタン',
    desc:{background:'20年に及ぶアメリカの駐留とアフガニスタン政府軍への軍事支援にもかかわらず、汚職と統治の正統性の弱さが政府軍・行政の実効的な自立を妨げていたことが背景となった。', process:'アメリカ軍の完全撤退決定を受け、アフガニスタン政府軍がほとんど抵抗することなく各地で崩壊し、タリバンは驚くべき速さで首都カブールを含む全土を再制圧した。', significance:'20年間・2兆ドル以上を投じたとされる「国家建設(ネーション=ビルディング)」の試みが実質的な失敗に終わったことを象徴する事例として、大国による対外軍事介入の限界を厳しく問う結果となった。', debate:'政府軍の急速な崩壊の要因を、汚職・士気の低さという内的要因に求めるか、性急な米軍撤退という外的要因に求めるかで、この「国家建設」失敗の責任論が国際的に議論されている。'} },

  // ===================== スリランカ史 =====================
  { id:'anuradhapura_kingdom', name:'アヌラーダプラ王国', category:'nation', lat:8.31, lng:80.41, start:-377, end:1017, region:'スリランカ',
    relatedIds:['dutugemunu'],
    desc:{background:'スリランカ島に北インドから移住したとされるシンハラ人が、アヌラーダプラを中心に定住したことが建国の背景となった。', process:'インドから伝わった仏教を早期に国教として受容し(伝説では阿育王の子が仏教をもたらしたとされる)、大規模な灌漑用貯水池(タンク)の建設による稲作農業を発展させたが、南インドの諸王朝(チョーラ朝など)の度重なる侵攻を受け11世紀に都はポロンナルワへ移された。', significance:'スリランカにおける仏教国家としてのアイデンティティの原点であり、上座部仏教の経典(パーリ語聖典)の書写・保存にも重要な役割を果たし、この仏教的国家理念は今日のスリランカのシンハラ仏教徒中心の国家観にも影響を残している。', debate:'南インドからの度重なる侵攻という圧力が、この王国の仏教的アイデンティティをかえって強化したのかどうか、対外的脅威と宗教的結束の関係が論じられる。'} },
  { id:'dutugemunu', name:'ドゥッタガーマニ', category:'person', parentId:'anuradhapura_kingdom', lat:8.31, lng:80.41, start:-161, end:-137, region:'アヌラーダプラ王国',
    desc:{background:'南インド系のタミル人王エーラーラによるアヌラーダプラ支配という状況が、シンハラ人による王権回復運動の背景となった。', process:'エーラーラ王を打倒してシンハラ人による統治を回復し、この過程を仏教年代記『マハーワンサ』は仏教護持のための正義の戦いとして記述している。', significance:'シンハラ仏教ナショナリズムにおける英雄的な統一者として理想化され、この物語は現代のスリランカ民族紛争(シンハラ人対タミル人)においてもしばしば政治的に参照される歴史的記憶となっている。', debate:'『マハーワンサ』の記述がどこまで史実を反映し、どこまで後世の宗教的・民族的正統化のための脚色であるかは、この年代記を史料として用いる際の重要な史料批判上の課題である。'} },
  { id:'polonnaruwa_kingdom', name:'ポロンナルワ王国', category:'nation', lat:7.94, lng:81.00, start:1055, end:1232, region:'スリランカ',
    desc:{background:'アヌラーダプラが南インド勢力の度重なる侵攻にさらされ防衛上の弱点を露呈したことが、より内陸に位置するポロンナルワへの遷都の背景となった。', process:'パラークラマバーフ1世の代に大規模な灌漑事業(パラークラマ・サムドラ貯水池)と仏教の再興・統合を進めて最盛期を築いたが、その死後は再び南インド勢力の圧力と内紛により衰退し、13世紀以降は都はさらに南西部へ移された。', significance:'「一滴の水も無駄に海に流してはならない」という灌漑理念に象徴される高度な水利技術は、スリランカの伝統的な農業文明の到達点として評価される。', debate:'この時代の繁栄が持続的な制度に基づくものか、パラークラマバーフ1世個人の統治能力に強く依存していたかについて、その死後の急速な衰退との関連で議論される。'} },
  { id:'colonial_ceylon', name:'植民地時代のセイロン(ポルトガル・オランダ・イギリス)', category:'event', lat:6.93, lng:79.85, start:1505, end:1948, region:'スリランカ(セイロン)',
    desc:{background:'ポルトガル・オランダによる沿岸部支配を経て、ナポレオン戦争期にイギリスがオランダから沿岸部を奪取し、さらに内陸のキャンディ王国も征服したことが背景となった。', process:'紅茶・ゴム・ココナッツなどプランテーション農業を主要産業として発展させ、労働力として南インドからタミル人が大量に移入されたが、この人口移動が後のシンハラ人・タミル人間の民族対立の重要な歴史的要因となった。', significance:'この時代に移入されたタミル人労働者(「インド・タミル人」)は、独立後のスリランカにおいて既存の「スリランカ・タミル人」とも異なる複雑な民族的立場に置かれ、市民権をめぐる長期的な政治問題を生んだ。', debate:'プランテーション労働力としての計画的な移民導入政策が、独立後の深刻な民族紛争の歴史的起源としてどこまで直接的な責任を負うべきかが論じられる。'} },
  { id:'sri_lanka_independence', name:'セイロン(スリランカ)独立', category:'event', lat:6.93, lng:79.85, start:1948, end:1948, region:'スリランカ',
    desc:{background:'インドの独立運動の高まりとイギリスの脱植民地化政策の進展が、スリランカ(セイロン)独立達成の国際的背景となった。', process:'インドやアフリカ諸国と異なり比較的平和的な交渉を通じて独立を達成し、当初はイギリス連邦内の自治領としての地位からスタートしたが、独立後まもなくシンハラ語を唯一の公用語とする政策(シンハラ・オンリー法)がタミル人の反発を招いた。', significance:'この言語政策をめぐる対立は、以後数十年に及ぶスリランカ内戦(シンハラ人対タミル人)という深刻な民族紛争の重要な歴史的起点となった。', debate:'比較的平和的な独立達成にもかかわらず、その後深刻な民族紛争に陥った要因を、植民地期の人口移動政策(構造的要因)に求めるか、独立後の政治指導者の言語政策判断(政策的要因)に求めるかで議論がある。'} },
  { id:'sri_lankan_civil_war', name:'スリランカ内戦', category:'war', lat:9.66, lng:80.02, start:1983, end:2009, region:'スリランカ北部・東部',
    desc:{background:'シンハラ人優遇の言語・教育政策への少数派タミル人の疎外感の蓄積が、タミル人分離独立運動の背景となった。', process:'タミル・イーラム解放のトラ(LTTE)が独立国家建設を掲げて武装闘争を展開し、自爆テロという戦術を広く用いたことでも知られる26年に及ぶ内戦となったが、2009年に政府軍がLTTE最高指導者を殺害し軍事的に完全制圧した。', significance:'内戦終結時の政府軍による攻勢では多数の民間人犠牲者が出たとされ、国連による戦争犯罪調査要求など国際的な人権問題として今も対応が問われ続けている。', debate:'内戦終結時の政府軍の作戦を「テロ組織の完全排除に必要な措置」とみるか「民間人を巻き込んだ深刻な人道法違反」とみるかで、国際的な評価が大きく分かれている。'} },

  // ===================== ネパール史 =====================
  { id:'shah_dynasty_nepal', name:'シャハ王朝(ネパール王国)', category:'nation', lat:27.70, lng:85.32, start:1768, end:2008, region:'ネパール',
    relatedIds:['prithvi_narayan_shah','rana_regime'],
    desc:{background:'ネパール中西部の小国ゴルカの王プリトビ=ナラヤン=シャハが、カトマンズ盆地の統一を志向したことが建国の背景となった。', process:'カトマンズ盆地の複数の小王国を征服して統一しネパール王国を樹立し、以後18世紀後半にはイギリス東インド会社との戦争(グルカ戦争)を経て国境を確定させたが、19世紀半ばには実権が世襲宰相(ラナ家)に奪われ王は名目的存在に転じ、20世紀後半には民主化運動と共産主義勢力(毛沢東主義派)との内戦を経て2008年に王政は完全廃止された。', significance:'南アジアで唯一ヨーロッパ列強の直接植民地支配を受けなかった王国として独自の歴史的経路をたどったが、この独立維持の代償として国内の近代化は大きく遅れた。', debate:'植民地化を免れたことを「独立維持の成功」と評価すべきか、それによる近代化の遅れという代償を重視すべきかで、この国の歴史的評価が分かれる。'} },
  { id:'prithvi_narayan_shah', name:'プリトビ=ナラヤン=シャハ', category:'person', parentId:'shah_dynasty_nepal', lat:27.70, lng:85.32, start:1723, end:1775, region:'シャハ王朝',
    desc:{background:'小国ゴルカの王として、カトマンズ盆地の分立する小王国群を統一する野心を抱いたことが建国事業の背景となった。', process:'巧みな外交と軍事戦略によりカトマンズ盆地の主要な小王国を次々と征服し、現在のネパールの領域的基盤となる統一王国を樹立した。', significance:'「ネパール建国の父」として今日でも国民的に敬愛され、彼が確立した統一国家の枠組みは現在のネパールの国家的アイデンティティの直接の起源となっている。', debate:'彼が唱えたとされる「四つのカーストと三十六の民族(チャール・ジャート・オ・タティース・ヴァルナ)」という多民族統合理念が、実際にどこまで統治の実践に反映されていたかが論じられる。'} },
  { id:'rana_regime', name:'ラナ家による専制(ラナ体制)', category:'event', lat:27.70, lng:85.32, start:1846, end:1951, region:'ネパール',
    desc:{background:'宮廷内の権力闘争(コート・マサジャンド事件)を通じてジャンガ=バハドゥル=ラナが実権を掌握したことが、この百年以上に及ぶ支配の背景となった。', process:'国王を名目的存在に留めたまま世襲の宰相職を確立し、鎖国的な孤立政策により外部世界との交流をほぼ遮断する統治を続けたが、インド独立とそれに触発された国内の民主化運動の高まりにより1951年に王政復古(実権回復)というクーデタ的な政変で終焉を迎えた。', significance:'百年以上にわたる鎖国的統治はネパールの近代化を大きく遅らせる結果となり、20世紀半ばの「開国」時点で同国はアジアでも最も近代化が遅れた国の一つとなっていた。', debate:'この鎖国的統治が意図的な近代化の忌避によるものか、当時の地政学的状況(英領インドとチベット・清朝の間での緩衝国的地位の維持戦略)による必要な政策であったかで評価が分かれる。'} },
  { id:'nepal_civil_war', name:'ネパール内戦(人民戦争)', category:'war', lat:28.20, lng:83.99, start:1996, end:2006, region:'ネパール',
    desc:{background:'王政復古後も続く深刻な貧困と農村部の疎外感、既存の議会制民主主義への幻滅が、毛沢東主義を掲げる共産党勢力の武装蜂起の背景となった。', process:'ネパール共産党(毛沢東主義派)が農村部を拠点にゲリラ戦を展開し、王政・政府軍との間で約10年に及ぶ内戦が続いたが、2006年の和平合意により毛派は武装解除し合法政党として政治参加する道を選んだ。', significance:'この内戦を経て2008年には王政が完全に廃止され共和政へ移行し、かつての武装ゲリラ組織が選挙を通じて政権を担うに至るという、武装闘争から民主的政治参加への移行の一事例となった。', debate:'毛派の武装闘争から合法的政治参加への転換が、真の民主的統合を意味するのか、単なる権力獲得手段の変更にすぎないのかで評価が分かれる。'} },
  { id:'nepal_republic_2008', name:'ネパール連邦民主共和制への移行', category:'event', lat:27.70, lng:85.32, start:2008, end:2008, region:'ネパール',
    desc:{background:'10年に及ぶ内戦とそれに続く大規模な民主化要求運動(2006年の「人民運動」)が、王政廃止の直接的な背景となった。', process:'制憲議会選挙を経て240年続いたシャハ王朝による王政を正式に廃止し連邦民主共和国を樹立し、旧共産ゲリラ(毛派)も選挙を通じて政権を担う一員となったが、新憲法制定の遅延や政情の不安定さが続いている。', significance:'武装闘争を経験した勢力が最終的に選挙を通じた政権参加という形に着地した点で、内戦から民主的統合への移行の一つのモデルケースとして注目される。', debate:'王政廃止後も続く政治的不安定さ(頻繁な首相交代)が、共和政移行そのものの問題か、より根本的な民族・地域間の統合課題の反映かが論じられる。'} },

  // ===================== ブータン・モルディブ =====================
  { id:'bhutan_wangchuck', name:'ワンチュク王朝(ブータン王国)', category:'nation', lat:27.47, lng:89.64, start:1907, end:2026, region:'ブータン',
    desc:{background:'ブータン国内の複数の地方領主(ペンロプ)間の権力争いを勝ち抜いたウゲン=ワンチュクが、統一王権樹立を志向したことが建国の背景となった。', process:'イギリスとの良好な関係を維持しながら統一世襲王政を樹立し、以後の国王たちは国民総幸福量(GNH)という独自の開発理念を掲げ、外部世界との交流を慎重かつ段階的に開放する方針をとってきた。', significance:'経済成長至上主義とは異なる開発理念(GNH)を国是に掲げる稀有な事例として、国際的な開発論・幸福度研究において注目される独自の国家運営モデルを提示している。', debate:'GNHという理念を、伝統文化と環境保護を重視する先進的な開発モデルとして評価するか、実際には国内の少数民族(ネパール系住民)への同化政策・排除と併存する理念にすぎないと批判するかで評価が分かれる。'} },
  { id:'maldives_islamization', name:'モルディブのイスラーム化', category:'event', lat:4.18, lng:73.51, start:1153, end:1153, region:'モルディブ',
    desc:{background:'インド洋交易路の要衝に位置するモルディブ諸島に、アラブ商人らを通じてイスラームが伝わったことが、この宗教的転換の背景となった。', process:'12世紀に王がイスラームに改宗したとされ、以後仏教国からイスラーム国家へと国家的アイデンティティが根本的に転換し、現在まで続くイスラーム王政・共和政の宗教的基盤が確立された。', significance:'南アジア地域における数少ない完全なイスラーム国家として、他の南アジア諸国(ヒンドゥー教・仏教が優勢)とは一線を画す独自の宗教的アイデンティティを持つ国家となった。', debate:'改宗以前の仏教文化の痕跡(考古学的発見)が、この国の歴史叙述において公式にどこまで認知・保存されるべきかについて、宗教的アイデンティティと歴史的多様性の関係が論じられる。'} },

  // ===================== 文化史(思想・学問・宗教の広がり) =====================
  { id:'zoroaster', name:'ザラスシュトラ(ゾロアスター)', category:'person', lat:36.27, lng:59.61, start:-1000, end:-900, region:'古代イラン・中央アジア(生没年・出身地には諸説あり)',
    desc:{background:'古代イランの多神教的な自然崇拝と動物供犠を伴う伝統的祭祀への疑問が、彼の新たな宗教思想形成の背景となったとされる。', process:'善神アフラ=マズダーへの信仰と、自由意志に基づく善悪の選択という倫理的一神教的思想を説き、この教えは聖典『アヴェスター』にまとめられ、後のアケメネス朝・サーサーン朝ペルシアで国家的宗教として確立された。', significance:'最後の審判・天国と地獄・救世主の到来といった終末論的教義は、ユダヤ教・キリスト教・イスラームの終末論形成に影響を与えたとする説が有力であり、世界宗教史上の重要な思想的源流の一つと位置づけられる。', debate:'彼の実在した年代については紀元前1000年頃から前600年頃まで諸説あり、確定的な史料が乏しいため、その生涯の史実性そのものが古代宗教史研究における未解決の課題となっている。'} },
  { id:'al_khwarizmi', name:'フワーリズミー', category:'person', lat:33.34, lng:44.39, start:780, end:850, region:'アッバース朝(バグダード・知恵の館)',
    desc:{background:'アッバース朝カリフ、マームーンによる「知恵の館」での学術振興政策が、彼の数学・天文学研究の背景となった。', process:'インドから伝わった十進法・ゼロの概念を体系化し方程式の解法を論じた著作『代数学の書(アルジャブラ)』を著し、天文表の作成や地理学の著作も残した。', significance:'彼の名(アル=フワーリズミー)はラテン語化されて「アルゴリズム」の語源となり、その著作名(アルジャブラ)は「代数学(algebra)」の語源ともなるなど、数学史上決定的な影響を残した。', debate:'彼の業績がインド数学(特にゼロの概念)からの継承にどこまで依存しているか、彼自身の独創的貢献がどこにあったかについて、数学史上の評価が論じられる。'} },
  { id:'ibn_sina_avicenna', name:'イブン=シーナー(アヴィケンナ)', category:'person', lat:39.78, lng:64.42, start:980, end:1037, region:'サーマーン朝→各地(中央アジア・イラン)',
    desc:{background:'サーマーン朝の宮廷図書館へのアクセスを得た若き日の学習環境が、彼の百科全書的な学識形成の背景となった。', process:'医学書『医学典範(カーヌーン)』を著してギリシア・インド・イスラームの医学知識を体系化し、哲学ではアリストテレス思想とイスラーム神学を融合させる独自の存在論を展開した。', significance:'『医学典範』は以後500年近くにわたりヨーロッパの大学医学部でも標準的教科書として用いられ、イスラーム世界のみならず西欧医学史にも計り知れない影響を残した。', debate:'彼の哲学(特に「必然存在」概念)がイスラーム正統派神学(特にガザーリーによる批判)とどこまで整合的であったか、哲学と信仰の関係をめぐる論争が中世イスラーム思想史の重要なテーマとなっている。'} },
  { id:'ferdowsi', name:'フィルドゥシー', category:'person', lat:36.30, lng:59.60, start:940, end:1020, region:'サーマーン朝→ガズナ朝(イラン)',
    desc:{background:'イスラーム化が進む中でペルシア語・ペルシア文化の独自性が失われることへの危機感が、彼の壮大な叙事詩編纂の動機となったとされる。', process:'約30年の歳月をかけてイランの神話・伝説・歴史を韻文で綴る民族叙事詩『シャー・ナーメ(王書)』を完成させ、アラビア語の語彙をほぼ用いない純粋なペルシア語での作詩にこだわった。', significance:'この作品はペルシア語の文学的地位を確立し、イスラーム化後もペルシア人としての民族的・文化的アイデンティティを保持する上で決定的な役割を果たした、イラン文化史上最重要の文学作品である。', debate:'アラビア語彙を意図的に排除したこの言語的純粋主義が、当時すでに進んでいたイスラーム化・アラビア語の影響拡大への一種の文化的抵抗であったのかどうかが論じられる。'} },
  { id:'omar_khayyam', name:'ウマル=ハイヤーム', category:'person', lat:36.21, lng:58.49, start:1048, end:1131, region:'セルジューク朝(イラン)',
    desc:{background:'セルジューク朝の宮廷における学術奨励政策が、彼の数学・天文学研究の背景となった。', process:'3次方程式の幾何学的解法を含む代数学の業績を残し、当時最も精密とされた太陽暦(ジャラーリー暦)の作成にも携わる一方、四行詩集『ルバイヤート』で人生の無常と享楽を謳う詩人としても知られた。', significance:'19世紀にエドワード=フィッツジェラルドによる英訳『ルバイヤート』がヴィクトリア朝イギリスで大流行し、西欧世界にペルシア詩を広く知らしめる契機となった。', debate:'フィッツジェラルドの英訳が原詩にどこまで忠実か、それとも彼自身の創作的解釈が色濃く反映された「翻訳という名の創作」であるかについて、比較文学上の議論がある。'} },
  { id:'rumi', name:'ルーミー', category:'person', lat:37.87, lng:32.48, start:1207, end:1273, region:'ルーム=セルジューク朝(アナトリア・コンヤ)',

/* =========================================================================
   カテゴリ設定
   ========================================================================= */
const CATEGORY_CONFIG = {
  person:     { label:'人物',       color:'#c0554a' },
  nation:     { label:'国家',       color:'#3f7ea6' },
  dynasty:    { label:'王朝',       color:'#8259ac' },
  event:      { label:'事件・出来事', color:'#c99a4a' },
  war:        { label:'戦争・戦い',  color:'#8a3a3a' },
  revolution: { label:'革命',       color:'#3f8f74' },
  treaty:     { label:'条約',       color:'#7a6a52' },
};

/* =========================================================================
   年号の表示フォーマット
   ========================================================================= */
function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

/* =========================================================================
   地図の初期化
   ========================================================================= */
const map = L.map('map', {
  center:[27, 58],
  zoom:3,
  minZoom:2,
  maxZoom:12,
  worldCopyJump:true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19,
}).addTo(map);

const markerLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 11,
  iconCreateFunction: function(cluster){
    return L.divIcon({
      html: `<div class="cluster-badge">${cluster.getChildCount()}</div>`,
      className: 'cluster-marker-wrap',
      iconSize: L.point(32, 32),
    });
  },
}).addTo(map);
const markerById = {}; // id -> {marker, entry}

/* =========================================================================
   フィルタ状態
   ========================================================================= */
const activeCategories = new Set(Object.keys(CATEGORY_CONFIG));
let searchTerm = '';

/* =========================================================================
   サイドバー: フィルタリスト生成
   ========================================================================= */
const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

/* =========================================================================
   詳細パネル
   ========================================================================= */
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');

let currentDetailEntry = null;

function getCurrentYear(){
  return parseInt(document.getElementById('yearSlider').value, 10);
}

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];

function renderDesc(desc){
  if(!desc) return '';
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -3500, MAX_YEAR = 2026;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
