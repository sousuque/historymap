<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中東・南アジア史地図 — 世界史探究</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root{
    --bg-chrome:#1b2430;
    --bg-chrome-alt:#212c3a;
    --bg-chrome-alt2:#283544;
    --parchment:#f3ecdc;
    --parchment-alt:#eadfc6;
    --ink:#2a2420;
    --ink-soft:#5b5346;
    --line:#3a4658;
    --line-parchment:#cbb98c;
    --gold:#c99a4a;
    --gold-strong:#e0b567;
    --text-light:#e9e2d0;
    --text-light-soft:#9aa3b3;

    --cat-person:#c0554a;
    --cat-nation:#3f7ea6;
    --cat-dynasty:#8259ac;
    --cat-event:#c99a4a;
    --cat-war:#8a3a3a;
    --cat-revolution:#3f8f74;
    --cat-treaty:#7a6a52;

    --header-h:68px;
    --footer-h:104px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-chrome);
    color:var(--text-light);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Spectral',Georgia,serif; }

  a{color:var(--gold-strong);}

  :focus-visible{
    outline:2px solid var(--gold-strong);
    outline-offset:2px;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  #app-header{
    height:var(--header-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
  }
  #app-header h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text-light);
  }
  #app-header .subtitle{
    margin:2px 0 0;
    font-size:12px;
    color:var(--text-light-soft);
    font-family:'Inter',sans-serif;
  }
  .header-year{
    text-align:right;
  }
  .header-year .label{
    font-size:11px;
    color:var(--text-light-soft);
    display:block;
    margin-bottom:2px;
  }
  .header-year .value{
    font-family:'Spectral',serif;
    font-size:24px;
    font-weight:600;
    color:var(--gold-strong);
    white-space:nowrap;
  }

  /* ---------- Main layout ---------- */
  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }

  /* Sidebar */
  #sidebar{
    width:230px;
    flex:0 0 auto;
    background:var(--bg-chrome-alt);
    border-right:1px solid var(--line);
    padding:18px 16px;
    overflow-y:auto;
  }
  #sidebar h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-light);
  }
  .filter-list{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 6px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
  }
  .filter-row:hover{ background:var(--bg-chrome-alt2); }
  .filter-row input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px; height:14px;
    flex:0 0 auto;
  }
  .swatch{
    width:10px; height:10px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }
  .filter-row .fname{
    flex:1 1 auto;
    font-size:13px;
    color:var(--text-light);
  }
  .filter-row .fcount{
    font-size:11px;
    color:var(--text-light-soft);
  }

  .filter-actions{
    display:flex;
    gap:10px;
    margin:12px 0 18px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--gold-strong);
    font-size:12px;
    padding:0;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .link-btn:hover{ text-decoration:underline; }

  .search-box{
    margin-bottom:18px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .search-box label{
    display:block;
    font-size:12px;
    color:var(--text-light-soft);
    margin-bottom:6px;
  }
  .search-box input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text-light);
    font-size:13px;
    padding:5px 2px;
    font-family:'Inter',sans-serif;
  }
  .search-box input:focus{
    border-bottom-color:var(--gold-strong);
    outline:none;
  }

  .stats{
    font-size:11.5px;
    color:var(--text-light-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .stats b{ color:var(--gold-strong); font-weight:600; }

  /* Map */
  #mapWrap{
    flex:1 1 auto;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg-chrome-alt);
  }
  .leaflet-tile-pane{
    filter:grayscale(18%) sepia(10%) saturate(85%) contrast(0.96) brightness(0.97);
  }
  .entry-label{
    background:rgba(27,36,48,.82) !important;
    border:none !important;
    box-shadow:none !important;
    color:#f3ecdc !important;
    font-family:'Inter',sans-serif;
    font-size:11px;
    padding:1px 6px !important;
    border-radius:3px !important;
  }
  .entry-label::before{ display:none; }

  /* クラスター(ピンの重なり)アイコン */
  .cluster-marker-wrap{ background:none !important; border:none !important; }
  .cluster-badge{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--bg-chrome-alt2);
    border:2px solid var(--gold-strong);
    color:var(--gold-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600;
    box-shadow:0 0 0 3px rgba(27,36,48,.55);
  }
  .leaflet-cluster-spider-leg{
    stroke:var(--gold-strong) !important;
    stroke-opacity:.6 !important;
  }

  /* Detail panel */
  #detailPanel{
    width:340px;
    flex:0 0 auto;
    background:var(--parchment);
    color:var(--ink);
    border-left:1px solid var(--line-parchment);
    overflow-y:auto;
    position:relative;
    transition:margin-right .22s ease;
  }
  #detailPanel.hidden{
    margin-right:-340px;
  }
  @media (prefers-reduced-motion: reduce){
    #detailPanel{ transition:none; }
  }
  #closeDetail{
    position:absolute;
    top:12px; right:12px;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line-parchment);
    background:var(--parchment-alt);
    color:var(--ink);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  #closeDetail:hover{ background:#e0d3ac; }
  #detailContent{ padding:26px 22px 30px; }
  .detail-badge{
    display:inline-block;
    font-size:11px;
    color:#fff;
    padding:3px 9px;
    border-radius:3px;
    margin-bottom:12px;
  }
  #detailContent h3{
    margin:0 0 6px;
    font-size:21px;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
  }
  .detail-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-parchment);
  }
  .detail-meta div{ margin-top:3px; }
  #detailContent p{
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    margin:0;
  }
  .desc-sections{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .desc-section{
    padding-left:12px;
    border-left:3px solid var(--line-parchment);
  }
  .desc-section.sec-background{ border-left-color:#3f7ea6; }
  .desc-section.sec-process{ border-left-color:#c99a4a; }
  .desc-section.sec-significance{ border-left-color:#3f8f74; }
  .desc-section.sec-debate{ border-left-color:#8a3a3a; }
  .desc-label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .desc-section.sec-background .desc-label{ color:#3f7ea6; }
  .desc-section.sec-process .desc-label{ color:#a67c2e; }
  .desc-section.sec-significance .desc-label{ color:#2f7358; }
  .desc-section.sec-debate .desc-label{ color:#8a3a3a; }
  .desc-text{
    font-size:13.5px;
    line-height:1.8;
    color:var(--ink);
    margin:0;
  }
  .detail-empty{
    padding:40px 22px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.8;
  }

  .back-btn{
    display:inline-block;
    background:none;
    border:1px solid var(--line-parchment);
    color:var(--ink-soft);
    font-size:12px;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:hover{ background:var(--parchment-alt); }

  .related-persons{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line-parchment);
  }
  .related-persons h4{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-family:'Inter',sans-serif;
  }
  .related-persons ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .person-list-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:9px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .person-list-item:hover{ background:var(--parchment-alt); }
  .related-cat-badge{
    display:inline-block;
    font-size:9.5px;
    color:#fff;
    padding:1px 6px;
    border-radius:3px;
    margin-right:7px;
    white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .person-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .person-years{
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .related-persons-empty{
    font-size:12px;
    color:var(--ink-soft);
    padding-top:2px;
  }

  /* Footer timeline */
  #timeline{
    height:var(--footer-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 22px;
  }
  #playBtn{
    flex:0 0 auto;
    background:var(--bg-chrome-alt2);
    border:1px solid var(--line);
    color:var(--gold-strong);
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  #playBtn:hover{ background:#31405490; }

  .timeline-track-wrap{
    flex:1 1 auto;
    position:relative;
    padding-top:6px;
    padding-bottom:22px;
  }
  #yearSlider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--line-parchment);
    outline:none;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:16px; height:16px;
    border:none;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
  }
  .ticks{
    position:relative;
    height:16px;
    margin-top:6px;
  }
  .tick{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    font-size:10.5px;
    color:var(--text-light-soft);
    white-space:nowrap;
  }
  .tick::before{
    content:"";
    position:absolute;
    top:-16px; left:50%;
    width:1px; height:6px;
    background:var(--line);
  }

  .speed-control{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .speed-control label{
    font-size:11px;
    color:var(--text-light-soft);
  }
  .speed-control select{
    background:var(--bg-chrome-alt2);
    color:var(--text-light);
    border:1px solid var(--line);
    border-radius:5px;
    padding:6px 8px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }

  /* Responsive: narrow screens */
  @media (max-width: 760px){
    #sidebar{
      width:100%;
      position:absolute;
      z-index:900;
      height:auto;
      max-height:55%;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    #detailPanel{
      position:absolute;
      right:0; left:0; top:auto; bottom:0;
      width:auto;
      height:60%;
      border-left:none;
      border-top:1px solid var(--line-parchment);
      transition:transform .22s ease;
      z-index:950;
    }
    #detailPanel.hidden{
      margin-right:0;
      transform:translateY(100%);
    }
    #timeline{ gap:10px; padding:0 12px; }
    .speed-control label{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <header id="app-header">
    <div>
      <h1>中東・南アジア史 地図で学ぶ世界史</h1>
      <p class="subtitle">紀元前3500年 〜 西暦2026年 ・ 高校世界史探究 学習用</p>
    </div>
    <div class="header-year">
      <span class="label">現在の年代</span>
      <span class="value" id="yearDisplay">紀元前500年</span>
    </div>
  </header>

  <div id="main">

    <aside id="sidebar">
      <h2>ジャンルで絞り込み</h2>
      <div class="filter-list" id="filterList"></div>
      <p style="font-size:11px; color:var(--text-light-soft); line-height:1.6; margin:8px 2px 0;">
        ※人物は単独のピンではなく、関連する国家・王朝のピンをクリックした先の一覧から見られます。
      </p>

      <div class="filter-actions">
        <button class="link-btn" id="selectAllBtn">すべて表示</button>
        <button class="link-btn" id="selectNoneBtn">すべて解除</button>
      </div>

      <div class="search-box">
        <label for="searchInput">名称で検索</label>
        <input type="text" id="searchInput" placeholder="例: サラディン、アショーカ王">
      </div>

      <div class="stats">
        <b id="visibleCount">0</b> 件を表示中 / 全 <b id="totalCount">0</b> 件のデータ
      </div>
    </aside>

    <div id="mapWrap">
      <div id="map"></div>
    </div>

    <aside id="detailPanel" class="hidden">
      <button id="closeDetail" aria-label="閉じる">×</button>
      <div id="detailContent">
        <div class="detail-empty">地図上のピンをクリックすると、ここに詳しい解説が表示されます。</div>
      </div>
    </aside>

  </div>

  <footer id="timeline">
    <button id="playBtn">▶ 再生</button>
    <div class="timeline-track-wrap">
      <input type="range" id="yearSlider" min="-3500" max="2026" step="1" value="-500">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="speed-control">
      <label for="speedSelect">速度</label>
      <select id="speedSelect">
        <option value="1">×1</option>
        <option value="5" selected>×5</option>
        <option value="20">×20</option>
        <option value="50">×50</option>
      </select>
    </div>
  </footer>

</div>

<script>
/* =========================================================================
   中東・南アジア史 地図アプリ — データ本体
   -------------------------------------------------------------------------
   ジャンル(category)は以下の7種:
     person     人物
     nation     国家
     dynasty    王朝
     event      事件・出来事
     war        戦争・戦い
     revolution 革命
     treaty     条約

   各エントリの形式:
   {
     id:       一意の文字列ID
     name:     表示名(日本語)
     category: 上記7種のいずれか
     lat, lng: 地図上の座標(代表都市・場所)
     start:    存在/在位/発生開始年(西暦。紀元前はマイナスで表現。例: 紀元前500年 = -500)
     end:      終了年(単発の出来事は start と同じか、数年程度の幅を持たせる)
     region:   地域・国名の補助タグ
     desc:     詳細説明文
   }

   ★ データは今後、時代・地域ごとに分割して追加していきます。
     新しいブロックを追加する際は、この配列に要素を push する形で
     どんどん拡張できます(下記はコメントで時代ごとに区切り済み)。
   ========================================================================= */

const historicalData = [

  // ===================== 古代メソポタミア・アナトリア・エジプト =====================
  { id:'sumer', name:'シュメール(都市国家群)', category:'nation', lat:31.32, lng:45.64, start:-3500, end:-2000, region:'メソポタミア南部(現イラク南部)',
    desc:{background:'ティグリス・ユーフラテス両河の下流域という乾燥地帯で、大規模な灌漑農業により余剰穀物生産が可能となったことが、都市国家群の形成を支える経済的基盤となった。', process:'ウル・ウルク・ラガシュなど独立した都市国家が神殿を中心とする祭祀・行政組織(神権政治)のもとで並立・抗争を繰り返し、楔形文字による記録・法典編纂・車輪の使用などの技術革新を生み出した。', significance:'世界最古の文字体系(楔形文字)と都市文明を築いた点で「文明のゆりかご」と呼ばれ、後のアッカド・バビロニアなどメソポタミア諸文明の制度的・宗教的基盤を提供した。', debate:'統一王権を持たない都市国家並立体制がなぜ長期にわたり存続し得たか、また周辺のセム系民族(アッカド人)との文化的継承・断絶の実態がどこまで解明できるかが議論される。'} },
  { id:'akkadian_empire', name:'アッカド帝国', category:'nation', lat:32.54, lng:44.42, start:-2334, end:-2154, region:'メソポタミア(現イラク)',
    desc:{background:'シュメールの都市国家群が抗争を繰り返す中、セム系のアッカド人サルゴンが軍事的統一を目指したことが建国の背景となった。', process:'シュメールの諸都市国家を征服して人類史上最初期の中央集権的な領域国家を樹立し、常備軍と行政官僚制度による統治を確立したが、内乱と異民族(グティ人)の侵入により約150年で崩壊した。', significance:'都市国家の枠を超えた「帝国」という統治形態の先駆例として、後のメソポタミア諸帝国(アッシリア・バビロニアなど)の統治モデルの原型を提供した。', debate:'崩壊の原因を外敵の侵入のみに帰すか、気候変動による農業生産力の低下という環境要因も重視すべきかで近年の古気候学的研究をめぐり議論がある。'} },
  { id:'sargon_akkad', name:'サルゴン(アッカドのサルゴン)', category:'person', parentId:'akkadian_empire', lat:32.54, lng:44.42, start:-2334, end:-2279, region:'アッカド帝国',
    desc:{background:'出自不明の低い身分から身を起こしたとされる伝承が、後世彼を「実力による統治者」の理想像として神話化する土壌となった。', process:'シュメールの諸都市国家を次々と征服して統一し、アッカドを都に人類史上最初の常備軍を用いた領域国家を樹立、その版図はペルシア湾から地中海沿岸にまで及んだとされる。', significance:'「世界征服者」の原型として後のメソポタミア諸王(アッシリア王など)に理想の統治者像として長く参照され続けた。', debate:'彼の事績を伝える後代の記録には神話的脚色が多く含まれるため、実際の版図・統治の実態がどこまで史実かは史料批判上の重要な課題である。'} },
  { id:'babylon_first_dynasty', name:'古バビロニア王国(バビロン第1王朝)', category:'nation', lat:32.54, lng:44.42, start:-1894, end:-1595, region:'メソポタミア(バビロン)',
    desc:{background:'アッカド帝国崩壊後のメソポタミアで諸勢力が分立する中、アムル人(アモリ人)の一派がユーフラテス川中流の要衝バビロンを拠点に台頭したことが背景となった。', process:'6代目のハンムラビ王のもとで周辺諸国を征服し全メソポタミアを統一する古バビロニア王国の最盛期を迎えたが、彼の死後まもなく求心力を失い、ヒッタイトの遠征を機に滅亡した。', significance:'ハンムラビ法典に代表される法治の伝統を確立し、バビロンは以後1000年以上にわたりメソポタミア文明の中心都市であり続けた。', debate:'この王朝の急速な弱体化の要因を、ハンムラビ個人のカリスマへの依存度の高さに求めるか、灌漑農業の生産力低下という構造的問題に求めるかで議論がある。'} },
  { id:'hammurabi', name:'ハンムラビ(ハンムラビ王)', category:'person', parentId:'babylon_first_dynasty', lat:32.54, lng:44.42, start:-1792, end:-1750, region:'古バビロニア王国',
    desc:{background:'父祖から受け継いだ比較的小規模な都市国家バビロンを足がかりに、周辺の有力都市国家(マリ・エシュヌンナなど)との抗争を勝ち抜く必要があったことが治世の背景となった。', process:'巧みな外交(同盟の使い分け)と軍事行動により周辺諸国を次々と征服し全メソポタミアを統一する古バビロニア王国の最盛期を築き、法典編纂・灌漑事業・神殿修復など内政面でも精力的な統治を行った。', significance:'ハンムラビ法典は成文法による統治という理念を後世に伝え、その「目には目を」の応報原則は今日でも法思想史上広く言及される。', debate:'法典が実際にどこまで現実の司法運用に適用されたか(理念の表明にとどまったか実効性を持ったか)は、楔形文字文書研究における重要な論争点である。'} },
  { id:'code_of_hammurabi', name:'ハンムラビ法典', category:'treaty', lat:32.54, lng:44.42, start:-1754, end:-1754, region:'バビロン(古バビロニア王国)',
    desc:{background:'統一されたばかりの広大な版図を、地域ごとに異なる慣習法ではなく統一的な法規範のもとで統治する必要が、法典編纂の背景となった。', process:'石碑に刻まれた282条の条文は身分(自由人・奴隷)や被害の性質に応じて刑罰を細かく規定し、「目には目を、歯には歯を」に象徴される同害復讐(タリオ)の原則を明文化した。', significance:'現存する世界最古級の体系的法典として、成文法による統治という理念の起源を示し、後の古代オリエント・地中海世界の法思想に大きな影響を残した。', debate:'身分によって刑罰の重さが異なる規定は「平等な正義」という近代法理念とは相容れないが、当時としてこれをどう評価すべきか(恣意的支配への歯止めという進歩性を重視するか)が論じられる。'} },
  { id:'hittite_empire', name:'ヒッタイト新王国', category:'nation', lat:40.02, lng:34.61, start:-1650, end:-1180, region:'アナトリア中央部',
    desc:{background:'アナトリア高原という鉄鉱石産地に位置したことが、この文明が鉄製武器・戦車技術で軍事的優位を築く基盤となった。', process:'早期に鉄器使用の技術を確立して軍事的優位を築き、古バビロニア王国を滅ぼすなど勢力を拡大し、最盛期には古代エジプトと肩を並べる大国としてカデシュの戦いで激突したが、後に「海の民」の侵入とされる混乱により前12世紀頃に急速に崩壊した。', significance:'鉄器文明の先駆者として、その技術・製法は「海の民」の混乱による帝国崩壊後に周辺地域へ拡散し、地中海世界における鉄器時代の本格的な到来を準備したとされる。', debate:'鉄器技術の独占が崩壊後にどのように周辺世界へ拡散したか(意図的な技術移転か、混乱に伴う技術者の離散によるものか)が技術史上の重要な論点となっている。'} },
  { id:'ancient_egypt', name:'古代エジプト(ファラオの時代)', category:'nation', lat:30.04, lng:31.24, start:-3100, end:-30, region:'エジプト(ナイル川流域)',
    desc:{background:'ナイル川の定期的氾濫がもたらす肥沃な沖積土壌と、周囲を砂漠に囲まれた外敵からの天然の防御という地理的条件が、安定した長期文明形成の基盤となった。', process:'上下エジプトの統一(前3000年頃)以降、古王国(ピラミッド建設)・中王国・新王国という周期的な統一と分裂を繰り返しながら3000年近く独自の文明を維持し、ヒエログリフ・太陽神信仰・ファラオを神格化する王権理念を発展させたが、末期には度重なる異民族支配を経てプトレマイオス朝を最後に前30年にローマに併合された。', significance:'ピラミッド・神殿建築や暦法・医学など高度な文明的達成は後の地中海世界(ギリシア・ローマ)にも大きな影響を与え、ヒエログリフ解読(ロゼッタストーン)を通じて近代エジプト学という学問分野を生み出した。', debate:'3000年もの長期にわたり基本的な統治理念・文化が維持され続けた要因を、地理的孤立性に求めるか、ナイル川という単一の生命線に依存する社会構造の安定性に求めるかで議論がある。'} },
  { id:'ramesses_ii', name:'ラムセス2世', category:'person', parentId:'ancient_egypt', lat:30.04, lng:31.24, start:-1303, end:-1213, region:'古代エジプト新王国',
    desc:{background:'父セティ1世の代からのヒッタイトとの対立(シリア方面の覇権争い)が、彼の治世における大規模な軍事行動の背景となった。', process:'カデシュの戦いでヒッタイトと激突したが決定的勝敗はつかず、後に史上初の国際和平条約とされるエジプト・ヒッタイト平和条約を締結し、アブシンベル神殿など数多くの巨大建造物を建設した。', significance:'60年を超える長期の治世で古代エジプト新王国の最盛期を体現し、「大王(ラメセス大王)」として後世まで最も著名なファラオの一人となった。', debate:'カデシュの戦いの結果を自身の勝利として大々的に喧伝した碑文の記述と、実際の戦況(引き分けに近い)との乖離は、古代王権のプロパガンダのあり方を考える好例として論じられる。'} },
  { id:'battle_of_kadesh', name:'カデシュの戦い', category:'war', lat:34.57, lng:36.50, start:-1274, end:-1274, region:'シリア(オロンテス川流域)',
    desc:{background:'シリア方面の覇権をめぐるエジプト新王国とヒッタイト帝国との長年の対立が、この決戦の背景となった。', process:'ラメセス2世率いるエジプト軍がヒッタイト軍の待ち伏せにより一時窮地に陥ったが、援軍の到着により辛くも壊滅を免れ、戦闘自体は実質的に引き分けに終わった。', significance:'この戦いの詳細は双方の記録(エジプト側のレリーフ・ヒッタイト側の粘土板文書)が現存する史上最初期の戦争であり、双方の史料を比較できる稀有な事例として軍事史研究上重要である。', debate:'エジプト側の記録がラメセス2世の個人的武勇による勝利として誇張しているのに対し、実際の戦況分析からは痛み分けに近かったとされ、勝敗の実態と記録上の演出との乖離が論じられる。'} },
  { id:'egypt_hittite_treaty', name:'エジプト・ヒッタイト平和条約', category:'treaty', lat:34.57, lng:36.50, start:-1259, end:-1259, region:'シリア',
    desc:{background:'カデシュの戦いで決着がつかなかった後も両国の対立が長期化し、双方とも第三勢力(アッシリアなど)の台頭という共通の脅威に直面していたことが、和平締結の背景となった。', process:'エジプトとヒッタイトの間で相互不可侵と軍事同盟を定める条約が締結され、銀板に刻まれた条文の写しが両国の言語で作成された。', significance:'現存する人類史上最古の国際和平条約として、その内容(相互不可侵・軍事同盟・逃亡者の引き渡し)は近代の国際条約の原型ともいえる先駆的な国際法の実践例である。', debate:'この条約の写しが国連本部にも展示されるなど「人類最古の平和の実践」として称揚される一方、実際には両国とも第三の脅威(アッシリア台頭)への対処という現実的計算に基づく同盟であった側面も重視すべきとの指摘がある。'} },
  { id:'assyrian_empire', name:'アッシリア帝国(新アッシリア)', category:'nation', lat:36.36, lng:43.15, start:-911, end:-609, region:'メソポタミア北部(現イラク北部)',
    desc:{background:'ティグリス川上流の乏しい農業基盤を補うため、早くから軍事力による周辺地域からの収奪・交易統制に依存する国家性格を発展させたことが背景となった。', process:'鉄製武器・戦車・攻城技術に優れた常備軍と、征服地の住民を強制移住させて反乱を防ぐ統治手法により、最盛期にはエジプトを含む古代オリエント世界のほぼ全域を統一する史上初の「世界帝国」を築いたが、過酷な統治への反発から複数の被征服民族が連携して反乱を起こし前612年に都ニネヴェが陥落し急速に崩壊した。', significance:'史上初めて古代オリエント世界全域を統一した「世界帝国」として、その中央集権的な統治システム(駅伝制・属州制)は後のペルシア帝国の統治モデルの先例となった。', debate:'アッシリアの統治は「残虐な征服帝国」として旧約聖書などに描かれ長く否定的に評価されてきたが、近年の考古学研究は行政・交易・学術(ニネヴェの図書館)における先進性も重視し評価の見直しが進んでいる。'} },
  { id:'ashurbanipal', name:'アッシュールバニパル', category:'person', parentId:'assyrian_empire', lat:36.36, lng:43.15, start:-685, end:-627, region:'アッシリア帝国',
    desc:{background:'拡大しきった帝国の統治体制の集大成として、行政・軍事のみならず学術・文化面でも帝国の威信を示す事業が求められたことが背景となった。', process:'エジプト・エラムへの遠征で帝国最大版図を実現する一方、都ニネヴェに古代オリエント世界最大級の図書館を建設し、メソポタミア各地から集めた粘土板文書(ギルガメシュ叙事詩を含む)を体系的に収集・保存させた。', significance:'この図書館は19世紀の発掘により発見され、メソポタミア文明の文学・宗教・科学に関する研究の一次史料の宝庫として近代の楔形文字学・古代オリエント史研究に計り知れない貢献をした。', debate:'「残虐な征服者」という伝統的なアッシリア王のイメージと、学術・文化の保護者としての側面という二面性を、この人物においてどう統合的に評価すべきかが論じられる。'} },
  { id:'neo_babylonian_empire', name:'新バビロニア王国(カルデア王国)', category:'nation', lat:32.54, lng:44.42, start:-626, end:-539, region:'メソポタミア(バビロン)',
    desc:{background:'アッシリア帝国の過酷な統治への反発から、バビロニアとメディアが連携して反乱を起こしたことが建国の背景となった。', process:'ナボポラッサルがアッシリアを滅ぼして独立を回復し、息子ネブカドネザル2世の代にエジプトを牽制しつつユダ王国を征服して「バビロン捕囚」を行うなど最盛期を築いたが、内紛により急速に弱体化し前539年にアケメネス朝ペルシアのキュロス2世により無血で征服された。', significance:'「空中庭園」に象徴される壮麗な都市文明を築き、旧約聖書における「バビロン捕囚」の記述を通じてユダヤ教・キリスト教の歴史認識に強い印象を残した。', debate:'アケメネス朝によるバビロン征服が「無血の解放」として自らを正当化する碑文(キュロスの円筒印章)を残していることの史実性(実際にどこまで平和的な征服であったか)が論じられる。'} },
  { id:'nebuchadnezzar_ii', name:'ネブカドネザル2世', category:'person', parentId:'neo_babylonian_empire', lat:32.54, lng:44.42, start:-634, end:-562, region:'新バビロニア王国',
    desc:{background:'父ナボポラッサルによるアッシリアからの独立回復という基盤の上に、新バビロニアの覇権を確立する必要が治世の背景となった。', process:'エジプトを牽制しつつユダ王国を二度にわたり征服し、反乱を起こしたエルサレムを破壊してユダヤ人を「バビロン捕囚」として強制連行し、壮麗な都市建設(伝説の「空中庭園」を含むとされる)を進めた。', significance:'この捕囚体験はユダヤ教における民族的離散(ディアスポラ)の原体験として、以後のユダヤ人の宗教的・民族的アイデンティティ形成に決定的な影響を残した。', debate:'「空中庭園」の実在性・所在地については考古学的に確定しておらず、この伝説がどこまで史実に基づくか、あるいはニネヴェの庭園との混同かが議論されている。'} },
  { id:'babylonian_captivity', name:'バビロン捕囚', category:'event', lat:32.54, lng:44.42, start:-597, end:-538, region:'バビロン(新バビロニア王国)',
    desc:{background:'ネブカドネザル2世によるユダ王国征服とエルサレム破壊が、ユダヤ人指導層・知識人層のバビロンへの強制連行を招いた直接的背景となった。', process:'約半世紀にわたりバビロンに強制移住させられたユダヤ人共同体は、エルサレム神殿という物理的な礼拝の場を失う中で律法(トーラー)の書写・研究を中心とする新たな宗教実践を発展させたが、アケメネス朝ペルシアのキュロス2世による解放令(前538年)により帰還が許された。', significance:'神殿なき信仰実践の確立はシナゴーグ(会堂)という新たな宗教制度を生み出し、以後のユダヤ教が特定の聖地・神殿に依存しない普遍的な宗教として発展する礎を築いた。', debate:'この経験がユダヤ教の宗教的性格(選民思想・律法中心主義)の確立にどこまで決定的な影響を与えたかは、ユダヤ教成立史における最重要の論点の一つである。'} },
  { id:'phoenicia', name:'フェニキア(都市国家群)', category:'nation', lat:34.44, lng:35.83, start:-1200, end:-539, region:'地中海東岸(現レバノン沿岸)',
    desc:{background:'レバノン山地の豊富な木材資源と地中海に面した地理的条件が、海洋交易国家としての発展を促した。', process:'ティルス・シドンなど独立した港市国家が地中海全域に及ぶ広範な交易網を築き、カルタゴなど各地に植民都市を建設し、表音文字体系(フェニキア文字)を発展させた。', significance:'フェニキア文字はギリシア文字・ラテン文字を含む西方のほぼ全てのアルファベット系文字の直接の起源となり、人類の文字史に計り知れない影響を残した。', debate:'統一国家を持たない都市国家群でありながらなぜ広範な文化的影響力(文字の伝播)を持ち得たか、その交易ネットワークの実態解明が古代地中海史の重要な研究課題となっている。'} },
  { id:'kingdom_of_israel_united', name:'イスラエル王国(統一王国時代)', category:'nation', lat:31.78, lng:35.22, start:-1050, end:-930, region:'パレスチナ',
    desc:{background:'周辺のペリシテ人など強力な部族連合の脅威に対処するため、それまで部族連合体であったイスラエル諸部族が単一の王権のもとに統合される必要が生じたことが背景となった。', process:'サウルに始まりダビデ・ソロモンと続く王権のもとで統一され、エルサレムを都に定めて神殿を建設するなど最盛期を築いたが、ソロモンの死後まもなく北のイスラエル王国と南のユダ王国に分裂した。', significance:'旧約聖書における理想化された統一王国として、後のユダヤ教・キリスト教における「メシア(救世主)」思想(ダビデの子孫からの再興待望)の原点となった。', debate:'この統一王国の実際の規模・国力については、考古学的証拠が乏しいことから聖書の記述をどこまで史実として受け止めるべきか(「最小主義」対「最大主義」)という論争が聖書考古学上続いている。'} },
  { id:'david', name:'ダビデ', category:'person', parentId:'kingdom_of_israel_united', lat:31.78, lng:35.22, start:-1040, end:-970, region:'イスラエル王国',
    desc:{background:'羊飼いの若者から身を起こしペリシテの巨人ゴリアテを倒したとされる逸話が、後のサウル王からの人望獲得と王位継承の正統性の背景となった。', process:'サウル王との対立を経て全イスラエル部族の王として即位し、エルサレムを征服して都と定め、王国の版図を大きく拡大した。', significance:'「ダビデの家系」から救世主(メシア)が現れるという待望思想はユダヤ教・キリスト教双方の中心的な神学的概念となり、イエスの系譜がダビデに連なるとされる根拠ともなった。', debate:'近年の考古学的発見(テル・ダン碑文における「ダビデの家」の言及)は彼の実在性を支持する有力な証拠とされる一方、その王国の実際の規模については依然議論が続いている。'} },
  { id:'solomon', name:'ソロモン', category:'person', parentId:'kingdom_of_israel_united', lat:31.78, lng:35.22, start:-990, end:-931, region:'イスラエル王国',
    desc:{background:'父ダビデが築いた統一王国の基盤の上に、王権の宗教的権威を確立する象徴的事業が求められたことが治世の背景となった。', process:'エルサレムに壮麗な神殿(ソロモン神殿)を建設し、フェニキアのティルス王との交易同盟や周辺諸国との外交(シバの女王来訪の逸話など)を通じて経済的繁栄を築いたが、大規模建設事業のための重税と強制労働への不満が彼の死後の王国分裂を招く一因となった。', significance:'「知恵の王」として旧約聖書に描かれ、彼が建てた神殿はユダヤ教における最も神聖な場所として、後のユダヤ人の宗教的アイデンティティの中心的象徴であり続けている。', debate:'彼の治世の繁栄の実態について、考古学的発掘(メギドなどの遺構)がどこまでソロモン時代に帰属するかをめぐり年代測定上の論争(「低年代説」対「高年代説」)が続いている。'} },
  { id:'kingdom_of_judah', name:'ユダ王国', category:'nation', lat:31.78, lng:35.22, start:-930, end:-586, region:'パレスチナ南部',
    desc:{background:'ソロモン死後の重税と強制労働への北部諸部族の不満が、統一王国分裂の直接的背景となった。', process:'ダビデ王朝の血統を維持しエルサレム神殿を中心とする南方の王国として存続したが、新バビロニアのネブカドネザル2世による二度の征服を経て前586年にエルサレムが破壊され「バビロン捕囚」を迎えて滅亡した。', significance:'ダビデ王統の正統な継承国家として、この滅亡と捕囚の経験はユダヤ教における民族的試練と再生の中心的な物語となった。', debate:'北のイスラエル王国が前722年に滅亡した後もユダ王国が150年近く存続し得た要因を、地理的な僻遠さに求めるか、周辺大国間の勢力均衡を利用した巧みな外交に求めるかで議論がある。'} },
  { id:'kingdom_of_israel_north', name:'イスラエル王国(北王国)', category:'nation', lat:32.28, lng:35.19, start:-930, end:-722, region:'パレスチナ北部',
    desc:{background:'ソロモン死後の重税と強制労働政策への不満から、南部(ユダ族・ベニヤミン族)を除く北部10部族が離反したことが分裂の直接的背景となった。', process:'サマリアを都に独自の王朝(複数回の王朝交代を経験)を築いたが、南のユダ王国よりも政治的に不安定で、前722年にアッシリア帝国により征服され、住民の多くが強制移住させられ他地域からの移民と混住させられた。', significance:'この征服後に消息を絶った10部族は「失われた10部族」として、後世さまざまな伝説(日本失われた支族説なども含む)を生む起源となった。', debate:'「失われた10部族」の実際の運命(完全な同化・離散か、一部が独自の共同体として存続したか)は歴史的にも宗教的にも大きな関心を集め続けている未解決の問題である。'} },

  // ===================== 古代ペルシア帝国 =====================
  { id:'zoroastrianism', name:'ゾロアスター教の成立と発展', category:'event', lat:29.94, lng:52.89, start:-1200, end:651, region:'イラン高原',
    desc:{background:'古代イランの多神教的な自然崇拝の中から、預言者ゾロアスターが善悪二元論に基づく倫理的一神教的思想を説いたことが成立の背景となった。', process:'善神アフラ=マズダーと悪神アンラ=マンユ(アーリマン)の宇宙的対立という善悪二元論を核とし、最後の審判・死後の楽園と地獄・救世主の到来といった終末論的教義を体系化し、アケメネス朝以降のペルシア諸帝国で事実上の国教的地位を得た。', significance:'その終末論・天使論・最後の審判といった教義は、後のユダヤ教(バビロン捕囚期の接触)・キリスト教・イスラームの終末論形成に大きな影響を与えたとする説が有力である。', debate:'ユダヤ教の終末論・天使論がどこまでゾロアスター教から直接的な影響を受けたのか、それとも独自に発展したものかは、比較宗教史上の重要かつ未解決の論争である。'} },
  { id:'achaemenid_empire', name:'アケメネス朝ペルシア', category:'nation', lat:29.94, lng:52.89, start:-550, end:-330, region:'イラン高原中心に西アジア全域',
    relatedIds:['cyrus_great','darius_i','xerxes_i','greco_persian_wars','alexander_conquest_persia'],
    desc:{background:'メディア王国に服属していたペルシア人がキュロス2世のもとで自立し、周辺の諸帝国(メディア・リディア・新バビロニア)を次々と征服したことが建国の背景となった。', process:'サトラップ制(属州総督制)と「王の道」に代表される駅伝制、多様な民族・宗教への寛容政策により、エジプトからインダス川に至る史上最大級の帝国を築いたが、アレクサンドロス大王の遠征により前330年に滅亡した。', significance:'多民族・多宗教を包摂する寛容な統治理念は、後のヘレニズム諸国家やローマ帝国の統治手法にも影響を与えた、古代帝国統治の一つの完成形と評価される。', debate:'その統治を「寛容な帝国」として理想化するギリシア側の一部記述(実際にはギリシア人はペルシアを専制の象徴として否定的に描くことが多い)と、被支配民族側の記録(旧約聖書のキュロス評価など)との間の史料的な緊張関係が論じられる。'} },
  { id:'cyrus_great', name:'キュロス2世(大王)', category:'person', parentId:'achaemenid_empire', lat:30.19, lng:53.17, start:-600, end:-530, region:'アケメネス朝ペルシア',
    desc:{background:'メディア王国に服属する一地方勢力であったペルシア人を率いて自立を図ったことが、帝国建設への出発点となった。', process:'メディア・リディア・新バビロニアを次々と征服して史上最大級の帝国を築き、バビロン征服後にはユダヤ人のエルサレムへの帰還と神殿再建を認める勅令を発した。', significance:'旧約聖書では異例にも「主に油注がれた者」として肯定的に描かれる異邦の王となり、その被征服民の宗教・慣習を尊重する統治理念は「キュロスの円筒印章」を通じて古代における人権宣言の先駆けとも評価される。', debate:'「キュロスの円筒印章」を近代的な人権思想の先駆と評価する見方に対し、これは当時の慣行的な征服者の自己正当化の言説にすぎないとする批判的な見方もあり、この文書の史学的意義をめぐり論争がある。'} },
  { id:'darius_i', name:'ダレイオス1世', category:'person', parentId:'achaemenid_empire', lat:32.19, lng:48.26, start:-550, end:-486, region:'アケメネス朝ペルシア',
    desc:{background:'カンビュセス2世死後の帝位継承をめぐる混乱(ガウマタの反乱)を武力で鎮圧して即位したことが、統治体制再構築の背景となった。', process:'帝国全土をサトラップ(属州)に分割し中央集権的な行政・徴税制度を整備、「王の道」と呼ばれる幹線道路網や統一貨幣を導入し、ギリシア本土への遠征(ペルシア戦争の緒戦、マラトンの戦いで敗北)も行った。', significance:'ベヒストゥン碑文に刻まれた自らの即位の正統性を記す銘文は、複数言語(古代ペルシア語・エラム語・アッカド語)による対訳という点で、19世紀の楔形文字解読の鍵となった。', debate:'サトラップ制という分権的な統治と中央集権的な統制とのバランスをどう両立させていたか、その統治の実効性の実態が研究上の関心事である。'} },
  { id:'xerxes_i', name:'クセルクセス1世', category:'person', parentId:'achaemenid_empire', lat:29.94, lng:52.89, start:-518, end:-465, region:'アケメネス朝ペルシア',
    desc:{background:'父ダリウス1世が果たせなかったギリシア征服という未完の課題を引き継いだことが、大規模な再遠征の背景となった。', process:'史上空前の規模の大軍を率いてギリシアへ侵攻しテルモピュライの戦いで一時勝利しアテナイを占領・破壊したが、サラミスの海戦での大敗により遠征は失敗に終わり撤退を余儀なくされた。', significance:'この敗北はペルシア帝国の西方拡大の限界を露呈させ、以後ギリシア世界(特にアテナイ)の政治的・文化的な黄金時代(古典期民主政)を準備する重要な契機となった。', debate:'この遠征失敗がペルシア帝国自体の国力にどこまで長期的な打撃を与えたか、あるいは帝国はその後も安定を保ち続けたかという評価の相違がある。'} },
  { id:'greco_persian_wars', name:'ペルシア戦争', category:'war', lat:38.15, lng:23.95, start:-499, end:-449, region:'ギリシャ・アケメネス朝ペルシア',
    desc:{background:'小アジアのギリシア人植民市(イオニア)がペルシアの支配に対して反乱を起こし、アテナイがこれを支援したことが開戦の直接的契機となった。', process:'ダリウス1世・クセルクセス1世による二度の大規模遠征がマラトンの戦い・サラミスの海戦・プラタイアの戦いでのギリシア連合軍の勝利によりいずれも撃退された。', significance:'この勝利はギリシア世界、特にアテナイにおける民主政の黄金時代を準備し、東西世界の対立という後世の歴史叙述(ヘロドトス『歴史』)の枠組みの原点ともなった。', debate:'ヘロドトスによる「自由なギリシアと専制的なペルシア」という対比的な歴史叙述は、後世のオリエンタリズム的な東西二元論の起源としてどこまで批判的に相対化すべきかが論じられる。'} },
  { id:'alexander_conquest_persia', name:'アレクサンドロス大王の東方遠征(アケメネス朝の滅亡)', category:'war', lat:32.19, lng:48.26, start:-334, end:-330, region:'アケメネス朝ペルシア全域',
    desc:{background:'父フィリッポス2世が築いたマケドニア軍事力の基盤の上に、ギリシア世界の宿敵ペルシアへの遠征という大義名分が、アレクサンドロスの東征を正当化する背景となった。', process:'イッソス・ガウガメラの戦いでアケメネス朝ペルシア軍を撃破し、ペルセポリスを焼き払って前330年にダレイオス3世暗殺をもってペルシア帝国を滅ぼし、さらにインダス川流域にまで軍を進めた。', significance:'この征服により東地中海からインドに至る広大な地域にギリシア文化が波及する「ヘレニズム時代」が幕を開け、東西文明の融合という世界史上の一大画期をもたらした。', debate:'アレクサンドロス自身がペルシアの統治制度・宮廷儀礼を積極的に取り入れた(オリエント化政策)ことをめぐり、これを文化融合の理念とみるか単なる統治上の便宜策とみるかで評価が分かれる。'} },
  { id:'seleucid_empire', name:'セレウコス朝シリア', category:'nation', lat:36.20, lng:36.16, start:-312, end:-63, region:'シリア・メソポタミア・イラン',
    desc:{background:'アレクサンドロス大王の急死後、後継者(ディアドコイ)間の抗争を勝ち抜いた将軍セレウコスが、旧ペルシア帝国東方領域の継承者として台頭したことが建国の背景となった。', process:'シリアからイランに至る広大な版図を統治しギリシア人都市の建設を通じてヘレニズム文化の東方への浸透を進めたが、東方領域はパルティアの独立により徐々に失われ、西方領域も次第にローマの圧力に押され前63年にローマに併合された。', significance:'ヘレニズム文化と中東・イラン文化の融合を促進し、ガンダーラ美術に象徴されるようにその文化的影響はインド方面にまで及んだ。', debate:'広大な領域を統治する上でのギリシア人入植都市と現地住民との文化的統合の実態(どこまで融合が進みどこまで分離が残ったか)が論じられる。'} },
  { id:'parthian_empire', name:'パルティア(アルサケス朝)', category:'nation', lat:33.09, lng:44.58, start:-247, end:224, region:'イラン・メソポタミア',
    desc:{background:'セレウコス朝の東方領域における統制力の弱まりに乗じ、イラン系遊牧民パルニ族が自立を図ったことが建国の背景となった。', process:'セレウコス朝からイラン高原を奪って独立し、重装騎兵と機動力に優れた騎射戦術(「パルティアン・ショット」)でローマの東方進出を長期にわたり阻み、シルクロード交易の中継拠点としても繁栄したが、内部抗争の末に3世紀にサーサーン朝に取って代わられた。', significance:'ローマ帝国と並ぶ古代世界の二大強国として東西交易(シルクロード)を仲介し、この地位は後継のサーサーン朝にも引き継がれた。', debate:'ローマとの長期にわたる抗争(カルラエの戦いでのローマ軍壊滅など)で決定的勝利を収めながらも版図拡大に消極的であった要因が、遊牧民的な統治構造の限界にあったかどうかが論じられる。'} },
  { id:'sassanid_empire', name:'ササン朝ペルシア', category:'nation', lat:33.09, lng:44.58, start:224, end:651, region:'イラン・メソポタミア',
    relatedIds:['ardashir_i','shapur_i','khosrow_i','byzantine_sassanid_wars','battle_qadisiyyah'],
    desc:{background:'パルティアの統治への不満を背景に、ペルシス地方の豪族アルダシール1世が中央集権的な国家再建を志向したことが建国の背景となった。', process:'パルティアを打倒してゾロアスター教を国教に定めた中央集権的な統治体制を確立し、ローマ・ビザンツ帝国との数世紀に及ぶ抗争を繰り返しつつ、ホスロー1世の代に法制度・行政の整備で最盛期を迎えたが、ビザンツとの長期消耗戦で国力を疲弊させた末、勃興期のイスラーム軍の急速な征服により651年に滅亡した。', significance:'ゾロアスター教を核とする独自の統治理念とペルシア文化はイスラーム化後も行政制度・文学・宮廷文化として継承され、後のイスラーム世界(特にアッバース朝)におけるペルシア文化復興の基盤となった。', debate:'ビザンツとの長期消耗戦がイスラーム軍による急速な征服を許した決定的要因であったとする見方が有力だが、これに加えサーサーン朝内部の宗教的・社会的緊張(マズダク教運動の影響など)をどこまで重視すべきかが論じられる。'} },
  { id:'ardashir_i', name:'アルダシール1世', category:'person', parentId:'sassanid_empire', lat:33.09, lng:44.58, start:180, end:242, region:'ササン朝ペルシア',
    desc:{background:'パルティア支配下のペルシス地方の一領主として、パルティアの分権的統治体制への不満を抱いていたことが、彼の自立運動の背景となった。', process:'パルティア王アルタバヌス4世を破ってこれを打倒し、ゾロアスター教の神官階級と結びついた中央集権的な統治体制を確立し、アケメネス朝の後継者を自任してローマとの対決姿勢を鮮明にした。', significance:'サーサーン朝約400年の礎を築き、ゾロアスター教を国家統治の理念的支柱とする体制はイラン人のアイデンティティの核として長く継承された。', debate:'「アケメネス朝の後継者」を自認する彼の正統性主張が、実際にどこまでアケメネス朝の記憶・伝統を継承したものか、後世の政治的レトリックにすぎないかが論じられる。'} },
  { id:'shapur_i', name:'シャープール1世', category:'person', parentId:'sassanid_empire', lat:33.09, lng:44.58, start:215, end:270, region:'ササン朝ペルシア',
    desc:{background:'父アルダシール1世が確立した中央集権体制を継承し、対ローマ戦線でのさらなる勢力拡大を志向したことが治世の背景となった。', process:'ローマとの戦いで三代の皇帝を打ち破り、特にウァレリアヌス帝を捕虜とする前代未聞の勝利を収め、この様子はナクシェ・ロスタムの磨崖レリーフに誇示的に刻まれた。', significance:'ローマ皇帝を捕虜とした唯一の事例として、サーサーン朝の国威を大きく高め、ローマ帝国東方における軍事的劣勢を象徴する歴史的事件となった。', debate:'ウァレリアヌス帝の捕囚後の処遇(屈辱的な扱いを受けたとする伝承)の史実性については、ローマ側史料の政治的バイアスを踏まえた史料批判が求められる。'} },
  { id:'khosrow_i', name:'ホスロー1世(アヌーシールワーン)', category:'person', parentId:'sassanid_empire', lat:33.09, lng:44.58, start:501, end:579, region:'ササン朝ペルシア',
    desc:{background:'先代諸王の治世で蓄積された宗教的混乱(マズダク教運動による社会秩序の動揺)を収拾し、国家体制を再建する必要が治世の背景となった。', process:'マズダク教徒を弾圧して秩序を回復し、税制改革・軍制改革(騎士階級の再編)を進めて中央集権を強化し、ビザンツ帝国との抗争でも優位に立ち「不滅の魂を持つ者」の異名で呼ばれる最盛期を築いた。', significance:'彼の治世に整備された行政・法制度はイスラーム征服後もアッバース朝など後継のイスラーム王朝に大きな影響を残し、「正義の王」として後世のペルシア文学(『シャー・ナーメ』など)でも理想化された。', debate:'マズダク教運動(財産・妻の共有を説いたとされる急進的な社会運動)の実態については史料が乏しく、その社会史的意義の解明が今なお課題となっている。'} },
  { id:'byzantine_sassanid_wars', name:'ビザンツ・ササン朝戦争', category:'war', lat:36.20, lng:37.16, start:602, end:628, region:'シリア・メソポタミア・アナトリア',
    desc:{background:'東地中海とメソポタミア・カフカス地方の覇権をめぐり、ビザンツ帝国とサーサーン朝ペルシアが長期にわたり対立関係にあったことが背景となった。', process:'数世紀にわたり断続的に戦争が繰り返され、7世紀初頭には一時サーサーン朝がエジプト・シリアを制圧する大攻勢を見せたがビザンツ皇帝ヘラクレイオスの反攻により形勢は逆転し、両国とも壊滅的な消耗を経験した。', significance:'この最終戦争(602-628年)による両国の疲弊は、直後に勃興したイスラーム勢力による急速な征服(サーサーン朝の完全滅亡、ビザンツ領シリア・エジプトの喪失)を許す決定的な条件を作り出した。', debate:'この長期消耗戦が「両大国が共倒れした」ことでイスラームの急速な拡大を可能にしたという見方は世界史上の重要な因果関係として広く共有されているが、その因果の必然性の程度については議論の余地がある。'} },

  // ===================== イスラームの成立と正統カリフ時代 =====================
  { id:'pre_islamic_arabia', name:'イスラーム以前のアラビア', category:'event', lat:21.42, lng:39.83, start:-500, end:610, region:'アラビア半島',
    desc:{background:'アラビア半島の大部分を占める砂漠地帯という厳しい環境が、部族単位の遊牧生活(ベドウィン)と血縁に基づく氏族社会の形成を促した。', process:'多神教信仰(カアバ神殿には多数の部族神が祀られていた)のもとメッカ・メディナなどのオアシス都市が隊商交易(乳香・没薬・香辛料交易)で栄え、部族間の血讐と同盟関係が複雑に絡み合う社会秩序が形成された。', significance:'この部族社会の構造(名誉・血縁・同盟の論理)は、後のイスラーム共同体(ウンマ)が血縁を超えた信仰共同体として提示された際の対比軸として、イスラーム成立の社会的背景を理解する上で重要である。', debate:'イスラーム以前のアラビア社会を「無知の時代(ジャーヒリーヤ)」として全否定的に描くイスラーム側の伝統的史観と、実際には高度に発達した交易・詩文化を持っていたとする近年の再評価との間で、評価の相違がある。'} },
  { id:'muhammad', name:'ムハンマド', category:'person', lat:24.47, lng:39.61, start:570, end:632, region:'アラビア半島(メッカ・メディナ)',
    desc:{background:'メッカの隊商交易社会における貧富の格差拡大と、既存の多神教信仰への宗教的閉塞感が、新たな一神教的啓示への希求を生んだ背景となった。', process:'40歳頃にヒラー山の洞窟で最初の啓示を受けたとされ、当初はメッカで迫害を受けたためメディナへ移住(ヒジュラ)して信仰共同体(ウンマ)を確立し、以後は軍事的・外交的手腕によりメッカを含むアラビア半島の大部分を統一した。', significance:'イスラームという世界宗教の創始者として、その教え(クルアーン)と言行(ハディース)は以後の法体系(シャリーア)・社会秩序の根本規範となり、今日まで世界人口の4分の1近くが信仰する宗教の基盤を築いた。', debate:'後継者選出の方式(血縁世襲か共同体の合意か)について明確な指示を残さなかったことが、彼の死後のスンナ派・シーア派分裂の遠因になったとされ、この点が今日のイスラーム世界の宗派対立の起源として論じられる。'} },
  { id:'hijra', name:'ヒジュラ(聖遷)', category:'event', lat:24.47, lng:39.61, start:622, end:622, region:'メッカ→メディナ',
    desc:{background:'メッカの有力部族(クライシュ族)による迫害の激化が、ムハンマドと信徒たちの移住という決断を促した直接的背景となった。', process:'ムハンマドと信徒たちがメッカからメディナへ移住し、そこで血縁ではなく信仰に基づく新たな共同体(ウンマ)を樹立する「メディナ憲章」を締結した。', significance:'この移住の年(622年)がイスラーム暦(ヒジュラ暦)の紀元と定められ、血縁・部族を超えた信仰共同体という画期的な社会統合原理の実現という点で、イスラーム史における最重要の画期とされる。', debate:'「メディナ憲章」がユダヤ教徒を含む多宗教共存の先駆的文書であったとする評価と、実際にはムハンマドの政治的・軍事的指導権確立が主眼であったとする見方との間で、その理念的意義の評価が分かれる。'} },
  { id:'rashidun_caliphate', name:'正統カリフ時代', category:'nation', lat:24.47, lng:39.61, start:632, end:661, region:'アラビア半島・シリア・メソポタミア・エジプト',
    relatedIds:['muhammad','abu_bakr','umar_i','uthman','ali','islamic_conquests','battle_yarmouk','battle_qadisiyyah','first_fitna'],
    desc:{background:'ムハンマドが後継者選出の明確な方式を残さずに没したことが、共同体の合意(選挙的推戴)による指導者選出という統治形態の背景となった。', process:'アブー=バクル・ウマル・ウスマーン・アリーの4代が相次いで指導者(カリフ)となり、この間にアラビア半島統一の完成、ビザンツ・サーサーン両帝国からのシリア・エジプト・イラク・イラン征服という急速な大征服を成し遂げたが、後半は暗殺と内乱(第一次フィトナ)が相次ぎ統治は不安定化した。', significance:'後世スンナ派から「正統カリフ」として理想化される時代であり、この急速な大征服はイスラーム世界の地理的基盤を確立した画期的な過程である。', debate:'4代のうち3代までが暗殺されるという事実は、「理想の時代」という後世の理想化とは裏腹に、この時代がすでに深刻な政治的対立を内包していたことを示しており、この乖離をどう理解すべきかが論じられる。'} },
  { id:'abu_bakr', name:'アブー=バクル', category:'person', parentId:'rashidun_caliphate', lat:24.47, lng:39.61, start:573, end:634, region:'正統カリフ時代',
    desc:{background:'ムハンマドの最も早期の改宗者かつ最も信頼された側近であったことが、共同体による初代カリフ選出の背景となった。', process:'ムハンマド死去直後に発生したアラビア各地の部族による背教・離反運動(リッダ戦争)を武力で鎮圧し、共同体の統一を回復させた。', significance:'この鎮圧がなければイスラーム共同体はムハンマドの死とともに瓦解していた可能性が高く、彼の指導力は後の大征服を可能にする統一的基盤を保持した点で決定的な意義を持つ。', debate:'この鎮圧戦争を「正統な統治権の防衛」とみるか、実際には多様な政治的・経済的動機(部族間の主導権争い)を伴う複雑な内戦であったとみるかで、初期イスラーム史研究における解釈が分かれる。'} },
  { id:'umar_i', name:'ウマル1世', category:'person', parentId:'rashidun_caliphate', lat:31.78, lng:35.22, start:584, end:644, region:'正統カリフ時代',
    desc:{background:'アブー=バクルの遺言による指名という異例の継承手続きが、彼の即位の背景となった。', process:'ビザンツ・サーサーン両帝国への大規模な征服戦争を主導しシリア・エジプト・イラク・イランを次々と征服する一方、征服地の統治のため軍営都市(ミスル)の建設や徴税制度・行政組織を体系的に整備した。', significance:'「カリフ」の称号を正式に確立し、征服地統治の制度的基盤を築いた点で、イスラーム帝国の実質的な建設者と評価される。', debate:'征服した非ムスリム住民への統治方針(人頭税ジズヤを課しつつ信仰の自由を認める「庇護民(ズィンミー)」制度)がどこまで寛容であったか、その実態評価が論じられる。'} },
  { id:'uthman', name:'ウスマーン', category:'person', parentId:'rashidun_caliphate', lat:24.47, lng:39.61, start:579, end:656, region:'正統カリフ時代',
    desc:{background:'ウマイヤ家出身という有力氏族の後ろ盾と、共同体内の合議(シューラー)による選出が、彼の即位の背景となった。', process:'クルアーンの標準テキストを確定し公式版として全土に配布する事業を主導した一方、自らの一族(ウマイヤ家)を要職に多数登用したことが「縁故主義」との批判を招き、これに反発した反乱勢力により自邸を包囲され殺害された。', significance:'クルアーンの正典化(ウスマーン版)は以後のイスラーム世界で唯一の標準テキストとして今日まで受け継がれる、宗教史上決定的な事業であった。', debate:'彼の暗殺が正統カリフ時代の平和的統治の終焉と第一次フィトナ(内乱)の直接的引き金となったことから、その統治(特に縁故主義への批判)の妥当性評価がスンナ派・シーア派双方の歴史認識に影響している。'} },
  { id:'ali', name:'アリー(アリー・イブン・アビー・ターリブ)', category:'person', parentId:'rashidun_caliphate', lat:32.03, lng:44.40, start:601, end:661, region:'正統カリフ時代',
    desc:{background:'ムハンマドの従弟かつ娘婿という血縁関係が、後にシーア派が彼を唯一の正統な後継者とみなす教義的根拠となった。', process:'ウスマーン暗殺後にカリフに選出されたが、暗殺者の処罰を求めるムアーウィヤ(ウマイヤ家)との対立からラクダの戦い・スィッフィーンの戦いという内乱(第一次フィトナ)を戦い、最終的にハワーリジュ派の一員により暗殺された。', significance:'彼の血統(子孫)のみが正統な指導者(イマーム)であるとするシーア派の教義的核心を形成し、彼の暗殺と息子フサインのカルバラーでの殉教は、シーア派の宗教的アイデンティティの根幹をなす悲劇として今日まで記憶されている。', debate:'スンナ派が彼を「正統カリフ」の一人として位置づけるのに対しシーア派は彼を特別な宗教的権威(初代イマーム)とみなしており、この評価の相違自体がスンナ・シーア分裂の核心を体現している。'} },
  { id:'islamic_conquests', name:'イスラームの大征服', category:'war', lat:33.51, lng:36.29, start:633, end:751, region:'西アジア・北アフリカ・イベリア半島',
    desc:{background:'アラビア半島統一直後のイスラーム共同体が、疲弊しきったビザンツ・サーサーン両帝国という好機を捉えたことが、急速な大征服の背景となった。', process:'ヤルムークの戦い・カーディシーヤの戦いでの勝利を経てシリア・エジプト・イラクを制圧し、さらにサーサーン朝を完全に滅ぼしてイラン高原全域、西方では北アフリカを経てイベリア半島にまで版図を拡大した。', significance:'わずか1世紀足らずでインダス川からイベリア半島に至る史上最大級の帝国を築き、この地域における言語(アラビア語)・宗教(イスラーム)の版図を今日に至るまで規定する世界史上の一大転換点となった。', debate:'この急速な征服の成功要因を、被征服民にとってビザンツ・サーサーン両帝国の重税支配よりイスラーム統治(比較的軽い人頭税)の方が受け入れやすかったという社会経済的要因に求めるか、信仰に基づく軍事的士気の高さに求めるかで議論がある。'} },
  { id:'battle_yarmouk', name:'ヤルムークの戦い', category:'war', lat:32.75, lng:35.75, start:636, end:636, region:'シリア・ヨルダン国境(ヤルムーク川)',
    desc:{background:'ビザンツ皇帝ヘラクレイオスが、急速に拡大するイスラーム軍の脅威に対し大軍を編成して迎撃を図ったことが背景となった。', process:'ハーリド=イブン=アル=ワリード率いるイスラーム軍が、数的に優勢なビザンツ軍を巧みな騎兵戦術と地形利用により壊滅的に打ち破った。', significance:'この勝利によりビザンツ帝国はシリア・パレスチナへの支配を事実上放棄せざるを得なくなり、以後のイスラーム勢力による中東地域の恒久的な支配を決定づけた画期的な戦いとなった。', debate:'この勝敗を分けた決定的要因を、イスラーム軍の戦術的優位に求めるか、ビザンツ軍内部の指揮系統の混乱・士気の低さに求めるかで軍事史上の評価が分かれる。'} },
  { id:'battle_qadisiyyah', name:'カーディスィーヤの戦い', category:'war', lat:31.98, lng:44.60, start:636, end:637, region:'イラク(メソポタミア)',
    desc:{background:'疲弊したサーサーン朝ペルシアに対し、イスラーム軍がイラク方面への進出を図ったことが背景となった。', process:'サアド=イブン=アビー=ワッカース率いるイスラーム軍がサーサーン朝の大軍(戦象部隊を含む)を打ち破り、この勝利によりイラク全域への道が開かれた。', significance:'この勝利は事実上サーサーン朝の命運を決定づけ、まもなくの都クテシフォン陥落と最終的な帝国滅亡への決定的な転機となった。', debate:'この戦いの詳細な経過については後世のイスラーム史料による記述に依存する部分が大きく、その戦術的記述がどこまで史実を正確に伝えているかについて史料批判上の課題がある。'} },
  { id:'first_fitna', name:'第1次内乱(第1次フィトナ)', category:'revolution', lat:32.03, lng:44.40, start:656, end:661, region:'イラク・シリア',
    desc:{background:'ウスマーン暗殺という前代未聞の事件が、後継カリフ位と暗殺者処罰の責任をめぐる深刻な政治的対立を引き起こしたことが背景となった。', process:'アリーとムアーウィヤ(ウマイヤ家)との間でラクダの戦い・スィッフィーンの戦いという内戦が戦われ、調停をめぐる対立からアリー支持派の一部が離反してハワーリジュ派を形成し、最終的にアリーがこの分派の一員により暗殺されムアーウィヤがウマイヤ朝を開いた。', significance:'この内乱を機にイスラーム共同体はスンナ派・シーア派という宗派的分裂の決定的な起点を迎え、カリフ制も世襲王朝(ウマイヤ朝)へと性格を変えることとなった。', debate:'この内乱の帰結(アリー家からウマイヤ家への権力移行)を正統な政治的解決とみるか、力による簒奪とみるかは、今日に至るスンナ派・シーア派それぞれの歴史認識の根本的な相違点である。'} },
  { id:'battle_karbala', name:'カルバラーの戦い', category:'war', lat:32.62, lng:44.02, start:680, end:680, region:'イラク(カルバラー)',
    desc:{background:'ウマイヤ朝のヤズィード1世の即位に対し、アリーの子フサインがその正統性を認めず抵抗の姿勢を示したことが背景となった。', process:'少数の同行者と共にクーファへ向かう途中カルバラーの地でウマイヤ朝軍に包囲され、フサインとその一族・従者のほとんどが殺害される凄惨な結果に終わった。', significance:'このフサインの殉教はシーア派における最も重要な宗教的記憶となり、以後毎年「アーシューラー」として盛大に追悼され、不正な権力への抵抗と自己犠牲という宗教的モチーフの中心を成している。', debate:'この事件がシーア派の宗教的アイデンティティ(殉教と悲嘆の宗教的実践)の形成にどこまで決定的であったか、その後の教義的発展との関係が論じられる。'} },

  // ===================== ウマイヤ朝・アッバース朝 =====================
  { id:'umayyad_caliphate', name:'ウマイヤ朝', category:'nation', lat:33.51, lng:36.29, start:661, end:750, region:'シリア中心に西アジア・北アフリカ・イベリア半島',
    relatedIds:['muawiya_i','abd_al_malik','marwan_ii','abbasid_revolution'],
    desc:{background:'第一次フィトナでアリーを退けたムアーウィヤが、カリフ位を世襲王朝として確立したことが建国の背景となった。', process:'都をダマスカスに定めビザンツ風の行政制度を取り入れつつイベリア半島から中央アジアに至る史上最大級の版図を築いたが、アラブ人優遇政策(非アラブ人改宗者マワーリーへの差別)への不満とシーア派・ハワーリジュ派の反発が高まり、アッバース革命により750年に滅ぼされた。', significance:'征服地の急速な拡大によりイスラーム世界の地理的基盤を確立したが、その統治は「アラブ帝国」的性格が強く、これが次のアッバース朝における普遍的なイスラーム帝国への転換を促す反面教師となった。', debate:'この王朝を「世俗的な王権への堕落(神権政治からの後退)」と否定的に評価する伝統的なイスラーム史観に対し、実際の行政的達成(貨幣改革・言語のアラビア語化)を積極的に再評価する近年の研究動向との間で評価が分かれる。'} },
  { id:'muawiya_i', name:'ムアーウィヤ', category:'person', parentId:'umayyad_caliphate', lat:33.51, lng:36.29, start:602, end:680, region:'ウマイヤ朝',
    desc:{background:'ウスマーンの縁者としてシリア総督の地位にあったことと、ウスマーン暗殺者の処罰を求める大義名分が、彼のカリフ位獲得への道を開いた。', process:'第一次フィトナでアリーを事実上退けた後カリフに即位し、都をダマスカスに移して行政機構を整備し、自らの死後の後継者を息子ヤズィードに指名する形でカリフ位を事実上世襲制に転換させた。', significance:'選挙的な正統カリフ制から世襲王朝(ウマイヤ朝)への転換を実現した点で、イスラーム政治史における重要な制度的転換点を体現している。', debate:'この世襲化を「安定的統治のための現実的判断」と評価するか「イスラーム的な合議理念からの逸脱」と評価するかは、カリフ制の理念そのものをめぐる根本的な論争である。'} },
  { id:'abd_al_malik', name:'アブド=アルマリク', category:'person', parentId:'umayyad_caliphate', lat:33.51, lng:36.29, start:646, end:705, region:'ウマイヤ朝',
    desc:{background:'第二次フィトナ(内乱)で動揺した王朝の統治基盤を再建する必要が、彼の治世における制度改革の背景となった。', process:'ビザンツ・サーサーン両様式が混在していた行政言語をアラビア語に統一し、独自のイスラーム様式による貨幣を鋳造して非イスラーム的な象徴の使用を排除し、エルサレムに岩のドームを建設した。', significance:'これらの改革により帝国は名実ともに「イスラーム帝国」としてのアイデンティティを確立し、以後のイスラーム世界における行政・貨幣制度の基本形を築いた。', debate:'岩のドーム建設の主要な目的を、メッカ巡礼に代わる代替聖地の創出とみるか、単に新たな信仰の記念碑的建造物としての宗教的動機とみるかで議論がある。'} },
  { id:'marwan_ii', name:'マルワーン2世', category:'person', parentId:'umayyad_caliphate', lat:33.51, lng:36.29, start:691, end:750, region:'ウマイヤ朝',
    desc:{background:'王朝末期の内紛と、アラブ人優遇への非アラブ人改宗者(マワーリー)の根深い不満が、アッバース革命という王朝転覆の危機の背景となった。', process:'東方ホラーサーン地方を中心に組織されたアッバース家の革命運動軍との戦いに敗れ、逃亡先のエジプトで殺害された。', significance:'彼の敗死をもってウマイヤ朝は滅亡したが、一族の一人アブド=アッラフマーンがイベリア半島に逃れ後ウマイヤ朝を建国し、イスラーム世界の東西分裂という新たな局面を開いた。', debate:'この王朝の滅亡を単なる政変とみるか、アラブ人中心主義から非アラブ人を包摂する普遍的イスラーム帝国への歴史的必然の転換とみるかで評価が分かれる。'} },
  { id:'abbasid_revolution', name:'アッバース革命', category:'revolution', lat:36.30, lng:59.60, start:747, end:750, region:'ホラーサーン(イラン東部)・イラク',
    desc:{background:'ウマイヤ朝のアラブ人優遇政策への非アラブ人改宗者(マワーリー、特にペルシア系)の根深い不満が、この革命運動の社会的基盤となった。', process:'アブー=ムスリムが東方ホラーサーン地方で組織した革命軍がウマイヤ朝を打倒し、預言者の叔父の家系アッバース家を新たなカリフに擁立した。', significance:'この革命によりアラブ人優位の民族的帝国から、アラブ人・ペルシア人など多様な民族を包摂する普遍的なイスラーム帝国へと国家の性格が根本的に転換した。', debate:'この革命の主導的な社会階層(アラブ人の不満分子か、ペルシア系マワーリーの主導性か)についての評価は、この転換の「イスラーム的普遍主義」対「ペルシア的要素の復権」という性格づけと密接に関連する論争点である。'} },
  { id:'abbasid_caliphate', name:'アッバース朝', category:'nation', lat:33.34, lng:44.39, start:750, end:1258, region:'イラク(バグダード)中心に西アジア全域',
    relatedIds:['abu_al_abbas_saffah','al_mansur','harun_al_rashid','al_mamun','house_of_wisdom','fall_of_baghdad_1258'],
    desc:{background:'アッバース革命による非アラブ人を包摂する普遍的イスラーム帝国という理念の実現が、新王朝建設の背景となった。', process:'都をバグダードに移してペルシア的な官僚制・宮廷文化を積極的に取り入れ、ハールーン=アッラシード・マームーンの代に学術・文化(バイト=アルヒクマ=知恵の館)の黄金期を築いたが、10世紀以降は各地に自立政権(ブワイフ朝・セルジューク朝など)が乱立してカリフの実権は形骸化し、1258年のモンゴル軍によるバグダード陥落で滅亡した。', significance:'ギリシア・ペルシア・インドの学術遺産をアラビア語に翻訳する大規模な知的事業を通じてイスラーム文明の黄金時代を築き、この成果は後にヨーロッパのルネサンスにも間接的な影響を与えた。', debate:'10世紀以降の政治的実権喪失にもかかわらずカリフの宗教的権威は長く尊重され続けたことは、政治権力と宗教的正統性が必ずしも一致しない統治形態の興味深い事例として論じられる。'} },
  { id:'abu_al_abbas_saffah', name:'アブー=アルアッバース(サッファーフ)', category:'person', parentId:'abbasid_caliphate', lat:32.03, lng:44.40, start:721, end:754, region:'アッバース朝',
    desc:{background:'アッバース革命の成功により預言者の叔父の家系という血統的正統性を背景に、新王朝の初代カリフに擁立されたことが背景となった。', process:'「サッファーフ(血を流す者)」の異名が示すように、旧ウマイヤ家の一族を徹底的に粛清して新王朝の基盤を固めた。', significance:'この徹底した粛清により旧勢力の復権の芽を摘み、アッバース朝約500年の礎を確固たるものとした。', debate:'この苛烈な粛清が新王朝の安定に不可欠であったか、それとも過度に残忍な措置であったかという評価は、権力移行期における「必要な暴力」の是非を考える事例として論じられる。'} },
  { id:'al_mansur', name:'マンスール', category:'person', parentId:'abbasid_caliphate', lat:33.34, lng:44.39, start:714, end:775, region:'アッバース朝',
    desc:{background:'初代カリフによる王朝基盤の確立を受け、より恒久的な統治拠点の建設が求められたことが背景となった。', process:'ティグリス川岸に円形都市バグダードを新たに建設して遷都し、中央集権的な官僚制と徴税制度を整備してアッバース朝の統治基盤を確固たるものとした。', significance:'バグダードは以後500年にわたりイスラーム世界の政治・学術・文化の中心地であり続け、「平安の都(マディーナ=アッサラーム)」として繁栄を極めた。', debate:'この遷都(旧都ダマスカスからの脱却)が、ウマイヤ朝的なシリア中心の統治からペルシア色の強いメソポタミア中心の統治への転換をどこまで象徴的に体現しているかが論じられる。'} },
  { id:'harun_al_rashid', name:'ハールーン=アッラシード', category:'person', parentId:'abbasid_caliphate', lat:33.34, lng:44.39, start:763, end:809, region:'アッバース朝',
    desc:{background:'父マフディーの代までに確立された王朝の安定と繁栄が、彼の治世における文化的黄金期を可能にする条件を整えていた。', process:'フランク王国のカール大帝との友好的な外交使節の交換など国際的な威信を高め、『千夜一夜物語』の舞台としても知られる宮廷文化の繁栄を築き、学術・芸術の保護者としても知られた。', significance:'後世「アッバース朝の黄金時代」の体現者として理想化され、その治世はイスラーム世界の学術・文化的達成の象徴として広く記憶されている。', debate:'『千夜一夜物語』に描かれる彼のイメージがどこまで史実を反映し、どこまで後世の文学的脚色によるものかは、史実と伝説の境界を考える文学史・歴史学上の課題である。'} },
  { id:'al_mamun', name:'マームーン', category:'person', parentId:'abbasid_caliphate', lat:33.34, lng:44.39, start:786, end:833, region:'アッバース朝',
    desc:{background:'父ハールーン=アッラシードの死後に弟アミーンとの内戦を勝ち抜いたことが、彼の治世における学術振興事業推進の背景となった。', process:'「知恵の館(バイト=アルヒクマ)」を拡充してギリシア・ペルシア・インドの哲学・科学文献を大規模にアラビア語へ翻訳する事業を国家的に推進し、ムウタズィラ派(理性重視の神学)を公認の神学として奨励した。', significance:'この翻訳事業を通じてアリストテレス哲学やユークリッド幾何学などギリシア古典の多くがアラビア語を経由して保存され、後の12世紀ルネサンスを通じてラテン語世界(西欧)に再導入される礎を築いた。', debate:'ムウタズィラ派の教義(クルアーンの被造性など)を国家権力によって強制した「ミフナ(審問)」政策は、後に伝統主義的なスンナ派神学(ハンバル派)の反発を招いており、国家権力による神学統制の是非が論じられる。'} },
  { id:'house_of_wisdom', name:'知恵の館(バイト=アルヒクマ)とイスラーム科学の黄金時代', category:'event', lat:33.34, lng:44.39, start:830, end:1050, region:'バグダード中心にイスラーム世界全域',
    desc:{background:'アッバース朝の繁栄とマームーンら諸カリフの学術奨励政策が、この翻訳・研究機関設立の背景となった。', process:'ギリシア・ペルシア・インドの哲学・医学・数学・天文学の文献を組織的にアラビア語へ翻訳し、フワーリズミーの代数学やイブン=スィーナーの医学など独自の学術的発展も生み出した。', significance:'この知的営為は「イスラーム科学の黄金時代」を築き、ギリシア古典の多くをラテン語世界に再導入する経路(12世紀ルネサンス)としても機能し、西欧の知的発展に間接的だが決定的な貢献をした。', debate:'この機関が単なる翻訳の場であったか、それとも独自の実験・観測を伴う本格的な研究機関であったかについては、史料的制約から実態解明が今なお課題となっている。'} },

  // ===================== 地方王朝群・十字軍・モンゴル・マムルーク =====================
  { id:'fatimid_caliphate', name:'ファーティマ朝', category:'nation', lat:30.04, lng:31.24, start:909, end:1171, region:'北アフリカ・エジプト',
    desc:{background:'シーア派イスマーイール派の教義に基づき、アリーの血統こそが正統なカリフであるとする信念のもと北アフリカで勢力を築いたことが建国の背景となった。', process:'エジプトを征服してカイロを新首都に建設し、スンナ派アッバース朝に対抗する独自のカリフを称して東地中海交易の覇権を握り学術機関アズハルを設立したが、内紛と十字軍・セルジューク朝の圧力により衰退し、最終的にサラディンにより1171年に滅ぼされた。', significance:'スンナ派カリフに対抗する形でシーア派カリフ国家を打ち立てた稀有な事例として、イスラーム世界における宗派間の政治的対立の具体例を示す重要な事例である。', debate:'この王朝が実際にどこまでシーア派教義の布教に成功したか(エジプト住民の大多数はスンナ派にとどまった)、宗教的理念と統治の現実政治とのギャップが論じられる。'} },
  { id:'seljuk_empire', name:'セルジューク朝', category:'nation', lat:33.34, lng:44.39, start:1037, end:1194, region:'イラン・イラク・アナトリア',
    relatedIds:['alp_arslan','nizam_al_mulk','battle_manzikert'],
    desc:{background:'中央アジアの遊牧トルコ系民族セルジューク家が、イスラーム化を進めつつイラン・イラク方面へ進出したことが建国の背景となった。', process:'アッバース朝カリフから「スルタン」の称号を得て実権を掌握し、ビザンツ帝国を破って(マンジケルトの戦い)アナトリアへの進出の道を開いたが、内紛により東西に分裂して弱体化した。', significance:'トルコ系民族による中東イスラーム世界への本格的な進出の先駆けとなり、後のオスマン帝国に至るトルコ系イスラーム王朝の伝統を確立した。', debate:'遊牧民出身の征服者がいかにして急速に定住的なイスラーム官僚統治(ニザーム=アルムルクによる制度整備)を確立し得たか、その統治の混成的性格が論じられる。'} },
  { id:'alp_arslan', name:'アルプ=アルスラーン', category:'person', parentId:'seljuk_empire', lat:39.15, lng:42.53, start:1029, end:1072, region:'セルジューク朝',
    desc:{background:'先代トゥグリル=ベクが築いた帝国基盤の上に、ビザンツ帝国とのアナトリア方面での対決が必要とされたことが治世の背景となった。', process:'マンジケルトの戦いでビザンツ皇帝ロマノス4世率いる大軍を撃破し、ビザンツ帝国のアナトリア支配に決定的な打撃を与えた。', significance:'この勝利によりトルコ系民族のアナトリア半島への本格的な移住・定着が始まり、以後のこの地域のトルコ化・イスラーム化の出発点となった。', debate:'この勝利が単発的な軍事的成功にとどまらず、なぜ以後数世紀に及ぶアナトリアの民族構成の根本的変容をもたらしたのか、その長期的影響の大きさが論じられる。'} },
  { id:'battle_manzikert', name:'マンジケルトの戦い', category:'war', lat:39.15, lng:42.53, start:1071, end:1071, region:'アナトリア東部',
    desc:{background:'セルジューク朝の勢力拡大に対しビザンツ皇帝ロマノス4世が大軍を編成して迎撃を図ったことが背景となった。', process:'ビザンツ軍内部の指揮系統の混乱と裏切りも重なりセルジューク軍に大敗し、皇帝自身が捕虜となる屈辱的な結果に終わった。', significance:'この敗北を機にビザンツ帝国のアナトリア支配は事実上崩壊し、以後この地域は急速にトルコ化・イスラーム化が進み、後のオスマン帝国建国の地理的基盤ともなった。', debate:'この一戦の敗北がビザンツ帝国衰退の決定的な転換点であったとする見方が広く共有される一方、その後も帝国自体は3世紀以上存続し続けたことから、この戦いの影響の即時性・長期性についての評価に幅がある。'} },
  { id:'nizam_al_mulk', name:'ニザーム=アルムルク', category:'person', parentId:'seljuk_empire', lat:33.34, lng:44.39, start:1018, end:1092, region:'セルジューク朝',
    desc:{background:'トルコ系遊牧民出身の征服者であるセルジューク朝が、定住的な統治のためペルシア的な官僚制の専門知識を必要としたことが、彼の登用の背景となった。', process:'宰相として税制・軍制・行政制度を体系的に整備し、各地にニザーミーヤ学院と呼ばれるスンナ派神学校網を設立してシーア派(特にファーティマ朝)への対抗イデオロギーの拠点とした。', significance:'この学院網は後のマドラサ(イスラーム神学校)制度の基本モデルとなり、スンナ派イスラーム法学・神学の組織的教育制度を確立する画期的な事業であった。', debate:'彼の暗殺(暗殺教団=ニザール派イスマーイール派の関与とされる)は、当時のスンナ派・シーア派対立の激しさを象徴する事件として、その政治的背景の解明が論じられる。'} },
  { id:'crusades_levant', name:'十字軍(レヴァント方面)', category:'war', lat:31.77, lng:35.21, start:1096, end:1291, region:'シリア・パレスチナ',
    desc:{background:'セルジューク朝によるビザンツ領アナトリアの征服とエルサレム巡礼路の脅威を訴えるビザンツ皇帝の要請に応じ、教皇ウルバヌス2世が聖地奪回を呼びかけたことが背景となった。', process:'第1回十字軍(1096-99年)がエルサレムを含む十字軍国家群を建設したが、サラディンによるエルサレム奪還(1187年)を機に劣勢に転じ、以後200年近く断続的な遠征が繰り返されたが1291年のアッコン陥落をもって十字軍国家は完全に消滅した。', significance:'この一連の遠征を通じて東西交易の活性化やイスラーム世界の学術・文物の西欧への流入が進み、意図せざる形でヨーロッパのルネサンスの遠因の一つとなったとされる。', debate:'十字軍を「宗教的情熱に基づく聖戦」とみるか「西欧諸侯の領土的・経済的野心の宗教的偽装」とみるかは、宗教運動と世俗的利害の関係を考える上で最も重要な論争の一つである。'} },
  { id:'ayyubid_dynasty', name:'アイユーブ朝', category:'nation', lat:30.04, lng:31.24, start:1171, end:1250, region:'エジプト・シリア',
    desc:{background:'十字軍国家との対峙とファーティマ朝の弱体化という状況の中、クルド系の武将サラディンが実権を掌握したことが建国の背景となった。', process:'ファーティマ朝を廃してスンナ派への復帰を実現し、エジプト・シリアを統合してヒッティーンの戦いで十字軍に大勝しエルサレムを奪還したが、サラディン死後は一族間の分裂により弱体化し、最終的にマムルーク(奴隷軍人)により1250年に取って代わられた。', significance:'シーア派ファーティマ朝からスンナ派への復帰を実現し、十字軍に対する反攻の最盛期を築いた王朝として、イスラーム世界の統合と対十字軍戦争の転換点となった。', debate:'サラディンのエルサレム再征服時の寛大な処置(十字軍側のエルサレム占領時の虐殺とは対照的)が、後世どこまで理想化・脚色されたものかについて史料批判上の検討が必要である。'} },
  { id:'saladin', name:'サラーフ=アッディーン(サラディン)', category:'person', parentId:'ayyubid_dynasty', lat:31.77, lng:35.21, start:1137, end:1193, region:'アイユーブ朝',
    desc:{background:'クルド系の武将としてザンギー朝に仕えエジプト遠征に従軍した経験が、ファーティマ朝の実権掌握とその後の独自王朝樹立の背景となった。', process:'ファーティマ朝を廃してエジプトをスンナ派に復帰させ、シリア・エジプトを統合してヒッティーンの戦いで十字軍に決定的勝利を収めエルサレムを奪還し、この際住民への報復を控える寛大な処置をとった。', significance:'イスラーム世界では十字軍撃退の英雄として、西欧世界でも「高潔な騎士道の体現者」として肯定的に描かれる稀有な事例であり、東西双方で理想化された歴史的人物となっている。', debate:'西欧における彼への肯定的評価(「高潔な敵」としての称賛)が、実際の史実に基づくものか、十字軍側の自己正当化のための「立派な敵」という物語装置として機能した側面もあるかが論じられる。'} },
  { id:'battle_hattin', name:'ハッティンの戦い', category:'war', lat:32.81, lng:35.45, start:1187, end:1187, region:'パレスチナ(ガリラヤ)',
    desc:{background:'十字軍国家(エルサレム王国)内部の指導者間の対立と、サラディンによる巧みな挑発戦術が、この決戦の背景となった。', process:'水の乏しい荒野に十字軍を誘い込んで包囲し、渇きと疲労で消耗した十字軍を壊滅させ、エルサレム王を含む多数の指導者を捕虜とした。', significance:'この勝利により十字軍の軍事力は事実上壊滅し、まもなくのエルサレム奪還への道を開いた、十字軍戦争史上最大の転換点となった戦いである。', debate:'十字軍側の水源選定・行軍判断の誤りが敗因としてどこまで決定的であったか、サラディン側の戦略的巧緻さとの比重が軍事史上論じられる。'} },
  { id:'mongol_invasion_middle_east', name:'モンゴルの西アジア侵攻', category:'war', lat:33.34, lng:44.39, start:1219, end:1260, region:'中央アジア・イラン・イラク',
    relatedIds:['hulagu_khan','fall_of_baghdad_1258','battle_ain_jalut'],
    desc:{background:'モンゴル帝国の西方拡大政策のもと、フビライの兄フラグが西アジア征服を命じられたことが、この遠征の背景となった。', process:'フラグ=ハン率いるモンゴル軍がバグダードを包囲・陥落させアッバース朝カリフを処刑し、さらにシリア方面へ進撃したが、マムルーク朝のアイン=ジャールートの戦いでの勝利により西方への拡大は阻まれた。', significance:'500年続いたアッバース朝カリフ制の終焉という象徴的意義とともに、バグダードの灌漑システムや図書館(知恵の館)の破壊はイスラーム世界の学術的中心地としての地位の喪失を招いた。', debate:'このモンゴル軍のバグダード破壊がイスラーム世界の学術的衰退の決定的な転換点であったとする見方と、実際にはすでに政治的分裂により学術の中心が各地に分散していたとする見方との間で、その影響の程度が論じられる。'} },
  { id:'hulagu_khan', name:'フラグ(フレグ)', category:'person', parentId:'mongol_invasion_middle_east', lat:33.34, lng:44.39, start:1218, end:1265, region:'モンゴル帝国(イルハン朝)',
    desc:{background:'兄モンケ=ハンの命によりイル=ハン国建設のための西方遠征を担ったことが、彼の軍事行動の背景となった。', process:'バグダードを包囲・破壊してアッバース朝カリフを処刑し、さらにシリア方面へ進撃したが、モンケ=ハンの急死による本国への帰還準備でシリア方面の軍を大きく減らしたことがアイン=ジャールートでの敗北の一因となった。', significance:'アッバース朝を滅ぼしイル=ハン国を建国したが、後にイスラームへ改宗する子孫の代には征服者自身がイスラーム文化に同化していくという、遊牧征服王朝に共通するパターンを体現している。', debate:'モンケ死去による軍の縮小という「偶然」がアイン=ジャールートでの敗北、ひいてはモンゴルのエジプト征服失敗にどこまで決定的であったかという「if」の議論がなされる。'} },
  { id:'fall_of_baghdad_1258', name:'バグダード陥落(アッバース朝の滅亡)', category:'event', lat:33.34, lng:44.39, start:1258, end:1258, region:'イラク(バグダード)',
    desc:{background:'アッバース朝カリフがモンゴルへの服属要求を拒否したことが、フラグ=ハンによる懲罰的遠征の直接的契機となった。', process:'モンゴル軍がバグダードを包囲し陥落させ、最後のアッバース朝カリフを処刑、大規模な虐殺と破壊(灌漑システム・図書館の破壊を含む)を行った。', significance:'500年続いたアッバース朝カリフ制の完全な終焉を意味し、バグダードはこの破壊以降二度と往時の学術・文化的中心地としての地位を回復することはなかった。', debate:'この破壊がイスラーム世界の「黄金時代」の終わりを象徴する決定的事件として描かれることの妥当性、実際の長期的影響の程度が論じられる。'} },
  { id:'ilkhanate', name:'イルハン朝', category:'nation', lat:38.08, lng:46.29, start:1256, end:1335, region:'イラン・イラク',
    desc:{background:'フラグ=ハンによる西アジア征服の後、その子孫が現地に留まり統治を継続したことがこの国家の建国背景となった。', process:'当初は仏教・キリスト教・シャーマニズムなど多様な信仰を許容する統治を行ったが、ガザン=ハンの代にイスラームへの改宗を宣言し、以後は完全にイスラーム化・ペルシア化した統治を進めた。', significance:'征服王朝が現地の宗教・文化に同化していく過程を象徴する事例として、モンゴル帝国の各継承国家に共通するパターン(元朝の中国化、キプチャク=ハン国のイスラーム化)の一例をなす。', debate:'この改宗が純粋な信仰上の選択か、現地統治の正統性確保のための政治的判断であったかが論じられる。'} },
  { id:'battle_ain_jalut', name:'アイン=ジャールートの戦い', category:'war', lat:32.55, lng:35.45, start:1260, end:1260, region:'パレスチナ北部',
    desc:{background:'モンゴル軍のシリア方面進撃に対し、エジプトを拠点とするマムルーク朝が防衛の最終防波堤として迎撃を図ったことが背景となった。', process:'モンケ=ハン急死によりフラグが主力を率いて帰還し手薄になったモンゴル軍を、マムルーク朝のスルタン・クトゥズと将軍バイバルスがパレスチナで撃破した。', significance:'モンゴル軍がそれまで無敗を誇っていた中で初めて決定的な敗北を喫した戦いとして、モンゴル帝国の西方拡大の限界を画す世界史上の重要な転換点となった。', debate:'この勝利の要因を、マムルーク軍の卓越した戦術に求めるか、モンケの急死という偶然的要因(モンゴル軍主力の撤退)に求めるかで議論が分かれる。'} },
  { id:'mamluk_sultanate', name:'マムルーク朝', category:'nation', lat:30.04, lng:31.24, start:1250, end:1517, region:'エジプト・シリア',
    relatedIds:['baybars','battle_ain_jalut'],
    desc:{background:'アイユーブ朝が軍事力の中核として用いていた奴隷軍人(マムルーク)が、王朝の弱体化に乗じて実権を掌握したことが建国の背景となった。', process:'モンゴル軍をアイン=ジャールートで撃退し、さらに残存していた十字軍国家群も次々と攻略して1291年のアッコン陥落で完全に一掃したが、16世紀初頭にオスマン帝国の攻撃を受け1517年に滅亡した。', significance:'モンゴル軍撃退と十字軍完全排除という二重の歴史的偉業を成し遂げ、以後250年以上エジプト・シリアを支配する安定政権として東地中海交易の覇権を握った。', debate:'奴隷出身者(マムルーク)が統治者として世襲によらない実力主義的な後継システムを維持し得た統治構造の独自性が、他のイスラーム王朝との比較で論じられる。'} },
  { id:'baybars', name:'バイバルス', category:'person', parentId:'mamluk_sultanate', lat:30.04, lng:31.24, start:1223, end:1277, region:'マムルーク朝',
    desc:{background:'マムルーク(奴隷軍人)としての軍事的実績がアイン=ジャールートの戦いでの活躍を経てスルタン位獲得の背景となった。', process:'モンゴル軍撃退の功績を背景に前スルタンを殺害して自ら即位し、残存する十字軍国家を次々と攻略、暗殺教団(ニザール派)の拠点も制圧して国内の統治基盤を固めた。', significance:'マムルーク朝の実質的な建国者として、モンゴル・十字軍という二大脅威への対処を通じてエジプト・シリアの安定的統治体制を確立した。', debate:'前スルタン暗殺による権力掌握という経緯が、マムルーク朝における「実力による継承」という統治原理の典型例としてどう評価されるべきかが論じられる。'} },

  // ===================== オスマン帝国とサファヴィー朝 =====================
  { id:'ottoman_empire', name:'オスマン帝国', category:'nation', lat:41.01, lng:28.98, start:1299, end:1922, region:'アナトリア中心に西アジア・北アフリカ・南東欧',
    relatedIds:['osman_i','mehmed_ii','selim_i','suleiman_i','battle_chaldiran','ottoman_safavid_wars','tanzimat','abdulhamid_ii','young_turk_revolution','wwi_middle_east'],
    desc:{background:'セルジューク朝の弱体化とモンゴルの侵攻による混乱で生じたアナトリアの政治的空白の中、トルコ系の一小侯国が台頭したことが建国の背景となった。', process:'メフメト2世によるコンスタンティノープル陥落(1453年)、スレイマン1世の代の最盛期を経て、東欧・北アフリカ・中東に及ぶ広大な版図を支配したが、18世紀以降は軍事的停滞と欧州列強の圧力(「東方問題」)により領土を次第に喪失し、第一次世界大戦の敗北により1922年に滅亡した。', significance:'600年以上存続したイスラーム世界最大級の帝国として、多民族・多宗教を包摂するミッレト制による統治は、後の中東・バルカン諸国の民族問題の歴史的背景を形作っている。', debate:'「ヨーロッパの病人」という19世紀の蔑称に象徴される衰退史観に対し、近年はオスマン帝国の統治制度の柔軟性・適応力を再評価する研究が進み、単純な「停滞と衰退」の物語を見直す動きが強まっている。'} },
  { id:'osman_i', name:'オスマン1世', category:'person', parentId:'ottoman_empire', lat:40.18, lng:29.06, start:1258, end:1326, region:'オスマン帝国',
    desc:{background:'アナトリア西部の辺境(ガーズィー=対ビザンツ戦士)の一小侯国の指導者として、ビザンツ帝国領への軍事的拡大の機会を捉えたことが建国の背景となった。', process:'ビザンツ帝国領への攻撃を繰り返し勢力を拡大し、自らの名(オスマン)にちなむオスマン侯国を樹立してその後の帝国発展の礎を築いた。', significance:'600年以上続くオスマン帝国の始祖として、その名は王朝全体の呼称(オスマン朝)としても用いられ続けている。', debate:'建国当初の実態については同時代史料が乏しく、後世の年代記が理想化・伝説化して描いている部分が多いため、史実の再構成には史料批判上の困難が伴う。'} },
  { id:'mehmed_ii', name:'メフメト2世(征服王)', category:'person', parentId:'ottoman_empire', lat:41.01, lng:28.98, start:1432, end:1481, region:'オスマン帝国',
    desc:{background:'父ムラト2世の代までに蓄積された軍事力を背景に、ビザンツ帝国の最後の拠点である都コンスタンティノープル攻略という宿願の実現を志向したことが治世の背景となった。', process:'巨大な大砲(ウルバンの大砲)を用いた大規模な包囲戦の末、1453年にコンスタンティノープルを陥落させてビザンツ帝国を完全に滅ぼし、征服者の称号を得た。', significance:'この陥落は千年以上続いた東ローマ帝国の終焉を告げる世界史上の一大画期であり、多くの歴史家がこれを中世の終わりと近代の始まりを画する象徴的事件とみなしている。', debate:'コンスタンティノープル陥落を「中世の終わり」の象徴的画期とする伝統的な時代区分は、実際にはより緩やかな移行過程を単純化しすぎているとする批判があり、時代区分論として議論される。'} },
  { id:'selim_i', name:'セリム1世', category:'person', parentId:'ottoman_empire', lat:41.01, lng:28.98, start:1470, end:1520, region:'オスマン帝国',
    desc:{background:'父バヤズィト2世との激しい後継争いを勝ち抜いたことが、彼の東方(サファヴィー朝・マムルーク朝)への積極的な軍事拡張路線の背景となった。', process:'チャルディラーンの戦いでサファヴィー朝を破り、さらにマムルーク朝を滅ぼしてエジプト・シリア・アラビア半島(メッカ・メディナを含む)を征服し、この地の支配権とともに「カリフ」の称号を継承したとされる。', significance:'この征服によりオスマン帝国はイスラーム世界の政治的中心地(聖地含む)を掌握し、スンナ派イスラーム世界における最有力国家としての地位を確立した。', debate:'オスマン朝によるカリフ位継承の史実性(後世の政治的正当化のための創作かどうか)については史料的根拠が乏しく、歴史学上の論争が続いている。'} },
  { id:'battle_chaldiran', name:'チャルディランの戦い', category:'war', lat:39.11, lng:44.13, start:1514, end:1514, region:'アナトリア東部・イラン国境',
    desc:{background:'スンナ派オスマン帝国とシーア派サファヴィー朝の宗教的・政治的対立が、この決戦の背景となった。', process:'オスマン帝国の火器(大砲・銃)を活用した戦術が、サファヴィー朝の伝統的な騎兵戦術を圧倒し決定的勝利を収めた。', significance:'この勝利によりオスマン帝国は東部アナトリアの支配を確立し、以後両国間の国境線(現在のトルコ・イラン国境の原型)が定まる契機となった。', debate:'火器の有無という技術的要因が、この戦いの帰趨をどこまで決定づけたか、軍事技術革新と伝統的戦術との対比が軍事史上の重要な論点である。'} },
  { id:'suleiman_i', name:'スレイマン1世(壮麗帝)', category:'person', parentId:'ottoman_empire', lat:41.01, lng:28.98, start:1494, end:1566, region:'オスマン帝国',
    desc:{background:'父セリム1世の征服により拡大した広大な版図の統治体制を、より洗練された形で整備する必要が治世の背景となった。', process:'「立法者(カーヌーニー)」と呼ばれる法体系の整備、ウィーン包囲(1529年)に象徴される中欧への軍事的圧力、地中海・紅海における海軍力の展開などを通じて帝国の最盛期を築いた。', significance:'オスマン帝国の政治・軍事・文化のあらゆる面で頂点を極めた時代の体現者として、西欧では「壮麗王」の異名で恐れられた。', debate:'ウィーン包囲失敗の要因を、補給線の伸長・季節的制約(冬の到来)に求めるか、ハプスブルク側の防衛の巧みさに求めるかで軍事史上の議論がある。'} },
  { id:'ottoman_safavid_wars', name:'オスマン・サファヴィー戦争', category:'war', lat:33.34, lng:44.39, start:1532, end:1639, region:'イラク・アナトリア東部・コーカサス',
    desc:{background:'スンナ派オスマン帝国とシーア派サファヴィー朝という宗派の異なる二大イスラーム帝国が、メソポタミア・カフカス地方の覇権をめぐり対立したことが背景となった。', process:'16〜18世紀を通じて断続的に繰り返され、イラク(バグダードなど)の支配権が両国間で度々入れ替わったが、決定的な勝敗はつかず長期的な国境紛争として推移した。', significance:'この対立を通じて形成された両国間の国境線は現在のトルコ・イラン国境の原型となり、この地域における現在のスンナ派・シーア派の分布にも大きな影響を残した。', debate:'この対立を純粋な宗派対立とみるか、領土・交易路をめぐる世俗的な国家間対立が宗教的言説で正当化されたにすぎないとみるかで議論がある。'} },
  { id:'tanzimat', name:'タンジマート(恩恵改革)', category:'event', lat:41.01, lng:28.98, start:1839, end:1876, region:'オスマン帝国',
    desc:{background:'帝国各地での民族主義運動の高まりと欧州列強の圧力(「東方問題」)への対応として、西欧的な近代化改革の必要性が認識されたことが背景となった。', process:'ギュルハネ勅令(1839年)を皮切りに法の下の平等・徴税制度改革・近代的軍制の導入など広範な西欧化改革を進めたが、伝統的なイスラーム法(シャリーア)との整合性や既得権益層の抵抗という困難に直面した。', significance:'この改革はオスマン帝国内の非ムスリム住民(キリスト教徒・ユダヤ教徒)にも形式的な法的平等を認めるものであり、後の青年トルコ革命に至る立憲主義的改革運動の先駆けとなった。', debate:'この改革が帝国の実質的な近代化・延命に寄与したとみるか、表面的な制度導入にとどまり実質的な統治構造の変革には至らなかったとみるかで評価が分かれる。'} },
  { id:'midhat_pasha', name:'ミドハト=パシャ', category:'person', parentId:'ottoman_empire', lat:41.01, lng:28.98, start:1822, end:1884, region:'オスマン帝国',
    desc:{background:'タンジマート改革の理念を継承し、より立憲主義的な統治体制の確立を志向する改革派官僚として台頭したことが背景となった。', process:'オスマン帝国初の近代的憲法(1876年憲法)の起草を主導しアブドゥルハミト2世を擁立したが、この憲法は露土戦争の勃発を口実にわずか2年で停止され、彼自身も後に追放・暗殺された。', significance:'「青年オスマン人」の理念を体現したこの試みは短命に終わったものの、後の青年トルコ革命(1908年)による憲法復活の理念的先駆けとなった。', debate:'この憲法停止をアブドゥルハミト2世個人の専制志向に帰すか、当時の対外的危機(露土戦争)という状況的要因を重視すべきかで議論がある。'} },
  { id:'abdulhamid_ii', name:'アブデュルハミト2世', category:'person', parentId:'ottoman_empire', lat:41.01, lng:28.98, start:1842, end:1918, region:'オスマン帝国',
    desc:{background:'露土戦争という対外的危機の勃発が、彼による1876年憲法の停止と専制統治への回帰の口実となった。', process:'憲法・議会を停止して30年以上に及ぶ専制的な統治(「暗黒時代」とも呼ばれる)を行い、汎イスラーム主義を掲げて帝国の統合を図る一方、アルメニア人虐殺事件など少数民族への弾圧も行ったが、青年トルコ革命により1908年に憲法復活を強いられ、翌年廃位された。', significance:'その専制的統治への反発が青年トルコ革命という立憲革命を招き、これが最終的にオスマン帝国の解体と共和政トルコへの移行という長期的な政治変動の起点となった。', debate:'彼の統治を単純な「専制と抑圧」の時代とみるか、帝国存続のための現実的な統治判断(汎イスラーム主義による求心力維持)を含んでいたとみるかで評価が分かれる。'} },
  { id:'young_turk_revolution', name:'青年トルコ革命', category:'revolution', lat:41.01, lng:28.98, start:1908, end:1908, region:'オスマン帝国',
    desc:{background:'アブドゥルハミト2世の専制統治への軍・知識人層の不満が、立憲主義を求める秘密結社「統一と進歩委員会」の結成という形で結集したことが背景となった。', process:'軍を中心とする蜂起により1876年憲法の復活を強制し、翌年アブドゥルハミト2世を廃位に追い込んだが、その後の統一派政権は次第に強権化し第一次世界大戦への参戦とアルメニア人虐殺という悲劇的結末を招いた。', significance:'立憲主義への転換という当初の理念とは裏腹に、最終的には帝国崩壊への道を加速させる結果となり、革命後のトルコ民族主義の高揚は後のケマル=アタテュルクによる共和国建国の思想的土壌ともなった。', debate:'当初の理想主義的な立憲革命がなぜ第一次世界大戦参戦という破局的な結末に至ったのか、統一派内部の急進化の過程が論じられる。'} },
  { id:'safavid_dynasty', name:'サファヴィー朝', category:'nation', lat:38.08, lng:46.29, start:1501, end:1736, region:'イラン',
    relatedIds:['ismail_i','abbas_i','battle_chaldiran'],
    desc:{background:'スーフィー教団(サファヴィー教団)を母体とする軍事勢力が、シーア派イスマーイール派の信仰を掲げてイラン高原統一を目指したことが建国の背景となった。', process:'イスマーイール1世が建国しシーア派十二イマーム派をイランの国教と定めて以後今日まで続くイランのシーア派国家としてのアイデンティティを確立し、アッバース1世の代に最盛期を築いたが、内紛とアフガン系勢力の侵攻により1736年に事実上滅亡した。', significance:'シーア派国教化はイランを周辺のスンナ派イスラーム世界(オスマン帝国など)と宗教的に区別する決定的な画期となり、現在のイランのシーア派国家としてのアイデンティティの直接の起源となった。', debate:'シーア派国教化が、当時イラン高原の住民の多くがスンナ派であった状況からどのように強制的・段階的に転換されたのか、その社会史的過程の解明が今なお課題である。'} },
  { id:'ismail_i', name:'イスマーイール1世', category:'person', parentId:'safavid_dynasty', lat:38.08, lng:46.29, start:1487, end:1524, region:'サファヴィー朝',
    desc:{background:'サファヴィー教団の指導者としての宗教的権威と、トルコ系遊牧部族(キジルバシュ)の軍事力を結集したことが、建国の背景となった。', process:'イラン高原を統一してシーア派十二イマーム派を国教と定め、スンナ派オスマン帝国との対立(チャルディラーンの戦いでの敗北)を経験しながらも王朝の基盤を固めた。', significance:'シーア派イランという今日まで続く国家的アイデンティティの創始者として、イラン史上決定的な画期を成した人物である。', debate:'自らを神の化身と称するなど極端な宗教的権威づけを行ったとされる彼の統治理念が、その後の王朝でどこまで継続・希薄化していったかが論じられる。'} },
  { id:'abbas_i', name:'アッバース1世(大帝)', category:'person', parentId:'safavid_dynasty', lat:32.65, lng:51.68, start:1571, end:1629, region:'サファヴィー朝',
    desc:{background:'先代諸王の治世における内紛と軍事的劣勢(オスマン帝国・ウズベクへの領土喪失)という危機的状況が、彼の改革の背景となった。', process:'従来の部族軍(キジルバシュ)への依存を脱し常備軍(グラーム、コーカサス出身の奴隷軍人)を創設して中央集権化を進め、新都イスファハーンを壮麗に整備し、オランダ・イギリスとの交易を通じて経済的繁栄を築いた。', significance:'「大帝」と称されるサファヴィー朝最盛期の体現者として、イスファハーンは「世界の半分」と讃えられる国際交易・文化の中心地に発展した。', debate:'彼が推し進めた中央集権化(部族軍から常備軍への転換)が、長期的には伝統的な部族エリート層との緊張を生み、王朝後期の弱体化の遠因になったのではないかという評価がある。'} },

  // ===================== 第一次世界大戦・委任統治・新国家の誕生 =====================
  { id:'wwi_middle_east', name:'第一次世界大戦と中東', category:'war', lat:33.51, lng:36.29, start:1914, end:1918, region:'中東全域',
    desc:{background:'第一次世界大戦でオスマン帝国が同盟国側について参戦したことが、中東地域における英仏との全面的な軍事対立の背景となった。', process:'イギリスはアラブ人指導者フサイン=イブン=アリーにアラブ独立を約束してオスマン帝国への反乱(アラブ反乱)を扇動する一方、フランスとサイクス・ピコ協定で戦後の勢力圏分割を密約し、さらにバルフォア宣言でユダヤ人の「民族的郷土」建設も約束するという、相互に矛盾する複数の秘密外交を展開した。', significance:'この三重の矛盾した約束(フサイン=マクマホン書簡・サイクス・ピコ協定・バルフォア宣言)は戦後の中東国境画定と今日まで続くパレスチナ問題の直接的な起源となった。', debate:'この三重外交を「帝国主義的な二枚舌」と断罪する見方が広く共有されているが、当時の戦時外交における複数の同盟相手への配慮という現実的制約をどこまで考慮すべきかも論じられる。'} },
  { id:'hashemite_dynasty', name:'ハーシム家', category:'dynasty', lat:21.42, lng:39.83, start:1916, end:2026, region:'ヒジャーズ→イラク・ヨルダン',
    relatedIds:['hussein_bin_ali','faisal_i_iraq','abdullah_i_jordan','arab_revolt'],
    desc:{background:'預言者ムハンマドの血統を引くとされるメッカのハーシム家が、イギリスとの協力によりアラブ独立運動を主導したことが背景となった。', process:'フサイン=イブン=アリーがアラブ反乱を起こしオスマン帝国に対抗したが、戦後のイギリス・フランスによる委任統治体制のもとで当初の広範なアラブ独立の約束は実現せず、子孫はイラク・ヨルダンの王家として分かれて統治することとなった。', significance:'現在もヨルダン王室として存続する一方、イラクの王統は1958年の革命により断絶しており、同じ家系の異なる運命が対比的に論じられる。', debate:'イギリスがフサインに約束した「アラブ独立」がサイクス・ピコ協定により実質的に反故にされたことは、中東における欧米への根深い不信の歴史的起源としてしばしば言及される。'} },
  { id:'hussein_bin_ali', name:'フサイン・イブン=アリー', category:'person', parentId:'hashemite_dynasty', lat:21.42, lng:39.83, start:1854, end:1931, region:'ヒジャーズ王国',
    desc:{background:'オスマン帝国の中央集権化政策(青年トルコ革命後のトルコ民族主義強化)への反発と、イギリスからのアラブ独立支援の約束(フサイン=マクマホン書簡)が、蜂起の背景となった。', process:'アラブ反乱を主導してオスマン帝国軍と戦い、戦後アラブ地域全体の独立と統一王国の樹立を期待したが、サイクス・ピコ協定と国際連盟による委任統治体制により当初の期待は裏切られ、最終的にヒジャーズ地方の王位も同盟者であったイブン=サウードに奪われた。', significance:'アラブ民族主義の初期の象徴的存在として、彼の運動は挫折に終わったものの、後の中東各国の独立運動における「裏切られたアラブ独立」という歴史認識の原点を形成した。', debate:'イギリスの二枚舌外交の犠牲者としての側面が強調される一方、彼自身の統一アラブ王国樹立という野心がどこまで現実的であったかについても議論がある。'} },
  { id:'arab_revolt', name:'アラブ反乱', category:'war', lat:21.42, lng:39.83, start:1916, end:1918, region:'アラビア半島(ヒジャーズ)・シリア',
    desc:{background:'オスマン帝国の中央集権化政策とトルコ民族主義強化への反発、およびイギリスによるアラブ独立支援の約束が、この反乱の背景となった。', process:'フサイン=イブン=アリーとその息子ファイサルが指導し、イギリスの軍事顧問T.E.ロレンス(「アラビアのロレンス」)の協力を得てヒジャーズ鉄道への破壊工作などゲリラ戦を展開しオスマン帝国軍を苦しめた。', significance:'オスマン帝国の東部戦線崩壊に一定の貢献をしたが、戦後の英仏によるサイクス・ピコ協定履行により当初期待されたアラブ統一独立国家は実現せず、この反乱はアラブ民族主義運動における「裏切られた期待」の象徴となった。', debate:'アラビアのロレンスの個人的な役割・影響力が、実際の戦局にどこまで決定的であったか、それとも後世の文学的・映画的脚色による過大評価かが論じられる。'} },
  { id:'sykes_picot_agreement', name:'サイクス・ピコ協定', category:'treaty', lat:33.89, lng:35.50, start:1916, end:1916, region:'シリア・イラク・パレスチナ',
    desc:{background:'第一次世界大戦中、イギリスとフランスが戦後のオスマン帝国領中東地域の分割について秘密裏に合意する必要があったことが背景となった。', process:'現在のシリア・レバノンをフランスの勢力圏、イラク・ヨルダン・パレスチナをイギリスの勢力圏とする境界線を秘密裏に取り決めたが、この内容はロシア革命後にボリシェヴィキ政権により暴露され、アラブ側の「独立の約束」への裏切りとして大きな衝撃を与えた。', significance:'この秘密協定に基づく境界線は現在の中東諸国の国境線の多くの直接的な起源となっており、民族・部族の分布を無視した人為的な境界画定が今日までの地域紛争の構造的要因の一つとされる。', debate:'この協定の暴露が中東における欧米への不信の原点として繰り返し言及される一方、実際の国境画定にはこの協定通りにならなかった部分も多く、その実際の影響の程度を正確に評価する必要がある。'} },
  { id:'balfour_declaration', name:'バルフォア宣言', category:'treaty', lat:31.78, lng:35.22, start:1917, end:1917, region:'パレスチナ',
    desc:{background:'イギリス国内のシオニズム運動への同情と、戦時下でのユダヤ人社会からの支持獲得という戦略的計算が、この宣言の背景となった。', process:'イギリス外相バルフォアがユダヤ人指導者ロスチャイルド卿に宛てた書簡の形で、パレスチナにおけるユダヤ人の「民族的郷土」建設を支持する旨を表明した。', significance:'この宣言はシオニズム運動に国際的な法的正統性を与える画期的な文書となり、後の国際連盟委任統治条項にも組み込まれてイスラエル建国への道を開く一方、同地に居住していたアラブ人住民の存在への配慮を欠いた文言が今日まで続くパレスチナ問題の根源となった。', debate:'「郷土」という曖昧な表現が独立国家建設を意味するのか自治の拡大を意味するのか、当初から解釈の余地を残していたことが、後の対立激化の一因になったとする見方がある。'} },
  { id:'french_mandate_levant', name:'フランス委任統治領シリア・レバノン', category:'event', lat:33.89, lng:35.50, start:1920, end:1946, region:'シリア・レバノン',
    desc:{background:'サイクス・ピコ協定に基づきフランスの勢力圏とされたシリア・レバノン地域が、国際連盟による正式な委任統治領として認められたことが背景となった。', process:'フランスは宗教・宗派に基づく統治(レバノンにおけるマロン派キリスト教徒優遇など)を進め、シリアの民族主義運動への弾圧(ダマスカス砲撃事件など)も行ったが、第二次世界大戦中の混乱を経て1946年にシリア・レバノン両国は独立を達成した。', significance:'この委任統治期に確定したレバノンの宗派別権力配分制度(国民協約)は独立後の同国の政治体制の基本枠組みとなり、後のレバノン内戦の構造的要因ともなった。', debate:'宗派に基づく統治・権力配分が社会の安定に寄与したか、逆に宗派間の分断を固定化し後の内戦を準備したかが、レバノン現代史の中心的論点である。'} },
  { id:'british_mandate_iraq_palestine', name:'イギリス委任統治領イラク・パレスチナ・トランスヨルダン', category:'event', lat:31.78, lng:35.22, start:1920, end:1948, region:'イラク・パレスチナ・トランスヨルダン',
    desc:{background:'サイクス・ピコ協定に基づきイギリスの勢力圏とされたイラク・パレスチナ地域が、国際連盟による正式な委任統治領として認められたことが背景となった。', process:'イラクではハーシム家のファイサルを国王に擁立し1932年に独立を達成させる一方、パレスチナではバルフォア宣言に基づくユダヤ人移民の増加とアラブ人住民との対立が激化し、イギリスは調停に失敗して1947年に問題を国連に委ねた。', significance:'イラクでの委任統治は比較的早期の独立達成につながったが、パレスチナでの統治失敗は第一次中東戦争へとつながる長期の紛争構造を残すこととなった。', debate:'同じイギリスの委任統治でありながらイラクとパレスチナで対照的な帰結(比較的平和的独立と長期化する紛争)を生んだ要因が、統治政策の相違か、それぞれの地域固有の民族構成の複雑さによるものかが論じられる。'} },

  // ===================== トルコ共和国の成立 =====================
  { id:'turkish_war_independence', name:'トルコ独立戦争', category:'war', lat:39.93, lng:32.86, start:1919, end:1923, region:'アナトリア',
    desc:{background:'第一次世界大戦敗北によるオスマン帝国の解体とセーヴル条約による国土分割という屈辱的な状況が、ムスタファ=ケマルによる抵抗運動の背景となった。', process:'ギリシア軍のアナトリア侵攻を撃退し、連合国が承認していたスルタン政府とは別に独自の国民運動政府を樹立して国土回復を実現した。', significance:'この勝利により1920年のセーヴル条約は破棄され、より有利な条件のローザンヌ条約が締結されてトルコ共和国建国の基盤が築かれた、第一次世界大戦の敗戦国が講和条約を実力で覆した稀有な事例である。', debate:'この独立戦争の成功が、その後のケマルによる急進的な世俗化・西欧化改革(カリフ制廃止など)をどこまで正当化する政治的資本となったかが論じられる。'} },
  { id:'treaty_of_lausanne', name:'ローザンヌ条約', category:'treaty', lat:39.93, lng:32.86, start:1923, end:1923, region:'トルコ',
    desc:{background:'トルコ独立戦争でのギリシア軍撃退という軍事的成功が、より有利な条件での条約再交渉を可能にする背景となった。', process:'先のセーヴル条約を破棄し、トルコの完全な主権と現在の国境線をほぼ確定させる内容で締結され、あわせてギリシアとの間で大規模な住民交換(宗教を基準とするギリシャ正教徒とムスリムの強制的な人口移動)が実施された。', significance:'第一次世界大戦の敗戦国でありながら実質的な主権回復を勝ち取った異例の講和条約として、トルコ共和国建国の国際的基盤を確立した。', debate:'宗教を基準とする強制的住民交換は、双方に多大な人的犠牲と文化的断絶をもたらしたが、民族紛争の「解決策」としてこの手法をどう評価すべきかという論点を提起する。'} },
  { id:'mustafa_kemal_ataturk', name:'ムスタファ=ケマル(アタテュルク)', category:'person', parentId:'turkey_republic', lat:39.93, lng:32.86, start:1881, end:1938, region:'トルコ共和国',
    desc:{background:'オスマン帝国軍人としての経歴とガリポリの戦いでの軍功が、独立戦争指導者としての政治的基盤を築いた。', process:'トルコ独立戦争を指導して国土を守り抜き、スルタン制・カリフ制を相次いで廃止して政教分離・女性参政権・文字改革(アラビア文字からラテン文字へ)などの急進的な世俗化・西欧化改革を断行した。', significance:'「トルコ人の父(アタテュルク)」として、多民族帝国から世俗的な国民国家への根本的な国家再編を成し遂げ、イスラーム世界における世俗主義国家建設の最も徹底した事例として世界的に注目される。', debate:'この急進的な世俗化改革が上からの強制的な近代化として国民の宗教的アイデンティティとの緊張を生んだかどうか、この緊張は21世紀のトルコにおける世俗派とイスラーム主義派の政治的対立の歴史的起源としても論じられる。'} },
  { id:'turkey_republic', name:'トルコ共和国', category:'nation', lat:39.93, lng:32.86, start:1923, end:2026, region:'アナトリア',
    relatedIds:['mustafa_kemal_ataturk','turkish_war_independence','treaty_of_lausanne'],
    desc:{background:'独立戦争勝利とオスマン帝国解体という歴史的転換を経て、ムスタファ=ケマルが新たな国家体制構築を主導したことが背景となった。', process:'1923年の共和国宣言後、カリフ制廃止・世俗的法典の導入・国語改革などを通じて徹底した世俗的国民国家として再編され、NATO加盟などを通じ冷戦期は西側陣営の一員として位置づけられたが、21世紀にはエルドアン政権下でイスラーム的価値観の再興と世俗主義との緊張が高まっている。', significance:'イスラーム世界における世俗主義国家建設の最も徹底した事例として、その経験は他のムスリム多数国家における政教関係のあり方を考える上で重要な参照事例となり続けている。', debate:'エルドアン政権下でのイスラーム的価値観の再興を、ケマル主義的世俗主義への「揺り戻し」とみるか、より広範な国民の意向を反映した民主的な変化とみるかで評価が分かれる。'} },

  // ===================== サウジアラビア・イラク・ヨルダンの成立 =====================
  { id:'saudi_arabia_kingdom', name:'サウジアラビア王国', category:'nation', lat:24.71, lng:46.68, start:1902, end:2026, region:'アラビア半島',
    relatedIds:['ibn_saud','oil_discovery_gulf'],
    desc:{background:'18世紀に成立したワッハーブ派イスラーム改革運動とサウード家の同盟関係が、この王国建国の思想的・政治的基盤となった。', process:'イブン=サウードがアラビア半島の大部分を再統一し、1932年にサウジアラビア王国を建国、その後の石油発見により莫大な富を得て国際的な影響力を高めた。', significance:'イスラーム教の二大聖地(メッカ・メディナ)を擁する王国として、ワッハーブ派イスラームを国是とする政教一致の統治体制を築き、世界最大級の石油埋蔵量を背景に中東地域における最有力国家の一つとなった。', debate:'ワッハーブ派の厳格な教義と、王家による現実的な国際政治・経済運営(アメリカとの緊密な同盟関係)との間の緊張が、この王国の統治の特徴的なジレンマとして論じられる。'} },
  { id:'ibn_saud', name:'イブン=サウード', category:'person', parentId:'saudi_arabia_kingdom', lat:24.71, lng:46.68, start:1876, end:1953, region:'サウジアラビア王国',
    desc:{background:'父祖代々のサウード家再興という悲願と、ワッハーブ派イスラーム勢力との同盟関係が、彼の統一事業の背景となった。', process:'リヤドの奪還を皮切りにアラビア半島の大部分を軍事的に統一し、旧ライバルであったハーシム家からヒジャーズ地方(メッカ・メディナを含む)も奪って1932年にサウジアラビア王国を建国した。', significance:'現代サウジアラビアの建国者として、王国は現在も彼の子孫による統治が続いており、その名は今日の王国の正式名称(サウード家のアラビア)に冠されている。', debate:'彼の統一事業がワッハーブ派の宗教的熱意によってどこまで動機づけられていたか、部族間の伝統的な権力闘争としての側面とのバランスが論じられる。'} },
  { id:'iraq_kingdom', name:'イラク王国', category:'nation', lat:33.34, lng:44.39, start:1921, end:1958, region:'イラク',
    relatedIds:['faisal_i_iraq','iraq_revolution_1958'],
    desc:{background:'イギリスの委任統治下、ハーシム家のファイサルが国王として擁立されたことが建国の背景となった。', process:'1932年に独立を達成したが、石油利権をめぐる英国の強い影響力が残り、シーア派・スンナ派・クルド人という複雑な民族・宗派構成をめぐる統治の困難を抱え続け、1958年の軍事クーデタにより王政は打倒された。', significance:'この王政打倒はイラク現代史における共和政への転換点となり、以後のイラクは軍事政権・バアス党一党支配という長期の権威主義的統治を経験することとなった。', debate:'イギリスによる人為的な国境画定(異なる宗派・民族を単一国家に統合)が、この国の長期にわたる政治的不安定の根本的原因であるとする見方が広く共有されている。'} },
  { id:'faisal_i_iraq', name:'ファイサル1世', category:'person', parentId:'iraq_kingdom', lat:33.34, lng:44.39, start:1885, end:1933, region:'イラク王国',
    desc:{background:'アラブ反乱を指導したハーシム家の一員として、イギリスによりイラク国王に擁立されたことが治世の背景となった。', process:'多様な民族・宗派(スンナ派アラブ人・シーア派アラブ人・クルド人)を抱える国家の統合を図りながら1932年の独立を実現させたが、王朝としての正統性の基盤は脆弱で、その死後まもなく王政自体も不安定化していった。', significance:'アラブ独立運動の理想を体現しつつも、イギリスの委任統治という制約の中で「借り物の王権」を担わざるを得なかった彼の統治は、中東における人為的国家建設の困難さを象徴する事例である。', debate:'彼自身がイラク出身でない「よそ者」の王として国民統合をどこまで実現し得たか、この正統性の脆弱さが後の王政崩壊にどこまで構造的に寄与したかが論じられる。'} },
  { id:'iraq_revolution_1958', name:'イラク7月14日革命', category:'revolution', lat:33.34, lng:44.39, start:1958, end:1958, region:'イラク',
    desc:{background:'ハーシム王家の親英的姿勢とアラブ民族主義の高まり(ナセルのエジプトに象徴される反欧米的機運)への国内の不満が、この革命の背景となった。', process:'軍将校団によるクーデタで国王ファイサル2世をはじめとする王族が殺害され、共和政が樹立された。', significance:'この革命によりイラクは共和政へ移行したが、以後は軍事クーデタが相次ぐ不安定な政情が続き、最終的に1968年のバアス党によるクーデタを経てサダム=フセインの独裁体制へと至る道を準備した。', debate:'この革命を「反植民地主義的な民族解放」と評価するか、単なる軍事エリートによる権力奪取とみるかで、イラク現代史の性格づけが分かれる。'} },
  { id:'jordan_kingdom', name:'ヨルダン(トランスヨルダン→ヨルダン=ハシミテ王国)', category:'nation', lat:31.95, lng:35.93, start:1921, end:2026, region:'ヨルダン',
    relatedIds:['abdullah_i_jordan'],
    desc:{background:'イギリスの委任統治下でハーシム家のアブドゥッラー1世が「トランスヨルダン首長国」として統治を開始したことが建国の背景となった。', process:'1946年に完全独立を達成し「ヨルダン」と改称し、パレスチナ難民の大量流入(1948年・1967年の中東戦争を経て)という人口構成上の課題を抱えながらも、中東の他の君主国に比べ比較的安定した統治を維持し続けている。', significance:'資源に乏しく地政学的に不安定な中東において、王室の巧みなバランス外交(イスラエル・アラブ諸国・欧米との関係維持)により長期の安定を保った稀有な事例として注目される。', debate:'人口の過半数を占めるとされるパレスチナ系住民と、伝統的な東岸出身者(ハーシム王家を支持する部族層)との間の政治的緊張が、この王国の統治の基本的な構造的課題として論じられる。'} },
  { id:'abdullah_i_jordan', name:'アブドゥッラー1世', category:'person', parentId:'jordan_kingdom', lat:31.95, lng:35.93, start:1882, end:1951, region:'トランスヨルダン→ヨルダン王国',
    desc:{background:'アラブ反乱を指導したハーシム家の一員として、イギリスの委任統治下でトランスヨルダンの首長に据えられたことが治世の背景となった。', process:'巧みな外交手腕でイギリスとの関係を維持しながら1946年の完全独立を実現させ、第一次中東戦争ではヨルダン川西岸を占領・併合したが、パレスチナ問題への対応(イスラエルとの秘密交渉が疑われた)をめぐりパレスチナ人急進派により1951年に暗殺された。', significance:'現在まで続くヨルダン=ハーシム王朝の建国者として、その現実主義的な対イスラエル政策の系譜は子孫のフセイン国王・アブドゥッラー2世にも受け継がれている。', debate:'彼のイスラエルとの秘密交渉の実態(単独講和を模索していたか)については史料的制約があり、その評価はパレスチナ問題における「アラブの大義」と個別国家の実利との相克を考える事例として論じられる。'} },
  { id:'oil_discovery_gulf', name:'中東における石油発見と石油産業の勃興', category:'event', lat:26.29, lng:50.15, start:1908, end:1945, region:'ペルシア湾岸(イラン・バーレーン・サウジアラビアなど)',
    desc:{background:'20世紀初頭以降の世界的な石油需要の高まりと、欧米石油会社によるペルシア湾岸地域での地質調査の進展が、大規模油田発見の背景となった。', process:'イラン(1908年)を皮切りにサウジアラビア・クウェート・イラクなど湾岸諸国で相次いで巨大油田が発見され、当初は欧米石油会社(セブンシスターズ)が採掘権を独占していたが、20世紀半ば以降は産油国側が国有化・利権再交渉を通じて富の分配を取り戻していった。', significance:'この石油収入は湾岸諸国を世界有数の富裕国へと変貌させる一方、資源に依存した経済構造(「資源の呪い」)と欧米列強の戦略的関心の集中という、この地域の現代史を規定する二つの構造的特徴を生み出した。', debate:'石油資源の存在が湾岸諸国の政治的独立・近代化を促進したとみるか、逆に外部勢力の介入を招き真の主権確立を妨げてきたとみるかで、資源経済論・国際政治学上の評価が分かれる。'} },
  { id:'opec_founding', name:'OPEC(石油輸出国機構)の設立', category:'event', lat:33.34, lng:44.39, start:1960, end:1960, region:'イラク(バグダード)',
    desc:{background:'産油国側の意向を無視した欧米石油会社(セブンシスターズ)による一方的な原油公示価格引き下げが、産油国間の連携組織結成の直接的契機となった。', process:'サウジアラビア・イラン・イラク・クウェート・ベネズエラの5か国により結成され、当初は目立った影響力を持たなかったが、1973年の第一次石油危機を機に石油価格・生産量の決定権を実質的に掌握するようになった。', significance:'資源保有国が国際商品市場において価格決定力を持ち得ることを実証した先駆的事例として、南北問題における「資源ナショナリズム」の重要な成功例と評価される。', debate:'OPECの価格・供給調整能力の実効性は加盟国間の利害対立(増産派と減産派)によりしばしば揺らいでおり、この組織の実際の市場支配力の程度については経済学的に議論がある。'} },

  // ===================== イラン(パフラヴィー朝〜イラン=イスラーム共和国) =====================
  { id:'iran_pahlavi_dynasty', name:'パフラヴィー朝', category:'nation', lat:35.69, lng:51.39, start:1925, end:1979, region:'イラン',
    relatedIds:['reza_shah','mohammad_reza_shah','mossadegh_coup','iranian_revolution'],
    desc:{background:'ガージャール朝末期の政治的混乱と、軍人レザー=ハーンによるクーデタが、この新王朝樹立の背景となった。', process:'レザー=シャーが西欧的な近代化改革(徴兵制・世俗教育・女性のヴェール着用禁止など)を強権的に推進し、息子モハンマド=レザー=シャーの代には石油国有化運動(モサッデグ首相)を経てアメリカ・イギリスの支援によるクーデタで親米路線を強化したが、急速な近代化への反発とシーア派聖職者層の不満が高まり1979年のイラン革命により王政は崩壊した。', significance:'上からの急速な世俗的近代化(白色革命)は都市中間層の拡大をもたらした一方、伝統的価値観との深刻な軋轢を生み、この緊張は最終的にイスラーム革命という形で爆発することとなった。', debate:'この王朝の近代化政策を評価する際、その経済的成果と、秘密警察(サヴァク)による弾圧・言論統制という負の側面のどちらに力点を置くべきかで評価が分かれる。'} },
  { id:'reza_shah', name:'レザー=シャー(レザー=ハーン)', category:'person', parentId:'iran_pahlavi_dynasty', lat:35.69, lng:51.39, start:1878, end:1944, region:'パフラヴィー朝',
    desc:{background:'ガージャール朝末期の中央権力の弱体化と外国勢力(英露)の影響力拡大への危機感が、軍人としての彼の政治的台頭の背景となった。', process:'クーデタで実権を握った後1925年に自ら王位に就いてパフラヴィー朝を開き、徴兵制・近代的行政機構・世俗教育の導入、女性のヴェール着用禁止など西欧化・世俗化改革を強権的に推進したが、第二次世界大戦中に親独的態度を理由に英ソ両国の圧力で退位を強いられた。', significance:'トルコのケマル=アタテュルクを範とする急速な近代化を通じてイランの国家的基盤を再編したが、その強権的手法は伝統的な宗教勢力・部族勢力との緊張を残した。', debate:'退位強要の経緯(英ソによる事実上の内政干渉)は、イランにおける外国勢力への根深い不信の歴史的背景の一つとして位置づけられる。'} },
  { id:'mohammad_reza_shah', name:'モハンマド=レザー=シャー', category:'person', parentId:'iran_pahlavi_dynasty', lat:35.69, lng:51.39, start:1919, end:1980, region:'パフラヴィー朝',
    desc:{background:'父レザー=シャーの退位を受けて即位し、冷戦下で石油資源をめぐる英米との複雑な関係を担うことになったことが治世の背景となった。', process:'石油国有化を掲げるモサッデグ首相との対立からクーデタ(米英の支援)を経て親政を回復し、「白色革命」と称する上からの急進的な近代化・土地改革を推進する一方、秘密警察(サヴァク)による反対派弾圧を強化したが、急速な西欧化への宗教勢力・伝統層の反発が1979年のイラン革命を招き亡命を余儀なくされた。', significance:'親米路線と急進的な世俗的近代化を推し進めた統治は、結果的にイスラーム主義勢力による革命という反動を招き、中東における「上からの近代化」の限界を示す事例となった。', debate:'彼の近代化政策(女性の権利拡大・産業化)を積極的に評価する声と、抑圧的な統治・対米従属を批判する声との間で、イラン革命の評価そのものと連動して評価が大きく分かれる。'} },
  { id:'mossadegh_coup', name:'モサッデグ政権とクーデター(1953年)', category:'event', lat:35.69, lng:51.39, start:1951, end:1953, region:'イラン',
    desc:{background:'イラン議会がイギリス系石油会社(アングロ・イラニアン)の資産を国有化する決定を下したことが、英米の警戒を招く背景となった。', process:'イギリスとアメリカの情報機関(CIA・MI6)が主導した工作により、民主的に選出されていたモサッデグ首相の政権が転覆され、国王モハンマド=レザー=シャーの親政・親米路線が復活した。', significance:'この工作は2013年にCIA自身が関与を公式に認めた冷戦期の代表的な体制転換工作の一つであり、以後のイランにおける根深い反米感情、ひいては1979年のイラン革命の重要な歴史的伏線となった。', debate:'この工作が短期的な西側の戦略的利益(石油利権確保)をもたらした一方、長期的にはイランの反米化・イスラーム化という自らの利益に反する結果を招いたという「意図せざる帰結」の典型例として国際政治学上重視される。'} },
  { id:'iranian_revolution', name:'イラン革命', category:'revolution', lat:35.69, lng:51.39, start:1978, end:1979, region:'イラン',
    desc:{background:'国王の急速な世俗的近代化政策への宗教勢力・伝統層の反発と、経済格差の拡大・秘密警察による抑圧への広範な国民的不満が、この革命の背景となった。', process:'亡命先のパリからホメイニー師が指導した大規模な民衆抗議運動が拡大し、国王は国外へ脱出、帰国したホメイニー師のもとイスラーム法学者による統治(ヴェラーヤテ・ファギーフ)を核とするイスラーム共和制が樹立された。', significance:'20世紀後半における最も重要な宗教的revolutionとして、世俗的な近代化を強権的に進めた王政が民衆蜂起によって打倒されイスラーム主義国家が誕生したという前例は、以後の中東・イスラーム世界全体に大きな政治的衝撃を与えた。', debate:'この革命を「西欧的近代化への宗教的反動」とみるか「独裁と対米従属への正当な民衆抵抗」とみるかで、この革命の性格づけそのものが今日まで国際的に大きく分かれている。'} },
  { id:'iran_islamic_republic', name:'イラン=イスラーム共和国', category:'nation', lat:35.69, lng:51.39, start:1979, end:2026, region:'イラン',
    relatedIds:['khomeini','hostage_crisis_tehran','iran_iraq_war'],
    desc:{background:'イラン革命の成功により、ホメイニー師が提唱するイスラーム法学者による統治(ヴェラーヤテ・ファギーフ)という新たな統治理念に基づく国家建設が求められたことが背景となった。', process:'最高指導者(ホメイニー師、後にハーメネイー師)のもとで大統領・議会による共和政的要素とイスラーム法学者による監督機構(護憲評議会)を組み合わせた独自の統治体制を確立し、イラン・イラク戦争を戦い抜いた後、核開発問題をめぐり欧米との緊張と経済制裁が続いている。', significance:'選挙による共和政的要素と神権政治的要素を組み合わせた「イスラーム民主主義」の独自モデルとして、他のイスラーム主義運動にとっての重要な参照事例(ただしシーア派固有の統治理念のため他地域への直接適用には限界がある)となっている。', debate:'この統治体制を「民意を一定程度反映する多元的なイスラーム統治」とみるか「聖職者による事実上の独裁を選挙の外見で糊塗したもの」とみるかで、国際的な評価が大きく分かれている。'} },
  { id:'khomeini', name:'ホメイニー(ルーホッラー=ホメイニー)', category:'person', parentId:'iran_islamic_republic', lat:35.69, lng:51.39, start:1902, end:1989, region:'イラン=イスラーム共和国',
    desc:{background:'シーア派法学者としての長年の宗教的権威と、国王の世俗化政策・対米従属への一貫した批判が、亡命中も含め彼の指導力の背景となった。', process:'パリ亡命中にカセットテープを通じた説教でイラン国内の革命運動を指導し、帰国後は「イスラーム法学者による統治」を核とする新体制を確立し、アメリカ大使館人質事件・イラン・イラク戦争という試練を経て体制を固めた。', significance:'「最高指導者」という新たな地位を創設し宗教的権威と国家統治権を一体化させる統治モデルを確立した、20世紀最も影響力の大きい宗教指導者の一人である。', debate:'彼の統治理念(ヴェラーヤテ・ファギーフ)がシーア派伝統の中でどこまで正統性を持つ解釈か、それとも彼独自の革新的教義であったかについて、シーア派神学内部でも議論がある。'} },
  { id:'hostage_crisis_tehran', name:'イラン米国大使館人質事件', category:'event', lat:35.69, lng:51.39, start:1979, end:1981, region:'イラン(テヘラン)',
