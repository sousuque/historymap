    desc:{background:'南北戦争後、鉄鋼・石油・鉄道といった基幹産業で水平統合・垂直統合を通じて巨大企業が形成され、急速な工業化と都市化が進んだことが背景となった。', process:'政府による経済への介入・規制がほぼ皆無に近い「自由放任」の思想的正当化(社会ダーウィニズム)のもと巨大企業が莫大な富を築く一方、劣悪な労働環境に苦しむ労働者との格差が極端に拡大し、労働組合運動やポピュリズム運動が既存の二大政党の枠組みを超えて高まった。', significance:'マーク=トウェインが皮肉を込めて名付けた「金ぴか時代」という呼称は、表面的な繁栄と華美な消費文化の裏に潜む格差・政治腐敗を象徴し、この時代への反省が20世紀初頭の革新主義運動を準備することになった。', debate:'自由放任経済がもたらした急速な経済成長と、それに伴う格差拡大・労働問題のどちらに歴史的評価の力点を置くべきかが、資本主義発展史の理解において論じられる。'} },
  { id:'andrew_carnegie', name:'アンドリュー・カーネギー', category:'person', lat:40.44, lng:-79.99, start:1835, end:1919, region:'アメリカ合衆国(ピッツバーグ)',
    desc:{background:'スコットランドからの貧しい移民の身から鉄道会社勤務を通じて資本主義の仕組みを学んだことが、鉄鋼業への投資という事業の背景となった。', process:'原料調達から製造・輸送までを自社で一貫支配する垂直統合により圧倒的なコスト優位を実現し「製鉄王」と呼ばれる巨富を築いたが、1892年のホームステッド争議では会社側が武装警備員を投入し複数の死者を出す流血の惨事を招いた。', significance:'晩年は「富の福音」で「富める者が生前にその富を公共の利益のために還元する責務」を説き、莫大な私財を全米各地の公共図書館建設(2500館以上)に投じ、近代的な大規模慈善活動の先駆けとなった。', debate:'労働者への非情な対応(ホームステッド争議)と、後年の大規模な慈善活動という二面性を、一人の実業家の生涯としてどう統合的に評価すべきかが論じられる。'} },
  { id:'immigration_ellis_island', name:'エリス島と大量移民の時代', category:'event', lat:40.70, lng:-74.04, start:1892, end:1954, region:'アメリカ合衆国(ニューヨーク港)',
    desc:{background:'それまで移民の主流であった北西欧出身者に加え、南欧・東欧出身の「新移民」が急増したことが、連邦移民審査施設設置の背景となった。', process:'最盛期には年間100万人以上がここを通過して健康診断・素行審査を受け、多様な出自の移民が急速に拡大する工業労働力として産業化を支える一方、既存住民との文化的・宗教的摩擦や排斥運動が高まった。', significance:'この排外主義は1920年代に結実し、出身国別に移民数の上限を設ける割当法(1921年・1924年)が制定され、北西欧を優遇し南欧・東欧やアジアからの移民を事実上大幅に制限する内容となった。', debate:'「自由の女神が迎える移民の国」という自己イメージと、現実の排他的な移民政策との間の緊張は、20世紀を通じたアメリカ移民史の重要な論争軸であり続けている。'} },
  { id:'spanish_american_war', name:'米西戦争', category:'war', lat:23.13, lng:-82.38, start:1898, end:1898, region:'カリブ海(キューバ)・太平洋',
    desc:{background:'キューバ独立運動へのスペインの過酷な弾圧を、部数拡大を狙う新聞の「イエロー=ジャーナリズム」が誇張的に報道して反スペイン世論を煽ったことが背景となった。', process:'ハバナ港での米艦メイン号爆沈事件(原因は今も確定していない)を機に開戦し短期間でアメリカが圧勝、キューバの形式的独立を承認させる一方(実際にはプラット修正条項による半従属的な独立にとどまった)プエルトリコ・グアム・フィリピンをスペインから割譲・獲得した。', significance:'この勝利によりアメリカはそれまでの大陸内での領土拡大から一転して海外に恒久的な領土・勢力圏を持つ新興の帝国主義的大国としての地位を確立した。', debate:'フィリピンでは独立を求める現地勢力との間で新たな戦争(フィリピン・アメリカ戦争)に直面するなど、「自由の理念を掲げる共和国」が「他民族を統治する帝国」へと転じることの内在的矛盾がこの戦争を通じて早くも露呈した。'} },
  { id:'william_mckinley', name:'ウィリアム・マッキンリー', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1843, end:1901, region:'アメリカ合衆国',
    desc:{background:'高関税による国内産業保護を一貫して主張する共和党の政策通として、第25代大統領に就任したことが背景となった。', process:'当初はキューバ問題での対スペイン開戦には慎重であったが扇情的な世論と議会の主戦論に押される形で米西戦争の開戦を決断し、この勝利によってフィリピン・プエルトリコ・グアムを獲得、中国における「門戸開放宣言」を発した。', significance:'1901年に無政府主義者による狙撃を受けて死去し、副大統領セオドア=ルーズベルトが昇格したことで以後のアメリカの革新主義・帝国主義的外交路線が大きく加速することになった。', debate:'当初慎重であった彼が世論に押されて開戦に転じた経緯は、指導者の意思決定と世論・議会の圧力との関係を考える重要な事例である。'} },
  { id:'theodore_roosevelt', name:'セオドア・ルーズベルト', category:'person', lat:38.90, lng:-77.04, start:1858, end:1919, region:'アメリカ合衆国',
    desc:{background:'米西戦争での従軍経験(義勇騎兵隊「ラフ・ライダーズ」)による名声が、マッキンリーの副大統領選出と暗殺による大統領昇格の背景となった。', process:'巨大トラストの解体を進める革新主義的な独占規制や食品・医薬品の安全規制、国立公園・森林保護区の拡充を推進し、対外的には「棍棒外交」を掲げてコロンビアからのパナマ分離独立を支援しパナマ運河建設・管理権を強引に確保した。', significance:'モンロー主義を能動的な軍事介入の根拠へと拡大解釈する「ルーズベルトの系論」を打ち出し、日露戦争の講和を仲介した功績で1906年にノーベル平和賞を受賞した。', debate:'国内の革新主義的改革者としての側面と、対外的な帝国主義的介入を推進した側面という一見矛盾する二面性を、どう統合的に理解すべきかが論じられる。'} },
  // ===================== 二つの世界大戦・大恐慌 =====================
  { id:'wwi_us_entry', name:'第一次世界大戦へのアメリカ参戦', category:'event', lat:38.90, lng:-77.04, start:1917, end:1918, region:'アメリカ合衆国',
    desc:{background:'開戦当初ウィルソン大統領が厳正中立を掲げていた状況が、ドイツによる無制限潜水艦作戦の再開とツィンメルマン電報の暴露によって転換を迫られたことが背景となった。', process:'1917年に連合国側で参戦し、本国からの新鋭部隊投入がロシア革命による東部戦線崩壊で息を吹き返しかけたドイツ軍の西部戦線での最後の大攻勢を頓挫させ、消耗しきった戦況を連合国優位へ決定的に傾けた。', significance:'戦後ウィルソン大統領は「十四カ条」を提唱し国際連盟創設の理念的主導者となったが、アメリカ議会は条約批准・国際連盟加盟をいずれも否決し、提唱国自身が参加しないという皮肉な結果に終わった。', debate:'中立から参戦への転換の決定的要因を、ドイツの潜水艦作戦(実害)とツィンメルマン電報(発覚による衝撃)のどちらに求めるべきかが論じられる。'} },
  { id:'woodrow_wilson', name:'ウッドロー・ウィルソン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1856, end:1924, region:'アメリカ合衆国',
    desc:{background:'プリンストン大学学長を経て政界入りした学者出身という経歴が、国内改革(連邦準備制度創設)を主導する第28代大統領としての基盤となった。', process:'当初は第一次世界大戦への中立を掲げたが無制限潜水艦作戦の再開を受けて参戦を決断し、戦後処理の原則として国家自決・秘密外交の廃止・国際平和機構の設立などを盛り込んだ「十四カ条」を提唱した。', significance:'この「民族自決」の理念は東欧の新興独立国のみならず後のアジア・アフリカ植民地における独立運動にも理念的な波及効果を及ぼしたが、上院共和党が国際連盟規約の集団安全保障条項に反対し批准を拒否したため自ら提唱した国際連盟にアメリカ自身が加盟できないという皮肉な結果に終わった。', debate:'理想主義的な国際協調路線が戦間期のアメリカで十分に受け継がれなかったことの要因を、議会の孤立主義的傾向に求めるか、ウィルソン自身の妥協を拒む頑なな姿勢に求めるかで議論がある。'} },
  { id:'prohibition_era', name:'禁酒法時代', category:'event', lat:41.88, lng:-87.63, start:1920, end:1933, region:'アメリカ合衆国',
    desc:{background:'プロテスタント系の禁酒運動団体の長年の道徳的キャンペーンと、第一次世界大戦中の穀物節約論・反ドイツ系ビール醸造業者感情の高まりが背景となった。', process:'憲法修正第18条とヴォルステッド法により酒類の製造・販売・輸送が全国的に禁止されたが、需要は消えず密造酒や非合法の酒場が全国的に横行し、組織犯罪(マフィア)が密造・密輸・密売網の支配を通じて空前の資金力を蓄える皮肉な結果を招いた。', significance:'取り締まりの実効性の乏しさと組織犯罪の跳梁への反省から、1933年の憲法修正第21条(既存の修正条項を丸ごと廃止した唯一の例)により撤廃された。', debate:'この禁酒法は「法律で人々の私生活上の嗜好を強制的に矯正しようとする社会的実験」の失敗例としてしばしば引用され、道徳的立法の実効性の限界を考える上で重要な事例である。'} },
  { id:'great_depression', name:'世界恐慌とアメリカ', category:'event', lat:40.71, lng:-74.01, start:1929, end:1939, region:'アメリカ合衆国',
    desc:{background:'1920年代の投機的な株式ブームの反動として1929年のニューヨーク株式市場大暴落が発生したことが直接の契機となった。', process:'信用収縮による銀行の連鎖倒産・企業の大量倒産・失業率の急上昇という未曾有の経済危機に陥り、フーヴァー大統領が自由放任の原則に固執し政府による直接的な経済介入に消極的であったことが危機の深刻化を招いたとの批判が強く、中西部を襲った大規模な砂嵐(ダストボウル)による農業被害も重なった。', significance:'各国が自国産業保護のため高関税で応酬する世界的な保護主義の連鎖と国際協調の崩壊を招き、これが同時期のドイツにおけるナチスの台頭やヨーロッパ全体でのファシズム勢力伸長の経済的土壌ともなった。', debate:'フーヴァーの自由放任的対応の是非をめぐる評価は、この危機を世界史的な連鎖の中に位置づけて理解する必要性とあわせて、経済政策における政府介入の是非という今日的な論争にもつながる。'} },
  { id:'franklin_roosevelt', name:'フランクリン・D・ルーズベルト', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1882, end:1945, region:'アメリカ合衆国',
    desc:{background:'ニューヨーク州知事として恐慌対策の経験を積んだことが、世界恐慌のさなかの圧倒的勝利による第32代大統領就任の背景となった。', process:'政府の積極的な経済介入(ニューディール政策)によって失業対策・金融規制・社会保障制度の確立を進め、ラジオを通じた「炉辺談話」で国民に直接語りかけ、第二次世界大戦では武器貸与法で連合国を支援し真珠湾攻撃を機に参戦、連合国首脳会談を主導して戦後国際秩序の枠組みづくりにも指導力を発揮した。', significance:'アメリカ史上唯一4選を果たした大統領となったが、この前例のない長期政権への反省から後に大統領任期を二期までに制限する憲法修正第22条が制定された。', debate:'終戦を目前にした1945年4月に急死し、対日戦争の終結・戦後占領政策・原爆投下の最終決断・戦後秩序の具体的構築は後任トルーマンに委ねられることとなったが、彼が存命であればこれらの決断がどう異なっていたかは検証不能な問いである。'} },
  { id:'new_deal', name:'ニューディール政策', category:'event', lat:38.90, lng:-77.04, start:1933, end:1939, region:'アメリカ合衆国',
    desc:{background:'世界恐慌からの脱却という国家的課題が、「救済・復興・改革」の3Rを標語とする一連の政策の背景となった。', process:'就任直後の「百日議会」で銀行休業措置と緊急銀行法を成立させ、公共事業による雇用創出、証券取引委員会の創設、社会保障法(1935年)による老齢年金・失業保険制度の導入など、政府が国民の経済生活に恒常的に責任を持つという大きな政策転換をもたらしたが、連邦最高裁による一部政策への違憲判断にも直面した。', significance:'この一連の改革は連邦政府の役割を恒久的に拡大させ、以後のアメリカにおける福祉国家的な社会保障制度と、政府・労働組合・大企業が三者協調する経済体制(「ニューディール型秩序」)の基礎を1970年代まで続く形で築いた。', debate:'この政策が実際に恐慌を終わらせた要因としてどこまで有効であったか(第二次世界大戦による軍需景気の方が決定的であったとする見方もある)は、経済史における重要な論争点である。'} },
  { id:'pearl_harbor_attack', name:'真珠湾攻撃', category:'event', lat:21.36, lng:-157.95, start:1941, end:1941, region:'アメリカ合衆国(ハワイ)',
    desc:{background:'日米交渉の決裂と対日石油禁輸措置(ABCD包囲網)が、日本海軍による奇襲攻撃の背景となった。', process:'ハワイ・オアフ島の真珠湾に停泊するアメリカ太平洋艦隊を宣戦布告前に奇襲し多数の戦艦を撃沈・大破させる戦果を上げたが、たまたま出撃中で被害を免れた空母や燃料備蓄施設・修理施設への攻撃を怠ったことは後の太平洋戦争の帰趨に長期的な禍根を残した。', significance:'この攻撃への激しい国民的憤激により参戦に消極的であったアメリカ世論は一夜にして参戦支持へと劇的に転換し、アメリカは第二次世界大戦の欧州・太平洋両戦線に本格参戦した。', debate:'戦術的には大きな戦果を上げながら空母・燃料施設という戦略的に重要な標的を見逃したことが、その後の戦争の帰趨にどこまで決定的な影響を与えたかが軍事史上論じられる。'} },
  { id:'wwii_north_america', name:'第二次世界大戦とアメリカ・カナダ', category:'war', lat:38.90, lng:-77.04, start:1941, end:1945, region:'アメリカ合衆国・カナダ',
    relatedIds:['pearl_harbor_attack','manhattan_project','franklin_roosevelt'],
    desc:{background:'真珠湾攻撃を機に参戦したアメリカが、圧倒的な工業生産力を動員して連合国全体に武器・物資を供給する立場に立ったことが背景となった。', process:'カナダも人的動員・物的資源の両面で大きく貢献し、国内では女性の軍需産業への大量動員や黒人・メキシコ系の北部工業都市への移動が進んだ一方、日系アメリカ人・日系カナダ人が市民権の有無にかかわらず敵性外国人とみなされ強制収容される深刻な人権侵害も生じた。', significance:'1945年のドイツ・日本の降伏により大戦は終結し、戦禍を免れた本国工業基盤と圧倒的な経済規模を背景にアメリカは戦後、政治・経済・軍事のあらゆる面で世界最大級の超大国としての地位を確立した。', debate:'徴兵制導入をめぐりケベック州のフランス系住民との間で深刻な政治的対立を招いたことは、多文化国家における戦時動員の困難さを示す事例として論じられる。'} },
  { id:'manhattan_project', name:'マンハッタン計画', category:'event', lat:35.88, lng:-106.30, start:1942, end:1945, region:'アメリカ合衆国(ロスアラモス)',
    desc:{background:'ナチス=ドイツによる核兵器開発を警戒したアインシュタインらの進言が、この極秘開発計画の直接的な背景となった。', process:'亡命科学者の協力も得てロスアラモス国立研究所を中心に空前の巨額の資金と人員を投じて短期間で実用化に成功し、1945年8月の広島・長崎への原爆投下により日本の降伏を早めたとされる。', significance:'この兵器の実用化は戦後まもなくソ連も核実験に成功したことで核軍拡競争の連鎖を引き起こし、以後半世紀近く続く核抑止に基づく国際秩序(冷戦)の技術的な出発点ともなった。', debate:'原爆投下決断の是非(本土上陸作戦回避による米兵犠牲の削減という説明と、戦後の対ソ外交上の示威という側面のいずれを重視するか)は今日でも歴史学上の論争が続いている。'} },
  { id:'harry_truman', name:'ハリー・トルーマン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1884, end:1972, region:'アメリカ合衆国',
    desc:{background:'副大統領就任からわずか3か月足らずでルーズベルトの急死により大統領に昇格したことが、原爆投下という重大決断を担う立場の背景となった。', process:'ソ連の東欧支配確立と共産主義勢力の拡大を「封じ込める」ことを国家戦略の基軸に据え、トルーマン=ドクトリン(1947年)とマーシャル=プランを打ち出して冷戦構造の骨格を築き、国内では人種統合された連邦軍の実現など公民権分野で先駆的な措置をとった。', significance:'朝鮮戦争では戦線拡大を主張するマッカーサー将軍を文民統制の原則を守るため更迭し、大統領の軍最高司令官としての権限が軍人の専門的判断に優越することを明確に示した。', debate:'マンハッタン計画の全貌すら知らされていなかった彼が就任早々に原爆投下という人類史上最重大の決断を下したという経緯は、大統領の情報アクセスと決断の正当性の関係を考えさせる。'} },
  // ===================== 冷戦期・公民権運動 =====================
  { id:'cold_war_north_america', name:'冷戦とアメリカ・カナダ', category:'event', lat:38.90, lng:-77.04, start:1947, end:1991, region:'アメリカ合衆国・カナダ',
    desc:{background:'第二次世界大戦後、資本主義・自由主義陣営の盟主となったアメリカとソ連を中心とする社会主義陣営との対立構造が形成されたことが背景となった。', process:'共産主義の拡大阻止を掲げる封じ込め政策やNATO結成を主導し、国内では共産主義者への疑いをかけ多数の公職追放を招いたマッカーシズムの熱狂も一時吹き荒れ、カナダもNATO原加盟国として西側陣営に加わりNORADを通じて大陸防衛でアメリカと軍事的に一体化した。', significance:'直接の軍事衝突を避けつつ核抑止・代理戦争・イデオロギー宣伝・宇宙開発競争などあらゆる領域で対抗した数十年にわたる対立構造として、20世紀後半の国際秩序を規定した。', debate:'カナダが外交面でスエズ危機での平和維持活動主導のようにアメリカの立場と必ずしも完全に一致しない独自の中間的立場をとったことは、同盟関係における従属と自律のバランスをどう考えるかという論点を提供する。'} },
  { id:'korean_war_us', name:'朝鮮戦争へのアメリカの介入', category:'war', lat:38.90, lng:-77.04, start:1950, end:1953, region:'アメリカ合衆国・朝鮮半島',
    desc:{background:'北朝鮮による韓国への奇襲的な侵攻を「ソ連・中国の支援を受けた共産主義拡大の試み」とみなしたトルーマン政権が、国連安保理決議を得て介入したことが背景となった。', process:'マッカーサー率いる国連軍が一時鴨緑江付近まで北進すると中国人民志願軍が大規模参戦してこれを押し戻し、戦線は北緯38度線付近で膠着し、戦線拡大を主張するマッカーサーをトルーマンが文民統制の原則を守るため更迭した。', significance:'最終的に休戦協定(講和条約ではなく法的には戦争状態が今日まで継続)により戦闘は停止されたが、この戦争はアメリカの平時における恒常的な大規模軍備・海外駐留体制を定着させる契機ともなった。', debate:'議会の正式な宣戦布告を経ずに大統領権限のみで軍事介入したことは、大統領の戦争権限と議会の統制との関係をめぐる憲政上の重要な先例として論じられる。'} },
  { id:'dwight_eisenhower', name:'ドワイト・アイゼンハワー', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1890, end:1969, region:'アメリカ合衆国',
    desc:{background:'第二次世界大戦でヨーロッパ方面連合国軍最高司令官としてノルマンディー上陸作戦を指揮した軍歴が、共和党からの第34代大統領選出の背景となった。', process:'朝鮮戦争の休戦を実現する一方、核兵器の存在を前提とした「大量報復戦略」を掲げつつ直接の軍事衝突は慎重に回避する現実主義的な冷戦運営を行い、リトルロック高校事件では連邦軍を派遣して黒人生徒の登校を武力で保護した。', significance:'退任演説では冷戦下で肥大化した軍需産業と軍部が結託して過剰な軍拡を招く危険性を「軍産複合体」の脅威として警告したことが、後世まで繰り返し引用される重要な遺産となっている。', debate:'自身は当初公民権問題に消極的であったにもかかわらず州の反抗を許さない姿勢を明確に示したことは、個人の信条と大統領としての職責上の判断がどう乖離しうるかを示す事例として論じられる。'} },
  { id:'brown_v_board', name:'ブラウン対教育委員会裁判', category:'event', lat:39.05, lng:-95.68, start:1954, end:1954, region:'アメリカ合衆国(カンザス州トピカ)',
    desc:{background:'「分離すれど平等」の原則のもとで合法とされてきた公立学校における人種別学制度に対し、NAACPが組織的な訴訟戦略を展開したことが背景となった。', process:'連邦最高裁が全員一致で「分離された教育施設は本質的に不平等である」として違憲判断を下したが、南部諸州の多くは判決文の曖昧な表現(「可能な限り緩やかに」)を逆手にとって実施を意図的に遅延・拒否した。', significance:'この判決は法理論上、人種隔離政策全般の合憲性を否定する扉を開き、後の公民権運動における学校統合をめぐる激しい対立(リトルロック高校事件など)の火種を残した。', debate:'判決の理論的な画期性と、実施における南部諸州の抵抗による実効性の乏しさとの間の乖離が、法的判断と社会変革の実現との関係を考える重要な論点となる。'} },
  { id:'montgomery_bus_boycott', name:'モンゴメリー・バス・ボイコット運動', category:'event', lat:32.38, lng:-86.30, start:1955, end:1956, region:'アメリカ合衆国(アラバマ州モンゴメリー)',
    desc:{background:'バスの人種別席に座ることを拒否し逮捕されたローザ=パークスの事件が、この逮捕自体が組織的な法廷闘争戦略の一環として周到に選ばれた事例であったことも重要な背景である。', process:'若き牧師マーティン=ルーサー=キング=ジュニアの指導のもとアフリカ系住民が組織した381日間に及ぶバス利用拒否運動が、経済的犠牲を伴いながらも結束を維持し、バス会社の収入激減という経済的圧力と最終的な連邦最高裁の違憲判断で勝利を収めた。', significance:'この成功はキング牧師が説くガンディー流の非暴力抵抗という戦術思想が実際に有効であることを実証し、以後の公民権運動全体における非暴力直接行動という中心的な戦術モデルを確立した。', debate:'この運動の成功要因を非暴力という戦術思想の道徳的説得力に求めるか、バス会社への経済的圧力という実利的側面に求めるかで力点が分かれる。'} },
  { id:'martin_luther_king', name:'マーティン・ルーサー・キング・ジュニア', category:'person', lat:35.15, lng:-90.05, start:1929, end:1968, region:'アメリカ合衆国',
    desc:{background:'ガンディーの非暴力抵抗思想とキリスト教信仰を融合させたことが、南部キリスト教指導者会議(SCLC)を組織し公民権運動を指導する思想的基盤となった。', process:'1963年のワシントン大行進での「私には夢がある」演説は人種を超えた平等の理念を訴え、1964年公民権法・1965年投票権法の成立に大きく寄与しノーベル平和賞も受賞したが、1968年テネシー州メンフィスで清掃労働者支援活動中に白人至上主義者により狙撃・暗殺された。', significance:'その死は全米100以上の都市部で大規模な暴動を引き起こすほどの衝撃を与え、非暴力運動の指導者を失ったことは公民権運動の路線対立(非暴力路線とより急進的な黒人パワー路線)を一層深める転機ともなった。', debate:'彼の死という悲劇的結末が、非暴力路線そのものの限界を示すものなのか、それとも非暴力路線の道徳的正当性をむしろ際立たせたのかという評価が論じられる。'} },
  { id:'civil_rights_act_1964', name:'1964年公民権法', category:'event', lat:38.90, lng:-77.04, start:1964, end:1964, region:'アメリカ合衆国',
    desc:{background:'ケネディ大統領が公民権運動の高まり(バーミングハムでの警察による過酷な弾圧の映像)を受けて法案を提案したことが背景となった。', process:'暗殺後を継いだジョンソン大統領が「ケネディの遺志」を掲げつつ議会の抵抗(54日間に及んだフィリバスター)を巧みな議会運営で押し切って成立させ、公共施設の利用・雇用における人種差別を違法とした。', significance:'この法律は南部の法制化された人種隔離体制(ジム=クロウ法)に法的な終止符を打ち、翌1965年投票権法とあわせて公民権運動が掲げた「法的平等」という目標をほぼ達成する到達点となった。', debate:'法的平等の達成が経済的格差の是正には直結しなかったことは、その後の運動が「貧困との戦い」へと重心を移す一因ともなり、法的平等と実質的平等の関係という重要な論点を提起する。'} },
  { id:'cuban_missile_crisis', name:'キューバ危機', category:'event', lat:23.13, lng:-82.38, start:1962, end:1962, region:'カリブ海(キューバ)',
    desc:{background:'カストロ政権のキューバが前年のピッグス湾侵攻事件でアメリカによる転覆工作を経験しソ連への接近を強めていたことが背景となった。', process:'ソ連が核弾頭搭載可能な中距離ミサイルを配備しようとしていることを確認したケネディ政権が、正面からの軍事攻撃ではなく海上封鎖と強い外交圧力でこれに対抗し、最終的にソ連がミサイル撤去に応じる代わりにアメリカがキューバ不可侵を約束し、密約としてトルコの米ミサイルも撤去するという妥協が成立した。', significance:'人類史上核戦争に最も近づいたとされるこの13日間の対峙は、米ソ間の直通通信線(ホットライン)設置や翌年の部分的核実験禁止条約に象徴される核軍縮交渉進展の直接の契機となった。', debate:'双方の首脳の面目を保つ形での妥協という解決の性質が、危機管理における「勝者」の有無をどう考えるべきかという国際政治学上の論点を提起する。'} },
  { id:'john_f_kennedy', name:'ジョン・F・ケネディ', category:'person', parentId:'united_states', lat:32.78, lng:-96.80, start:1917, end:1963, region:'アメリカ合衆国',
    desc:{background:'史上最年少(43歳)での選出と、テレビ討論を効果的に活用した新しいメディア型政治家としての先駆性が、彼の政治的スタイルの背景となった。', process:'ピッグス湾侵攻の失敗という試練を経験した後、キューバ危機を核戦争寸前の緊張の中で慎重かつ粘り強い交渉により平和的収拾に導き、「1960年代のうちに人類を月に送る」との目標(アポロ計画)を掲げて宇宙開発競争を主導した。', significance:'公民権法案を議会に提出するなど国内改革にも着手し始めた矢先の1963年11月、テキサス州ダラスをパレード中に狙撃され暗殺された。', debate:'その真相・単独犯行説(ウォーレン委員会の結論)をめぐる論争は陰謀論を含め今日まで続いており、この暗殺の真相解明の困難さ自体がアメリカ現代史における一つの文化的現象となっている。'} },
  { id:'lyndon_b_johnson', name:'リンドン・B・ジョンソン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1908, end:1973, region:'アメリカ合衆国',
    desc:{background:'上院多数党院内総務として卓越した議会運営手腕で知られていたことが、ケネディ暗殺による副大統領からの大統領昇格後の政策実現力の背景となった。', process:'「ケネディの遺志を継ぐ」ことを掲げて公民権法・投票権法を成立させ「貧困との戦い」を掲げてメディケア・メディケイドなど広範な社会福祉政策(「偉大な社会」構想)を推進したが、トンキン湾事件を機にベトナムへの軍事介入を大規模に拡大した。', significance:'内政の輝かしい成果がベトナム戦争の泥沼化によって覆い隠される形となり、1968年には再選出馬を自ら断念するに至った。', debate:'ニューディール以来最大規模の福祉国家的改革という国内の成果と、ベトナム戦争の泥沼化という対外政策の失敗という二面性を、一人の指導者の評価としてどう統合すべきかが論じられる。'} },
  { id:'vietnam_war_us', name:'ベトナム戦争へのアメリカの介入', category:'war', lat:38.90, lng:-77.04, start:1955, end:1975, region:'アメリカ合衆国・ベトナム',
    desc:{background:'共産主義の東南アジアへの拡大を阻止する「ドミノ理論」に基づき、アメリカが南ベトナム政府を軍事・経済支援していたことが背景となった。', process:'トンキン湾事件(1964年)を機に議会が事実上白紙委任的な軍事行動権限を与えるトンキン湾決議を可決して本格的な軍事介入へと拡大し、テレビ報道を通じて伝えられる戦争の実態への反発から大学キャンパスを中心に大規模な反戦運動が広がり、1968年テト攻勢を転機に厭戦気分が決定的となった。', significance:'1973年のパリ和平協定でアメリカ軍は撤退、1975年のサイゴン陥落により戦争は終結、アメリカにとって初めての明確な軍事的敗北を印象づける戦争となった。', debate:'テト攻勢は軍事的には米軍が撃退したが、その規模自体が「敵はほぼ壊滅している」という政府の説明の信頼性を国内世論の目に決定的に傷つけたことは、戦場での勝敗と政治的・心理的帰趨が必ずしも一致しないことを示す重要な事例である。'} },
  { id:'moon_landing', name:'アポロ11号月面着陸', category:'event', lat:28.39, lng:-80.61, start:1969, end:1969, region:'アメリカ合衆国(フロリダ州ケネディ宇宙センター)',
    desc:{background:'ケネディ大統領が「1960年代のうちに」と掲げた目標のもと、ソ連が有人宇宙飛行(ガガーリン、1961年)で先行した「スプートニク・ショック」への対抗が、宇宙開発競争の背景となった。', process:'国家の威信と巨額の予算をかけて進められたアポロ計画の到達点として、宇宙飛行士ニール=アームストロング・バズ=オルドリンらが人類史上初めて月面に降り立った。', significance:'科学技術力を通じたアメリカの国際的威信回復に大きく寄与するとともに、ベトナム戦争の泥沼化で国内が分断される中、数少ない国民的一体感を生む出来事ともなった。', debate:'国家的偉業として世界中で生中継されたこの出来事が、当時の社会的分断(ベトナム戦争への反対運動)にどこまで実際の一体感をもたらしたか、その効果の持続性が論じられる。'} },
  { id:'watergate_scandal', name:'ウォーターゲート事件', category:'event', lat:38.90, lng:-77.04, start:1972, end:1974, region:'アメリカ合衆国(ワシントンD.C.)',
    desc:{background:'大統領再選委員会関係者による野党民主党本部への不法侵入・盗聴事件が、この政治スキャンダルの発端となった。', process:'ニクソン大統領自身による組織的な隠蔽工作が『ワシントン=ポスト』紙記者の粘り強い調査報道と匿名情報提供者「ディープ・スロート」の内部告発を通じて明るみに出て、連邦議会下院司法委員会による弾劾条項可決が確実となる中、ニクソンは1974年8月に自ら辞任を表明した。', significance:'現職大統領が任期途中で辞職する合衆国史上唯一の事態となり、この事件は政府・大統領職への国民的信頼を大きく傷つけ、以後の調査報道の権威向上と大統領権限の濫用を防ぐための一連の制度改革(独立検察官制度の創設など)を促す長期的な影響を残した。', debate:'弾劾採決・上院での有罪判決を待たずに自ら辞任した決断を、責任ある政治的判断とみるか、法的追及を回避する手段とみるかで評価が分かれる。'} },
  { id:'richard_nixon', name:'リチャード・ニクソン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1913, end:1994, region:'アメリカ合衆国',
    desc:{background:'反共主義者として名を上げ副大統領・上院議員を歴任した経歴が、1968年の第37代大統領選出の背景となった。', process:'冷戦下の対中国交正常化(1972年の電撃的な訪中)や対ソ緊張緩和(デタント、SALT合意)を推進して外交面で大きな実績を残す一方、国内ではベトナム戦争の「名誉ある撤退(ベトナム化政策)」を進めたが、再選をめぐる不正工作(ウォーターゲート事件)の隠蔽工作が発覚し任期途中で辞任した。', significance:'冷戦の対立構造そのものを変容させる画期的な外交転換を成し遂げたが、権力乱用・法の支配軽視への厳しい批判という両極端な評価が今日まで併存している。', debate:'外交手腕への高い評価と国内統治における権力濫用という両面をどう統合的に評価すべきかは、アメリカ大統領史上最も複雑な人物評価の一つとして論じられる。'} },
  // ===================== 現代(1980年代〜現在) =====================
  { id:'jimmy_carter', name:'ジミー・カーター', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1924, end:2024, region:'アメリカ合衆国',
    desc:{background:'ウォーターゲート事件後の政治不信を背景に、ワシントン政界とは無縁な「アウトサイダー」としての清新さを訴えたことが、第39代大統領当選の背景となった。', process:'人権外交を外交理念の柱に掲げ、キャンプ=デービッドでイスラエル・エジプト両首脳との集中協議を主導して両国間の歴史的な和平条約(1979年)を仲介したが、イラン人質事件の解決に失敗し第二次石油危機によるスタグフレーションへの対応にも苦慮して1980年選挙で再選を逃した。', significance:'退任後は非営利団体を通じた選挙監視・貧困住宅建設支援などの人道活動に生涯を捧げ、2002年にノーベル平和賞を受賞するなど「最も評価の高い元大統領」としての活動でも知られる。', debate:'在任中の外交的成果(エジプト・イスラエル和平)と、イラン人質事件・経済危機による支持喪失という対照的な評価をどう総合すべきか、また退任後の活動が在任中の評価をどこまで補うべきかが論じられる。'} },
  { id:'ronald_reagan', name:'ロナルド・レーガン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1911, end:2004, region:'アメリカ合衆国',
    desc:{background:'俳優からカリフォルニア州知事を経て第40代大統領となった経歴が、「政府こそが問題」という理念に基づく政策の背景となった。', process:'減税と規制緩和・小さな政府を掲げる「レーガノミクス」を推進し、対ソ連関係ではソ連を「悪の帝国」と名指しして軍拡競争(SDI)を仕掛けたが、ゴルバチョフ政権発足後は一転して融和的な首脳会談を重ねINF全廃条約(1987年、史上初めて特定の種類の核兵器を実際に廃棄した条約)を実現した。', significance:'対決と対話を巧みに使い分けた冷戦終盤の外交を体現し、冷戦終結への流れを大きく前進させた。', debate:'「レーガノミクス」は財政赤字の急拡大という副作用を伴いつつも長期的な景気拡大の起点となったとされるが、この副作用と成果のどちらを重視すべきかで経済政策上の評価が分かれる。'} },
  { id:'end_of_cold_war', name:'冷戦の終結', category:'event', lat:38.90, lng:-77.04, start:1989, end:1991, region:'アメリカ合衆国・ソビエト連邦',
    desc:{background:'ソ連のゴルバチョフ政権による改革(グラスノスチ・ペレストロイカ)が、統制の緩和を通じて東欧諸国における反体制運動の噴出を許したことが背景となった。', process:'1989年のベルリンの壁崩壊を頂点とする東欧革命の連鎖的な広がりを経て、1991年のソ連解体をもって半世紀近く続いた米ソ冷戦は終結し、ブッシュ(父)とゴルバチョフによるマルタ会談はこの終わりを両首脳が共同で宣言した象徴的な出来事となった。', significance:'アメリカは唯一の超大国としての地位を確立し「アメリカ一極体制」とも呼ばれる新たな段階に入ったが、冷戦下の東西対立という単純化された枠組みで抑えられていた地域的な民族・宗教紛争が各地で噴出した。', debate:'冷戦終結が「アメリカの勝利」として一方的に語られることの是非、勢力均衡の崩壊が新たな安全保障上の課題を生んだことをどこまで冷戦終結の「代償」として捉えるべきかが論じられる。'} },
  { id:'george_hw_bush', name:'ジョージ・H・W・ブッシュ', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1924, end:2018, region:'アメリカ合衆国',
    desc:{background:'第二次世界大戦での従軍経験とレーガン政権の副大統領を8年務めた経験が、第41代大統領選出と豊富な外交経験の背景となった。', process:'冷戦終結という歴史的転換期を安定的に管理する手腕を発揮し、イラクによるクウェート侵攻に対しては国連安保理での多国籍軍結成という冷戦後初の国際協調的枠組みを主導して湾岸戦争(1991年)で圧勝したが、選挙戦で掲げた「新たな増税は行わない」という公約を財政再建のため撤回せざるを得なかった。', significance:'一時は歴代最高水準の支持率を得たが、湾岸戦争後の景気後退への対応の遅れから支持を失い1992年選挙で再選を逃した。', debate:'冷戦終結という世界史的な激動を大過なく乗り切った外交手腕への評価と、国内経済運営への批判とが対照的に併存することは、外交と内政の実績のどちらが大統領評価においてより重視されるべきかという論点を提起する。'} },
  { id:'nafta_treaty', name:'北米自由貿易協定(NAFTA)', category:'treaty', lat:19.43, lng:-99.13, start:1994, end:1994, region:'アメリカ合衆国・カナダ・メキシコ',
    desc:{background:'アメリカ・カナダ・メキシコ間で関税を段階的に撤廃し資本・財の自由な移動を促進する必要が、ブッシュ(父)政権下での交渉開始の背景となった。', process:'クリントン政権下で発効し北米域内の製造業サプライチェーンの一体化を大きく促進したが、アメリカ国内では製造業の雇用がメキシコへ流出したとの批判が根強く、メキシコ国内でも小規模トウモロコシ生産農家が打撃を受けサパティスタ民族解放軍の武装蜂起(協定発効と同日)を招いた。', significance:'貿易額を飛躍的に拡大させ、2020年には内容を更新した新協定(USMCA)に置き換えられた。', debate:'自由貿易がもたらす経済全体の利益と、特定産業・地域における雇用喪失という不利益をどう衡量すべきかは、グローバル化の光と影を象徴する典型的な論争点である。'} },
  { id:'bill_clinton', name:'ビル・クリントン', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1946, end:2025, region:'アメリカ合衆国',
    desc:{background:'アーカンソー州知事から経済問題を前面に掲げて現職ブッシュを破ったことが、第42代大統領就任の背景となった。', process:'冷戦終結後の「平和の配当」を背景とした情報技術産業の急成長も追い風に長期の好景気を実現し財政赤字を黒字化させる一方、NAFTA発効やWTOへの中国加盟支援などグローバル化を積極的に推進し、旧ユーゴスラビア紛争への軍事介入とNATOの東方拡大を進めた。', significance:'私生活上のスキャンダルをめぐる偽証疑惑で下院により弾劾訴追されたが、上院での有罪評決には至らず罷免は免れた。', debate:'政策面での高い経済的実績とスキャンダルによる評判の傷という両面を併せ持つ大統領として、個人の私的行動と公職者としての実績評価をどう切り分けるべきかが論じられる。'} },
  { id:'september_11_attacks', name:'アメリカ同時多発テロ事件(9・11)', category:'event', lat:40.71, lng:-74.01, start:2001, end:2001, region:'アメリカ合衆国(ニューヨーク・ワシントンD.C.)',
    desc:{background:'国際テロ組織アルカイダの指導者ウサマ=ビンラディンが、湾岸戦争後のサウジアラビアへの米軍駐留などを機に反米へ転じたことが背景にある。', process:'乗っ取られた民間旅客機4機がニューヨークの世界貿易センタービル2棟とワシントン近郊のペンタゴンに突入し、約3000人が犠牲となった。', significance:'ブッシュ(子)政権は「テロとの戦い」を宣言してアフガニスタン・イラクへの軍事侵攻に踏み切り、国内では国土安全保障省の新設、愛国者法による捜査権限の大幅拡大など安全保障と個人の自由・プライバシーとの均衡をめぐる社会のあり方を大きく転換させた。', debate:'この事件を機に導入された安全保障強化策(愛国者法など)が、個人の自由・プライバシーの制約としてどこまで正当化されるかは今日も続く論争である。'} },
  { id:'george_w_bush', name:'ジョージ・W・ブッシュ', category:'person', parentId:'united_states', lat:38.90, lng:-77.04, start:1946, end:2025, region:'アメリカ合衆国',
    desc:{background:'2000年選挙でのフロリダ州の僅差の集計をめぐる連邦最高裁の判断(ブッシュ対ゴア判決)という異例の経緯が、第43代大統領就任の背景となった。', process:'9・11同時多発テロを受け「テロとの戦い」を宣言しアフガニスタンのタリバン政権を打倒、大量破壊兵器保有(後に情報の誤りと判明)を根拠にイラクへも侵攻したが、いずれも長期にわたる占領統治の混乱を招いた。', significance:'政権末期の2008年に発生した世界金融危機(リーマン=ショック)への対応に追われる中で任期を終えた。', debate:'テロとの戦いにおける安全保障政策と、長期化した戦争・金融危機という負の遺産との両面から今日も評価が議論されている。'} },
  { id:'war_on_terror', name:'アフガニスタン・イラク戦争(「テロとの戦い」)', category:'war', lat:38.90, lng:-77.04, start:2001, end:2021, region:'アメリカ合衆国・アフガニスタン・イラク',

function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

const activeCategories = new Set(Object.keys(CATEGORY_CONFIG));

/* =========================================================================
   サイドバー: フィルタリスト生成
   ========================================================================= */
const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];

function renderDesc(desc){
  if(!desc) return '';
  // 後方互換: 万一プレーン文字列のdescが残っていた場合はそのまま1段落で表示
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(250年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -1500, MAX_YEAR = 2025;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 250){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
