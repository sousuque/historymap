    } },
  { id:'templars_suppression', name:'テンプル騎士団の弾圧・解散', category:'event', lat:48.86, lng:2.35, start:1307, end:1314, region:'フランス',
    desc:{
      background:'十字軍運動の停滞によりテンプル騎士団の軍事的存在意義が薄れる一方、その国際的な金融業を通じた莫大な富の蓄積が、財政難のフィリップ4世の強い関心を引いたことが弾圧の背景にある。',
      process:'異端・冒涜行為の嫌疑をかけて団員を一斉に逮捕し、拷問による自白を強要して有罪と断定し、団長ジャック・ド・モレーらを火刑に処すとともに教皇にも解散を認めさせ、その財産の多くを接収した。',
      significance:'国家権力が宗教的権威(教皇)を利用しつつ有力な国際的組織を解体し財産を接収するという先例は、以後の国家と宗教団体の関係を考える上でしばしば参照される事例となった。',
      debate:'弾圧の根拠とされた異端行為の実態については、拷問による強要自白に基づくものであり冤罪であった可能性が高いというのが現在の歴史学における有力な見方である。'
    } },
  { id:'valois_dynasty', name:'ヴァロワ朝', category:'dynasty', lat:48.86, lng:2.35, start:1328, end:1589, region:'フランス',
    desc:{
      background:'カペー朝直系の断絶という王朝の危機に際し、女系継承を否定するサリカ法の原則が適用され、フランス側の傍系男子が優先されたことが継承の背景にある。',
      process:'この継承をめぐりイングランド王(母方でカペー家の血を引く)が異議を唱えて百年戦争が勃発し、当初劣勢であったが、ジャンヌ・ダルクの登場を機にシャルル7世のもとで勝利を収め、以後は絶対王政へ向かう中央集権化を推進した。',
      significance:'百年戦争という長期の試練を乗り越える過程で常備軍・課税制度が整備され、以後のフランスがヨーロッパ有数の中央集権国家へと発展する制度的基盤が築かれた。',
      debate:'サリカ法という継承原則そのものが、実は都合よく後付けで正当化のために持ち出された側面が強いとする見方は、この王位継承紛争の法的正統性を考える上で重要な指摘である。'
    } },
  { id:'charles_vii_france', name:'シャルル7世(勝利王)', category:'person', lat:47.9, lng:1.91, start:1403, end:1461, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'劣勢を極めた百年戦争の最中、王太子でありながら王位継承の正統性にも疑念(『ブールジュの王』と揶揄される不遇な立場)を持たれていたことが、その苦しい治世初期の背景にある。',
      process:'ジャンヌ・ダルクの登場によりオルレアン包囲を解きランスでの戴冠を実現して正統性を確立し、以後常備軍(勅令隊)の創設や新たな課税制度(タイユ税の恒常化)を通じて軍事力・財政基盤を強化し、最終的にイングランド勢力を大陸からほぼ一掃した。',
      significance:'百年戦争の勝利と並行して進めた軍制・税制改革は、以後のフランス王権による中央集権的絶対王政への移行を大きく前進させた。',
      debate:'ジャンヌ・ダルクを見捨てるかのような対応(彼女がイングランド側に捕らえられた際に十分な救援を行わなかったこと)については、王としての冷徹な政治判断とみるか、恩知らずな背信行為とみるかで評価が分かれる。'
    } },
  { id:'louis_xi_france', name:'ルイ11世(蜘蛛王)', category:'person', lat:48.86, lng:2.35, start:1423, end:1483, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'父シャルル7世との対立から一時亡命するなど不遇な皇太子時代を送った経験が、権謀術数を駆使する現実主義的な統治スタイルを培った背景にあるとされる。',
      process:'武力による正面対決を避け、婚姻・買収・離間策などの外交的謀略を駆使して最大の政敵であったブルゴーニュ公シャルル(突進公)を破滅に追い込み、その広大な遺領の多くを王領に組み入れた。',
      significance:'有力諸侯(特にブルゴーニュ公国)の脅威を除去したことで、王権に対抗しうる大規模な独立勢力をフランス国内からほぼ一掃し、次代の絶対王政確立への道を大きく切り開いた。',
      debate:'狡猾さを強調する『蜘蛛王』という否定的イメージに対し、結果として中央集権化を大きく前進させたその実務能力を高く評価する再評価も近年進んでいる。'
    } },
  { id:'italian_wars', name:'イタリア戦争', category:'war', lat:45.46, lng:9.19, start:1494, end:1559, region:'イタリア半島',
    desc:{
      background:'イタリア半島の分裂状態(都市国家・教皇領の分立)につけ込み、フランス・スペインの両大国がそれぞれ相続権を主張してこの豊かな地域への介入を図ったことが開戦の背景にある。',
      process:'フランス(ヴァロワ家)とスペイン・神聖ローマ帝国(ハプスブルク家)が半世紀以上にわたりイタリアの覇権を争い、パヴィアの戦いなどを経て次第にハプスブルク家が優勢に立ち、カトー・カンブレジ条約でフランスのイタリアへの野望は挫折した。',
      significance:'この戦争を通じてイタリアの先進的な人文主義・美術・建築の様式がフランスをはじめ北方へ伝播し、フランスにおけるルネサンス文化受容の重要な契機となった。',
      debate:'この長期の戦争が、イタリア諸都市国家の政治的独立を決定的に失わせ、以後長く外国勢力の草刈り場となる原因を作ったとする見方は、イタリア史における重要な論点である。'
    } },
  { id:'francis_i_france', name:'フランソワ1世', category:'person', lat:48.8, lng:2.12, start:1494, end:1547, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'神聖ローマ皇帝選挙での敗北(カール5世との対立)が、以後生涯にわたる両者のライバル関係と、それに起因するイタリア戦争継続の直接的動機となった。',
      process:'パヴィアの戦いで大敗し捕虜となる屈辱も経験したが、文化面ではイタリアから多くの芸術家(レオナルド・ダ・ヴィンチなど)を招いてフランス・ルネサンスを大きく開花させた。',
      significance:'軍事的には対ハプスブルク戦争で目立った成果を上げられなかったが、その文化政策はフランス宮廷文化の洗練と後のフランス語・美術の国際的威信向上に大きく寄与した。',
      debate:'カトリックの盟主でありながらオスマン帝国(スレイマン1世)と同盟を結ぶという『非キリスト教的』外交については、当時から強い批判を招いたが、現実政治(レアルポリティーク)の先駆例として評価する見方もある。'
    } },
  { id:'henry_ii_france', name:'アンリ2世', category:'person', lat:48.86, lng:2.35, start:1519, end:1559, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'父フランソワ1世から引き継いだハプスブルク家との対立構造が、治世を通じたイタリア戦争継続の基本的背景となった。',
      process:'カトー・カンブレジ条約でイタリア戦争を終結させた直後、その和平を祝う祝賀試合中の不慮の事故により命を落とした。',
      significance:'この突然の死はフランス王権の弱体化を招き、幼い息子たちの摂政として実権を握った王妃カトリーヌ・ド・メディシスのもとで、以後長期の宗教内乱(ユグノー戦争)の時代へと突入する契機となった。',
      debate:'馬上槍試合という一見偶発的な事故死が、その後のフランスの政治的混乱を招いた点で『歴史の偶然』の重みを考えさせる事例としてしばしば言及される。'
    } },
  { id:'catherine_de_medici', name:'カトリーヌ・ド・メディシス', category:'person', lat:48.86, lng:2.35, start:1519, end:1589, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'夫アンリ2世の急死により、いまだ幼い息子たち(フランソワ2世・シャルル9世・アンリ3世)の後見人として実質的な統治権を担わざるを得なくなったことが権力掌握の背景にある。',
      process:'カトリック・ユグノー両派の融和を図る宗教寛容策(サン・ジェルマン勅令など)を模索したが失敗し、その後サンバルテルミの虐殺への関与も指摘される中、宗教内乱の泥沼化を防げないまま実権を握り続けた。',
      significance:'その長期にわたる摂政・実質的統治は、王権が弱体化する危機を一定程度乗り切りブルボン朝への平和的な王朝交代を可能にする土壌を残した。',
      debate:'『マキャヴェリズムの体現者』として陰謀家的なイメージが強いが、実際には融和策を模索し続けた側面もあり、その評価は史料の党派性(プロテスタント側史料の敵対的記述)を踏まえた再検討が進んでいる。'
    } },
  { id:'french_wars_of_religion', name:'ユグノー戦争(フランス宗教戦争)', category:'war', lat:48.86, lng:2.35, start:1562, end:1598, region:'フランス',
    desc:{
      background:'カルヴァン派(ユグノー)が有力貴族層にも浸透し無視できない政治勢力となる一方、カトリック側(ギーズ家など)も強く反発したことが、宗教対立の政治化・軍事化を招いた背景にある。',
      process:'断続的な内戦とサンバルテルミの虐殺のような大規模な暴力を経て、最終的にユグノーから改宗したブルボン家のアンリ4世が即位し、ナントの王令による宗教的共存の制度化を通じて収拾を図った。',
      significance:'この長期の内戦を経てフランス国土は荒廃したが、最終的な収拾は宗教的少数派に一定の権利を認める『寛容』という統治原理を早期に確立する契機となった。',
      debate:'内戦の本質を純粋な宗教対立とみるか、地方貴族の中央王権への抵抗という政治的権力闘争としての側面を重視するかは、フランス宗教戦争研究における主要な論点である。'
    } },
  { id:'st_bartholomew_massacre', name:'サンバルテルミの虐殺', category:'event', lat:48.86, lng:2.35, start:1572, end:1572, region:'パリ',
    desc:{
      background:'アンリ・ド・ナヴァル(後のアンリ4世)とヴァロワ王女マルグリットの婚礼を機に多数の有力ユグノー貴族がパリに集結していたことが、この虐殺を大規模化させた直接の背景にある。',
      process:'ユグノーの指導者コリニー提督暗殺未遂の失敗を機に、王権(カトリーヌ・ド・メディシスの関与が指摘される)がユグノー指導者層の一掃を決断したとされ、パリでの虐殺は地方都市にも波及し数万人規模の犠牲者を出した。',
      significance:'この凄惨な事件はユグノー戦争をいっそう先鋭化させ、宗教的少数派の安全確保のためには制度的保障(要塞都市の保持権など)が不可欠であるという教訓を、後のナントの王令に反映させる一因となった。',
      debate:'この虐殺が国王シャルル9世・カトリーヌによる計画的な陰謀であったのか、それとも偶発的に暴走した民衆の宗教的熱狂によるものかについては、史料の解釈をめぐり長く議論が続いている。'
    } },
  { id:'henry_iv_france', name:'アンリ4世', category:'person', lat:48.86, lng:2.35, start:1553, end:1610, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'ヴァロワ朝の断絶(アンリ3世の暗殺)により、遠縁ながらブルボン家の血を引く彼が法的には最有力の王位継承候補となったが、ユグノーであったため多くのカトリック教徒の抵抗を受けたことが即位の困難な背景にある。',
      process:'『パリはミサに値する』と語りカトリックに改宗して広範な支持を獲得し即位を実現した後、ナントの王令によりユグノーに信仰の自由と一定の政治的・軍事的保障(要塞都市の保持)を認め、長期化した宗教戦争を終結させた。',
      significance:'内乱で荒廃した国土の復興(重商主義政策の先駆、道路・運河整備)に努め、宗教的少数派を制度的に包摂する統治モデルは近世ヨーロッパにおける寛容政策の先駆的事例となった。',
      debate:'信仰よりも国家の安定を優先したその改宗を『日和見的な変節』とみるか、内乱終結のための『高度に成熟した政治的決断』とみるかは、彼の評価の核心的論点である。'
    } },
  { id:'edict_of_nantes', name:'ナントの王令', category:'treaty', lat:47.22, lng:-1.55, start:1598, end:1598, region:'フランス(ナント)',
    desc:{
      background:'半世紀近くに及んだユグノー戦争による国土荒廃を終わらせるためには、単なる勝者による敗者の排除ではなく、双方が受け入れ可能な恒久的な共存の枠組みが必要とされていたことが背景にある。',
      process:'カトリックを国教としつつユグノーに一定地域での信仰の自由、公職就任権、要塞都市(ラ・ロシェルなど)の保持を認める、当時としては画期的な宗教的共存の制度を確立した。',
      significance:'近世ヨーロッパにおいて宗教的少数派に法的保障を与えた先駆的事例として高く評価され、以後ルイ14世による廃止(1685年)までの約1世紀にわたり宗教内乱の再発を防いだ。',
      debate:'『信仰の自由』とはいえあくまでカトリックを国教とする限定的な寛容策であり、近代的な政教分離・信教の自由とは性格が異なる点には留意が必要である。'
    } },
  { id:'bourbon_dynasty', name:'ブルボン朝', category:'dynasty', lat:48.86, lng:2.35, start:1589, end:1792, region:'フランス',
    desc:{
      background:'ヴァロワ朝の断絶という王朝の危機を、遠縁ながら正統な男系継承者であったブルボン家アンリ4世が引き継いだことが王朝樹立の背景にある。',
      process:'リシュリュー・マザランによる王権強化を経てルイ14世のもとで絶対王政の頂点(ヴェルサイユ体制)を迎え、ヨーロッパ随一の強国となったが、度重なる対外戦争による財政危機と特権身分温存への不満が蓄積し、フランス革命によって1792年に王政は一旦廃止された。',
      significance:'その絶対王政モデル(官僚制・常備軍・宮廷文化)は同時代の他のヨーロッパ諸国の統治スタイルの規範となり、フランス語・文化の国際的威信を大きく高めた。',
      debate:'この王朝の統治を『近代国家建設の到達点』と評価する見方と、特権身分温存など旧体制(アンシャン・レジーム)の構造的矛盾を体現するものと評価する見方が対立する。'
    } },
  { id:'louis_xiii_france', name:'ルイ13世', category:'person', lat:48.86, lng:2.35, start:1601, end:1643, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'父アンリ4世の暗殺により幼くして即位し、当初は母后マリー・ド・メディシスの摂政のもとで王権の弱体化が懸念されていたことが治世前半の背景にある。',
      process:'宰相リシュリューを重用してその現実主義的な統治手腕に全面的に依拠し、貴族の私的な軍事力(決闘の禁止など)やユグノーの政治的・軍事的特権(要塞都市の保持権)を武力で削減させた。',
      significance:'この治世を通じた王権と貴族・宗教的少数派との力関係の是正は、次代ルイ14世による絶対王政確立への直接の布石となった。',
      debate:'リシュリューへの全面的な信任は、王自身の政治的力量の欠如を示すものか、有能な人材を適切に登用し活用する統治能力の一形態として評価すべきかは議論がある。'
    } },
  { id:'richelieu', name:'リシュリュー(枢機卿宰相)', category:'person', lat:48.86, lng:2.35, start:1585, end:1642, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'王権の弱体化と貴族・宗教勢力の分立という国内の混乱状況が、強力な中央集権化を志向する彼の統治構想の出発点となった。',
      process:'貴族の城塞破壊や決闘禁止令などで貴族の軍事的独立性を削ぐ一方、対外的には三十年戦争でカトリック国でありながら国益(ハプスブルク家包囲網)を優先して新教国側(スウェーデンなど)を支援する現実主義外交を展開した。',
      significance:'『国家理性(レゾン・デタ)』を掲げ宗教的立場よりも国益を優先するその外交手法は、近代的な主権国家間の現実主義外交の先駆的モデルとして高く評価されている。',
      debate:'カトリック聖職者でありながら新教国を支援する外交姿勢は、同時代から『信仰なき政治家』との強い批判を招いており、宗教と国益のどちらを政治の指針とすべきかという普遍的な論点を提起している。'
    } },
  { id:'mazarin', name:'マザラン(枢機卿宰相)', category:'person', lat:48.86, lng:2.35, start:1602, end:1661, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'リシュリューの後継者として抜擢されたイタリア出身の枢機卿として、幼いルイ14世とその母后アンヌ・ドートリッシュの摂政体制を支える立場にあったことが、その困難な統治の背景にある。',
      process:'外国人・成り上がり者への反感も背景にフロンドの乱という貴族・高等法院の反乱を招いたが、これを乗り切り、三十年戦争を終結させたウェストファリア条約の交渉を主導してフランスの大国としての地位を確立した。',
      significance:'フロンドの乱を通じた王権の危機的経験は、成人後のルイ14世が地方に依拠しない中央集権的な絶対王政を志向する重要な原体験となった。',
      debate:'外国出身者への反感が乱の一因であったことは、当時のフランスにおける『国民』意識と外国人排斥感情の関係を考える上で示唆的な論点である。'
    } },
  { id:'fronde', name:'フロンドの乱', category:'revolution', lat:48.86, lng:2.35, start:1648, end:1653, region:'フランス',
    desc:{
      background:'マザランという外国出身の宰相による専制的な統治と重税政策への、高等法院(パリ高等法院)・貴族層双方の根強い不満が反乱の背景にある。',
      process:'当初は高等法院を中心とする穏健な抵抗(法服貴族のフロンド)であったが、次第に大貴族による武力反乱(貴族のフロンド)へと発展し、幼い国王一家がパリを追われる事態にまで至ったが、最終的に王権側が勝利し秩序が回復した。',
      significance:'この反乱を鎮圧した経験は、成人後のルイ14世が貴族をヴェルサイユに集住させ監視・統制する統治スタイルを追求する直接の動機となった。',
      debate:'この反乱を『貴族の身勝手な抵抗』とみるか、王権の専制化に対する伝統的な政治参加(高等法院による王令審査権)を守ろうとする正当な抵抗とみるかは評価が分かれる。'
    } },
  { id:'revocation_edict_nantes', name:'ナントの王令廃止(フォンテーヌブローの勅令)', category:'event', lat:48.4, lng:2.7, start:1685, end:1685, region:'フランス(フォンテーヌブロー)',
    desc:{
      background:'ルイ14世が『一つの王、一つの法、一つの信仰』という宗教的統一を絶対王政の理念的完成とみなし、ユグノーの存在をその妨げと考えたことが廃止の背景にある。',
      process:'ナントの王令を正式に廃止してプロテスタント信仰を事実上禁止し、亡命の自由すら認めないまま強制的な改宗を迫ったため、多数の有能なユグノー(商工業者・軍人・技術者)が禁を犯して国外へ亡命した。',
      significance:'亡命したユグノーの持つ技術・資本はオランダ・プロイセン・イギリスなど亡命先の経済発展に大きく寄与する一方、フランス自身は貴重な人材・資本の流出という深刻な経済的損失を被った。',
      debate:'この宗教的不寛容政策を絶対王政の理念的必然とみるか、経済合理性を欠いた自己破壊的な失政とみるかは、ルイ14世の治世全体の評価にも関わる重要な論点である。'
    } },
  { id:'war_spanish_succession', name:'スペイン継承戦争', category:'war', lat:48.86, lng:2.35, start:1701, end:1714, region:'ヨーロッパ全域',
    desc:{
      background:'スペイン=ハプスブルク家の断絶に際し、遺言により王位を得たルイ14世の孫がスペイン王位に就くことで、仏西両国が事実上一体化する可能性が周辺諸国に強い警戒感を抱かせたことが開戦の背景にある。',
      process:'イギリス・オーストリア・オランダなどが同盟を結んでフランス・スペインと戦い、長期の消耗戦の末、フランス側の孫の王位継承自体は認めつつも仏西両国の合邦を禁じるユトレヒト条約で終結した。',
      significance:'この条約によりヨーロッパにおける勢力均衡の原則が国際法上明確に確立され、以後の外交における基本理念として定着するとともに、フランスの覇権的膨張には事実上の歯止めがかけられた。',
      debate:'この戦争を通じてイギリスが獲得した通商特権(奴隷貿易独占権アシエントなど)は、大西洋三角貿易における同国の優位確立に大きく寄与しており、戦争の帰結を勢力均衡だけでなく経済的観点からも評価する必要がある。'
    } },
  { id:'louis_xv_france', name:'ルイ15世', category:'person', lat:48.8, lng:2.12, start:1710, end:1774, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'曾祖父ルイ14世から幼くして王位を継承し、長期にわたる摂政・宰相政治(オルレアン公、フルーリー枢機卿ら)の後に親政を開始したことが治世の複雑な背景にある。',
      process:'オーストリア継承戦争・七年戦争と相次ぐ大規模な対外戦争に関与し、特に七年戦争ではイギリスに敗れ北米(カナダ)・インドの植民地の大半を失うなど対外的威信を著しく低下させ、国内では寵姫らの浪費もあり財政悪化が進行した。',
      significance:'その治世における対外的失敗と財政悪化の蓄積は、次代ルイ16世が直面する深刻な財政危機、ひいてはフランス革命勃発の重要な遠因を残す結果となった。',
      debate:'『我が亡き後に洪水よ来たれ』という言葉に象徴される刹那的統治姿勢が実際の発言であったかは疑わしいが、後世この治世を革命の温床として否定的に評価する見方が広く定着している。'
    } },
  { id:'estates_general_1789', name:'三部会の招集(1789年)', category:'event', lat:48.8, lng:2.12, start:1789, end:1789, region:'ヴェルサイユ',
    desc:{
      background:'度重なる対外戦争(特にアメリカ独立戦争への支援)による財政破綻と、特権身分(聖職者・貴族)の免税特権への平民の不満蓄積が、この異例の議会招集を不可避なものとした。',
      process:'各身分ごとの議決方式(身分別議決)を主張する特権身分と、人数に応じた議決(頭数議決)を求める第三身分(平民代表)との間で議事運営をめぐり深刻に対立し、決裂した。',
      significance:'この対立の末に第三身分が単独で『国民議会』の樹立を宣言する事態に発展し、フランス革命勃発への直接の引き金となった。',
      debate:'175年ぶりというあまりの招集間隔は、それだけ絶対王政が身分制議会を必要としない強固な統治を続けてきたことを示す一方、その制度的空白が結果的に事態収拾の柔軟性を欠く一因になったとも指摘される。'
    } },
  { id:'tennis_court_oath', name:'テニスコートの誓い', category:'event', lat:48.8, lng:2.12, start:1789, end:1789, region:'ヴェルサイユ',
    desc:{
      background:'国王が第三身分の要求(頭数議決の導入)を拒み議事堂を閉鎖したことへの反発が、代表たちを急遽近隣のテニスコートへ集結させる直接の契機となった。',
      process:'第三身分の代表を中心とする議員たちが、憲法制定に至るまで決して解散しないことを全員で誓い合った。',
      significance:'この宣誓は国民の代表による自律的な憲法制定権力の樹立を意味し、事実上絶対王政から立憲君主政・国民主権へと向かう革命の出発点となった。',
      debate:'この行為を平和的な議会内抵抗の枠内にとどまるものとみるか、既に国王大権への明確な反逆を意味する革命的行為であったとみるかは、革命の起点をどこに置くかという議論とも関わる。'
    } },
  { id:'storming_bastille', name:'バスティーユ牢獄襲撃', category:'war', lat:48.85, lng:2.37, start:1789, end:1789, region:'パリ',
    desc:{
      background:'ネッケル罷免の報がパリ市民に伝わり、国王による武力弾圧への恐怖と食糧価格高騰への不満が結びついて、市中の緊張が一気に高まったことが蜂起の直接的背景にある。',
      process:'武器・火薬を求めて市民が要塞化された牢獄バスティーユを包囲し、守備隊との交戦の末にこれを陥落させ、司令官を殺害した。',
      significance:'専制の象徴とされた建物の陥落は革命の始まりを告げる象徴的事件となり、以後7月14日はフランス革命記念日として国民的記憶に刻まれ続けている。',
      debate:'陥落当時、実際の収容者はごく少数(7名)に過ぎなかったにもかかわらず、この事件が革命の象徴として神話化された過程は、歴史的記憶がいかに形成されるかを考える好例とされる。'
    } },
  { id:'declaration_rights_of_man', name:'人間と市民の権利の宣言(人権宣言)', category:'treaty', lat:48.8, lng:2.12, start:1789, end:1789, region:'フランス',
    desc:{
      background:'アメリカ独立宣言や啓蒙思想(ロック、ルソーら)の自然権思想が、旧体制の身分的特権を根本から否定する理論的支柱として広く共有されていたことが採択の思想的背景にある。',
      process:'国民議会が、自由・所有権・安全・圧政への抵抗を自然権として掲げ、法の下の平等・国民主権・権力分立の原則を簡潔な条文にまとめて採択した。',
      significance:'この宣言は以後の近代憲法・国際人権規範の基本文書として各国の人権思想に絶大な影響を与え、今日でもフランス憲法の一部として法的効力を持ち続けている。',
      debate:'『人』と謳いながら実際には女性や奴隷を明確に対象外としていたことは、オランプ・ドゥ・グージュによる『女性の権利宣言』などの批判を招き、この宣言の普遍性の限界を示す論点として現在も議論される。'
    } },
  { id:'reign_of_terror', name:'恐怖政治', category:'event', lat:48.86, lng:2.35, start:1793, end:1794, region:'フランス',
    desc:{
      background:'対外戦争(諸国干渉戦争)の危機的状況と国内の反革命勢力(ヴァンデの反乱など)の活発化が、非常事態における強権的統治を正当化する土壌となった。',
      process:'公安委員会を中心に反革命容疑者を裁判もそこそこにギロチンで次々に処刑し、ロベスピエールが『徳と恐怖』を掲げてこれを主導したが、次第に独裁的傾向を強めたことへの反発からテルミドールのクーデタで自身も処刑され終結した。',
      significance:'この時期の統治手法は以後の急進的革命運動における国家テロルの原型として繰り返し参照される一方、革命の理念そのものへの深刻な疑念を各国に植え付ける結果ともなった。',
      debate:'恐怖政治を対外・国内の危機に対する『やむを得ない非常措置』とみるか、革命理念からの本質的な逸脱・堕落とみるかは、フランス革命史研究における最大の論争点であり続けている。'
    } },
  { id:'directory_france', name:'総裁政府', category:'nation', lat:48.86, lng:2.35, start:1795, end:1799, region:'フランス',
    desc:{
      background:'恐怖政治への強い反動から、権力の一極集中を避けるべく複数指導者による集団指導体制を志向したことが、この特異な統治形態の背景にある。',
      process:'5人の総裁による合議制のもと内外の危機(王党派・ジャコバン派双方からの反乱、対外戦争)に対応したが、頻繁な政変(クーデタ)と経済的混乱により政情不安が続き、最終的に軍人ナポレオンの武力介入により打倒された。',
      significance:'権力分散を志向した統治実験は結果的に強力な指導力を欠き機能不全に陥り、単独指導者による安定した秩序を求める世論の高まりがナポレオン独裁を招く土壌を作った。',
      debate:'この政体の失敗を制度設計自体の欠陥(権力の弱さ)に求めるか、革命後の社会に内在する根本的な不安定要因(経済危機、党派対立)を重視するかは評価が分かれる。'
    } },
  { id:'coup_18_brumaire', name:'ブリュメール18日のクーデタ', category:'event', lat:48.86, lng:2.35, start:1799, end:1799, region:'パリ',
    desc:{
      background:'総裁政府の政情不安・経済的混乱への国民の不満と、エジプト遠征から帰国したナポレオンの軍事的名声・野心が結びついたことがクーデタの直接的背景にある。',
      process:'議会(五百人会)を武力で威圧して解散に追い込み、自らを含む3人の統領からなる統領政府を樹立し、まもなく国民投票を経て第一統領としての事実上の独裁権を確立した。',
      significance:'このクーデタをもってフランス革命は実質的に終結し、以後の帝政成立に至るナポレオン時代への移行が決定づけられた。',
      debate:'このクーデタを『革命の裏切り・簒奪』とみるか、機能不全に陥った政体を収拾し革命の成果(法典編纂、行政整備)を安定的に定着させた『必要な収拾』とみるかで評価が分かれる。'
    } },
  { id:'french_empire_napoleon', name:'フランス帝国(第一帝政)', category:'nation', lat:48.86, lng:2.35, start:1804, end:1815, region:'フランス',
    desc:{
      background:'統領政府下での安定的統治の実績と国民投票による圧倒的支持を背景に、終身統領からさらに世襲の皇帝位への移行が正当化されたことが帝政成立の背景にある。',
      process:'国民投票を経て皇帝に即位し(教皇を招きながらも自ら戴冠するという象徴的行為で知られる)、『ナポレオン法典』の制定など国内近代化を進める一方、対外的にはヨーロッパ大陸の大半を軍事的に征服・従属国化したが、ロシア遠征の大敗を機に急速に崩壊した。',
      significance:'法の下の平等・私有財産の保護などを定めたナポレオン法典は各地に広められ、近代的な民法体系の基礎として今日の大陸法系諸国にまで影響を及ぼし続けている。',
      debate:'革命の理念(自由・平等)を体現する近代化の推進者とみるか、皇帝という称号自体が革命理念(共和主義)への裏切りであり単なる軍事的専制に過ぎないとみるかは、根本的に対立する評価であり続けている。'
    } },
  { id:'bourbon_restoration', name:'ブルボン復古王政', category:'event', lat:48.86, lng:2.35, start:1814, end:1830, region:'フランス',
    desc:{
      background:'ナポレオン没落後、革命前の正統な王朝への回帰を求める列強(特にウィーン体制を主導するメッテルニヒ)の意向が、ブルボン家復位を後押しする国際的背景となった。',
      process:'ルイ18世は立憲的な憲章を発布し革命の一部成果(私有財産制など)と王政の折り合いを図る穏健路線をとったが、後継のシャルル10世が反動的な政策を強めたことへの反発から七月革命が勃発し王政は再び倒れた。',
      significance:'この復古王政の失敗は、革命以前への完全な回帰がもはや不可能であり、何らかの形で立憲的要素を組み込んだ統治が不可避であることをフランス社会に改めて示す結果となった。',
      debate:'ルイ18世の穏健路線とシャルル10世の反動路線という対照的な統治スタイルの帰結の違いは、王政復古が持続可能であったかを考える上での重要な比較対象とされる。'
    } },
  { id:'louis_xviii', name:'ルイ18世', category:'person', lat:48.86, lng:2.35, start:1755, end:1824, region:'フランス', parentId:'bourbon_dynasty',
    desc:{
      background:'処刑された兄ルイ16世、幽閉死した甥(ルイ17世とされる少年)に代わり、亡命生活の末にナポレオン没落を機に帰国し即位したことが、その慎重な統治姿勢の背景にある。',
      process:'革命の成果(法の下の平等、財産権保障など)を一定程度容認する立憲的な憲章を自ら発布し、王党派の急進的な報復要求を抑制しつつ現実的な国民和解を模索した。',
      significance:'この穏健路線は復古王政をひとまず安定させ、革命前への完全な回帰が不可能である以上、立憲的要素を取り込んだ統治が現実的選択肢であることを示した。',
      debate:'その慎重な現実主義を高く評価する見方がある一方、王党派内の急進派(『ユルトラ』)からは弱腰とみなされ、後継シャルル10世の反動化を招く一因になったとも指摘される。'
    } },
  { id:'charles_x_france', name:'シャルル10世', category:'person', lat:48.86, lng:2.35, start:1757, end:1836, region:'フランス', parentId:'bourbon_dynasty',
    desc:{
      background:'兄ルイ18世とは対照的に、亡命貴族(ユルトラ)の反動的な要求に共鳴し、革命前の絶対王政・特権身分優位の秩序への回帰を志向したことが治世の性格を規定した。',
      process:'亡命貴族への補償金支給や出版・選挙制度の制限など反動的政策を進め、最終的に議会を無視する勅令(七月勅令)を発したことがパリ市民の武装蜂起を招き、退位・亡命に追い込まれた。',
      significance:'その失脚をもってブルボン家の直系による統治は完全に終わり、フランスは再び立憲君主政(七月王政)という新たな政体を模索する段階に入った。',
      debate:'彼の反動政策を単なる個人的な信条の表れとみるか、王党派内の政治的圧力に押された結果とみるかは、復古王政崩壊の要因分析における論点となる。'
    } },
  { id:'july_revolution_1830', name:'七月革命', category:'revolution', lat:48.86, lng:2.35, start:1830, end:1830, region:'パリ',
    desc:{
      background:'シャルル10世が議会を無視して出版統制・選挙権制限を強行する勅令(七月勅令)を発したことが、パリ市民・自由主義的ブルジョワジーの蜂起を誘発する直接の契機となった。',
      process:'『栄光の三日間』と呼ばれる短期間の市街戦の末に国王軍は制圧され、シャルル10世は亡命に追い込まれ、代わって自由主義的とみなされていたオルレアン家のルイ・フィリップが『フランス人の王』として迎えられた。',
      significance:'この革命は単に王朝を交代させただけでなく、王権が『神授』ではなく国民(実質的には有産市民層)の意思に基づくものであるという原則を確立し、他のヨーロッパ諸国の自由主義運動にも波及した。',
      debate:'この革命の主体を『パリ民衆全体』とみるか、実際に政治的果実を得たのはごく一部の富裕な金融ブルジョワジーに過ぎなかったとみるかは、革命の社会的性格をめぐる重要な論点である。'
    } },
  { id:'july_monarchy', name:'七月王政', category:'nation', lat:48.86, lng:2.35, start:1830, end:1848, region:'フランス',
    desc:{
      background:'七月革命の主体となった自由主義的ブルジョワジーの利害を代弁する政体として、極端に制限された財産資格選挙制のもとでの立憲君主政が構想されたことが成立の背景にある。',
      process:'『フランス人の王』を称するルイ・フィリップのもとで銀行家・大資本家(『金融貴族』)が政治の実権を握り、産業革命の進展にもかかわらず選挙権拡大の要求には一貫して消極的な姿勢を貫いた。',
      significance:'この体制のもとでの急速な産業化と資本主義の発展は、後の労働者階級の政治的自覚と社会主義思想の台頭を促す社会的基盤を形成した。',
      debate:'『自由主義』を掲げながら実態は富裕層の利益を優先する体制であったことは、形式的な立憲主義と実質的な政治参加の乖離という、代議制民主主義における普遍的な問題を先取りするものであった。'
    } },
  { id:'louis_philippe', name:'ルイ・フィリップ', category:'person', lat:48.86, lng:2.35, start:1773, end:1850, region:'フランス', parentId:'july_monarchy',

  { id:'february_revolution_1848_france', name:'二月革命', category:'revolution', lat:48.86, lng:2.35, start:1848, end:1848, region:'パリ',

      process:'パリでの市街戦を経てルイ・フィリップは退位・亡命に追い込まれ、成年男子普通選挙に基づく第二共和政が樹立され、この革命の波及効果はドイツ・オーストリア・イタリアなど『諸国民の春』と呼ばれる1848年革命の連鎖を各地で誘発した。',

  { id:'second_republic_france', name:'第二共和政', category:'nation', lat:48.86, lng:2.35, start:1848, end:1852, region:'フランス',

  { id:'napoleon_iii', name:'ナポレオン3世(ルイ・ナポレオン)', category:'person', lat:48.86, lng:2.35, start:1808, end:1873, region:'フランス', parentId:'second_empire_france',

  { id:'franco_prussian_war', name:'普仏戦争', category:'war', lat:49.71, lng:4.95, start:1870, end:1871, region:'フランス・ドイツ',

  { id:'dreyfus_affair', name:'ドレフュス事件', category:'event', lat:48.86, lng:2.35, start:1894, end:1906, region:'フランス',

  { id:'vichy_france', name:'ヴィシー政権', category:'nation', lat:46.13, lng:3.42, start:1940, end:1944, region:'フランス(南部・ヴィシー)',

  { id:'free_france', name:'自由フランス', category:'nation', lat:51.51, lng:-0.13, start:1940, end:1944, region:'ロンドン(亡命政府)〜フランス各地',

  { id:'charles_de_gaulle', name:'シャルル・ド・ゴール', category:'person', lat:48.86, lng:2.35, start:1890, end:1970, region:'フランス', parentId:'fifth_republic_france',

  { id:'algerian_war', name:'アルジェリア戦争', category:'war', lat:36.75, lng:3.06, start:1954, end:1962, region:'アルジェリア',

  { id:'fifth_republic_france', name:'フランス第五共和政', category:'nation', lat:48.86, lng:2.35, start:1958, end:2000, region:'フランス',

      background:'シュタウフェン家とヴェルフェン家という有力諸侯間の長年の対立を融和させる形で選出されたことが、比較的安定した権力基盤を得る背景となった。',
      process:'皇帝権の古代ローマ的権威(法学者を動員した『皇帝権はローマ法に由来する』という理論武装)を掲げてイタリアの富裕都市(ミラノなど)への統制強化を図ったが、ロンバルディア同盟の抵抗(レニャーノの戦いでの敗北)により挫折し、晩年は第3回十字軍遠征の途上、川で溺死したと伝えられる。',
      significance:'その武勇と統治は後世『赤髭王』としてドイツ・ナショナリズムの象徴的英雄像に祭り上げられ、19世紀のドイツ統一運動においても理想化された存在として繰り返し参照された。',
      debate:'イタリア政策への固執が結果的に本国ドイツにおける諸侯の自立傾向を放置・助長する結果を招いたのではないかという見方は、皇帝権の分裂的性格を考える上で重要な論点である。'
    } },
  { id:'frederick_ii_hre', name:'フリードリヒ2世(シュタウフェン朝)', category:'person', lat:50.78, lng:6.08, start:1194, end:1250, region:'神聖ローマ帝国・シチリア王国', parentId:'hre',
    desc:{
      background:'シチリア王国という先進的な多文化的環境(イスラーム・ギリシア・ラテン文化の融合)で育った経験が、その卓越した知的関心と柔軟な統治姿勢の背景にある。',
      process:'十字軍(第6回)では戦闘によらず外交交渉のみでエルサレムの返還を実現するという異例の成果を上げる一方、教皇との対立(複数回の破門)は激化し続け、その死後シュタウフェン家は急速に断絶に追い込まれた。',
      significance:'『世界の驚異(ストゥポル・ムンディ)』と称されたその学芸奨励(シチリア詩派の育成など)は、後のイタリア・ルネサンス文化の遠い先駆としても評価されることがある。',
      debate:'彼を『近代的合理精神を先取りした啓蒙的君主』とみる見方と、実際にはあくまで中世的な皇帝権・十字軍理念の枠内で行動した人物であったとする見方とが対立する。'
    } },
  { id:'great_interregnum', name:'大空位時代', category:'event', lat:50.78, lng:6.08, start:1254, end:1273, region:'神聖ローマ帝国',
    desc:{
      background:'シュタウフェン朝断絶後、選帝侯たちが自らの利害に沿った弱小な皇帝候補を乱立させたことが、実質的な統治不在状態を招いた背景にある。',
      process:'外国出身者を含む複数の『皇帝』が並立する混乱状態が続き、諸侯・自由都市はこの空白に乗じて事実上の独立的な統治権(裁判権・課税権)を確立していった。',
      significance:'この時期に定着した諸侯・都市の自立性は、以後の神聖ローマ帝国が中央集権化に向かわず分権的な連合体的性格を強く帯び続ける構造的要因となった。',
      debate:'この混乱を経てなお帝国という枠組み自体が消滅しなかったことは、皇帝位の持つ象徴的権威が実質的統治権の欠如にもかかわらず一定の求心力を保ち続けたことを示す興味深い事例とされる。'
    } },
  { id:'golden_bull_1356', name:'金印勅書', category:'treaty', lat:50.11, lng:14.44, start:1356, end:1356, region:'神聖ローマ帝国(プラハ)',
    desc:{
      background:'大空位時代の混乱を教訓に、皇帝選出手続きをめぐる紛争を未然に防ぐ明確なルールの制定が求められていたことが背景にある。',
      process:'皇帝カール4世が、聖俗7人の有力諸侯(選帝侯)を皇帝選出権者として明確に定め、その領邦における不可分性・独自の裁判権なども併せて保障した。',
      significance:'この勅書は帝国の統一よりも領邦国家の分立を法的に追認・固定化する性格が強く、以後長く続くドイツの政治的分裂状態の制度的基盤となった。',
      debate:'分裂を助長したとして否定的に評価される一方、明確なルール制定により少なくとも皇帝選出をめぐる大規模な内乱を防いだ実務的効果を評価する見方もある。'
    } },
  { id:'maximilian_i_habsburg', name:'マクシミリアン1世', category:'person', lat:48.21, lng:16.37, start:1459, end:1519, region:'神聖ローマ帝国(ハプスブルク家)', parentId:'habsburg',
    desc:{
      background:'軍事力による領土拡大が限界に近づいていた時代状況の中、婚姻政策という平和的手段による勢力拡大の可能性にいち早く着目したことが独自の戦略の背景にある。',
      process:'自らのブルゴーニュ女公マリーとの結婚、子・孫たちの周到な政略結婚(スペイン王女との縁組など)を通じ、戦争によらずしてネーデルラント・スペイン・新大陸植民地を次々にハプスブルク家の勢力圏に組み込んだ。',
      significance:'この婚姻戦略により息子フィリップ美公・孫カール5世の代には『太陽の沈まぬ帝国』と称される空前の広域支配が実現し、近世ヨーロッパ国際政治におけるハプスブルク家の卓越した地位が確立された。',
      debate:'軍事によらない領土拡大を『先進的な外交戦略』と評価する見方がある一方、婚姻で得た広域支配は各地の文化的・政治的統合を欠いたまま拡大したため、後の統治上の困難(反乱の頻発)を内包していたとも指摘される。'
    } },
  { id:'charles_v_hre', name:'カール5世(神聖ローマ皇帝/カルロス1世)', category:'person', lat:50.78, lng:6.08, start:1500, end:1558, region:'神聖ローマ帝国・スペイン', parentId:'hre',
    desc:{
      background:'祖父マクシミリアン1世の婚姻政策の集大成として、スペイン・ネーデルラント・オーストリア・新大陸植民地という広大な遺領を一身に相続したことが、その空前の権勢の背景にある。',
      process:'神聖ローマ皇帝位も獲得して『日の沈まぬ帝国』を築いたが、フランソワ1世とのイタリア戦争、ルターに端を発する宗教改革の拡大、オスマン帝国の脅威という三正面の課題に忙殺され、最終的にアウクスブルクの和議を受け入れざるを得ず、失意のうちに退位して領土をスペイン系とオーストリア系に分割した。',
      significance:'その広大すぎる領土は結果として単独での統治の限界を露呈し、以後ハプスブルク家は分割相続によりスペイン・オーストリア両系統として並立する形で存続することとなった。',
      debate:'『カトリック世界帝国』の理想を追求したその治世を、時代錯誤な中世的普遍帝国理念の最後の輝きとみるか、近世ヨーロッパにおける現実的な大国間バランスの一極とみるかは評価が分かれる。'
    } },
  { id:'diet_of_worms', name:'ヴォルムス帝国議会(ルター召喚)', category:'event', lat:49.63, lng:8.36, start:1521, end:1521, region:'神聖ローマ帝国(ヴォルムス)',
    desc:{
      background:'『九十五カ条の論題』以降急速に拡大するルターの影響力に対し、皇帝カール5世が帝国の宗教的・政治的統一を守る立場から公式な審問の場を設ける必要に迫られたことが招集の背景にある。',
      process:'身の安全を保障されて出頭したルターは『これが私の立場です、他にはなしえません』(伝承)と主張の撤回を拒否し、皇帝はこれを法の保護外に置く勅令を発したが、ザクセン選帝侯フリードリヒ賢明公の保護のもとルターは身を隠しつつ聖書のドイツ語訳などの活動を続けた。',
      significance:'この対決は宗教改革が単なる神学論争にとどまらず、皇帝権と諸侯の政治的力学が絡む帝国全体の一大事件へと発展したことを象徴する出来事となった。',
      debate:'ルターの身の安全がザクセン選帝侯という世俗権力の庇護に依存していたことは、宗教改革の成否が純粋な信仰の力だけでなく、政治権力との結びつきに大きく左右されていたことを示す論点である。'
    } },
  { id:'peasants_war_germany', name:'ドイツ農民戦争', category:'war', lat:49.79, lng:9.93, start:1524, end:1525, region:'ドイツ南西部',
    desc:{
      background:'領主による賦役・貢租の増大という経済的圧迫に加え、ルターの『キリスト者の自由』などの主張が(本人の意図に反し)既存の社会秩序全体への異議申し立てとして農民層に解釈されたことが蜂起の思想的背景にある。',
      process:'『十二カ条』などに社会的要求(狩猟権・共有地利用権の回復など)をまとめて各地で蜂起したが、統一的な指導・戦術を欠いたため、諸侯連合軍により各個撃破され徹底的に鎮圧された。',
      significance:'この反乱への対応をめぐりルターが最終的に諸侯側の鎮圧を支持したことは、宗教改革運動が既存の社会秩序(領主制)を維持したまま教会組織のみを改革する穏健な方向へ収斂していく重要な分岐点となった。',
      debate:'ルターの『豹変』(当初の同情的姿勢から一転した鎮圧支持)については、その神学(二王国論、世俗の秩序と信仰の峻別)に基づく一貫した立場とみるか、支援者である諸侯への配慮を優先した現実的判断とみるかで評価が分かれる。'
    } },
  { id:'schmalkaldic_war', name:'シュマルカルデン戦争', category:'war', lat:50.78, lng:6.08, start:1546, end:1547, region:'神聖ローマ帝国',
    desc:{
      background:'プロテスタント諸侯が防衛同盟(シュマルカルデン同盟)を結成して皇帝権への対抗姿勢を強めていたことが、皇帝カール5世による武力鎮圧を招く背景となった。',
      process:'皇帝軍がミュールベルクの戦いで同盟軍を破り軍事的には完勝したが、占領地での強引な統治(『仮信仰協定』の押し付けなど)がかえって新教諸侯の反発を再燃させ、最終的に妥協的な和議を模索せざるを得なくなった。',
      significance:'軍事的勝利にもかかわらず新教勢力を完全に一掃できなかったことは、宗教的分裂の既成事実化がもはや軍事力のみでは覆せない段階に達していたことを示している。',
      debate:'皇帝の軍事的勝利がなぜ政治的・宗教的解決に結びつかなかったのかについては、帝国内の諸侯自治の根強さと、皇帝権の実効支配力の限界という構造的要因が重視される。'
    } },
  { id:'peace_augsburg', name:'アウクスブルクの和議', category:'treaty', lat:48.37, lng:10.9, start:1555, end:1555, region:'神聖ローマ帝国(アウクスブルク)',
    desc:{
      background:'軍事的手段による宗教統一の試みが実効性を欠くことが明らかになる中、現実的な妥協案として領邦単位での宗教選択という原則が模索されたことが成立の背景にある。',
      process:'各領邦の支配者がカトリックかルター派かを選択しその地の住民もこれに従うという原則(のちに『領主の宗教、その地の宗教』と定式化)を確立し、宗教を理由とする帝国内での戦争を一旦終結させた。',
      significance:'宗教的統一を断念し複数宗派の並立を制度的に容認したこの和議は、近世ヨーロッパにおける『領邦教会制』の確立と主権国家形成の重要な一里塚となった。',
      debate:'カルヴァン派を対象から除外したことの不備は、この和議が抱えた構造的欠陥として、後の三十年戦争勃発の直接的な火種を残したという評価が定着している。'
    } },
  { id:'ferdinand_ii_hre', name:'フェルディナント2世', category:'person', lat:50.78, lng:6.08, start:1578, end:1637, region:'神聖ローマ帝国', parentId:'hre',
    desc:{
      background:'イエズス会の教育を受け対抗宗教改革(カトリック再興運動)に深く傾倒していたことが、即位後のプロテスタント諸侯への強硬姿勢の思想的背景にある。',
      process:'ボヘミア王としての強引なカトリック化政策がプラハ窓外投擲事件という新教貴族の反乱を招き、これが全ヨーロッパを巻き込む三十年戦争へと拡大する中、皇帝軍・カトリック連盟軍を率いて緒戦では優位に戦いを進めた。',
      significance:'彼の強硬な宗教政策は結果的に三十年戦争という未曾有の惨禍をドイツ全土にもたらし、以後の帝国の政治的・経済的凋落を決定づける転換点となった。',
      debate:'彼の信仰に基づく確固たる姿勢を評価する見方がある一方、その非妥協的な政策こそが本来局地的紛争で収拾しえた対立を国際的な大戦争へとエスカレートさせた主因であるとする批判も根強い。'
    } },
  { id:'wallenstein', name:'ヴァレンシュタイン', category:'person', lat:50.08, lng:14.44, start:1583, end:1634, region:'神聖ローマ帝国(皇帝軍)', parentId:'hre',
    desc:{
      background:'皇帝の財政が三十年戦争の長期化により逼迫する中、自らの資金で私兵軍を編成・維持し戦費を占領地からの徴発で賄うという独自の軍事事業モデルを確立したことが台頭の背景にある。',
      process:'皇帝軍最高司令官として各地で戦果を上げたが、その強大化した私兵力と独自の外交(新教勢力との単独講和の模索)への皇帝側の不信・警戒が高まり、最終的に皇帝の内諾のもと部下によって暗殺された。',
      significance:'私兵による戦争経済という彼の手法は戦争を長期化させる一因となったが、同時に当時のヨーロッパにおける傭兵軍事企業家という新たな戦争の担い手の存在を象徴する事例となった。',
      debate:'彼の最期(皇帝の意向を受けた暗殺)については、真に反逆(新教側との内通)を企てていたのか、それとも過度な権勢への皇帝側の疑心暗鬼による粛清であったのか、史料的にも解釈が分かれ続けている。'
    } },
  { id:'sweden_great_power', name:'スウェーデン(バルト帝国時代)', category:'nation', lat:59.33, lng:18.06, start:1611, end:1721, region:'バルト海沿岸',
    desc:{
      background:'バルト海沿岸の資源(銅・鉄)と、グスタフ=アドルフによる近代的軍制改革が、人口小国スウェーデンを軍事大国へと押し上げる基盤となった。',
      process:'三十年戦争にプロテスタント側で介入して軍事的名声を確立し、戦後のウェストファリア条約でバルト海沿岸の領土を獲得して『バルト帝国』としての地位を固めたが、大北方戦争でロシアのピョートル1世に敗れその覇権を失った。',
      significance:'一時的にせよ北欧の小国が近代的軍制を武器にヨーロッパ国際政治の主要プレイヤーとなった事例として、軍事技術革新が国力バランスに与える影響の大きさを示している。',
      debate:'この大国化を支えた人的・財政的基盤の脆弱性(人口規模の小ささ)は、大北方戦争での急速な没落からも分かるように、軍事的成功と国力の持続可能性との乖離を示す事例として論じられる。'
    } },
  { id:'gustav_adolf_sweden', name:'グスタフ=アドルフ', category:'person', lat:59.33, lng:18.06, start:1594, end:1632, region:'スウェーデン', parentId:'sweden_great_power',
    desc:{
      background:'父カール9世から受け継いだ対デンマーク・対ロシア・対ポーランドの複数の戦争を通じ、実戦の中で軍制改革の必要性を痛感したことが背景にある。',
      process:'歩兵・騎兵・砲兵を有機的に連動させる近代的な線形戦術を確立してブライテンフェルトの戦いなどで連勝を重ねドイツ深くまで進撃したが、リュッツェンの戦いで濃霧の中の混戦の末に戦死した。',
      significance:'その軍制改革(機動性を重視した軽量砲の採用など)は近代軍事史における画期とされ、『近代戦争の父』とも称されるほど後世の軍事理論に大きな影響を与えた。',
      debate:'彼の参戦動機を『プロテスタント信仰の擁護』という理念的側面から評価するか、バルト海沿岸における領土的野心という現実的側面から評価するかは議論が分かれる。'
    } },
  { id:'prussia_kingdom', name:'プロイセン王国', category:'nation', lat:52.52, lng:13.4, start:1701, end:1871, region:'北ドイツ(ブランデンブルク・プロイセン)',
    desc:{
      background:'神聖ローマ帝国内の一辺境伯領に過ぎなかったブランデンブルクが、東方の公国プロイセンとの同君連合を通じて帝国外の領土(王号を称しうる領域)を得たことが王国成立の背景にある。',
      process:'スペイン継承戦争への協力の見返りとして皇帝から王号使用を承認され、以後軍事力を統治の最優先課題とする『軍隊国家』として発展し、フリードリヒ2世(大王)のもとでシュレジエンを獲得してヨーロッパ五大国の一角に躍進した。',
      significance:'資源に乏しい後発国家でありながら徹底した軍事・行政効率化により大国化を遂げたこのモデルは、後のドイツ統一における主導権を握る国家的基盤となった。',
      debate:'軍事最優先の国家運営を『効率的な後発近代化のモデル』と評価する見方と、これが後のドイツにおける軍国主義的伝統(プロイセン軍国主義)の淵源になったとする批判的見方とが対立する。'
    } },
  { id:'hohenzollern_dynasty', name:'ホーエンツォレルン家', category:'dynasty', lat:52.52, lng:13.4, start:1415, end:1918, region:'ブランデンブルク・プロイセン・ドイツ帝国',
    desc:{
      background:'神聖ローマ皇帝ジギスムントから財政的困窮を理由にブランデンブルク選帝侯領を与えられたことが、この家系の政治的台頭の出発点となった。',
      process:'同君連合によるプロイセン公国との結合、大選帝侯フリードリヒ・ヴィルヘルムによる常備軍・官僚制整備を経て、フリードリヒ2世のもとで列強の一角に成長し、最終的にヴィルヘルム1世のもとでドイツ皇帝家へと発展した。',
      significance:'一辺境の弱小家系から数世紀を経てドイツ統一を主導する帝室にまで成長した経緯は、近世ヨーロッパにおける新興勢力の台頭過程を示す代表的事例となっている。',
      debate:'第一次世界大戦の敗北による帝政崩壊・亡命という急激な没落は、それまでの数世紀にわたる着実な国力拡大とは対照的であり、近代国家における君主制の脆弱性を象徴する事例とされる。'
    } },
  { id:'frederick_william_i_prussia', name:'フリードリヒ・ヴィルヘルム1世(軍人王)', category:'person', lat:52.52, lng:13.4, start:1688, end:1740, region:'プロイセン王国', parentId:'prussia_kingdom',
    desc:{
      background:'先代フリードリヒ1世の華美な宮廷文化(初代国王としての体裁重視)への反動から、実質的な国力(軍事力・財政)強化を最優先する統治方針を採用したことが治世の特徴である。',
      process:'極端な倹約財政のもとで巨額の資金を軍備(『長い兵士たち』と呼ばれる近衛連隊を含む)に投じ、効率的な官僚制(将軍会議)を整備して、実戦経験には乏しいものの当時ヨーロッパ有数の規律ある常備軍を築き上げた。',
      significance:'彼が蓄積した強大な軍事力と充実した国庫は、後継のフリードリヒ2世がシュレジエンを奪取しプロイセンを一躍列強に押し上げる直接の物質的基盤となった。',
      debate:'息子フリードリヒ(後の大王)への厳格すぎる教育・虐待的とも評される扱いは、後世の伝記研究において親子関係の心理的側面からもしばしば論じられる。'
    } },
  { id:'frederick_the_great', name:'フリードリヒ2世(大王)', category:'person', lat:52.52, lng:13.4, start:1712, end:1786, region:'プロイセン王国', parentId:'prussia_kingdom',
    desc:{
      background:'父フリードリヒ・ヴィルヘルム1世が蓄積した強大な軍事力と財政基盤を継承し、即位直後という好機を捉えてハプスブルク家の女子相続(マリア=テレジア)の混乱に乗じたことが対外拡張の背景にある。',
      process:'オーストリア継承戦争・七年戦争を通じて資源豊かなシュレジエンの領有を確定させる一方、内政では啓蒙思想家(ヴォルテールとの交流)の影響も受け、宗教的寛容や司法改革などの啓蒙専制主義的改革を進めた。',
      significance:'軍事的成功と啓蒙的統治を両立させたこの治世により、プロイセンは人口・領土で劣りながらも軍事・行政能力でヨーロッパ五大国の一角に数えられる地位を確立した。',
      debate:'『君主は国家第一の下僕』という啓蒙的理念と、実際の統治(農奴制温存、貴族特権への配慮)との間の乖離は、『啓蒙専制君主』という概念そのものの限界を考えさせる事例とされる。'
    } },
  { id:'war_austrian_succession', name:'オーストリア継承戦争', category:'war', lat:50.78, lng:17.03, start:1740, end:1748, region:'ヨーロッパ全域(発端はシュレジエン)',
    desc:{
      background:'国事詔書によるマリア=テレジアの相続承認が国際的に得られていたにもかかわらず、皇帝の死という好機を捉えてこれを覆そうとするプロイセンの動きが開戦の直接的契機となった。',
      process:'プロイセンによるシュレジエン電撃占領を機にフランス・バイエルンなど反ハプスブルク勢力とイギリス・オランダなど親ハプスブルク勢力が入り乱れて戦い、最終的にアーヘンの和約でプロイセンのシュレジエン領有が事実上追認された。',
      significance:'この戦争を境にオーストリアとプロイセンはドイツにおける覇権をめぐる宿命的なライバル関係(独墺二元主義)に入り、以後1世紀以上にわたるドイツ統一問題の基本構図を形づくった。',
      debate:'国際条約(国事詔書)による相続保障がプロイセンによってあっさりと反故にされた事実は、近世国際政治における条約遵守の実効性の限界を示す事例としてしばしば言及される。'
    } },
  { id:'partitions_of_poland', name:'ポーランド分割', category:'event', lat:52.23, lng:21.01, start:1772, end:1795, region:'ポーランド',
    desc:{
      background:'選挙王制による国王権力の弱体化と『リベルム・ヴェト(自由拒否権)』による議会機能の麻痺という構造的弱点が、周辺列強による介入・分割を容易にした背景にある。',
      process:'ロシア・プロイセン・オーストリアの3国が、ポーランド国内の改革運動(1791年憲法制定など)への警戒も背景に3次にわたり領土を分割・併合し、1795年の第3次分割で国家そのものを完全に消滅させた。',
      significance:'一つの主権国家が周辺列強の合意により地図上から完全に消去されるという前例は、近代国際政治における力の均衡と国家主権の脆弱性を象徴する衝撃的事例となった。',
      debate:'ポーランド国内の統治体制の欠陥(内的要因)と列強の膨張主義(外的要因)のどちら重視すべきかについては、ポーランド史研究における根本的な論争点であり続けている。'
    } },
  { id:'pragmatic_sanction', name:'国事詔書(プラグマティッシェ・ザンクツィオン)', category:'treaty', lat:48.21, lng:16.37, start:1713, end:1713, region:'神聖ローマ帝国(ハプスブルク家)',
    desc:{
      background:'男子後継者を持たなかったカール6世が、ハプスブルク家領の分割相続による弱体化を防ぐため、娘への一括相続という異例の継承ルールの確立を急いだことが発布の背景にある。',
      process:'この詔書を国内外の主要国(プロイセンを含む)に事前に承認させる外交努力を重ねたが、いざ彼が死去すると、承認していたはずのプロイセンが真っ先にこれを反故にしてシュレジエンへ侵攻した。',
      significance:'国際的な事前承認を得ていたにもかかわらず容易に破られたこの事例は、条約・保障の実効性が結局のところ軍事的実力によって左右されるという近世国際政治の現実を浮き彫りにした。',
      debate:'カール6世が軍事力強化よりも外交的承認の獲得に多大な労力を注いだことについて、結果論としては不十分な安全保障策であったとする批判的評価がなされることが多い。'
    } },
  { id:'maria_theresa', name:'マリア=テレジア', category:'person', lat:48.21, lng:16.37, start:1717, end:1780, region:'ハプスブルク家(オーストリア)', parentId:'habsburg',
    desc:{
      background:'父カール6世の国事詔書にもかかわらず即位直後にプロイセンの侵攻を受けるという危機的状況からの出発が、その後の徹底した内政改革への強い動機となった。',
      process:'オーストリア継承戦争でシュレジエンを失う痛手を負ったが、これを教訓に中央集権的な行政改革・軍制改革・税制改革を断行してハプスブルク家領の統治基盤を大きく強化し、七年戦争ではシュレジエン奪還を試みたが果たせなかった。',
      significance:'その内政改革は多民族的で分権的だったハプスブルク家領を近代的な統治機構を備えた国家へと変貌させ、息子ヨーゼフ2世期の急進改革の土台を築いた。',
      debate:'『ヨーロッパの祖母』と呼ばれるほど多くの子女を各国王家に嫁がせた婚姻外交は、伝統的なハプスブルク家の戦略を体現するものであり、その評価は同家の他の統治者との比較の中で論じられる。'
    } },
  { id:'joseph_ii_habsburg', name:'ヨーゼフ2世', category:'person', lat:48.21, lng:16.37, start:1741, end:1790, region:'ハプスブルク家(オーストリア)', parentId:'habsburg',
    desc:{
      background:'母マリア=テレジアとの共同統治の期間中に啓蒙思想への傾倒を深め、単独統治開始後にその理念を急速に実現しようとする強い使命感を抱いたことが改革の背景にある。',
      process:'農奴の身分的束縛を緩和する農奴解放令、非カトリック教徒への信仰の自由を認める宗教寛容令など、既存の身分制・教会権益に切り込む急進的な改革を矢継ぎ早に断行したが、各地(特にネーデルラント・ハンガリー)で貴族・教会の激しい反発を招いた。',
      significance:'『啓蒙専制君主』の理念型として、上からの急進的な近代化改革が持つ可能性と限界の両方を体現する事例として、後世繰り返し参照される存在となった。',
      debate:'改革の多くが彼の死後まもなく後継者によって撤回されたことは、社会の実態(伝統的な身分秩序・地域的多様性)を無視した急進改革がいかに持続困難であるかという教訓として広く論じられている。'
    } },
  { id:'austrian_empire', name:'オーストリア帝国', category:'nation', lat:48.21, lng:16.37, start:1804, end:1867, region:'中央ヨーロッパ',
    desc:{
      background:'ナポレオンによる神聖ローマ帝国解体が目前に迫る中、ハプスブルク家当主が皇帝としての権威の連続性を確保する必要に迫られたことが、この新称号創設の背景にある。',
      process:'フランツ2世(神聖ローマ皇帝)が先んじて『オーストリア皇帝』フランツ1世を自称し世襲帝国を樹立した後、神聖ローマ帝国の解体を宣言し、以後この多民族帝国は諸民族のナショナリズムの高まりという構造的課題に長く苦しみ続けた。',
      significance:'中央ヨーロッパにおける多民族統合の枠組みとして機能し続けたが、普墺戦争敗北を機にハンガリーとの二重帝国(オーストリア=ハンガリー帝国)へと再編を余儀なくされた。',
      debate:'多民族国家としてのこの帝国を、諸民族の共存を可能にした『前近代的だが機能的な統治モデル』として再評価する見方と、ナショナリズムの時代に適応できなかった時代錯誤な存在とみる見方とが対立する。'
    } },
  { id:'metternich', name:'メッテルニヒ', category:'person', lat:48.21, lng:16.37, start:1773, end:1859, region:'オーストリア帝国', parentId:'austrian_empire',
    desc:{
      background:'フランス革命・ナポレオン戦争がもたらした自由主義・ナショナリズムの高揚に対する強い警戒感が、彼の保守的な国際秩序構想の思想的背景にある。',
      process:'ウィーン会議を巧みな会議外交で主導して正統主義・勢力均衡の原則に基づく戦後秩序を構築し、以後約30年にわたりオーストリア外相・宰相として自由主義運動・革命運動の弾圧(カールスバート決議など)を通じ保守的なウィーン体制を維持し続けたが、1848年革命の勃発により失脚し国外へ亡命した。',
      significance:'その会議外交の手法は近代国際政治における多国間協調の先駆的モデルとして評価される一方、その体制自体は民衆の政治参加要求を長期間抑圧し続けるものであった。',
      debate:'『ウィーン体制』を大国間の大規模戦争を防いだ現実主義的な国際秩序として評価する見方と、自由主義・ナショナリズムという時代の趨勢に逆行した反動的体制として批判する見方とが対立し続けている。'
    } },
  { id:'frankfurt_parliament', name:'フランクフルト国民議会', category:'event', lat:50.11, lng:8.68, start:1848, end:1849, region:'ドイツ(フランクフルト)',
    desc:{
      background:'1848年革命の全ドイツ的な高揚を受け、諸邦分立状態を克服し統一されたドイツ国民国家を自由主義的な憲法のもとに樹立しようとする機運が議会招集の背景にある。',
      process:'ドイツ各地から選出された知識人・自由主義者が参集し統一憲法を審議したが、オーストリアを含めるか(大ドイツ主義)排除するか(小ドイツ主義)をめぐり紛糾した末に小ドイツ主義を採択しプロイセン王に皇帝位を提示したが、王はこれを『どぶの中の冠』として拒否し議会は成果なく解散した。',
      significance:'自由主義知識人主導による『下から』の統一の試みは失敗に終わり、以後のドイツ統一はビスマルクによる現実政治(『鉄と血』)という『上から』の道を歩むことが決定的となった。',
      debate:'この議会の失敗を、自由主義勢力の政治的未熟さ(実行力・軍事力の欠如)に帰す見方と、そもそも君主主導の伝統が強すぎたドイツの構造的制約を重視する見方とがある。'
    } },
  { id:'austro_prussian_war', name:'普墺戦争', category:'war', lat:50.19, lng:15.83, start:1866, end:1866, region:'中央ヨーロッパ(ケーニヒグレーツ)',
    desc:{
      background:'シュレスヴィヒ・ホルシュタイン両公国の共同管理をめぐる対立を口実に、ビスマルクがドイツ統一の主導権をめぐる独墺の宿命的対立に最終決着をつける好機と捉えたことが開戦の背景にある。',
      process:'事前の周到な外交(オーストリアの孤立化、イタリアとの同盟)と近代化された参謀本部・鉄道網を活用した迅速な軍事行動により、ケーニヒグレーツ(サドヴァ)の戦いで短期間のうちに圧勝した。',
      significance:'この勝利によりオーストリアはドイツ統一の主導権から完全に排除され(小ドイツ主義の勝利)、北ドイツ連邦を経てプロイセン中心のドイツ統一への道が決定的に開かれた。',
      debate:'ビスマルクが勝利後、オーストリアに対し過酷な講和条件を課さず寛大な処置をとったことは、将来的な対仏戦争でのオーストリアの中立を確保する高度な戦略的計算に基づくものとして高く評価される。'
    } },
  { id:'north_german_confederation', name:'北ドイツ連邦', category:'nation', lat:52.52, lng:13.4, start:1867, end:1871, region:'北ドイツ',
    desc:{
      background:'普墺戦争の勝利によりオーストリアがドイツから排除された後、プロイセンが北ドイツ諸邦を統合する好機を得たことが、この連邦国家樹立の背景にある。',
      process:'プロイセン王を連邦議長とし、ビスマルクが宰相として事実上の指導権を握る連邦体制を構築し、普仏戦争において南ドイツ諸邦(バイエルンなど)を軍事同盟に引き入れる実質的な母体としての役割を果たした。',
      significance:'この連邦は形式上は諸邦の連合体でありながら実質的にプロイセンの主導権が貫徹する体制であり、普仏戦争の勝利を経てそのままドイツ帝国へと発展的に移行した。',
      debate:'この連邦を『ドイツ帝国の単なる前段階』とみるか、独自の憲法的実験(連邦制と中央集権のバランス)として独立に評価すべきかは、ドイツ憲法史研究上の論点となる。'
    } },
  { id:'austria_hungary', name:'オーストリア=ハンガリー帝国', category:'nation', lat:48.21, lng:16.37, start:1867, end:1918, region:'中央ヨーロッパ',
    desc:{
      background:'普墺戦争敗北によるオーストリアの威信低下に乗じ、帝国内で最大の非ドイツ系民族であるハンガリー人が長年の自治要求をついに実現する好機を得たことが再編の背景にある。',
      process:'オーストリア皇帝がハンガリー国王を兼任しつつ、外交・軍事・財政の一部を除き内政をそれぞれ独自に運営する二重王国(アウスグライヒ体制)として再編されたが、他の諸民族(スラヴ系など)には同様の自治は認められず不満が蓄積し続けた。',
      significance:'多民族国家としての構造的な脆弱性を抱えつつも半世紀にわたり中央ヨーロッパの大国として存続したが、第一次世界大戦の敗北とともに各民族の独立運動により完全に解体した。',
      debate:'ハンガリーにのみ自治を認めた二元体制は、他の被支配民族(チェコ人・南スラヴ系民族など)の不満を却って先鋭化させたのではないかという批判は、帝国崩壊の構造的要因を考える上で重視される。'
    } },
  { id:'franz_joseph_i', name:'フランツ=ヨーゼフ1世', category:'person', lat:48.21, lng:16.37, start:1830, end:1916, region:'オーストリア=ハンガリー帝国', parentId:'austria_hungary',
    desc:{
      background:'1848年革命の混乱の中、退位した伯父に代わり18歳で即位したことが、以後68年に及ぶ異例の長期治世の出発点となった。',
      process:'普墺戦争の敗北を受けハンガリーとの二重帝国体制(アウスグライヒ)への再編を受け入れ、諸民族融和に腐心しつつ保守的な統治を貫いたが、皇太子暗殺(サライェヴォ事件)を機にセルビアへの強硬な最後通牒を発し第一次世界大戦に踏み切った。',
      significance:'その長期治世は帝国の『安定』を象徴する一方、根本的な民族問題の解決を先送りし続けた結果、大戦中に帝国の終焉を見ることなく世を去った。',
      debate:'彼の慎重で保守的な統治姿勢を『多民族帝国を辛うじて維持した老練な調整者』と評価する見方と、根本的な構造改革を怠り破局を先送りしただけとする批判的評価とがある。'
    } },
  { id:'wilhelm_i_germany', name:'ヴィルヘルム1世', category:'person', lat:52.52, lng:13.4, start:1797, end:1888, region:'ドイツ帝国', parentId:'german_empire',
    desc:{
      background:'弟の摂政時代からプロイセン軍の近代化・拡張(軍備拡張問題)を重視する立場を貫き、これが議会との深刻な対立(憲法紛争)を招いていたことが、ビスマルク登用の直接の背景にある。',
      process:'軍備拡張を強行しようとする自らの意志をビスマルクの巧みな政治手腕に委ね、普墺戦争・普仏戦争の勝利を経てドイツ統一を実現し、ヴェルサイユ宮殿で初代ドイツ皇帝として即位した。',
      significance:'皇帝自らが『ビスマルクなくして統一なし』と認めるほど宰相に厚い信任を寄せ続けたことで、統一後のドイツ帝国は皇帝の権威とビスマルクの実務能力が両輪となる独特の統治体制を確立した。',
      debate:'皇帝個人の政治的主導性の乏しさは、彼を単なる『ビスマルクの操り人形』とみるか、有能な家臣を信頼し重用する度量ある君主とみるかで評価が分かれる。'
    } },
  { id:'wilhelm_ii_germany', name:'ヴィルヘルム2世', category:'person', lat:52.52, lng:13.4, start:1859, end:1941, region:'ドイツ帝国', parentId:'german_empire',
    desc:{
      background:'祖父の代からのビスマルクとの確執と、自ら積極的に世界政策(ヴェルトポリティーク)を主導したいという強い野心が、宰相罷免の直接的動機となった。',
      process:'ビスマルクを罷免して親政を開始すると、対外的には積極的な海外進出と大海軍建設(建艦競争)を推進して英独関係を悪化させ、複雑な同盟網によって保たれていた勢力均衡を崩し、第一次世界大戦の勃発と敗北を経てドイツ革命により退位・オランダへ亡命した。',
      significance:'その性急で挑発的な外交・軍事政策は、ビスマルクが慎重に築き上げた大陸国家としての現状維持路線を放棄させ、英仏露の対独包囲網形成を促す結果を招いた。',
      debate:'第一次世界大戦の開戦責任について、彼個人の性急な政策判断を重視する見方と、当時のドイツ官僚機構・軍部全体の構造的な膨張主義を重視する見方とが対立している。'
    } },
  { id:'weimar_republic', name:'ヴァイマル共和国', category:'nation', lat:50.98, lng:11.33, start:1919, end:1933, region:'ドイツ',
    desc:{
      background:'第一次世界大戦の敗北とドイツ革命(皇帝退位)という激動の中、当時最も先進的とされる普通選挙・比例代表制を採用した憲法のもとで新体制が発足したことが特徴的な出発点である。',
      process:'ヴェルサイユ条約の過酷な負担とハイパーインフレーションによる経済混乱を乗り越え一時的な安定(『黄金の20年代』)を実現したが、世界恐慌による大量失業が政情不安を再燃させ、比例代表制のもとでの小党乱立と大統領緊急令への依存が続く中、ナチ党の台頭を許して崩壊した。',
      significance:'史上最も民主的とされた憲法を持ちながらもわずか14年で崩壊したことは、形式的な民主的制度が実質的な民主主義の定着を保証しないという重要な政治学的教訓を残した。',
      debate:'崩壊の要因として、比例代表制による政治的不安定化を重視する制度的説明と、経済危機・エリート層のナチス容認という社会経済的要因を重視する説明とが対立し、両者を組み合わせた複合的理解が現在の通説となっている。'
    } },
  { id:'hyperinflation_1923', name:'ハイパーインフレーション(1923年)', category:'event', lat:52.52, lng:13.4, start:1923, end:1923, region:'ドイツ',
    desc:{
      background:'ヴェルサイユ条約による巨額の賠償金支払い義務と、ルール占領(フランス・ベルギー軍による工業地帯占領)への対抗としてドイツ政府が労働者への賃金支払いを続けつつ生産をストップさせる『消極的抵抗』政策をとったことが、通貨暴落の直接的引き金となった。',
      process:'政府が財源不足を紙幣増刷で賄い続けた結果、マルクの価値は天文学的スピードで下落し、パン一斤が兆マルク単位に達するなど、貨幣経済そのものが機能不全に陥った。',
      significance:'この危機により中間層の現金・貯蓄資産の多くが事実上無価値となり、既存の経済秩序・エリート層への信頼が大きく揺らぐ結果を招いた。',
      debate:'この経験が後のナチ党台頭の直接的な原因(中間層の急進化)と単純に結びつけられがちだが、実際に危機は1924年のレンテンマルク導入で収束しており、直接の政権掌握(1933年)までには時間的隔たりがあることには留意が必要である。'
    } },
  { id:'hindenburg', name:'ヒンデンブルク', category:'person', lat:52.52, lng:13.4, start:1847, end:1934, region:'ヴァイマル共和国', parentId:'weimar_republic',
    desc:{
      background:'第一次世界大戦におけるタンネンベルクの戦いの勝利で国民的英雄としての名声を確立していたことが、ヴァイマル共和国大統領への担ぎ出しの背景にある。',
      process:'保守的な軍人としての立場から共和政体制そのものへの共感は薄かったとされ、世界恐慌後の政局混乱の中で複数の首相を大統領緊急令により支えたが、最終的に周囲の助言もありヒトラーを首相に任命する決断を下した。',
      significance:'『ヒトラーを閣内に取り込み統制する』という当初の思惑とは裏腹に、この任命は結果的にナチ党による急速な権力集中・独裁体制確立への道を開くこととなった。',
      debate:'高齢による判断力の衰えを指摘する見方と、周囲の保守派エリート(パーペンら)による誤算・策略を重視する見方があり、この任命の真の意思決定過程については史料的にも議論が続いている。'
    } },
  { id:'austrian_republic_first', name:'オーストリア第一共和国', category:'nation', lat:48.21, lng:16.37, start:1918, end:1938, region:'オーストリア',
    desc:{
      background:'広大な多民族帝国の解体後、ドイツ語圏のみの小国として残されたオーストリアが、単独での経済的自立に困難を抱えていたことが、この共和国の構造的な脆弱性の背景にある。',
      process:'戦間期を通じて右派(祖国戦線などのキリスト教社会党系)と社会主義左派(社会民主党)の激しい政治対立が続き、内戦的な武力衝突(1934年の二月蜂起)を経て権威主義体制に移行した後、1938年にナチス・ドイツによる軍事的圧力下での併合(アンシュルス)を受け消滅した。',
      significance:'この小国の消滅は、ヴェルサイユ体制が禁じていた独墺合邦がついに実現した事例として、ナチス・ドイツの対外拡張の第一歩を画する出来事となった。',
      debate:'戦間期オーストリアが果たして『独立した国民国家』としての一体性を国民の間で真に確立できていたのか(『ドイツへの合流』を望む世論も根強かった)については、この国の短命な歴史を考える上で重要な論点である。'
    } },
  { id:'anschluss', name:'オーストリア併合(アンシュルス)', category:'event', lat:48.21, lng:16.37, start:1938, end:1938, region:'オーストリア',
    desc:{
      background:'ヴェルサイユ条約により明確に禁じられていた独墺合邦への待望論が、両国内の民族主義者の間で根強く存在し続けていたことが、この併合を『民族統一』として正当化する素地となった。',
      process:'ヒトラーがオーストリア国内のナチ党員を扇動し軍事的圧力を背景に首相辞任・親独政権樹立を強要した末、ドイツ軍を進駐させて事実上の併合を宣言し、事後に実施された住民投票でも(自由な選挙環境とは言い難い状況下で)圧倒的賛成が示された。',
      significance:'国際社会がこの明白な条約違反・侵略行為に対して有効な対抗措置をとらなかったことは、以後のズデーテン地方併合など宥和政策のさらなる後退を招く前例となった。',
      debate:'住民投票での高い支持率について、当時実際に多くのオーストリア国民が合邦を熱狂的に歓迎したという側面と、投票環境の非自由性(反対派への弾圧)を重視する側面のどちらを強調すべきかは、戦後の『被害者』としてのオーストリアの自己認識とも関わる敏感な論点である。'
    } },
  { id:'west_germany_frg', name:'ドイツ連邦共和国(西ドイツ)', category:'nation', lat:50.73, lng:7.1, start:1949, end:1990, region:'旧西側占領地域(ボン)',
    desc:{
      background:'冷戦の激化に伴い、米英仏の占領地域を早期に安定した西側陣営の一員として統合する必要性が高まったことが、この国家樹立を後押しした国際的背景にある。',
      process:'基本法(暫定憲法)のもとで議会制民主主義体制を発足させ、アデナウアー首相のもとで市場経済に基づく急速な経済復興(『経済の奇跡』)を遂げ、NATO加盟や欧州石炭鉄鋼共同体への参加を通じ西側陣営・欧州統合の中心的な一員としての地位を確立した。',
      significance:'ナチズムの過去を克服しつつ民主主義・経済繁栄を両立させたこのモデルは、戦後西ドイツの国際的信頼回復と、後のドイツ再統一への道筋を開く基盤となった。',
      debate:'この急速な経済復興・国際社会復帰が、ナチ時代の過去との十分な対峙(過去の清算)を伴わないまま進められた側面があるのではないかという批判は、1960年代以降の若い世代からの問い直しの中で強く提起された。'
    } },
  { id:'east_germany_gdr', name:'ドイツ民主共和国(東ドイツ)', category:'nation', lat:52.52, lng:13.4, start:1949, end:1990, region:'旧ソ連占領地域',
    desc:{
      background:'ソ連占領地域という条件のもと、社会主義体制の樹立が既定路線として進められたことが、この国家の性格を決定づける背景にある。',
      process:'計画経済と一党独裁(社会主義統一党)体制のもとで一定の工業生産力を維持したが、西側への人口流出が深刻化するとベルリンの壁建設(1961年)により国境を封鎖し、秘密警察(シュタージ)による厳格な監視社会を築いたが、1989年の民主化運動と壁崩壊を経て翌年西ドイツに編入される形で消滅した。',
      significance:'その崩壊は東欧革命全体を象徴する出来事となり、資本主義対社会主義という体制間競争における社会主義陣営の経済的・体制的限界を象徴する事例として世界に強い印象を残した。',
      debate:'秘密警察による監視体制の実態(市民同士の相互監視の広範さ)が統一後の公文書公開により明らかになるにつれ、体制の抑圧性についての評価はより厳しいものとなっている。'
    } },
  { id:'adenauer', name:'コンラート・アデナウアー', category:'person', lat:50.73, lng:7.1, start:1876, end:1967, region:'ドイツ連邦共和国(西ドイツ)', parentId:'west_germany_frg',
    desc:{
      background:'ナチ時代に市長職を追われた経歴を持つ反ナチの保守政治家として、戦後西ドイツの国際的信頼回復を担う指導者としての正統性を備えていたことが首相就任の背景にある。',
      process:'市場経済に基づく経済政策(エアハルトの社会的市場経済)のもとでの『経済の奇跡』を後見しつつ、宿敵フランスとの和解(石炭鉄鋼共同体参加)と再軍備・NATO加盟という『西側統合』路線を一貫して推進した。',
      significance:'その『西側統合優先』路線は東西ドイツの分断固定化という代償を払いつつも、西ドイツの国際的地位と経済的繁栄を確固たるものとし、後の欧州統合の重要な推進力となった。',
      debate:'東西統一よりも西側統合を優先したその路線については、当時から統一を事実上棚上げにしたとする批判があった一方、結果的に安定した民主主義国家建設を優先した現実主義的判断として評価されることが多い。'
    } },
  { id:'german_reunification', name:'ドイツ再統一', category:'event', lat:52.52, lng:13.4, start:1990, end:1990, region:'ドイツ',
    desc:{
      background:'ベルリンの壁崩壊後、東ドイツ国内での急速な民主化要求の高まりと大量の人口流出が、統一以外の選択肢を急速に狭めていったことが背景にある。',
      process:'東ドイツで初めて自由選挙が実施され統一支持派が圧勝すると、通貨統合を経て東ドイツが西ドイツの基本法のもとに編入される形で、周辺大国(特にソ連・フランス)の懸念に配慮した外交交渉(『2プラス4条約』)を経て実現した。',
      significance:'この再統一は冷戦の終結を最も象徴的に示す出来事となり、統一ドイツはヨーロッパにおける経済的・政治的な中心国家としての地位を確固たるものとした。',
      debate:'旧東ドイツ地域の急速な市場経済化がもたらした経済的混乱(大量失業、旧国営企業の解体)と、それに伴う東西間の経済格差・心理的分断は、統一から数十年を経てなお完全には解消されていない課題として指摘され続けている。'
    } },
  { id:'austrian_state_treaty', name:'オーストリア国家条約', category:'treaty', lat:48.21, lng:16.37, start:1955, end:1955, region:'オーストリア(ウィーン)',
    desc:{
      background:'冷戦下でドイツと同様の東西分割占領が固定化することへの強い懸念から、永世中立という妥協案によって主権回復を実現しようとする外交努力が交渉の背景にある。',
      process:'米英仏ソ4か国による長期の分割占領を経て、いずれの軍事同盟にも加わらない永世中立を憲法上宣言することと引き換えに、4か国が占領軍を撤退させ完全な主権回復を認めるという合意が成立した。',
      significance:'冷戦下で東西いずれの陣営にも属さない中立国という選択肢を成功裏に実現した事例として、後の国際政治における中立政策のモデルケースの一つとなった。',
      debate:'この条約の実現がスターリン死後のソ連の対外政策の変化(雪解け)にどこまで起因するのか、あるいはオーストリア側の粘り強い外交努力の成果と評価すべきかについては議論がある。'
    } },
  { id:'second_austrian_republic', name:'オーストリア第二共和国', category:'nation', lat:48.21, lng:16.37, start:1945, end:2000, region:'オーストリア',
    desc:{
      background:'第二次世界大戦後、ナチス・ドイツへの併合という過去と決別し、独立した民主国家として国際社会に再登場する必要があったことが再建の背景にある。',
      process:'国家条約による主権回復と永世中立宣言を経て、冷戦下では東西いずれの陣営にも属さない独自の立場を保ちながら安定した議会制民主主義と経済的繁栄を実現し、冷戦終結後の1995年には欧州連合(EU)にも加盟した。',
      significance:'永世中立という制約下にありながらも国連(ウィーンは国連機関の主要拠点の一つ)や国際外交の舞台で独自の役割を果たし、小国ながら国際的な存在感を確保する統治モデルを示した。',
      debate:'自国を『ナチズムの最初の犠牲者』として位置づける戦後の公式な歴史認識(『被害者神話』)は、実際には多くのオーストリア人がナチ体制に積極的に加担した事実を長らく覆い隠してきたとして、近年厳しい再検証にさらされている。'
    } },
  { id:'saxon_dynasty', name:'ザクセン朝(オットー朝)', category:'dynasty', lat:50.78, lng:6.08, start:919, end:1024, region:'東フランク・神聖ローマ帝国',
    desc:{
      background:'フランク系のカロリング朝断絶後、東フランクにおいて非フランク系のザクセン人が新たな王家として台頭したことが、この王朝の特異な出自の背景にある。',
      process:'ハインリヒ1世がマジャール人への防衛体制を整え、その子オットー1世がレヒフェルトの戦いでの勝利を経て教皇から皇帝冠を授かり、以後この家系から歴代皇帝が輩出される伝統が確立された。',
      significance:'この王朝のもとで確立された『ドイツ王がローマ皇帝を兼ねる』という枠組みは、以後800年以上続く神聖ローマ帝国の基本構造を決定づけた。',
      debate:'非フランク系王家の台頭が、東フランク(後のドイツ)における『民族的』アイデンティティの萌芽を示すものとみなせるかについては、時代錯誤な解釈を避けた慎重な検討が必要とされる。'
    } },
  { id:'henry_i_germany', name:'ハインリヒ1世', category:'person', lat:52.27, lng:10.52, start:876, end:936, region:'東フランク王国',
    desc:{
      background:'カロリング家の血統が絶えた東フランクにおいて、有力諸侯(部族大公)の一人であったザクセン公が諸侯の合意により王に選出されたことが即位の背景にある。',
      process:'マジャール人(ハンガリー人)の侵入に対し、要塞網の整備と重装騎兵の育成により防衛体制を強化し、一時的な貢納と引き換えに休戦を得てその間に軍備を整えた。',
      significance:'その軍事改革の成果は子オットー1世によるレヒフェルトの戦いでの決定的勝利として結実し、以後のドイツ王権による皇帝戴冠への道を準備した。',
      debate:'彼自身は教会による塗油儀式(聖別)を意図的に避けたとされ、これを世俗権力の独自性を重んじる姿勢とみるか、単に伝統的な部族的王権観に留まっていたためとみるかは解釈が分かれる。'
    } },
  { id:'hohenstaufen_dynasty', name:'シュタウフェン朝', category:'dynasty', lat:50.78, lng:6.08, start:1138, end:1254, region:'神聖ローマ帝国',
    desc:{
      background:'皇帝権とイタリア(特に教皇領・北イタリア都市)への影響力拡大という、歴代皇帝共通の野心的な政策方針が、この王朝の性格を規定した。',
      process:'フリードリヒ1世・フリードリヒ2世という個性的な皇帝を輩出しつつイタリア政策に力を注いだが、教皇との度重なる対立(破門の応酬)の末に急速に弱体化し、フリードリヒ2世の息子・孫の代に相次いで滅ぼされて断絶した。',
      significance:'この王朝の断絶とそれに続く大空位時代は、以後のドイツにおいて皇帝権よりも領邦諸侯の自立性が優越する分権的な政治構造を決定的なものとした。',
      debate:'イタリア政策への傾倒がドイツ本国の統治基盤を疎かにする結果を招いたとする批判的見方は、皇帝権の『普遍主義』的理念と『国家』としてのドイツ統治の間の緊張関係を考える上で重要な視点を提供する。'
    } },
  { id:'charles_iv_hre', name:'カール4世', category:'person', lat:50.11, lng:14.44, start:1316, end:1378, region:'神聖ローマ帝国(ボヘミア王兼任)', parentId:'hre',
    desc:{
      background:'ボヘミア王家(ルクセンブルク家)出身として、フランス宮廷での教育を受けた国際的な教養と、ボヘミアという安定した領国基盤を併せ持っていたことが治世の特徴の背景にある。',
      process:'皇帝選出手続きを法的に明確化する金印勅書を発布して帝国内の政治的混乱を防ぐ一方、自らの本拠地プラハにカレル大学(中欧最古の大学)を創設するなど、帝都に准じる文化的中心地としての整備に力を注いだ。',
      significance:'皇帝権の実質的な統治領域の拡大よりも、制度整備と文化振興に注力したその統治スタイルは『帝国の政治家』というより『ボヘミアの建設者』としての性格が強いと評される。',
      debate:'金印勅書による領邦分立の法的追認を、帝国の統一を犠牲にした現実主義的妥協とみるか、無用な内乱を防ぐ賢明な現状追認とみるかは評価が分かれる。'
    } },
  { id:'concordat_worms', name:'ヴォルムス協約', category:'treaty', lat:49.63, lng:8.36, start:1122, end:1122, region:'神聖ローマ帝国(ヴォルムス)',
    desc:{
      background:'半世紀近くに及ぶ叙任権闘争(カノッサの屈辱を含む)の長期化により、双方とも紛争継続のコストの大きさを痛感していたことが妥協成立の背景にある。',
      process:'聖職者の任命における宗教的叙任(指輪と杖の授与)は教会の権限とし、世俗的な権限(封土の授与)は皇帝の権限とするという、権限を分離する形での妥協が成立した。',

    } },
  { id:'ferdinand_i_hre', name:'フェルディナント1世', category:'person', lat:48.21, lng:16.37, start:1503, end:1564, region:'神聖ローマ帝国・オーストリア', parentId:'hre',
    desc:{

  { id:'brandenburg_margraviate', name:'ブランデンブルク辺境伯国', category:'nation', lat:52.52, lng:13.4, start:1157, end:1618, region:'北ドイツ(ブランデンブルク)',
    desc:{

  { id:'charles_vi_hre', name:'カール6世', category:'person', lat:48.21, lng:16.37, start:1685, end:1740, region:'神聖ローマ帝国・オーストリア', parentId:'hre',
    desc:{

  { id:'war_polish_succession', name:'ポーランド継承戦争', category:'war', lat:52.23, lng:21.01, start:1733, end:1738, region:'ポーランド・イタリア',
    desc:{

    } },
  { id:'treaty_hubertusburg', name:'フベルトゥスブルク条約', category:'treaty', lat:51.29, lng:12.98, start:1763, end:1763, region:'ザクセン(フベルトゥスブルク)',
    desc:{
      background:'七年戦争の長期化により関係各国が財政的・人的に極度に疲弊し、これ以上の戦争継続による利益よりも現状追認による早期終結を優先する機運が高まったことが講和の背景にある。',

      debate:'多大な犠牲を払った長期戦の末、実質的な領土変更がシュレジエンの帰属確定のみにとどまったことは、大規模戦争の帰結が必ずしも当初の戦争目的の全面的実現に結びつくわけではないことを示す事例として論じられる。'
    } },
  { id:'second_schleswig_war', name:'デンマーク戦争(第2次シュレスヴィヒ戦争)', category:'war', lat:54.78, lng:9.44, start:1864, end:1864, region:'シュレスヴィヒ・ホルシュタイン(デンマーク国境地帯)',

      debate:'オーストリアを意図的に共同出兵に誘い込んだビスマルクの外交手腕については、その後の独墺対立を計算づくで準備した戦略的謀略であったとする見方が有力である。'
    } },
  { id:'treaty_tilsit', name:'ティルジット条約', category:'treaty', lat:55.08, lng:21.89, start:1807, end:1807, region:'東プロイセン(ティルジット)',
    desc:{

    } },
  { id:'francis_ii_hre', name:'フランツ2世(神聖ローマ皇帝/フランツ1世としてオーストリア皇帝)', category:'person', lat:48.21, lng:16.37, start:1768, end:1835, region:'神聖ローマ帝国・オーストリア帝国', parentId:'hre',

  { id:'reinsurance_treaty', name:'再保障条約', category:'treaty', lat:52.52, lng:13.4, start:1887, end:1887, region:'ドイツ帝国・ロシア',
    desc:{
      background:'ドイツ統一後のビスマルク外交の基本方針である『フランスの孤立化』を維持するためには、ロシアとフランスの接近を防ぐことが不可欠であるという戦略判断が、この秘密条約締結の背景にある。',

      significance:'この条約の失効はロシアがフランスに接近する直接の契機となり(露仏同盟の成立)、ビスマルクが慎重に防ぎ続けてきた独仏露の対立構図(二正面作戦の脅威)を現実のものとした。',
      debate:'ビスマルクの複雑な同盟網(『いくつものボールを同時に操る』外交)は彼一人の卓越した手腕に依存しすぎており、後継者による維持が事実上不可能な脆い体制だったのではないかという指摘は、彼の外交の評価における重要な論点である。'
    } },

  { id:'henry_navigator', name:'エンリケ航海王子', category:'person', lat:38.72, lng:-9.14, start:1394, end:1460, region:'ポルトガル王国', parentId:'portugal_kingdom',

    desc:{
      background:'貴族勢力の抑制と王権強化を進める一方、先代までの海外進出事業の継続・拡大を国家戦略の中核に据えたことが治世の特徴である。',
      process:'バルトロメウ=ディアスの喜望峰到達を後援してインド航路開拓の目処を立て、コロンブスの西回り航路計画を国内の専門家会議の判断で退けた一方、スペインとのトルデシリャス条約交渉では自国に有利な境界線を巧みに引き出した。',
      significance:'その先見的な地政学的判断(西回りではなく東回り航路への集中投資)は、後のヴァスコ=ダ=ガマによるインド到達という成果に直接結実した。',
      debate:'コロンブスの提案を退けた判断は結果的に『正しかった』(実際にコロンブスが到達したのはアジアではなく新大陸であった)が、これを慧眼による正しい判断とみるか、単なる僥倖とみるかは議論の余地がある。'
    } },
  { id:'bartolomeu_dias', name:'バルトロメウ=ディアス', category:'person', lat:38.72, lng:-9.14, start:1450, end:1500, region:'ポルトガル王国', parentId:'portugal_kingdom',
    desc:{
      background:'ジョアン2世による組織的な探検事業の一環として、アフリカ大陸の南端を回りインド洋へ抜ける航路の実在を確認する使命を託されたことが遠征の背景にある。',
      process:'激しい嵐に遭遇しながらもアフリカ最南端(喜望峰)を回り込み、インド洋側への到達を果たしたが、乗組員の疲弊もあり本人はそれ以上の航海を断念して帰還した。',
      significance:'この到達によりアフリカを回ってインド洋へ抜ける航路の実在が理論上確認され、後のヴァスコ=ダ=ガマによるインド到達への直接の道筋を開いた。',
      debate:'当初『嵐の岬』と名付けられた地名が、後にジョアン2世の意向で縁起の良い『喜望峰』へと改名された経緯は、探検事業における国家的な期待・宣伝の側面を示す興味深い事例とされる。'
    } },
  { id:'vasco_da_gama', name:'ヴァスコ=ダ=ガマ', category:'person', lat:38.72, lng:-9.14, start:1460, end:1524, region:'ポルトガル王国', parentId:'portugal_kingdom',
    desc:{
      background:'ディアスの喜望峰到達により理論上の航路が確認されていたことを受け、その成果を実際にインドまで到達させる使命を国王から託されたことが遠征の背景にある。',
      process:'喜望峰を回り、アラブ人水先案内人の助けも借りてインド西岸のカリカットに到達し、香辛料を積んで帰還したが、往復で乗組員の多くを失う過酷な航海であった。',
      significance:'この到達によりヨーロッパとアジアを結ぶ直接の海上航路が確立され、以後ポルトガルはヴェネツィアなど地中海商業国家を介さない香辛料貿易の直接的な独占を目指す海洋帝国建設へと突き進んだ。',
      debate:'現地(カリカットの支配者ザモリン)との交易交渉は当初必ずしも友好的でなく、後の武力を伴う『ポルトガル方式』の交易独占策の前触れとなる緊張関係も既にこの時点で見られたことが指摘される。'
    } },
  { id:'treaty_tordesillas', name:'トルデシリャス条約', category:'treaty', lat:41.5, lng:-5, start:1494, end:1494, region:'カスティリャ(トルデシリャス)',
    desc:{
      background:'コロンブスの新大陸到達後、スペイン・ポルトガル両国が新たに『発見』する土地の権利をめぐり対立する可能性が高まったことが、教皇による調停を必要とした背景にある。',
      process:'教皇アレクサンデル6世(自身アラゴン出身でスペインに近い立場)による当初の裁定をポルトガルが不服として直接交渉を求め、大西洋上に境界線(教皇子午線)を西方へ移動させる形で両国間の合意が成立した。',
      significance:'この線引きにより南米大陸の東端(現ブラジル)がポルトガル領、それ以外の大半がスペイン領とされ、以後の中南米における言語・文化圏(ポルトガル語圏ブラジルとスペイン語圏諸国)の分布を決定づけた。',
      debate:'ヨーロッパ2か国が地球上の未知の土地を一方的に分割するという行為は、当時の国際法・宗教的権威に基づく正当化であったとはいえ、現地の先住民の権利を一切考慮しないものであった点が現代的視点から強く批判される。'
    } },
  { id:'treaty_zaragoza', name:'サラゴサ条約', category:'treaty', lat:41.65, lng:-0.88, start:1529, end:1529, region:'アラゴン(サラゴサ)',
    desc:{
      background:'トルデシリャス条約が大西洋側の境界線しか定めておらず、地球の裏側(太平洋・アジア方面)における両国の勢力圏が未確定であったことが、新たな条約締結を必要とした背景にある。',
      process:'マゼラン艦隊の到達で価値が再認識された香料諸島(モルッカ諸島)の帰属をめぐる対立を、スペインが対価金と引き換えに権利をポルトガルに譲る形で解決し、太平洋上にも境界線を確定させた。',
      significance:'この条約によりスペイン・ポルトガル両国は理論上、地球を東西に分割する形で世界規模の勢力圏を確定させ、大航海時代における両国の世界分割体制を完成させた。',
      debate:'境界線の正確な位置(特にフィリピン諸島がどちらの勢力圏に属するか)については当時の測地技術の限界から曖昧さが残り、後にフィリピンがスペイン領とされた経緯には解釈上の余地があったとされる。'
    } },
  { id:'afonso_albuquerque', name:'アルブケルケ', category:'person', lat:38.72, lng:-9.14, start:1453, end:1515, region:'ポルトガル王国(インド)', parentId:'portugal_kingdom',
    desc:{
      background:'ヴァスコ=ダ=ガマの航路開拓後、単なる交易拠点の設置にとどまらずインド洋交易路そのものを軍事的に支配する必要があるとの戦略的判断が、彼の積極的な要塞占領策の背景にある。',
      process:'ゴアを占領してインドにおける拠点とし、東西交易の要衝マラッカ、ペルシア湾の入口ホルムズを次々に武力で制圧し、要塞網によってインド洋交易路そのものを軍事的に掌握する体制を築いた。',
      significance:'この『武力による拠点支配』という手法(いわゆる『ポルトガル方式』)は、広大な陸地の直接支配ではなく海上交易路の要衝のみを押さえることで最大の利益を得る、効率的な海洋帝国運営モデルを確立した。',
      debate:'少数の兵力と艦船で広大な交易圏を支配し得た要因については、火砲を用いた海戦技術の優位性を重視する見方と、現地勢力間の対立を巧みに利用した外交戦略を重視する見方の両方がある。'
    } },
  { id:'cabral', name:'カブラル', category:'person', lat:38.72, lng:-9.14, start:1467, end:1520, region:'ポルトガル王国', parentId:'portugal_kingdom',
    desc:{
      background:'ヴァスコ=ダ=ガマの航路を継承してインドへ向かう大規模な商業艦隊の指揮を託されたことが、この航海の直接の背景にある。',
      process:'大西洋を横断する際に強風・海流の影響で予定より大きく西方に流され、現在のブラジル沿岸に到達してこれをポルトガル領として宣言した後、改めてインドへの航海を続行した。',
      significance:'この漂着によりポルトガルはトルデシリャス条約の境界線内にあった南米東岸(ブラジル)の領有を確定させ、以後300年以上に及ぶポルトガル領ブラジルの歴史が始まった。',
      debate:'この漂着が本当に偶然のものであったのか、それとも既にこの海域の存在を知った上での意図的な『発見』であったのかについては、地図史料の解釈をめぐり今なお議論がある。'
    } },
  { id:'columbus_navigator', name:'コロンブス', category:'person', lat:37.23, lng:-6.9, start:1451, end:1506, region:'スペイン(カスティリャ)に仕えたジェノヴァ出身の航海者',
    desc:{
      background:'オスマン帝国の台頭による東方陸路交易の困難化と、当時既に広く知られていた地球球体説が、大西洋を西回りしてアジアへ到達しようとする彼の構想の背景にある。',
      process:'ポルトガル宮廷での提案が専門家会議により地球の周長過小評価を理由に退けられた後、スペイン女王イサベル1世の支援を得て大西洋を横断し、1492年にカリブ海の島々に到達したが、本人は生涯これをアジアの一部と信じ続けた。',
      significance:'この到達はヨーロッパ人による新大陸との本格的接触の端緒となり、以後の征服・植民地化(『コロンブス交換』と呼ばれる動植物・疫病の双方向的伝播を含む)という世界史的な大変動を引き起こした。',
      debate:'近年ではこの到達を単純な『発見』と呼ぶことの妥当性が問い直され、先住民社会にもたらされた征服・疫病・搾取という側面を重視する批判的な再評価が国際的に進んでいる。'
    } },
  { id:'amerigo_vespucci', name:'アメリゴ=ヴェスプッチ', category:'person', lat:43.77, lng:11.26, start:1454, end:1512, region:'フィレンツェ出身、スペイン・ポルトガルに仕えた航海者',
    desc:{
      background:'フィレンツェの商業ネットワークを通じてスペイン・ポルトガル双方の航海事業に関与する機会を得たことが、複数回にわたる南米沿岸探検航海への参加の背景にある。',
      process:'南米大陸の広大な海岸線を実地に踏査した経験から、これがアジアの一部ではなく従来知られていなかった『新世界』であると理論的に主張し、その見解を記した書簡がヨーロッパで広く読まれた。',
      significance:'彼の主張がドイツの地図製作者ヴァルトゼーミュラーに採用されたことで、新大陸には彼の名にちなむ『アメリカ』という名称が定着することとなった。',
      debate:'コロンブスより後に到達しながら大陸に自らの名を残すことになった経緯については、当時から不公平だとする批判があり、彼自身の業績の実際の独自性についても史料批判上の議論が続いている。'
    } },
  { id:'balboa', name:'バルボア', category:'person', lat:40.42, lng:-3.7, start:1475, end:1519, region:'スペイン', parentId:'spain_kingdom',
    desc:{
      background:'カリブ海植民地における借財を逃れて密航同然に渡航した経歴を持ち、現地での実力によって指導的地位を得たことが、この探検の背景にある。',
      process:'先住民の情報をもとにパナマ地峡の密林を踏破し、ヨーロッパ人として初めて対岸の広大な海(彼が『南の海』と名付けた太平洋)を目にし、これをスペイン王の名において領有宣言した。',
      significance:'この到達により新大陸が従来考えられていたよりもはるかに広大で、アジアとは明確に別個の大陸であることが決定的に裏付けられた。',
      debate:'その後まもなく政敵(新総督ペドラリアス)の讒言により反逆罪で処刑されたことは、当時の新大陸統治における植民地行政官同士の熾烈な権力闘争の一端を示す事例とされる。'
    } },
  { id:'magellan', name:'マゼラン(マガリャンイス)', category:'person', lat:40.42, lng:-3.7, start:1480, end:1521, region:'スペインに仕えたポルトガル出身の航海者', parentId:'spain_kingdom',
    desc:{
      background:'ポルトガル王室での処遇に不満を抱き、モルッカ諸島(香料諸島)への西回り到達がスペインの勢力圏内であることを主張してスペイン王室に接近したことが、この航海事業の背景にある。',
      process:'南米大陸南端の海峡(マゼラン海峡)を発見して太平洋へ抜け、フィリピンに到達したが現地の抗争に介入し戦死し、艦隊の指揮を引き継いだ部下エルカーノがそのままインド洋・喜望峰経由でスペインへの帰還を果たした。',
      significance:'彼自身は航海を完遂できなかったものの、艦隊が成し遂げた史上初の世界周航は地球球体説を実証的に裏付け、地球が一つの海洋によって結ばれていることを人類史上初めて実証した。',
      debate:'『マゼランの世界周航』という呼称にもかかわらず本人は道半ばで死去しており、実際に周航を完遂したのは彼ではなくエルカーノであるという事実は、歴史的評価における『発案者』と『完遂者』のどちらを重視すべきかという論点を提起する。'
    } },
  { id:'cortes_conquistador', name:'コルテス', category:'person', lat:40.42, lng:-3.7, start:1485, end:1547, region:'スペイン(コンキスタドール)', parentId:'spain_kingdom',
    desc:{
      background:'キューバ植民地での地位を捨てて独断でメキシコ遠征を敢行するほどの野心と、現地の政治情勢(アステカへの服属諸部族の不満)を的確に読み取る情報収集力が、征服の背景にある。',
      process:'アステカに服属していた諸部族(トラスカラ人など)を味方に引き入れ、皇帝モクテスマ2世を人質化するなど巧妙な戦略を展開し、一時撤退(『悲しき夜』)を経験しながらも最終的に首都テノチティトランを陥落させた。',
      significance:'わずかな兵力での帝国征服という劇的な成功は、以後の中南米全域におけるスペインによる急速な植民地化の先例・モデルとなった。',
      debate:'征服の成功要因として、鉄砲・馬などの軍事技術優位を重視する見方、天然痘などの疫病による現地人口の激減を重視する見方、現地部族間の政治的対立の巧妙な利用を重視する見方が並立し、複合的理解が現在の通説となっている。'
    } },
  { id:'pizarro', name:'ピサロ', category:'person', lat:40.42, lng:-3.7, start:1478, end:1541, region:'スペイン(コンキスタドール)', parentId:'spain_kingdom',
    desc:{
      background:'コルテスによるアステカ征服の成功例を参考に、南米に存在するという噂の豊かな帝国(インカ)の征服を志し、乏しい資金の中で幾度も遠征を試みたことが背景にある。',
      process:'折しもインカ帝国内で皇位継承をめぐる内乱(アタワルパとワスカルの争い)が生じていた好機を捉え、和平交渉と称して皇帝アタワルパを謀略により捕縛し、莫大な身代金を得た上で結局処刑して帝国の中枢を混乱させた。',
      significance:'この征服によりスペインはポトシ銀山をはじめとする南米の莫大な銀資源を獲得し、これが16世紀ヨーロッパ経済全体に『価格革命』と呼ばれる大規模なインフレをもたらす原資となった。',
      debate:'皇帝への裏切り(身代金受領後の処刑)という手法は当時から国際的な非難を招いており、征服事業における『信義』と『実利』のどちらを優先したかという倫理的問題を象徴する事例とされる。'
    } },
  { id:'las_casas', name:'ラス=カサス', category:'person', lat:40.42, lng:-3.7, start:1484, end:1566, region:'スペイン(西インド諸島)', parentId:'spain_kingdom',
    desc:{
      background:'自身も一時エンコミエンダ(先住民の労働力を委託される制度)の受益者であった経験から、征服者による先住民虐待の実態を身をもって目撃したことが告発活動の背景にある。',
      process:'聖職者として先住民保護を訴え続け、『インディアスの破壊についての簡潔な報告』で征服者の残虐行為を具体的に告発し、バリャドリッド論争ではインディオの理性・人間性を主張してセプールベダの征服正当化論と対峙した。',
      significance:'その主張は完全には実現しなかったものの、新法(1542年)による先住民保護規定の制定を後押しし、国際法における人権・植民地支配倫理をめぐる議論の先駆的事例となった。',
      debate:'先住民保護を訴える一方でアフリカ人奴隷の使用を(後に撤回したとはいえ)一時提唱していた経緯は、彼の人道主義の限界を示す論点として近年しばしば指摘される。'
    } },
  { id:'pope_alexander_vi', name:'教皇アレクサンデル6世', category:'person', lat:41.9, lng:12.49, start:1431, end:1503, region:'ローマ教皇庁(出身アラゴン)',
    desc:{
      background:'ボルジア家出身としてスペイン(アラゴン)に出自を持つ立場から、新大陸をめぐるスペイン・ポルトガル両国の紛争調停において必然的にスペイン寄りの裁定を下しやすい政治的背景があった。',
      process:'コロンブスの新大陸到達直後、両国の権利主張の調停を求められ、大西洋上に教皇子午線を設定してスペインに有利な境界線を定めたが、ポルトガルの抗議を受けてまもなくトルデシリャス条約による線の修正が図られた。',
      significance:'この裁定は、教皇の宗教的権威がヨーロッパ列強間の世俗的な領土紛争調停においてなお一定の実効性を持ち得た最後期の事例として位置づけられる。',
      debate:'その私生活における複数の愛人・子女の存在や親族登用(ネポティズム)は、当時のルネサンス期教皇庁の世俗化・腐敗を象徴する事例として、後の宗教改革における教皇批判の格好の材料となった。'
    } },
  { id:'philip_ii_spain', name:'フェリペ2世', category:'person', lat:40.42, lng:-3.7, start:1527, end:1598, region:'スペイン王国', parentId:'spain_kingdom',
    desc:{
      background:'父カール5世から広大な『太陽の沈まぬ帝国』(スペイン・新大陸・ネーデルラント・イタリア領)を相続し、熱心なカトリック信仰に基づく対抗宗教改革の推進を国家的使命と位置づけたことが治世の背景にある。',
      process:'レパントの海戦でオスマン帝国海軍に打撃を与える一方、ネーデルラントへのカトリック強制・重税政策がオランダ独立戦争を招き、これを鎮圧できないまま長期化させ、さらにイングランド征服を狙った無敵艦隊も暴風雨とイングランド海軍により壊滅した。',
      significance:'その治世の前半はスペイン黄金世紀の絶頂を象徴したが、後半における相次ぐ対外的挫折は、以後のスペインの国際的地位が徐々に衰退へ向かう転換点となった。',
      debate:'熱心なカトリック信仰に基づく統治を『信念に殉じた統治者』として評価する見方と、宗教的独断が結果的に帝国の資源を消耗させ衰退を早めたとする批判的評価との間で、彼の治世の総合評価は分かれている。'
    } },
  { id:'dutch_revolt', name:'オランダ独立戦争(八十年戦争)', category:'war', lat:52.37, lng:4.9, start:1568, end:1648, region:'ネーデルラント(現オランダ・ベルギー)',
    desc:{
      background:'経済的に繁栄する北部諸州(ホラントなど)の自治的伝統と、スペインによるカトリック強制・重税政策への抵抗、特にカルヴァン派新教徒への弾圧強化が反乱の背景にある。',
      process:'オラニエ公ウィレム(沈黙公)を指導者にゲリラ的な抵抗を続け、南部(現ベルギー)は次第にスペイン支配下に留まる一方、北部7州がユトレヒト同盟を結成して事実上の独立を達成し(1609年休戦)、最終的にウェストファリア条約で国際的にも正式承認された。',
      significance:'小国が当時の超大国スペインに対する独立を実現した先例として、以後のオランダは商業・金融・海運の先進国(オランダ黄金時代)として近世ヨーロッパ経済を主導する存在へと発展した。',
      debate:'南北ネーデルラントの分岐(独立達成の北部と、スペイン支配継続の南部)が、その後の言語・宗教・経済発展の差異(現在のオランダとベルギーの相違)にどこまで直接連なるかは、比較史的に興味深い論点である。'
    } },
  { id:'battle_lepanto', name:'レパントの海戦', category:'war', lat:38.28, lng:21.44, start:1571, end:1571, region:'ギリシャ沖(レパント/ナフパクトス沖)',
    desc:{
      background:'地中海における『無敵』とされたオスマン帝国海軍の脅威に対し、教皇の呼びかけによりカトリック諸国(スペイン・ヴェネツィアなど)が神聖同盟を結成したことが、この決戦の背景にある。',
      process:'ドン・フアン・デ・アウストリア(フェリペ2世の異母弟)率いる連合艦隊が、ガレー船同士の白兵戦を主体とする激戦の末にオスマン艦隊を壊滅させた。',
      significance:'この勝利はオスマン帝国の『無敵』という威信に打撃を与え当時のヨーロッパで大きく喧伝されたが、オスマン側は驚異的な速さで艦隊を再建し、地中海の実質的な勢力均衡には大きな変化をもたらさなかった。',
      debate:'この戦いの軍事的インパクトを『オスマンの脅威に終止符を打った画期』と過大評価する伝統的見方に対し、実際にはその後もオスマンの地中海における影響力は大きく損なわれなかったとする冷静な再評価もある。'
    } },
  { id:'catalan_revolt', name:'カタルーニャの反乱', category:'revolution', lat:41.39, lng:2.16, start:1640, end:1652, region:'スペイン(カタルーニャ)',
    desc:{
      background:'オリバーレス伯公爵による中央集権化政策(『諸国連合案』による全領土均等な軍事負担の要求)が、独自の税制・法体系を保持してきたカタルーニャの強い反発を招いたことが反乱の背景にある。',
      process:'駐留するカスティリャ軍への反感から民衆蜂起(『刈り取り人の戦争』)が発生し、当初はフランスの支援を受けて独立を志向したが、フランスへの従属も嫌気され、最終的に妥協的な形でスペインへの復帰が受け入れられ鎮圧された。',
      significance:'この反乱はスペイン中央政府による地域統合政策の限界を露呈させ、以後もカタルーニャの独自性・自治要求は現代に至るまで繰り返しスペイン政治の重要な争点であり続けている。',
      debate:'この反乱の性格を『地域的自治権を守るための保守的抵抗』とみるか、後の民族主義的独立運動の先駆とみるかは、現代のカタルーニャ独立問題とも関連して歴史的正統性の観点から議論される。'
    } },
  { id:'treaty_cateau_cambresis', name:'カトー=カンブレジ条約', category:'treaty', lat:50.15, lng:3.53, start:1559, end:1559, region:'フランス北部',
    desc:{
      background:'半世紀以上に及んだイタリア戦争が双方にとって過大な財政負担となり、もはや決定的な勝利を得る見込みが薄いことが双方に共有されていたことが、この講和成立の背景にある。',
      process:'フランスがイタリアにおける権益をほぼ全面的に放棄する見返りに、フランス王家とスペイン・ハプスブルク家との婚姻同盟が結ばれ、長期にわたる係争に終止符が打たれた。',
      significance:'この条約によりイタリアにおけるスペインの覇権的優位が確定し、以後イタリア半島は長くスペイン(後にはオーストリア)の強い影響下に置かれる時代を迎えた。',
      debate:'イタリア諸都市国家の政治的独立が事実上失われたこの結果を、単なる大国間の勢力調整とみるか、イタリア・ルネサンス文化の政治的自律性の終焉を画す出来事として重く見るかで評価が分かれる。'
    } },
  { id:'treaty_pyrenees', name:'ピレネー条約', category:'treaty', lat:42.67, lng:1.02, start:1659, end:1659, region:'フランス・スペイン国境(ピレネー山脈)',
    desc:{
      background:'三十年戦争終結後もなお継続していた仏西間の対立が、双方の長期にわたる消耗戦を経てようやく限界に達していたことが、この講和成立の背景にある。',
      process:'スペインがルシヨン地方などをフランスに割譲し、あわせてルイ14世とスペイン王女マリア・テレサとの婚姻が取り決められた(この婚姻が後のスペイン継承戦争の遠因ともなる)。',
      significance:'この条約を境にヨーロッパにおける覇権的地位はスペインからフランスへと実質的に移行し、以後の国際政治における『太陽王』ルイ14世の時代の到来を準備した。',
      debate:'この条約における婚姻取り決め(持参金支払いと引き換えの王位請求権放棄)が、後にフランス側から都合よく解釈されスペイン継承戦争の口実とされた経緯は、近世の国際条約の実効性の限界を示す事例とされる。'
    } },
  { id:'philip_v_spain', name:'フェリペ5世', category:'person', lat:40.8, lng:2.12, start:1683, end:1746, region:'スペイン王国', parentId:'spain_kingdom',
    desc:{
      background:'スペイン=ハプスブルク家の血統断絶に際し、遺言によりフランス・ブルボン家出身の彼が指名されたことが、周辺列強の強い警戒感を招く即位の背景となった。',
      process:'即位はスペイン継承戦争という大規模な国際戦争を引き起こしたが、ユトレヒト条約でフランス・スペイン両国の合邦禁止を条件に王位そのものは承認され、以後スペインにおけるブルボン朝統治の礎を築いた。',
      significance:'この王朝交代によりスペインはフランス的な中央集権的行政モデル(県知事制度に類する統治機構)を部分的に導入し、旧来の地域的自治(各地方のフエロス)の縮小が進んだ。',
      debate:'フランス式中央集権化政策を『近代化の推進』と評価する見方と、地域固有の伝統的自治を破壊した強圧的政策とみる見方は、地域(特にカタルーニャ・アラゴン)による評価の違いとも結びついている。'
    } },
  { id:'peninsular_war', name:'スペイン独立戦争(半島戦争)', category:'war', lat:40.42, lng:-3.7, start:1808, end:1814, region:'イベリア半島',
    desc:{
      background:'ナポレオンによるスペイン王家の強制退位とその兄ジョゼフの傀儡王擁立が、スペイン民衆の強い反発と抵抗運動を引き起こした直接の契機である。',
      process:'正規軍による組織的抵抗というより、各地の民衆によるゲリラ戦(『ゲリラ』の語源となった)が展開され、これにイギリス軍(ウェリントン指揮)の介入も加わってフランス軍を長期にわたり消耗させ続けた。',
      significance:'この戦争によるフランス軍の継続的な消耗は、後のロシア遠征失敗と並びナポレオン没落の重要な軍事的要因の一つとなった。',
      debate:'この戦争でスペイン民衆が示した激しい民族的抵抗は、しばしば近代ナショナリズムの早期の発露として評価されるが、実際には伝統的な国王・カトリック信仰への忠誠に基づく側面も強く、その性格づけには慎重な検討が必要とされる。'
    } },
  { id:'carlist_wars', name:'カルリスタ戦争', category:'war', lat:43.26, lng:-2.94, start:1833, end:1876, region:'スペイン(バスク・カタルーニャ地方など)',
    desc:{
      background:'国王フェルナンド7世が娘イサベルへの王位継承を可能にするため伝統的な男系継承法(サリカ法的慣行)を変更したことに対し、弟カルロスとその支持者(伝統的地域特権の擁護者)が異議を唱えたことが開戦の背景にある。',
      process:'バスク・カタルーニャなど地方特権(フエロス)の維持を掲げるカルロス派(保守的伝統主義)と、中央集権的な自由主義体制を支持するイサベル派との間で断続的に内戦が繰り返され、いずれも自由主義派の勝利に終わった。',
      significance:'この内戦を通じて表面化した中央集権対地方分権という対立軸は、以後もスペイン政治における根強い地域主義・地方自治要求の歴史的背景として長く尾を引くこととなった。',
      debate:'単なる王位継承争いとみるか、伝統的地域社会(カトリック的・農村的価値観)と近代化を志向する自由主義都市層との根本的な社会的対立の表れとみるかで、この内戦の性格づけは大きく異なる。'
    } },
  { id:'spanish_liberal_revolution_1820', name:'スペイン立憲革命(1820年革命)', category:'revolution', lat:36.53, lng:-6.29, start:1820, end:1823, region:'スペイン',
    desc:{
      background:'ナポレオン戦争(半島戦争)時に制定された自由主義的な1812年憲法が、王政復古後のフェルナンド7世により反故にされていたことへの軍・自由主義者の不満が蜂起の背景にある。',
      process:'軍人リエゴが南米派遣予定の部隊を率いて蜂起し、国王に憲法復活を強制することに成功して自由主義体制(『自由主義の三年間』)を樹立したが、正統主義を掲げる列強(神聖同盟)がフランス軍を派遣して介入し、専制王政に引き戻された。',
      significance:'この事例は、一国内の自由主義革命が国際的な保守勢力(神聖同盟)の軍事介入によって覆されるという、ウィーン体制下における国際的な反革命干渉の典型的パターンを示している。',
      debate:'国内の自由主義勢力のみでは体制を維持できず外国の軍事介入で覆されたという事実は、19世紀前半のヨーロッパにおける自由主義運動全般が直面した国際的制約の厳しさを象徴する事例として位置づけられる。'
    } },
  { id:'spanish_glorious_revolution_1868', name:'スペイン九月革命(名誉革命)', category:'revolution', lat:36.13, lng:-5.35, start:1868, end:1868, region:'スペイン(カディス)',
    desc:{
      background:'女王イサベル2世治下での宮廷の腐敗・専制的傾向と、自由主義・民主主義的改革を求める世論の高まりが、この革命の背景にある。',
      process:'軍部・自由主義者連合による蜂起で女王を追放した後、新たな国王の人選が難航し、一時プロイセン・ホーエンツォレルン家の候補者擁立が検討されたことがフランスの強い反発(エムス電報事件)を招き、普仏戦争の引き金の一つとなった。',
      significance:'スペイン国内の政変が意図せず国際政治(独仏関係)に連鎖的な影響を及ぼした事例として、一国の内政変動が持つ国際的波及力を示す典型例となった。',
      debate:'その後の王位選定の混乱(一時的な共和政樹立を含む)は、革命後のスペインが安定した政治体制を構築することの困難さを示しており、19世紀スペイン政治の慢性的不安定性を象徴する事例とされる。'
    } },
  { id:'second_spanish_republic', name:'スペイン第二共和政', category:'nation', lat:40.42, lng:-3.7, start:1931, end:1939, region:'スペイン',
    desc:{
      background:'国王アルフォンソ13世が独裁的なプリモ・デ・リベラ将軍の統治を容認していたことへの国民的不信が高まり、地方選挙での共和派勝利を機に王政への支持が急速に失われたことが成立の背景にある。',
      process:'土地改革・政教分離・地方自治(カタルーニャ自治憲章など)といった急進的改革を試みたが、これに反発する保守派・カトリック教会・軍部と、より急進的な変革を求める左派勢力との対立が激化し、選挙結果をめぐる混乱の末に軍部の反乱を招いた。',
      significance:'この共和政の試みとその崩壊は、20世紀ヨーロッパにおける左右両極端のイデオロギー対立が一国を内戦へと導く典型的な事例となった。',
      debate:'共和政の急進改革が社会の分極化を必要以上に加速させたのか、それとも根深い社会的不平等(土地問題など)に対する正当な是正努力であったのかは、スペイン現代史における最大級の論争点であり続けている。'
    } },
  { id:'spanish_civil_war', name:'スペイン内戦', category:'war', lat:40.42, lng:-3.7, start:1936, end:1939, region:'スペイン',
    desc:{
      background:'第二共和政下での急進的改革(土地改革・教会財産処分など)に対する保守層・軍部の強い反発が、軍事蜂起という形での内戦勃発の直接的背景にある。',
      process:'フランコら反乱軍(国民戦線)をドイツ・イタリアが軍事支援(ゲルニカ爆撃など)する一方、共和国側をソ連と国際義勇兵(国際旅団)が支援するという、事実上の代理戦争の様相を呈しながら、最終的に国民戦線側が勝利した。',
      significance:'新兵器(急降下爆撃など)の実戦投入は来るべき第二次世界大戦の前哨戦としての性格を帯び、また多くの知識人・芸術家(ヘミングウェイ、オーウェル、ピカソら)がこの内戦に強く反応し作品に刻んだ。',
      debate:'西側民主主義諸国(英仏)がとった不干渉政策が、結果的に枢軸国の介入を許し共和国側の敗北を早めたのではないかという批判は、集団安全保障の機能不全という観点から今も論じられる重要な論点である。'
    } },
  { id:'spanish_state_franco', name:'フランコ体制(スペイン国)', category:'nation', lat:40.42, lng:-3.7, start:1939, end:1975, region:'スペイン',
    desc:{
      background:'内戦に勝利したフランコが、対立する諸勢力(ファランヘ党・軍部・カトリック教会など)の均衡の上に個人独裁体制を築いたことが、この長期政権の統治構造の特徴である。',
      process:'当初は枢軸国寄りの姿勢を見せつつも第二次世界大戦への正式参戦は巧妙に回避し、戦後は国際的孤立を経験したものの冷戦の激化とともに反共の砦として西側陣営に受け入れられ、経済発展(『スペインの奇跡』)も実現した。',
      significance:'ファシズム的な起源を持ちながら参戦回避という現実主義的判断により生き延びたこの体制は、冷戦下における西側の実利的な独裁容認政策(反共産主義優先の外交)を象徴する事例となった。',
      debate:'内戦・戦後を通じた反対派弾圧・処刑の規模(『白色テロ』)の実態については、フランコ死後も長く公的な検証が進まず、近年ようやく歴史的記憶の回復(『歴史の記憶法』)が政治的争点として取り組まれるようになっている。'
    } },
  { id:'francisco_franco', name:'フランシスコ=フランコ', category:'person', lat:40.42, lng:-3.7, start:1892, end:1975, region:'スペイン', parentId:'spanish_state_franco',
    desc:{
      background:'軍内で最年少の将軍にまで昇進した経歴を持ち、第二共和政の急進改革に不満を抱く軍部・保守層の中心的存在として反乱の指導者に担がれたことが権力掌握の背景にある。',
      process:'内戦を勝利に導いた後、国家元首(カウディーリョ)として約36年にわたる独裁体制を敷き、当初の枢軸国寄り姿勢から一転して大戦不参加を選択し、戦後は反共主義を掲げて西側に接近しつつ国内では厳格な統制と言論弾圧を継続した。',
      significance:'20世紀ヨーロッパにおいて最も長期に及んだ右派独裁政権の一つとして、その死後の円滑な民主化移行(彼自身が後継に指名したフアン・カルロス1世のもとでの)と合わせ、独裁体制の終焉のあり方を考える重要な事例を提供している。',
      debate:'彼の死の直前に自ら国王フアン・カルロス1世を後継に指名したことが、結果的に円滑な民主化を可能にしたという評価がある一方、彼自身が民主化を意図していたわけではなく、あくまで結果論に過ぎないとする見方も根強い。'
    } },
  { id:'spanish_transition_democracy', name:'スペイン民主化(スペインへの移行)', category:'event', lat:40.42, lng:-3.7, start:1975, end:1978, region:'スペイン',
    desc:{
      background:'フランコ自身が生前に後継として指名していた国王フアン=カルロス1世が、独裁体制の維持ではなく自ら民主化を主導する道を選んだことが、この移行を可能にした最大の背景である。',
      process:'首相スアレスのもとで既存の権威主義的な法体系を合法的な手続きを通じて段階的に解体し(『法から法への改革』)、主要政党(共産党を含む)の合法化や自由選挙の実施を経て、1978年の国民投票による新憲法制定で立憲君主政のもとでの議会制民主主義を確立した。',
      significance:'内戦のような暴力的断絶を経ずに独裁体制から民主主義へと平和的に移行したこの過程は、『協約による移行(トランシシオン)』のモデルケースとして、後の東欧・ラテンアメリカなど他地域の民主化研究においても頻繁に参照される。',
      debate:'この円滑な移行の代償として、フランコ体制下での人権侵害の責任追及を事実上棚上げする『恩赦法』(1977年)が制定されたことは、『和解』と『正義』のどちらを優先すべきかという移行期正義(トランジショナル・ジャスティス)論における重要な論点を提起している。'
    } },

  // ===================== ロシア史 追加データ(キエフ公国〜モスクワ大公国〜ロマノフ朝〜ソ連〜現代) =====================

  { id:'rurik_dynasty', name:'リューリク朝', category:'dynasty', lat:55.75, lng:37.62, start:862, end:1598, region:'ノヴゴロド・キエフ・モスクワ',

  { id:'vladimir_i_kiev', name:'ウラディミル1世(聖公)', category:'person', lat:55.75, lng:37.62, start:958, end:1015, region:'キエフ公国', parentId:'kievan_rus',

  { id:'novgorod_republic', name:'ノヴゴロド公国(共和政)', category:'nation', lat:58.52, lng:31.28, start:1136, end:1478, region:'ロシア北西部(ノヴゴロド)',

    } },
  { id:'golden_horde', name:'キプチャク=ハン国(ジョチ=ウルス、黄金の大群)', category:'nation', lat:48.14, lng:46.85, start:1242, end:1502, region:'南ロシア・中央アジア草原地帯',

  { id:'mongol_yoke', name:'タタールのくびき(モンゴルによるロシア支配)', category:'event', lat:55.75, lng:37.62, start:1237, end:1480, region:'ロシア諸公国',

  { id:'alexander_nevsky', name:'アレクサンドル=ネフスキー', category:'person', lat:59.93, lng:30.36, start:1221, end:1263, region:'ノヴゴロド・ウラディミル大公国',

  { id:'moscow_grand_duchy', name:'モスクワ大公国', category:'nation', lat:55.75, lng:37.62, start:1263, end:1547, region:'ロシア(モスクワ)',

  { id:'ivan_iii_great', name:'イヴァン3世(大帝)', category:'person', lat:55.75, lng:37.62, start:1440, end:1505, region:'モスクワ大公国', parentId:'moscow_grand_duchy',

  { id:'ivan_iv_terrible', name:'イヴァン4世(雷帝)', category:'person', lat:55.75, lng:37.62, start:1530, end:1584, region:'ロシア・ツァーリ国', parentId:'tsardom_russia',

  { id:'catherine_ii_great', name:'エカチェリーナ2世(大帝)', category:'person', lat:59.93, lng:30.36, start:1729, end:1796, region:'ロシア帝国', parentId:'russian_empire',
