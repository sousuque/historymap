  { id:'battle_verdun', name:'ヴェルダンの戦い', category:'war', lat:49.16, lng:5.38, start:1916, end:1916, region:'フランス(ヴェルダン)',
    desc:{
      background:'ドイツ軍参謀総長ファルケンハインが、フランスにとって象徴的に重要なヴェルダン要塞を攻撃することでフランス軍を消耗させ屈服に追い込むという意図的な消耗戦略を立てたことが、この戦いの背景にある。',
      process:'『ヴェルダンを流血させる』という作戦目的のもと大量の砲撃と繰り返す攻勢が10ヶ月以上続き、フランス軍は『彼らを通すな』を合言葉に要塞群を死守し続け、双方合わせて70万人ともいわれる死傷者を出しながらも決定的な突破は生まれなかった。',
      significance:'この戦いは第一次世界大戦における塹壕戦・消耗戦の凄惨さを象徴する存在となり、以後の西部戦線の膠着状態を決定づけるとともに、フランス国民の間に深い戦争の記憶(『ヴェルダンの精神』)を刻んだ。',
      debate:'意図的な消耗戦略という戦争のあり方そのものが、兵士の人命を『消耗品』とみなす近代総力戦の非情な論理を象徴するものとして、以後の戦争倫理・軍事戦略論において批判的に論じられ続けている。'
    } },
  { id:'battle_somme', name:'ソンムの戦い', category:'war', lat:49.98, lng:2.72, start:1916, end:1916, region:'フランス(ソンム)',
    desc:{
      background:'ヴェルダンで苦戦するフランス軍を側面支援する目的で、イギリス軍が主体となる大規模な攻勢が計画されたことが、この戦いの背景にある。',
      process:'事前の大規模な砲撃で敵陣地を破壊できると想定した作戦計画に反し、開戦初日だけでイギリス軍は約6万人という史上最悪級の一日あたり死傷者を出し、その後も戦車の初投入などを経てなお膠着状態が続いた。',
      significance:'この戦いは機関銃・鉄条網・砲兵が支配する塹壕戦の凄惨さを象徴し、旧来の歩兵突撃戦術がいかに近代兵器に対して無力であるかを痛感させる契機となった。',
      debate:'この作戦を指揮した将軍たち(特にヘイグ)の評価については、当時の技術的制約の中でやむを得ない選択であったとする擁護論と、無為な人命の浪費を重ねた無能な指揮であったとする批判論とが今なお対立している。'
    } },
  { id:'league_of_nations', name:'国際連盟', category:'nation', lat:46.2, lng:6.14, start:1920, end:1946, region:'スイス(ジュネーヴ)',
    desc:{
      background:'第一次世界大戦の未曾有の惨禍を二度と繰り返さないという国際世論の高まりと、ウィルソン米大統領の『十四カ条』に示された理想主義的な国際協調構想が、この機構設立の背景にある。',
      process:'史上初の恒久的な国際平和機構として発足したが、提唱国であるアメリカ自身が上院の反対により参加を見送り、また効果的な軍事的制裁手段を欠いていたため、満州事変・エチオピア侵攻など1930年代の相次ぐ侵略行為を実効的に阻止することができなかった。',
      significance:'その理念と組織的枠組みは不完全ながらも、戦後の国際連合という、より実効性を備えた国際機構設立への重要な先例と教訓を提供することとなった。',
      debate:'この機構の失敗の要因として、主要国(米国)の不参加という制度的欠陥を重視する見方と、そもそも主権国家体系のもとでの実効的な集団安全保障には根本的な限界があるとする見方とがある。'
    } },
  { id:'treaty_locarno', name:'ロカルノ条約', category:'treaty', lat:46.17, lng:8.79, start:1925, end:1925, region:'スイス(ロカルノ)',
    desc:{
      background:'ヴェルサイユ条約による一方的な制裁のみでは持続的な平和が実現しないという反省から、当事国(特にドイツ)を対等な交渉相手として迎え入れる国際協調的な安全保障の枠組みが模索されたことが背景にある。',
      process:'ドイツと英仏など周辺国が西欧における国境の現状維持・相互不可侵を約し、この協調的な国際関係(『ロカルノの精神』)を背景に翌年にはドイツの国際連盟加盟も実現した。',
      significance:'一時的にせよヴェルサイユ体制下での対立を緩和し国際協調の機運を高めたこの成果は、しかし1936年にヒトラーがラインラント進駐によって一方的に条約を破棄したことで無に帰し、国際協調の脆弱性を露呈する結果となった。',
      debate:'この条約による『協調』が実質的な安全保障の強化をもたらしたのか、それとも単なる一時的な外交的ムードの醸成に過ぎず根本的な対立構造を解消するものではなかったのかについては、戦間期外交史における評価が分かれる論点である。'
    } },
  { id:'great_depression', name:'世界恐慌', category:'event', lat:40.71, lng:-74.01, start:1929, end:1939, region:'アメリカ発、ヨーロッパ全域に波及',
    desc:{
      background:'第一次世界大戦後の過剰な信用膨張と投機的な株式市場の過熱が、ニューヨーク株式市場の暴落という形で破裂したことが、この世界的経済危機の直接の引き金となった。',
      process:'アメリカの資本引き揚げと国際的な保護貿易政策(関税引き上げの連鎖)により危機は瞬く間に世界規模に拡大し、ヨーロッパ各国でも大量失業と社会不安が広がり、特にドイツでは深刻な経済的困窮がナチ党をはじめとする急進的政治勢力の伸長を招く決定的な土壌となった。',
      significance:'この危機は自由放任主義的な経済思想への信頼を大きく揺るがし、各国政府による経済への積極的介入(ニューディール政策や各国の統制経済的政策)という新たな経済思想・政策の潮流を生み出す転換点となった。',
      debate:'この危機の原因については、金融政策の失敗(通貨供給の急激な収縮)を重視する見方(マネタリスト的説明)と、需要不足という構造的問題を重視する見方(ケインズ的説明)とが、経済学説史における根本的な論争として今なお続いている。'
    } },
  { id:'popular_front_france', name:'人民戦線内閣(フランス)', category:'event', lat:48.86, lng:2.35, start:1936, end:1938, region:'フランス',
    desc:{
      background:'世界恐慌下の社会不安とファシズムの国際的な脅威の高まりに対し、それまで対立してきた左派諸勢力(社会党・共産党)が一致団結する必要性を強く認識したことが、この連立政権成立の背景にある。',
      process:'ブルム率いる連立政権が週40時間労働制・有給休暇制度の導入など画期的な労働者保護政策(『マティニョン協定』)を実現したが、財界の反発や資本逃避による経済的困難、スペイン内戦への不介入方針をめぐる左派内部の対立などから短期間で瓦解した。',
      significance:'この時期に導入された労働者保護制度(特に有給休暇制度)はフランス社会に深く根付き、以後のフランスにおける社会保障・労働権保護の重要な歴史的起点となった。',
      debate:'この政権の短命な終焉について、内部対立(共産党との連携の限界)を重視する見方と、資本家層の組織的な抵抗・資本逃避という外部要因を重視する見方とがある。'
    } },
  { id:'battle_britain', name:'バトル=オブ=ブリテン(イギリス本土航空戦)', category:'war', lat:51.51, lng:-0.13, start:1940, end:1940, region:'イギリス上空',
    desc:{
      background:'フランス陥落後、イギリス本土上陸作戦(アシカ作戦)を計画するドイツにとって、まず制空権の確保が不可欠な前提条件であったことが、この航空戦の背景にある。',
      process:'ドイツ空軍による飛行場・レーダー基地への攻撃が続く中、イギリス空軍は数的劣勢ながらレーダー網による早期警戒システムと戦闘機の集中運用により効果的に応戦し、ドイツ側の消耗が続く中で作戦目的の達成に失敗した。',
      significance:'この防衛成功によりドイツによる本土上陸作戦は事実上断念され、イギリスは大戦を継続する足場を確保し、後の対独反攻の重要な出撃拠点としての役割を果たし続けることが可能となった。',
      debate:'この勝利の要因として、パイロットの技量・士気を重視する見方と、レーダーという技術的優位性を重視する見方とがあるが、両者を組み合わせた複合的な要因分析が現在では一般的である。'
    } },
  { id:'d_day_normandy', name:'ノルマンディー上陸作戦(D-デイ)', category:'war', lat:49.34, lng:-0.68, start:1944, end:1944, region:'フランス(ノルマンディー)',
    desc:{
      background:'スターリンから繰り返し要求されていた『第二戦線』構築の必要性と、東部戦線でのソ連の消耗に対する西側連合国の負担分担への配慮が、この大規模上陸作戦実施の戦略的背景にある。',
      process:'綿密な欺瞞作戦(ドイツ軍にカレー方面への上陸を誤認させる)を経て、悪天候の隙をついてノルマンディー海岸への大規模な水陸両用上陸作戦が敢行され、多大な犠牲を払いながらも橋頭堡の確保に成功した。',
      significance:'この成功により西部戦線が本格的に開かれ、ドイツは東西から挟撃される形で軍事的に追い詰められ、以後の連合軍による解放戦・ドイツ本土進撃への道が開かれた。',
      debate:'この作戦の成功要因として、周到な欺瞞作戦・情報戦の役割を重視する見方と、単純な物量・兵站能力の圧倒的優位を重視する見方とがあるが、両者は相互に補完的な要因として理解されている。'
    } },
  { id:'holocaust', name:'ホロコースト(ユダヤ人大量虐殺)', category:'event', lat:50.03, lng:19.18, start:1941, end:1945, region:'ドイツ占領下のヨーロッパ全域',
    desc:{
      background:'ナチスの人種主義イデオロギー(反ユダヤ主義)と、戦争という非常事態下での道徳的制約の緩みが、この組織的大量虐殺を実行可能にした複合的な背景にある。',
      process:'当初の隔離・追放政策から、独ソ戦開始後は移動虐殺部隊(アインザッツグルッペン)による銃殺、さらには絶滅収容所(アウシュヴィッツなど)におけるガス室を用いた工業的規模での大量殺戮へと、段階的にエスカレートしていった。',
      significance:'約600万人のユダヤ人をはじめロマ・障害者・政治犯など多数の犠牲者を出したこの犯罪は、以後の国際人権規範(ジェノサイド条約など)形成の反面教師となり、『二度と繰り返さない』という戦後国際秩序の道徳的出発点となった。',
      debate:'この犯罪が当初からの明確な計画に基づくものか(意図派)、戦況の悪化に伴い段階的にエスカレートした結果か(機能派)という論争は、ホロコースト研究における最も重要な学説対立であり続けている。'
    } },
  { id:'yalta_conference', name:'ヤルタ会談', category:'treaty', lat:44.5, lng:34.16, start:1945, end:1945, region:'ソ連(クリミア半島ヤルタ)',
    desc:{
      background:'ドイツの敗北がほぼ確実となった大戦末期、戦後のヨーロッパの秩序をどう再編するかについて、既に大陸の広範囲を実効支配しつつあったソ連の意向を無視できない状況が、この会談の背景にある。',
      process:'米英ソの首脳がドイツの分割占領統治や国際連合の設立原則(拒否権制度)、さらにはポーランドなど東欧諸国の戦後処理について協議し、事実上ソ連の東欧における影響圏を黙認する形での合意がなされた。',
      significance:'ここで事実上合意された勢力圏分割は、以後数十年にわたる東西冷戦下でのヨーロッパ分断の原型となり、『ヤルタ体制』という言葉が冷戦期の国際秩序そのものを指す代名詞として用いられるようになった。',
      debate:'この会談での合意(特にポーランド問題)を、西側が東欧の自由をソ連に『売り渡した』宥和的な譲歩であったとする批判的見解と、当時の軍事的現実(赤軍が既に東欧を占領していたこと)を踏まえたやむを得ない現実的判断であったとする見解とが対立している。'
    } },
  { id:'potsdam_conference', name:'ポツダム会談', category:'treaty', lat:52.4, lng:13.06, start:1945, end:1945, region:'ドイツ(ポツダム)',
    desc:{
      background:'ドイツ降伏後、実際の占領統治をどのように進めるかという具体的な実務的課題への対応が急務となっていたことが、この会談開催の背景にある。',
      process:'ドイツの非軍事化・非ナチ化・民主化・分割占領統治の原則を確認するとともに対日処理方針(ポツダム宣言)も協議されたが、会談の途中でイギリスの総選挙結果を受けチャーチルからアトリーへと代表が交代するなど、戦後政治の転換を象徴する出来事も重なった。',
      significance:'この会談で確認された諸原則は、以後の東西ドイツ分断、ひいては冷戦下のヨーロッパ秩序全体の実務的な出発点となった。',
      debate:'会談開催中の英首相交代という偶発的事象が、実際の交渉の力学(特に対ソ連姿勢の一貫性)にどこまで影響を与えたかについては、外交史上興味深い考察対象とされている。'
    } },
  { id:'nuremberg_trials', name:'ニュルンベルク裁判', category:'event', lat:49.45, lng:11.08, start:1945, end:1946, region:'ドイツ(ニュルンベルク)',
    desc:{
      background:'ナチス・ドイツによる未曾有の戦争犯罪・人道に対する罪をどのように法的に裁くべきかという課題に対し、単なる報復的処刑ではなく国際法上の正当な手続きによる裁判が求められたことが、この裁判開催の背景にある。',
      process:'『平和に対する罪』『戦争犯罪』『人道に対する罪』という新たな国際法上の罪状のもと主要なナチス指導者らが裁かれ、多くが死刑を含む有罪判決を受けたが、事後法による処罰(罪刑法定主義への抵触)という法的問題点も指摘された。',
      significance:'国家指導者個人の国際法上の刑事責任を本格的に問うたこの画期的な裁判は、後の国際刑事裁判所(ICC)設立や、ジェノサイド・人道に対する罪の国際法上の確立に至る重要な先例となった。',
      debate:'『勝者の裁き』(連合国側の戦争犯罪、例えば都市への無差別爆撃は裁かれなかった)という批判は、この裁判の公正性・普遍性をめぐる根本的な論点として今なお提起され続けている。'
    } },
  { id:'marshall_plan', name:'マーシャル=プラン(ヨーロッパ復興計画)', category:'treaty', lat:48.86, lng:2.35, start:1948, end:1952, region:'西ヨーロッパ諸国',
    desc:{
      background:'戦後ヨーロッパの深刻な経済的疲弊が共産主義勢力の伸長を招きかねないという安全保障上の懸念が、アメリカによる大規模な経済支援計画実施の背景にある。',
      process:'西欧諸国に巨額の資金・物資援助を行い急速な経済復興を後押ししたが、ソ連はこれを西側の経済的影響力拡大の道具とみなして東欧諸国の参加を拒否させ、東西陣営間の経済的分断を決定的なものとした。',
      significance:'この援助は西欧諸国の急速な経済復興を実現しただけでなく、援助の受け入れ・配分をめぐる西欧諸国間の協調の経験が、後の欧州統合(ECSC、EECなど)への重要な布石ともなった。',
      debate:'この計画を純粋な人道的・経済的支援とみるか、共産主義封じ込めという明確な地政学的戦略の一環とみるかについては、冷戦起源論における評価とも連動する論点である。'
    } },
  { id:'nato_founding', name:'北大西洋条約機構(NATO)の設立', category:'treaty', lat:50.85, lng:4.35, start:1949, end:1949, region:'アメリカ・カナダ・西欧諸国',
    desc:{
      background:'ソ連による東欧の共産化とベルリン封鎖という一連の脅威の高まりが、西側諸国に集団的な軍事防衛体制構築の必要性を痛感させたことが、この機構設立の背景にある。',
      process:'加盟国への武力攻撃を全加盟国への攻撃とみなす集団的自衛権の原則(北大西洋条約第5条)を中核として発足し、以後冷戦を通じて西側陣営の軍事的支柱であり続け、冷戦終結後も東方拡大を続けている。',
      significance:'この集団防衛の枠組みは冷戦期の東西対峙構造を軍事的に固定化する一方、加盟国間の緊密な軍事協力・統合を通じて西欧諸国間の戦争再発を防止する副次的効果も果たした。',
      debate:'冷戦終結後のNATO東方拡大については、旧東欧諸国の安全保障上の要請に応えるものとする見方と、ロシアの安全保障上の懸念を刺激し新たな緊張を生んだとする見方とが対立し、現代の国際政治における重要な論争点であり続けている。'
    } },
  { id:'warsaw_pact', name:'ワルシャワ条約機構', category:'treaty', lat:52.23, lng:21.01, start:1955, end:1991, region:'ソ連・東欧諸国',
    desc:{
      background:'西ドイツの再軍備とNATO加盟という事態が、ソ連にとって東欧における軍事的対抗機構樹立の必要性を高めた直接の背景となった。',
      process:'ソ連を中心とする東欧社会主義国の軍事同盟として発足し、加盟国内での自由化の動き(ハンガリー動乱・プラハの春)を軍事介入によって抑え込む役割を果たしたが、東欧革命による各国の体制転換を受けて1991年に正式に解体された。',
      significance:'この同盟は名目上の集団防衛機構でありながら、実質的にはソ連による東欧諸国への軍事的統制の道具としての性格を強く帯び、東欧諸国の主権的自立性を著しく制約する結果となった。',
      debate:'NATOとの対称性を強調する見方に対し、実際には加盟各国の自主的な意思決定余地がNATO加盟国よりもはるかに限定的であったという非対称性を重視する見方が、比較同盟論において指摘される。'
    } },
  { id:'council_of_europe', name:'欧州評議会', category:'treaty', lat:48.58, lng:7.75, start:1949, end:2000, region:'ヨーロッパ諸国(ストラスブール)',
    desc:{
      background:'第二次世界大戦の惨禍を経て、民主主義・人権・法の支配という共通の価値観に基づくヨーロッパの結束を制度的に確保する必要性が、この機関設立の背景にある。',
      process:'EU(当初のECSC)とは別個の枠組みとして設立され、欧州人権条約を採択して、加盟国内の人権侵害を個人が直接訴えることのできる欧州人権裁判所という画期的な国際的司法メカニズムを整備した。',
      significance:'この機関を通じた人権保障の国際的な監視・是正の仕組みは、加盟各国内の国内法制度・司法判断にも実質的な影響を及ぼし続ける、地域的人権保障の先駆的かつ最も実効性の高いモデルの一つとなっている。',
      debate:'EUとの機能的な重複・違いが一般にはあまり明確に認識されておらず、この機関の存在意義や実効性についての社会的認知度の低さは、その重要な役割にもかかわらずしばしば指摘される課題である。'
    } },
  { id:'berlin_wall_built', name:'ベルリンの壁建設', category:'event', lat:52.52, lng:13.4, start:1961, end:1961, region:'ドイツ(ベルリン)',
    desc:{
      background:'東ドイツから西ベルリン経由での西側への人口流出(特に若く教育水準の高い層の流出)が、東ドイツの経済・社会に深刻な打撃を与えていたことが、この壁建設の直接的な背景にある。',
      process:'東ドイツ政府がソ連の了承を得て、事前の予告なく一夜にして境界線に有刺鉄線・後にはコンクリート壁を構築し、以後28年間にわたり武装した国境警備隊による厳重な監視体制のもとで東西ベルリンを分断し続けた。',
      significance:'この壁は東西冷戦・ドイツ分断の最も象徴的な構造物となり、その存在自体が社会主義体制が自国民の自由な移動さえ認めえない体制的な脆弱性を体現するものとして、西側の宣伝材料としても繰り返し利用された。',
      debate:'東ドイツ政府はこれを『反ファシズム防護壁』(西側からの侵入・破壊工作の防止)と公式に呼称したが、実際の主目的が自国民の脱出防止にあったことは明白であり、この呼称と実態の乖離は体制のプロパガンダの性格を示す事例とされる。'
    } },
  { id:'helsinki_accords', name:'ヘルシンキ宣言(全欧安全保障協力会議)', category:'treaty', lat:60.17, lng:24.94, start:1975, end:1975, region:'フィンランド(ヘルシンキ)',
    desc:{
      background:'米ソ間のデタント(緊張緩和)の進展の中、既存の国境の現状を相互に確認したいソ連側の思惑と、東側諸国内の人権状況改善を求める西側の思惑が、この多国間合意成立の背景にある。',
      process:'国境の不可侵という東側にとって有利な原則と、人権・基本的自由の尊重という西側にとって重要な原則とを、いわば『取引』として同時に盛り込む形で合意が成立した。',
      significance:'当初はソ連にとって単なる外交的成果に過ぎないとみなされたが、この人権条項は東側諸国内の反体制知識人(『ヘルシンキ・グループ』など)に国際的に承認された根拠を与え、後の東欧革命に至る長期的な民主化運動の重要な布石となった。',
      debate:'この合意が持つ実質的な効力については、当初西側内部でも懐疑的な見方が強かったが、結果的に人権条項が体制内部からの変革を促す『時限爆弾』的な役割を果たしたことは、国際規範の長期的・間接的な影響力を示す興味深い事例として評価されている。'
    } },
  { id:'chernobyl_disaster', name:'チェルノブイリ原発事故', category:'event', lat:51.28, lng:30.22, start:1986, end:1986, region:'ソ連(ウクライナ、チェルノブイリ)',
    desc:{
      background:'安全性よりも生産目標達成を優先しがちなソ連の官僚的な原子力行政の体質と、実施された安全実験における手順の重大な逸脱が、この事故の直接的な背景にある。',
      process:'原子炉の出力制御実験中の操作ミスと設計上の欠陥が重なって原子炉が暴走・爆発し、大量の放射性物質が放出されたが、当初ソ連政府はこれを隠蔽しようとし、周辺住民への避難指示も遅れた。',
      significance:'この事故による広範な放射能汚染は、原子力発電の安全性に対する国際的な懸念を高めるとともに、ソ連政府の情報隠蔽体質への国内外からの強い批判を招き、ゴルバチョフ自身がグラスノスチ(情報公開)政策を加速させる契機になったと後に語っている。',
      debate:'この事故がソ連解体に与えた影響の大きさについては、直接的な経済的損失以上に、体制の隠蔽体質・機能不全を国民に強く印象づけた心理的・政治的影響を重視する見方が有力である。'
    } },
  { id:'european_coal_steel_community', name:'欧州石炭鉄鋼共同体(ECSC)', category:'treaty', lat:48.86, lng:2.35, start:1951, end:2002, region:'フランス・西ドイツ・イタリア・ベネルクス3国',
    desc:{
      background:'二度の世界大戦を通じて独仏間の戦争の火種となり続けた石炭・鉄鋼という戦略物資の生産を、国家主権を超えた共同管理下に置くことで、物理的に戦争を不可能にしようという発想が構想の背景にある。',
      process:'フランス外相シューマンの提案(シューマン・プラン)に基づき、独仏を中心とする6か国が石炭・鉄鋼の生産・市場を共同管理する超国家的な機構を設立した。',
      significance:'国家主権の一部を自発的に超国家機関へ委譲するというこの前例のない試みは、後の欧州経済共同体(EEC)、さらには欧州連合(EU)へと発展する、ヨーロッパ統合プロセス全体の記念碑的な第一歩となった。',
      debate:'この統合が純粋な平和構築の理念に基づくものか、フランスがドイツの資源を国際的な枠組みの中で牽制しようとする実利的な安全保障戦略であったかについては、統合の動機をめぐる議論の中でしばしば両面から論じられる。'
    } },
  { id:'treaty_of_rome', name:'ローマ条約(EEC発足)', category:'treaty', lat:41.9, lng:12.49, start:1957, end:1957, region:'イタリア(ローマ)',
    desc:{
      background:'ECSCでの経済統合の成功体験が、より広範な分野における市場統合(関税同盟・共同市場)への発展を求める機運を各国政府内に高めたことが、この条約締結の背景にある。',
      process:'ECSC加盟6か国が関税同盟と共同市場の形成を目指す欧州経済共同体(EEC)の設立に合意し、資本・労働・商品・サービスの自由な移動という『四つの自由』の実現を長期的な目標として掲げた。',
      significance:'経済統合を通じて平和と繁栄を築くというこの条約の基本理念は、後のマーストリヒト条約による政治統合を含め、現在のEUに至るまで一貫して受け継がれるヨーロッパ統合の思想的根幹となった。',
      debate:'純粋な経済統合として出発したこの共同体が、なぜ最終的に政治統合(共通外交・安全保障政策など)にまで発展していったのかという『機能主義的統合理論』(ある分野の統合が波及効果を通じて他分野の統合を促すという理論)の妥当性は、欧州統合研究における中心的な理論的論点である。'
    } },
  { id:'schengen_agreement', name:'シェンゲン協定', category:'treaty', lat:49.51, lng:6.36, start:1985, end:1985, region:'ルクセンブルク(シェンゲン)',
    desc:{
      background:'欧州経済共同体における『人の自由な移動』という理念を、実務レベルで具体化する必要性が、この国境管理撤廃協定締結の背景にある。',
      process:'当初はルクセンブルクの小村シェンゲンで一部加盟国のみにより調印されたが、後に多くのEU加盟国(および非EU加盟国を含む)が参加する『シェンゲン圏』へと発展し、域内の国境検査を実質的に撤廃した。',
      significance:'この協定はEU統合の理念を市民の日常生活レベルで最も直接的に実感させる制度となり、ヨーロッパにおける『国境なき』移動の自由という統合の象徴的成果として広く認識されている。',
      debate:'難民危機やテロの脅威の高まりに伴い、加盟国が一時的に国境管理を復活させる事例が近年増えていることは、この協定が体現する統合理念と各国の安全保障上の懸念との緊張関係を浮き彫りにしている。'
    } },
  { id:'euro_currency_launch', name:'ユーロ導入', category:'event', lat:50.11, lng:8.68, start:1999, end:1999, region:'欧州連合加盟国(フランクフルトに欧州中央銀行)',
    desc:{
      background:'マーストリヒト条約に定められた経済通貨同盟(EMU)の実現という長期的な統合目標が、この単一通貨導入の直接的な制度的背景にある。',
      process:'まず銀行間取引・資本市場向けの決済通貨として導入され、各国通貨との固定為替レートが設定された後、2002年から実際の紙幣・硬貨の流通が開始されるという段階的な移行プロセスがとられた。',
      significance:'国家主権の中核的要素の一つである通貨発行権を超国家機関(欧州中央銀行)に委譲するというこの試みは、欧州統合が単なる経済協力を超えて事実上の連邦的性格を帯びつつあることを象徴する画期的な到達点となった。',
      debate:'単一通貨は金融政策の統一と各国の財政政策の独自性維持という組み合わせに構造的な矛盾を抱えており、この矛盾は後の欧州債務危機(ギリシャ危機など)において顕在化し、通貨統合の制度設計の妥当性が厳しく問われることとなった。'
    } },
  { id:'sfr_yugoslavia', name:'ユーゴスラヴィア社会主義連邦共和国', category:'nation', lat:44.79, lng:20.45, start:1945, end:1992, region:'バルカン半島西部',
    desc:{
      background:'第二次世界大戦中のパルチザン闘争を通じて複数の民族(セルビア人・クロアチア人・スロヴェニア人など)が共に戦った経験が、多民族連邦国家としての統合を可能にする歴史的基盤となった。',
      process:'チトーの強力な個人的指導力のもと、6つの共和国からなる連邦制を敷きソ連の衛星国化を拒否する独自の『非同盟』外交路線をとり、比較的自由な経済(自主管理社会主義)と国民統合を実現したが、彼の死後は各共和国間の経済格差・民族的緊張が徐々に表面化していった。',
      significance:'冷戦下で東西いずれの陣営にも属さない非同盟運動の重要な指導国としての国際的地位を確立したが、この統合はチトーという傑出した個人の権威に大きく依存しており、その死後まもなく国家自体の存続が危ぶまれる事態を迎えた。',
      debate:'この連邦国家の解体を、抑圧されていた根深い民族対立の必然的な噴出とみるか、冷戦終結という国際環境の激変とそれに乗じた各共和国指導者の政治的策動による人為的な産物とみるかは、旧ユーゴスラビア紛争の原因論における中心的な論点である。'
    } },
  { id:'tito', name:'チトー', category:'person', lat:44.79, lng:20.45, start:1892, end:1980, region:'ユーゴスラヴィア', parentId:'sfr_yugoslavia',
    desc:{
      background:'オーストリア=ハンガリー帝国軍としての従軍・ロシア革命への遭遇という経験を経て共産主義運動に身を投じ、戦間期の地下活動を通じて確固たる革命家としての地位を築いたことが、その指導力確立の背景にある。',
      process:'パルチザンを組織してドイツ占領軍からの自力解放をほぼ独力で成し遂げ、戦後はソ連の従属を拒否してスターリンと決別(コミンフォルムからの除名)し、独自の社会主義路線(自主管理社会主義)と非同盟外交を追求した。',
      significance:'ソ連からの独立性を保った稀有な社会主義指導者として国際的な威信を確立し、複数の民族・共和国を強力な指導力のもとに一つの連邦国家としてまとめ上げる稀有な政治的手腕を発揮した。',
      debate:'その強権的な統治手法(政治的反対派の弾圧)を評価に含めるべきかという点と、彼個人のカリスマに依存した国民統合が長期的に持続可能な仕組みであったのかという点は、彼の死後の急速な国家解体を踏まえてしばしば議論される。'
    } },
  { id:'yugoslav_wars', name:'ユーゴスラヴィア紛争', category:'war', lat:44.79, lng:20.45, start:1991, end:2000, region:'旧ユーゴスラヴィア諸地域',
    desc:{
      background:'冷戦終結による国際的な緊張緩和とチトー死後の求心力低下により、それまで抑制されてきた各共和国間の経済格差・民族的緊張が一気に表面化したことが、この一連の紛争の背景にある。',
      process:'スロヴェニア・クロアチアの独立宣言を皮切りに、セルビア主導の連邦軍・民兵組織との間で各地に紛争が拡大し、特にボスニアでは複数の民族が入り混じる複雑な人口構成のもとで凄惨な内戦へと発展した。',
      significance:'ヨーロッパにおいて第二次世界大戦後最悪規模の犠牲者を出し、『民族浄化』という言葉が国際的に広く認知される契機となったこの紛争は、冷戦後の国際社会における民族紛争・人道的介入のあり方を根本的に問い直す事例となった。',
      debate:'この紛争を古くからの民族的憎悪の『必然的』な再燃とみる見方は単純化に過ぎるとして、実際には政治指導者(ミロシェヴィッチら)による意図的な民族主義的動員が紛争を煽動・激化させた側面を重視する見方が、現在の研究では有力である。'
    } },
  { id:'bosnian_war', name:'ボスニア紛争', category:'war', lat:43.86, lng:18.41, start:1992, end:1995, region:'ボスニア=ヘルツェゴビナ',
    desc:{
      background:'セルビア人・クロアチア人・ボシュニャク人(ムスリム人)という3つの主要民族が複雑に混住するボスニアの人口構成そのものが、独立を機に深刻な内戦へと発展する構造的な脆弱性を内包していた。',
      process:'独立宣言に反対するセルビア人勢力が(旧連邦軍の支援を受けつつ)各地を制圧し、『民族浄化』と呼ばれる組織的な虐殺・強制追放・強制収容所の設置などを通じて特定民族の排除を図る行為が広範囲で行われた。',
      significance:'この紛争における残虐行為(サライェヴォ包囲、集団虐殺)はヨーロッパの中心部で起きた出来事として国際社会に大きな衝撃を与え、国連の平和維持活動の限界と国際的な人道的介入のあり方に関する深刻な反省を促した。',
      debate:'国連平和維持軍が『安全地帯』を設定しながら実効的な防衛を行えなかったこと(スレブレニツァの悲劇に直結)は、国際的な人道的介入が実際の軍事的裏付けを欠く場合にいかに無力であるかを示す痛切な教訓として、その後の国連平和維持活動のあり方に大きな影響を与えた。'
    } },
  { id:'srebrenica_massacre', name:'スレブレニツァの虐殺', category:'event', lat:44.1, lng:19.3, start:1995, end:1995, region:'ボスニア=ヘルツェゴビナ(スレブレニツァ)',
    desc:{
      background:'国連により『安全地帯』に指定されながらも、実際にはオランダ軍の平和維持部隊が小規模かつ十分な武装・権限を与えられておらず、防衛能力が著しく限定されていたことが、この悲劇の直接的な背景にある。',
      process:'セルビア人勢力(ムラディッチ指揮下の軍)が『安全地帯』に侵入し、国連軍がほとんど有効な抵抗をしないまま、避難していたボシュニャク人男性・少年数千人が組織的に選別・殺害された。',
      significance:'この事件は国際刑事法廷(旧ユーゴ国際刑事裁判所)によって第二次世界大戦後のヨーロッパにおける最悪のジェノサイド(集団虐殺)として正式に認定され、国際社会の『保護する責任』論の発展にも影響を与える重要な先例となった。',
      debate:'国連平和維持部隊(特にオランダ軍)の対応の不十分さについては、その後長く国際的な批判と法的責任追及の対象となり、国際機関による『安全の保障』が実効的な軍事力の裏付けを欠く場合の危険性を象徴する事例として繰り返し参照される。'
    } },
  { id:'dayton_agreement', name:'デイトン合意', category:'treaty', lat:48.86, lng:2.35, start:1995, end:1995, region:'アメリカ(デイトン)で協議、パリで調印',
    desc:{
      background:'3年以上に及ぶボスニア紛争による甚大な人的・物的被害と国際社会からの強い圧力の高まりが、この包括的和平合意実現の背景にある。',
      process:'アメリカの主導のもと当事者(セルビア人・クロアチア人・ボシュニャク人の各代表)を交渉のテーブルに着かせ、ボスニア=ヘルツェゴビナを2つの構成体(スルプスカ共和国とボシュニャク・クロアチア人連邦)からなる複雑な連邦国家として存続させる枠組みで合意を成立させた。',
      significance:'この合意により紛争そのものは終結したが、民族ごとに分かたれた複雑な統治構造は、その後も国家としての実効的な統合・機能性を大きく制約し続ける構造的な課題を残すこととなった。',
      debate:'この合意を『紛争終結のための現実的な妥協』として評価する見方がある一方、民族分断そのものを制度的に固定化してしまい、真の国民的統合や和解を妨げているとする批判的な見方も根強く存在する。'
    } },
  { id:'kosovo_war', name:'コソヴォ紛争', category:'war', lat:42.66, lng:21.16, start:1998, end:1999, region:'コソヴォ(旧ユーゴスラヴィア、セルビア)',
    desc:{
      background:'セルビア領内でアルバニア系住民が多数を占めるコソヴォにおいて、自治権剥奪(ミロシェヴィッチ政権による)への反発から独立・自治要求運動が武力化したことが、この紛争の背景にある。',
      process:'アルバニア系住民への弾圧・迫害が深刻化する中、NATOが人道的介入を掲げて国連安全保障理事会の決議を経ないままセルビアへの空爆を実施し、最終的にセルビア側が国際部隊のコソヴォ駐留を受け入れる形で事態は収拾された。',
      significance:'この介入は『人道的介入』という国際関係上の新たな概念・実践の代表的事例となり、国家主権の不可侵性と深刻な人権侵害への国際的対応義務との緊張関係という現代国際法上の根本的な問題を提起した。',
      debate:'国連安保理決議を経ない武力行使の合法性については国際法学者の間で見解が大きく分かれ、この事例が『主権よりも人道を優先する』国際規範の先例となったのか、それとも単なる大国の一方的な武力行使の正当化に過ぎなかったのかは、今なお論争が続いている。'
    } },
  { id:'visigothic_kingdom', name:'西ゴート王国', category:'nation', lat:39.86, lng:-4.02, start:418, end:720, region:'南フランス(トロサ)→イベリア半島(トレド)',
    desc:{
      background:'アドリアノープルの戦い以降ローマ帝国領内への定住を認められていた西ゴート族が、帝国の混乱に乗じて自立した政治的実体を形成する機会を得たことが建国の背景にある。',
      process:'当初は南フランスのトロサを都に建国したが、フランク王国との抗争(ヴイエの戦い)に敗れイベリア半島へ拠点を移してトレドを都と定め、以後同半島の大部分を支配し続けたが、内部の王位継承争いによる混乱に乗じたイスラーム勢力(ウマイヤ朝)の侵攻により急速に崩壊した。',
      significance:'ローマ的な行政制度とゲルマン的な部族制度を融合させたこの王国の統治モデルは、後のイベリア半島における政治文化の一つの基層を形成し、その滅亡はイスラーム勢力の西欧進出という新たな時代の幕開けを画した。',
      debate:'内部の権力争いという内的要因と、ウマイヤ朝という外的軍事力のどちらがこの急速な崩壊のより決定的な要因であったかについては、史料の乏しさもあり議論の余地が残されている。'
    } },
  { id:'alaric', name:'アラリック', category:'person', lat:41.9, lng:12.49, start:370, end:410, region:'西ゴート王国', parentId:'visigothic_kingdom',
    desc:{
      background:'帝国内への定住を認められながらも十分な処遇(食料供給・高位の軍職)を得られなかった西ゴート族の不満を代弁し、幾度もの交渉決裂を経験したことが、彼の軍事行動の直接的な背景にある。',
      process:'バルカン半島・イタリア半島を舞台に度重なる交渉と軍事的圧力を繰り返した末、最終的な交渉決裂を受けて410年にローマ市への攻撃を敢行し、比較的抑制的とはいえ市内での略奪を許した。',
      significance:'約800年間外敵の手に落ちたことのなかった『永遠の都』の陥落は地中海世界全体に大きな精神的衝撃を与え、この出来事は西ローマ帝国の実質的な権威失墜を象徴する事件として記憶され続けている。',
      debate:'この略奪の実際の破壊規模については比較的軽微であったとする見方があり、当時の人々に与えた心理的衝撃の大きさと実際の物理的被害の程度との乖離が、しばしば指摘される論点である。'
    } },
  { id:'ostrogothic_kingdom', name:'東ゴート王国', category:'nation', lat:45.44, lng:10.99, start:493, end:553, region:'イタリア半島',
    desc:{
      background:'東ローマ皇帝の支援(あるいは黙認)のもと、東ゴート族の指導者テオドリックがイタリアを実効支配していたオドアケルを打倒する機会を得たことが、この王国建設の背景にある。',
      process:'テオドリックはオドアケルを策略により殺害してイタリアの支配権を確立し、ローマの行政制度・元老院を存続させゲルマン人とローマ人の共存を図る統治を行ったが、彼の死後の後継者不在・内紛に乗じたビザンツ皇帝ユスティニアヌスの侵攻(ゴート戦争)により最終的に滅ぼされた。',
      significance:'ゲルマン的軍事力とローマ的統治制度・文化を融合させたこの統治モデルは、『蛮族』支配下でもローマ的な文明的秩序が一定程度存続しうることを示す重要な事例となった。',
      debate:'この王国の滅亡をもたらしたゴート戦争がイタリアに与えた荒廃の深刻さは、『ローマの再統一』を目指したユスティニアヌスの政策が、結果的にイタリアの政治的・経済的衰退を加速させたという皮肉な帰結を考えさせる事例とされる。'
    } },
  { id:'theodoric_great', name:'テオドリック(大王)', category:'person', lat:45.44, lng:10.99, start:454, end:526, region:'東ゴート王国', parentId:'ostrogothic_kingdom',
    desc:{
      background:'東ローマ皇帝のもとで人質としての教育を受けた経験を通じてローマ文化への深い理解を身につけたことが、彼の融和的な統治方針の思想的背景にあるとされる。',
      process:'皇帝の支援(あるいは体のいい厄介払い)を受けてイタリアに侵攻しオドアケルを打倒した後、ローマの行政制度・元老院・法体系を尊重しつつゲルマン人とローマ人がそれぞれの法に従いながら共存する二重統治体制を築いた。',
      significance:'その『賢王』としての統治は、ゲルマン諸国家の中でも最も洗練された形でローマ的文明を継承・保護した事例として、後世高く評価され続けている。',
      debate:'晩年には宗教(アリウス派対アタナシウス派)をめぐる対立からローマ人有力者(哲学者ボエティウスなど)を処刑するなど融和策に翳りが見え始めており、その統治の『理想』と『現実』との間の緊張関係もしばしば指摘される。'
    } },
  { id:'gothic_war_justinian', name:'ゴート戦争', category:'war', lat:41.9, lng:12.49, start:535, end:554, region:'イタリア半島',
    desc:{
      background:'『ローマ帝国の栄光の回復』を掲げるユスティニアヌス1世にとって、かつての帝国の中心であったイタリア半島の東ゴート族支配からの奪還が、その野心的な再征服事業の中心的目標であったことが背景にある。',
      process:'名将ベリサリウス、後にはナルセスを起用して長期にわたる困難な戦争を戦い抜き、最終的に東ゴート王国を完全に滅ぼしてイタリアの再征服を達成した。',
      significance:'この戦争の『勝利』によりビザンツは一時的にイタリアの支配権を回復したが、20年に及ぶ戦火でイタリアは深刻に荒廃し、その隙をついて間もなくランゴバルド人が侵入・定住することとなり、再征服の成果は長続きしなかった。',
      debate:'この戦争を『ローマ帝国再統一』という理念に基づく正当な事業とみるか、結果的にイタリアを徹底的に疲弊させただけの割に合わない軍事的冒険であったとみるかは、ユスティニアヌスの対外政策全体の評価に関わる重要な論点である。'
    } },
  { id:'vandal_kingdom', name:'ヴァンダル王国', category:'nation', lat:36.85, lng:10.32, start:429, end:534, region:'北アフリカ(カルタゴ)',
    desc:{
      background:'イベリア半島から北アフリカへと移動したヴァンダル族が、当時のローマ帝国屈指の穀倉地帯であった北アフリカを征服する機会を捉えたことが、この王国建設の背景にある。',
      process:'カルタゴを拠点に強力な海軍力を整備して地中海の制海権を掌握し、一時はローマ市自体も略奪する(455年)など、当時のローマ世界にとって最大級の脅威となったが、内部の宗教対立(アリウス派によるカトリック教徒迫害)や統治の不安定化により弱体化し、最終的にビザンツの将軍ベリサリウスの遠征により滅ぼされた。',
      significance:'地中海の穀倉地帯を長期にわたり支配下に置いたことは、西ローマ帝国の食料供給・財政基盤に深刻な打撃を与え、西ローマ滅亡を早める間接的な要因の一つとなった。',
      debate:'『ヴァンダリズム(野蛮な破壊行為)』という言葉の語源となったその否定的イメージについては、実際の統治実態(一定の行政的安定を保っていたこと)を踏まえた再評価の余地があるとする見方もある。'
    } },
  { id:'gaiseric', name:'ガイセリック', category:'person', lat:36.85, lng:10.32, start:389, end:477, region:'ヴァンダル王国', parentId:'vandal_kingdom',
    desc:{
      background:'イベリア半島での不安定な立場から、より豊かで防衛しやすい北アフリカへの移住・征服を志向したことが、彼の指導のもとでの王国建国の背景にある。',
      process:'北アフリカの穀倉地帯を征服して強力な海軍力を整備し、地中海の制海権を握って455年にはローマ市を略奪し、東西ローマ双方にとって最大級の脅威となる王国を一代で築き上げた。',
      significance:'その海軍力による地中海支配は、西ローマ帝国の経済的・軍事的基盤を大きく揺るがし、帝国滅亡の重要な一因となる深刻な打撃を与えた。',
      debate:'彼の巧みな外交・軍事戦略(東西ローマの対立を利用するなど)を評価する見方は、『蛮族』の指導者という単純なイメージを超えた、当時の複雑な国際政治を的確に読み解いていた戦略家としての再評価につながっている。'
    } },
  { id:'burgundian_kingdom', name:'ブルグンド王国', category:'nation', lat:45.76, lng:4.83, start:411, end:534, region:'ガリア東部(現フランス東部)',
    desc:{
      background:'ローマ帝国の弱体化に伴う民族移動の波の中、ブルグンド族がガリア東部への定住地を求めたことが、この王国建設の背景にある。',
      process:'独自の法典(ブルグンド法典、ゲルマン人とローマ人それぞれに適用される属人法主義を採用)を整備し比較的安定した統治を行ったが、周辺の新興勢力であるフランク王国の圧力に抗しきれず、最終的に征服されてその領土に組み込まれた。',
      significance:'この王国の法典は、異なる出自の住民(ゲルマン人とローマ人)にそれぞれ固有の法を適用するという中世初期の法的多元主義の一例として、当時の複合的な社会構造を理解する上で重要な史料的価値を持つ。',
      debate:'比較的短命に終わったこの王国の存在は、フランク王国のような後に大国化する勢力と、そうでなかった他のゲルマン諸国家との違いを分けた要因(地理的条件、指導者の資質など)を考える比較史的な事例として位置づけられる。'
    } },
  { id:'lombard_kingdom', name:'ランゴバルド王国', category:'nation', lat:45.46, lng:9.19, start:568, end:774, region:'イタリア北部(パヴィア)',
    desc:{
      background:'ゴート戦争によるビザンツの疲弊とイタリアの荒廃という権力の空白に乗じ、ゲルマン系のランゴバルド人がイタリアへの本格的な侵入・定住を果たしたことが建国の背景にある。',
      process:'北イタリアに強固な支配拠点(パヴィアを首都)を築き南下を続けて教皇領を脅かす存在となったが、これに危機感を抱いた教皇の要請を受けたフランク王国(ピピン、続いてカール大帝)の介入・征服により最終的に滅ぼされた。',
      significance:'この王国への対応(教皇領寄進、フランクによる征服)を通じて、フランク王国と教皇権の緊密な提携関係が確立され、これが後のカール大帝の皇帝戴冠へとつながる重要な政治的布石となった。',
      debate:'この王国の滅亡が、結果的に教皇権とフランク王権という西欧中世を規定する二大権威の結合を促したという歴史的皮肉は、征服される側の存在が意図せずして後の大きな政治的枠組み形成を準備する事例として興味深い。'
    } },
  { id:'peace_of_callias', name:'カリアスの和約', category:'treaty', lat:37.98, lng:23.73, start:-449, end:-449, region:'アテネ・アケメネス朝ペルシア間',
    desc:{
      background:'エウリュメドン川の戦いなどでギリシア側がペルシアに対し優位を確立する中、双方にとって消耗の続く戦争を正式に終結させる実利的な必要性が高まっていたことが、この講和の背景にある。',
      process:'アテネの政治家カリアスが交渉役となり、ペルシアがエーゲ海・小アジア西岸のギリシア人都市への不介入を約する一方、ギリシア側もペルシア領への攻撃を控えるという相互不可侵の取り決めがなされたとされる。',
      significance:'この講和により半世紀近くに及んだペルシア戦争は正式に終結し、以後アテネはペルシアという共通の脅威を失ったデロス同盟の存在意義そのものを問い直される立場に置かれることとなった。',
      debate:'この和約が実際に正式な文書として締結されたのか、それとも後代(特にアテネの弁論家たち)による事後的な理念化・誇張に過ぎないのかについては、同時代史料の欠如から今なお歴史学上の論争が続いている。'
    } },
  { id:'corinthian_war', name:'コリント戦争', category:'war', lat:37.94, lng:22.93, start:-395, end:-387, region:'ギリシャ(コリントほか)',
    desc:{
      background:'ペロポネソス戦争後のスパルタの覇権的な振る舞い(小アジアへの介入)が周辺諸ポリスの反発を招き、かつての敵国アテネ・テーベ・コリントが結束する契機となったことが、この戦争の背景にある。',
      process:'ペルシアの資金援助も受けた反スパルタ連合軍とスパルタ軍が各地で戦ったが決定的な決着がつかないまま消耗が続き、最終的にペルシア王の仲裁による和約(大王の和約)によって終結した。',
      significance:'ギリシア諸ポリス間の対立にペルシアが仲裁者として介入するという前例を作ったことは、以後のポリス社会がペルシアという外部勢力の影響力に翻弄される脆弱な状況に置かれていたことを象徴的に示している。',
      debate:'ポリス社会が自律的な問題解決能力を失いつつあったことの証左として、この戦争とその終結過程はポリス衰退論における重要な事例としてしばしば取り上げられる。'
    } },
  { id:'kings_peace_387', name:'大王の和約', category:'treaty', lat:37.98, lng:23.73, start:-387, end:-387, region:'ギリシャ・アケメネス朝ペルシア間',
    desc:{
      background:'コリント戦争の長期化と決着のつかない消耗戦の継続が、当事国いずれにとっても受け入れ可能な形での終結を模索する必要性を高めていたことが、この和約成立の背景にある。',
      process:'ペルシア王アルタクセルクセス2世が仲裁者として乗り出し、小アジアのギリシア人諸都市をペルシア領と認める一方、ギリシア本土の諸ポリスの自治(自律)を保障するという内容で和約がまとめられた。',
      significance:'ギリシア本土の政治にペルシアが公式に仲裁者として介入する前例を確立したことで、以後のポリス間政治はペルシアの意向を無視できない構造に組み込まれることとなった。',
      debate:'『諸ポリスの自律』を掲げながら実際にはスパルタの覇権維持に都合よく利用された側面が強く、この和約の理念と実態の乖離は、当時の国際政治における『大義名分』と『実利』の関係を考える好例とされる。'
    } },
  { id:'battle_poitiers_1356', name:'ポワティエの戦い', category:'war', lat:46.58, lng:0.34, start:1356, end:1356, region:'フランス(ポワティエ)',
    desc:{
      background:'クレシーの戦いでの大敗にもかかわらずフランス側が依然として大規模な軍を動員し得る国力を保持していたことが、この再度の大規模会戦を招く背景となった。',
      process:'エドワード黒太子率いる寡兵のイングランド軍が、地の利を生かした防御陣形と長弓兵の集中運用により数的に優勢なフランス軍を打ち破り、フランス王ジャン2世自身を捕虜とする歴史的な大勝利を収めた。',
      significance:'国王が敵国の捕虜となるという事態はフランス王権の権威を著しく失墜させ、多額の身代金要求と国内の混乱(パリでの反乱など)を招き、以後の戦争継続にも深刻な財政的・政治的影響を残した。',
      debate:'クレシー・ポワティエと連敗を重ねながらも長期的にはフランスが勝利したこの戦争全体を踏まえ、局地戦での戦術的勝利と戦争全体の帰趨とがいかに乖離しうるかを示す事例として、しばしば軍事史上引き合いに出される。'
    } },
  { id:'swiss_independence_1499', name:'スイスの事実上の独立(シュヴァーベン戦争)', category:'event', lat:47.37, lng:8.54, start:1499, end:1499, region:'スイス',
    desc:{
      background:'神聖ローマ皇帝マクシミリアン1世が帝国改革(帝国税の賦課など)を通じてスイス誓約同盟への統制強化を図ろうとしたことが、この戦争を招く直接の背景となった。',
      process:'スイス側は独自の歩兵戦術(長槍を用いた密集陣形)を駆使して皇帝軍との戦闘に連勝し、事実上帝国の統制から離脱する既成事実を確立した。',
      significance:'この勝利によりスイス誓約同盟は事実上の独立を達成し、以後のヨーロッパにおいて精強な傭兵供給国としての独自の地位を確立する一方、国際的な正式承認は1648年のウェストファリア条約まで待つこととなった。',
      debate:'『事実上の独立』と『国際的な法的承認』との間に150年近い時間差があったことは、近世における国家の独立・主権概念が単一の出来事ではなく段階的なプロセスとして成立していったことを示す興味深い事例である。'
    } },
  { id:'war_devolution', name:'南ネーデルラント継承戦争(権利委譲戦争)', category:'war', lat:50.85, lng:4.35, start:1667, end:1668, region:'南ネーデルラント(現ベルギー)',
    desc:{
      background:'スペイン王フェリペ4世の死去に際し、ルイ14世が王妃(フェリペ4世の娘)の相続権を独自に解釈し、南ネーデルラントへの領有権を主張したことが、この戦争の直接的な口実となった。',
      process:'フランス軍が南ネーデルラントへ侵攻して各地を占領したが、フランスの急速な勢力拡大を警戒したオランダ・イギリス・スウェーデンが三国同盟を結成して外交的圧力をかけ、比較的短期間での講和を余儀なくされた。',
      significance:'この戦争は、ルイ14世治世における対外拡張路線の始まりを告げるとともに、周辺諸国による対仏バランシング(勢力均衡のための同盟形成)という近世国際政治の力学を早くも示す事例となった。',
      debate:'『相続権』という法的な口実の妥当性については当時から疑問視されており、この戦争は近世における領土拡張の口実としての法解釈がいかに恣意的に利用されうるかを示す事例として論じられる。'
    } },
  { id:'khmelnytsky_uprising', name:'フメリニツキーの乱(ウクライナ、コサックの反乱)', category:'war', lat:50.45, lng:30.52, start:1648, end:1657, region:'ウクライナ(ポーランド=リトアニア共和国領)',
    desc:{
      background:'ポーランド=リトアニア共和国におけるポーランド系貴族(シュラフタ)によるウクライナ・コサックへの農奴制的支配の強化と、正教徒コサックへのカトリック的抑圧政策が、この大反乱の根本的背景にある。',
      process:'コサックの指導者フメリニツキーがクリミア・タタールとも一時同盟しつつポーランド軍を各地で撃破する軍事的成功を収めたが、単独での独立維持が困難と判断し、最終的にロシア・ツァーリ国の保護を求める道を選んだ(ペレヤスラフ協定)。',
      significance:'この反乱はポーランド=リトアニア共和国に壊滅的な国力消耗をもたらしその後の衰退を決定づける一方、コサックがロシアの保護下に入ったことはロシアのウクライナ方面への進出・影響力拡大の重要な足がかりとなった。',
      debate:'現代のウクライナとロシアの歴史認識において、この反乱とペレヤスラフ協定の位置づけ(『再統合』か『従属の始まり』か)は、両国関係の歴史的正統性をめぐる重要かつ現在進行形の政治的論争点となっている。'
    } },
  { id:'stenka_razin_revolt', name:'ステンカ=ラージンの反乱', category:'revolution', lat:51.53, lng:46.03, start:1670, end:1671, region:'ロシア南部・ヴォルガ川流域',
    desc:{
      background:'農奴制の強化とコサックの伝統的自由(逃亡農民の受け入れなど)への中央政府の統制強化が、ヴォルガ川流域における広範な社会的不満の温床となっていたことが、この反乱の背景にある。',
      process:'コサックの首領ステンカ=ラージンが農民・下層コサックを糾合してヴォルガ川流域の都市を次々に制圧する勢いを見せたが、正規軍の反攻を受けて敗退し、最終的に裏切りにより捕らえられモスクワで処刑された。',
      significance:'この反乱は帝政ロシアにおける農民・コサックによる大規模な反体制運動の重要な先例となり、後のプガチョフの乱と並んで、ロシア社会における根深い農奴制への不満と反乱の伝統を示す事例として記憶され続けている。',
      debate:'この反乱を単なる略奪的暴動とみるか、農奴制という社会的不正義への組織的な異議申し立てとみるかは、ロシア民衆運動史における評価の分かれる論点である。'
    } },
  { id:'treaty_karlowitz', name:'カルロヴィッツ条約', category:'treaty', lat:45.2, lng:19.93, start:1699, end:1699, region:'ハンガリー(カルロヴィッツ)',
    desc:{
      background:'第2次ウィーン包囲の失敗以降、オーストリア・ポーランド・ヴェネツィア・ロシアが神聖同盟を結成してオスマン帝国への反攻を続けた大トルコ戦争が、双方の消耗の末に講和を必要とする段階に達していたことが背景にある。',
      process:'オスマン帝国はハンガリーの大半・トランシルヴァニアなどをオーストリアに割譲し、ポドリアをポーランドに、モレアをヴェネツィアに割譲するなど、広範な領土喪失を受け入れざるを得なかった。',
      significance:'この条約はオスマン帝国が初めて大規模な領土的譲歩を強いられた画期的な事例であり、以後のオスマン帝国は明確に守勢・後退局面に入り、『瀕死の病人』としての長期的衰退の始まりを画する出来事となった。',
      debate:'この条約を境に『オスマンの脅威』が過去のものとなったとする西欧中心的な歴史叙述に対し、実際にはオスマン帝国はその後も長期にわたり地域大国として存続し続けたことを踏まえた、より慎重な評価も必要とされる。'
    } },
  { id:'treaty_methuen', name:'メシュエン条約', category:'treaty', lat:38.72, lng:-9.14, start:1703, end:1703, region:'イギリス・ポルトガル間',
    desc:{
      background:'スペイン継承戦争においてポルトガルが英仏いずれの陣営につくかという外交的選択の中、イギリスとの経済的な結びつきを強化する必要があったことが、この通商条約締結の背景にある。',
      process:'ポルトガル産ワインの英国市場への優遇関税と引き換えに、イギリス製毛織物のポルトガル市場への自由な輸出を認めるという、実質的に非対称な通商関係が制度化された。',
      significance:'この条約により、ポルトガルは工業製品を輸入に依存し植民地(ブラジル)からの銀・金の流出がイギリスへ向かうという構造的な経済的従属関係に組み込まれ、以後のポルトガル経済の停滞の一因となったとされる。',
      debate:'この条約を、ポルトガルにとって短期的利益(ワイン輸出市場確保)と引き換えに長期的な経済的自立性を犠牲にした『悪しき条約』の典型例とみる見方が一般的だが、当時の国際情勢下での限られた選択肢を踏まえた現実的判断であったとする見方もある。'
    } },
  { id:'diplomatic_revolution_1756', name:'外交革命', category:'event', lat:48.21, lng:16.37, start:1756, end:1756, region:'オーストリア・フランス間',
    desc:{
      background:'プロイセンの急速な軍事的台頭がオーストリアにとって看過できない脅威となる一方、伝統的な独墺対立の構図に固執することの戦略的合理性が薄れつつあったことが、この提携転換の背景にある。',
      process:'オーストリアの外相カウニッツが主導し、長年の宿敵であったフランス(ブルボン家)との同盟を実現させ、これにイギリスと結んだプロイセンが対抗する新たな同盟網が形成された。',
      significance:'何世紀にもわたり続いたハプスブルク家とブルボン家の対立構造を覆すこの劇的な提携転換は、七年戦争という新たな国際戦争の同盟構造を規定し、近世ヨーロッパ外交における同盟関係の流動性を象徴する事例となった。',
      debate:'この『外交革命』が真にイデオロギー的な対立を超えた純粋な国益計算に基づくものであったかについては、当時の宮廷政治における個人的な思惑(マリア・テレジアの対プロイセン復讐心など)の役割も含めて論じられる。'
    } },
  { id:'treaty_kucuk_kaynarca', name:'キュチュク=カイナルジャ条約', category:'treaty', lat:43.75, lng:27.85, start:1774, end:1774, region:'オスマン帝国・ロシア間',
    desc:{
      background:'エカチェリーナ2世治下のロシアが黒海方面への南下政策を積極的に推進し、オスマン帝国との軍事的対決に踏み切ったことが、この条約に至る戦争の背景にある。',
      process:'ロシアが軍事的に優位に立つ中で講和が結ばれ、クリミア半島の(名目上の)独立や黒海沿岸への進出権、さらにはオスマン帝国領内のギリシア正教徒に対する保護権という、後の内政干渉の口実となる重要な特権を獲得した。',
      significance:'この条約はロシアの南下政策・オスマン帝国内政への介入の重要な足がかりとなり、以後1世紀以上にわたり『東方問題』として国際政治の火種であり続ける構造の出発点となった。',
      debate:'『ギリシア正教徒保護権』という曖昧な条項が、後にロシアによって拡大解釈され続けたことは、条約文言の解釈をめぐる国際政治上の恣意性・危険性を示す典型的な事例として論じられる。'
    } },
  { id:'vendee_revolt', name:'ヴァンデーの反乱', category:'war', lat:46.87, lng:-0.85, start:1793, end:1796, region:'フランス西部(ヴァンデー地方)',
    desc:{
      background:'革命政府による聖職者民事基本法(聖職者への国家への忠誠宣誓の要求)と徴兵制の導入が、伝統的なカトリック信仰と地域共同体の慣習を重んじるフランス西部農民の強い反発を招いたことが、この反乱の背景にある。',
      process:'農民・地元貴族・非宣誓聖職者が結束して反革命的な武装蜂起を起こし一時は広範な地域を制圧したが、革命政府軍(共和国軍)による組織的な鎮圧の中で、住民の大量虐殺を含む苛烈な弾圧(『地獄部隊』による焦土作戦)を受けた。',
      significance:'この反乱とその鎮圧は、フランス革命が抱えていた都市エリート主導の理念と、伝統的な地方・農村社会の信仰・慣習との深刻な断絶を象徴する事件となり、フランス国内における革命の記憶を今なお複雑なものにしている。',
      debate:'この鎮圧における犠牲者数・手法の苛烈さについては、これを『ジェノサイド(民族浄化に類する行為)』とまで呼ぶべきかという歴史学上の激しい論争があり、フランス革命の評価そのものに関わる敏感な論点となっている。'
    } },
  { id:'greek_war_independence', name:'ギリシア独立戦争', category:'war', lat:37.98, lng:23.73, start:1821, end:1832, region:'ギリシャ',
    desc:{
      background:'オスマン帝国支配下での重税と、フィリキ・エテリアなど秘密結社を通じたギリシア民族主義・独立志向の高まりが、この独立戦争の背景にある。',
      process:'当初は劣勢であったが、キオス島の虐殺などオスマン側の弾圧が西欧世論の同情(ロマン主義的な親ギリシア感情、バイロンの参加なども含む)を喚起し、最終的にイギリス・フランス・ロシアがナヴァリノの海戦でオスマン・エジプト連合艦隊を撃破する直接的な軍事介入を行い、独立を後押しした。',
      significance:'この独立達成は、ウィーン体制下で抑圧されてきたナショナリズム運動が初めて大きな成功を収めた事例として、以後のヨーロッパ各地における民族独立運動全体に大きな勇気と実践的モデルを与えた。',
      debate:'この独立が主として現地ギリシア人自身の闘争によるものか、それとも列強の介入(ナヴァリノの海戦)がなければ実現しえなかったものかについては、独立運動の自律性をめぐる評価が分かれる。'
    } },
  { id:'kingdom_of_greece', name:'ギリシア王国', category:'nation', lat:37.98, lng:23.73, start:1832, end:1973, region:'ギリシャ',
    desc:{
      background:'独立戦争を支援した列強が、新興国ギリシアの王位に自国と直接の血縁関係を持たない中立的な外国王家出身者を据えることで合意したことが、この王国成立の特異な経緯の背景にある。',
      process:'バイエルン王家出身の若い国王のもとで国家建設が進められたが、その後も度重なる政変・クーデタ・王政と共和政の間の混乱を繰り返しながら存続し、最終的に1973年の軍事政権(大佐たちの独裁)下で王政廃止が宣言された。',
      significance:'この王国の不安定な歴史は、列強の思惑によって『上から』据えられた君主制が、必ずしも国内の政治的安定を保証するものではないことを示す事例として、近代国民国家建設における君主制導入の限界を考えさせる。',
      debate:'外国出身の国王を戴くという建国の経緯そのものが、その後長く続く王政の正統性・国民的一体感の脆弱さの根本的な要因であったとする見方は、この国の政治的不安定さを説明する上で重要視される。'
    } },
  { id:'polish_november_uprising', name:'ポーランド11月蜂起', category:'revolution', lat:52.23, lng:21.01, start:1830, end:1831, region:'ポーランド立憲王国(ロシア領)',
    desc:{
      background:'フランス七月革命の影響がヨーロッパ各地の自由主義・民族運動を刺激する中、ロシア皇帝によるポーランド立憲王国への統制強化への反発が高まっていたことが、この蜂起の背景にある。',
      process:'士官学校の生徒たちの蜂起を発端に全国的な武装反乱へと発展し、一時は独自の臨時政府を樹立するまでに至ったが、統率の乱れと国際的支援の欠如もあり、最終的にロシア軍の大規模な反攻により鎮圧された。',
      significance:'この蜂起の失敗により、ポーランド立憲王国に認められていた独自の憲法・議会・軍隊といった自治的な諸制度は大幅に縮小・剥奪され、以後ロシアによる統制はさらに強化された。',
      debate:'この蜂起の失敗要因として、指導層内部の路線対立(貴族的な穏健派と急進的な民主派の対立)を重視する見方と、そもそも大国ロシアに対する軍事的劣勢が不可避であったとする見方とがある。'
    } },
  { id:'polish_january_uprising', name:'ポーランド1月蜂起', category:'revolution', lat:52.23, lng:21.01, start:1863, end:1864, region:'ポーランド(ロシア領)',
    desc:{
      background:'農奴解放令などアレクサンドル2世の『大改革』にもかかわらず、ポーランドにおける民族的自治要求は満たされず、むしろロシア化政策への警戒感が根強く残っていたことが、この2度目の蜂起の背景にある。',
      process:'徴兵をめぐる不満を直接の契機に武装蜂起が全国に広がったが、正規軍を持たないゲリラ戦的な抵抗にとどまらざるを得ず、国際的な支援も乏しい中、長期化の末にロシア軍によって鎮圧された。',
      significance:'この蜂起の失敗により、ポーランドの民族的自治はさらに厳しく制限され、以後ロシア語教育の強制などのロシア化政策が一層強化される結果となった。',
      debate:'度重なる蜂起の失敗にもかかわらずポーランド人が民族的抵抗を諦めなかったことは、武力による独立達成が困難な状況下でも、文化・言語を通じた民族的アイデンティティの保持がいかに粘り強く続けられたかを示す事例として重視される。'
    } },
  { id:'young_turk_revolution', name:'青年トルコ革命', category:'revolution', lat:41.01, lng:28.98, start:1908, end:1908, region:'オスマン帝国',
    desc:{
      background:'オスマン帝国の度重なる領土喪失と近代化の遅れに対する危機感が、若手将校・知識人層の間で専制打倒・立憲体制回復を求める運動を育んだことが、この革命の背景にある。',
      process:'『青年トルコ人』と呼ばれる将校グループがマケドニアで蜂起し、専制的なスルタン、アブデュルハミト2世に対し一時停止されていたミドハト憲法の復活を要求してこれを実現させたが、複数政党制のもとでの統治は多民族国家内の各民族の独立運動の高まりを抑えることができなかった。',
      significance:'この革命は帝国内の近代化改革(統一と進歩委員会による諸改革)を進める契機となったが、皮肉にも立憲化がむしろ各民族の自己主張を活発化させ、バルカン戦争・第一次世界大戦へと続く帝国解体過程を早める結果ともなった。',
      debate:'この革命の主導者たちが掲げた『オスマン主義』(多民族の対等な統合)という理念が、実際には次第にトルコ民族主義的な性格を強めていった経緯は、多民族帝国における立憲主義とナショナリズムの複雑な関係を考える上で重要な論点である。'
    } },
  { id:'treaty_brest_litovsk', name:'ブレスト=リトフスク条約', category:'treaty', lat:52.1, lng:23.68, start:1918, end:1918, region:'ロシア(ブレスト=リトフスク)',
    desc:{
      background:'十月革命で権力を握ったボリシェヴィキ政権が『無併合・無賠償』の即時講和を掲げていた一方、軍事的にはドイツ軍の圧倒的優位のもとで戦争継続がほぼ不可能な状況にあったことが、この講和交渉の背景にある。',
      process:'トロツキーが当初『戦争でも講和でもない』という独自の交渉引き延ばし戦術をとったが、ドイツ軍の進撃再開により追い詰められ、最終的にポーランド・バルト三国・ウクライナなど広大な西部領土の放棄を含む極めて過酷な条件を受け入れざるを得なかった。',
      significance:'この講和により東部戦線が消滅したことでドイツは西部戦線に戦力を集中できるようになったが、同年秋のドイツ自身の敗北によりこの条約は事実上無効化され、ソヴィエト政権は失った領土の一部を後に回復する機会を得た。',
      debate:'この屈辱的な講和を受け入れたレーニンの判断を、革命政権の存続を最優先する現実主義的決断として評価する見方と、国際主義的な革命理念(世界革命)からの後退とみる見方(トロツキーらとの党内論争を含む)とが対立する。'
    } },
  { id:'treaty_saint_germain', name:'サン=ジェルマン条約', category:'treaty', lat:48.9, lng:2.09, start:1919, end:1919, region:'フランス(サン=ジェルマン)',
    desc:{
      background:'オーストリア=ハンガリー帝国が第一次世界大戦の敗戦国として解体されることが既定路線となる中、その後継国家であるオーストリア共和国の戦後の地位を確定する必要があったことが、この条約の背景にある。',
      process:'帝国は完全に解体されてチェコスロヴァキア・ポーランド・ユーゴスラヴィアなど複数の後継国家が成立し、残されたオーストリアは山岳地帯中心の小国として大幅に領土を縮小され、ドイツとの合邦(アンシュルス)も明確に禁止された。',
      significance:'かつての中欧の大帝国が一挙に小国へと転落したこの処理は、戦後オーストリア国内に深い喪失感と経済的困難をもたらし、後のナチス・ドイツによる併合(1938年)を求める世論の一因ともなった。',
      debate:'ドイツとの合邦禁止という条項は、民族自決の原則(ドイツ系住民の意思)と戦勝国の安全保障上の懸念(ドイツの再強大化防止)との間の矛盾を象徴しており、この条項の妥当性は当時から議論の的となっていた。'
    } },
  { id:'treaty_neuilly', name:'ヌイイ条約', category:'treaty', lat:48.88, lng:2.27, start:1919, end:1919, region:'フランス(ヌイイ)',
    desc:{
      background:'第一次世界大戦で同盟国側について敗北したブルガリアの戦後処理を確定する必要があったことが、この講和条約締結の背景にある。',

  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

/* =========================================================================
   地図の初期化
   ========================================================================= */
const map = L.map('map', {
  center:[48, 15],
  zoom:4,
  minZoom:2,
  maxZoom:12,
  worldCopyJump:true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom:19,
}).addTo(map);

const markerLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 11,
  iconCreateFunction: function(cluster){
    return L.divIcon({
      html: `<div class="cluster-badge">${cluster.getChildCount()}</div>`,
      className: 'cluster-marker-wrap',
      iconSize: L.point(32, 32),
    });
  },
}).addTo(map);
const markerById = {}; // id -> {marker, entry}

/* =========================================================================
   フィルタ状態
   ========================================================================= */
const activeCategories = new Set(Object.keys(CATEGORY_CONFIG));
let searchTerm = '';

/* =========================================================================
   サイドバー: フィルタリスト生成
   ========================================================================= */
const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

/* =========================================================================
   詳細パネル
   ========================================================================= */
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');

let currentDetailEntry = null;

function getCurrentYear(){
  return parseInt(document.getElementById('yearSlider').value, 10);
}

// entry(国家・王朝・事件など)に紐づく人物を、年代に関わらず全て取得(古い順)
function getRelatedPersons(entry){
  if(!activeCategories.has('person')) return null; // 「人物」ジャンルが非表示なら一覧自体を出さない
  return historicalData
    .filter(p => p.category === 'person' && p.parentId === entry.id)
    .sort((a,b)=> a.start - b.start);
}

/* =========================================================================
   詳細説明(背景・経過・意義/影響・論点の4構造)の描画
   ========================================================================= */
const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];
function renderDesc(desc){
  if(!desc) return '';
  // 後方互換: 万一プレーン文字列のdescが残っていた場合はそのまま1段落で表示
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  if(entry.category !== 'person'){
    const related = getRelatedPersons(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name">${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝の人物(${related.length}人・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝の人物</h4>
            <div class="related-persons-empty">関連する人物データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -3000, MAX_YEAR = 2000;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
</body>
</html>
