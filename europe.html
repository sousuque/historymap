  { id:'pugachev_rebellion', name:'プガチョフの乱', category:'revolution', lat:51.53, lng:46.03, start:1773, end:1775, region:'ロシア南部・ヴォルガ川流域',
    desc:{
      background:'農奴制の重圧とウラル地方の鉱山労働者・コサックの不満、エカチェリーナ2世治下での貴族優遇政策への広範な反発が、この大規模反乱の社会的背景にある。',
      process:'処刑されたはずの皇帝ピョートル3世を僭称するコサックのプガチョフが農民・コサック・異民族を糾合して蜂起し、ヴォルガ川流域一帯を席巻する勢いを見せたが、正規軍の投入により最終的に鎮圧され、プガチョフは処刑された。',
      significance:'この反乱の規模と激しさはロマノフ朝の統治基盤を大きく揺るがし、以後エカチェリーナ2世は農奴に対する統制・監視をむしろ強化する反動的方向へと政策を転換させた。',
      debate:'この反乱を『農奴制打倒を目指した社会革命』の萌芽とみるか、単なる伝統的な皇帝僭称による局地的な暴動の延長とみるかは、ロシア農民運動史における重要な論点である。'
    } },
  { id:'patriotic_war_1812', name:'祖国戦争(1812年、ナポレオンのロシア遠征)', category:'war', lat:55.75, lng:37.62, start:1812, end:1812, region:'ロシア',
    desc:{
      background:'大陸封鎖令への不徹底な同調とポーランド問題をめぐる緊張が、ナポレオンによるロシア侵攻という空前の大遠征を招く直接的背景となった。',
      process:'ロシア軍は正面決戦を避けて後退を続け国土を焼き払う焦土作戦(ボロジノの戦いという例外的な大会戦を経つつ)をとってモスクワさえも放棄し、冬将軍の到来と長大化した補給線の途絶がフランス大陸軍を壊滅的な状態に追い込んだ。',
      significance:'この壊滅的な敗北はナポレオンの軍事的威信を決定的に失わせ、以後の解放戦争・ウィーン体制樹立へとつながるナポレオン没落の最大の転機となった。',
      debate:'ロシア側の勝因として、クトゥーゾフの戦略的な焦土作戦・持久戦を重視する見方と、冬の厳寒という自然条件(いわゆる『冬将軍』)を過大視すべきでないとする見方(実際の消耗の多くは撤退中の飢餓・疲弊によるとする研究)とが対立している。'
    } },
  { id:'decembrist_revolt', name:'デカブリストの乱', category:'revolution', lat:59.93, lng:30.36, start:1825, end:1825, region:'ロシア(サンクトペテルブルク)',
    desc:{
      background:'対仏戦争でヨーロッパへ遠征した青年将校たちが、西欧の立憲的・自由主義的な政治制度に直接触れた経験が、帰国後の専制批判・改革志向の思想的背景となった。',
      process:'皇帝アレクサンドル1世の急死に伴う継承の混乱に乗じ、憲法制定・農奴制廃止などを掲げてサンクトペテルブルクの元老院広場で蜂起したが、統率を欠いたまま新皇帝ニコライ1世側の軍に包囲され即座に鎮圧された。',
      significance:'この蜂起はロシアにおける最初の近代的・世俗的な反体制運動として、以後のナロードニキ運動や革命運動全体に思想的・精神的な系譜を残す出発点となった。',
      debate:'この蜂起の目標が立憲君主政の樹立にとどまるか、より急進的な共和政・農奴解放を志向するものであったかについては参加者間でも見解が分かれており、運動全体の統一的な性格づけは困難とされる。'
    } },
  { id:'nicholas_i_russia', name:'ニコライ1世', category:'person', lat:59.93, lng:30.36, start:1796, end:1855, region:'ロシア帝国', parentId:'russian_empire',
    desc:{
      background:'即位早々にデカブリストの乱という反体制蜂起に直面した経験が、以後生涯を通じた徹底的な保守反動・自由主義弾圧路線を決定づける原体験となった。',
      process:'国内では秘密警察(第三部)による監視体制を強化し検閲を徹底する一方、対外的には1848年革命鎮圧のためハンガリーへ出兵するなど『ヨーロッパの憲兵』として自由主義・ナショナリズム運動の抑圧に努めたが、クリミア戦争での劣勢のさなかに没した。',
      significance:'この治世における徹底した反動政治は、結果としてロシアの近代化・産業化を著しく遅らせ、クリミア戦争での敗北という形でその後進性が国際的に露呈することとなった。',
      debate:'彼の治世を『ロシア専制の絶頂期』として否定的に評価する見方が一般的だが、同時にこの時期に大きく発展したロシア文学・思想(プーシキン、ゴーゴリらの活躍)との逆説的な同時代性も、しばしば興味深い論点として指摘される。'
    } },
  { id:'emancipation_serfs_russia', name:'農奴解放令', category:'event', lat:55.75, lng:37.62, start:1861, end:1861, region:'ロシア帝国',
    desc:{
      background:'クリミア戦争での敗北がロシアの軍事的・経済的後進性(農奴制に基づく非効率な農業・徴兵制度)を露呈させ、抜本的な近代化改革の必要性を痛感させたことが背景にある。',
      process:'アレクサンドル2世のもとで農民を領主への人格的隷属状態から解放する勅令が発せられたが、農民は土地そのものは無償で得られず、高額な『買戻し金』を長期にわたり分割で支払う義務を負わされた。',
      significance:'この解放は近代的な労働力市場・工業化の前提条件を整える改革として評価される一方、不完全な形での土地取得は農民の困窮を長く残し、後の農民運動・革命運動の社会的土壌ともなった。',
      debate:'『大改革』の中でも最も重要な改革とされる一方、土地なき解放という不徹底さゆえに『農奴制の実質的継続に過ぎない』という同時代からの厳しい批判も根強く存在した。'
    } },
  { id:'alexander_ii_russia', name:'アレクサンドル2世', category:'person', lat:59.93, lng:30.36, start:1818, end:1881, region:'ロシア帝国', parentId:'russian_empire',
    desc:{
      background:'クリミア戦争敗北による国家的危機感が、農奴解放を中心とする一連の近代化改革(『大改革』)を断行する強い動機となった。',
      process:'農奴解放令に続き、地方自治制度(ゼムストヴォ)の導入、陪審制を含む司法改革、軍制改革などを次々に進めたが、これらの改革が急進派の目には不十分・中途半端と映り、複数回の暗殺未遂の末、最終的に『人民の意志』によるテロで爆殺された。',
      significance:'その改革は近代的な地方自治・司法制度の基礎を築いたが、ポーランドでの反乱鎮圧やナロードニキ運動の急進化に直面するなど、改革と反動の間で揺れ動く複雑な治世となった。',
      debate:'改革を進める皇帝自身が改革の受益者であるはずの急進派によって暗殺されたという逆説は、上からの漸進的改革と下からの急進的変革要求との根本的な相克を象徴する事例として論じられる。'
    } },
  { id:'alexander_iii_russia', name:'アレクサンドル3世', category:'person', lat:59.93, lng:30.36, start:1845, end:1894, region:'ロシア帝国', parentId:'russian_empire',
    desc:{
      background:'父の暗殺という衝撃的な経験が、以後の徹底した反動的・専制強化路線への転換を決定づける直接の背景となった。',
      process:'『専制・正教・国民性』という保守的な統治理念のもと地方自治への統制強化・大学の自治剥奪などの反改革政策を進める一方、フランス資本の導入による鉄道建設(シベリア鉄道着工など)を通じた急速な国家主導の工業化も推進した。',
      significance:'その治世下で進んだ工業化は次代ニコライ2世期の急速な経済成長の基盤を築いたが、同時に強化された少数民族へのロシア化政策・反ユダヤ主義的迫害(ポグロム黙認)は帝国内の民族的緊張を高める結果となった。',
      debate:'政治的には徹底した反動でありながら経済的には近代化を大きく推進したという治世の二面性は、専制体制と経済発展が必ずしも対立しないことを示す事例として、比較政治経済史の観点からもしばしば注目される。'
    } },
  { id:'nicholas_ii_russia', name:'ニコライ2世', category:'person', lat:59.93, lng:30.36, start:1868, end:1918, region:'ロシア帝国', parentId:'russian_empire',
    desc:{
      background:'父アレクサンドル3世の急死により十分な帝王教育を受けないまま即位し、専制の理念は堅持しつつも自身の指導力には多くの疑問符が付されていたことが治世の困難な背景にある。',
      process:'日露戦争の劣勢を機に1905年革命に直面して国会(ドゥーマ)開設を余儀なくされたが専制の本質は維持し続け、第一次世界大戦の長期化による経済疲弊と皇后・ラスプーチンへの不信も重なり、1917年の二月革命により退位に追い込まれ、翌年家族とともにボリシェヴィキにより処刑された。',
      significance:'その処刑は300年余り続いたロマノフ朝の劇的な終焉を象徴し、以後のロシアが世界初の社会主義国家として全く新しい歴史的段階に入る転換点となった。',
      debate:'彼個人の統治能力の欠如を体制崩壊の主因とする見方と、19世紀末以来蓄積された構造的な社会矛盾(農民問題、労働問題、多民族問題)の必然的帰結を重視する見方とが、ロシア革命の原因論において対立している。'
    } },
  { id:'revolution_1905_russia', name:'1905年革命(第一次ロシア革命)', category:'revolution', lat:59.93, lng:30.36, start:1905, end:1907, region:'ロシア帝国',
    desc:{
      background:'日露戦争における相次ぐ敗北がロシアの後進性・専制の機能不全を露呈させ、長年蓄積されていた労働者・農民・少数民族の不満を一気に噴出させる契機となった。',
      process:'皇帝への請願デモに軍が発砲した『血の日曜日事件』を機に全国的なストライキ・農民蜂起・軍の反乱(戦艦ポチョムキンなど)が広がり、皇帝は『十月宣言』により国会開設・市民的自由の承認という譲歩を行い、事態を沈静化させた。',
      significance:'この革命は専制に一定の制限的な立憲的要素(ドゥーマ)を持ち込んだが、その後まもなく皇帝は実質的な専制権力を回復させ、根本的な体制変革には至らなかった。',
      debate:'レーニンがこの革命を『1917年革命の総稽古』と評したように、この経験(ソヴィエトという評議会組織の誕生を含む)が12年後の革命にどこまで直接的な教訓・組織的基盤を提供したかは、革命史研究における重要な論点である。'
    } },
  { id:'rasputin', name:'ラスプーチン', category:'person', lat:59.93, lng:30.36, start:1869, end:1916, region:'ロシア帝国(宮廷)',
    desc:{
      background:'血友病を患う皇太子アレクセイの出血を不思議な力で鎮めたとされる出来事が、皇后アレクサンドラの絶対的な信頼を勝ち取る決定的な契機となった。',
      process:'宮廷内で放蕩・腐敗した生活を送りながらも皇后の寵愛を背景に人事にまで影響力を及ぼすようになり、特に皇帝が前線に出た第一次世界大戦中はその影響力が最高潮に達したが、事態を憂慮した保守派貴族らの陰謀により毒殺・銃撃の末に殺害された。',
      significance:'その不透明で怪しげな宮廷内での影響力は、ロマノフ朝・皇室そのものへの国民の信頼を大きく損ない、革命前夜の皇室の権威失墜を象徴する存在として記憶されている。',
      debate:'彼の実際の政治的影響力の大きさについては、当時の反体制派プロパガンダによって誇張された側面も指摘されており、実像と伝説的なイメージとの乖離は史料批判上の重要な課題となっている。'
    } },
  { id:'russian_civil_war', name:'ロシア内戦', category:'war', lat:55.75, lng:37.62, start:1917, end:1922, region:'ロシア全土',
    desc:{
      background:'十月革命によるボリシェヴィキ政権樹立に対し、これを認めない旧体制派・穏健社会主義者・地方の分離主義勢力などが各地で武力抵抗を開始したことが内戦勃発の背景にある。',
      process:'赤軍(トロツキーが組織)と各地の白軍(コルチャーク、デニーキンら)に加え、英仏日米など諸外国の干渉軍も加わる複雑な多正面戦争となったが、統一を欠く白軍側に対し赤軍が『戦時共産主義』体制のもと物資・兵員を集中動員し、最終的に勝利した。',
      significance:'この内戦での勝利によりボリシェヴィキ政権は国内における支配を確立し、1922年のソビエト社会主義共和国連邦(ソ連)成立への直接の道を開いた。',
      debate:'諸外国の軍事干渉が内戦の帰趨にどこまで実質的な影響を与えたかについては、干渉規模の限定性を指摘する見方と、これが後のソ連の対外不信・被包囲意識の形成に大きな影響を与えたとする見方の両方が重視される。'
    } },
  { id:'stalin', name:'スターリン', category:'person', lat:55.75, lng:37.62, start:1878, end:1953, region:'ソビエト連邦', parentId:'ussr',
    desc:{
      background:'グルジア(ジョージア)出身という周縁的な出自から、地下活動・党組織の実務(書記長という地味な役職)を通じて着実に党内基盤を固めたことが、レーニン死後の権力闘争を制する背景となった。',
      process:'トロツキーら有力な対抗馬を次々に失脚・追放させて最高指導者の地位を確立し、農業集団化と急速な工業化(五カ年計画)を強行する一方、大粛清により党・軍・一般市民を含む数百万人規模の犠牲者を出す恐怖政治を敷いた。',
      significance:'その強権的な工業化政策により第二次世界大戦を戦い抜く軍事的基盤を整えた一方、その手法(強制労働収容所、計画経済の非効率性)は後の社会主義体制全体の評価を大きく左右する負の遺産ともなった。',
      debate:'急速な工業化による大国化という『成果』と、大粛清・強制的農業集団化による大量の人的犠牲という『代償』のどちらを重視すべきかは、20世紀史における最も激しい評価対立の一つであり続けている。'
    } },
  { id:'trotsky', name:'トロツキー', category:'person', lat:55.75, lng:37.62, start:1879, end:1940, region:'ソビエト連邦', parentId:'ussr',
    desc:{
      background:'十月革命に至る過程で軍事委員として赤軍創設・組織化に主導的役割を果たした実績が、レーニン死後の後継候補としての有力な地位の背景にあった。',
      process:'『世界革命論』を掲げてスターリンの『一国社会主義論』と激しく対立し、党内基盤(官僚機構掌握)で劣るこの権力闘争に敗れて党から除名・国外追放され、亡命先を転々とした末、最終的にメキシコでスターリンの放った暗殺者により殺害された。',
      significance:'その理論的遺産(トロツキズム)は、スターリン主義とは異なる国際主義的な社会主義運動の潮流として、以後の世界各地の左翼運動に一定の影響を残し続けた。',
      debate:'赤軍創設者としての卓越した実務能力・理論的独創性を評価する見方がある一方、内戦期における反対派への苛烈な弾圧にも自ら関与しており、単純に『スターリニズムの犠牲者』としてのみ描くことには批判もある。'
    } },
  { id:'five_year_plans', name:'五カ年計画', category:'event', lat:55.75, lng:37.62, start:1928, end:1941, region:'ソビエト連邦',
    desc:{
      background:'資本主義列強に『10年で追いつくか、さもなくば押しつぶされるか』という強い危機意識のもと、国家主導による急速な工業化の必要性が計画立案の背景にあった。',
      process:'重工業優先の生産目標を国家が一方的に設定し、農村では小農経営を強制的に集団農場(コルホーズ)へ再編する農業集団化を同時に進めたが、抵抗する富農(クラーク)の弾圧・穀物強制徴発が深刻な飢饉(ウクライナのホロドモールなど)を引き起こした。',
      significance:'重工業生産では数値上大きな成果を上げ、これが後の独ソ戦を戦い抜く軍事生産基盤となった一方、農業部門の犠牲と非効率性は長くソ連経済の構造的弱点として残り続けた。',
      debate:'この工業化の『成果』を強調する見方と、数百万人規模ともいわれる飢饉・弾圧による犠牲を重視する見方との対立は、計画経済というシステム自体の評価にも直結する根本的な論点である。'
    } },
  { id:'great_purge', name:'大粛清', category:'event', lat:55.75, lng:37.62, start:1936, end:1938, region:'ソビエト連邦',
    desc:{
      background:'キーロフ暗殺事件を契機に、党内外に潜在する『敵』への疑心暗鬼がスターリンのもとで組織的な大量弾圧へとエスカレートしたことが、この弾圧の直接的な背景にある。',
      process:'見せしめ裁判(モスクワ裁判)を通じてかつての革命の同志たちが次々と『反革命』の罪で処刑され、その対象は党幹部から軍上層部(トゥハチェフスキーら)、さらには一般市民にまで広範囲に及び、強制収容所(グラーグ)網が急速に拡大した。',
      significance:'有能な軍幹部の多くが粛清されたことは独ソ戦緒戦におけるソ連軍の深刻な指揮系統の混乱・大敗北の一因ともなり、体制の抑圧性が軍事的な脆弱性にも直結したことを示した。',
      debate:'この弾圧の規模・犠牲者数については史料公開の進展とともに推計が更新され続けており、その動機についても純粋な権力保持のための恐怖政治とみるか、当時の国際情勢下での(誇張されたとはいえ)対外脅威への過剰な防衛反応とみるかで解釈が分かれる。'
    } },
  { id:'great_patriotic_war', name:'独ソ戦(大祖国戦争)', category:'war', lat:55.75, lng:37.62, start:1941, end:1945, region:'ソビエト連邦(東部戦線)',
    desc:{
      background:'独ソ不可侵条約にもかかわらずナチス・ドイツが東方生存圏(レーベンスラウム)の獲得を目指していたことが、条約を破っての奇襲侵攻という裏切りの背景にある。',
      process:'緒戦の奇襲でソ連軍は壊滅的損害を被ったが、スターリングラードの戦いでの勝利を転機に反攻に転じ、クルスクの戦いなど大規模な戦車戦を経て東部戦線の主導権を握り、最終的にベルリンを占領してドイツを降伏させた。',
      significance:'2000万人を超えるとされる甚大な犠牲を払いながらも枢軸国打倒の主要な軍事的貢献者となったことで、ソ連は戦後国際政治における超大国としての地位を確立した。',
      debate:'この戦争の勝因について、ソ連指導部(特にスターリン)の戦略的手腕を重視する見方と、広大な国土・厳しい気候・膨大な人的資源という構造的要因、および連合国からのレンドリース支援の役割を重視する見方とが並立する。'
    } },
  { id:'battle_stalingrad', name:'スターリングラードの戦い', category:'war', lat:48.71, lng:44.5, start:1942, end:1943, region:'ソ連南部(スターリングラード)',
    desc:{
      background:'コーカサス地方の油田獲得とヴォルガ川交通路の遮断を狙うドイツ軍の南方戦線における戦略目標が、この都市をめぐる激戦を招いた背景にある。',
      process:'市街地の建物一つ一つをめぐる凄惨な白兵戦(『ラットウォー』)が続く中、ソ連軍が都市を死守しつつ側面からの大規模な包囲作戦(天王星作戦)を敢行し、ドイツ第6軍を完全に包囲・降伏に追い込んだ。',
      significance:'この勝利は独ソ戦、ひいては第二次世界大戦全体における戦略的な攻守の転換点となり、以後ドイツ軍は東部戦線において一貫して後退を続けることとなった。',
      debate:'この戦いの犠牲者数(両軍・民間人合わせて100万人以上とも)の甚大さは、第二次世界大戦における東部戦線の戦闘の激烈さが西部戦線とは質的に異なる規模であったことを象徴する事例として繰り返し言及される。'
    } },
  { id:'khrushchev', name:'フルシチョフ', category:'person', lat:55.75, lng:37.62, start:1894, end:1971, region:'ソビエト連邦', parentId:'ussr',
    desc:{
      background:'スターリンの死後、集団指導体制内での権力闘争を勝ち抜く過程で、前任者の統治の問題点を明らかにすることが自らの権力基盤強化に資すると判断したことが、スターリン批判の政治的背景にある。',
      process:'党大会での秘密演説によりスターリンの個人崇拝と大量粛清を告発し(『雪どけ』)、国内の統制をやや緩和する一方、対外的には平和共存路線を掲げつつもキューバへの核ミサイル配備という強硬策に出てキューバ危機を招き、最終的に党内の保守派によるクーデタで失脚した。',
      significance:'スターリン批判は東欧諸国における体制への異議申し立て(ハンガリー動乱など)を誘発する一方、ソ連国内の言論・文化統制の一時的緩和をもたらし、以後のソ連体制の変容の出発点となった。',
      debate:'スターリン批判を『体制の民主化に向けた勇気ある一歩』と評価する見方がある一方、批判の対象を専らスターリン個人の『逸脱』に限定し、体制そのものの構造的問題への言及を回避したその限定性を指摘する見方もある。'
    } },
  { id:'cuban_missile_crisis', name:'キューバ危機', category:'event', lat:23.11, lng:-82.36, start:1962, end:1962, region:'キューバ・アメリカ・ソ連',
    desc:{
      background:'キューバ革命後のカストロ政権に対するアメリカの敵視政策(ピッグス湾侵攻の失敗など)への対抗と、トルコに配備された米国のミサイルへの対抗策として、ソ連がキューバへの核ミサイル配備を決断したことが背景にある。',
      process:'偵察機によりミサイル基地建設が発覚すると米国は海上封鎖に踏み切り、双方の艦船が直接対峙する緊迫した13日間を経て、最終的にケネディ・フルシチョフ間の秘密交渉(トルコのミサイル撤去との交換条件を含む)により危機は回避された。',
      significance:'この危機を教訓に米ソ間にホットラインが設置されるなど、核戦争回避のための危機管理メカニズムの制度化が進み、以後の緊張緩和(デタント)への一つの契機となった。',
      debate:'この危機の『解決』の評価については、ケネディの毅然とした対応を強調するアメリカ側の伝統的な物語に対し、近年公開された資料に基づき、双方の秘密裏の譲歩(特にトルコのミサイル撤去)を重視する、より対等な取引としての再評価が進んでいる。'
    } },
  { id:'brezhnev', name:'ブレジネフ', category:'person', lat:55.75, lng:37.62, start:1906, end:1982, region:'ソビエト連邦', parentId:'ussr',
    desc:{
      background:'フルシチョフの急進的な改革・脱スターリン化政策が党官僚機構内に広範な不満・不安定感を生んでいたことが、より安定志向の集団指導体制を求める勢力による彼の擁立の背景にある。',
      process:'対外的には米国との核軍縮交渉(SALT)や西ドイツとの関係改善(東方外交への対応)など緊張緩和(デタント)を進める一方、国内では経済改革を事実上停滞させ、チェコスロバキアの『プラハの春』改革運動を軍事介入(ブレジネフ・ドクトリン)により鎮圧するなど東欧への統制も維持した。',
      significance:'その長期政権下での政治的安定と引き換えに進行した経済の停滞は、後に『停滞の時代』と呼ばれ、ゴルバチョフによる抜本的改革(ペレストロイカ)の必要性を生む直接の背景となった。',
      debate:'対外的な緊張緩和という功績を評価する見方がある一方、国内の構造改革を先送りし続けたその統治スタイルが、結果的にソ連経済の長期的な競争力低下を決定づけたとする批判的評価が、体制崩壊後には特に強まっている。'
    } },
  { id:'gorbachev', name:'ゴルバチョフ', category:'person', lat:55.75, lng:37.62, start:1931, end:2022, region:'ソビエト連邦', parentId:'ussr',
    desc:{
      background:'『停滞の時代』を経て深刻化していた経済の非効率性と技術的立ち遅れ(特に軍事・情報技術面での対米劣勢)への強い危機感が、抜本的改革に着手する動機となった。',
      process:'情報公開(グラスノスチ)による言論統制の緩和と経済改革(ペレストロイカ)を並行して推進し、対外的には軍縮・冷戦終結に大きく貢献したが、統制緩和が抑圧されてきた民族対立や共和国の独立要求を一気に噴出させる結果を招き、保守派によるクーデタ未遂を経て自身も求心力を失い、ソ連解体とともに退陣した。',
      significance:'その改革は冷戦という20世紀後半の国際秩序を平和裏に終結させる歴史的功績を残した一方、意図せずしてソ連という国家そのものの解体を招くという逆説的な結果に至った。',
      debate:'彼を『冷戦を終わらせた偉大な改革者』として西側で高く評価する見方と、ロシア国内では『大国ソ連を崩壊させた責任者』として否定的に評価する見方が鋭く対立しており、この評価の落差自体が現代ロシアの自己認識を考える上で興味深い論点となっている。'
    } },
  { id:'perestroika_glasnost', name:'ペレストロイカとグラスノスチ', category:'event', lat:55.75, lng:37.62, start:1985, end:1991, region:'ソビエト連邦',
    desc:{
      background:'計画経済の慢性的な非効率性と、情報統制による社会の閉塞感が、ゴルバチョフをして経済再建と言論の自由化という二正面の改革に踏み切らせた背景にある。',
      process:'情報公開により従来タブー視されてきたスターリン時代の暗部や現体制の問題点への言及が可能になる一方、経済改革は既得権益層の抵抗や制度設計の不備により十分な成果を上げられず、統制緩和がむしろ各共和国の民族主義的独立要求や経済的混乱を加速させる結果となった。',
      significance:'この改革は東欧革命(諸国の民主化)を可能にした思想的・政治的環境を提供する一方、当初の意図(社会主義の枠内での再生)を超えてソ連自体の解体という予期せぬ結末を招いた。',
      debate:'改革の『失敗』の要因について、経済改革の設計・実行における技術的不備を重視する見方と、政治的自由化と経済改革を同時並行で急速に進めたこと自体に無理があったとする見方(中国の漸進的改革との対比で論じられることが多い)とがある。'
    } },
  { id:'russian_federation', name:'ロシア連邦', category:'nation', lat:55.75, lng:37.62, start:1991, end:2000, region:'ロシア',
    desc:{
      background:'ソ連解体という未曾有の国家的変動の中、共産党一党支配・計画経済という旧体制の枠組みを一挙に転換する必要に迫られたことが、この新国家の困難な出発点である。',
      process:'エリツィン政権のもとで『ショック療法』と呼ばれる急進的な価格自由化・民営化を断行したが、これに伴うハイパーインフレ・国有資産の少数の新興財閥(オリガルヒ)への集中、社会保障の崩壊などが深刻な混乱と貧富格差の拡大を招いた。',
      significance:'この移行期の混乱は、市場経済への移行が必ずしも自動的に繁栄をもたらすわけではないことを示す重要な事例として、以後の他の旧社会主義国の移行政策にも教訓を残した。',
      debate:'急進的な『ショック療法』を市場経済移行のための必要な痛みとみるか、制度的準備を欠いた拙速な改革が不必要な混乱と格差を招いたとみるかは、比較経済移行論における重要な論争点となっている。'
    } },
  { id:'yeltsin', name:'エリツィン', category:'person', lat:55.75, lng:37.62, start:1931, end:2007, region:'ロシア連邦', parentId:'russian_federation',
    desc:{
      background:'ゴルバチョフ体制内での急進改革派としての立場から次第に対立を深め、ロシア共和国(ソ連内の一共和国)の指導者としての独自の権力基盤を築いたことが、ソ連解体を主導する背景となった。',
      process:'1991年の保守派クーデタ未遂に際し戦車の上で抵抗を呼びかけて国民的英雄となり、その後ゴルバチョフに代わる実権を握ってソ連解体・ロシア連邦樹立を主導し、急進的な市場経済移行策を進めたが、経済混乱やチェチェン紛争の泥沼化にも直面し、支持率低下の中で世紀末に後継者プーチンへ大統領職を譲って引退した。',
      significance:'ソ連解体という20世紀最大級の地政学的変動を(比較的平和裏に)主導した政治家として記憶される一方、その後の経済的混乱・国家機能の弱体化への責任も強く問われ続けている。',
      debate:'彼を『ロシアに民主主義と市場経済をもたらした改革者』と評価する見方と、『国家の弱体化と混乱・格差拡大を招いた失政の責任者』と評価する見方は、現代ロシアにおける彼の評価を大きく分ける対立軸であり続けている。'
    } },

  { id:'venice_republic', name:'ヴェネツィア共和国', category:'nation', lat:45.44, lng:12.34, start:697, end:1797, region:'イタリア北東部(ヴェネツィア)',

  { id:'genoa_republic', name:'ジェノヴァ共和国', category:'nation', lat:44.41, lng:8.93, start:1005, end:1797, region:'イタリア北西部(ジェノヴァ)',

  { id:'florence_republic', name:'フィレンツェ共和国', category:'nation', lat:43.77, lng:11.26, start:1115, end:1532, region:'イタリア中部(フィレンツェ)',
    desc:{

    } },
  { id:'papal_states', name:'教皇領', category:'nation', lat:41.9, lng:12.49, start:754, end:1870, region:'イタリア中部(ローマ中心)',
    desc:{
      background:'ビザンツの影響力後退という権力の空白の中、ローマ教皇がフランク王ピピンの軍事的保護と引き換えに世俗的な統治権を認められたことが、この国家成立の背景にある。',
      process:'教皇が宗教的権威と世俗的統治権を併せ持つ特異な国家として長く存続し、時にルネサンス期教皇(ユリウス2世ら)のもとで軍事・外交にも積極的に関与したが、19世紀のイタリア統一運動の中で徐々に領土を失い、1870年のローマ占領により完全に消滅した。',

      debate:'宗教的権威者が同時に世俗的な領土国家の統治者を兼ねるという構造そのものが、政教関係のあり方として近代国家形成の観点からどう評価されるべきかは、政教分離論における重要な考察対象であり続けている。'
    } },
  { id:'duchy_milan', name:'ミラノ公国', category:'nation', lat:45.46, lng:9.19, start:1395, end:1535, region:'イタリア北部(ミラノ)',

  { id:'kingdom_sicily', name:'シチリア王国(両シチリア王国)', category:'nation', lat:38.12, lng:13.36, start:1130, end:1816, region:'イタリア南部・シチリア島',

      process:'ノルマン人ルッジェーロ2世による統一王国樹立後、ホーエンシュタウフェン家(フリードリヒ2世)、アンジュー家、アラゴン家と支配者が変遷し、最終的に1816年に両シチリア王国として再編されたが、イタリア統一の過程でガリバルディの征服を受け消滅した。',
      significance:'多文化融合的な宮廷文化(特にフリードリヒ2世期)は中世地中海世界における文化的橋渡しの重要な事例として、後のヨーロッパの学術発展にも影響を与えた。',
      debate:'この王国の統治文化がイタリア北部とは大きく異なる発展径路をたどったことは、後のイタリア統一における南北間の深い経済的・文化的格差(南部問題)の歴史的起源として重視される。'
    } },
  { id:'roger_ii_sicily', name:'ルッジェーロ2世', category:'person', lat:38.12, lng:13.36, start:1095, end:1154, region:'シチリア王国', parentId:'kingdom_sicily',
    desc:{
      background:'ノルマン人の軍事的征服者としての一族の伝統を継承しつつ、征服地の多様な先住文化(アラブ・ビザンツ)を排除せず活用する統治方針を選んだことが、その独自の王国形成の背景にある。',
      process:'シチリア島とイタリア南部を統合して強力な中央集権的王国を築き、アラブ人官僚・ビザンツ的儀礼・ラテン的封建制を組み合わせた独自の統治機構を整備し、パレルモの宮廷に多言語・多文化の学者を集めた。',
      significance:'その寛容で洗練された宮廷文化は、当時の西欧では類を見ない多文化共存のモデルとして、地中海世界における文化交流の重要な結節点としての役割を果たした。',
      debate:'この『寛容』な統治を、実際の政治的必要性(少数派征服者による多数派統治の現実的手法)に基づくものとみるか、真に先進的な多文化主義の理念に基づくものとみるかについては慎重な検討が必要とされる。'
    } },
  { id:'battle_legnano', name:'レニャーノの戦い', category:'war', lat:45.6, lng:8.92, start:1176, end:1176, region:'イタリア北部(レニャーノ)',
    desc:{
      background:'神聖ローマ皇帝フリードリヒ1世(バルバロッサ)による北イタリア諸都市への統制強化策が、都市の自治的な経済的利益を脅かすものとして強い反発を招いたことが対立の背景にある。',
      process:'ミラノを中心とする北イタリア諸都市がロンバルディア同盟を結成して連携し、機動力に劣る皇帝の重装騎兵に対し都市民兵が組織的な戦術で対抗し、皇帝軍に決定的な敗北を与えた。',
      significance:'この勝利により北イタリア諸都市は事実上の自治(コムーネとしての独立性)を確保し、皇帝権のイタリア政策全体に大きな打撃を与える結果となった。',
      debate:'都市民兵が伝統的な封建騎士軍に勝利したこの事例は、中世軍事史における歩兵戦術の重要性の高まりを示す先駆的事例として、後の百年戦争などとも比較されつつ論じられる。'
    } },
  { id:'dante_alighieri', name:'ダンテ', category:'person', lat:43.77, lng:11.26, start:1265, end:1321, region:'フィレンツェ',
    desc:{
      background:'フィレンツェの政争(教皇派内の白党・黒党の対立)に巻き込まれ追放処分を受けた経験が、故郷への望郷の念と政治・道徳への深い洞察を込めた大作執筆の動機となった。',
      process:'亡命生活の中で、地獄・煉獄・天国を巡る壮大な旅を描く『神曲』を、当時の学術的共通語であったラテン語ではなくあえてトスカーナ方言(俗語)で著した。',
      significance:'俗語による高度な文学作品の成立は、その後のイタリア語の標準語としての地位確立と、ヨーロッパ各国語による国民文学発展の先駆けとなる画期的な出来事であった。',
      debate:'政敵への痛烈な批判を地獄篇の中に織り込むなど、この作品が持つ同時代の政治的文脈(党派対立)をどこまで重視して読み解くべきかは、文学研究における論点の一つである。'
    } },
  { id:'petrarch', name:'ペトラルカ', category:'person', lat:43.77, lng:11.26, start:1304, end:1374, region:'イタリア(フィレンツェ出身)',
    desc:{
      background:'教皇庁のアヴィニョン移転期に育った経験から、古代ローマの栄光との対比で当時の教会・社会の『暗さ』を強く意識したことが、古典復興への情熱の背景にあるとされる。',
      process:'各地の修道院図書館を巡り忘れられていた古代ローマの文献(キケロの書簡など)を発掘・研究し、ラテン詩人としての名声も確立しつつ、人間性の探究を重視する学問(人文主義、ストゥディア・フマニターティス)の方法論を確立した。',
      significance:'古代を模範としつつ人間中心の価値観を追求するその姿勢は、後のイタリア・ルネサンス全体の思想的・方法論的基盤を用意し、『ルネサンスの父』と称される所以となった。',
      debate:'彼自身は中世的なキリスト教的価値観と古典古代への憧憬との間で終生葛藤を抱えていたとされ、『中世から近世への過渡的人物』としての性格をどう評価するかは議論の対象となる。'
    } },
  { id:'boccaccio', name:'ボッカチォ', category:'person', lat:43.77, lng:11.26, start:1313, end:1375, region:'フィレンツェ',
    desc:{
      background:'黒死病がフィレンツェを含むヨーロッパ全土を襲い、既存の社会秩序・価値観が大きく動揺していた時代状況が、この作品の設定・題材の背景にある。',
      process:'疫病を逃れて郊外に避難した男女10人が10日間にわたり物語を語り合うという枠組みのもと、聖職者の偽善や男女の機知に富んだ駆け引きなど、世俗的で赤裸々な人間模様を100編の短編に描いた。',
      significance:'教会的道徳観にとらわれない人間の欲望・機知を生き生きと肯定的に描いたその筆致は、後のヨーロッパ短編小説(シェイクスピア、チョーサーらにも影響)の重要な源流の一つとなった。',
      debate:'この作品における聖職者への辛辣な風刺は、当時の教会腐敗への社会的批判の高まりを反映しているとみる文学史的解釈と、単なる娯楽的な語りの技巧として捉える解釈とがある。'
    } },
  { id:'cosimo_medici', name:'コジモ=デ=メディチ', category:'person', lat:43.77, lng:11.26, start:1389, end:1464, region:'フィレンツェ', parentId:'medici',
    desc:{
      background:'父祖から受け継いだ銀行業(メディチ銀行)を教皇庁の財務管理にまで拡大したことが、莫大な富とそれに伴う政治的影響力獲得の直接の背景にある。',
      process:'公職には就かず陰から政治を操る手法(『黒幕』としての統治)により事実上の支配者としての地位を確立し、プラトン・アカデミーの設立支援や写本収集など、学芸への手厚い庇護を通じてルネサンス文化の発展を後押しした。',
      significance:'その統治手法(表向きは共和政の体裁を保ちつつ実権を握る)と文化的パトロネージのモデルは、以後のメディチ家の支配、さらには近世イタリアにおける権力と文化の結びつき方の原型となった。',
      debate:'公式の官職に就かず『陰の実力者』として振る舞ったその統治スタイルは、共和政の伝統的価値観との緊張関係を巧みに回避する狡猾な政治手法として評価される一方、実質的な民主的正統性を欠くものとの批判もある。'
    } },
  { id:'lorenzo_medici', name:'ロレンツォ=デ=メディチ(豪華王)', category:'person', lat:43.77, lng:11.26, start:1449, end:1492, region:'フィレンツェ', parentId:'medici',
    desc:{
      background:'祖父コジモが築いた政治的基盤と財力を継承し、若くしてフィレンツェの実質的指導者としての地位を確立したことが、その文化的絶頂期を築く背景となった。',
      process:'パッツィ家による暗殺未遂(パッツィ家の陰謀)を生き延びて権力基盤を固め、ボッティチェリ・ミケランジェロら当代随一の芸術家を庇護し、詩人としても自ら創作活動を行うなど、政治と文化の両面で卓越した指導力を発揮した。',
      significance:'彼の治世はフィレンツェ・ルネサンスの絶頂期として記憶され、諸国間の外交バランサーとしても機能し、イタリア半島における一定期間の平和維持にも貢献した。',
      debate:'その死後まもなくフィレンツェがサヴォナローラの神権政治的支配やメディチ家の一時追放という混乱に見舞われたことは、彼個人の傑出した資質に依存した安定がいかに脆いものであったかを示す事例とされる。'
    } },
  { id:'savonarola', name:'サヴォナローラ', category:'person', lat:43.77, lng:11.26, start:1452, end:1498, region:'フィレンツェ',
    desc:{
      background:'ロレンツォ豪華王の死後のフィレンツェにおける政治的空白と、当時の教会・社会の世俗化・退廃への広範な不満が、この急進的な宗教指導者への支持拡大の背景にある。',
      process:'説教により民衆を熱狂させて事実上の政治的実権を握り、贅沢品・美術品・書物を焼却する『虚栄の焼却』などの神権政治的統治を敷いたが、教皇アレクサンデル6世との対立から破門され、民衆の支持を失う中で捕らえられ火刑に処された。',
      significance:'その急進的な宗教改革的主張(教会腐敗批判)は、後のルターらによる宗教改革運動を先取りする性格を持つとして、しばしばその先駆者の一人として位置づけられる。',
      debate:'熱狂的な支持を集めた後に一転して処刑されるまでの急激な民衆感情の変化は、扇動的なカリスマ的指導者への支持がいかに移ろいやすいものであるかを示す政治学的な事例としても論じられる。'
    } },
  { id:'cesare_borgia', name:'チェーザレ=ボルジア', category:'person', lat:41.9, lng:12.49, start:1475, end:1507, region:'イタリア(教皇領)',
    desc:{
      background:'教皇である父アレクサンデル6世の権力・資金を背景に、聖職者としてのキャリアを放棄してでも武力による領土拡大を志向したことが、その野心的な行動の背景にある。',
      process:'フランス王の支援も得ながら中部イタリア各地の小領主を武力・謀略で次々に制圧し一時的な支配圏(ロマーニャ公国)を築いたが、父の死により後ろ盾を失うと急速に勢力を失い、最終的にスペインでの戦闘中に落命した。',
      significance:'その大胆かつ非情な統治手法は、マキァヴェリが『君主論』において目的達成のための効果的な行動様式(状況に応じた徳と非情さの使い分け)の実例として取り上げたことで、後世に大きな知的影響を残した。',
      debate:'マキァヴェリによる肯定的な取り上げ方に対し、実際の彼の統治は残虐かつ短命であり、真に『理想的な君主』のモデルとして適切であったかについては当初から異論もある。'
    } },
  { id:'machiavelli', name:'マキァヴェリ', category:'person', lat:43.77, lng:11.26, start:1469, end:1527, region:'フィレンツェ',
    desc:{
      background:'フィレンツェ共和政の外交官としての実務経験を通じ、理想主義的な統治論では現実の権力政治(特にイタリアの政治的混乱)を説明・対処しきれないという実感を強めたことが、その思想形成の背景にある。',
      process:'メディチ家復権後に公職を追われ隠棲を余儀なくされる中、チェーザレ・ボルジアら実在の統治者の観察に基づき、道徳や宗教的理想よりも権力の実効的な獲得・維持を重視する現実主義的な統治論を『君主論』にまとめた。',
      significance:'『目的が手段を正当化する』式の権力観は近代政治学における現実主義(リアリズム)の源流とされ、『マキャヴェリズム』という言葉が今日でも権謀術数的な政治手法を指す語として広く用いられている。',
      debate:'『君主論』が本気で専制君主の統治術を説いたものか、あるいは裏面で共和主義的な自由の重要性を逆説的に訴える風刺・警告の書であったのかについては、彼の他の著作(『ローマ史論』の共和主義的傾向)との整合性をめぐり研究者の間で解釈が分かれている。'
    } },
  { id:'botticelli', name:'ボッティチェリ', category:'person', lat:43.77, lng:11.26, start:1445, end:1510, region:'フィレンツェ',
    desc:{
      background:'メディチ家の庇護のもと、フィレンツェの新プラトン主義的な人文主義サークルとの交流を通じ、古代ギリシア神話を主題とする新たな絵画表現への関心を深めたことが作風形成の背景にある。',
      process:'『ヴィーナスの誕生』『春』などでギリシア神話の主題を優美な曲線と装飾的な線描で表現し、フィレンツェ・ルネサンス絵画に新たな地平を開いたが、晩年はサヴォナローラの禁欲的な説教に影響され作風・活動を大きく変化させた。',
      significance:'その優美で詩的な作風は盛期ルネサンス絵画(レオナルドらのより写実的で立体的な表現)への過渡的な橋渡しとして、西洋美術史上重要な位置を占めている。',
      debate:'晩年の作風の劇的な変化(サヴォナローラへの傾倒と世俗的主題からの離反)をどう評価するかは、芸術家の信仰と創作活動の関係を考える上で興味深い論点となっている。'
    } },
  { id:'michelangelo', name:'ミケランジェロ', category:'person', lat:43.77, lng:11.26, start:1475, end:1564, region:'フィレンツェ・ローマ',
    desc:{
      background:'メディチ家の庇護のもとで彫刻家としての早熟な才能を開花させ、自らを何よりも彫刻家であると強く自認していたことが、後の多分野にわたる活動との緊張関係の背景にある。',
      process:'『ダヴィデ像』で彫刻家としての名声を確立した後、教皇ユリウス2世の強い要請によりシスティーナ礼拝堂天井画を単独でほぼ完成させ、晩年にはサン・ピエトロ大聖堂の設計にも携わるなど、彫刻・絵画・建築の全分野で不朽の業績を残した。',
      significance:'その卓越した人体表現と精神的深みを湛えた作風は、盛期ルネサンスからマニエリスムへの移行を準備し、後の西洋美術全体に計り知れない影響を及ぼした。',
      debate:'本人は絵画よりも彫刻を至高の芸術とみなしていたにもかかわらず、後世には『最後の審判』などの絵画作品でこそ最も広く知られているという事実は、芸術家の自己認識と後世の評価との興味深い乖離を示している。'
    } },
  { id:'raphael', name:'ラファエロ', category:'person', lat:41.9, lng:12.49, start:1483, end:1520, region:'ローマ(出身ウルビーノ)',
    desc:{
      background:'父から絵画の手ほどきを受けた後、ペルジーノらに師事しフィレンツェでレオナルド・ミケランジェロら先達の技法を貪欲に吸収したことが、その早熟な様式的完成の背景にある。',
      process:'教皇ユリウス2世に招かれてヴァチカン宮殿の壁画装飾(『アテネの学堂』など)を手がけ、古代ギリシアの哲学者たちを理想化して描くことで人文主義的な調和と均整の美を視覚的に結晶化させたが、37歳の若さで急逝した。',
      significance:'その調和的で均整の取れた画風は『古典的』な美の規範として、以後の西洋アカデミー絵画教育における長期にわたる模範であり続けた。',
      debate:'早逝により作品数が限られる一方、工房における弟子たちの分業体制が確立されていたため、『真筆』と『工房作』の区別をめぐる美術史的な鑑定議論が今なお続いている作品も少なくない。'
    } },
  { id:'pope_julius_ii', name:'教皇ユリウス2世', category:'person', lat:41.9, lng:12.49, start:1443, end:1513, region:'教皇領', parentId:'papal_states',
    desc:{
      background:'教皇領の世俗的な領土・権威が周辺諸国(フランス・ヴェネツィアなど)の圧力にさらされていたことが、軍事・外交面で積極的に行動する『戦う教皇』としての姿勢の背景にある。',
      process:'自ら甲冑をまとい軍を率いて教皇領の失地回復に奔走する一方、老朽化した旧サン・ピエトロ大聖堂の再建に着手し、ミケランジェロ・ラファエロら当代随一の芸術家を教皇庁に招いて壮大な芸術事業を推進した。',
      significance:'その芸術的パトロネージによりヴァチカンは盛期ルネサンス美術の一大中心地となり、現在に至るまで西洋美術史上最重要の作品群を生み出す舞台となった。',
      debate:'聖職者でありながら自ら戦場に赴くその『好戦的』な性格は、宗教的指導者としての教皇職のあり方への同時代からの批判(エラスムスの風刺など)を招き、宗教改革前夜の教会腐敗批判の一つの標的ともなった。'
    } },
  { id:'napoleonic_kingdom_italy', name:'イタリア王国(ナポレオン期)', category:'nation', lat:45.46, lng:9.19, start:1805, end:1814, region:'イタリア北部(ミラノ)',
    desc:{
      background:'イタリア遠征以来のナポレオンの北イタリアにおける軍事的成功が、この地に自らを頂点とする衛星国家を樹立する政治的基盤となった。',
      process:'ナポレオン自らが王位を兼ね、フランス式の民法典・行政区分・徴兵制度をイタリアに導入し、旧来の身分制的特権を廃する近代的な統治改革を進めたが、ナポレオン没落とともに解体しウィーン体制下で旧秩序に近い状態に再編された。',
      significance:'この統治期間に導入された近代的な法制度・行政経験と、フランス式の統一的行政区分の実践は、意図せずして半世紀後のイタリア統一運動(リソルジメント)を準備する制度的・思想的素地の一つとなった。',
      debate:'『外国の傀儡国家』としての性格を強調する見方と、イタリアに近代的な国家統治の実地経験をもたらした『近代化の先駆』としての側面を重視する見方との間で評価が分かれる。'
    } },
  { id:'kingdom_sardinia_piedmont', name:'サルデーニャ王国(ピエモンテ)', category:'nation', lat:45.07, lng:7.69, start:1720, end:1861, region:'イタリア北西部(トリノ)・サルデーニャ島',
    desc:{
      background:'イタリア諸国の中で唯一外国の直接支配を免れ独立を保ち続けたサヴォイア家の統治が、後のイタリア統一運動における『核』としての正統性を備える背景となった。',
      process:'ウィーン会議後は反動的な王政が続いたが、1848年革命の際にカルロ・アルベルトが自由主義的な憲法(アルベルト憲章)を発布し、その子ヴィットーリオ=エマヌエーレ2世のもとでカヴールが近代化改革と巧みな外交を展開して統一事業を主導した。',

      debate:'統一が『サルデーニャによる他地域の吸収』に近い性格を持っていたことは、統一後もなお残る地域間(特に南北間)の格差・不満の歴史的背景として指摘されることが多い。'

  { id:'mazzini', name:'マッツィーニ', category:'person', lat:45.46, lng:9.19, start:1805, end:1872, region:'イタリア',
    desc:{
      background:'カルボナリ(秘密結社)運動への参加とその挫折の経験が、より組織的で理念的に一貫した統一運動(共和主義に基づく国民国家建設)を志向する動機となった。',
      process:'亡命先で『青年イタリア』を組織して共和主義的な統一運動を各地で扇動したが、複数回試みた武装蜂起はいずれも失敗に終わり、自らの理想(共和政)が実現することのないまま、統一はカヴールら現実主義的路線によって君主政のもとで達成された。',

      debate:'理想主義的な扇動家としての彼と、現実主義的な外交手腕でこれを実現に導いたカヴールとの対比は、社会運動における『理念』と『実務』の相補的な関係を考える好例としてしばしば言及される。'
    } },
  { id:'young_italy_movement', name:'青年イタリア(ジョーヴィネ・イタリア)', category:'event', lat:44.41, lng:8.93, start:1831, end:1848, region:'イタリア',
    desc:{
      background:'ウィーン体制下での分裂・抑圧的統治への不満が、より若い世代による急進的かつ理念的に純化された統一運動組織の結成を促した背景にある。',
      process:'各地の若者を糾合して共和主義に基づくイタリア統一を掲げ複数回の武装蜂起を試みたが、いずれも組織力・軍事力の不足から早期に鎮圧された。',

      debate:'軍事的には無力であったこの運動が、なぜイタリア統一史において重要な位置を占め続けるのかについては、直接的な政治的成果よりも理念・世論形成における長期的影響力を重視する評価が一般的である。'
    } },
  { id:'carlo_alberto', name:'カルロ=アルベルト', category:'person', lat:45.07, lng:7.69, start:1798, end:1849, region:'サルデーニャ王国', parentId:'kingdom_sardinia_piedmont',
    desc:{
      background:'1848年革命の全欧的な高まりの中、イタリア統一・独立への機運が最高潮に達し、これに応える形での対オーストリア開戦への国内世論の圧力が強まったことが背景にある。',
      process:'自由主義的な憲法(アルベルト憲章)を発布して国内の支持を集めた上でオーストリアに独立戦争を仕掛けたが、軍事的に劣勢な状況を覆せずクストーツァ・ノヴァーラの戦いで大敗し、責任をとって退位した。',

      debate:'戦争そのものは惨敗に終わったが、その後のカヴール主導の統一路線がこの憲法という制度的枠組みの上に築かれたことを踏まえ、彼の挑戦を『無謀な失敗』ではなく統一への重要な布石として再評価する見方もある。'
    } },
  { id:'cavour', name:'カヴール', category:'person', lat:45.07, lng:7.69, start:1810, end:1861, region:'サルデーニャ王国', parentId:'kingdom_sardinia_piedmont',
    desc:{
      background:'英仏での見聞を通じて自由主義的な議会政治・経済発展のモデルを学び、これをサルデーニャ王国の近代化に応用しようとしたことが、その現実主義的な統一戦略の思想的背景にある。',
      process:'クリミア戦争への参戦を通じてイギリス・フランスとの外交関係を築き、フランスとの密約(プロンビエール密約)によりオーストリアとの戦争を誘発してロンバルディアを獲得し、ガリバルディの征服成果も巧みに取り込んで統一を実現させたが、統一直後に急死した。',

    } },
  { id:'garibaldi', name:'ガリバルディ', category:'person', lat:38.12, lng:13.36, start:1807, end:1882, region:'イタリア',
    desc:{
      background:'南米での軍事経験を経て帰国し、マッツィーニの共和主義的理念に共鳴しつつも、実際の統一達成のためには現実的な妥協(君主政の受け入れ)も辞さない柔軟性を備えていたことが、その行動の背景にある。',
      process:'わずか約1000人の義勇兵『赤シャツ隊』を率いてシチリア・ナポリの両シチリア王国を征服するという劇的な軍事的成功を収め、自らの共和主義的信条よりも国家統一を優先し、征服した広大な領土をサルデーニャ王ヴィットーリオ=エマヌエーレ2世に無条件で献上した。',
      significance:'この私心のない献上行為により南北イタリアの統合が一気に実現し、彼は『両世界の英雄』としてイタリア国民統合の象徴的存在となった。',
      debate:'共和主義者でありながら王政のもとでの統一を受け入れたその決断は、個人の理念よりも国家統一という大義を優先した『自己犠牲』とみるか、時勢を読んだ現実的判断とみるかで解釈が分かれる。'
    } },
  { id:'expedition_of_thousand', name:'千人隊の遠征', category:'war', lat:38.12, lng:13.36, start:1860, end:1860, region:'イタリア南部・シチリア島',
    desc:{
      background:'シチリア島での反ブルボン朝(両シチリア王国)蜂起の情報が、かねてから南部征服の機会をうかがっていたガリバルディに行動を起こす好機を与えたことが遠征の背景にある。',
      process:'少数の義勇兵で圧倒的多数のブルボン朝正規軍を相手に各地で勝利を重ね、現地民衆の支持も取り込みながら急速にシチリア・ナポリ全土を制圧し、住民投票を経て征服地をサルデーニャ王国への編入を決定させた。',
      significance:'この電撃的な征服成功は、外交交渉を主体としていたカヴールの統一戦略に軍事的成果を一気に付け加え、南北イタリアの統合を予想以上の速さで実現させる決定的な契機となった。',
      debate:'この征服が南部住民の自発的な支持に基づくものであったのか、それとも外部からの軍事征服という性格が強かったのかは、統一後長く続く南部の経済的疎外感(南部問題)の起源を考える上で重要な論点である。'
    } },
  { id:'victor_emmanuel_ii', name:'ヴィットーリオ=エマヌエーレ2世', category:'person', lat:45.07, lng:7.69, start:1820, end:1878, region:'サルデーニャ王国→イタリア王国', parentId:'kingdom_of_italy',
    desc:{
      background:'父カルロ・アルベルトの退位を受けて即位し、敗戦の混乱の中でも自由主義的な憲法(アルベルト憲章)を維持し続けたことが、後の統一事業における立憲的正統性の背景となった。',
      process:'カヴールを首相に登用してその現実主義的な統一戦略を全面的に支持し、ガリバルディが献上した南イタリアの領土も受け入れて、1861年にイタリア王国初代国王として即位した。',
      significance:'有能な家臣(カヴール)を信頼し統一事業の実権を委ねつつ、自らは国民統合の象徴的中心としての役割を果たしたことで、『祖国の父』として国民的な敬愛を集める存在となった。',
      debate:'統一の実質的な立役者はカヴール・ガリバルディであったにもかかわらず、国王個人が『祖国の父』として最も称えられる存在となった経緯は、国民国家形成における君主制の象徴的機能の重要性を考えさせる事例である。'

  { id:'kingdom_of_italy', name:'イタリア王国', category:'nation', lat:41.9, lng:12.49, start:1861, end:1946, region:'イタリア',
    desc:{
      background:'サルデーニャ王国を中心とする一連の統一戦争・外交・軍事行動の積み重ねが、この新王国樹立の直接的な背景となった。',
      process:'1861年の建国後もヴェネト(普墺戦争の副産物として獲得)・ローマ(普仏戦争の混乱に乗じて占領)という『未回収のイタリア』の編入を進めて統一を完成させたが、南北間の経済格差や教皇との対立(ローマ問題)という課題を抱え続け、ファシズムの台頭・第二次世界大戦の敗北を経て王政は国民投票により廃止された。',

      debate:'統一を『リソルジメント(復興)』という理念的達成として肯定的に評価する伝統的な国民史観に対し、実際には北部主導の性急な制度統合が南部社会の実情を無視したものであったとする批判的な南部史観との間で、評価は今なお分かれている。'
    } },
  { id:'capture_of_rome_1870', name:'ローマ占領(ポルタ=ピア占領)', category:'event', lat:41.9, lng:12.49, start:1870, end:1870, region:'ローマ',
    desc:{
      background:'普仏戦争の勃発によりローマを守っていたフランス軍が撤退を余儀なくされたことが、イタリア王国にとって念願のローマ占領の好機となった。',

    } },
  { id:'mussolini', name:'ムッソリーニ', category:'person', lat:41.9, lng:12.49, start:1883, end:1945, region:'イタリア(ファシスト政権)', parentId:'fascist_italy',
    desc:{
      background:'第一次世界大戦後のイタリアにおける深刻な経済的混乱と、『瀕死の勝利(戦勝国でありながら得るものが少なかったという不満)』に基づく社会不安が、彼の急進的な政治運動への支持拡大の背景にある。',
      process:'ファシスト党を組織して武装した黒シャツ隊を用いた威嚇・暴力行為を展開し、『ローマ進軍』により国王を恫喝して首相の座を得た後、選挙制度改変・言論統制を通じて急速に独裁体制(ドゥーチェ=統領としての全体主義体制)を確立し、エチオピア侵攻・ドイツとの枢軸形成を経て第二次世界大戦に参戦したが、戦況悪化の中で失脚し、最終的にパルチザンに処刑された。',
      significance:'『ファシズム』という言葉と統治手法(国家と党の一体化、大衆動員、暴力による反対派抑圧)の原型を確立し、以後の世界各地の全体主義運動に大きな影響を与えるモデルとなった。',
      debate:'当初のイタリア国内での一定の経済的実績(『列車を時間通りに走らせた』という俗説を含む)を重視する評価と、その暴力的統治手法・侵略戦争・人種法制定などの負の側面を重視する評価との間で、彼の統治の総合評価は大きく分かれ続けている。'
    } },
  { id:'march_on_rome', name:'ローマ進軍', category:'event', lat:41.9, lng:12.49, start:1922, end:1922, region:'イタリア',
    desc:{
      background:'議会政治の機能不全と社会主義勢力の伸長への中産階級・資本家層の強い危機感が、ファシスト党への実質的な支持・黙認を広げていたことが、この示威行動を成功させる背景となった。',
      process:'ファシスト党員数万人がローマへ向けて武装示威行進を行い、国王ヴィットーリオ=エマヌエーレ3世が戒厳令発令をためらったことで、ムッソリーニは合法的な手続き(首相任命)を通じて事実上のクーデタに近い形で政権を掌握した。',

      debate:'実際の行進参加者の実力・組織力は限定的であり、国王側の弱腰な対応(軍を用いた鎮圧の回避)こそがこの権力移行を可能にした決定的要因であったとする見方が近年の研究では重視されている。'
    } },
  { id:'fascist_italy', name:'ファシスト政権下のイタリア', category:'nation', lat:41.9, lng:12.49, start:1922, end:1943, region:'イタリア',
    desc:{
      background:'議会制民主主義の混乱と共産主義への恐怖という戦間期イタリア特有の社会状況が、一党独裁体制の確立とその一定期間の存続を可能にした背景にある。',
      process:'国王を形式的な元首として残しつつムッソリーニが実質的な独裁権を握り、コルポラティズム(職能団体を通じた統制経済)や大衆動員機関を通じて社会全体を統制し、対外的にはエチオピア侵攻・スペイン内戦介入・ドイツとの枢軸形成を経て第二次世界大戦に参戦したが、連合軍のシチリア上陸を機に国王がムッソリーニを解任し体制は崩壊した。',

      debate:'ナチズムと比較した際のイタリア・ファシズムの『穏健さ』(人種法の適用の一貫性のなさ、体制内部の多元性の残存)を指摘する見方は、全体主義の類型論において重要な比較の視点を提供している。'
    } },
  { id:'lateran_treaty', name:'ラテラノ条約', category:'treaty', lat:41.9, lng:12.49, start:1929, end:1929, region:'イタリア(ローマ)',
    desc:{
      background:'1870年のローマ占領以来約60年にわたり未解決であった教皇と国家の対立(ローマ問題)を、自らの体制の国民的・国際的正統性強化に利用しようとするムッソリーニの思惑が、この協定締結の背景にある。',
      process:'教皇の世俗的権威をヴァチカン市国という小規模な独立国家内に限定することを教皇庁に受け入れさせる代わりに、カトリックをイタリアの国教として認め、教会に一定の財政的補償と特権(宗教教育の必須化など)を与える形で妥協が成立した。',

      debate:'この和解を『ローマ問題の合理的解決』として肯定的に評価する見方がある一方、独裁体制が宗教的権威との取引によって自らの正統性を補強したという側面を重視し、教会の政治的妥協としての性格を批判的に捉える見方もある。'
    } },
  { id:'italian_social_republic', name:'イタリア社会共和国(サロ共和国)', category:'nation', lat:45.6, lng:10.6, start:1943, end:1945, region:'イタリア北部(サロ)',
    desc:{
      background:'連合軍のシチリア上陸を機に国王がムッソリーニを解任・逮捕し、イタリアが連合国側との休戦交渉に転じたことに対し、ドイツがこれに反発してムッソリーニを救出・擁立したことが、この傀儡国家樹立の直接的背景である。',
      process:'ドイツ占領下の北イタリアに樹立され、形式的には『共和政』を掲げたが実権はドイツ占領軍が握り、パルチザン(反ファシズム抵抗運動)の激しい抵抗と連合軍の進撃に押されて短期間のうちに崩壊し、ムッソリーニ自身もパルチザンに捕らえられ処刑された。',
      significance:'この末期的な傀儡国家の存在は、イタリア国内における対独協力(ファシスト残存勢力)とレジスタンス運動(パルチザン)という深刻な内部分裂を象徴し、戦後のイタリア社会における『内戦』的な記憶の複雑さを残した。',
      debate:'この時期のパルチザン運動の評価(戦後イタリア共和国建国の精神的基盤とする見方)をめぐっては、イタリア国内で今日に至るまで政治的立場によって解釈が分かれる敏感な歴史認識問題となっている。'
    } },
  { id:'italian_referendum_1946', name:'イタリア王政廃止国民投票', category:'event', lat:41.9, lng:12.49, start:1946, end:1946, region:'イタリア',
    desc:{
      background:'ファシズム体制を20年以上にわたり容認し続けた王政の戦争責任への国民的な不信が、この国民投票実施の政治的背景にある。',
      process:'共和政支持と君主政維持の是非を問う国民投票が実施され、南部で君主政支持が優勢であったのに対し北部で共和政支持が圧倒的であるなど地域差を見せつつ、僅差で共和政支持が上回った。',
      significance:'この結果を受けてサヴォイア王家(最後の国王ウンベルト2世)は退位・国外亡命に追い込まれ、イタリアは君主政から共和政へと国家体制を根本的に転換させた。',
      debate:'投票結果の僅差(南北間の顕著な支持の分裂)は、統一後もなお残る南北間の政治的・文化的な断層をこの重要な国民的決定の場においてもなお露呈させる事例として指摘される。'

  { id:'italian_republic', name:'イタリア共和国', category:'nation', lat:41.9, lng:12.49, start:1946, end:2000, region:'イタリア',
    desc:{
      background:'王政廃止という戦後の国家体制の根本的転換を経て、ファシズムと戦争の過去を清算し新たな民主国家として国際社会に再登場する必要があったことが、この共和国樹立の背景にある。',
      process:'新憲法のもとで議院内閣制民主主義を確立し、マーシャル・プランの活用などを通じて『イタリアの奇跡』と呼ばれる急速な高度経済成長を遂げ、ヨーロッパ石炭鉄鋼共同体・EEC(欧州経済共同体)の原加盟国としてヨーロッパ統合の中心的な一員としての地位を確立した。',
      significance:'南北間の経済格差という構造的課題を抱えつつも、戦後民主主義と経済的繁栄を両立させたこのモデルは、戦後西欧諸国における民主化・経済復興の一つの成功例として評価されている。',
      debate:'戦後政治において頻繁な内閣交代という政情不安定さが続いたことについては、比例代表制に起因する多党分立を批判的にみる見方と、多様な民意を反映する柔軟な民主主義の一形態として肯定的に評価する見方とがある。'
    } },

  // ===================== 北欧・東欧 追加データ(ポーランド、ハンガリー・ボヘミア、バルカン、北欧諸国) =====================
  { id:'poland_kingdom', name:'ポーランド王国(ピャスト朝〜ヤゲウォ朝)', category:'nation', lat:52.23, lng:21.01, start:966, end:1569, region:'ポーランド',
    desc:{
      background:'西スラヴ系ポラン人の部族連合が、周辺のドイツ勢力・キリスト教世界との関係の中で国家的統一とキリスト教受容の必要性を強めたことが建国の背景にある。',

      significance:'この王国が築いた東欧における広域的な政治秩序は、後のルブリン合同によるポーランド=リトアニア共和国という、当時としては特異な貴族共和政国家の形成へとつながった。',
      debate:'西のドイツ的世界と東の正教・ロシア的世界の間に位置するその地政学的立場は、以後のポーランド史を貫く『境界国家』としての宿命的な性格を形づくったとしばしば論じられる。'
    } },
  { id:'casimir_iii_poland', name:'カジミェシュ3世(大王)', category:'person', lat:50.06, lng:19.94, start:1310, end:1370, region:'ポーランド王国', parentId:'poland_kingdom',
    desc:{
      background:'父ヴワディスワフ1世が進めた再統一事業を継承し、国内の法制度・都市の整備を通じた内政の充実を治世の中心に据えたことが、この『農民の王』としての評価の背景にある。',
      process:'国内法を体系的に整備(ヴィシリツァ法典)し、多くのユダヤ人難民を受け入れる寛容策やクラクフ大学の創設など文化・教育振興にも力を注いだが、跡継ぎとなる男子に恵まれなかった。',
      significance:'その内政重視の統治は国力の充実をもたらしたが、跡継ぎ不在という事態は、姉妹の子筋にあたるハンガリー・アンジュー家、さらにはリトアニア大公家との同君連合という、以後のポーランドの複雑な王位継承・国家連合の歴史を準備する結果となった。',
      debate:'軍事的拡大よりも内政の充実を優先したその統治スタイルは、対外的拡張を重視した同時代の他の君主たちとの対比において、『名君』としての評価基準の多様性を考えさせる事例とされる。'
    } },
  { id:'jagiellon_dynasty', name:'ヤゲウォ朝', category:'dynasty', lat:52.23, lng:21.01, start:1386, end:1572, region:'ポーランド・リトアニア',
    desc:{
      background:'リトアニア大公国がドイツ騎士団という共通の脅威に対抗する必要から、キリスト教化とポーランドとの同盟関係構築を模索したことが、この王朝成立の背景にある。',
      process:'リトアニア大公ヤギェウォがカトリックに改宗しポーランド女王ヤドヴィガと結婚することで両国の同君連合を実現し、グルンヴァルトの戦いでドイツ騎士団に決定的な勝利を収めるなど、東欧における最大級の勢力を築いた。',
      significance:'この同君連合は、単なる王朝的結合を超えて後の正式な国家統合(ルブリン合同によるポーランド=リトアニア共和国)への長期的な布石となった。',
      debate:'リトアニアという異教徒的・正教的要素を色濃く持つ地域とポーランドというカトリック的地域との統合が、その後の宗教的・文化的多様性をどこまで内包し続けたかは、この複合国家の性格を考える上で重要な論点である。'
    } },
  { id:'polish_lithuanian_commonwealth', name:'ポーランド=リトアニア共和国(共和国)', category:'nation', lat:52.23, lng:21.01, start:1569, end:1795, region:'ポーランド・リトアニア・ウクライナ方面',
    desc:{
      background:'ヤゲウォ朝の同君連合という緩やかな結合を、より恒久的で対等な国家統合へと発展させる必要性が、両国貴族層の合意によるルブリン合同の背景にある。',
      process:'選挙王制のもと『黄金の自由』と呼ばれる強力な貴族特権(セイム議会における自由拒否権など)を発展させたが、この制度は国政の意思決定を著しく困難にし、次第に周辺列強(ロシア・プロイセン・オーストリア)の介入を招く隙を生んだ。',
      significance:'貴族による極端な権力抑制のモデルは近世における独特な『貴族共和政』の実験として注目される一方、その機能不全は最終的に18世紀末の3次にわたる分割による国家消滅という悲劇的結末を招いた。',
      debate:'この『黄金の自由』を貴族的立憲主義の先進的モデルとして評価する見方と、国家統治の実効性を犠牲にした無責任な特権温存に過ぎなかったとする批判的見方とが、ポーランド史における根本的な評価軸となっている。'
    } },
  { id:'jan_sobieski', name:'ヤン3世ソビエスキ', category:'person', lat:52.23, lng:21.01, start:1629, end:1696, region:'ポーランド=リトアニア共和国', parentId:'polish_lithuanian_commonwealth',
    desc:{
      background:'オスマン帝国の脅威が中欧に迫る中、ポーランド軍の卓越した騎兵戦術(有翼重騎兵フサリア)への高い評価が、彼を救援軍指揮官として招請する背景となった。',
      process:'神聖ローマ皇帝の救援要請に応じてウィーンへ進軍し、包囲するオスマン軍の背後を突く大胆な騎兵突撃を敢行してこれを撃破し、キリスト教世界を救った英雄として称えられた。',
      significance:'この勝利によりオスマン帝国のヨーロッパへのさらなる拡大は決定的に食い止められたが、この栄光とは裏腹に自国ポーランドの国内的な統治機能不全・国力衰退には歯止めをかけることができなかった。',
      debate:'『キリスト教世界の救世主』としての国際的名声と、自国の構造的な政治的機能不全を放置し続けた統治者としての限界という彼の治世の二面性は、個人の軍事的栄光と国家の長期的存続の関係を考える好例とされる。'
    } },
  { id:'battle_vienna_1683', name:'第2次ウィーン包囲(ウィーンの戦い)', category:'war', lat:48.21, lng:16.37, start:1683, end:1683, region:'オーストリア(ウィーン)',
    desc:{
      background:'オスマン帝国大宰相カラ・ムスタファ・パシャによる野心的なウィーン攻略計画が、ハプスブルク家の中欧における拠点そのものを脅かす事態を招いたことが、この決戦の背景にある。',
      process:'長期の包囲戦で疲弊した守備隊がなお持ちこたえる中、ポーランド王ヤン3世ソビエスキ率いる神聖同盟の救援軍が到着し、大規模な騎兵突撃によりオスマン軍を潰走させた。',
      significance:'この敗北を境にオスマン帝国は攻勢から守勢へと決定的に転じ、以後のハプスブルク家による対オスマン反攻(ハンガリー奪還など)への転換点となった。',
      debate:'『オスマンの脅威の終焉』を象徴する画期的事件として西欧史では重視される一方、オスマン帝国側の視点からはこの敗北を長期的な衰退の始まりと単純に結びつけることに慎重な見方もある。'
    } },
  { id:'tadeusz_kosciuszko', name:'コシューシコ', category:'person', lat:52.23, lng:21.01, start:1746, end:1817, region:'ポーランド=リトアニア共和国', parentId:'polish_lithuanian_commonwealth',
    desc:{
      background:'アメリカ独立戦争への義勇兵参加を通じて共和主義的な自由の理念に深く共鳴した経験が、帰国後の祖国解放運動への献身の思想的背景となった。',
      process:'ロシア・プロイセンによる分割支配とその後の第二次分割に抵抗し、農民兵にも参加を呼びかける国民的蜂起(コシューシコの蜂起)を組織して各地で緒戦の勝利を収めたが、最終的に鎮圧され自身も捕虜となった。',
      significance:'彼の蜂起の理念(農奴解放を含む社会的改革と国民的団結の呼びかけ)は、単なる貴族の抵抗を超えた近代的な国民運動の先駆けとして、後のポーランド独立運動全体に大きな精神的影響を残した。',
      debate:'アメリカでの奴隷解放への強い関心(遺言による資金提供)と祖国での農民解放への取り組みという一貫した平等主義の理念は、彼を単なる民族主義者ではなく普遍的な自由の理念の体現者として評価する見方の根拠となっている。'
    } },
  { id:'kosciuszko_uprising', name:'コシューシコの蜂起', category:'revolution', lat:52.23, lng:21.01, start:1794, end:1794, region:'ポーランド',
    desc:{
      background:'第二次ポーランド分割によってさらに縮小した国家の存続そのものへの強い危機感が、この最後の大規模な国民的抵抗運動を引き起こす背景となった。',
      process:'コシューシコの指導のもと農民兵をも動員した抵抗運動が展開され、当初はラツワヴィツェの戦いなどで勝利を収めたが、ロシア・プロイセンの圧倒的な軍事力の前に最終的に鎮圧された。',
      significance:'この蜂起の失敗は、1795年の第3次ポーランド分割による国家そのものの完全な消滅という結末を決定づけ、以後120年以上に及ぶポーランドの独立喪失状態の起点となった。',
      debate:'国家消滅という結果に終わったこの蜂起を『無謀な抵抗の悲劇』とみるか、国家なき民族の存続を可能にした国民的アイデンティティ形成の重要な精神的支柱とみるかは、ポーランドの国民的記憶において特別な意味を持ち続けている。'
    } },
  { id:'duchy_warsaw', name:'ワルシャワ大公国', category:'nation', lat:52.23, lng:21.01, start:1807, end:1815, region:'ポーランド',
    desc:{
      background:'ナポレオンによるプロイセン打倒(ティルジット条約)という国際情勢の激変が、分割されて久しいポーランド人にとって独立回復への一縷の希望をもたらす好機として捉えられたことが、この衛星国家樹立の背景にある。',
      process:'プロイセン領ポーランドを基礎にナポレオン法典の導入など近代的な統治改革が進められ、多くのポーランド人がナポレオン軍に志願して参加したが、ナポレオンの没落とともにこの国家も解体を余儀なくされた。',
      significance:'完全な独立ではなくフランスの衛星国という限定的な形であったにせよ、分割後初めて『ポーランド』を冠する政治的実体が復活したことは、独立回復への希望の灯を絶やさない重要な象徴的意味を持った。',
      debate:'ナポレオンへの協力を『独立回復のための現実的な戦略的選択』とみるか、単なる外国勢力への従属の繰り返しに過ぎなかったとみるかは、ポーランドの近代史における対外関係の評価に関わる論点である。'
    } },
  { id:'congress_poland', name:'ポーランド立憲王国(会議王国)', category:'nation', lat:52.23, lng:21.01, start:1815, end:1915, region:'ポーランド(ロシア領)',
    desc:{
      background:'ウィーン会議での大国間の妥協の産物として、ロシア皇帝を国王に戴く形での限定的な自治権を持つポーランドが再編されたことが、この国家の特異な性格の背景にある。',
      process:'当初は独自の憲法・軍隊・議会を持つ自治領として出発したが、1830年・1863年の度重なる蜂起への弾圧を経て自治権は段階的に剥奪され、最終的には実質的にロシア帝国の一地方に組み込まれるロシア化政策の対象となった。',
      significance:'この自治権の漸進的な剥奪過程は、大国の思惑によって与えられた『自治』がいかに脆弱で一方的に覆されうるものであるかを示す事例として、ポーランドの民族的記憶に深く刻まれている。',
      debate:'この限定的な自治体制を『国家消滅からの一定の回復』として評価する見方と、実質的な独立とは程遠い名目的な存在に過ぎなかったとする見方とがある。'
    } },
  { id:'second_polish_republic', name:'ポーランド第二共和国', category:'nation', lat:52.23, lng:21.01, start:1918, end:1939, region:'ポーランド',
    desc:{
      background:'第一次世界大戦によって分割していた三大国(ロシア・ドイツ・オーストリア)がいずれも敗戦・解体するという歴史的な好機が、123年ぶりの独立回復を可能にした背景にある。',
      process:'独立回復後も国境画定をめぐる周辺国との紛争(ポーランド・ソビエト戦争など)を経て国家再建を進めたが、独ソ不可侵条約の秘密議定書に基づき1939年にドイツとソ連から東西同時に侵攻され、再び分割・占領される事態に陥った。',
      significance:'この独立回復は、大国間の力学の変化によって長期間失われていた国家主権が突如として回復されうるという、国際政治における国家存続の劇的な変転を示す事例となった。',
      debate:'わずか21年で再び国家消滅の危機に陥ったこの経験は、大国に挟まれた中規模国家の地政学的な脆弱性を象徴する事例として、以後のポーランドの安全保障政策(NATO加盟への強い意志など)の歴史的背景としてしばしば言及される。'
    } },
  { id:'polish_government_exile', name:'ポーランド亡命政府', category:'event', lat:51.51, lng:-0.13, start:1939, end:1945, region:'ロンドン(亡命政府)',
    desc:{
      background:'ドイツ・ソ連による祖国の分割占領という事態に直面し、国家主権の連続性を国際的に主張し続ける必要があったことが、この亡命政府樹立の背景にある。',
      process:'国内軍(アルミア・クラヨヴァ)を通じてワルシャワ蜂起をはじめとするレジスタンス運動を指導したが、戦後処理においてソ連の影響力が優越する中で英米からの実質的な承認・支援を得られず、最終的にはソ連の後ろ盾を得た共産政権にその地位を奪われた。',
      significance:'この亡命政府の苦難は、大国間の戦後秩序構築において中小国の主権・利害がいかに軽視されうるかを示す事例として、戦後のポーランドにおける対ソ連・対西側諸国双方への複雑な感情の歴史的背景となった。',
      debate:'西側連合国(特にイギリス)がこの亡命政府への当初の約束(戦後のポーランド独立支援)を事実上反故にしたことは、大国間の現実政治(ヤルタ体制)における同盟国間の信義の限界を示す事例として、今なお批判的に論じられる。'
    } },
  { id:'solidarity_movement', name:'連帯(ソリダルノシチ)運動', category:'revolution', lat:54.35, lng:18.65, start:1980, end:1989, region:'ポーランド(グダニスク)',
    desc:{
      background:'計画経済の慢性的な非効率性による物資不足と、共産党政権による物価引き上げ政策への広範な労働者の不満が、この自主管理労働組合結成の直接的背景にある。',
      process:'グダニスクの造船所労働者のストライキを機にワレサを指導者とする全国的な労働組合『連帯』が結成され、共産党政権との粘り強い交渉と対峙を続け、一時は戒厳令による弾圧を受けながらも組織を維持し、1989年の円卓会議を経て非共産勢力による政権樹立を実現した。',
      significance:'共産党一党支配下で初めて独立した労働組合が公認され、選挙を通じて非共産政権が樹立されたこの成功例は、東欧革命全体の先駆けとして、以後の東欧諸国の民主化運動に大きな勇気と実践的モデルを与えた。',
      debate:'この運動の成功要因として、労働者階級の組織的団結を重視する見方と、カトリック教会(特にポーランド出身の教皇ヨハネ・パウロ2世)の精神的支援の役割を重視する見方とがあり、両者の相互作用として理解されることが多い。'
    } },
  { id:'lech_walesa', name:'レフ=ワレサ', category:'person', lat:54.35, lng:18.65, start:1943, end:2000, region:'ポーランド', parentId:'solidarity_movement',
    desc:{
      background:'グダニスク造船所での労働者としての現場経験と、1970年の労働者暴動の記憶が、彼を労働運動の指導者として立たせる直接的な動機となった。',
      process:'『連帯』の指導者として共産党政権との交渉を粘り強く続け、戒厳令下での逮捕・弾圧にも屈せず組織を維持し、1983年にはノーベル平和賞を受賞し、1989年の民主化実現後、翌1990年には東欧革命後のポーランド初代大統領に選出された。',
      significance:'一介の電気工から一国の大統領にまで上り詰めたその経歴は、東欧革命が体現した『市民社会の力による体制転換』を象徴する存在として国際的に高く評価された。',
      debate:'大統領としての統治手腕については労働運動指導者としての手腕とは評価が分かれ、市場経済移行に伴う社会的混乱への対応などをめぐり、在任中から国内での支持率は大きく変動した。'
    } },
  { id:'hungary_kingdom', name:'ハンガリー王国', category:'nation', lat:47.5, lng:19.04, start:1000, end:1526, region:'中央ヨーロッパ(パンノニア平原)',
    desc:{
      background:'パンノニア平原という肥沃で広大な土地に定住したマジャール人が、周辺のキリスト教世界との関係の中で国家的統一と改宗の必要性を強めたことが建国の背景にある。',
      process:'イシュトヴァーン1世のもとカトリックを国教として国家の基礎を固め、以後東欧有数の強国として発展したが、モハーチの戦いでオスマン帝国に壊滅的な敗北を喫し、国王も戦死して王国は事実上解体した。',
      significance:'この王国の存在は中欧におけるキリスト教世界の東方防壁としての役割を長く担い、その崩壊はオスマン帝国のヨーロッパ内陸部への本格的な進出を許す結果となった。',
      debate:'モハーチの敗北の背景として、当時の国内貴族間の深刻な対立・軍事的準備不足を重視する見方は、外部の脅威だけでなく内部の統治機能不全が国家存亡の危機を招いた事例として論じられる。'
    } },
  { id:'stephen_i_hungary', name:'イシュトヴァーン1世(聖イシュトヴァーン)', category:'person', lat:47.5, lng:19.04, start:969, end:1038, region:'ハンガリー王国', parentId:'hungary_kingdom',
    desc:{
      background:'周辺の遊牧的伝統を保持するマジャール人社会を、西欧的なキリスト教国家として再編する必要性を強く認識したことが、彼の国家建設事業の背景にある。',
      process:'教皇からハンガリー王としての戴冠を受けてカトリックを国教と定め、行政区分(州制度)の整備や修道院建設を通じて国家の基礎を固めた。',
      significance:'その建国事業により、ハンガリーは西欧キリスト教世界の一員としての地位を確立し、以後の中欧における重要な政治的アクターとしての長期にわたる歴史的展開の礎を築いた。',
      debate:'『建国の父』としての国民的崇敬が今日まで続いていることは、中世初期の統治者の事績が近代・現代の国民的アイデンティティ形成にいかに長期的な影響を及ぼし続けるかを示す興味深い事例である。'
    } },
  { id:'bohemia_kingdom', name:'ベーメン王国(ボヘミア王国)', category:'nation', lat:50.08, lng:14.44, start:1198, end:1806, region:'中央ヨーロッパ(現チェコ)',
    desc:{
      background:'神聖ローマ帝国内で選帝侯という特権的地位を有していたことが、この王国の政治的・文化的な重要性を高める背景となった。',
      process:'カール4世の時代に首都プラハが帝国随一の文化都市として繁栄したが、ヤン・フスの処刑を機にフス戦争という深刻な宗教的内乱を経験し、最終的にハプスブルク家の世襲支配下に組み込まれ独自の王権は形骸化した。',
      significance:'その豊かな文化的伝統(プラハのカレル大学、宗教改革の先駆けとなったフス派の思想)は、後のチェコ民族の文化的アイデンティティの重要な歴史的源泉となり続けた。',
      debate:'ハプスブルク家支配下での長期の従属状態が、チェコ民族のアイデンティティ形成にどのような影響を与えたか(抑圧による民族意識の強化か、文化的同化の進行か)については、近代チェコ・ナショナリズムの起源を考える上で議論がある。'
    } },
  { id:'jan_hus', name:'ヤン=フス', category:'person', lat:50.08, lng:14.44, start:1369, end:1415, region:'ボヘミア王国',
    desc:{
      background:'教会の世俗化・腐敗(聖職売買、贖宥状販売)への批判と、ジョン・ウィクリフの改革思想からの影響が、彼の宗教改革的主張の思想的背景にある。',
      process:'プラハ大学で説教・著述を通じ聖書に基づく信仰と教会改革を訴えたが、安全を保障するとの約束のもと出頭したコンスタンツ公会議で異端と断罪され、約束は反故にされて火刑に処された。',
      significance:'ルターに先立つこと約1世紀、教会権威への根本的な異議申し立てを行ったその思想と殉教は、後の宗教改革の先駆的事例として位置づけられ、チェコ民族にとって永く精神的支柱であり続けている。',
      debate:'彼の処刑における『安全保障の反故』は中世における信義・約束の実効性の限界を示す象徴的事例とされ、この裏切りへの怒りがフス戦争という大規模な民族的・宗教的反乱を引き起こす直接の引き金となった。'
    } },
  { id:'hussite_wars', name:'フス戦争', category:'war', lat:50.08, lng:14.44, start:1419, end:1434, region:'ボヘミア王国',
    desc:{
      background:'ヤン・フスの処刑に対するボヘミアの民衆・貴族の激しい怒りが、皇帝・教会権威への全面的な武装抵抗という前例のない規模の反乱を引き起こした背景にある。',
      process:'フス派は荷車を連ねた即席の要塞(ヴァゴンブルク)と初期の火器を組み合わせた革新的な戦術を駆使し、複数回にわたり派遣された十字軍を撃退し続けたが、内部の穏健派・急進派(タボル派)の対立から次第に分裂した。',
      significance:'当時のヨーロッパにおける正規の封建騎士軍に対し、農民・都市民を主体とする軍隊が独自の戦術革新によって繰り返し勝利したこの事例は、軍事史上重要な画期として評価される。',
      debate:'最終的に穏健派が教会側と妥協して一定の宗教的譲歩(バーゼル協約)を勝ち取ったことは、急進的な社会変革要求(タボル派の平等主義的理想)がどこまで実現し得たかについての評価を分ける論点となっている。'
    } },
  { id:'battle_mohacs', name:'モハーチの戦い', category:'war', lat:45.99, lng:18.68, start:1526, end:1526, region:'ハンガリー(モハーチ)',
    desc:{
      background:'スレイマン1世治下で最盛期を迎えていたオスマン帝国の中欧への拡大政策が、ハンガリー王国の存立そのものを脅かす直接の軍事的圧力となったことが、この決戦の背景にある。',
      process:'準備不足のまま迎え撃ったハンガリー軍は、オスマン軍の圧倒的な火砲・兵力の前に壊滅的な敗北を喫し、若き国王ラヨシュ2世も敗走中に落命した。',
      significance:'この敗北によりハンガリー王国は事実上解体し、領土はオスマン支配地域・ハプスブルク支配地域・自治的なトランシルヴァニア公国という三分割状態に陥り、以後150年以上にわたりこの分裂状態が継続した。',
      debate:'この破局的な敗北の要因については、軍事的準備の不足を重視する見方に加え、当時の貴族間の内部対立・国王権力の弱体化という構造的な政治的機能不全を重視する見方が近年強調される傾向にある。'
    } },
  { id:'hungarian_revolution_1848', name:'ハンガリー1848年革命', category:'revolution', lat:47.5, lng:19.04, start:1848, end:1849, region:'ハンガリー',
    desc:{
      background:'1848年革命の全欧的な高揚とオーストリアの中央集権的支配への長年の不満が、ハンガリーにおける独立・国民国家樹立を求める運動を一気に高揚させた背景にある。',
      process:'コシュートらの指導のもと独自の政府・軍隊を組織し一時独立を宣言するまでに至ったが、オーストリア単独では鎮圧しきれず、皇帝の要請に応じたロシア軍の大規模な介入により最終的に鎮圧された。',
      significance:'この革命は鎮圧されたものの、ハンガリー人の強い自治・独立要求をオーストリア側に強く印象づけ、後の普墺戦争敗北後のアウスグライヒ(1867年)によるハンガリーの広範な自治獲得への布石となった。',
      debate:'外国(ロシア)の軍事介入によって初めて鎮圧しえたという事実は、当時のオーストリア帝国が単独では自国内の民族運動を統制する力を既に失いつつあったことを示す事例として重視される。'
    } },
  { id:'kossuth', name:'コシュート', category:'person', lat:47.5, lng:19.04, start:1802, end:1894, region:'ハンガリー',
    desc:{
      background:'オーストリアの中央集権的統治とハンガリー貴族層の伝統的な自治要求との間の緊張が高まる中、雄弁な弁論家・ジャーナリストとして頭角を現したことが、彼の政治的指導力確立の背景にある。',
      process:'1848年革命でハンガリーの独立と国民国家樹立を主導し一時は摂政的地位にまで就いたが、ロシア軍の介入による鎮圧後は亡命生活を余儀なくされ、生涯祖国に帰ることなく客死した。',
      significance:'彼が掲げた独立の理念そのものは実現しなかったが、その情熱的な民族運動はハンガリー人の自治要求の正当性を国際的に印象づけ、後のアウスグライヒによる自治獲得への重要な政治的・精神的地盤を残した。',
      debate:'完全な独立を求め続けたその急進的な姿勢と、最終的に妥協的な二重帝国体制(アウスグライヒ)という形で実現した自治との落差は、理想主義的指導者と現実的な政治的帰結との関係を考えさせる事例である。'
    } },
  { id:'hungarian_revolution_1956', name:'ハンガリー動乱(1956年革命)', category:'revolution', lat:47.5, lng:19.04, start:1956, end:1956, region:'ハンガリー(ブダペスト)',
    desc:{
      background:'フルシチョフによるスターリン批判が東欧諸国に自由化への期待を高める中、ハンガリー国内の経済的困窮とソ連支配への根強い不満が蜂起の直接的背景にある。',
      process:'学生・労働者を中心とする大規模なデモが武装蜂起に発展し、改革派のナジ・イムレ首相のもとワルシャワ条約機構脱退・中立化を宣言するに至ったが、これを座視できないソ連が大規模な軍事介入を行い、徹底的に鎮圧した。',
      significance:'多数の死者と大量の亡命者を出したこの弾圧は、社会主義陣営内部における『自由化の限界』を世界に強く印象づけ、西側における共産主義への幻滅を加速させる一因となった。',
      debate:'西側諸国(特にラジオ・フリー・ヨーロッパの放送)が蜂起を扇動しながら実際の軍事支援は行わなかったことは、冷戦下における『解放』の言説と現実の政策との乖離を示す事例として批判的に論じられることがある。'
    } },
  { id:'czechoslovakia_first_republic', name:'チェコスロヴァキア第一共和国', category:'nation', lat:50.08, lng:14.44, start:1918, end:1938, region:'チェコスロヴァキア',
    desc:{
      background:'第一次世界大戦によるオーストリア=ハンガリー帝国の解体という好機を捉え、チェコ人とスロヴァキア人の民族指導者(マサリクら)が共同での国家建設を構想したことが成立の背景にある。',
      process:'民主的な議会制度と比較的高い経済水準を実現し東欧では稀な安定した民主主義国家として発展したが、国内のドイツ系住民(ズデーテン・ドイツ人)問題を抱え、ミュンヘン協定によりズデーテン地方の割譲を強いられた末、翌年ドイツに全土を事実上併合された。',
      significance:'戦間期東欧における『民主主義の優等生』としての存在は、その崩壊(宥和政策の犠牲)とともに、大国間の取引によって中小国の主権が容易に踏みにじられる国際政治の非情さを象徴する事例となった。',
      debate:'多民族国家として出発したこの共和国が、ドイツ系住民の自治要求にどこまで柔軟に対応しえたか、あるいは対応すべきであったかについては、後知恵的な批判を避けた慎重な評価が求められる。'
    } },
  { id:'munich_agreement', name:'ミュンヘン協定', category:'treaty', lat:48.14, lng:11.58, start:1938, end:1938, region:'ドイツ(ミュンヘン)',
    desc:{
      background:'ヒトラーによるズデーテン地方のドイツへの割譲要求に対し、英仏がさらなる戦争を回避したいとの強い願望から、当事国チェコスロヴァキア抜きでの交渉に応じたことが、この協定成立の背景にある。',
      process:'チェンバレン英首相が『我々の時代の平和』を演説で謳い上げてズデーテン地方の割譲を容認したが、この譲歩にもかかわらずヒトラーは翌年チェコ全土を占領し、さらにポーランドへも侵攻して第二次世界大戦を引き起こした。',
      significance:'この協定は、侵略国への一方的な譲歩(宥和政策)がさらなる侵略を助長するだけであるという教訓を歴史に強く刻み、以後の国際政治における対外強硬論の重要な参照事例となり続けている。',
      debate:'チェンバレンの判断を、当時の軍事的準備不足を踏まえた『時間稼ぎとしての現実的判断』と擁護する見方も一部にあるが、主流の評価としては宥和政策の失敗の典型例として否定的に位置づけられ続けている。'
    } },
  { id:'prague_spring', name:'プラハの春', category:'revolution', lat:50.08, lng:14.44, start:1968, end:1968, region:'チェコスロヴァキア(プラハ)',
    desc:{
      background:'経済の停滞と硬直した統制への国民的不満が、改革派指導者ドプチェクのもとでの言論・経済の自由化を求める運動を後押ししたことが背景にある。',
      process:'『人間の顔をした社会主義』を掲げ検閲廃止・複数政党的要素の一部容認などの改革を進めたが、これが東欧全体の体制動揺を招くことを恐れたソ連が、ワルシャワ条約機構軍を率いて軍事介入(チェコ事件)しこれを圧殺した。',
      significance:'この弾圧は『ブレジネフ・ドクトリン』(社会主義圏内の体制維持のための軍事介入の正当化)を明確化させる契機となったが、同時に改革の理念は地下に潜って生き続け、後の『憲章77』などの反体制運動、さらにはビロード革命へとつながる精神的系譜を残した。',
      debate:'この改革運動を『社会主義の枠内での民主化』を目指す穏健なものとみるか、既に体制そのものの本質的転換を志向する急進的なものであったとみるかについては、その後の東欧民主化運動全体の性格づけとも関わる論点である。'
    } },
  { id:'velvet_revolution', name:'ビロード革命', category:'revolution', lat:50.08, lng:14.44, start:1989, end:1989, region:'チェコスロヴァキア',
    desc:{
      background:'ポーランド・ハンガリーなど周辺諸国での民主化の連鎖と、ベルリンの壁崩壊という国際的な東欧革命の大きな潮流が、この国での民主化運動を後押しした直接的背景にある。',
      process:'学生デモへの警官隊の弾圧を機に全国的な抗議運動・ゼネストへと発展し、共産党指導部が抵抗を断念して退陣に合意し、劇作家で反体制運動の象徴的存在であったヴァーツラフ・ハヴェルが大統領に選出された。',
      significance:'流血をほとんど伴わずに共産党の一党独裁体制を退陣に追い込んだこの過程は、東欧革命の中でも特に象徴的な平和的政権交代の事例として国際的に高く評価されている。',
      debate:'この『平和的』な移行が実現した要因として、市民の圧倒的な団結を重視する見方と、既に周辺国での体制崩壊を目の当たりにした共産党指導部が早期に抵抗を断念したという国際的文脈の重要性を指摘する見方とがある。'
    } },
  { id:'czechoslovakia_dissolution', name:'チェコスロヴァキア解体(ビロード離婚)', category:'event', lat:48.15, lng:17.11, start:1993, end:1993, region:'チェコスロヴァキア',
    desc:{
      background:'民主化後、チェコとスロヴァキアの間で経済改革の速度や連邦制度の運営をめぐる見解の相違が徐々に深刻化していたことが、この分離の背景にある。',
      process:'国民投票を経ることなく、両共和国の政治指導者間の合意に基づき連邦を解体するという手続きが進められ、深刻な民族対立や暴力を伴うことなく平和裏に2つの独立国家が誕生した。',
      significance:'民族的・言語的に近い関係にある2国が武力衝突を伴わず平和的に分離した事例として、同時期に激しい民族紛争を経験した旧ユーゴスラビアとの際立った対比をなす『ビロード離婚』というモデルケースとなった。',
      debate:'国民投票を経ずに政治エリート間の合意のみで国家分割という重大な決定がなされたことについては、民主的正統性の観点から一定の批判・疑問も呈されている。'
    } },
  { id:'serbian_empire', name:'セルビア王国・帝国', category:'nation', lat:44.79, lng:20.45, start:1217, end:1371, region:'バルカン半島中部',
    desc:{
      background:'ビザンツ帝国の衰退という地域的な権力空白の中、セルビア人勢力(ネマニッチ朝)がバルカン半島における覇権確立の機会を捉えたことが、この帝国発展の背景にある。',
      process:'ステファン=ドゥシャンのもとで積極的な対外拡張を進めビザンツ領の多くを含むバルカン半島の大半を支配する最盛期を築いたが、彼の死後は有力な後継者を欠き急速に分裂・弱体化し、次第に台頭するオスマン帝国の圧力にさらされた。',
      significance:'この帝国が築いた文化的・宗教的遺産(セルビア正教会の独立性など)は、後のセルビア民族のアイデンティティ形成において重要な歴史的参照点であり続けている。',
      debate:'一人の傑出した統治者(ステファン=ドゥシャン)への過度な依存が、その死後の急速な瓦解を招いたという構造は、中世バルカン諸国家の政治的脆弱性を示す典型的な事例として論じられる。'
    } },
  { id:'stefan_dusan', name:'ステファン=ドゥシャン', category:'person', lat:44.79, lng:20.45, start:1308, end:1355, region:'セルビア帝国', parentId:'serbian_empire',
    desc:{
      background:'先代までのセルビア諸公国の統合事業を継承し、衰退するビザンツ帝国の内紛に乗じて領土拡張を図る好機を捉えたことが、彼の積極的な対外政策の背景にある。',

      significance:'その治世に築かれた広大な版図と法典編纂という統治実績は、セルビア中世史における『最盛期』として、後のセルビア民族主義における重要な歴史的参照点となっている。',

    } },
  { id:'battle_kosovo_1389', name:'コソヴォの戦い', category:'war', lat:42.66, lng:21.15, start:1389, end:1389, region:'バルカン半島(コソヴォ)',
    desc:{
      background:'バルカン半島への本格的な進出を図るオスマン帝国の圧力に対し、セルビア公国を中心とするバルカン諸勢力の連合軍がこれに対抗する決戦を余儀なくされたことが背景にある。',
      process:'セルビア公ラザルとオスマンのスルタン、ムラト1世がともに戦死するという激しい死闘の末、記録上は引き分けに近い結果とも言われるが、その後の情勢はオスマン側に有利に展開した。',
      significance:'この戦いを機にセルビアをはじめバルカン諸国は次第にオスマン帝国の支配・従属下に組み込まれていくこととなり、以後約500年に及ぶオスマン支配の時代が始まった。',
      debate:'軍事的には必ずしも決定的な大敗ではなかったにもかかわらず、この戦いがセルビア民族の記憶において『喪失と犠牲』の象徴として神話化され、20世紀末のバルカン紛争においても民族主義的動員の重要な象徴として繰り返し利用された経緯は、歴史的記憶の政治的利用を考える上で重要な事例である。'
    } },
  { id:'bulgarian_empire_second', name:'ブルガリア帝国(第二次)', category:'nation', lat:43.43, lng:25.64, start:1185, end:1396, region:'バルカン半島東部',
    desc:{
      background:'第一次ブルガリア帝国のビザンツによる征服統治への根強い反発が、独立回復を目指す蜂起を引き起こした背景にある。',
      process:'貴族兄弟の指導による蜂起が成功して独立を回復し、一時はバルカン半島の強国として復興を遂げたが、内紛や周辺国(セルビア帝国など)との抗争により次第に弱体化し、最終的にオスマン帝国の拡大の前に征服された。',
      significance:'一度征服されてもなお民族的独自性を保持し独立を回復しえたこの事例は、バルカン諸民族における帝国支配下でのアイデンティティ存続の強靭さを示す事例として位置づけられる。',
      debate:'この帝国の『復興』が真に民族的な連続性に基づくものか、それとも新たな政治的実体の成立に過ぎなかったのかについては、中世バルカン史における国家・民族概念の適用をめぐる慎重な検討が必要とされる。'
    } },
  { id:'balkan_wars', name:'バルカン戦争', category:'war', lat:42.7, lng:23.32, start:1912, end:1913, region:'バルカン半島',
    desc:{
      background:'オスマン帝国の急速な弱体化(青年トルコ革命後の混乱)という好機を捉え、バルカン諸国が積年の民族的悲願であった領土回復・拡大を目指したことが第1次戦争の背景にある。',
      process:'第1次ではバルカン同盟がオスマン帝国からその大半のヨーロッパ領を奪う圧倒的な勝利を収めたが、獲得した戦利品(特にマケドニア)の分配をめぐりブルガリアと他の同盟国が対立し、第2次ではブルガリアが周辺国連合に敗れて領土の多くを失った。',
      significance:'この戦争によりオスマン帝国のヨーロッパ領はほぼ消滅し、バルカン半島の勢力図は大きく塗り替えられたが、未解決のまま残った複雑な領土・民族問題は第一次世界大戦を誘発する『ヨーロッパの火薬庫』としての緊張をさらに高める結果となった。',
      debate:'この戦争における民族浄化的な人口移動・虐待行為の実態は、20世紀のバルカン半島における民族紛争の悲劇的な先例として、後のユーゴスラビア紛争などとも比較されつつ論じられる。'
    } },
  { id:'kalmar_union', name:'カルマル同盟', category:'nation', lat:55.68, lng:12.57, start:1397, end:1523, region:'デンマーク・ノルウェー・スウェーデン',
    desc:{
      background:'ハンザ同盟やドイツ諸侯の北欧への影響力拡大という共通の脅威に対抗する必要から、北欧3王国を単一の君主のもとに統合しようとする構想が生まれた背景にある。',
      process:'マルグレーテ1世の主導により3王国の同君連合が実現したが、デンマークの優越的な立場に対するスウェーデン貴族層の根強い反発から幾度も動揺を繰り返し、最終的にスウェーデンの離脱・独立により事実上解体した。',
      significance:'この同盟の試みと解体の過程は、以後長く続くデンマークとスウェーデンの北欧における覇権争い(バルト海をめぐる幾度もの戦争)の歴史的出発点となった。',
      debate:'この連合を北欧統合の先駆的試みとして評価する見方がある一方、実態はデンマークによる他の2王国への支配に近く、対等な連合とは言い難かったとする見方が、その不安定な存続過程からも支持される。'
    } },
  { id:'margaret_i_denmark', name:'マルグレーテ1世', category:'person', lat:55.68, lng:12.57, start:1353, end:1412, region:'デンマーク', parentId:'kalmar_union',
    desc:{
      background:'夫・息子と相次いで有力な王位継承者を失う個人的苦難の中でも、卓越した政治的手腕により実権を手放さなかったことが、この異例の女性君主の統治確立の背景にある。',
      process:'幼い養子(甥の孫)を名目上の王に立てつつ自ら実権を掌握し、巧みな外交・婚姻政策を駆使して3王国の同君連合(カルマル同盟)を実現し、北欧地域における統一的な政治秩序を一時的に築き上げた。',
      significance:'中世ヨーロッパにおいて女性が公式の統治者としての地位に就くことが極めて稀であった時代に、実質的な最高権力者として広範な地域を統治した稀有な事例として、政治史上重要な位置を占めている。',
      debate:'『北欧のセミラミス』という異名は、彼女の統治手腕への高い評価を示す一方、同時代の女性統治者への評価がしばしば古代の伝説的人物との比較を通じてしかなされなかったという、当時のジェンダー観の限界も反映している。'
    } },
  { id:'denmark_kingdom', name:'デンマーク王国', category:'nation', lat:55.68, lng:12.57, start:950, end:2000, region:'北欧(ユトランド半島)',
    desc:{
      background:'ヴァイキング時代以来の海洋的伝統と、ユトランド半島という北欧・大陸間の結節点に位置する地理的条件が、この王国の長期にわたる存続と地域大国としての地位の背景にある。',
      process:'クヌート大王の時代には北海帝国の中心として繁栄し、カルマル同盟を通じた北欧統合の試みやスウェーデンとのバルト海覇権をめぐる度重なる戦争を経ながらも、大北方戦争後は地域大国としての地位をロシア・スウェーデンに譲り、以後は立憲君主政のもとでの平和的な中規模国家としての道を歩んだ。',
      significance:'その長い歴史を通じ、北欧最古級の王国として存続し続け、20世紀以降は高度な社会保障制度を備えた福祉国家のモデルの一つとしても国際的に高く評価されている。',
      debate:'かつての『大国』としての歴史的記憶と、現在の穏健な中規模国家としての自己認識との関係は、多くのかつての地域大国が経験する国民的アイデンティティの再定義過程を考える上で興味深い事例である。'
    } },
  { id:'norway_kingdom', name:'ノルウェー王国', category:'nation', lat:59.91, lng:10.75, start:872, end:2000, region:'北欧(スカンディナヴィア半島西部)',
    desc:{
      background:'ヴァイキング時代の各地の首長間の抗争を経て、地理的に分断されたフィヨルド地帯を単一の王権のもとに統合する必要性が高まったことが建国の背景にある。',
      process:'統一後まもなくデンマーク・スウェーデンとの同君連合下に置かれる長い時代を経験し、特にデンマークとの連合は数百年に及んだが、ナポレオン戦争後にはスウェーデンとの新たな同君連合へと移行し、最終的に1905年に平和的な国民投票を経て完全独立を達成した。',
      significance:'長期にわたり他国の同君連合下に置かれながらも独自の言語・文化的アイデンティティを保持し続け、最終的に武力を用いずに独立を達成したその過程は、平和的な民族自決のモデルケースとなった。',
      debate:'長期の従属状態下でノルウェー独自の言語(ノルウェー語の標準化をめぐる論争)がどのように保持・再構築されたかは、この国の近代的な国民的アイデンティティ形成における重要な文化史的論点である。'
    } },
  { id:'great_northern_war', name:'大北方戦争', category:'war', lat:59.33, lng:18.06, start:1700, end:1721, region:'バルト海沿岸',
    desc:{
      background:'バルト海沿岸における覇権をめぐり、新興のロシア(ピョートル1世)が既存の大国スウェーデンの優位に挑戦しようとしたことが、この長期戦争の背景にある。',
      process:'緒戦(ナルヴァの戦い)ではスウェーデンの若き王カール12世が数的劣勢のロシア軍を撃破するなど優勢に戦いを進めたが、ポルタヴァの戦いでの決定的敗北を境に形勢は逆転し、最終的にロシア・デンマーク・ポーランドなどの連合軍がスウェーデンを圧倒した。',
      significance:'この戦争によりスウェーデンはバルト海沿岸の広大な領土と大国としての地位を完全に失い(バルト帝国の終焉)、代わってロシアがバルト海への出口を確保しヨーロッパの大国としての地位を確立する画期的な転換点となった。',
      debate:'スウェーデンの没落とロシアの台頭というこの戦争の帰結は、軍事的な勝敗以上に長期的な国力(人口・資源・経済基盤)の差が決定的であったことを示す事例として、しばしば国際関係史の教材として引用される。'
    } },
  { id:'charles_xii_sweden', name:'カール12世', category:'person', lat:59.33, lng:18.06, start:1682, end:1718, region:'スウェーデン', parentId:'sweden_great_power',
    desc:{
      background:'父カール11世が確立した強力な絶対王政と軍事機構を継承し、若くして即位したことが周辺国(ロシア・デンマーク・ポーランドなど)による『好機』とみなされる隙を生んだことが、この戦争の背景にある。',
      process:'ナルヴァの戦いで数的に劣勢ながらロシア軍に圧勝するなど当初は連戦連勝を重ねたが、ロシア領内への深追いの末にポルタヴァの戦いで壊滅的な敗北を喫し、以後はオスマン帝国領への逃避行を含む苦難の亡命生活を送り、最終的にノルウェー遠征中に戦死した。',
      significance:'その若く華々しい軍事的成功と、その後の急激な没落という劇的な生涯は、スウェーデンの大国としての地位そのものの終焉を体現する象徴的な人物として記憶され続けている。',
      debate:'ポルタヴァ後もなお戦争継続に固執し続けたその頑迷さについては、軍事的天才でありながら政治的・戦略的な柔軟性を欠いていた統治者の典型例として、しばしば批判的に評価される。'
    } },
  { id:'sweden_kingdom_modern', name:'スウェーデン王国(近現代)', category:'nation', lat:59.33, lng:18.06, start:1721, end:2000, region:'北欧(スカンディナヴィア半島東部)',
    desc:{
      background:'大北方戦争での壊滅的敗北による大国としての地位の喪失が、以後のスウェーデンの国家戦略を根本的に転換させる契機となった。',
      process:'『自由の時代』と呼ばれる議会主導の統治を経てグスタフ3世による絶対王政復活なども経験したが、ナポレオン戦争後は一貫して軍事的中立政策を志向し、両世界大戦にも参戦を回避し、20世紀には高度な社会保障制度(福祉国家モデル)を発展させた。',
      significance:'かつての軍事大国から、平和主義・中立・高福祉を特徴とする国家へと大きく性格を転換させたこの歴史的経験は、国家の自己認識・国際的役割が時代とともに劇的に変化しうることを示す事例として注目される。',
      debate:'その『中立』政策の実態については、冷戦期に西側寄りの秘密の軍事協力を行っていたことが後に明らかになるなど、公式の中立性と実際の外交・安全保障政策との間には一定の乖離があったことが指摘されている。'
    } },
  { id:'norway_independence_1905', name:'ノルウェー独立(スウェーデンとの同君連合解消)', category:'event', lat:59.91, lng:10.75, start:1905, end:1905, region:'ノルウェー',
    desc:{
      background:'スウェーデンとの同君連合のもとでノルウェー独自の外交権(特に領事館設置権)をめぐる長年の不満が蓄積し、独自の国民的アイデンティティの高まりと結びついたことが、この独立運動の背景にある。',
      process:'ノルウェー議会が独自に連合解消を決議し、国民投票による圧倒的な支持を得た上でスウェーデン側と交渉を行い、両国とも武力衝突を避ける形で平和的に連合解消に合意した。',
      significance:'大国間の戦争や革命的な政変によらず、議会の決議と国民投票、そして平和的な外交交渉のみによって独立を達成したこの事例は、20世紀初頭における民族自決の穏健で模範的なモデルケースとなった。',
      debate:'この円満な分離が実現した要因については、両国の議会制民主主義の成熟度と、当時の国際情勢(大国の介入を招かない地域的な問題として処理しえたこと)の両方が重視される。'
    } },

  { id:'sarajevo_assassination', name:'サライェヴォ事件', category:'event', lat:43.86, lng:18.41, start:1914, end:1914, region:'ボスニア(サライェヴォ)',
