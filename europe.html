<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヨーロッパ史地図 — 世界史探究</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root{
    --bg-chrome:#1b2430;
    --bg-chrome-alt:#212c3a;
    --bg-chrome-alt2:#283544;
    --parchment:#f3ecdc;
    --parchment-alt:#eadfc6;
    --ink:#2a2420;
    --ink-soft:#5b5346;
    --line:#3a4658;
    --line-parchment:#cbb98c;
    --gold:#c99a4a;
    --gold-strong:#e0b567;
    --text-light:#e9e2d0;
    --text-light-soft:#9aa3b3;

    --cat-person:#c0554a;
    --cat-nation:#3f7ea6;
    --cat-dynasty:#8259ac;
    --cat-event:#c99a4a;
    --cat-war:#8a3a3a;
    --cat-revolution:#3f8f74;
    --cat-treaty:#7a6a52;

    --header-h:68px;
    --footer-h:104px;
  }

  *{box-sizing:border-box;}
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-chrome);
    color:var(--text-light);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Spectral',Georgia,serif; }

  a{color:var(--gold-strong);}

  :focus-visible{
    outline:2px solid var(--gold-strong);
    outline-offset:2px;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100%;
  }

  /* ---------- Header ---------- */
  #app-header{
    height:var(--header-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
  }
  #app-header h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text-light);
  }
  #app-header .subtitle{
    margin:2px 0 0;
    font-size:12px;
    color:var(--text-light-soft);
    font-family:'Inter',sans-serif;
  }
  .header-year{
    text-align:right;
  }
  .header-year .label{
    font-size:11px;
    color:var(--text-light-soft);
    display:block;
    margin-bottom:2px;
  }
  .header-year .value{
    font-family:'Spectral',serif;
    font-size:24px;
    font-weight:600;
    color:var(--gold-strong);
    white-space:nowrap;
  }

  /* ---------- Main layout ---------- */
  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }

  /* Sidebar */
  #sidebar{
    width:230px;
    flex:0 0 auto;
    background:var(--bg-chrome-alt);
    border-right:1px solid var(--line);
    padding:18px 16px;
    overflow-y:auto;
  }
  #sidebar h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-light);
  }
  .filter-list{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 6px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
  }
  .filter-row:hover{ background:var(--bg-chrome-alt2); }
  .filter-row input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px; height:14px;
    flex:0 0 auto;
  }
  .swatch{
    width:10px; height:10px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }
  .filter-row .fname{
    flex:1 1 auto;
    font-size:13px;
    color:var(--text-light);
  }
  .filter-row .fcount{
    font-size:11px;
    color:var(--text-light-soft);
  }

  .filter-actions{
    display:flex;
    gap:10px;
    margin:12px 0 18px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--gold-strong);
    font-size:12px;
    padding:0;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .link-btn:hover{ text-decoration:underline; }

  .search-box{
    margin-bottom:18px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .search-box label{
    display:block;
    font-size:12px;
    color:var(--text-light-soft);
    margin-bottom:6px;
  }
  .search-box input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text-light);
    font-size:13px;
    padding:5px 2px;
    font-family:'Inter',sans-serif;
  }
  .search-box input:focus{
    border-bottom-color:var(--gold-strong);
    outline:none;
  }

  .stats{
    font-size:11.5px;
    color:var(--text-light-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .stats b{ color:var(--gold-strong); font-weight:600; }

  /* Map */
  #mapWrap{
    flex:1 1 auto;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg-chrome-alt);
  }
  .leaflet-tile-pane{
    filter:grayscale(18%) sepia(10%) saturate(85%) contrast(0.96) brightness(0.97);
  }
  .entry-label{
    background:rgba(27,36,48,.82) !important;
    border:none !important;
    box-shadow:none !important;
    color:#f3ecdc !important;
    font-family:'Inter',sans-serif;
    font-size:11px;
    padding:1px 6px !important;
    border-radius:3px !important;
  }
  .entry-label::before{ display:none; }

  /* クラスター(ピンの重なり)アイコン */
  .cluster-marker-wrap{ background:none !important; border:none !important; }
  .cluster-badge{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--bg-chrome-alt2);
    border:2px solid var(--gold-strong);
    color:var(--gold-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600;
    box-shadow:0 0 0 3px rgba(27,36,48,.55);
  }
  .leaflet-cluster-spider-leg{
    stroke:var(--gold-strong) !important;
    stroke-opacity:.6 !important;
  }

  /* Detail panel */
  #detailPanel{
    width:340px;
    flex:0 0 auto;
    background:var(--parchment);
    color:var(--ink);
    border-left:1px solid var(--line-parchment);
    overflow-y:auto;
    position:relative;
    transition:margin-right .22s ease;
  }
  #detailPanel.hidden{
    margin-right:-340px;
  }
  @media (prefers-reduced-motion: reduce){
    #detailPanel{ transition:none; }
  }
  #closeDetail{
    position:absolute;
    top:12px; right:12px;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line-parchment);
    background:var(--parchment-alt);
    color:var(--ink);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  #closeDetail:hover{ background:#e0d3ac; }
  #detailContent{ padding:26px 22px 30px; }
  .detail-badge{
    display:inline-block;
    font-size:11px;
    color:#fff;
    padding:3px 9px;
    border-radius:3px;
    margin-bottom:12px;
  }
  #detailContent h3{
    margin:0 0 6px;
    font-size:21px;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
  }
  .detail-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-parchment);
  }
  .detail-meta div{ margin-top:3px; }
  #detailContent p{
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    margin:0;
  }
  .desc-sections{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .desc-section{
    padding-left:12px;
    border-left:3px solid var(--line-parchment);
  }
  .desc-section.sec-background{ border-left-color:#3f7ea6; }
  .desc-section.sec-process{ border-left-color:#c99a4a; }
  .desc-section.sec-significance{ border-left-color:#3f8f74; }
  .desc-section.sec-debate{ border-left-color:#8a3a3a; }
  .desc-label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .desc-section.sec-background .desc-label{ color:#3f7ea6; }
  .desc-section.sec-process .desc-label{ color:#a67c2e; }
  .desc-section.sec-significance .desc-label{ color:#2f7358; }
  .desc-section.sec-debate .desc-label{ color:#8a3a3a; }
  .desc-text{
    font-size:13.5px;
    line-height:1.8;
    color:var(--ink);
    margin:0;
  }
  .detail-empty{
    padding:40px 22px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.8;
  }

  .back-btn{
    display:inline-block;
    background:none;
    border:1px solid var(--line-parchment);
    color:var(--ink-soft);
    font-size:12px;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:hover{ background:var(--parchment-alt); }

  .related-persons{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line-parchment);
  }
  .related-persons h4{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-family:'Inter',sans-serif;
  }
  .related-persons ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .person-list-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:9px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .person-list-item:hover{ background:var(--parchment-alt); }
  .person-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .person-years{
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .related-persons-empty{
    font-size:12px;
    color:var(--ink-soft);
    padding-top:2px;
  }

  /* Footer timeline */
  #timeline{
    height:var(--footer-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 22px;
  }
  #playBtn{
    flex:0 0 auto;
    background:var(--bg-chrome-alt2);
    border:1px solid var(--line);
    color:var(--gold-strong);
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  #playBtn:hover{ background:#31405490; }

  .timeline-track-wrap{
    flex:1 1 auto;
    position:relative;
    padding-top:6px;
    padding-bottom:22px;
  }
  #yearSlider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--line-parchment);
    outline:none;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:16px; height:16px;
    border:none;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
  }
  .ticks{
    position:relative;
    height:16px;
    margin-top:6px;
  }
  .tick{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    font-size:10.5px;
    color:var(--text-light-soft);
    white-space:nowrap;
  }
  .tick::before{
    content:"";
    position:absolute;
    top:-16px; left:50%;
    width:1px; height:6px;
    background:var(--line);
  }

  .speed-control{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .speed-control label{
    font-size:11px;
    color:var(--text-light-soft);
  }
  .speed-control select{
    background:var(--bg-chrome-alt2);
    color:var(--text-light);
    border:1px solid var(--line);
    border-radius:5px;
    padding:6px 8px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }

  /* Responsive: narrow screens */
  @media (max-width: 760px){
    #sidebar{
      width:100%;
      position:absolute;
      z-index:900;
      height:auto;
      max-height:55%;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    #detailPanel{
      position:absolute;
      right:0; left:0; top:auto; bottom:0;
      width:auto;
      height:60%;
      border-left:none;
      border-top:1px solid var(--line-parchment);
      transition:transform .22s ease;
      z-index:950;
    }
    #detailPanel.hidden{
      margin-right:0;
      transform:translateY(100%);
    }
    #timeline{ gap:10px; padding:0 12px; }
    .speed-control label{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <header id="app-header">
    <div>
      <h1>ヨーロッパ史 地図で学ぶ世界史</h1>
      <p class="subtitle">紀元前3000年 〜 西暦2000年 ・ 高校世界史探究 学習用</p>
    </div>
    <div class="header-year">
      <span class="label">現在の年代</span>
      <span class="value" id="yearDisplay">紀元前500年</span>
    </div>
  </header>

  <div id="main">

    <aside id="sidebar">
      <h2>ジャンルで絞り込み</h2>
      <div class="filter-list" id="filterList"></div>
      <p style="font-size:11px; color:var(--text-light-soft); line-height:1.6; margin:8px 2px 0;">
        ※人物は単独のピンではなく、関連する国家・王朝のピンをクリックした先の一覧から見られます。
      </p>

      <div class="filter-actions">
        <button class="link-btn" id="selectAllBtn">すべて表示</button>
        <button class="link-btn" id="selectNoneBtn">すべて解除</button>
      </div>

      <div class="search-box">
        <label for="searchInput">名称で検索</label>
        <input type="text" id="searchInput" placeholder="例: ナポレオン、フランス革命">
      </div>

      <div class="stats">
        <b id="visibleCount">0</b> 件を表示中 / 全 <b id="totalCount">0</b> 件のデータ
      </div>
    </aside>

    <div id="mapWrap">
      <div id="map"></div>
    </div>

    <aside id="detailPanel" class="hidden">
      <button id="closeDetail" aria-label="閉じる">×</button>
      <div id="detailContent">
        <div class="detail-empty">地図上のピンをクリックすると、ここに詳しい解説が表示されます。</div>
      </div>
    </aside>

  </div>

  <footer id="timeline">
    <button id="playBtn">▶ 再生</button>
    <div class="timeline-track-wrap">
      <input type="range" id="yearSlider" min="-3000" max="2000" step="1" value="-500">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="speed-control">
      <label for="speedSelect">速度</label>
      <select id="speedSelect">
        <option value="1">×1</option>
        <option value="5" selected>×5</option>
        <option value="20">×20</option>
        <option value="50">×50</option>
      </select>
    </div>
  </footer>

</div>

<script>
/* =========================================================================
   ヨーロッパ史 地図アプリ — データ本体
   -------------------------------------------------------------------------
   ジャンル(category)は以下の7種:
     person     人物
     nation     国家
     dynasty    王朝
     event      事件・出来事
     war        戦争・戦い
     revolution 革命
     treaty     条約

   各エントリの形式:
   {
     id:       一意の文字列ID
     name:     表示名(日本語)
     category: 上記7種のいずれか
     lat, lng: 地図上の座標(代表都市・場所)
     start:    存在/在位/発生開始年(西暦。紀元前はマイナスで表現。例: 紀元前500年 = -500)
     end:      終了年(単発の出来事は start と同じか、数年程度の幅を持たせる)
     region:   地域・国名の補助タグ
     desc:     詳細説明文
   }

   ★ データは今後、国・地域ごとに分割して追加していきます。
     新しいブロックを追加する際は、この配列に要素を push する形で
     どんどん拡張できます(下記はコメントで地域ごとに区切り済み)。
   ========================================================================= */

const historicalData = [

  // ===================== 古代オリエント・エーゲ海世界 =====================
  { id:'egypt_old', name:'古代エジプト(ファラオの時代)', category:'nation', lat:30.04, lng:31.24, start:-3000, end:-30, region:'エジプト',
    desc:{
      background:'ナイル川の規則的な氾濫が肥沃な土壌と灌漑農業をもたらし、治水・暦法を統括する必要から強力な中央集権的王権(ファラオ)が早期に形成された。',
      process:'前3000年頃の上下エジプト統一に始まり、古王国でピラミッド建設、中王国・新王国で対外拡大を経験したが、末期王朝以降はアッシリア・ペルシア・マケドニアなど外来勢力の支配下に置かれることが増えた。',
      significance:'神権政治・巨大建造物・ヒエログリフに代表される文明様式は地中海世界に長く影響を与え、ヘレニズム期・ローマ期を通じて地中海文明の基層の一つとなった。',
      debate:'ピラミッド建設の労働力が奴隷か賦役に基づく自由民かという論争や、王権を『神権的専制』と単純に一般化することの妥当性が議論の的となっている。'
    } },
  { id:'minoan', name:'ミノア文明(クレタ文明)', category:'nation', lat:35.3, lng:25.16, start:-2700, end:-1450, region:'ギリシャ・クレタ島',
    desc:{
      background:'エーゲ海交易の要衝という地理条件と、エジプト・オリエント先進文明との交流が、非武装・開放的な宮殿文明の成立を支えた。',
      process:'クノッソスなど複数の宮殿都市が並立して栄えたが、前1450年頃に多くの宮殿で破壊が集中し、以後ミケーネ人の影響下に入った。',
      significance:'線文字Aやフレスコ画に見る洗練された宮廷文化はギリシア文明の先駆となり、後のミケーネ文明の形成にも影響を及ぼした。',
      debate:'衰退の原因はサントリーニ島(テラ)の火山噴火説、地震説、ミケーネ人による征服説などが並立し、単一の決定打は確定していない。'
    } },
  { id:'mycenae', name:'ミケーネ文明', category:'nation', lat:37.73, lng:22.76, start:-1600, end:-1100, region:'ギリシャ本土',
    desc:{
      background:'クレタ文明の影響を受けつつ、ギリシア本土の戦士貴族層が各地に城塞王宮を築いたことが、この文明の政治的基盤となった。',
      process:'線文字Bによる官僚的な物資管理を伴う城塞王宮が各地に分立していたが、前1200年頃、いわゆる『海の民』の活動や内部対立などが重なり広範囲で宮殿が破壊された。',
      significance:'その崩壊は東地中海全域を巻き込む『青銅器時代の終焉』の一環をなし、以後ギリシアは文字資料を欠く暗黒時代(初期鉄器時代)に入った。',
      debate:'崩壊要因を外的侵入のみに帰すのは近年後退しており、気候変動・内乱・交易網の連鎖的崩壊など複合的要因説が有力視されている。'
    } },

    } },
  { id:'antigonid_macedon', name:'アンティゴノス朝マケドニア', category:'nation', lat:40.77, lng:22.52, start:-306, end:-168, region:'マケドニア',
    desc:{
      background:'ディアドコイ戦争を経てマケドニア本国を確保したアンティゴノス家が、ギリシア本土への影響力維持を国家目標としたことが背景にある。',
      process:'ギリシア諸都市への介入を続けたが、地中海西方で急速に台頭するローマとの間でマケドニア戦争が繰り返され、ピュドナの戦い(前168年)での決定的敗北によりローマの属州へと組み込まれた。',
      significance:'この滅亡はヘレニズム世界におけるローマの本格的な東方進出の先駆けとなり、以後ギリシア世界全体が徐々にローマの勢力圏に組み込まれていく契機となった。',
      debate:'ローマの東方進出を『招かれざる介入』とみるか、ギリシア諸都市間の対立に乗じた『計算された膨張政策』とみるかで議論がある。'
    } },

  // ===================== ローマ共和政の変質 =====================

  { id:'gracchi_reform', name:'グラックス兄弟の改革', category:'event', lat:41.9, lng:12.49, start:-133, end:-121, region:'ローマ',

      background:'属州からの安価な穀物流入とラティフンディア(奴隷を用いた大土地所有)の拡大により、中小自作農が没落し社会不安が高まっていたことが背景にある。',
      process:'護民官となった兄ティベリウスが公有地の再分配を図る農地法を制定したが、再選を試みた際に反対派に殺害され、弟ガイウスも同様の改革を継承しようとして元老院派との衝突の末に自害に追い込まれた。',

  { id:'marius', name:'マリウス', category:'person', lat:41.9, lng:12.49, start:-157, end:-86, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'対外戦争(ユグルタ戦争、ゲルマン人侵入など)の長期化により、従来の財産資格に基づく徴兵制では兵員確保が困難になっていたことが軍制改革の背景にある。',
      process:'無産市民を志願兵として編成し将軍個人への忠誠に依存する職業軍隊へと軍の性格を転換させ、7回にわたり執政官(コンスル)に選出される異例の権勢を誇ったが、政敵スラとの対立から内乱に発展した。',

  { id:'sulla', name:'スラ', category:'person', lat:41.9, lng:12.49, start:-138, end:-78, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'マリウス派との権力抗争の中、軍を率いてローマ市内に進軍するという前例のない実力行使が、その後の政治的立場を確立する契機となった。',
      process:'内乱に勝利した後、期限を定めない独裁官(ディクタトル)に就任して政敵を『追放者名簿(プロスクリプティオ)』により組織的に粛清し、元老院の権威を強化する体制改革を行った上で自ら政界から引退した。',
      significance:'軍事力を背景とした独裁とそれに続く自発的な権力放棄という前例は、後のカエサル・アウグストゥスらの行動を評価する際の重要な参照点となった。',
      debate:'元老院支配の再建を目指した『保守的改革者』とみるか、恐怖政治(プロスクリプティオ)による粛清政治の先例を作った人物とみるかで評価が分かれる。'
    } },
  { id:'first_triumvirate', name:'第一回三頭政治', category:'event', lat:41.9, lng:12.49, start:-60, end:-53, region:'ローマ',
    desc:{
      background:'元老院保守派によりそれぞれの政治的要求(カエサルの執政官職、ポンペイウスの東方処置の追認、クラッススの徴税請負契約問題)が阻まれていたことが、非公式同盟結成の動機となった。',
      process:'3人が私的に協力して元老院の頭越しに政治を動かす体制を築いたが、クラッススがパルティア遠征(カルラエの戦い)で戦死したことで力の均衡が崩れ、残る2人の対立が表面化した。',
      significance:'非公式ながら国家権力を私的に分割・独占するこの体制は、共和政の統治原理(集団指導・任期制)が事実上機能不全に陥っていたことを象徴する出来事となった。',
      debate:'この同盟を単なる『野合』とみるか、機能不全に陥った共和政を補完する現実的な統治手法とみるかは、共和政末期の政治史理解における一つの論点である。'
    } },
  { id:'pompey', name:'ポンペイウス', category:'person', lat:41.9, lng:12.49, start:-106, end:-48, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'スラの部下として頭角を現し、地中海の海賊掃討や東方(ミトリダテス戦争)での軍事的成功により絶大な名声と兵力を得たことが権勢の背景にある。',
      process:'第一回三頭政治の一角として実権を握ったが、クラッスス戦死後カエサルとの対立が先鋭化し、内乱の末ファルサロスの戦いで大敗し、逃亡先のプトレマイオス朝エジプトで暗殺された。',
      significance:'その死は内乱の終結ではなくカエサルの単独覇権確立を導き、結果的に共和政の実質的終焉を早める結果となった。',
      debate:'共和政の擁護者として戦ったとされる一方、自身も三頭政治で非合法的な権力集中を行っており、『共和政の守護者』という評価には限界があると指摘される。'
    } },
  { id:'rubicon_crossing', name:'ルビコン川渡河', category:'event', lat:44.06, lng:12.57, start:-49, end:-49, region:'イタリア(ルビコン川)',
    desc:{
      background:'元老院がカエサルに軍の解散と属州総督職の返上を要求したことに対し、これに従えば政敵に訴追され失脚することが確実視されたため、武力による解決以外の選択肢が狭められていた。',
      process:'カエサルは属州との境界であるルビコン川を、軍を率いたまま越えるという反逆行為に踏み切り、『賽は投げられた』の言葉とともに内乱を開始した。',

      debate:'この決断を野心に基づく違法な権力奪取とみるか、機能不全に陥った政治体制のもとでの実質的な自己防衛とみるかは、カエサル評価全体に関わる根本的な論点である。'

  { id:'cleopatra', name:'クレオパトラ7世', category:'person', lat:31.2, lng:29.92, start:-69, end:-30, region:'プトレマイオス朝エジプト', parentId:'ptolemaic_egypt',
    desc:{

      process:'内紛の中でカエサルの支持を得て王位を確保し、その死後はアントニウスと結んでローマの東方支配に対抗しようとしたが、アクティウムの海戦での敗北後、オクタウィアヌスの支配を拒み自殺したと伝えられる。',

      debate:'後世(特にローマ側のプロパガンダや文学作品)による『妖婦』としての表象と、実際には複数言語に通じ巧みな政治・外交手腕を発揮した統治者としての実像との乖離が近年強く指摘されている。'

  { id:'second_triumvirate', name:'第二回三頭政治', category:'event', lat:41.9, lng:12.49, start:-43, end:-33, region:'ローマ',
    desc:{

  { id:'battle_actium', name:'アクティウムの海戦', category:'war', lat:38.95, lng:20.75, start:-31, end:-31, region:'ギリシャ(アクティウム沖)',

      significance:'この勝利によりオクタウィアヌスは地中海世界唯一の支配者となり、翌年のエジプト併合を経て、名実ともに共和政から帝政への移行が確定した。',
      debate:'オクタウィアヌス側のプロパガンダは、この戦いを『ローマ対東方の女王』という文明対決の構図で正当化しており、実態以上に誇張された宣伝であったとの指摘がある。'

  { id:'trajan', name:'トラヤヌス帝', category:'person', lat:41.9, lng:12.49, start:53, end:117, region:'ローマ帝国', parentId:'rome_empire',

  { id:'hadrian', name:'ハドリアヌス帝', category:'person', lat:55, lng:-2.5, start:76, end:138, region:'ローマ帝国(ブリタンニア)', parentId:'rome_empire',

  { id:'marcus_aurelius', name:'マルクス・アウレリウス帝', category:'person', lat:41.9, lng:12.49, start:121, end:180, region:'ローマ帝国', parentId:'rome_empire',

      significance:'その死をもって五賢帝時代(養子縁組による有能な後継者選出の慣行)は終わり、実子コンモドゥスへの世襲によって帝国は不安定化へと向かった。',
      debate:'『哲人皇帝』としての理想化されたイメージに対し、実際の治世は疫病(アントニヌスの疫病)や軍事的消耗に苦しんだ困難な時代であったことも重視される。'

  { id:'crisis_third_century', name:'3世紀の危機', category:'event', lat:41.9, lng:12.49, start:235, end:284, region:'ローマ帝国',
    desc:{

      debate:'危機の主因を軍事的要因(異民族侵入)に求める説と、経済的要因(貨幣経済の崩壊)や制度的要因(継承ルールの欠如)を重視する説が併存し、複合的理解が主流となっている。'

  { id:'edict_of_milan', name:'ミラノ勅令', category:'treaty', lat:45.46, lng:9.19, start:313, end:313, region:'イタリア(ミラノ)',
    desc:{
      background:'3世紀の危機を経て多様化した帝国内の宗教状況の中、キリスト教徒が既に無視できない社会的勢力となっていたことが公認の現実的背景にある。',
      process:'コンスタンティヌスと東の正帝リキニウスが会談・合意し、帝国内での信仰の自由(キリスト教を含む)を認める勅令を連名で発した。',
      significance:'それまでの断続的な迫害政策を転換し、キリスト教が公然と組織・布教活動を行うことを可能にしたことで、後の国教化(392年)への道を開いた。',
      debate:'厳密には『寛容令』であり『公認』にとどまるが、後世これを『キリスト教の勝利』の起点として過度に強調する叙述には歴史学的な留保が必要とされる。'
    } },
  { id:'battle_adrianople', name:'アドリアノープルの戦い', category:'war', lat:41.68, lng:26.56, start:378, end:378, region:'トラキア(アドリアノープル)',
    desc:{
      background:'フン族の圧迫を逃れてドナウ川を渡り帝国領内への定住を求めた西ゴート族に対し、ローマ側官吏の不正な扱い(食料供給の搾取など)が反乱を誘発した。',
      process:'皇帝ウァレンスが援軍を待たずに交渉決裂後ただちに攻撃を仕掛けたが、西ゴート騎兵の奇襲を受けてローマ軍主力は包囲・壊滅し、皇帝自身も戦死した。',

      background:'中央アジアから移動してきたセルジューク朝トルコの遊牧軍事勢力が、アナトリア東部への進出を強めていたことが対立の背景にある。',
      process:'皇帝ロマノス4世自ら軍を率いて迎撃したが、内部の裏切り(予備軍の撤退)もあり大敗を喫し、皇帝自身が捕虜となるという屈辱的な結果に終わった。',

  // ===================== 東西教会の分裂とスラヴ世界 =====================

    desc:{

  { id:'cyril_methodius', name:'キュリロスとメトディオス', category:'person', lat:42.7, lng:23.32, start:826, end:885, region:'ビザンツ帝国(スラヴ人布教)',
    desc:{

  { id:'kievan_rus', name:'キエフ公国(キエフ・ルーシ)', category:'nation', lat:50.45, lng:30.52, start:882, end:1240, region:'東スラヴ(現ウクライナ・ロシア)',
    desc:{
      background:'スカンディナヴィアから東欧の河川交易路(『ヴァリャーグからギリシアへの道』)に進出したノルマン系ルーシ人が、東スラヴ人の諸部族と結びついたことが国家形成の背景にある。',

      significance:'ギリシア正教とキリル文字文化の受容は、後のモスクワ大公国、さらにはロシア帝国へと続くロシア文明の宗教的・文化的基盤を築いた。',

    } },
  { id:'bulgarian_empire', name:'ブルガリア帝国(第一次)', category:'nation', lat:42.7, lng:23.32, start:681, end:1018, region:'バルカン半島',
    desc:{
      background:'バルカン半島に定住したブルガール人(テュルク系遊牧民)がスラヴ人と融合し独自の国家を築いたことが、ビザンツと並び立つ勢力形成の背景にある。',
      process:'しばしばビザンツと戦い一時は皇帝を称するほどの強国となったが、皇帝バシレイオス2世(『ブルガロクトノス=ブルガリア人殺し』の異名で知られる)による長期の征服戦争の末、1018年に完全にビザンツに征服された。',

      debate:'ビザンツ側史料に依拠する叙述はブルガリア側を『蛮族』として描く傾向が強く、近年はブルガリア独自の高度な国家機構・文化を再評価する研究が進んでいる。'
    } },

  // ===================== ビザンツ帝国の展開 =====================
  { id:'theodora_byzantine', name:'テオドラ(ユスティニアヌス1世妃)', category:'person', lat:41.01, lng:28.98, start:500, end:548, region:'ビザンツ帝国', parentId:'byzantine',

  { id:'nika_riots', name:'ニカの乱', category:'event', lat:41.01, lng:28.98, start:532, end:532, region:'コンスタンティノープル',
    desc:{
      background:'戦車競走の観客派閥(青党・緑党)対立という娯楽面の緊張に、重税や司法運営への民衆の不満が重なったことが暴動拡大の背景にある。',
      process:'当初は些細な処罰への抗議から始まったが急速に反乱に発展し、皇帝退位・新皇帝擁立の動きにまで至ったが、テオドラの叱咤を受けたユスティニアヌスが将軍ベリサリウスらに命じ、競技場に閉じ込めた民衆を虐殺して鎮圧した。',
      significance:'多数の死者と首都の破壊を伴ったが、この危機を乗り切ったことで皇帝権力はかえって強化され、焼失した大聖堂の再建(ハギア・ソフィア建設)という大事業に着手する契機ともなった。',

    } },
  { id:'hagia_sophia', name:'ハギア・ソフィア大聖堂の建設', category:'event', lat:41.01, lng:28.98, start:532, end:537, region:'コンスタンティノープル',

      process:'科学者出身の建築家2名を起用し、当時の建築技術の限界に挑む巨大なドーム架構を実現し、わずか5年余りという異例の短期間で完成させた。',
      significance:'その建築様式は以後のビザンツ・正教圏の教会建築の規範となり、オスマン帝国支配下でモスクに転用された際にはイスラーム建築(モスクのドーム様式)にも大きな影響を与えた。',

  { id:'macedonian_dynasty', name:'マケドニア朝(ビザンツ)', category:'dynasty', lat:41.01, lng:28.98, start:867, end:1056, region:'ビザンツ帝国',
    desc:{

  { id:'komnenian_dynasty', name:'コムネノス朝(ビザンツ)', category:'dynasty', lat:41.01, lng:28.98, start:1081, end:1185, region:'ビザンツ帝国',
    desc:{
      background:'マンジケルトの敗北後の内乱・領土喪失という危機的状況が、軍事的手腕に長けたコムネノス家による強力な指導を求める機運を生んだ。',

  { id:'fourth_crusade', name:'第4回十字軍とコンスタンティノープル占領', category:'war', lat:41.01, lng:28.98, start:1202, end:1204, region:'コンスタンティノープル',

      process:'ビザンツの帝位継承争いに介入するうちに市民の反発を招いて交渉が決裂し、最終的に十字軍はキリスト教徒の都であるコンスタンティノープルを攻撃・占領して徹底的に略奪した。',
      significance:'この占領によりビザンツ帝国は一時消滅し(ラテン帝国建国、ビザンツはニカイア帝国などに分裂)、1261年に旧領を回復してもかつての国力を取り戻すことはなく、結果的にオスマン帝国による最終的滅亡を早めた。',
      debate:'同じキリスト教徒による聖地遠征がキリスト教徒の都を破壊するという矛盾は十字軍運動全体の宗教的正当性への疑問を招き、東西教会の亀裂を決定的に深めた出来事として重視される。'
    } },
  { id:'palaiologan_dynasty', name:'パレオロゴス朝(ビザンツ最後の王朝)', category:'dynasty', lat:41.01, lng:28.98, start:1261, end:1453, region:'ビザンツ帝国',

      process:'内紛(帝位をめぐる内戦)とオスマン帝国の圧迫が続く中、西方への援助要請と引き換えに東西教会合同を試みる(フィレンツェ公会議など)などの延命策も奏功せず、1453年にメフメト2世の攻撃で滅亡した。',

      debate:'軍事的・経済的に既に『帝国』と呼ぶに値しない小勢力に過ぎなかったとする見方もあるが、その文化的発信力を重視して『最後の輝き』として再評価する研究もある。'

  { id:'mehmed_ii', name:'メフメト2世', category:'person', lat:41.01, lng:28.98, start:1432, end:1481, region:'オスマン帝国', parentId:'ottoman_empire',
    desc:{
      background:'先代スルタンたちが果たせなかったコンスタンティノープル攻略を、若くして即位した野心的な統治者として自らの威信をかけた目標に据えた。',
      process:'巨砲(ウルバンの大砲)を用いた砲撃と艦船の陸上運搬という奇策を駆使して難攻不落とされた城壁を突破し、1453年に陥落させてビザンツ帝国を滅ぼした。',

      debate:'征服者としての軍事的評価に加え、多宗教共存を可能にした統治手腕を重視する再評価が進んでおり、単なる『破壊者』ではなく『建設者』としての側面も強調される。'
    } },
  { id:'ottoman_empire', name:'オスマン帝国', category:'nation', lat:41.01, lng:28.98, start:1299, end:1922, region:'アナトリア〜バルカン半島・中東・北アフリカ',

      process:'バルカン半島への早期進出とコンスタンティノープル攻略(1453年)を経て、スレイマン1世の時代にウィーン包囲や地中海制海権掌握など最大版図・最盛期を迎えたが、その後は近代化の遅れと諸民族の独立運動により徐々に領土を失った。',

      debate:'『停滞したイスラーム専制国家』という西欧中心的な伝統的評価に対し、近年は柔軟な多民族統治システムや近代化改革(タンジマート)の意義を再評価する研究が進んでいる。'
    } },

  // ===================== 西ヨーロッパ中世世界(封建社会・教皇権)の補強 =====================

  { id:'otto_i', name:'オットー1世(大帝)', category:'person', lat:50.78, lng:6.08, start:912, end:973, region:'東フランク(ドイツ)', parentId:'hre',

    } },
  { id:'investiture_controversy', name:'叙任権闘争(カノッサの屈辱)', category:'event', lat:44.53, lng:10.45, start:1075, end:1122, region:'神聖ローマ帝国・イタリア(カノッサ)',
    desc:{
      background:'聖職者(特に司教)の任命権を世俗権力(皇帝)が握る慣行に対し、教会改革運動(グレゴリウス改革)の高まりの中で教皇権が異議を唱えたことが対立の背景にある。',
      process:'教皇グレゴリウス7世が皇帝ハインリヒ4世を破門すると、諸侯の離反を恐れた皇帝はカノッサ城で雪中3日間許しを乞い(『カノッサの屈辱』)、以後も断続的に争いが続いた末、1122年のヴォルムス協約で世俗叙任と教会叙任を区別する妥協が成立した。',

      debate:'『屈辱』という劇的な演出の裏で、実際には皇帝側も政治的には巧みに危機を乗り切ったとする見方もあり、単純な教皇権勝利の物語には留保が必要とされる。'
    } },
  { id:'feudalism_manorialism', name:'封建社会(封建制と荘園制)の成立', category:'event', lat:48.86, lng:2.35, start:800, end:1100, region:'西ヨーロッパ全域',

  { id:'nebuchadnezzar_ii', name:'ネブカドネザル2世', category:'person', lat:32.54, lng:44.42, start:-634, end:-562, region:'新バビロニア王国', parentId:'neo_babylonia',
    desc:{

  { id:'babylonian_captivity', name:'バビロン捕囚', category:'event', lat:32.54, lng:44.42, start:-597, end:-538, region:'新バビロニア(バビロン)',

  { id:'croesus', name:'クロイソス王', category:'person', lat:38.49, lng:28.04, start:-595, end:-546, region:'リディア', parentId:'lydia',

  // ===================== アケメネス朝ペルシア =====================
  { id:'achaemenid_persia', name:'アケメネス朝ペルシア', category:'nation', lat:29.94, lng:52.89, start:-550, end:-330, region:'イラン高原を中心に西アジア全域',

  { id:'cyrus_the_great', name:'キュロス2世(大王)', category:'person', lat:29.94, lng:52.89, start:-600, end:-530, region:'アケメネス朝ペルシア', parentId:'achaemenid_persia',

      process:'メディア・リディア・新バビロニアを次々に征服してオリエントを統一し、バビロン征服に際してはユダヤ人捕囚民の解放・エルサレム神殿再建の許可など、被征服民の宗教・慣習を尊重する統治方針を打ち出した。',

  { id:'cambyses_ii', name:'カンビュセス2世', category:'person', lat:29.94, lng:52.89, start:-529, end:-522, region:'アケメネス朝ペルシア', parentId:'achaemenid_persia',
    desc:{

      process:'ペルシウムの戦いなどでエジプト軍を破って征服し、オリエント全域の再統一を完成させたが、遠征中の混乱の中で謎の死を遂げ、後継をめぐり帝国内で内乱が生じた。',
      significance:'エジプト征服によりアケメネス朝は西アジアから北アフリカにまたがる史上最大級の帝国となり、この統一状態は後継のダレイオス1世による統治機構整備の前提となった。',
      debate:'ギリシア人史料(ヘロドトス)は彼を残虐で精神的に不安定な暴君として描くが、エジプト側の同時代史料はより穏健な統治者像を伝えており、史料間の食い違いが評価を難しくしている。'

  { id:'darius_i', name:'ダレイオス1世', category:'person', lat:29.94, lng:52.89, start:-550, end:-486, region:'アケメネス朝ペルシア', parentId:'achaemenid_persia',

  { id:'xerxes_i', name:'クセルクセス1世', category:'person', lat:29.94, lng:52.89, start:-518, end:-465, region:'アケメネス朝ペルシア', parentId:'achaemenid_persia',

  { id:'darius_iii', name:'ダレイオス3世', category:'person', lat:29.94, lng:52.89, start:-380, end:-330, region:'アケメネス朝ペルシア', parentId:'achaemenid_persia',

  { id:'zoroastrianism', name:'ゾロアスター教の成立', category:'event', lat:35.7, lng:51.42, start:-1200, end:-600, region:'イラン高原(生没年・成立年代には諸説あり)',

  { id:'khufu', name:'クフ王', category:'person', lat:29.98, lng:31.13, start:-2589, end:-2566, region:'古代エジプト(古王国)', parentId:'egypt_old',

  { id:'pyramid_giza', name:'ギザの大ピラミッド建設', category:'event', lat:29.98, lng:31.13, start:-2560, end:-2540, region:'エジプト(ギザ)',

  { id:'hatshepsut', name:'ハトシェプスト女王', category:'person', lat:29.98, lng:31.13, start:-1507, end:-1458, region:'古代エジプト(新王国)', parentId:'egypt_old',

  { id:'akhenaten', name:'アクエンアテン(アメンホテプ4世)', category:'person', lat:29.98, lng:31.13, start:-1351, end:-1334, region:'古代エジプト(新王国)', parentId:'egypt_old',

  { id:'ramesses_ii', name:'ラメセス2世', category:'person', lat:29.98, lng:31.13, start:-1279, end:-1213, region:'古代エジプト(新王国)', parentId:'egypt_old',

    desc:{
      background:'アテネ民主政の最盛期(ペリクレス時代)という安定した文化的環境の中で、悲劇コンクールにおいて度重なる優勝を重ねた劇作家としての地位を確立した。',
      process:'俳優を3人に増やして人間関係の複雑な葛藤を描く技法を発展させ、『オイディプス王』では知らずして父を殺し母と結ばれるという運命の皮肉と人間の意志の限界を描いた。',
      significance:'アリストテレスが『詩学』で悲劇の理想形として賞賛したことにより、西洋演劇理論(カタルシス概念など)の規範的作品としての地位を長く保ち続けた。',
      debate:'『オイディプス王』が示す『運命』と『自由意志』の関係の解釈は、古代から現代の精神分析(エディプス・コンプレックス)に至るまで多様な読解を生み続けている。'
    } },
  { id:'euripides', name:'エウリピデス', category:'person', lat:37.98, lng:23.73, start:-480, end:-406, region:'アテネ', parentId:'athens_polis',
    desc:{
      background:'ペロポネソス戦争による社会不安と伝統的価値観の動揺という時代状況が、人間心理の非合理性・矛盾を掘り下げる作風の背景にあるとされる。',
      process:'『メデイア』など、伝統的英雄像よりも女性・異邦人・弱者の視点や心理の陰影を重視した作品を発表し、当時の観客・批評家からは賛否が分かれた。',
      significance:'神話的英雄を等身大の人間として描くその手法は、後の心理主義的文学・近代演劇に通じる先駆的性格を持つと評価される。',
      debate:'存命中の評価は必ずしも高くなかった(コンクール優勝回数は少ない)が、死後急速に評価が高まった経緯は、同時代評価と後世評価の乖離を示す典型例とされる。'
    } },
  { id:'aristophanes', name:'アリストファネス', category:'person', lat:37.98, lng:23.73, start:-446, end:-386, region:'アテネ', parentId:'athens_polis',
    desc:{
      background:'ペロポネソス戦争下での戦争継続への疲弊と、扇動的な民衆指導者(デマゴーゴス)への不満が広がっていたことが、風刺喜劇の題材の背景にある。',
      process:'実在の政治家・哲学者(ソクラテスを含む)を戯画的に描き、戦争と平和・教育のあり方などを鋭く風刺する作品を次々に発表した。',
      significance:'古喜劇の代表的作家として、政治的言論の自由が保障された民主政アテネならではの自由な批判精神を今に伝える貴重な史料的価値も持つ。',
      debate:'『雲』でソクラテスを戯画的に描いたことが、後のソクラテス裁判における反感醸成に影響したのではないかという指摘があり、風刺と現実の政治的帰結との関係が議論される。'
    } },
  { id:'herodotus', name:'ヘロドトス', category:'person', lat:37.03, lng:27.43, start:-484, end:-425, region:'ハリカルナッソス(小アジア)',
    desc:{
      background:'ペルシア戦争という大事件の記憶が薄れる前に、その経緯と背景にある東西諸民族の文化を記録し伝えようとする問題意識が執筆の動機となった。',
      process:'エジプト・メソポタミア・スキタイなど広範な地域を実地に旅して伝聞・見聞を集め、神話的要素を交えながらも人間の行為に基づく因果関係として歴史を叙述する手法を確立した。',
      significance:'キケロにより『歴史の父』と称され、諸民族の文化を比較的視点から記録するその手法は、後の民族誌(エスノグラフィー)的記述の先駆ともなった。',
      debate:'記述の史実性については、伝聞・誇張・偏見(特に非ギリシア人への視線)を多く含むため、トゥキュディデスと比較して史料批判上の評価がしばしば分かれる。'
    } },
  { id:'thucydides', name:'トゥキディデス', category:'person', lat:37.98, lng:23.73, start:-460, end:-400, region:'アテネ', parentId:'athens_polis',
    desc:{
      background:'自らアテネの将軍として従軍し追放処分も受けた当事者としての経験が、党派的感情を排した客観的記述を目指す姿勢の背景にあるとされる。',
      process:'神託や神々の介入を排し、権力・利害・人間本性(恐怖・名誉・利益)に基づく因果分析によってペロポネソス戦争の経緯を精密に記述した。',
      significance:'『人間の本性は変わらない』という前提のもと将来にも役立つ教訓を残そうとしたその方法論は、近代の政治学・国際関係論(リアリズム学派)にも直接的な影響を与え続けている。',
      debate:'戦争そのものの叙述は未完に終わっており(前411年で中断)、その歴史記述の客観性についても、彼自身の政治的経験・立場からの偏りがなかったかは議論の対象となる。'
    } },
  { id:'hippocrates', name:'ヒポクラテス', category:'person', lat:36.89, lng:26.93, start:-460, end:-370, region:'コス島',
    desc:{
      background:'病気を神罰・呪詛など超自然的原因に帰す伝統的信仰が根強い中、体液(四体液説)のバランスという自然的原因に基づく医学理論への転換が図られた。',
      process:'コス島の医学校を中心に、病状の経過観察・記録を重視する臨床的手法を確立し、医師の職業倫理を定めた『誓い』を後世に残したとされる。',
      significance:'『ヒポクラテスの誓い』は形を変えながら現代の医療倫理(守秘義務、患者第一主義)の原型として今なお参照され続けている。',
      debate:'『ヒポクラテス全集』とされる文書群は実際には彼一人の著作ではなく、複数の医師・学派による著作の集成である可能性が高いとされる。'
    } },
  { id:'diogenes', name:'ディオゲネス', category:'person', lat:37.98, lng:23.73, start:-412, end:-323, region:'アテネ(出身シノペ)',
    desc:{
      background:'貨幣偽造の嫌疑により故郷を追放されたという経歴が、既存の社会的価値・慣習そのものへの根源的懐疑を強める背景となったとされる。',
      process:'樽(甕)を住居とし、昼間に灯りを持って『正直な人間を探している』と称するなど、社会的慣習を徹底的に無視する生き方を実践的に貫いた。',
      significance:'その極端な実践は、自然に従い最小限の欲求で満足する生き方を説く犬儒学派(キュニコス派)の思想を象徴する存在として長く語り継がれた。',
      debate:'多くの逸話は誇張・創作を含む可能性が高く、実在の人物像と後世に形成された『奇人』的イメージとの区別が困難である。'
    } },
  { id:'zeno_stoic', name:'ゼノン(ストア派)', category:'person', lat:37.98, lng:23.73, start:-334, end:-262, region:'アテネ(出身キプロス)', parentId:'athens_polis',
    desc:{
      background:'難破により全財産を失うという個人的苦難の経験が、外的な運命に左右されない内的な徳の探究へ向かう思想的転機となったと伝えられる。',
      process:'アテネの『彩色柱廊(ストア・ポイキレ)』で講義を行い、理性(ロゴス)に従い自然と調和して生きることを説き、感情に動じない『不動心(アパテイア)』を理想とするストア派を創始した。',
      significance:'その禁欲的で自己統御を重視する思想は、後のローマ人(セネカ、エピクテトス、マルクス・アウレリウスら)に広く受け入れられ、西洋倫理思想の主要な柱の一つとなった。',
      debate:'彼自身の著作はほとんど残っておらず、ストア派の教説の多くは後代の弟子・後継者(クリュシッポスら)による体系化を通じて今日に伝わっている。'
    } },
  { id:'epicurus', name:'エピクロス', category:'person', lat:37.98, lng:23.73, start:-341, end:-270, region:'アテネ', parentId:'athens_polis',
    desc:{
      background:'アレクサンドロス大王の急死後の政治的不安定という時代状況の中、公的生活からの引退と個人の内面的平安の追求が思想の背景にあるとされる。',
      process:'『エピクロスの園』と呼ばれる私的な共同体を営み、デモクリトスの原子論を継承しつつ、死への恐怖からの解放と心の平静(アタラクシア)を得ることを幸福の本質と説いた。',
      significance:'誤解に基づき『快楽主義』として批判されることも多いが、その禁欲的で節度ある思想は近代の功利主義や無神論的自然観にも影響を残した。',
      debate:'後世(特にキリスト教社会)における『快楽主義=放縦』という否定的イメージと、実際の教説(質素な生活と友情を重んじる)との乖離は、彼の評価をめぐる重要な論点である。'
    } },
  { id:'archimedes', name:'アルキメデス', category:'person', lat:37.07, lng:15.29, start:-287, end:-212, region:'シチリア(シラクサ)',
    desc:{
      background:'シラクサ王家との縁戚関係を背景に、王室の求めに応じ実用的な工学的問題(王冠の真贋鑑定など)に取り組む機会を得たことが具体的発見の契機となった。',
      process:'浮力の原理やてこの原理、円周率の近似計算などを厳密な数学的証明とともに導き、ローマ軍によるシラクサ包囲戦の際には投石機や『アルキメデスの鉤爪』など防衛兵器の設計にも携わったとされる。',
      significance:'理論と実用を高い水準で統合したその業績は『古代最大の科学者』と評され、後のルネサンス期の力学・工学研究にも大きな影響を及ぼした。',
      debate:'『エウレカ(発見した)』と叫び裸で街を走ったという逸話や、鏡を用いてローマ艦隊を焼いたという伝説の史実性については古くから疑問視されている。'
    } },
  { id:'euclid', name:'エウクレイデス(ユークリッド)', category:'person', lat:31.2, lng:29.92, start:-330, end:-260, region:'アレクサンドリア', parentId:'ptolemaic_egypt',
    desc:{
      background:'プトレマイオス朝の学術振興策のもと、アレクサンドリアに集められた数学的知見を体系的に整理・教授する必要が『原論』編纂の背景にあった。',
      process:'少数の公理・公準から出発し論理的証明を積み重ねて定理を導く『公理的方法』を用いて、平面幾何学・数論にわたる体系を『原論』全13巻にまとめた。',
      significance:'この演繹的論証の方法論は数学のみならず、後の近代科学における論理的思考法の模範として2000年以上にわたり参照され続けた。',
      debate:'彼個人の伝記的情報はほとんど伝わっておらず、『原論』の内容も彼自身の独創というより先行する数学者の成果を体系的に編纂したものである可能性が高いとされる。'
    } },
  { id:'eratosthenes', name:'エラトステネス', category:'person', lat:31.2, lng:29.92, start:-276, end:-194, region:'アレクサンドリア', parentId:'ptolemaic_egypt',
    desc:{
      background:'プトレマイオス朝の国家的事業であったアレクサンドリア図書館の充実が、彼のような博学な学者が多分野を横断的に研究する環境を提供した。',
      process:'シエネ(現アスワン)とアレクサンドリアでの夏至の日の太陽の影の角度差を測定し、両地点間の距離情報と組み合わせる幾何学的手法で地球の全周をかなりの精度で算出した。',
      significance:'この測定は、地球が球体であることを前提とした上で初めてその規模を定量的に示した画期的業績であり、後の地理学・天文学の発展に大きく寄与した。',
      debate:'測定に用いた距離の単位(スタディオン)の実際の長さが地域により異なるため、算出結果の実際の精度については研究者間で評価に幅がある。'
    } },
  { id:'aristarchus', name:'アリスタルコス', category:'person', lat:31.2, lng:29.92, start:-310, end:-230, region:'サモス島/アレクサンドリア', parentId:'ptolemaic_egypt',
    desc:{
      background:'太陽・月の大きさと距離を幾何学的に推定する試みの中で、太陽が地球よりはるかに大きいという計算結果が、天動説的常識への疑問を生んだと考えられる。',
      process:'太陽を中心に地球を含む惑星が公転するという太陽中心説(地動説)を提唱したが、当時主流であった天動説(後のプトレマイオス体系)を覆すには至らなかった。',
      significance:'コペルニクスに先立つこと約1800年の先駆的な地動説として、後世(特に近代科学史)において高く再評価される先見的業績となった。',
      debate:'当時なぜこの説が受け入れられなかったのかについては、恒星の視差が観測されないという当時の観測技術上の限界による反証とされたことが指摘されている。'
    } },

  { id:'struggle_of_orders', name:'身分闘争(聖山事件〜ホルテンシウス法)', category:'event', lat:41.9, lng:12.49, start:-494, end:-287, region:'ローマ',
    desc:{
      background:'貴族(パトリキ)が政治・宗教上の要職と法解釈権を独占し、平民(プレブス)が兵役負担を担いながら政治参加を排除されていたことが対立の根本的背景にある。',
      process:'平民が武力蜂起に近い形で聖山へ集団離脱し(聖山事件)護民官設置を勝ち取ったのを皮切りに、十二表法制定・リキニウス法・ホルテンシウス法などを経て段階的に権利拡大が実現した。',
      significance:'前287年のホルテンシウス法により平民会決議が元老院の承認なしに国法として効力を持つこととなり、法制度上の身分平等が達成された。',
      debate:'法的平等の達成にもかかわらず、経済的実権はなお少数の有力者(新貴族=ノビレス)に集中し続けたため、実質的な平等がどこまで実現したかは議論がある。'
    } },
  { id:'licinian_sextian_laws', name:'リキニウス・セクスティウス法', category:'event', lat:41.9, lng:12.49, start:-367, end:-367, region:'ローマ',
    desc:{
      background:'長期化する身分闘争の中、平民側が最高官職(執政官)への参政権獲得を次の目標として掲げたことが、この法制定を求める運動の背景にある。',
      process:'護民官リキニウスとセクスティウスが10年にわたり法案を提出し続け、最終的に2人の執政官のうち1人を平民から選出することなどを定める法律の成立にこぎつけた。',
      significance:'平民が国家の最高官職に正式に就く道を開いたことで、身分闘争における実質的な政治権力の分有が大きく前進した。',
      debate:'実際に平民出身のコンスルが輩出されるようになっても、有力な平民家系が次第に貴族と同化して新たな支配層(ノビレス)を形成したことは、身分闘争の帰結をどう評価するかに関わる論点である。'
    } },
  { id:'samnite_wars', name:'サムニウム戦争', category:'war', lat:41.57, lng:14.24, start:-343, end:-290, region:'イタリア中南部',
    desc:{
      background:'イタリア中部の肥沃な平野をめぐる勢力圏争いが、ローマと山岳民族サムニウム人との間の長期にわたる緊張を生んだ。',
      process:'3次にわたる戦争を通じ、一時はカウディウムの屈辱(ローマ軍がくびきの下をくぐらされる屈辱的降伏)を喫しながらも、最終的にローマが勝利して中部イタリアの支配権を確立した。',
      significance:'この勝利によりローマはイタリア半島の主要部を実質的に支配下に置き、道路網(アッピア街道)整備などを通じた地域統合を進める足がかりを得た。',
      debate:'敗北を糧に軍制・同盟政策を柔軟に改善したローマの適応力を評価する見方があり、初期の挫折が長期的な成功にどう結びついたかが軍事史上注目される。'
    } },
  { id:'pyrrhic_war', name:'ピュロス戦争', category:'war', lat:40.47, lng:17.23, start:-280, end:-275, region:'イタリア南部(タレントゥム)',
    desc:{
      background:'南イタリアのギリシア植民市タレントゥムがローマの勢力拡大に脅威を感じ、エピロス王ピュロスに軍事支援を要請したことが開戦の直接の契機である。',
      process:'ピュロスは象部隊などギリシア式の精鋭軍でローマ軍を二度破ったが、いずれも自軍にも甚大な損害を被り、最終的に戦争継続能力を失って撤退し、ローマがイタリア半島南部の統一を完成させた。',
      significance:'この戦争を通じてローマの粘り強い軍制と補充能力の高さが証明され、地中海東部のヘレニズム世界にもローマという新興勢力の存在を強く印象づけた。',
      debate:'戦術的には勝利しながら戦略的に敗北したピュロスの事例は、軍事的成功と戦争全体の帰趨との乖離を示す典型例として、後世繰り返し引用される教訓となっている。'
    } },
  { id:'pyrrhus_epirus', name:'ピュロス王', category:'person', lat:39.6, lng:20.3, start:-319, end:-272, region:'エピロス',
    desc:{
      background:'アレクサンドロス大王の親戚筋にあたる家系の出身として、その武勇と征服への野心を体現しようとしたことが度重なる遠征の背景にある。',
      process:'タレントゥムの要請でイタリアに遠征し緒戦でローマ軍を撃退したが、いずれの勝利も深刻な損害を伴い、その後シチリア遠征も試みたものの最終的にイタリアから撤退せざるを得なかった。',
      significance:'『割に合わない犠牲の大きい勝利』を意味する『ピュロスの勝利』という故事成語にその名を残し、軍事的成功の評価基準に警鐘を鳴らす存在として記憶されている。',
      debate:'『名将』としての軍事的評価と、結局いずれの遠征でも恒久的成果を得られなかった戦略的判断力の欠如という評価は、彼の人物像の両面性を示している。'
    } },
  { id:'scipio_africanus', name:'スキピオ(大アフリカヌス)', category:'person', lat:41.9, lng:12.49, start:-236, end:-183, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'カンナエの戦いなどハンニバルによる度重なる大敗を経験したローマが、若手ながら卓越した軍事的才能を持つ指揮官を必要としていたことが登用の背景にある。',
      process:'イベリア半島でカルタゴ勢力を一掃した後、あえて北アフリカ本土を攻撃する戦略を採用してハンニバルを本国防衛に引き戻させ、ザマの戦いで直接対決しこれを打ち破った。',
      significance:'この勝利により第二次ポエニ戦争はローマの決定的勝利に終わり、西地中海における覇権はローマの手に確立された。',
      debate:'戦後の政治的立場をめぐり保守派(大カトーら)と対立し晩年は不遇であったことは、軍事的英雄と共和政的な集団指導原理との緊張関係を示す事例として論じられる。'
    } },
  { id:'spartacus_revolt', name:'スパルタクスの反乱', category:'war', lat:40.83, lng:14.43, start:-73, end:-71, region:'イタリア(ウェスウィウス山周辺)',
    desc:{
      background:'剣闘士養成所における非人間的な処遇と、共和政末期のイタリアにおける奴隷制農業(ラティフンディア)の広範な拡大が、大規模反乱の温床となっていた。',
      process:'少数の脱走剣闘士から始まった蜂起は各地の奴隷を糾合して数万規模に膨れ上がり、複数のローマ軍を撃破するほどの勢いを見せたが、内部の路線対立(イタリア脱出か戦闘継続か)もあり、最終的にクラッスス指揮下の大軍に鎮圧された。',
      significance:'共和政ローマ史上最大の奴隷反乱として、当時の奴隷制社会が内包する深刻な矛盾を露わにし、鎮圧後の見せしめ(アッピア街道沿いの大量磔刑)は奴隷制支配の過酷さを象徴する出来事となった。',
      debate:'反乱の目的が奴隷制そのものの廃止を志向したものか、単に自由を得てイタリアを脱出することを目指したものかについては史料上の解釈が分かれている。'
    } },
  { id:'cicero', name:'キケロ', category:'person', lat:41.9, lng:12.49, start:-106, end:-43, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'『新人(ノウス・ホモ)』として名門の家系によらず自らの弁論の才のみで政界の頂点(執政官)に上り詰めたことが、共和政の理念への強い愛着を育んだ背景にある。',
      process:'執政官在任中にカティリナの陰謀を摘発して『祖国の父』と称えられたが、カエサルの独裁化、暗殺後の混乱期にはアントニウスを激しく弾劾する演説(『フィリッピカ』)を行い、第二回三頭政治による政敵粛清の対象として殺害された。',
      significance:'その洗練されたラテン語散文と弁論・哲学著作は、後のルネサンス期人文主義者やヨーロッパの修辞学教育において規範的文体として長く尊重され続けた。',
      debate:'共和政の理念の擁護者として理想化される一方、実際の政治判断(日和見的な立場変更)には現実主義的な打算も指摘され、その一貫性については評価が分かれる。'
    } },
  { id:'brutus', name:'ブルートゥス', category:'person', lat:41.9, lng:12.49, start:-85, end:-42, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'共和政の伝統的美徳を体現した先祖(王政を廃した伝説的建国者ブルトゥス)の血統を強く意識していたことが、カエサルの独裁化への抵抗運動に加わる思想的動機となった。',
      process:'カエサルから寛大な処遇と信任を受けていたにもかかわらず、共和政の理念を守るためと称して暗殺計画に加わり実行したが、その後のローマ市民の反応は必ずしも支持的ではなく、内乱の末オクタウィアヌス・アントニウス連合軍に敗れ自害した。',
      significance:'『高潔だが結果的に国を混乱に陥れた理想主義者』という複雑な人物像は、シェイクスピアの戯曲などを通じ西洋文化における『大義と結果の乖離』を象徴する存在として繰り返し描かれてきた。',
      debate:'暗殺という行為を『僭主殺し(ティラニサイド)』として正当化しうるかという政治哲学的問いは、古代から現代の政治理論に至るまで繰り返し論じられる普遍的論点である。'
    } },
  { id:'cato_elder', name:'カトー(大カトー)', category:'person', lat:41.9, lng:12.49, start:-234, end:-149, region:'ローマ', parentId:'rome_republic',
    desc:{
      background:'質実剛健な農民出身の家系という自負のもと、ギリシア文化の流入がもたらす奢侈・道徳的退廃への強い警戒感を抱いていたことが、その保守的言動の背景にある。',
      process:'監察官として風紀取締りに厳格な姿勢で臨む一方、あらゆる元老院演説の結びに『カルタゴは滅ぼされねばならない』と付け加え続け、世論を第三次ポエニ戦争開戦へと導いた。',
      significance:'その執拗な主張は最終的にカルタゴの徹底的破壊という結果を導き、地中海西部における潜在的脅威の芽を摘む一方、過剰な報復であったとの評価も後世根強く残った。',
      debate:'カルタゴへの敵意が経済的競争相手排除という実利的計算に基づくものか、単なる旧来の恐怖心・執念によるものかは、古来議論の的となっている。'
    } },
  { id:'jewish_war_rome', name:'ユダヤ戦争', category:'war', lat:31.78, lng:35.22, start:66, end:73, region:'ユダヤ(パレスチナ)',
    desc:{
      background:'ローマ総督の強引な徴税・宗教的挑発(神殿の財宝没収など)への不満が、熱心党(ゼロータイ)を中心とする急進派の蜂起を招いた背景にある。',
      process:'当初は善戦したものの、皇帝ウェスパシアヌスとその子ティトゥスが率いる大軍によって各地の要塞が次々と攻略され、最終的にエルサレムが包囲・陥落して神殿は破壊された(マサダの陥落はその後も続いた)。',
      significance:'第二神殿の完全な破壊はユダヤ教のあり方を神殿祭儀中心からラビによる律法解釈中心の宗教へと根本的に転換させ、以後のユダヤ人ディアスポラ(離散)の本格化を招いた。',
      debate:'反乱の過激派(熱心党)の抵抗を『英雄的な民族的抵抗』とみるか、無謀な軍事的冒険として結果的に民族的悲劇を招いたとみるかは、現代イスラエルにおける歴史認識とも結びつく論点である。'
    } },
  { id:'nero', name:'ネロ', category:'person', lat:41.9, lng:12.49, start:37, end:68, region:'ローマ帝国', parentId:'rome_empire',
    desc:{
      background:'母アグリッピナの策謀により若くして帝位に就いたことが、後の親政開始とともに母や旧来の後見人(セネカら)との対立を深める背景となった。',
      process:'治世初期は穏健な統治を行ったが次第に恣意的な統治(母・妻の殺害)に傾き、ローマ大火(64年)後には自らの浪費(黄金宮殿建設)を隠すためかキリスト教徒への迫害を行ったとされ、各地の軍団反乱を招いて元老院から敵と宣告され自殺に追い込まれた。',
      significance:'その暴君としてのイメージはユリウス=クラウディウス朝断絶の象徴となり、以後『暴君ネロ』は権力の腐敗を示す文化的な代名詞として広く定着した。',
      debate:'ローマ大火の放火犯人説や暴虐性については、彼の死後に成立した史料(元老院派の歴史家タキトゥスら)による意図的な悪評形成の可能性が近年の研究で指摘されている。'
    } },
  { id:'vespasian', name:'ウェスパシアヌス', category:'person', lat:41.9, lng:12.49, start:9, end:79, region:'ローマ帝国', parentId:'rome_empire',
    desc:{
      background:'ネロの死後に生じた『4皇帝の年』と呼ばれる内乱の中、東方(ユダヤ戦争鎮圧)で強力な軍事基盤を築いていたことが帝位獲得の背景にある。',
      process:'内乱を勝ち抜いて即位した後、財政再建に努めるとともにユダヤ戦争を子ティトゥスに完遂させ、内乱で焼失した政治的威信を回復するための公共事業(コロッセウム建設着手)を進めた。',
      significance:'属州出身に近い『新人』としての即位でありながら安定した統治を実現し、フラウィウス朝という新たな王朝の礎を築いた点で、帝位継承における能力主義的側面を示す事例となった。',
      debate:'コロッセウム建設をユダヤ戦争の戦利品(戦争捕虜の労働力・略奪財貨)で賄ったことは、帝国の栄華がしばしば征服・収奪の上に築かれていた側面を示す論点として指摘される。'
    } },
  { id:'constitutio_antoniniana', name:'アントニヌス勅令', category:'treaty', lat:41.9, lng:12.49, start:212, end:212, region:'ローマ帝国',
    desc:{
      background:'属州民の軍役への依存度が高まる中、市民権付与によって帝国への忠誠・統合意識を高める必要が実務上生じていたことが背景の一つとされる。',
      process:'皇帝カラカラが帝国内のほぼ全ての自由民にローマ市民権を一挙に付与する勅令を発した。',
      significance:'本国民と属州民との法的格差が解消され、帝国全域の法的一体性が大きく高まったことで、以後の『ローマ市民』という概念そのものが実質的に変容した。',
      debate:'この勅令の動機については、帝国統合の理念的措置とみる見方と、市民にのみ課される相続税・解放奴隷税の徴収対象拡大という財政的動機を重視する見方(カッシウス・ディオの証言)とが対立する。'
    } },
  { id:'caracalla', name:'カラカラ帝', category:'person', lat:41.9, lng:12.49, start:188, end:217, region:'ローマ帝国', parentId:'rome_empire',
    desc:{
      background:'父セプティミウス・セウェルスの遺訓(軍を厚遇せよ)を実践するため、軍への俸給増額の財源確保が統治上の課題であったことが諸政策の背景にある。',
      process:'アントニヌス勅令による市民権拡大とともに通貨の悪鋳(銀の含有量を減らした新硬貨の発行)を進め、ローマに壮大な公共浴場(カラカラ浴場)を建設したが、パルティア遠征中に部下に暗殺された。',
      significance:'市民権の全帝国的拡大という画期的措置を残したが、その治世は残忍な弟殺害や恣意的処罰でも知られ、『3世紀の危機』へと向かう帝国の政治的不安定化の一端を体現した。',
      debate:'市民権付与を『寛容な統合政策』と評価するか、単なる増税策の隠れ蓑に過ぎなかったとみるかは、彼の治世全体の評価と密接に関わる。'
    } },
  { id:'valerian', name:'ウァレリアヌス帝', category:'person', lat:41.9, lng:12.49, start:200, end:260, region:'ローマ帝国', parentId:'rome_empire',
    desc:{
      background:'3世紀の危機のただ中、東西両面での異民族・外敵の圧力に同時に対応せざるを得ない厳しい状況で即位したことが、その苦難の治世の背景にある。',
      process:'キリスト教徒への迫害を強化する一方、シャープール1世率いるササン朝ペルシアとの戦いに自ら出陣したが、エデッサの戦いで大敗し捕虜となり、屈辱的な扱いを受けた末に生涯を終えたと伝えられる。',
      significance:'ローマ皇帝が敵国の捕虜となるという前代未聞の事態は帝国の権威失墜を象徴し、『3世紀の危機』の深刻さを内外に強く印象づける出来事となった。',
      debate:'捕虜後の処遇(生きた足台にされた、剥製にされたなどの伝承)はローマ側の史料による誇張の可能性が高く、史実との区別が困難である。'
    } },
  { id:'council_of_nicaea', name:'ニケーア公会議', category:'event', lat:40.43, lng:29.72, start:325, end:325, region:'ビザンティウム近郊(ニカイア)',
    desc:{
      background:'キリストの神性をめぐるアリウス派の教義(キリストは父なる神に劣る被造物であるとする説)が広範な論争を引き起こし、帝国の宗教的・政治的統一を脅かしていたことが招集の背景にある。',
      process:'コンスタンティヌス帝自らが議長格として関与し、アリウス派を異端として退け、父と子が同質(ホモウーシオス)であるとする三位一体説に基づくニケーア信条を採択した。',
      significance:'国家権力が教義論争に直接介入し公会議という形式で教義の統一を図った最初の事例となり、以後の国家と教会の緊密な結びつきの原型を形づくった。',
      debate:'この決定にもかかわらずアリウス派は根強く存続し(特にゲルマン諸部族への布教を通じて)、教義対立は数世紀にわたり帝国内外で尾を引くこととなった。'
    } },
  { id:'augustine', name:'アウグスティヌス', category:'person', lat:36.83, lng:7.76, start:354, end:430, region:'北アフリカ(ヒッポ)', parentId:'rome_empire',
    desc:{
      background:'マニ教への傾倒や放蕩な青年期を経て、母モニカの祈りとミラノでのアンブロシウスとの出会いを通じキリスト教へ回心した個人的経験が、その神学思想の出発点となった。',
      process:'北アフリカのヒッポの司教として、『告白録』で自己の内面を赤裸々に綴る一方、『神の国』では西ゴート族によるローマ略奪(410年)を機に、地上の国家の盛衰と神の国の永遠性を対比する壮大な歴史神学を展開した。',
      significance:'原罪・恩寵・予定説に関する彼の教義体系は、以後の中世スコラ学から宗教改革期のルターやカルヴァンに至るまで、西方キリスト教思想全体を規定する最も重要な源流の一つとなった。',
      debate:'恩寵と自由意志の関係をめぐる彼の立場は、当時のペラギウス派(人間の意志による救済を重視)との論争を経て確立されたものであり、この論争は後世のキリスト教神学における恩寵論争の原型ともなっている。'
    } },

  // ===================== イギリス史 追加データ(アングロサクソン〜20世紀) =====================
  { id:'anglo_saxon_heptarchy', name:'アングロサクソン七王国(ヘプターキー)', category:'nation', lat:52.63, lng:-1.13, start:500, end:927, region:'ブリテン島(イングランド)',
    desc:{
      background:'ローマ軍撤退後のブリテン島に生じた権力空白に乗じ、大陸のゲルマン系諸部族(アングロ人・サクソン人・ジュート人)が渡来・定住したことが王国群成立の背景にある。',
      process:'先住のケルト系ブリトン人を西方(ウェールズ・コーンウォール)へ圧迫しつつ複数の王国を築き、ウェセックス・マーシア・ノーサンブリアなどが交代で覇権(ブレトワルダ)を握る抗争を繰り広げた。',
      significance:'ヴァイキングという共通の脅威に直面する中でウェセックス王家のもとに統合され、後のイングランド王国という統一国家形成の出発点となった。',
      debate:'『七王国』という整然とした区分は後代(ビード)の叙述に基づく便宜的枠組みであり、実際にはより流動的で数の変動する諸勢力が分立していたとされる。'
    } },
  { id:'alfred_the_great', name:'アルフレッド大王', category:'person', lat:51.06, lng:-1.31, start:849, end:899, region:'ウェセックス王国', parentId:'anglo_saxon_heptarchy',
    desc:{
      background:'デーン人(ヴァイキング)の侵攻により他のアングロサクソン諸国が次々に陥落する中、ウェセックスのみが最後の砦として残されていたことが彼の治世の危機的背景である。',
      process:'一時は沼沢地への逃亡を余儀なくされるほどの窮地から反攻に転じてデーン人を撃退し、境界(デーンロウ)を画定する和平を結ぶとともに、法典編纂や学問振興(ラテン語文献の英訳事業)にも力を注いだ。',
      significance:'軍事的独立の確保と文化的復興の両面での功績により、イングランド史上唯一『大王』の称号を冠される王として記憶され、以後の統一の礎を築いた。',
      debate:'『イングランドの創始者』的な国民的英雄像は後世(特に近代のナショナリズム)による理想化を多分に含んでおり、実態はウェセックス一国の存続に努めた地域的君主に近かったとする見方もある。'
    } },
  { id:'danelaw', name:'デーンロウ(デーン人支配地域)', category:'event', lat:53.8, lng:-1.55, start:878, end:954, region:'イングランド北東部',
    desc:{
      background:'デーン人の大規模な侵攻・定住により、イングランド北東部が事実上その支配・慣習法のもとに置かれていたことがこの地域区分成立の背景である。',
      process:'アルフレッド大王との条約により境界が画定され、独自のデーン系慣習法・地名(-byで終わる地名など)が定着したが、後継の王たち(エドワード長兄王ら)による再征服を経て徐々にイングランド王権のもとへ再統合された。',
      significance:'この地域の再統合過程は、分裂していたアングロサクソン諸王国を統一イングランド王国へと導く重要な段階となった。',
      debate:'デーン人の支配を単なる『占領』とみるか、現地社会との融合・共生を伴う複合的な過程とみるかは、地名・法制度の痕跡研究を通じ現在も議論されている。'
    } },
  { id:'cnut_the_great', name:'クヌート(カヌート)大王', category:'person', lat:51.51, lng:-0.13, start:995, end:1035, region:'イングランド・デンマーク・ノルウェー', parentId:'england_kingdom',
    desc:{
      background:'デンマーク王家の対外拡張政策のもと、父スヴェン1世によるイングランド征服の成果を継承したことが、彼の広域支配確立の背景にある。',
      process:'イングランド征服後、現地の慣習・法を尊重する統治方針をとって支持を固め、デンマーク・ノルウェーの王位も兼ねる『北海帝国』を築いたが、その死後まもなく息子たちの間で領土は分割・弱体化した。',
      significance:'スカンディナヴィアとブリテン島を結ぶ広域的な政治秩序を一時的に実現し、北海を挟んだ地域間の交流・統合の可能性を示す事例となった。',
      debate:'『潮の満ち引きすら王命では止められない』と家臣を諭したという逸話は、後世に付会された王の謙虚さを示す教訓話である可能性が高いとされる。'
    } },
  { id:'domesday_book', name:'ドゥームズデイ・ブック(土地台帳)の作成', category:'event', lat:51.51, lng:-0.13, start:1085, end:1086, region:'イングランド',
    desc:{
      background:'ノルマン征服後の新支配者ウィリアム1世が、獲得した広大な新領土の資産・課税基盤を正確に把握する必要に迫られたことが、この大規模調査の背景にある。',
      process:'全国の荘園・土地・家畜・住民に至るまでを詳細に調査させ、征服直後という短期間で驚異的に網羅的な台帳を完成させた。',
      significance:'この台帳は徴税・訴訟の基礎資料として長く利用され続け、中世ヨーロッパにおいて類を見ない精密な統計調査として、ノルマン王権の徹底した中央集権的統治姿勢を象徴している。',
      debate:'『最後の審判(ドゥームズデイ)』という呼称に象徴されるように、被支配者(アングロサクソン系住民)にとってこの調査がどれほど過酷なものと受け止められたかについては議論がある。'
    } },
  { id:'henry_ii_plantagenet', name:'ヘンリ2世', category:'person', lat:51.51, lng:-0.13, start:1133, end:1189, region:'イングランド(プランタジネット朝)', parentId:'england_kingdom',
    desc:{
      background:'母マティルダの内乱(『無政府時代』)を経て即位し、婚姻によりフランス各地に広大な所領(アンジュー帝国)を得たことが、その強大な権勢の背景にある。',
      process:'各地を巡回する国王裁判官を派遣して判例に基づく統一的な慣習法(コモン・ロー)体系を整備する一方、カンタベリ大司教トマス・ベケットとの教会裁判権をめぐる対立を深め、その暗殺という悲劇的結果を招いた。',
      significance:'王権のもとに統一された司法制度(コモン・ロー)を確立したことは、後のイギリス法体系の根幹として、成文法典を持たない独自の判例法主義の伝統を築いた。',
      debate:'ベケット暗殺への関与の程度(明確な殺害命令を下したのか、単なる激情の言葉が側近に曲解されたのか)については、当時から解釈が分かれている。'
    } },
  { id:'thomas_becket', name:'トマス・ベケット', category:'person', lat:51.28, lng:1.08, start:1119, end:1170, region:'イングランド(カンタベリ大司教)',
    desc:{
      background:'国王ヘンリ2世の友人・腹心として大法官に任じられていたが、大司教就任後は教会の独立性を守る立場へ急変したことが、両者の対立を先鋭化させる背景となった。',
      process:'聖職者の犯罪を世俗裁判所で裁くことを認めさせようとする王に強く抵抗し、一時亡命を余儀なくされたが帰国後もなお対立を続け、王の激した言葉を受けた騎士たちにカンタベリ大聖堂内で殺害された。',
      significance:'聖堂内での殉教という劇的な最期は彼を即座に聖人へと押し上げ、カンタベリは中世ヨーロッパ有数の巡礼地として繁栄し、教権の独立を象徴する存在となった。',
      debate:'友人から政治的対立者へと転じた彼の変貌の動機については、真の信仰的覚醒によるものか、大司教という地位に伴う権益擁護の必要からくるものかで解釈が分かれる。'
    } },
  { id:'richard_i_lionheart', name:'リチャード1世(獅子心王)', category:'person', lat:51.51, lng:-0.13, start:1157, end:1199, region:'イングランド(プランタジネット朝)', parentId:'england_kingdom',
    desc:{
      background:'父ヘンリ2世・兄との複雑な家族内抗争を経て即位し、当時ヨーロッパ全体を巻き込んでいた十字軍運動への参加が国王としての名声獲得の主要な舞台となった。',
      process:'第3回十字軍でサラディンと互角に渡り合う武勇を示したが聖地奪回には至らず、帰途オーストリア公に捕らえられ多額の身代金を払って解放されるなど、在位10年のほとんどをイングランド国外で過ごした。',
      significance:'『獅子心王』としての武勇伝は中世騎士道物語の理想像を体現する存在となり、後世の文学・伝説(ロビン・フッド物語など)にも大きな影響を与えた。',
      debate:'国政をほとんど顧みず対外的な軍事的栄光を追求したその治世は、実際にはイングランドに重い財政負担(身代金調達のための重税)を強いたとする批判的評価もある。'
    } },
  { id:'john_lackland', name:'ジョン(欠地王)', category:'person', lat:51.51, lng:-0.13, start:1166, end:1216, region:'イングランド(プランタジネット朝)', parentId:'england_kingdom',
    desc:{
      background:'兄リチャード1世の不在中の失政と、フランス王フィリップ2世の巧みな外交・軍事戦略が、大陸領土喪失という彼の治世最大の失敗の背景にある。',
      process:'フランスの所領の大半(ノルマンディーなど)を失って『欠地王』と渾名され、その埋め合わせのための重税と恣意的な統治が貴族の反発を招き、最終的に武装反乱を受けてマグナ・カルタの承認に追い込まれた。',
      significance:'彼の失政こそが、王権を制約する大憲章という後世の立憲主義の象徴的文書を生み出す直接の契機となったという歴史的皮肉を体現している。',
      debate:'『イングランド史上最悪の王』という評価が定着しているが、大陸領土喪失は必ずしも彼一人の失政のみに帰せられるものではなく、フィリップ2世の卓越した戦略も重視すべきだとする見方もある。'
    } },
  { id:'edward_i_england', name:'エドワード1世', category:'person', lat:51.51, lng:-0.13, start:1239, end:1307, region:'イングランド(プランタジネット朝)', parentId:'england_kingdom',
    desc:{
      background:'父ヘンリ3世期の貴族反乱(シモン・ド・モンフォールの乱)を鎮圧した経験から、王権と議会の関係を安定させつつ強力な統治体制を築く必要を痛感したことが治世の背景にある。',
      process:'ウェールズを征服して直接支配下に組み込む一方、スコットランドへの介入・侵攻を繰り返し(『スコットランド人のハンマー』の異名)、課税への同意を得るため貴族・聖職者・都市代表を集めた模範議会を招集した。',
      significance:'身分制議会(後の議会制度)の発展に寄与するとともに、ウェールズ征服により『プリンス・オブ・ウェールズ』の称号が以後のイングランド王太子の称号として定着した。',
      debate:'スコットランドへの度重なる侵攻は現地(ウィリアム・ウォレスらの抵抗)の激しい反発を招いており、征服者としての評価とスコットランド独立運動の英雄譚とは対照的な視点を提供する。'
    } },
  { id:'edward_iii_england', name:'エドワード3世', category:'person', lat:51.51, lng:-0.13, start:1312, end:1377, region:'イングランド(プランタジネット朝)', parentId:'england_kingdom',
    desc:{
      background:'母イザベラを通じたフランス王位継承権の主張と、フランドル地方(羊毛貿易の重要拠点)をめぐる経済的利害対立が、対仏開戦の背景にある。',
      process:'フランス王位継承権を掲げて百年戦争を開始し、クレシーの戦いなどで長弓兵を活用した戦術的勝利を重ねる一方、国内では騎士道理念を体現するガーター勲章を創設して貴族の結束を図った。',
      significance:'長期にわたる治世のもとイングランドは軍事的名声を高め、議会の課税同意権が定着するなど、王権と議会の協調関係が制度的に強化される契機ともなった。',
      debate:'フランス王位への主張は法的正統性を伴うものであったか、実質的には領土的野心を正当化する口実に過ぎなかったかは、百年戦争の性格づけをめぐる基本的論点である。'
    } },
  { id:'peasants_revolt', name:'ワット・タイラーの乱(農民一揆)', category:'war', lat:51.51, lng:-0.13, start:1381, end:1381, region:'イングランド南東部',
    desc:{
      background:'黒死病後の労働力不足による賃金上昇の動きを法律で抑制しようとする支配層の政策と、重い人頭税の賦課が、農民層の不満を極限まで高めていた。',
      process:'ケントやエセックスを中心に蜂起した農民たちがロンドンまで進軍し国王リチャード2世との直接交渉に一時成功したが、指導者ワット・タイラーが交渉の場でロンドン市長に殺害されると急速に鎮圧された。',
      significance:'反乱自体は鎮圧されたものの、農奴制(賦役労働)からの解放という趨勢を後押しし、以後イングランドでは貨幣地代への移行が加速する一因となった。',
      debate:'反乱軍の要求(農奴制廃止・人頭税撤回)がどこまで体系的な社会変革思想に基づくものであったか、それとも場当たり的な直接行動の集積であったかは議論がある。'
    } },
  { id:'wat_tyler', name:'ワット・タイラー', category:'person', lat:51.51, lng:-0.13, start:1341, end:1381, region:'イングランド',
    desc:{
      background:'人頭税の取り立てをめぐる地方役人との衝突が、彼が農民反乱の指導者として頭角を現す直接のきっかけになったとされる。',
      process:'各地の農民勢力を糾合してロンドンに進軍し、国王との直接交渉の場で農奴制廃止などの要求を突きつけたが、交渉中の不穏な言動を理由にロンドン市長ウィリアム・ウォルワースに殺害された。',
      significance:'その死により反乱は急速に統率を失い鎮圧されたが、農民が国王に直接要求を突きつけたという事実そのものが、以後の民衆運動における象徴的先例として記憶され続けている。',
      debate:'彼の出自や反乱前の経歴については史料が乏しく、後世の民衆運動史における『英雄化』と実像との間には隔たりがある可能性が指摘される。'
    } },
  { id:'wars_of_roses', name:'薔薇戦争', category:'war', lat:52.58, lng:-1.13, start:1455, end:1487, region:'イングランド',
    desc:{
      background:'百年戦争の敗北による王権の権威失墜と、精神的に不安定であったヘンリ6世のもとでの統治能力の欠如が、有力諸侯間の権力争いを激化させた背景にある。',
      process:'ランカスター家とヨーク家の間で王位をめぐる内乱が断続的に続き、両陣営の有力貴族が次々と戦死・処刑される中、最終的に両家の血を引くヘンリ・テューダーがボズワースの戦いでリチャード3世を破り勝利した。',
      significance:'有力な旧貴族層が内乱で大きく消耗したことが、勝利したテューダー朝のもとでの王権強化(貴族への統制強化)を容易にする結果をもたらした。',
      debate:'『薔薇戦争』という呼称・イメージ自体は19世紀の文学(特にウォルター・スコットの小説)による後付けの命名であり、当時の同時代人がそう呼んでいたわけではない点には留意が必要である。'
    } },
  { id:'henry_vi_england', name:'ヘンリ6世', category:'person', lat:51.51, lng:-0.13, start:1421, end:1471, region:'イングランド(ランカスター朝)', parentId:'england_kingdom',
    desc:{
      background:'生後まもなく即位したため長期にわたり摂政による統治を余儀なくされ、成人後も精神的な不安定さ(統治能力の欠如)が表面化したことが治世の混乱の背景にある。',
      process:'百年戦争の劣勢(ジャンヌ・ダルクの活躍によるフランス反攻)を止められないまま敗北を重ね、国内では有力貴族間の対立が薔薇戦争へと発展し、王位の廃位・復位を経て最終的に幽閉先(ロンドン塔)で殺害されたとされる。',
      significance:'その統治能力の欠如は結果的に貴族間の権力闘争を助長し、中世イングランド王権の脆弱性を象徴する事例として、後の強力な王権(テューダー朝)を求める機運を生む一因となった。',
      debate:'彼の精神的不調(一時的な昏迷状態)の実態については、遺伝的要因(母方の祖父シャルル6世も精神疾患を患った)を含め医学史的な関心からも論じられている。'
    } },
  { id:'edward_iv_england', name:'エドワード4世', category:'person', lat:51.51, lng:-0.13, start:1442, end:1483, region:'イングランド(ヨーク朝)', parentId:'england_kingdom',
    desc:{
      background:'ヘンリ6世の統治能力の欠如と薔薇戦争の混乱の中、ヨーク家の有力な地位を背景に王位を主張しうる立場にあったことが即位の背景にある。',
      process:'タウトンの戦いなどでランカスター派を破って即位し、一時亡命を経験しつつも王位を回復し、羊毛貿易の保護など商業振興策で王室財政の安定化に努めたが、その死後は幼い息子たちの後見をめぐる混乱(弟リチャードの簒奪)を招いた。',
      significance:'商業振興と財政再建に手腕を発揮し、テューダー朝以降に本格化する王権の経済的自立(議会への課税依存の軽減)への先駆的な取り組みを示した。',
      debate:'死後まもなく生じた幼い後継者(エドワード5世ら)の『失踪(タワーの王子たち)』事件への彼自身の生前の後見人選定の妥当性については、結果論として議論されることがある。'
    } },
  { id:'richard_iii_england', name:'リチャード3世', category:'person', lat:51.51, lng:-0.13, start:1452, end:1485, region:'イングランド(ヨーク朝)', parentId:'england_kingdom',
    desc:{
      background:'兄エドワード4世の急死後、幼い甥エドワード5世の摂政という立場から、王位継承の正統性に疑義を唱え自ら即位する道を選んだことが簒奪の背景にある。',
      process:'甥たち(タワーの王子たち)をロンドン塔に幽閉し(その後消息不明)、王位に就いたが正統性への疑念から広範な支持を得られず、ヘンリ・テューダーの反乱を招き、ボズワースの戦いで自ら陣頭に立って戦死した。',
      significance:'彼の敗死をもってプランタジネット朝(およびその一分家であるヨーク朝)は完全に断絶し、テューダー朝という新王朝の樹立への道が開かれた。',
      debate:'シェイクスピア劇に描かれる『極悪非道な簒奪者』像は勝者(テューダー朝)側による政治的プロパガンダの側面が強く、実際の統治(法制度整備など)を評価する近年の再評価運動(リチャード3世協会など)も存在する。'
    } },
  { id:'henry_vii_tudor', name:'ヘンリ7世', category:'person', lat:51.51, lng:-0.13, start:1457, end:1509, region:'イングランド(テューダー朝)', parentId:'england_kingdom',
    desc:{
      background:'ランカスター派の傍流という弱い血統的正統性しか持たなかったが、薔薇戦争終盤の混乱に乗じて亡命先ブルターニュから反攻の機会を得たことが即位の背景にある。',
      process:'ボズワースの戦いでリチャード3世を破って即位し、ヨーク家の血を引くエリザベスとの結婚により両家の対立に終止符を打つとともに、有力貴族の私兵(私的軍事力)を法的に制限し王権の財政基盤を大きく強化した。',
      significance:'長期にわたる内乱で疲弊した国家財政を再建し中央集権的な統治体制を確立したことで、後のヘンリ8世・エリザベス1世期の強大な王権の基盤を築いた。',
      debate:'その慎重で倹約的な統治姿勢は『地味』と評されがちだが、内乱で疲弊した国家を安定的な近世国家へと着実に再建した手腕は近年高く評価される傾向にある。'
    } },
  { id:'tudor_dynasty', name:'テューダー朝', category:'dynasty', lat:51.51, lng:-0.13, start:1485, end:1603, region:'イングランド',
    desc:{
      background:'薔薇戦争終結後の王権強化という時代的要請と、大陸における宗教改革・主権国家形成という国際的潮流が、この王朝の性格を規定する二重の背景となった。',
      process:'ヘンリ7世の財政再建、ヘンリ8世の宗教改革と国教会創設、エドワード6世・メアリ1世期の宗教的動揺を経て、エリザベス1世のもとで国教会体制の安定と対外的躍進(無敵艦隊撃退)を実現したが、彼女の死をもって直系は断絶した。',
      significance:'この一世紀余りの間にイングランドは中世的な封建王国から近世的な主権国家・海洋国家へと大きく変貌し、後の大英帝国発展の礎を築いた。',
      debate:'テューダー朝の統治を『専制的な絶対王政』とみるか、議会との協調を重視した『混合政体』とみるかは、イギリス立憲史における重要な論点であり続けている。'
    } },
  { id:'henry_viii', name:'ヘンリ8世', category:'person', lat:51.51, lng:-0.13, start:1491, end:1547, region:'イングランド(テューダー朝)', parentId:'england_kingdom',
    desc:{
      background:'王妃キャサリンとの間に男子後継者を得られなかったことへの深刻な焦燥感と、アン・ブーリンへの傾倒が、離婚問題を教皇との決定的な対立へと発展させた直接の背景である。',
      process:'教皇が離婚(婚姻無効)を認めなかったため首長法(1534年)を制定してローマ教皇の権威を排しイギリス国教会を樹立し、あわせて修道院を解散させてその莫大な資産を王室・貴族に再分配した。',
      significance:'教皇権からの政治的独立という決断は、以後のイングランドの主権国家化(教会をも包摂する国家主権の確立)を大きく前進させる画期的な出来事となった。',
      debate:'この宗教改革を純粋な信仰上の転換とみるか、離婚問題という個人的動機に発する結果的な政治的帰結とみるかは、イギリス宗教改革研究における根本的な論点である。'
    } },
  { id:'english_reformation', name:'イギリス国教会の成立(イギリス宗教改革)', category:'event', lat:51.51, lng:-0.13, start:1534, end:1559, region:'イングランド',
    desc:{
      background:'ヘンリ8世の離婚問題という個人的動機に加え、大陸のルター派・カルヴァン派の思想が既に一部の知識人・聖職者の間に浸透し始めていたことも改革の土壌となった。',
      process:'首長法により国王を教会の最高首長とする体制を確立した後、教義面では当初カトリック的要素を多く残したが、エドワード6世期のより急進的な改革とメアリ1世期の一時的カトリック復古を経て、エリザベス1世の『中道路線(ヴィア・メディア)』により最終的な体制が確立した。',
      significance:'教義的には穏健(カトリックとプロテスタントの中間的性格)でありながら政治的には教皇から完全に独立するという独自の国教会体制は、イギリスの宗教的・政治的独自性の重要な基盤となった。',
      debate:'この改革が民衆レベルでどこまで自発的に受容されたのか(『上からの改革』か『下からの信仰変革』か)については、社会史研究において長く論争が続いている。'
    } },
  { id:'mary_i_england', name:'メアリ1世(ブラッディ・メアリ)', category:'person', lat:51.51, lng:-0.13, start:1516, end:1558, region:'イングランド(テューダー朝)', parentId:'england_kingdom',
    desc:{
      background:'母キャサリンの離婚とカトリック信仰への迫害を目の当たりにした経験が、即位後の徹底したカトリック復興政策への強い執着を生んだ背景にある。',
      process:'国教会体制を覆しローマ教皇の権威を復活させ、多数のプロテスタントを異端として火刑に処す一方、スペイン王フェリペ2世と結婚したが世継ぎを得られず、その死により異母妹エリザベス1世が即位した。',
      significance:'その苛烈な弾圧策は結果的にプロテスタントの殉教者的記憶を強く刻み、以後のイングランドにおける反カトリック的な国民意識の形成を却って促す逆説的な結果を招いた。',
      debate:'『ブラッディ・メアリ』という否定的呼称が定着した経緯については、勝者となったプロテスタント側(特に後世の年代記作者ジョン・フォックス)による記憶の政治的形成の影響が指摘される。'
    } },
  { id:'elizabeth_i', name:'エリザベス1世', category:'person', lat:51.51, lng:-0.13, start:1533, end:1603, region:'イングランド(テューダー朝)', parentId:'england_kingdom',
    desc:{
      background:'母アン・ブーリンの処刑という不安定な出自と、姉メアリ1世治下での宗教的迫害を生き延びた経験が、慎重かつ現実主義的な統治姿勢を育んだ背景にある。',
      process:'国教会体制を宗教的に穏健な形で再確立して国内の宗教対立を鎮静化させ、生涯独身を通しつつ巧みな外交でバランスを取り、スペイン無敵艦隊を撃退するなど海洋国家としての国力を大きく伸長させた。',
      significance:'文化(シェイクスピア演劇など)・経済・海外進出のいずれにおいても飛躍的発展を遂げた『黄金時代』を築き、後の大英帝国発展の確固たる基盤を確立した。',
      debate:'『処女王』としての独身は政治的手腕(結婚による外交的制約を回避する戦略)であったのか、個人的な選択・境遇の結果であったのかは、歴史家の間で見解が分かれている。'
    } },
  { id:'spanish_armada', name:'スペイン無敵艦隊(アルマダ)の敗北', category:'war', lat:50.37, lng:-4.14, start:1588, end:1588, region:'イギリス海峡',
    desc:{
      background:'エリザベス1世によるプロテスタント支援(オランダ独立戦争への介入)とイングランド私掠船によるスペイン船への攻撃が、カトリック大国スペインとの対立を決定的にした背景にある。',
      process:'フェリペ2世が大艦隊を派遣しネーデルラント駐留軍との合流・イングランド上陸を計画したが、イングランド海軍の機動的な戦術と折からの暴風雨により艦隊は壊滅的打撃を受けた。',
      significance:'この敗北はスペインの絶対的な海上覇権に大きな陰りをもたらす一方、イングランドは海洋国家としての自信を強め、以後の海外進出・植民地帝国建設への弾みとした。',
      debate:'勝敗を決定づけた要因として、イングランド艦隊の戦術的優位性を重視する見方と、偶発的な自然現象(暴風雨、いわゆる『プロテスタントの風』)の役割を重視する見方の両方が根強く存在する。'
    } },
  { id:'james_i_england', name:'ジェームズ1世(イングランド王)', category:'person', lat:51.51, lng:-0.13, start:1566, end:1625, region:'イングランド・スコットランド同君連合', parentId:'england_kingdom',
    desc:{
      background:'エリザベス1世が生涯独身で直系の後継者を残さなかったため、血縁上最も近いスコットランド王ジェームズ6世が有力な継承候補となったことが即位の背景にある。',
      process:'1603年にイングランド王を兼ねて同君連合を成立させ(議会・法制度は別のまま)、大陸的な王権神授説を強く唱えて議会の課税承認権や特権を軽視する統治姿勢を貫き、議会との慢性的な緊張関係を残した。',
      significance:'両国の同君連合はやがて1707年の完全な議会合同(グレートブリテン王国成立)への布石となり、彼の王権観は次代チャールズ1世との議会対立・内戦の遠因ともなった。',
      debate:'『賢愚王』とも評されるように、学識豊かな著述家としての側面と、現実の政治運営における硬直した理念先行の統治姿勢との落差は、彼の評価を難しくしている。'
    } },
  { id:'commonwealth_england', name:'イングランド共和国(コモンウェルス)', category:'nation', lat:51.51, lng:-0.13, start:1649, end:1660, region:'イングランド',
    desc:{
      background:'国王チャールズ1世の処刑という前代未聞の事態を受け、君主制なき統治体制をどう構築するかという課題が、この共和政樹立の直接の背景にある。',
      process:'議会(残部議会)による統治から始まったが実効性を欠き、クロムウェルが軍事力を背景に議会を解散して護国卿に就任し事実上の軍事独裁体制を敷いたが、彼の死後は後継者(息子リチャード)の統治能力不足もあり急速に混乱・崩壊した。',
      significance:'君主制なきイギリス統治の実験は結局長続きせず王政復古を招いたが、議会の権威・国王大権の限界という論点を歴史に刻んだ点で立憲君主政への布石となった。',
      debate:'この体制を『民主的共和政の試み』とみるか、実質的には軍事力に依拠した『クロムウェルの独裁』に過ぎなかったとみるかは評価が分かれる。'
    } },
  { id:'oliver_cromwell', name:'オリバー・クロムウェル', category:'person', lat:51.51, lng:-0.13, start:1599, end:1658, region:'イングランド共和国', parentId:'commonwealth_england',
    desc:{
      background:'熱心なピューリタン信仰を背景に、国王の専制的統治(議会無視・恣意的課税)への強い危機感を抱いたことが政治的台頭の思想的動機となった。',
      process:'議会派の騎兵隊(『鉄騎隊』)を組織してネーズビーの戦いなどで王党派を撃破し、国王チャールズ1世を裁判にかけて処刑した後、アイルランド・スコットランドを軍事的に平定して護国卿として実権を握った。',
      significance:'国王処刑という行為は王権神授説への根本的挑戦となり、彼の軍事的手腕と統治実践は後の議会主権確立への重要な布石を残した。',
      debate:'アイルランド遠征における苛烈な弾圧(ドロイダの虐殺など)は現地(アイルランド)の歴史認識において今なお深い禍根として記憶されており、『信仰の擁護者』と『残虐な征服者』という評価は鋭く対立する。'
    } },
  { id:'charles_ii_restoration', name:'チャールズ2世(王政復古)', category:'person', lat:51.51, lng:-0.13, start:1630, end:1685, region:'イングランド', parentId:'england_kingdom',
    desc:{
      background:'クロムウェル死後の統治の混乱と国民の疲弊が、秩序回復の象徴として王政復古を求める世論を高めたことが即位の背景にある。',
      process:'議会の招請により帰国・即位し当初は議会との協調を重視したが、晩年はフランスからの秘密裏の資金援助を受けつつカトリックへの傾倒を強め、議会との緊張を再燃させた。',
      significance:'内乱・共和政という激動を経てもなお君主制そのものは国民に広く支持され続けていることを示し、以後のイギリス立憲君主政の安定的存続の前提を確認する結果となった。',
      debate:'フランス王ルイ14世との秘密条約(ドーヴァーの密約)の存在は、当時から議会・国民に隠された対仏従属的な外交姿勢として批判の的となった。'
    } },
  { id:'james_ii_england', name:'ジェームズ2世', category:'person', lat:51.51, lng:-0.13, start:1633, end:1701, region:'イングランド', parentId:'england_kingdom',
    desc:{
      background:'兄チャールズ2世同様カトリックへの共感を強めており、その公然たるカトリック信仰表明が議会・国教会勢力の強い警戒を招いたことが対立の背景にある。',
      process:'常備軍増強やカトリック教徒の要職登用など専制的傾向を強めたため、議会有力者がオランダ総督ウィリアムを招請し、ほとんど抵抗を受けないまま国外へ追放された(名誉革命)。',
      significance:'彼の追放と権利章典の承認により、議会の同意なき課税・立法・常備軍維持を禁じる議会主権に基づく立憲君主政の原則が確立した。',
      debate:'『無血革命』とされる一方、実際にはアイルランド・スコットランドでの彼を支持する軍事抵抗(ボイン川の戦いなど)は激しい戦闘を伴っており、地域による経験の違いが指摘される。'
    } },
  { id:'act_of_union_1707', name:'1707年合同法(イングランド・スコットランド合同)', category:'treaty', lat:55.95, lng:-3.19, start:1707, end:1707, region:'グレートブリテン島',
    desc:{
      background:'スコットランドの財政破綻(ダリエン計画の失敗)と、両国王位継承問題(スコットランドがイングランドと異なる後継者を選ぶ可能性への懸念)が、統合を推し進める実際的動機となった。',
      process:'両国議会でそれぞれ合同法を可決し、単一の議会(グレートブリテン議会)のもとに統一された王国を樹立する一方、スコットランド独自の法体系・教会(長老派)は存続が認められた。',
      significance:'経済的苦境にあったスコットランドはイングランドの広大な市場・植民地貿易への参入機会を得て、以後両国は一つの主権国家として国際政治に関与することとなった。',
      debate:'この合同を対等な当事者間の合意とみるか、経済的窮地に追い込まれたスコットランドが事実上イングランドに吸収されたものとみるかは、現代のスコットランド独立運動の歴史的根拠とも関わる論点である。'
    } },
  { id:'george_i_britain', name:'ジョージ1世', category:'person', lat:51.51, lng:-0.13, start:1660, end:1727, region:'グレートブリテン王国', parentId:'uk_britain',
    desc:{
      background:'スチュアート朝の血統(カトリック系)を排除し、プロテスタントの継承順位を優先する王位継承法により、遠縁のハノーファー選帝侯家が招請されたことが即位の背景にある。',
      process:'英語をほとんど解さず内政に強い関心を示さなかったため、閣議への出席を避けるようになり、実務は多数党の指導者(初代首相とされるウォルポール)に事実上委ねられる慣行が定着していった。',
      significance:'国王の消極的な統治姿勢が結果的に『国王は君臨すれども統治せず』という後の立憲君主政の原則を実務レベルで先取りする形となった。',
      debate:'この慣行の定着を国王個人の資質(言語障壁・関心の薄さ)に帰す見方と、当時既に進行していた議会主権確立の構造的必然性を重視する見方とがある。'
    } },
  { id:'robert_walpole', name:'ロバート・ウォルポール', category:'person', lat:51.51, lng:-0.13, start:1676, end:1745, region:'グレートブリテン王国', parentId:'uk_britain',
    desc:{
      background:'南海泡沫事件(南海会社バブル崩壊)後の政治的混乱を巧みに収拾した実務能力が、国王・議会双方からの信任を集める背景となった。',
      process:'20年以上にわたり第一大蔵卿(事実上の首相)として君臨し、下院多数派の支持を統治の正当性の基盤とする慣行を確立し、国王ジョージ1世・2世の内政への無関心もあって実質的な行政権を掌握し続けた。',
      significance:'国王ではなく議会(下院)の信任に基づいて統治する責任内閣制の慣行を事実上確立し、後の立憲君主政における『首相』という役職の原型を作り上げた。',
      debate:'『初代首相』という称号は後世に付与されたものであり、当時彼自身がその地位を制度として明確に自覚・確立していたわけではない点には留意が必要である。'
    } },
  { id:'seven_years_war', name:'七年戦争', category:'war', lat:51.34, lng:12.37, start:1756, end:1763, region:'ヨーロッパ・北米・インドなど世界各地',
    desc:{
      background:'ヨーロッパにおけるプロイセンとオーストリアの対立(シュレージエン地方をめぐる争い)に、英仏間の北米・インドにおける植民地覇権争いが連動したことが世界規模の戦争を招いた。',
      process:'ヨーロッパ本土での戦闘に加え北米(フレンチ・インディアン戦争)、インド(プラッシーの戦いなど)でも英仏が激突し、最終的にイギリス・プロイセン側が優勢のうちにパリ条約・フベルトゥスブルク条約で終結した。',
      significance:'イギリスはこの勝利によりフランスから北米・インドにおける広大な覇権を奪い、大英帝国の海外展開を決定づける一方、戦費調達のための植民地増税がアメリカ独立革命の遠因ともなった。',
      debate:'五大陸にまたがる戦線の広がりから『最初の世界大戦』と評されることがあるが、当時の戦争がどこまで『世界的』な一体性を持つ紛争として認識されていたかについては慎重な検討も必要とされる。'
    } },
  { id:'queen_victoria', name:'ヴィクトリア女王', category:'person', lat:51.51, lng:-0.13, start:1819, end:1901, region:'グレートブリテン及びアイルランド連合王国', parentId:'uk_britain',
    desc:{
      background:'産業革命の進展によりイギリスが『世界の工場』としての経済的優位を確立していたことが、その長期治世を通じた繁栄の物質的基盤となった。',
      process:'立憲君主として複数の政権(ディズレーリ・グラッドストンら)のもとで統治を見守り、インド帝国の皇帝も兼ねるなど大英帝国の版図が最大に達する中、王室の道徳的権威(勤勉・家庭的美徳の象徴)を確立した。',
      significance:'その名を冠した『ヴィクトリア朝』は産業・科学技術・文化・帝国主義的拡張のいずれにおいても大英帝国の絶頂期を象徴する時代区分として、今なお広く用いられている。',
      debate:'『パクス・ブリタニカ』の繁栄の裏側にある帝国主義的搾取(インド・アフリカなど植民地における収奪・弾圧)の実態は、近年の脱植民地主義的な歴史研究において重視されるようになっている。'
    } },
  { id:'disraeli', name:'ベンジャミン・ディズレーリ', category:'person', lat:51.51, lng:-0.13, start:1804, end:1881, region:'イギリス', parentId:'uk_britain',
    desc:{
      background:'ユダヤ系という当時としては異例の出自を背景に、保守党内での地位確立に際し強い個性と巧みな文才(小説家としての活動)を武器としたことが政治的台頭の背景にある。',
      process:'スエズ運河株の電撃的買収によりインドへの航路確保という帝国戦略上重要な資産を獲得し、ヴィクトリア女王の篤い信任のもとインド帝国成立を主導するなど、積極的な帝国主義政策を推進した。',
      significance:'保守党を単なる地主階級の政党から労働者層をも取り込む『一国保守主義』へと転換させ、大英帝国の絶頂期を演出する政治家として記憶されている。',
      debate:'帝国主義政策を『国益と国威発揚』として肯定的に評価する伝統的見方に対し、その膨張政策が現地社会に与えた負担・搾取を重視する批判的評価も現代では強まっている。'
    } },
  { id:'gladstone', name:'ウィリアム・グラッドストン', category:'person', lat:51.51, lng:-0.13, start:1809, end:1898, region:'イギリス', parentId:'uk_britain',
    desc:{
      background:'当初は保守的な立場から出発しながら次第に自由主義的信念を強め、道徳的原理に基づく政治(『人民の元首相』としての自己認識)を志向したことが政治姿勢の背景にある。',
      process:'財政規律と自由貿易を重視する経済政策を推進し、アイルランド国教会の廃止など宗教的不平等の是正に努める一方、悲願であったアイルランド自治法案は保守派・自党内の反対もあり二度にわたり議会で否決された。',
      significance:'自由主義的改革(選挙権拡大、教育改革など)を通じ近代イギリス政治における自由党の理念的方向性を確立したが、アイルランド問題の解決には至らなかった。',
      debate:'アイルランド自治の実現に生涯を捧げたその執念を高く評価する見方がある一方、結果的に自由党の分裂(自由統一党の離反)を招いた点で政治的判断の是非も問われる。'
    } },
  { id:'corn_laws_repeal', name:'穀物法の廃止', category:'event', lat:51.51, lng:-0.13, start:1846, end:1846, region:'イギリス',
    desc:{
      background:'アイルランドのジャガイモ飢饉による食料危機と、産業資本家・労働者層による安価な輸入穀物を求める自由貿易運動(反穀物法同盟)の高まりが、廃止への圧力を強めた。',
      process:'保守党党首でありながら地主階級の利益(高関税による国内農業保護)よりも国民全体の食料事情を優先すると判断した首相ピールが、自党の分裂を招く覚悟で廃止法案を成立させた。',
      significance:'この決定は自由貿易主義への転換を象徴し、以後のイギリスは『世界の工場』としての工業製品輸出と食料輸入という国際分業体制を積極的に推進する道を歩んだ。',
      debate:'ピール自身が自らの信念に基づき政治生命(党首の座、党の分裂)を賭してこの改革を断行したことは、政治的信念と党派的利害のどちらを優先すべきかという政治倫理上の議論の的となっている。'
    } },
  { id:'irish_famine', name:'アイルランド大飢饉(ジャガイモ飢饉)', category:'event', lat:53.35, lng:-6.26, start:1845, end:1849, region:'アイルランド',
    desc:{
      background:'アイルランドの多くの小作農がジャガイモ単一作物への依存を強いられていたという脆弱な農業構造が、疫病発生時の壊滅的被害を招く根本的背景となっていた。',
      process:'ジャガイモ疫病により連続して大凶作となる中、イギリス政府の対応(自由放任主義的な救済策の不十分さ、穀物輸出の継続)が被害をさらに深刻化させたとされ、多数の餓死者と大規模な海外移住を招いた。',
      significance:'この惨禍への政府対応への強い不信は、以後のアイルランド独立運動・自治要求運動が急速に高まる決定的な契機となった。',
      debate:'この飢饉を単なる自然災害とみるか、イギリス政府の政策的不作為(あるいは意図的な人口削減政策)による『人為的惨事』とみるかは、アイルランド史における最も激しい論争点の一つである。'
    } },
  { id:'chartism', name:'チャーティスト運動', category:'event', lat:53.48, lng:-2.24, start:1838, end:1857, region:'イギリス(工業都市中心)',
    desc:{
      background:'1832年の選挙法改正が中産階級にのみ選挙権を拡大し労働者層を排除したことへの強い不満が、独自の政治運動組織化の直接の背景にある。',
      process:'普通選挙権・秘密投票・議員の財産資格廃止などを掲げる『人民憲章』を掲げ、大規模な署名運動・請願・時にストライキを通じて議会に働きかけたが、いずれの請願も議会により却下され、運動自体は徐々に退潮した。',
      significance:'要求は当時実現しなかったものの、労働者階級による初めての全国規模の組織的政治運動として、後の労働組合運動・労働党結成への思想的・組織的先駆けとなった。',
      debate:'運動の退潮の要因については、経済状況の好転(『飢餓の40年代』の終息)による不満の緩和を重視する見方と、指導部内の路線対立(穏健派対実力行使派)を重視する見方がある。'
    } },
  { id:'crimean_war', name:'クリミア戦争', category:'war', lat:44.6, lng:34, start:1853, end:1856, region:'クリミア半島(黒海沿岸)',
    desc:{
      background:'衰退するオスマン帝国内のキリスト教徒保護権をめぐる対立を口実に、ロシアが黒海・地中海方面への南下政策を強めたことが、英仏の警戒と開戦の背景にある。',
      process:'セヴァストポリ要塞をめぐる長期の攻囲戦となり、兵站・衛生管理の不備による多数の病死者を出す中、ナイティンゲールらの看護活動が注目されたが、最終的にロシアが敗北して南下政策は一時頓挫した。',
      significance:'ロシアの敗北は国内の後進性(農奴制に基づく軍事的非効率)を露呈させ、後のアレクサンドル2世による農奴解放をはじめとする近代化改革を促す契機となった。',
      debate:'この戦争の戦略的必要性については、当時から『避けられた戦争』であったとする批判があり、外交的解決の可能性を軽視した判断の是非が問われている。'
    } },
  { id:'suffragette_movement', name:'女性参政権運動(サフラジェット)', category:'revolution', lat:51.51, lng:-0.13, start:1865, end:1918, region:'イギリス',
    desc:{
      background:'産業化に伴う女性の労働参加拡大にもかかわらず参政権が認められないという法的・社会的不均衡が、組織的な権利要求運動の高まりを招いた。',
      process:'エメリン・パンクハーストらが率いる急進派(サフラジェット)は、投獄・ハンガーストライキという過激な直接行動も辞さず社会に強い衝撃を与え、第一次世界大戦での女性の労働・銃後貢献も評価材料となって、1918年に一定の年齢・財産資格のもとで女性参政権が実現した。',
      significance:'この運動の成果は西欧諸国における女性参政権拡大運動全体に大きな刺激を与え、20世紀を通じた女性の政治的・社会的地位向上の重要な出発点となった。',
      debate:'過激な直接行動(放火・器物損壊など)が世論を動かす上で有効であったか、むしろ穏健派(サフラジスト)の地道な啓発活動こそが決定的であったかについては歴史家の間で評価が分かれる。'
    } },
  { id:'boer_war', name:'ボーア戦争(南アフリカ戦争)', category:'war', lat:-26.2, lng:28.05, start:1899, end:1902, region:'南アフリカ',
    desc:{
      background:'南アフリカでの金・ダイヤモンド鉱山発見によるイギリス系入植者の流入と、ボーア人共和国の独立維持への強い意志が、両者の対立を先鋭化させた背景にある。',
      process:'当初ボーア人のゲリラ戦術に苦戦したイギリス軍は、農地焼き払い(焦土作戦)とボーア人女性・子供を収容する強制収容所(コンセントレーション・キャンプ)の設置という苛烈な戦術に転じ、多数の収容者の死者を出しながら最終的に勝利した。',
      significance:'イギリスは南アフリカを併合し版図を広げたが、強制収容所の過酷な実態が国際的批判を招き、大英帝国の道徳的権威に大きな傷を残す結果となった。',
      debate:'強制収容所政策を『戦争の必要悪』とみるか、後の20世紀の強制収容所(ジェノサイド)政策の先駆的な負の遺産とみるかは、戦争犯罪・人道法の歴史を考える上で重要な論点となっている。'
    } },
  { id:'easter_rising', name:'イースター蜂起', category:'war', lat:53.35, lng:-6.26, start:1916, end:1916, region:'アイルランド(ダブリン)',
    desc:{
      background:'アイルランド自治法の成立が第一次世界大戦を理由に施行延期されたことへの強い失望と、急進的独立派(共和主義者)の存在が、武装蜂起の直接的背景にある。',
      process:'ダブリンの中央郵便局などを占拠して独立を宣言したが、市民の広範な支持を得られないまま数日でイギリス軍に鎮圧され、当初は世論の同情も薄かった。',
      significance:'しかし蜂起指導者たちへの即決的な処刑という強硬な事後対応が世論を一変させ、以後急進的独立運動(シン・フェイン党)への支持を急速に拡大させる決定的な転機となった。',
      debate:'蜂起自体は軍事的に稚拙で民衆の支持も薄かったにもかかわらず、その後の記憶・象徴化を通じてアイルランド独立運動の『建国神話』的地位を占めるに至った過程は、歴史的記憶の政治性を考える好例とされる。'
    } },
  { id:'irish_independence', name:'アイルランド自由国の成立', category:'event', lat:53.35, lng:-6.26, start:1921, end:1922, region:'アイルランド',
    desc:{
      background:'イースター蜂起後の独立戦争(ゲリラ戦)の激化と、双方の疲弊が、妥協的な条約による解決を模索する背景となった。',
      process:'英愛条約により、アイルランド島南部26県が『自由国』としてイギリス連邦内の自治領となる一方、プロテスタント系住民の多い北部6県(北アイルランド)はイギリスに残留するという妥協的な分割案が採択された。',
      significance:'アイルランド島の分割は南部の独立という悲願の達成と同時に、北アイルランドという新たな紛争の火種を将来に残す結果となった。',
      debate:'条約への賛否をめぐりアイルランド国内で内戦(条約派対反条約派)が勃発したことは、独立達成後もなお『完全な共和国』を求めるか『妥協的自治』を受け入れるかで国論が深く分裂していたことを示している。'
    } },
  { id:'nhs_welfare_state', name:'福祉国家の建設(国民保健サービス発足)', category:'event', lat:51.51, lng:-0.13, start:1945, end:1948, region:'イギリス',
    desc:{
      background:'第二次世界大戦中に作成されたベヴァリッジ報告書が、戦後社会における『欠乏・疾病・無知・不潔・怠惰』という五つの巨悪への対策として包括的な社会保障を提唱したことが構想の出発点である。',
      process:'戦後総選挙でチャーチルを破ったアトリー労働党政権のもと、既存の民間・地方病院を統合して国営化し、原則無料の医療サービス(NHS)を1948年に発足させ、年金・失業保険などと合わせた総合的な福祉制度を整備した。',
      significance:'『ゆりかごから墓場まで』と称される包括的福祉国家モデルは、以後の西欧諸国における社会保障制度設計の一つの範例となった。',
      debate:'財源(税負担)と給付水準のバランス、医師会の当初の強い抵抗など、公的医療制度の持続可能性をめぐる論争は制度発足当初から現在に至るまで続いている。'
    } },
  { id:'thatcher', name:'マーガレット・サッチャー', category:'person', lat:51.51, lng:-0.13, start:1925, end:2013, region:'イギリス', parentId:'uk_britain',
    desc:{
      background:'1970年代の『イギリス病』と呼ばれた経済停滞・労働争議の頻発が、既存の福祉国家路線への根本的な見直しを求める世論を高めた背景にある。',
      process:'国有企業(電話・航空・自動車産業など)の大規模な民営化、労働組合の権限を制限する法改正、金融ビッグバンなどの新自由主義的改革を断行し、フォークランド紛争での勝利も追い風に長期政権を維持したが、人頭税導入などをめぐる党内対立から退陣に追い込まれた。',
      significance:'その経済政策(『サッチャリズム』)は市場原理・小さな政府を志向する新自由主義の代表的モデルとして、以後の各国の経済政策にも大きな影響を及ぼした。',
      debate:'経済再生・国際競争力回復という功績を強調する評価がある一方、炭鉱労働者ストライキの強硬な鎮圧や地域間・階層間格差の拡大を招いたとする批判も根強く、評価は今なお国内で鋭く二分されている。'
    } },
  { id:'falklands_war', name:'フォークランド紛争', category:'war', lat:-51.8, lng:-59.5, start:1982, end:1982, region:'南大西洋(フォークランド諸島)',
    desc:{
      background:'経済的困難に直面していたアルゼンチン軍事政権が国内の不満をそらす狙いもあり、かねてから領有権を主張していたフォークランド諸島(マルビナス諸島)を占領したことが開戦の直接の契機である。',
      process:'イギリスは遠く離れた南大西洋へ機動部隊を派遣するという困難な軍事作戦を敢行し、数週間の戦闘の末アルゼンチン軍を降伏させ諸島を奪還した。',
      significance:'この勝利は国内で人気が低迷していたサッチャー政権への支持を劇的に回復させ、翌年の総選挙での圧勝につながるとともに、イギリスの軍事的プレゼンスへの国民的自信を回復させた。',
      debate:'遠隔地の小さな島嶼の領有権をめぐりこれほどの軍事的資源を投じたことの妥当性については、国家の威信と実利的コストのどちらを優先すべきかという議論を今なお呼んでいる。'
    } },
  { id:'good_friday_agreement', name:'ベルファスト合意(グッドフライデー合意)', category:'treaty', lat:54.6, lng:-5.93, start:1998, end:1998, region:'北アイルランド(ベルファスト)',
    desc:{
      background:'30年近くに及んだ北アイルランド紛争(『トラブルズ』)による多数の死傷者と、双方の武装勢力・政治指導者の間に和平への機運が次第に醸成されていたことが合意成立の背景にある。',
      process:'イギリス・アイルランド両政府と北アイルランドの主要政党(統一派・民族派双方)が交渉に参加し、自治政府(権力分有型)の設置とアイルランド共和国との協力機関設置などを盛り込んだ包括的合意が成立し、住民投票で承認された。',
      significance:'長期にわたった宗派間の暴力の連鎖に一応の終止符を打ち、権力分有(パワーシェアリング)による紛争解決モデルとして国際的にも高く評価される事例となった。',
      debate:'合意後も自治政府の機能停止・再開が繰り返されるなど政治的不安定さは残っており、根本的な宗派間・アイデンティティ対立が完全に解消されたわけではない点には留意が必要である。'
    } },

  { id:'hugh_capet', name:'ユーグ・カペー', category:'person', lat:48.86, lng:2.35, start:940, end:996, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'カロリング朝の権威が長期にわたり形骸化する中、実力を蓄えた有力諸侯(ロベール家)が既に事実上の主導権を握っていたことが即位の背景にある。',

  { id:'capetian_dynasty', name:'カペー朝', category:'dynasty', lat:48.86, lng:2.35, start:987, end:1328, region:'フランス',

      debate:'王権拡大の要因を歴代の王個人の政治的手腕に求めるか、単に直系男子継承が途切れなかったという偶然的な血統上の幸運を重視するかで、評価の力点が異なる。'
    } },
  { id:'philip_ii_augustus', name:'フィリップ2世(尊厳王)', category:'person', lat:48.86, lng:2.35, start:1165, end:1223, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'イングランド王家(プランタジネット家)がフランス国内に有する広大な所領(アンジュー帝国)が、フランス王権にとって最大の脅威・障害となっていたことが対立の背景にある。',
      process:'イングランド王ジョンの失政(重税・恣意的統治への貴族の反発)につけ込み、ノルマンディーをはじめとする大陸領土の大半を奪取し、ブーヴィーヌの戦いでイングランド・神聖ローマ皇帝連合軍を破ってその成果を確定させた。',
      significance:'王領を大幅に拡大したことでフランス王権の実質的な力は飛躍的に強化され、以後のカペー朝による中央集権化の大きな転機となった。',
      debate:'ブーヴィーヌの勝利がもたらしたフランス国内における『国民的一体感』の高揚をどこまで近代的ナショナリズムの先駆と評価すべきかについては、時代錯誤を避けた慎重な議論が求められる。'
    } },
  { id:'louis_ix_saint', name:'ルイ9世(聖王)', category:'person', lat:48.86, lng:2.35, start:1214, end:1270, region:'フランス', parentId:'france_kingdom',
    desc:{

      significance:'対外的な十字軍事業は失敗に終わったが、その公正な統治と敬虔さは中世キリスト教的理想の王として高く評価され、没後まもなく列聖された。',

    } },
  { id:'philip_iv_fair', name:'フィリップ4世(端麗王)', category:'person', lat:48.86, lng:2.35, start:1268, end:1314, region:'フランス', parentId:'france_kingdom',
    desc:{
      background:'対外戦争や行政機構拡充による財政需要の増大が、聖職者への課税権をめぐる教皇との対立、さらには富裕なテンプル騎士団への攻撃という一連の強硬策の背景にある。',
      process:'聖職者課税をめぐり対立した教皇ボニファティウス8世を捕縛させる(アナーニ事件、教皇はまもなく憤死)強硬手段に出て、財政難と口実に乗じテンプル騎士団を異端として弾圧・解散させてその莫大な財産を接収した。',
      significance:'教皇権に対する世俗王権の優位を明確に示し、後の教皇のアヴィニョン移転(教皇のバビロン捕囚)という教会権威の著しい低下を招く転換点となった。',
      debate:'テンプル騎士団弾圧の動機については、財政的困窮による資産収奪を重視する見方が一般的だが、当時の異端審問記録の信憑性そのものにも疑問が呈されている。'
    } },
  { id:'avignon_papacy', name:'教皇のバビロン捕囚(アヴィニョン捕囚)', category:'event', lat:43.95, lng:4.81, start:1309, end:1377, region:'アヴィニョン(南フランス)',
    desc:{
      background:'フィリップ4世との激しい対立の末に教皇となったフランス人教皇が、フランス王権の強い影響下で教皇庁運営を行わざるを得ない状況にあったことが移転の背景にある。',

      significance:'教皇権威の世俗権力への従属という前例は、以後の宗教改革期における教皇権批判の歴史的先例としてしばしば引き合いに出されることとなった。',
