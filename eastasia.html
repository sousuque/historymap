  { id:"imjin_war", name:"文禄・慶長の役(壬辰・丁酉倭乱)", category:"war", lat:35.18, lng:129.08, start:1592, end:1598, region:"朝鮮半島", desc:{background:'豊臣秀吉による国内統一達成後、大陸進出という新たな対外的野心が、朝鮮出兵という前代未聞の軍事行動の背景となった。', process:'日本軍が朝鮮に侵攻し当初は電撃的な進撃を見せたが、李舜臣率いる朝鮮水軍の亀甲船を用いた海上戦術と明の援軍、義兵(民間抵抗軍)の活動により戦線は膠着し、秀吉の死去を機に日本軍は撤退した。', significance:'この戦争は朝鮮半島に甚大な人的・文化的被害(景福宮焼失、多数の技術者連行)をもたらす一方、明の疲弊は後の女真族(後金・清)台頭を許す一因ともなり、東アジア国際秩序の大きな転換点となった。', debate:'この戦争を「日本の一方的な侵略」とみる朝鮮・韓国側の一貫した歴史認識と、日本国内における評価(秀吉の対外政策の一環としての位置づけ)との間の記憶の相違が、日韓関係史における重要な歴史認識問題として今も存在する。'} },
  { id:"cixi_empress", name:"西太后", category:"person", parentId:"qing_dynasty", lat:39.9, lng:116.4, start:1835, end:1908, region:"清(北京)", desc:{background:'咸豊帝の側室として同治帝の生母となったことが、幼帝の摂政という形での実権掌握の背景となった。', process:'同治帝・光緒帝二代にわたり垂簾聴政という形で約半世紀にわたり事実上の最高権力者であり続け、洋務運動を一定程度支持しつつも光緒帝が主導した戊戌変法(急進的立憲改革)をクーデタで弾圧し、義和団を支持して8か国連合軍との戦争に至るなど保守的な政治判断を繰り返した。', significance:'清朝末期の実質的な最高権力者として半世紀にわたり君臨したが、その保守的・場当たり的な統治判断は清朝の近代化改革を遅らせ、結果的に王朝滅亡を早める一因になったとする評価が一般的である。', debate:'彼女個人の資質・判断への評価と、清朝末期という統治構造自体がすでに抱えていた構造的な限界(満漢対立・地方軍事化)のどちらをより重視して清朝滅亡の要因を分析すべきかが論じられる。'} },
  { id:"wuxu_reform", name:"戊戌の変法", category:"event", lat:39.9, lng:116.4, start:1898, end:1898, region:"清(北京)", desc:{background:'日清戦争での壊滅的敗北が、洋務運動という技術偏重の近代化の限界を痛感させ、より根本的な政治制度改革の必要性への認識を高めたことが背景となった。', process:'光緒帝が康有為・梁啓超ら改革派知識人を登用し科挙制度改革・立憲君主制導入など急進的な改革を約100日間にわたり矢継ぎ早に実施したが、既得権益層の抵抗と西太后によるクーデタにより改革は頓挫し、光緒帝は幽閉され改革派の一部は処刑された。', significance:'「百日維新」とも呼ばれるこの改革の急進性と短命さは、日本の明治維新との対比でしばしば論じられ、その失敗は清朝内部からの近代化改革の限界を露呈させ、以後の急進的な革命運動(孫文らの革命派)への機運を高める一因となった。', debate:'この改革の失敗要因を、改革推進派の政治的基盤の脆弱さ(実権を欠く光緒帝への依存)に求めるか、既得権益層(西太后を含む保守派官僚)の抵抗の強固さに求めるかで議論がある。'} },
  { id:"kang_youwei", name:"康有為", category:"person", parentId:"wuxu_reform", lat:39.9, lng:116.4, start:1858, end:1927, region:"清(広東・北京)", desc:{background:'伝統的な儒教経典解釈を再検討し、孔子自身を進歩的な改革者として再解釈する独自の学説(公羊学的解釈)を展開したことが、彼の改革思想の理論的背景となった。', process:'光緒帝に直接進言する機会を得て戊戌変法を主導したが、西太后のクーデタにより改革は頓挫し日本・欧米への亡命を余儀なくされ、亡命中は立憲君主制の維持を主張し続け、後の共和革命(孫文らの路線)とは一線を画す立場をとった。', significance:'儒教の枠内での漸進的な立憲君主制改革を志向した路線として、後の急進的な共和革命路線との対比において、中国近代化における改革路線の多様性を示す重要な事例となっている。', debate:'彼の立憲君主制路線と孫文らの共和革命路線という二つの近代化戦略のどちらがより現実的であったか、辛亥革命後の共和政の混迷(軍閥割拠)を踏まえて、中国近代史における「漸進改革」対「急進革命」の評価が論じられる。'} },
  { id:"tongmenghui", name:"中国同盟会", category:"event", lat:35.68, lng:139.65, start:1905, end:1912, region:"日本(東京)", desc:{background:'清朝の度重なる改革の遅れと日清戦争・義和団事件を経た国家的屈辱への若い知識人層の危機感が、革命組織結成の背景となった。', process:'孫文を中心に日本の東京で複数の革命団体を統合して結成され、「三民主義」(民族・民権・民生)を綱領に掲げて各地で武装蜂起を繰り返し試みたが、いずれも失敗に終わりながらも革命の機運を着実に醸成した。', significance:'この組織的基盤が最終的に1911年の辛亥革命を成功に導く母体となり、後の中国国民党の直接の前身としても、中国近代革命運動史における中心的な組織的達成となった。', debate:'武漢での辛亥革命勃発自体は同盟会の直接の計画ではなく偶発的な事件(新軍内の爆発事故発覚)を契機としており、この組織の長年の活動とこの「偶然の成功」との関係をどう評価すべきかが論じられる。'} },
  { id:"abolition_of_keju", name:"科挙の廃止", category:"event", lat:39.9, lng:116.4, start:1905, end:1905, region:"清(北京)", desc:{background:'日清戦争敗北と義和団事件を経て、伝統的な儒教経典中心の科挙制度が近代国家に必要な実務的人材育成に適さないという認識が広まったことが背景となった。', process:'西洋式の学校制度・教育課程を導入する新政改革の一環として、1300年近く続いた科挙制度が正式に廃止され、これに代わり近代的な学堂(学校)制度が整備された。', significance:'この廃止は中国の伝統的な官僚登用・社会移動のシステムを根本的に転換させる画期的な出来事であり、既存の科挙予備軍(儒者・書生)層の不満と社会的地位喪失は、皮肉にも清朝への支持基盤をさらに掘り崩す結果となった。', debate:'科挙という1300年続いた制度の廃止が、儒教的価値観そのものの権威失墜と結びつき、辛亥革命への機運をどこまで直接的に加速させたかが、制度改革と政治的正統性の関係という観点から論じられる。'} },

  // ===================== 近代中国(中華民国・中華人民共和国) =====================
  { id:"xinhai_revolution", name:"辛亥革命", category:"revolution", lat:30.58, lng:114.27, start:1911, end:1912, region:"清(武昌)", relatedIds:["sun_yat_sen"], desc:{background:'科挙廃止による伝統的正統性の動揺と、清朝の改革(新政)への期待と実際の遅々とした進展への幻滅が蓄積していたことが、この革命の背景となった。', process:'武漢の新軍内での偶発的な爆発事故発覚を機に蜂起(武昌起義)が起こり、これが予想外の速さで全国的な独立宣言の連鎖を引き起こし、清朝は袁世凱に事態収拾を委ねたが、最終的に宣統帝(溥儀)が退位して2000年以上続いた中国の帝政は終焉した。', significance:'アジアにおける最初の共和政国家樹立という世界史的意義を持つ革命であったが、革命後の実権は結局清朝の重臣であった袁世凱に渡り、その後の軍閥割拠という長期の政治的混乱を招く結果となった。', debate:'この革命の「成功」を、孫文ら革命派の長年の努力の成果とみるか、清朝内部の脆弱性(偶発的事件による予想外の連鎖崩壊)による受動的な結果とみるかで、その歴史的評価が分かれる。'} },
  { id:"sun_yat_sen", name:"孫文(孫中山)", category:"person", parentId:"republic_of_china", lat:32.06, lng:118.79, start:1866, end:1925, region:"中華民国(南京)", desc:{background:'ハワイ・香港での西洋式教育を通じて得た近代的な政治思想と、清朝の腐敗・弱体化への強い危機感が、彼の革命運動への献身の背景となった。', process:'「三民主義」(民族独立・民権伸張・民生安定)を掲げて中国同盟会を組織し数々の武装蜂起を試みるも失敗を重ねたが、辛亥革命成功後に中華民国臨時大総統に就任、実権を袁世凱に譲った後も国民党を率いて革命の理想実現に生涯を捧げた。', significance:'「国父」として台湾・中国大陸双方で今も尊崇される、アジアにおける共和主義革命の最も重要な指導者の一人であり、その三民主義は以後の中国国民党・共産党双方の建国理念に影響を残した。', debate:'権力の実質を早々に袁世凱に譲った彼の判断を、共和政実現のための現実的な妥協とみるか、その後の軍閥混乱を招いた戦略的な誤算とみるかで評価が分かれる。'} },
  { id:"yuan_shikai", name:"袁世凱", category:"person", parentId:"republic_of_china", lat:39.9, lng:116.4, start:1859, end:1916, region:"中華民国(北京)", desc:{background:'清朝の近代化軍(北洋軍)を掌握する軍事的実力者として、辛亥革命の混乱収拾を清朝・革命派双方から期待される立場にあったことが背景となった。', process:'清朝最後の皇帝を退位させる交渉を主導する見返りに中華民国初代大総統の地位を得たが、次第に独裁的傾向を強め国会解散・帝政復活(自ら皇帝を称する)を強行したため各地の軍事的実力者の反発(護国戦争)を招き、帝政はわずか数ヶ月で撤回され失意のうちに病死した。', significance:'彼の帝政復活の失敗と死は中国を統一的に統治し得る中央権力の不在という状況を決定的にし、以後10年以上続く軍閥割拠時代への直接的な引き金となった。', debate:'彼を「共和政を裏切った野心家」とみる評価が一般的だが、当時の中国における統一的統治の困難さを踏まえ、彼の強権的手法を秩序回復のための現実的判断として一定程度弁護する見方もある。'} },
  { id:"republic_of_china", name:"中華民国", category:"nation", lat:32.06, lng:118.79, start:1912, end:1949, region:"中国(南京・重慶)", relatedIds:["may_fourth_movement", "chinese_civil_war", "second_sino_japanese_war", "chiang_kai_shek", "twenty_one_demands", "new_culture_movement", "ccp_founding", "first_united_front", "northern_expedition", "shanghai_massacre", "zhang_zuolin_bomb", "xian_incident", "lugouqiao_incident", "nanjing_incident", "roc_taiwan"], desc:{background:'辛亥革命による清朝滅亡が、アジア初の共和政国家樹立という新たな国家体制構築の背景となった。', process:'建国当初から袁世凱の帝政復活の企てと失敗、その死後の軍閥割拠という深刻な政治的分裂を経験し、国民党による北伐で一時的な統一を達成したものの日中戦争・国共内戦を経て1949年に大陸の支配権を共産党に奪われ、以後は台湾に拠点を移して統治を継続している。', significance:'アジアにおける最初の共和政国家として、その建国からの混乱の歴史は「共和政の理念」と「統一的統治の実現」との間の困難な緊張関係を示す重要な事例となっている。', debate:'1949年以降、大陸の中華人民共和国とどちらが「正統な中国」であるかという「二つの中国」問題は、国際政治・国連代表権問題(1971年のアルバニア決議)を通じて今日まで続く重要な外交的懸案であり続けている。'} },
  { id:"may_fourth_movement", name:"五四運動", category:"event", lat:39.9, lng:116.4, start:1919, end:1919, region:"中華民国(北京)", desc:{background:'第一次世界大戦後のパリ講和会議で、日本が第一次大戦中に獲得した山東省の権益がそのまま中国へ返還されず日本の手に残されたことへの民衆の強い反発が、この運動の直接的契機となった。', process:'北京の学生を中心に大規模な抗議デモが発生し、これが全国的な反日ボイコット運動・愛国主義運動へと急速に発展し、同時に旧来の儒教的価値観を批判し科学と民主主義を重視する「新文化運動」とも結びついた。', significance:'この運動を通じて中国のナショナリズムと近代的な知的覚醒が本格的に結びつき、翌年の中国共産党結成にもつながる思想的・組織的な土壌を形成した、20世紀中国政治思想史上決定的な画期である。', debate:'この運動が「愛国主義的な政治運動」としての側面と「儒教批判・文化革新運動」としての側面のどちらをより本質的な性格とみるべきか、その複合的な性格をめぐる評価が論じられる。'} },
  { id:"chiang_kai_shek", name:"蔣介石", category:"person", parentId:"republic_of_china", lat:32.06, lng:118.79, start:1887, end:1975, region:"中華民国", desc:{background:'孫文の信任を得て黄埔軍官学校の校長に就任し軍事的基盤を築いたことが、国民党内での指導的地位確立の背景となった。', process:'北伐を主導して軍閥を打倒し形式的な中国統一を達成したが直後に共産党弾圧(上海クーデタ)に転じ、日中戦争では抗戦を指導しつつも国共内戦では最終的に共産党に敗れ台湾へ撤退し、以後「中華民国」総統として台湾統治を継続した。', significance:'20世紀中国の激動を体現する指導者として、日中戦争における抗戦指導は連合国の一員としての中国の地位確立に貢献したが、国共内戦での敗北は彼の統治の限界(経済政策の失敗・腐敗)を露呈させた。', debate:'彼の統治(特に国共内戦敗北)の要因を、国民党政権自体の腐敗・経済失政に求めるか、共産党の巧みな農村動員戦略という外的要因に求めるかで、中国近代史上の評価が分かれる。'} },
  { id:"twenty_one_demands", name:"二十一ヶ条要求", category:"event", lat:39.9, lng:116.4, start:1915, end:1915, region:"中華民国(北京)", desc:{background:'第一次世界大戦でヨーロッパ列強が中国から目を離している間隙を突き、日本が中国における権益拡大を図ったことが背景となった。', process:'日本が中華民国(袁世凱政権)に対し山東省のドイツ権益継承や南満洲・東部内蒙古における権益拡大など広範な要求を突きつけ、最終的に一部修正のうえ受諾を強いられた。', significance:'この要求は中国国内に強い反日感情を植え付け、後の五四運動における反日ナショナリズムの高揚の直接的な歴史的背景となった。', debate:'この要求を袁世凱政権が受諾した経緯(国内の政治的立場強化のための取引的側面もあったとされる)は、当時の中国指導者の対応の是非をめぐる評価に影響している。'} },
  { id:"new_culture_movement", name:"新文化運動", category:"event", lat:39.9, lng:116.4, start:1915, end:1919, region:"中華民国(北京)", desc:{background:'辛亥革命後も旧態依然とした儒教的価値観・因習が中国社会に根強く残っていることへの若手知識人層の危機感が、この文化運動の背景となった。', process:'陳独秀・胡適らが雑誌『新青年』を拠点に、儒教批判・白話文(口語文)運動・科学と民主主義の称揚を展開し、五四運動と結びついてマルクス主義の本格的な紹介・受容も進んだ。', significance:'この運動を通じて口語文学(魯迅の作品など)が確立され、伝統的な文語文中心の中国文学は根本的な転換を遂げるとともに、この知的土壌からマルクス主義・共産主義の受容が急速に進み中国共産党結成へとつながった。', debate:'この運動における徹底した伝統文化批判(「孔家店打倒」)が、中国の文化的アイデンティティにとってどこまで健全な近代化への必要な過程であったか、それとも行き過ぎた自己否定であったかが、今日の中国における伝統文化再評価の動きとも関連して論じられる。'} },
  { id:"ccp_founding", name:"中国共産党の結成", category:"event", lat:31.23, lng:121.47, start:1921, end:1921, region:"中華民国(上海)", desc:{background:'五四運動・新文化運動を通じたマルクス主義の受容拡大と、ロシア革命の成功に触発された知識人層の期待が、この組織結成の思想的背景となった。', process:'陳独秀・李大釗らを中心にコミンテルン(共産主義インターナショナル)の支援・指導のもと上海で秘密裏に結成され、当初は都市労働者を組織基盤とする方針をとったが、後に毛沢東の主導で農村を基盤とする独自の革命戦略へと転換していった。', significance:'結成当初はわずか数十人規模の小組織であったが、最終的に1949年の中華人民共和国建国という20世紀最大級の政治的達成を成し遂げるに至った、世界共産主義運動史上最も成功した事例の一つである。', debate:'都市労働者中心という当初のマルクス主義正統理論に基づく戦略から、毛沢東による農村基盤・農民動員という中国独自の革命路線への転換が、この党の最終的な成功にとってどこまで決定的であったかが論じられる。'} },
  { id:"first_united_front", name:"第一次国共合作", category:"event", lat:23.13, lng:113.26, start:1924, end:1927, region:"中華民国(広東)", desc:{background:'軍閥割拠の混乱を打開し中国統一を目指す孫文が、ソ連コミンテルンの支援と共産党の組織力を活用する必要性を認識したことが、この統一戦線結成の背景となった。', process:'国民党と共産党が協力して軍閥打倒を目指す統一戦線を結成し、ソ連の援助のもと黄埔軍官学校を設立して軍事力を整備、北伐開始への準備を整えたが、孫文の死後に指導権を握った蔣介石が上海クーデタで共産党員を大量弾圧し、この統一戦線は崩壊した。', significance:'イデオロギーの異なる二大政党の一時的な協力という稀有な事例として、この崩壊は以後20年以上続く国共内戦という深刻な対立の直接的な出発点となった。', debate:'蔣介石による共産党弾圧(上海クーデタ)を、共産主義の脅威を早期に排除する必要な措置とみるか、統一戦線の理念を裏切る背信行為とみるかで、国共両党の歴史認識は根本的に対立している。'} },
  { id:"northern_expedition", name:"北伐", category:"war", lat:32.06, lng:118.79, start:1926, end:1928, region:"中国(広東〜北京)", desc:{background:'軍閥割拠による中国の分裂状態を打破し統一を実現するという国民党・共産党共通の目標が、この軍事行動の背景となった。', process:'蔣介石率いる国民革命軍が広東を出発して北上し、各地の軍閥を次々と打倒・帰順させて形式的な中国統一を達成したが、この過程で蔣介石は共産党員の粛清(上海クーデタ)を断行し国共関係を決定的に悪化させた。', significance:'形式的には中国統一を達成したが、実質的には主要な軍閥が国民党の傘下で自立性を保つ緩やかな統合にとどまり、真の中央集権的統一には至らなかった、南京国民政府の限定的な統一の性格を示す事例である。', debate:'この北伐による統一を「実質を伴う真の統一」とみるか「軍閥の看板の掛け替えにとどまる名目的統一」とみるかで、南京国民政府期の中国統治の実態評価が分かれる。'} },
  { id:"shanghai_massacre", name:"上海クーデター(四・一二事件)", category:"event", lat:31.23, lng:121.47, start:1927, end:1927, region:"中華民国(上海)", desc:{background:'北伐の進展とともに勢力を拡大する共産党・労働者運動への蔣介石の警戒感と、彼を支援する浙江財閥・列強の反共的圧力が、この弾圧の背景となった。', process:'上海の労働者組織・共産党員を標的に青幇(秘密結社)とも連携した大規模な武力弾圧を行い、多数の共産党員・労働運動家を殺害し、これにより第一次国共合作は事実上崩壊した。', significance:'この事件を機に共産党は都市部での活動基盤をほぼ喪失し、毛沢東らが農村部を拠点とする独自のゲリラ的革命戦略へ転換する直接的な契機となった。', debate:'この弾圧を「共産主義拡大の脅威に対する国民党の正当な自己防衛」とみるか「労働者・共産党への裏切りと残虐な弾圧」とみるかで、国共両党の歴史叙述は鋭く対立している。'} },
  { id:"zhang_zuolin_bomb", name:"張作霖爆殺事件", category:"event", lat:41.8, lng:123.43, start:1928, end:1928, region:"満洲(奉天)", desc:{background:'満洲を実効支配する軍閥張作霖が日本の関東軍の意向に必ずしも従順でなくなっていたことへの不満が、この暗殺事件の背景となった。', process:'関東軍の一部将校が張作霖の乗った列車を独断で爆破し暗殺したが、この行為は日本政府・軍中央の正式な承認を得たものではなく、関東軍の独走(統帥権の逸脱)を象徴する事件であった。', significance:'この暗殺は結果的に息子の張学良を国民党側(蔣介石政権)へ接近させることとなり、日本の当初の思惑とは逆に満洲における日本の影響力後退を招いたが、軍部の独走という構造的問題は是正されず後の満洲事変へとつながっていった。', debate:'この事件における軍中央の統制欠如(関東軍の独断専行)が、なぜ処罰も限定的にとどまり、その後の満洲事変というより大規模な独走をも許すことになったのか、日本の文民統制の構造的欠陥として論じられる。'} },
  { id:"xian_incident", name:"西安事件", category:"event", lat:34.27, lng:108.95, start:1936, end:1936, region:"中華民国(西安)", desc:{background:'共産党討伐を優先する蔣介石の方針に対し、満洲を追われた張学良が抗日を優先すべきとする不満を強めていたことが、この事件の背景となった。', process:'張学良が視察に訪れた蔣介石を西安で拘束し、内戦停止と抗日統一戦線結成を要求し、周恩来が仲介する形で蔣介石はこれを受け入れ第二次国共合作が成立した。', significance:'この事件により国共内戦は一時停止され日本への抗戦のための統一戦線が形成されることとなり、これがなければ日中戦争における中国側の抵抗態勢はより脆弱であった可能性が高い、中国近代史の重要な転換点である。', debate:'張学良のこの行動を「抗日という国家的大義を優先した愛国的決断」とみるか「上官への抗命という規律違反」とみるかで評価が分かれ、彼はこの後半世紀以上にわたり軟禁生活を強いられることとなった。'} },
  { id:"lugouqiao_incident", name:"盧溝橋事件", category:"event", lat:39.85, lng:116.2, start:1937, end:1937, region:"中華民国(北京郊外)", desc:{background:'満洲事変以降、華北への日本の勢力拡大が進む中、北京郊外での日中両軍の緊張状態が続いていたことが、この事変の背景となった。', process:'盧溝橋付近での演習中の日本軍に対する銃撃事件(発端の詳細は不明)を機に日中両軍の武力衝突が発生し、現地レベルでの停戦交渉にもかかわらず日本政府が大規模な増派を決定したことで全面戦争(日中戦争)へと拡大した。', significance:'この局地的な軍事衝突が、和平的解決の努力にもかかわらず日本側の強硬姿勢によって全面戦争へとエスカレートしたことは、以後8年に及ぶ日中戦争という悲劇的な結末を招いた決定的な転換点となった。', debate:'最初の発砲が偶発的なものであったか意図的な挑発であったかは今も確定しておらず、局地紛争が全面戦争へと拡大した責任の所在(現地軍の独走か中央政府の判断か)についての史料的検証が続けられている。'} },
  { id:"second_sino_japanese_war", name:"日中戦争", category:"war", lat:39.85, lng:116.2, start:1937, end:1945, region:"中国全土", desc:{background:'盧溝橋事件を機とする日中両軍の武力衝突が、和平的解決の試みが失敗する中で全面戦争へと拡大したことが背景となった。', process:'日本軍は当初圧倒的な軍事的優位で主要都市を占領したが中国側は首都を重慶へ移して長期抗戦を継続し、国共両党が一時的に協力(第二次国共合作)しつつゲリラ戦・持久戦を展開、日本の真珠湾攻撃を機に太平洋戦争へと拡大した末、1945年の日本敗戦により終結した。', significance:'この戦争は推定2000万人規模の中国人犠牲者を出す20世紀最大級の悲劇の一つとなり、南京事件をはじめとする日本軍の行為をめぐる歴史認識問題は今日まで日中関係における重要な懸案であり続けている。', debate:'この戦争の犠牲者数・南京事件の実態などをめぐる日中両国間の歴史認識の相違は、東アジアにおける戦争責任・歴史教育のあり方をめぐる現在進行形の重要な外交的・学術的論争であり続けている。'} },
  { id:"nanjing_incident", name:"南京事件", category:"event", lat:32.06, lng:118.79, start:1937, end:1938, region:"中華民国(南京)", desc:{background:'上海攻略後の日本軍が首都南京への進撃を続ける中、現地軍の統制の緩みと中国側守備隊の混乱した撤退が、この事件の背景となった。', process:'南京占領後の日本軍により、投降兵・捕虜および多数の民間人が組織的・無差別に殺害されたとされ、この期間の犠牲者数については中国側と日本側とで大きく異なる推計が示されている。', significance:'この事件は日中戦争における日本軍の行為の中でも最も深刻な人道的問題として国際的にも記憶され、極東国際軍事裁判(東京裁判)においても重要な訴因の一つとして扱われた。', debate:'犠牲者数(数万人説から30万人説まで)や事件の性格づけ(組織的虐殺か個別の逸脱行為の集積か)をめぐる歴史認識の相違は、日中間の歴史教育・戦争責任論における最も先鋭な論争点であり続けている。'} },
  { id:"chinese_civil_war", name:"国共内戦", category:"war", lat:39.9, lng:116.4, start:1946, end:1949, region:"中国全土", desc:{background:'日中戦争終結後、抗日のために一時的に協力していた国民党と共産党の間で、戦後の中国統治権をめぐる根本的な対立が再燃したことが背景となった。', process:'当初は国民党が軍事的に優勢であったが、共産党の巧みな農村土地改革による農民の支持獲得と、国民党側の深刻な経済失政(ハイパーインフレ)・腐敗による民心離反により戦局は逆転し、1949年に共産党が中国大陸の支配権を確立し国民党は台湾へ撤退した。', significance:'この内戦の結果、中国大陸には共産党による中華人民共和国が、台湾には国民党による中華民国が並存する「二つの中国」問題が生まれ、この構造は今日の台湾海峡両岸関係の根本的な起源となっている。', debate:'国民党敗北の要因を、経済失政・腐敗という自滅的要因に求めるか、共産党の農村動員戦略の巧みさという要因に求めるかで、この内戦の帰趨に関する歴史的評価が分かれる。'} },
  { id:"mao_zedong", name:"毛沢東", category:"person", parentId:"peoples_republic_china", lat:39.9, lng:116.4, start:1893, end:1976, region:"中華人民共和国(北京)", desc:{background:'農村出身という経歴と、都市労働者中心のマルクス主義正統理論に対する独自の批判的視座が、農民を革命の主体とする彼独自の戦略構想の背景となった。', process:'長征を経て党内の指導権を確立し、抗日戦争・国共内戦を勝ち抜いて中華人民共和国を建国、その後は大躍進政策・文化大革命という急進的な社会主義建設を主導したが、これらは深刻な経済的混乱と人的犠牲(推定数千万人規模)を伴う結果となった。', significance:'中国共産党の建国の父として絶大な権威を持ち続け、その「農村が都市を包囲する」革命戦略は第三世界の他の共産主義運動にも大きな影響を与えたが、晩年の急進的政策の失敗は深刻な歴史的教訓を残した。', debate:'建国の功績と大躍進・文革の失政という光と影をどう総合的に評価すべきか、中国共産党自身が公式に採用した「功績が第一義、誤りは第二義」という評価枠組みの妥当性が今も国際的に論じられている。'} },
  { id:"peoples_republic_china", name:"中華人民共和国", category:"nation", lat:39.9, lng:116.4, start:1949, end:2030, region:"中国(北京)", relatedIds:["great_leap_forward", "cultural_revolution", "deng_xiaoping_reform", "tiananmen_incident", "hongkong_handover"], desc:{background:'国共内戦での勝利により中国大陸の実効支配を確立した共産党が、新たな国家体制樹立を宣言する必要が生じたことが背景となった。', process:'毛沢東が天安門で建国を宣言し、以後ソ連型の社会主義計画経済モデルを導入しつつ独自路線(大躍進・文革)を模索し、1978年のトウ小平による改革開放政策への転換を経て市場経済的要素を導入した高度経済成長を実現し、21世紀には世界第二位の経済大国へと発展した。', significance:'建国から70年余りで世界最大級の経済大国へと発展した事例として、社会主義体制と市場経済の組み合わせという独自の統治モデル(「中国式現代化」)は比較政治経済学上の重要な研究対象となっている。', debate:'この経済的成功を一党支配体制の安定性がもたらした利点とみるか、その裏に隠れた人権・自由の制約という代償を重視すべきかで、国際的な評価が大きく分かれ続けている。'} },
  { id:"great_leap_forward", name:"大躍進政策", category:"event", lat:39.9, lng:116.4, start:1958, end:1961, region:"中華人民共和国", desc:{background:'ソ連型の重工業優先モデルへの不満と、急速な経済発展・共産主義理想実現への毛沢東の焦りが、この急進的政策の背景となった。', process:'人民公社化による農業集団化の徹底と、非効率な小規模製鉄(「土法高炉」)による工業生産急増を目指したが、非科学的な農法(密植など)の強制や誇張された生産報告の横行により深刻な食糧生産の崩壊を招き、推定1500万人から4000万人規模の餓死者を出す未曾有の人為的飢饉を引き起こした。', significance:'20世紀最大級の人為的な人道的惨事の一つとして、イデオロギー的な理想の性急な追求が現実の統治判断を歪めるリスクを示す歴史的教訓として、比較政治学・経済史上重要な研究対象となっている。', debate:'この惨事の責任を毛沢東個人の判断ミスに帰すか、下級官僚による虚偽報告の連鎖という官僚制の構造的問題に帰すかで、中国共産党内部・学術研究双方において評価が分かれている。'} },
  { id:"cultural_revolution", name:"文化大革命", category:"event", lat:39.9, lng:116.4, start:1966, end:1976, region:"中華人民共和国", desc:{background:'大躍進政策の失敗による自らの権威低下への危機感と、劉少奇・トウ小平ら実務派官僚への政治的巻き返しの必要性が、毛沢東によるこの運動発動の背景となったとされる。', process:'「造反有理」を掲げる紅衛兵を動員して既存の党・政府機構や知識人・伝統文化を攻撃させ、劉少奇をはじめとする政敵を失脚させたが、この過程で行政機構は麻痺し教育制度は崩壊、多数の知識人・文化財が迫害・破壊される深刻な社会的混乱が10年以上続いた。', significance:'毛沢東の死去とその後の四人組逮捕により終結したこの運動は、中国共産党自身が後に「建国以来最大の挫折」と公式に総括する未曾有の混乱であり、この反省がトウ小平による改革開放路線への転換の重要な背景となった。', debate:'この運動の本質を毛沢東個人の権力闘争の道具とみるか、彼が抱いていた理想主義的な官僚制批判・平等主義理念の暴走とみるかで、その動機分析における評価が分かれる。'} },
  { id:"deng_xiaoping_reform", name:"鄧小平の改革開放", category:"event", lat:22.54, lng:114.06, start:1978, end:1989, region:"中華人民共和国", desc:{background:'文化大革命で二度にわたり失脚・復権を経験した経歴が、彼の現実主義的な統治姿勢と改革への強い意志の背景となった。', process:'毛沢東死後の権力闘争を勝ち抜き実権を掌握すると「白猫黒猫論」に象徴される実用主義のもと改革開放政策を断行し市場経済的要素を導入して高度経済成長の基盤を築いたが、1989年の天安門事件では民主化要求運動を武力で鎮圧する決断も下した。', significance:'「改革開放の総設計師」として、その経済改革は中国を世界第二位の経済大国へと押し上げる決定的な転換点となったが、政治的自由化には一貫して慎重な姿勢を貫いた。', debate:'経済的自由化と政治的統制の維持という二つの路線を同時に追求したこの「トウ小平モデル」が、長期的に持続可能な統治形態であるかどうかは、比較政治学上今も重要な検証課題となっている。'} },
  { id:"tiananmen_incident", name:"天安門事件", category:"event", lat:39.9, lng:116.4, start:1989, end:1989, region:"中華人民共和国(北京)", desc:{background:'改革開放による経済成長の一方でインフレ・格差拡大・官僚腐敗への不満が高まる中、開明派指導者胡耀邦の死去が、学生を中心とする追悼・民主化要求デモの直接的契機となった。', process:'北京天安門広場を中心に全国的に拡大した学生・市民の民主化要求運動に対し、党内の対応をめぐる路線対立(趙紫陽の融和路線対李鵬らの強硬路線)を経て、最終的に人民解放軍による武力鎮圧が実行され多数の死傷者が出た。', significance:'この鎮圧は中国共産党の統治における経済的自由化と政治的自由化を切り離す方針を決定的に確定させ、以後の中国の統治モデル(経済成長による正統性確保と政治的統制の両立)の重要な転換点となった。', debate:'この事件の犠牲者数・鎮圧の詳細な経緯は中国国内では今も公的な議論が厳しく制限されており、この記憶の統制のあり方自体が、国家による歴史認識管理の問題として国際的に注目され続けている。'} },
  { id:"hongkong_handover", name:"香港返還", category:"event", lat:22.32, lng:114.17, start:1997, end:1997, region:"香港", desc:{background:'1898年の新界租借条約(99年間)の期限が近づく中、中英両国が香港の将来的な地位について交渉する必要が生じたことが背景となった。', process:'サッチャー・トウ小平会談を経て中英共同声明が締結され、「一国二制度」のもと香港が中国に返還されつつも高度な自治(資本主義体制・独自の法制度)を50年間維持するという枠組みが定められた。', significance:'社会主義国家が資本主義的な自治区域を内包するという前例のない統治実験として国際的に注目されたが、2020年の香港国家安全法制定以降はこの自治の実質的な後退が国際的に強く懸念されている。', debate:'「一国二制度」が当初の約束通り機能しているか、それとも中国中央政府による統制強化により事実上形骸化しつつあるかについて、国際的な評価と中国政府の見解が鋭く対立している。'} },
  { id:"xi_jinping", name:"習近平", category:"person", parentId:"peoples_republic_china", lat:39.9, lng:116.4, start:1953, end:2035, region:"中華人民共和国(北京)", desc:{background:'文化大革命期に下放(農村労働)を経験した「知識青年」世代としての経歴と、地方統治での実績の蓄積が、党内での権力基盤確立の背景となった。', process:'総書記就任後、反腐敗運動を通じて党内の政敵を排除しつつ権力を集中させ、国家主席の任期制限を撤廃(2018年)して長期統治の制度的基盤を整え、「中国の夢」を掲げた民族的威信の向上と、香港国家安全法・新疆政策など統制強化策を進めている。', significance:'トウ小平以来の集団指導体制の慣行から、より個人への権力集中を強める統治スタイルへの転換を体現しており、この変化は中国の今後の政治的方向性を考える上で国際的に重要な観察対象となっている。', debate:'任期制限撤廃という措置を、安定した長期的な国家戦略遂行のための必要な制度変更とみるか、権威主義的な個人独裁への回帰とみるかで、国際的な評価が大きく分かれている。'} },

  // ===================== 中華民国(台湾)・台湾現代史 =====================
  { id:"roc_taiwan", name:"中華民国(台湾)", category:"nation", lat:25.03, lng:121.56, start:1949, end:2030, region:"台湾(台北)", relatedIds:["incident_228","taiwan_democratization"], desc:{background:'国共内戦での敗北により、国民党政権が大陸での統治権を失い台湾へ拠点を移す必要に迫られたことが背景となった。', process:'蔣介石率いる国民党政権が台湾に「中華民国」政府を樹立し、当初は大陸反攻を掲げつつ戒厳令下での権威主義的統治を続けたが、1980年代後半から民主化が進み、現在は独自の民主的政治制度を発展させている。', significance:'大陸の中華人民共和国との「二つの中国」問題は、国連代表権問題(1971年のアルバニア決議による中国代表権の交代)を経て今日まで続く東アジア国際政治の最重要懸案の一つであり続けている。', debate:'台湾の国際的地位(独立した主権国家か、中国の一部か)をめぐる問題は、両岸関係・米中関係の中心的な地政学的争点として現在も極めて重要な国際政治上の論争であり続けている。'} },
  { id:"incident_228", name:"二・二八事件", category:"event", lat:25.03, lng:121.56, start:1947, end:1947, region:"台湾(台北)", desc:{background:'日本統治終了後に台湾を接収した国民党政権の統治(本省人への差別的対応・経済的混乱・汚職)への台湾住民の不満が、この事件の背景となった。', process:'闇タバコ取り締まりをめぐる小さな衝突が全島規模の抗議運動へと拡大し、国民党政権はこれを武力で徹底的に弾圧し、知識人・エリート層を含む多数の犠牲者(推定数千人から数万人)を出した。', significance:'この弾圧とそれに続く「白色テロ」と呼ばれる長期の戒厳令下での言論統制は、台湾社会に長く「本省人・外省人」間の深刻な分断と記憶のタブー化を残し、後の民主化運動における重要な歴史的記憶となった。', debate:'この事件の犠牲者数・責任の所在(蔣介石自身の直接的な指示があったか)については長く公的な議論が封じられてきたが、民主化後の真相究明・名誉回復事業を通じて徐々に歴史的検証が進められている。'} },
  { id:"taiwan_democratization", name:"台湾の民主化(李登輝)", category:"event", lat:25.03, lng:121.56, start:1988, end:1996, region:"台湾(台北)", desc:{background:'経済発展による中間層の拡大と、蔣経国(蔣介石の子)による段階的な政治的開放路線への転換が、この民主化の背景となった。', process:'1987年の戒厳令解除を皮切りに複数政党制・言論の自由が段階的に認められ、1996年には史上初の総統直接選挙が実施され、2000年には国民党から民進党への平和的な政権交代も実現した。', significance:'権威主義体制から比較的短期間で安定した民主主義体制への移行を達成した事例として、東アジアにおける民主化の成功例(韓国と並ぶ)として比較政治学上重要視される。', debate:'この民主化の進展が、中国大陸との関係(統一か独立かをめぐる国内世論の分裂)にどのような影響を与え続けているかが、台湾政治の中心的な争点として論じられ続けている。'} },

  // ===================== モンゴル(元以後・近現代) =====================
  { id:"northern_yuan", name:"北元", category:"dynasty", lat:47.2, lng:102.85, start:1368, end:1635, region:"モンゴル高原", desc:{background:'元(モンゴル帝国の中国統治部分)が朱元璋率いる明軍により中国本土から駆逐されたことが、モンゴル高原への退却の背景となった。', process:'モンゴル高原に退いた元の残存勢力が「北元」として存続を図ったが、内部の権力争いと明の攻勢により求心力を失い、最終的にモンゴル系諸部族が分立する状態へと移行した。', significance:'中国本土の統治権を失いながらもモンゴル民族としての独自のアイデンティティと政体を保ち続けた点で、征服王朝崩壊後の民族的連続性の事例として重要である。', debate:'「北元」が正統な元朝の継続とみなされるべきか、単なる地方政権への後退とみなされるべきかについて、モンゴル・中国双方の歴史叙述における位置づけが異なる。'} },
  { id:"qing_mongolia", name:"清朝支配下のモンゴル", category:"event", lat:47.92, lng:106.92, start:1691, end:1911, region:"モンゴル高原", desc:{background:'満洲族の清朝が中国統治を確立する過程で、北方の安全保障上の脅威となり得るモンゴル諸部族を服属させる必要があったことが背景となった。', process:'内モンゴルは早期に清の支配下に組み込まれ、外モンゴル(ハルハ部)も北方のジュンガル部との対立を経て清への服属を選択し、清朝の藩部体制の一部として統治された。', significance:'この征服により清朝はモンゴル高原全域を版図に組み込み、この統治の枠組みは後の中華民国・中華人民共和国による内モンゴル領有の歴史的根拠ともなった。', debate:'内モンゴルが中国の一部として統合され続けた一方、外モンゴルが20世紀に独立を達成したという対照的な帰結を分けた要因(ソ連の後ろ盾の有無など)が、比較民族自決論の観点から論じられる。'} },
  { id:"sukhbaatar", name:"スフバートル", category:"person", parentId:"mongolian_peoples_republic", lat:47.92, lng:106.92, start:1893, end:1923, region:"モンゴル(フレー)", desc:{background:'中国(北洋軍閥)によるモンゴルへの再統治の試みへの反発が、彼の独立運動指導の背景となった。', process:'ソ連赤軍の支援を得てモンゴル人民義勇軍を組織し中国軍・白軍残党を駆逐して独立を回復し、モンゴル人民革命党を指導して社会主義国家建設の基礎を築いたが、若くして病没した。', significance:'「モンゴル建国の英雄」として現在もウランバートルの中心広場(彼の名を冠する)に銅像が建てられるなど国民的に敬愛され、モンゴル近代国家建設の父として位置づけられている。', debate:'彼の独立運動がソ連の後ろ盾に強く依存していたことから、この独立を「真の民族自決」とみるか「ソ連の衛星国化の出発点」とみるかで、モンゴル近代史の評価が分かれる。'} },
  { id:"mongolian_peoples_republic", name:"モンゴル人民共和国", category:"nation", lat:47.92, lng:106.92, start:1924, end:1992, region:"モンゴル", desc:{background:'ソ連赤軍の支援のもと独立を回復したモンゴルが、ソ連型の社会主義国家建設を志向したことが背景となった。', process:'1924年に樹立され、以後70年近くソ連の強い影響下で社会主義的な集団化・仏教弾圧などを進めたが、1990年の民主化革命を経て複数政党制・市場経済へと移行した。', significance:'ソ連に次ぐ世界で2番目の社会主義国家として、中国の反発と国際的孤立の中でソ連の後ろ盾により独立を維持し続けた稀有な事例であり、内モンゴルが中国領にとどまったのとは対照的な歴史的経路をたどった。', debate:'この独立の達成・維持がソ連という後ろ盾にどこまで依存していたか、真の自律的な国家建設と外部大国への従属との間のバランスが論じられる。'} },
  { id:"mongolia_modern", name:"モンゴル国", category:"nation", lat:47.92, lng:106.92, start:1992, end:2030, region:"モンゴル", desc:{background:'ソ連崩壊という後ろ盾の消失が、モンゴルにおける社会主義体制の維持を困難にし、民主化・市場経済化への転換を促す背景となった。', process:'1990年の民主化革命を経て複数政党制・市場経済への移行を進め、鉱物資源(石炭・銅など)の開発を軸とする経済発展を模索しているが、中国・ロシアという二大国に挟まれた内陸国という地政学的制約の中で「第三の隣国」政策(欧米・日本など)を通じた外交的自立も図っている。', significance:'社会主義から民主主義・市場経済への平和的移行を達成した事例として、また巨大な二つの隣国に挟まれた内陸国の外交戦略の事例として、比較政治学・国際関係論上重要視される。', debate:'資源依存型経済がもたらす経済的な脆弱性(資源価格変動の影響)と、中国・ロシアへの経済的依存の深まりが、この国の実質的な自立性にどこまで影響しているかが論じられる。'} },

  // ===================== 朝鮮史(古代〜高麗) =====================
  { id:"gojoseon", name:"古朝鮮(衛氏朝鮮)", category:"nation", lat:39.02, lng:125.75, start:-2333, end:-108, region:"朝鮮半島北部(平壌)", desc:{background:'遼東・朝鮮半島北部における青銅器文化の発達と農業共同体の形成が、朝鮮半島最初期の国家形成の背景となったとされる。', process:'檀君神話に建国伝承を持ち、後代には燕からの亡命者衛満が政権を奪取(衛氏朝鮮)して発展したが、前漢武帝の遠征により前108年に滅ぼされ、その地に楽浪郡など漢の四郡が設置された。', significance:'朝鮮半島最初の国家として、その建国神話(檀君神話)は現在も韓国・北朝鮮双方において民族的起源神話として重要な位置を占め続けている。', debate:'檀君神話の史実性と、この国の実際の版図・統治実態(特に衛氏朝鮮期以前の実態)については史料が乏しく、考古学的検証を含めた論争が続いている。'} },
  { id:"han_commanderies", name:"漢四郡", category:"event", lat:39.02, lng:125.75, start:-108, end:313, region:"朝鮮半島北部", desc:{background:'前漢武帝による衛氏朝鮮征服(前108年)が、朝鮮半島北部への中国王朝の直接的な行政統治導入の背景となった。', process:'楽浪郡・真番郡・臨屯郡・玄菟郡の四郡が設置され、特に楽浪郡は約400年にわたり存続して中国の先進的な文物・制度を朝鮮半島に伝える窓口として機能したが、高句麗の勢力拡大により4世紀初頭に完全に駆逐された。', significance:'漢字・儒教・律令的統治技術が本格的に朝鮮半島へ流入する経路となり、この文化的影響は百済・新羅を経て日本列島へも伝播する東アジア文化圏形成の重要な結節点としての役割を果たした。', debate:'この郡県支配を「中国による直接的な植民地支配」とみるか「一定の自治を伴う緩やかな朝貢的関係」とみるかで、朝鮮史における評価が分かれ、近代日本の朝鮮統治正当化にこの史実が政治的に利用された経緯も歴史認識上の論点となっている。'} },
  { id:"goguryeo", name:"高句麗", category:"nation", lat:41.13, lng:126.19, start:-37, end:668, region:"朝鮮半島北部・満洲(国内城→平壌)", relatedIds:["gwanggaeto"], desc:{background:'満洲・朝鮮半島北部の山岳地帯という地理的条件のもと、狩猟・農耕を組み合わせる集団が独自の国家形成を進めたことが背景となった。', process:'漢四郡を駆逐して満洲・朝鮮半島北部の広大な領域を統一し、広開土王・長寿王の代に最盛期を迎え中国王朝(隋・唐)の侵攻をも度々撃退したが、内紛と唐・新羅連合軍の攻勢により668年に滅亡した。', significance:'隋の煬帝による大遠征を撃退するなど中国の統一帝国にも屈しなかった強勢を誇り、この抵抗は隋滅亡の一因ともなるなど東アジア国際政治に大きな影響を与えた。', debate:'高句麗を「朝鮮史の一部」とみるか「満洲を主要な版図とする独自の多民族国家(中国東北地方の歴史の一部)」とみるかについて、韓国・中国・北朝鮮それぞれの歴史認識(中国の「東北工程」問題を含む)が鋭く対立している。'} },
  { id:"gwanggaeto", name:"広開土王(好太王)", category:"person", parentId:"goguryeo", lat:41.13, lng:126.19, start:374, end:412, region:"高句麗", desc:{background:'高句麗が満洲・朝鮮半島北部における覇権確立を目指す中、百済・新羅・倭(日本)などとの複雑な外交・軍事関係への対応が治世の背景となった。', process:'満洲の広大な領域から朝鮮半島中部にまで軍事的に版図を拡大し、新羅の要請に応じて倭の侵攻を撃退するなど朝鮮半島情勢に積極的に介入した。', significance:'高句麗の最大版図を実現した英雄的君主として、その事績を記す「広開土王碑」は当時の東アジア国際関係(特に倭との関係)を知る上で極めて重要な一次史料となっている。', debate:'広開土王碑の倭に関する記述(倭が朝鮮半島に軍事介入していたことを示唆する部分)の解釈をめぐっては、日韓の歴史学者の間で碑文の判読・解釈自体に長年の論争があり、近代の政治的利用(日本の朝鮮統治正当化への援用)の問題も含め史学史上重要な検討課題となっている。'} },
  { id:"baekje", name:"百済", category:"nation", lat:36.28, lng:126.91, start:18, end:660, region:"朝鮮半島南西部(漢城→熊津→泗沘)", desc:{background:'朝鮮半島南西部における馬韓諸国の一つが、中国(南朝)・倭(日本)との海上交易・外交関係を積極的に築いたことが発展の背景となった。', process:'仏教・漢字文化を積極的に受容し日本への文化伝播(仏教公伝・五経博士派遣など)の重要な媒介者となったが、高句麗・新羅との抗争が続く中で徐々に劣勢に転じ、最終的に新羅・唐連合軍により660年に滅ぼされた。', significance:'日本古代国家形成における文化的影響(仏教・漢字・律令制度の伝来)の最も重要な媒介者として、日本書紀にもその緊密な関係が繰り返し記録されている、日朝交流史上決定的な存在である。', debate:'百済滅亡後、日本が大規模な救援軍を派遣した(白村江の戦い)ことが示す両国関係の緊密さの実態(単なる友好関係か、より深い政治的・血縁的結びつきがあったか)について、古代日朝関係史上の論争がある。'} },
  { id:"silla", name:"新羅", category:"nation", lat:35.84, lng:129.21, start:-57, end:935, region:"朝鮮半島南東部(慶州)", relatedIds:["baekgang_battle"], desc:{background:'朝鮮半島南東部の辰韓諸国の一つとして出発した新羅が、独自の身分制度(骨品制)と仏教受容を通じて国家体制を整備したことが発展の背景となった。', process:'唐と同盟して百済・高句麗を滅ぼし朝鮮半島の大部分を統一したが、統一後は唐の勢力を排除して自立性を確保し、仏教文化(仏国寺・石窟庵)の隆盛を築いたが、9世紀末以降は地方豪族の自立化により弱体化し、936年に高麗により統一された。', significance:'朝鮮半島初の統一国家として、その仏教美術・律令制度は以後の朝鮮半島の国家的伝統の重要な基盤となり、統一後の対唐自立路線は朝鮮の主体的な国家運営の先例ともなった。', debate:'新羅による朝鮮半島「統一」が、高句麗の故地(満洲)を放棄した不完全な統一であったことをどう評価すべきか、この「統一」の範囲・性格をめぐる民族史的な議論が朝鮮史学において続いている。'} },
  { id:"baekgang_battle", name:"白村江の戦い", category:"war", lat:36.0, lng:126.7, start:663, end:663, region:"朝鮮半島(錦江河口)", desc:{background:'百済滅亡後、その復興を目指す遺臣たちが倭(日本)に救援を要請し、日本がこれに応じて大規模な援軍派遣を決定したことが、この戦いの背景となった。', process:'白村江において日本の水軍が唐・新羅連合水軍と交戦したが、火攻めを含む唐軍の巧みな戦術により壊滅的な敗北を喫し、百済復興の望みは完全に絶たれた。', significance:'この敗北を機に日本は対外的な軍事介入から国内の防衛体制強化(西日本の山城築造・防人配置)へと方針を転換し、律令国家体制の確立を急ぐ契機ともなった、日本古代対外関係史上の重要な転換点である。', debate:'この敗戦が日本の古代国家形成(律令制導入の加速)にどこまで直接的な危機感として作用したか、対外的軍事的挫折と国内制度改革との因果関係が論じられる。'} },
  { id:"unified_silla", name:"統一新羅", category:"nation", lat:35.84, lng:129.21, start:676, end:935, region:"朝鮮半島(慶州)", desc:{background:'唐との同盟による百済・高句麗征服の後、新羅が唐の朝鮮半島への直接支配意図(安東都護府設置など)を排除する必要に迫られたことが、この時代の背景となった。', process:'唐軍を朝鮮半島から駆逐して独自の統一国家を確立し、仏教文化(仏国寺・石窟庵)の黄金期を築き律令制度・骨品制による統治体制を整えたが、地方豪族(豪族)の自立化と王位継承をめぐる内紛により9世紀末には急速に弱体化した。', significance:'朝鮮半島における最初の統一国家として、この時代の仏教美術・建築(石窟庵など)は朝鮮美術史上の最高峰とされ、以後の高麗・朝鮮王朝における国家的統一の理念的先例となった。', debate:'骨品制という厳格な血統的身分制度が、優秀な人材の登用を制限し王朝後期の弱体化を招いた構造的要因であったかどうかが、統一新羅の衰退要因分析において論じられる。'} },
  { id:"balhae", name:"渤海", category:"nation", lat:44.6, lng:129.57, start:698, end:926, region:"満洲東部・朝鮮半島北部", desc:{background:'高句麗滅亡後、その遺民と靺鞨族が満洲・朝鮮半島北部において高句麗の後継国家樹立を目指したことが建国の背景となった。', process:'大祚栄が建国し「海東の盛国」と称されるほどの繁栄を築き、唐・日本との活発な交流(遣渤海使の往来)を行ったが、10世紀初頭に契丹(遼)の攻撃を受け滅亡した。', significance:'高句麗の継承国家として満洲の広大な領域を統治した点で、朝鮮史における「南北国時代」(統一新羅と渤海の並立)という歴史認識の重要な一翼を担い、この時代の満洲領有の歴史的記憶は現代の韓国・北朝鮮の歴史認識にも影響している。', debate:'渤海を「朝鮮史の一部」とみるか「中国東北地方の地方政権(靺鞨族主体)」とみるかについて、韓国・中国それぞれの歴史認識(「東北工程」問題を含む)が対立する現在進行形の歴史論争となっている。'} },
  { id:"goryeo_dynasty", name:"高麗王朝", category:"dynasty", lat:37.97, lng:126.56, start:918, end:1392, region:"朝鮮半島(開城)", relatedIds:["wang_geon", "goryeo_mongol"], desc:{background:'統一新羅末期の地方豪族割拠という混乱状況の中、王建が高句麗の後継を標榜して勢力を拡大したことが建国の背景となった。', process:'後三国(後高句麗・後百済・新羅)の分裂状態を統一し、仏教を国教として保護し科挙制度も導入したが、モンゴル(元)の侵攻を受け長期の抗戦の末に服属し、以後は元の駙馬国(婿の国)としての従属的地位に置かれ、14世紀末に武将李成桂のクーデタにより滅ぼされた。', significance:'「高麗」の国号は英語のKoreaの語源となり、この時代に完成した高麗青磁や『高麗大蔵経』の版木は朝鮮半島の文化的達成の頂点として世界的に評価されている。', debate:'モンゴルへの服属を、亡国を避けるための現実的な生存戦略とみるか、屈辱的な従属とみるかで、この時代の朝鮮史における評価が分かれる。'} },
  { id:"wang_geon", name:"王建(太祖)", category:"person", parentId:"goryeo_dynasty", lat:37.97, lng:126.56, start:877, end:943, region:"高麗", desc:{background:'統一新羅末期の混乱の中、高句麗の後継を掲げる後高句麗の武将として台頭し、独自の勢力基盤を築いたことが建国の背景となった。', process:'後高句麗の指導者弓裔を追放して自ら王位に就き高麗を建国し、後百済・新羅を吸収して朝鮮半島を再統一し、地方豪族との婚姻政策(29人の妃を娶ったとされる)により統治基盤を固めた。', significance:'「高麗建国の祖」として、その国号(高麗)は現在の英語国名Koreaの語源となるなど、朝鮮民族のアイデンティティの重要な淵源となっている。', debate:'彼の婚姻政策(多数の地方豪族の娘を妃とする)が、統治基盤の安定に寄与した一方、後継者争いという長期的な政治的不安定要因を残したのではないかという評価がある。'} },
  { id:"goryeo_mongol", name:"高麗の元(モンゴル)服属", category:"event", lat:37.97, lng:126.56, start:1231, end:1270, region:"高麗", desc:{background:'モンゴル帝国の東方拡大政策のもと、高麗が服属・朝貢を拒み続けたことが、この度重なる侵攻の直接的契機となった。', process:'モンゴル軍が数次にわたり侵攻し、高麗王室は江華島に避難して長期の抗戦を続けたが、国土の荒廃が深刻化する中で最終的に服属を受け入れ、以後は元の駙馬国(王が元の皇女を娶る従属的地位)として存続した。', significance:'この侵攻の中で高麗が仏教の加護を求めて製作した『高麗大蔵経』の版木は、その文化的・宗教的意義とともに現存する世界最古級の完全な大蔵経版木として世界遺産に登録されている。', debate:'長期の抗戦(江華島遷都による約30年の抵抗)の末に服属に至った経緯を、粘り強い抵抗の成果とみるか、結局は服属を避けられなかった限界とみるかで評価が分かれる。'} },

  // ===================== 朝鮮史(朝鮮王朝〜大韓帝国) =====================
  { id:"joseon_dynasty", name:"朝鮮王朝(李氏朝鮮)", category:"dynasty", lat:37.57, lng:126.98, start:1392, end:1897, region:"朝鮮半島(漢城=ソウル)", relatedIds:["yi_seonggye", "sejong_the_great", "yi_sun_sin", "ganghwa_incident", "treaty_ganghwa", "imo_incident", "gapsin_coup", "donghak_peasant_revolution"], desc:{background:'李成桂による高麗打倒とクーデタが、儒教理念に基づく新たな王朝樹立の背景となった。', process:'朱子学を国是として仏教を抑制し(崇儒抑仏)、世宗の代にハングル創製など文化的最盛期を築いたが、豊臣秀吉の侵攻(壬辰倭乱)や後金・清の侵攻(丙子胡乱)という対外的危機を経験し、19世紀末には日本の圧力のもと開国を強いられ、最終的に1910年の韓国併合により滅亡した。', significance:'朱子学的な儒教統治理念を徹底した朝鮮社会の基本的性格を約500年にわたり規定し、科挙制度・両班(貴族官僚層)による支配体制は現代韓国社会の文化的基層にも影響を残している。', debate:'この王朝の長期にわたる儒教的統治理念の徹底が、19世紀の近代化対応の遅れ(日本との対比)にどこまで構造的に影響したかについて、比較近代化論の観点から議論される。'} },
  { id:"yi_seonggye", name:"李成桂(太祖)", category:"person", parentId:"joseon_dynasty", lat:37.57, lng:126.98, start:1335, end:1408, region:"朝鮮王朝", desc:{background:'高麗末期の親元派・親明派の対立と倭寇撃退での軍功が、彼の政治的台頭の背景となった。', process:'遼東への出兵命令を受けた際に威化島から引き返すクーデタ(威化島回軍)を起こして実権を掌握し、高麗を廃して朝鮮王朝を開き、明への事大(朝貢)関係を確立して国号「朝鮮」の使用も明の承認を得た。', significance:'朝鮮王朝約500年の建国者として、儒教(朱子学)を国家統治の基本理念とする体制を確立し、この理念は以後の朝鮮社会の根本的な性格を規定し続けた。', debate:'威化島回軍という軍事クーデタによる王朝交代が、当時の親明・事大主義的な外交路線への転換とどこまで密接に結びついていたか、この決断の外交的・政治的動機が論じられる。'} },
  { id:"sejong_the_great", name:"世宗大王", category:"person", parentId:"joseon_dynasty", lat:37.57, lng:126.98, start:1397, end:1450, region:"朝鮮王朝", desc:{background:'父太宗が確立した安定した王権基盤の上に、民衆の教育・文化的向上という理念的な統治目標を追求したことが治世の背景となった。', process:'漢字を読み書きできない民衆のため独自の表音文字ハングル(訓民正音)を創製させ、雨量計(測雨器)の発明や天文学の発展など科学技術の振興にも尽力し、北方の女真族討伐により国境を確定させた。', significance:'「世宗大王」として朝鮮史上最も尊崇される統治者であり、ハングルは現在も韓国・北朝鮮双方において民族的誇りの象徴かつ実用的な文字体系として用いられ続けている。', debate:'当時の支配層(両班)の一部がハングル創製に強く反対した(漢字こそが正統な文字であるとする事大主義的な立場)ことは、民衆への教育普及という理念と支配層の既得権益との緊張関係を示す事例として論じられる。'} },
  { id:"yi_sun_sin", name:"李舜臣", category:"person", parentId:"joseon_dynasty", lat:34.76, lng:127.66, start:1545, end:1598, region:"朝鮮王朝(全羅道)", desc:{background:'文官優位の朝鮮社会において武官としての不遇な経歴を経験しながらも、水軍指揮官としての卓越した戦術眼を蓄積していたことが背景となった。', process:'独自に開発・改良した装甲艦「亀甲船」を駆使し、閑山島海戦・鳴梁海戦など寡兵をもって日本水軍に度重なる決定的勝利を収めて制海権を確保し補給線を寸断したが、最後の露梁海戦で戦死した。', significance:'朝鮮を救った国民的英雄として現在も韓国で最も尊崇される歴史的人物の一人であり、その卓越した戦術は世界海戦史上でも屈指の事例として国際的にも評価されている。', debate:'彼の軍事的天才性を疑う余地はないが、当時の朝廷内での政争(讒言による一時的な失脚・投獄)が示す文官優位の統治構造の問題点が、彼の評価と併せて論じられる。'} },
  { id:"ganghwa_incident", name:"江華島事件", category:"event", lat:37.7, lng:126.45, start:1875, end:1875, region:"朝鮮王朝(江華島)", desc:{background:'明治維新後の日本が朝鮮への開国要求を強める中、朝鮮側の鎖国政策(大院君による攘夷政策)との間で緊張が高まっていたことが背景となった。', process:'日本の軍艦雲揚号が江華島付近で朝鮮側の砲台と交戦したことを口実に日本が開国を要求し、翌年の江華島条約により朝鮮は日本に対し治外法権・関税自主権喪失を含む不平等な条件での開国を強いられた。', significance:'アメリカのペリー来航による日本の開国と類似した構図で、この条約は朝鮮が近代国際関係に組み込まれる出発点となったが、同時に日本による朝鮮進出の第一歩ともなった。', debate:'この事件を、日本が意図的に仕組んだ挑発(砲艦外交)とみるか、偶発的な軍事的緊張の結果とみるかで、日朝双方の歴史認識に差異がある。'} },
  { id:"treaty_ganghwa", name:"日朝修好条規(江華条約)", category:"treaty", lat:37.7, lng:126.45, start:1876, end:1876, region:"朝鮮王朝(江華島)", desc:{background:'江華島事件という軍事的圧力を背景に、日本が朝鮮に開国を要求したことが、この条約締結の直接的背景となった。', process:'日本が朝鮮に対し treaty締結を強要し、朝鮮を「自主の邦」と規定して清との伝統的な宗属関係を否定しつつ、日本に治外法権・関税自主権の否定などの不平等な特権を認めさせる内容であった。', significance:'朝鮮が近代的な国際条約体制に組み込まれる最初の一歩となったが、その不平等な内容(日本のみの領事裁判権など)は以後の朝鮮の半植民地化過程の出発点となった。', debate:'「自主の邦」という規定が、朝鮮の独立性を国際的に認める進歩的な内容であったか、むしろ清との宗属関係を否定することで日本の介入の余地を広げる狙いを持つものであったかで、この条文の政治的意図をめぐる評価が分かれる。'} },
  { id:"imo_incident", name:"壬午軍乱", category:"event", lat:37.57, lng:126.98, start:1882, end:1882, region:"朝鮮王朝(漢城)", desc:{background:'日本の圧力下での近代化改革(別技軍創設など)への旧来の軍人層の不満と、閔氏一族の専横への反発が、この兵乱の背景となった。', process:'待遇差別に不満を持つ旧式軍隊の兵士が蜂起し日本公使館を襲撃する事態にまで発展したが、清軍の介入により鎮圧され、この結果朝鮮における清の影響力が一時的に強化された。', significance:'この事件を機に日本は朝鮮への軍隊駐留権を獲得(済物浦条約)し、清も朝鮮への内政干渉を強化するなど、朝鮮をめぐる日清両国の勢力争いが本格化する契機となった。', debate:'この事件を「保守的な軍人の単純な待遇不満」とみるか「日本の急進的な近代化圧力への朝鮮社会全体の反発の表れ」とみるかで、その性格づけが論じられる。'} },
  { id:"gapsin_coup", name:"甲申政変", category:"event", lat:37.57, lng:126.98, start:1884, end:1884, region:"朝鮮王朝(漢城)", desc:{background:'壬午軍乱後の清の影響力強化に対し、日本の支援を得た急進開化派(金玉均ら)が近代化改革の断行を目指したことが、このクーデタの背景となった。', process:'日本公使館の軍事支援を得て一時政権を掌握し急進的な改革を宣言したが、清軍の即座の介入によりわずか3日で鎮圧され、指導者たちは日本へ亡命した。', significance:'この失敗により朝鮮における清の影響力はさらに強化される一方、日清両国間の緊張も高まり天津条約(日清両軍の朝鮮からの撤兵と将来の出兵時の相互通告)締結につながった。', debate:'この改革運動を「朝鮮の自主的近代化を目指した進歩的試み」と評価するか「日本の勢力拡大の道具にされた性急なクーデタ」と評価するかで、韓国史学における評価が分かれる。'} },
  { id:"donghak_peasant_revolution", name:"東学農民運動(甲午農民戦争)", category:"war", lat:35.82, lng:127.15, start:1894, end:1895, region:"朝鮮王朝(全羅道)", relatedIds:["sino_japanese_war"], desc:{background:'朝鮮固有の民間宗教東学の教えと、官吏の腐敗・重税への農民の蓄積した不満が、この農民反乱の背景となった。', process:'全琫準を指導者に農民軍が蜂起し一時は全羅道の広範囲を制圧する勢いを見せたが、朝鮮政府の要請による清軍出兵とこれに対抗する日本軍出兵が、日清戦争勃発の直接的な引き金となった。', significance:'朝鮮の内政問題(農民反乱)が東アジア国際政治における日清間の全面戦争へと発展する契機となった点で、内政と国際政治の連動という重要な世界史的意義を持つ事件である。', debate:'この反乱を「単なる農民一揆」とみるか「近代朝鮮における民族主義的・改革的な運動の先駆」とみるかで、韓国史学における評価が分かれる。'} },
  { id:"korean_empire", name:"大韓帝国", category:"nation", lat:37.57, lng:126.98, start:1897, end:1910, region:"朝鮮半島(漢城)", desc:{background:'閔妃殺害事件などを経て高宗が日本の影響力からの自立を図る必要性を強く認識したことが、この国号変更・皇帝即位の背景となった。', process:'高宗が皇帝に即位し国号を「大韓帝国」と改めて清との宗属関係を否定し独立国家であることを内外に宣言し、近代化改革(光武改革)も進めたが、日露戦争での日本の勝利により保護国化(第二次日韓協約)が進み、1910年の韓国併合により消滅した。', significance:'朝鮮が「王国」から「帝国」へと国号を改め清との伝統的な宗属関係を法的に清算した点で、近代的な主権国家としての体裁を整えようとした最後の試みであったが、結果的にこれを実質化する国力・国際的支援を欠いていた。', debate:'この皇帝即位・改革を「主体的な近代化・自立化の試み」として評価するか、実質を伴わない「名目だけの独立宣言」にすぎなかったとみるかで評価が分かれる。'} },
  { id:"japan_annex_korea", name:"韓国併合", category:"event", lat:37.57, lng:126.98, start:1910, end:1910, region:"朝鮮半島", desc:{background:'第二次日韓協約による保護国化後も残っていた朝鮮の内政権・司法権を完全に掌握するため、日本が最終的な併合という選択肢を追求したことが背景となった。', process:'軍事的圧力と親日派勢力の協力のもと日韓併合条約が締結され、朝鮮は正式に大日本帝国に併合されて総督府による直接統治下に置かれ、以後1945年の日本敗戦まで36年間続いた。', significance:'アジアにおける最も長期かつ全面的な植民地支配の事例の一つとして、この統治は朝鮮の土地・言語・姓名(創氏改名)にまで及ぶ同化政策を伴い、その記憶は現代の日韓関係における最も根深い歴史認識問題の根源となっている。', debate:'この併合条約の法的有効性(強制性の程度)をめぐる日韓間の見解の相違は、2010年の日韓共同声明でも完全には解消されず、賠償・謝罪のあり方をめぐる論争として今日まで継続している。'} },

  // ===================== 朝鮮史(近現代) =====================
  { id:"samil_movement", name:"三・一独立運動", category:"event", lat:37.57, lng:126.98, start:1919, end:1919, region:"朝鮮(京城=ソウル)", desc:{background:'ウィルソン米大統領が提唱した「民族自決」の理念に触発された朝鮮の独立運動家たちが、この国際的機運を捉えて大規模な独立要求運動を計画したことが背景となった。', process:'高宗の葬儀に合わせて全国各地で「独立万歳」を叫ぶ非暴力の大規模デモが展開されたが、日本の朝鮮総督府はこれを武力で徹底的に弾圧し多数の死傷者を出した。', significance:'この運動は朝鮮民族の独立への意志を国内外に強く印象づけ、上海における大韓民国臨時政府樹立の直接的契機となり、以後の朝鮮独立運動における最も重要な象徴的出来事として記憶されている。', debate:'この運動への武力弾圧を機に日本の朝鮮統治政策が「武断統治」から表面的には融和的な「文化統治」へ転換したことが、実質的な統治政策の改善を意味したか、単なる統治手法の巧妙化にすぎなかったかが論じられる。'} },
  { id:"provisional_government_korea", name:"大韓民国臨時政府", category:"nation", lat:31.23, lng:121.47, start:1919, end:1945, region:"中国(上海→重慶)", desc:{background:'三一運動という大規模な独立要求運動の高まりが、独立運動を国際的に代表する統一組織樹立の必要性を認識させたことが背景となった。', process:'上海の租界という日本の直接統治の及ばない地で樹立され、初代大統領には李承晩が就任し、以後は資金難・内部対立に苦しみながらも独立運動の象徴的な求心力を保ち続け、日本敗戦後に朝鮮に帰還した。', significance:'この臨時政府の法統(正統性)は現在の大韓民国憲法にも明記されており、韓国という国家の歴史的連続性・正統性の根拠として重要な位置を占め続けている。', debate:'この臨時政府の実効的な統治権・国際的承認の程度が極めて限定的であったことを踏まえ、その後の大韓民国建国における「法統」としての意義をどこまで実質的なものと評価すべきかが論じられる。'} },
  { id:"korea_division", name:"朝鮮の南北分断", category:"event", lat:38.0, lng:127.0, start:1945, end:1948, region:"朝鮮半島(北緯38度線)", desc:{background:'日本降伏に際し、朝鮮半島における日本軍の武装解除を米ソ両軍が分担する暫定的な軍事的境界線として北緯38度線が設定されたことが、この分断の直接的背景となった。', process:'当初は一時的な軍事分割線とされたが、米ソの統一政府樹立交渉が冷戦の進展とともに決裂し、それぞれの占領地域に別個のイデオロギーに基づく政府(大韓民国・朝鮮民主主義人民共和国)が樹立されて分断が固定化した。', significance:'この分断は1950年の朝鮮戦争を経てさらに深刻化し、今日まで70年以上続く南北分断という東アジア冷戦構造の最も象徴的な遺産であり続けている。', debate:'「暫定的な軍事境界線」がなぜ恒久的な国家分断に転化したのか、米ソ両大国の政策決定における朝鮮民族の意思の不在という問題が、脱植民地化と大国政治の関係を考える上で重要な論点となる。'} },
  { id:"korean_war", name:"朝鮮戦争", category:"war", lat:37.57, lng:126.98, start:1950, end:1953, region:"朝鮮半島全域", desc:{background:'南北分断という既存の対立構造の中、金日成が武力による朝鮮統一を目指しソ連・中国の支援を取り付けたことが、この戦争の直接的背景となった。', process:'北朝鮮軍の奇襲南進で開戦し、国連軍(実質的に米軍中心)の介入で戦局は逆転したが、中国人民志願軍の参戦により再び戦線は膠着し、1953年の休戦協定(講和条約ではない)により北緯38度線付近を軍事境界線とする現状が固定化された。', significance:'この戦争は冷戦下最初の大規模な「熱戦」として、米ソ・中国という大国が直接・間接に関与する国際紛争となり、今日まで法的には終結していない(休戦状態が続く)という異例の状況を残している。', debate:'この戦争が「法的には今も終結していない」という異例の状態が、今日の朝鮮半島の緊張・核問題にどこまで構造的に影響し続けているかが、平和条約締結の必要性という文脈で論じられる。'} },
  { id:"kim_il_sung", name:"金日成", category:"person", parentId:"north_korea", lat:39.02, lng:125.75, start:1912, end:1994, region:"朝鮮民主主義人民共和国(平壌)", desc:{background:'満洲における抗日パルチザン活動の経歴が、ソ連占領下での北朝鮮指導者としての地位確立の背景となった。', process:'ソ連の支援のもと朝鮮民主主義人民共和国の指導者となり、朝鮮戦争を主導した後、以後「主体思想」を掲げる独自路線を追求し、権力の個人崇拝・世襲体制(息子金正日への権力継承)を確立した。', significance:'彼が確立した統治体制は死後も「永遠の主席」として法的・思想的な国家指導理念の中核であり続けており、彼を頂点とする個人崇拝は世界でも類例の少ない徹底したものとして国際的にも注目される。', debate:'彼の抗日パルチザン経歴の実際の規模・戦功については、北朝鮮の公式史観による著しい誇張が指摘されており、その史実性の検証は北朝鮮の国家的正統性言説を批判的に検討する上で重要な論点となっている。'} },
  { id:"north_korea", name:"朝鮮民主主義人民共和国(北朝鮮)", category:"nation", lat:39.02, lng:125.75, start:1948, end:2030, region:"朝鮮半島北部(平壌)", desc:{background:'ソ連占領下の北部において、金日成を中心とする社会主義勢力が実権を確立したことが建国の背景となった。', process:'金日成を首相(後の主席)として樹立され、朝鮮戦争を経て以後は「主体思想」を掲げる独自の社会主義路線と、金日成・金正日・金正恩という三代にわたる世襲的な権力継承体制を確立した。', significance:'社会主義国家でありながら事実上の世襲王朝的性格を持つ稀有な統治体制として、核開発問題を含め東アジア・国際安全保障における最も重要な懸案の一つであり続けている。', debate:'この体制を「独自の社会主義建設の試み」とみるか「個人崇拝に基づく事実上の専制王朝」とみるかで、国際的な評価は大きく分かれ続けている。'} },
  { id:"south_korea", name:"大韓民国(韓国)", category:"nation", lat:37.57, lng:126.98, start:1948, end:2030, region:"朝鮮半島南部(ソウル)", relatedIds:["syngman_rhee", "park_chung_hee", "gwangju_uprising", "democratization_korea"], desc:{background:'米軍政下での南部単独選挙の実施が、この国家樹立の直接的背景となった。', process:'李承晩を初代大統領に樹立され、朝鮮戦争を経て北の脅威と対峙しながら、朴正煕による開発独裁を経た高度経済成長(「漢江の奇跡」)と、1987年の民主化を経て現在は東アジア屈指の民主主義国家・経済大国へと発展した。', significance:'権威主義的な開発独裁から民主主義への平和的移行と急速な経済発展を同時に達成した稀有な事例として、「圧縮された近代化」のモデルケースとして開発経済学・比較政治学上重要視される。', debate:'朴正煕政権下の開発独裁が経済成長の必要条件であったか、それとも民主主義との両立が可能であったかという「開発と民主主義」の関係についての評価は、現代韓国政治史における最も重要な論争であり続けている。'} },
  { id:"syngman_rhee", name:"李承晩", category:"person", parentId:"south_korea", lat:37.57, lng:126.98, start:1875, end:1965, region:"大韓民国(ソウル)", desc:{background:'アメリカ留学経験を持つ独立運動家として大韓民国臨時政府の初代大統領を務めた経歴が、解放後の指導的地位獲得の背景となった。', process:'米軍政の支持のもと南部単独選挙を経て大韓民国初代大統領に就任し、朝鮮戦争を指導したが、次第に独裁的傾向を強め不正選挙(1960年)への抗議運動(四月革命)により退陣に追い込まれ、ハワイへ亡命した。', significance:'韓国建国の父としての功績が認められる一方、その晩年の強権的統治・不正選挙は韓国における最初の民主化運動(四月革命)を引き起こす直接の要因となった。', debate:'彼への評価は「建国の父」としての功績と「独裁者」としての負の側面との間で、韓国国内の政治的立場により今も大きく分かれ続けている。'} },
  { id:"park_chung_hee", name:"朴正煕", category:"person", parentId:"south_korea", lat:37.57, lng:126.98, start:1917, end:1979, region:"大韓民国(ソウル)", desc:{background:'軍人としての経歴と、李承晩政権崩壊(四月革命)後の政治的混乱が、彼の軍事クーデタによる権力掌握の背景となった。', process:'クーデタで実権を握り、輸出主導型の重化学工業化政策を強力に推進して「漢江の奇跡」と呼ばれる高度経済成長を実現する一方、維新体制と呼ばれる権威主義的な長期独裁統治を敷き反体制派を厳しく弾圧したが、1979年に側近により暗殺された。', significance:'「開発独裁」の代表的成功例として、その経済政策は韓国を貧困国から先進工業国へと押し上げる決定的な転換点となったが、この経済的成功と権威主義的統治との関係は比較政治経済学上の重要な論点であり続けている。', debate:'彼の評価は「経済発展の父」としての肯定的評価と「民主主義を抑圧した独裁者」としての否定的評価との間で、韓国国内でも今日まで世代・政治的立場により鋭く分かれ続けている。'} },
  { id:"gwangju_uprising", name:"光州事件", category:"event", lat:35.16, lng:126.85, start:1980, end:1980, region:"大韓民国(光州)", desc:{background:'朴正煕暗殺後の軍部(全斗煥ら)による新たな権力掌握とこれに対する民主化要求運動の高まりが、この事件の背景となった。', process:'光州の学生・市民による民主化要求デモに対し戒厳軍が武力鎮圧を行い、多数の死傷者(公式発表を大きく上回る犠牲者数が指摘される)を出す事態となった。', significance:'この弾圧への抵抗の記憶は以後の韓国民主化運動の象徴的な原点となり、1987年の民主化(大統領直接選挙制導入)を求める運動の重要な精神的支柱となった。', debate:'この鎮圧作戦へのアメリカの関与(在韓米軍の軍事作戦統制権を通じた黙認・容認の有無)については史料的検証が続けられており、民主化運動における外部大国の責任という問題として国際的にも論じられている。'} },
  { id:"democratization_korea", name:"韓国の民主化(六月民主抗争)", category:"event", lat:37.57, lng:126.98, start:1987, end:1987, region:"大韓民国(ソウル)", desc:{background:'光州事件の記憶と経済発展に伴う中間層の拡大が、全斗煥政権への民主化要求運動を継続的に高める背景となった。', process:'1987年6月に全国的な民主化要求デモ(六月抗争)が高まり、政府は大統領直接選挙制の導入を含む民主化宣言を余儀なくされ、以後は定期的な選挙による平和的政権交代を実現する民主主義体制へと移行した。', significance:'権威主義的な開発独裁体制から比較的短期間で安定した民主主義体制へ移行した事例として、台湾と並ぶ東アジアにおける民主化の成功例として比較政治学上重要視される。', debate:'経済発展(中間層の拡大)が民主化を促進したとする「近代化論」的な説明と、光州事件のような具体的な抵抗運動の蓄積を重視する説明との間で、この民主化を可能にした主要因についての学術的評価が分かれる。'} },
  { id:"kim_dae_jung", name:"金大中", category:"person", parentId:"south_korea", lat:37.57, lng:126.98, start:1924, end:2009, region:"大韓民国(ソウル)", desc:{background:'長年の民主化運動指導者として軍事政権下で度重なる迫害(拉致・投獄・死刑判決)を受けた経験が、彼の政治的信念の背景となった。', process:'民主化後の選挙を経て大統領に就任し、北朝鮮への融和的な「太陽政策」を推進して2000年に南北首脳会談を実現させ、同年ノーベル平和賞を受賞したが、この政策の実効性については賛否が分かれた。', significance:'軍事独裁の犠牲者から大統領へと上り詰めた韓国民主化の象徴的存在として、彼の「太陽政策」は南北関係における融和的アプローチの重要な先例となった。', debate:'「太陽政策」が北朝鮮の核開発を実質的に抑止できなかったことから、この融和政策の有効性(体制変化を促す効果があったか、単に時間稼ぎを許しただけか)について、その後の南北関係の展開を踏まえた評価が分かれ続けている。'} },

  // ===================== 日本史(古代) =====================
  { id:"yayoi_period", name:"弥生時代", category:"event", lat:33.59, lng:130.4, start:-300, end:250, region:"日本(北部九州中心)", desc:{background:'朝鮮半島経由で稲作技術・金属器(青銅器・鉄器)が日本列島に伝来したことが、この時代の社会変容の背景となった。', process:'水稲耕作の普及により定住的な農業共同体が形成され、余剰生産と灌漑用水をめぐる集落間の抗争を通じて階層化・首長制社会が発達し、中国の史書(『漢書』地理志・『魏志』倭人伝)にも倭(日本列島)に関する記述が現れるようになった。', significance:'縄文時代の狩猟採集社会から農耕社会への根本的な転換を遂げ、この時代に形成された階層構造・首長連合は後のヤマト政権(古墳時代)成立の社会的基盤となった。', debate:'稲作・金属器伝来の担い手が朝鮮半島からの渡来人の大規模な移住によるものか、技術のみの伝播で人口構成自体は縄文人が主体であり続けたのかについて、人類学・考古学上の「渡来説」対「変容説」の論争が続いている。'} },
  { id:"himiko_yamatai", name:"邪馬台国と卑弥呼", category:"person", lat:34.52, lng:135.85, start:180, end:248, region:"日本(所在地は諸説あり)", desc:{background:'倭国内の長期にわたる争乱(倭国大乱)を経て、諸国の共立により女性の呪術的権威を持つ人物が統治者として推戴されたことが、この統治体制の背景となったとされる。', process:'『魏志』倭人伝によれば鬼道(呪術)による統治を行い魏に朝貢して「親魏倭王」の称号と金印を受けたとされるが、その死後は再び内乱が起こり、宗女壱与の共立により収拾されたと伝えられる。', significance:'中国正史に記された日本列島に関する最初期の詳細な記述として、当時の倭国の政治・社会構造を知る貴重な一次史料となっているが、この記述に対応する考古学的実体の特定は今も日本古代史最大の謎の一つである。', debate:'邪馬台国の所在地(畿内説対九州説)は日本考古学・古代史学における最も著名かつ長期にわたる論争であり、この一点が日本古代国家形成史の理解全体を左右する重要な未解決課題となっている。'} },
  { id:"yamato_kingship", name:"大和政権(ヤマト王権)", category:"nation", lat:34.47, lng:135.82, start:250, end:710, region:"日本(奈良盆地・飛鳥)", relatedIds:["prince_shotoku", "taika_reform"], desc:{background:'弥生時代後期の階層化した首長連合社会の中、畿内(奈良盆地)の勢力が広域的な政治統合を進めたことが、この政権形成の背景となった。', process:'前方後円墳という共通の墳墓形式を通じた同盟関係の構築により各地の有力首長を服属・連携させ、朝鮮半島(百済など)との交流を通じて先進技術・文物を導入しつつ、大王(後の天皇)を中心とする支配体制を次第に確立していった。', significance:'この政権が古代日本国家の直接の起源であり、5世紀の中国南朝への朝貢(倭の五王)の記録は当時の東アジア国際秩序の中でのヤマト政権の位置づけを知る重要な史料となっている。', debate:'ヤマト政権の成立過程・支配の実態(単一の王権による征服統一か、有力豪族連合による緩やかな盟主関係か)については、文字史料の乏しさから考古学的推論に依存する部分が大きく、日本古代国家形成論の中心的論争であり続けている。'} },
  { id:"prince_shotoku", name:"聖徳太子(厩戸皇子)", category:"person", parentId:"yamato_kingship", lat:34.47, lng:135.82, start:574, end:622, region:"大和政権(飛鳥)", desc:{background:'蘇我氏と物部氏という有力豪族間の権力闘争の中、仏教受容を推進する蘇我氏側に立って政治的実権を確立したことが、彼の統治の背景となった。', process:'推古天皇の摂政として、家柄によらない能力主義的な人材登用を目指す冠位十二階、豪族への道徳的訓戒を説く十七条憲法を制定し、遣隋使を派遣して隋の皇帝に対等な立場を主張する国書(「日出づる処の天子」)を送った。', significance:'仏教を国家統治の理念的支柱として導入し、中国の先進的な政治制度を積極的に取り入れつつも対等な外交姿勢を貫いたことで、日本の律令国家建設と自立的な東アジア外交の礎を築いた。', debate:'近年の実証的な歴史学研究では、『日本書紀』が伝える聖徳太子の事績の多くが後世の理想化・創作を含む可能性が指摘されており、「厩戸王」という実在の人物と後世構築された「聖徳太子」像との異同が重要な研究課題となっている。'} },
  { id:"taika_reform", name:"大化の改新", category:"event", lat:34.69, lng:135.5, start:645, end:650, region:"大和政権(難波)", desc:{background:'蘇我氏の専横への皇族・中臣鎌足らの危機感と、唐という強大な統一帝国の出現という国際情勢の変化が、この改革の背景となった。', process:'中大兄皇子・中臣鎌足らが蘇我入鹿を暗殺する乙巳の変を経て、公地公民制・班田収授法・租庸調制など唐の律令制度を模範とする中央集権的な国家体制の構築を進めた。', significance:'豪族による私有地・私有民の支配を否定し天皇を中心とする中央集権国家の建設を目指したこの改革は、以後の律令国家体制確立への決定的な出発点となった。', debate:'「大化の改新」という呼称が示す改革の実態(即座に全面的な律令制導入が実現したか、より緩やかな段階的過程であったか)については、木簡など出土史料の研究進展により見直しが進んでいる。'} },
  { id:"nara_period", name:"奈良時代", category:"dynasty", lat:34.69, lng:135.8, start:710, end:794, region:"日本(平城京)", relatedIds:["emperor_shomu"], desc:{background:'藤原京から平城京への遷都という新たな都城建設が、律令国家体制の本格的な確立を象徴する事業として行われたことが、この時代の始まりの背景となった。', process:'唐の長安を模範とする平城京を中心に律令制度(大宝律令)による中央集権的統治を進め、仏教を国家的に保護(東大寺大仏建立)する一方、遣唐使を通じた文化交流も活発化したが、皇位継承をめぐる政争や道鏡事件などの混乱も経験し、桓武天皇による平安京遷都で終焉した。', significance:'律令国家体制が本格的に確立し、『古事記』『日本書紀』という国家的な歴史書編纂や『万葉集』の成立など、日本独自の文化的アイデンティティ形成の重要な基盤が築かれた時代である。', debate:'この時代の仏教が国家権力と過度に癒着した(道鏡事件に象徴される)ことが、桓武天皇による平安京遷都という新たな政治的出発を必要とさせた主要因であったかどうかが論じられる。'} },
  { id:"emperor_shomu", name:"聖武天皇", category:"person", parentId:"nara_period", lat:34.69, lng:135.8, start:701, end:756, region:"奈良時代", desc:{background:'天然痘の大流行や飢饉、貴族間の政争(長屋王の変)など相次ぐ社会的動揺への対応として、仏教の鎮護国家思想への強い期待が高まったことが治世の背景となった。', process:'国分寺・国分尼寺を全国に建立させ、その中心として東大寺に盧舎那大仏(奈良の大仏)を造立させる国家的大事業を進め、この造立には行基ら民間僧の協力も得て広範な民衆動員が行われた。', significance:'仏教を国家統治の理念的支柱とする「鎮護国家」思想を体現する事業として、この大仏造立は当時の東アジアでも最大規模の仏教的事業であり、国家財政を大きく圧迫しながらも日本古代仏教文化の頂点を築いた。', debate:'この巨大事業への動員が民衆にもたらした負担(労役・重税)と、その宗教的・文化的意義とをどう総合的に評価すべきか、大規模な国家的建造事業一般の功罪を考える事例として論じられる。'} },
  { id:"heian_period", name:"平安時代", category:"dynasty", lat:35.01, lng:135.77, start:794, end:1185, region:"日本(平安京=京都)", relatedIds:["fujiwara_michinaga", "genpei_war"], desc:{background:'奈良時代における仏教勢力の政治介入(道鏡事件)や律令制度の形骸化への対応として、新たな都への遷都と統治体制の刷新が求められたことが、この時代の始まりの背景となった。', process:'桓武天皇による平安京遷都を経て、律令制度が次第に形骸化する中で藤原氏による摂関政治が確立し、国風文化(かな文字・『源氏物語』などの女流文学)が花開いたが、地方では武士団が台頭し、院政期を経て平氏政権、さらに鎌倉幕府成立へと移行した。', significance:'約400年に及ぶこの時代に、律令制的な中央集権体制から摂関政治・院政という独自の権力構造、さらに武士の台頭という日本独自の政治的展開が進み、国風文化はその後の日本文化の基層を形成した。', debate:'摂関政治を「天皇権力の形骸化・貴族による権力簒奪」とみるか「天皇と外戚が共存する独自の権力分有システム」とみるかで、この時代の統治構造の性格づけが論じられる。'} },
  { id:"emperor_kanmu", name:"桓武天皇", category:"person", parentId:"heian_period", lat:35.01, lng:135.77, start:737, end:806, region:"平安時代", desc:{background:'奈良時代における仏教勢力の政治的影響力増大(道鏡事件)への強い警戒感が、新たな都への遷都を志向する背景となった。', process:'仏教勢力の影響が及ばない新天地を求めて長岡京、次いで平安京への遷都を断行し、律令制度の実効性強化にも努めるとともに、坂上田村麻呂を征夷大将軍として派遣し東北地方の蝦夷平定を進めた。', significance:'平安京は以後千年以上にわたり日本の都であり続け(明治維新までの事実上の首都)、その都市計画は現在の京都の基本構造の起源となっている。', debate:'彼の東北蝦夷平定政策が、日本列島における「化外の民」の統合・同化過程としてどのような歴史的意義を持つか、古代日本の対外・対異民族政策の性格づけとして論じられる。'} },
  { id:"fujiwara_michinaga", name:"藤原道長", category:"person", parentId:"heian_period", lat:35.01, lng:135.77, start:966, end:1027, region:"平安時代(京都)", desc:{background:'藤原氏内部の権力闘争を勝ち抜き、自らの娘たちを次々と天皇の后に立てる巧みな婚姻政策を展開したことが、彼の権力確立の背景となった。', process:'「この世をば我が世とぞ思ふ望月の欠けたることも無しと思へば」の歌に象徴される絶頂期の権勢を築き、外戚として3代の天皇の摂政・関白の実権を握り、藤原氏全盛期を現出した。', significance:'摂関政治の頂点を体現する人物として、彼の時代に紫式部『源氏物語』などの国風文化が花開き、この時代の貴族文化の繁栄は日本文化史上の重要な達成として位置づけられる。', debate:'その絶大な権勢が天皇の権威を実質的にどこまで空洞化させていたか、この摂関政治の権力構造の性格づけが、後の院政開始の歴史的必然性との関連で論じられる。'} },
  { id:"genpei_war", name:"源平合戦", category:"war", lat:33.96, lng:130.98, start:1180, end:1185, region:"日本全国(壇ノ浦)", desc:{background:'平氏の専横的な政治運営への貴族・寺社・地方武士層の広範な不満が、源氏を中心とする反平氏勢力結集の背景となった。', process:'源頼朝が東国で挙兵し弟義経の軍事的才能もあって各地で平氏軍を撃破し、最終的に壇ノ浦の戦いで平氏一門は幼帝安徳天皇とともに滅亡した。', significance:'この内乱を通じて頼朝は東国に独自の武家政権(後の鎌倉幕府)の基盤を確立し、以後約700年に及ぶ武家政権の時代の実質的な出発点となった。', debate:'頼朝が弟義経を最終的に排除・追討した経緯(義経の独断専行への不満、あるいは頼朝の権力集中への脅威認識)は、武家政権内部の権力構造・忠誠関係のあり方を考える重要な事例として論じられる。'} },

  // ===================== 日本史(中世) =====================
  { id:"minamoto_yoritomo", name:"源頼朝", category:"person", parentId:"kamakura_shogunate", lat:35.32, lng:139.55, start:1147, end:1199, region:"鎌倉幕府", desc:{background:'父義朝の敗死(平治の乱)後に伊豆へ流されていたが、平氏の専横への不満を背景に挙兵の機会を捉えたことが、彼の台頭の背景となった。', process:'東国武士団の支持を集めて挙兵し弟義経らの活躍で平氏を滅ぼし、後に義経を排除しつつ全国に守護・地頭を設置する権限を朝廷から獲得して独自の武家政権(鎌倉幕府)の基盤を確立した。', significance:'日本史上最初の武家政権(鎌倉幕府)の創始者として、朝廷から自立した独自の統治機構という日本の政治体制における画期的な転換をもたらした。', debate:'弟義経・叔父などの近親者への冷徹な排除・粛清を伴った彼の権力確立過程は、武家政権創始における「血縁の情」と「権力の論理」との緊張関係を示す事例として論じられる。'} },
  { id:"kamakura_shogunate", name:"鎌倉幕府", category:"dynasty", lat:35.32, lng:139.55, start:1185, end:1333, region:"日本(鎌倉)", relatedIds:["mongol_invasion_japan", "kemmu_restoration"], desc:{background:'源平合戦での勝利を経て、源頼朝が東国に朝廷から自立した独自の武家政権樹立を志向したことが背景となった。', process:'頼朝が征夷大将軍に任じられ御恩と奉公による主従関係(御家人制)に基づく武家政権を樹立し、承久の乱で朝廷方を破って全国的な支配権を確立、執権北条氏による事実上の統治のもと元寇を撃退したが、この防衛戦での恩賞不足への御家人の不満から統治基盤が弱体化し1333年に滅亡した。', significance:'日本史上最初の本格的な武家政権として、以後約700年続く武士による統治という日本独自の政治体制の出発点となり、御恩と奉公による封建的主従関係のモデルを確立した。', debate:'元寇での防衛成功にもかかわらず、恩賞不足(そもそも新たな領土獲得を伴わない防衛戦であったため)への御家人の不満が統治基盤を弱体化させたという逆説は、軍事的勝利と政治的安定が必ずしも一致しないことを示す事例として論じられる。'} },
  { id:"kemmu_restoration", name:"建武の新政", category:"event", lat:34.36, lng:135.86, start:1333, end:1336, region:"日本(京都・吉野)", desc:{background:'鎌倉幕府の弱体化(元寇後の恩賞不足による御家人の不満)に乗じ、後醍醐天皇が武家政権打倒と天皇親政の復活を目指したことが背景となった。', process:'楠木正成・足利尊氏ら武士の協力を得て鎌倉幕府を滅ぼし天皇親政を復活させたが、公家中心の論功行賞への武士層の強い不満を招き、離反した足利尊氏の挙兵によりわずか2年余りで崩壊し、天皇は吉野へ逃れて南北朝の内乱へと突入した。', significance:'武家政権の中断という日本史上稀な天皇親政復活の試みであったが、その急速な失敗は、鎌倉幕府滅亡後もなお武士階級による統治が不可避であったことを露呈する結果となった。', debate:'この親政復活の失敗を、後醍醐天皇の武士層への配慮を欠いた統治判断の誤りに求めるか、そもそも既に確立していた武家社会の構造を天皇親政では制御し得なかった時代的な必然性に求めるかで議論がある。'} },
  { id:"ashikaga_takauji", name:"足利尊氏", category:"person", parentId:"muromachi_shogunate", lat:35.01, lng:135.77, start:1305, end:1358, region:"室町幕府", desc:{background:'鎌倉幕府滅亡に貢献したが、後醍醐天皇による天皇親政(建武の新政)が武士の期待に応えられなかったことへの不満が、彼の離反の背景となった。', process:'後醍醐天皇に反旗を翻して京都に新たな天皇(光明天皇)を擁立し、自ら征夷大将軍として室町幕府を開いたが、後醍醐天皇は吉野に逃れて独自の朝廷(南朝)を維持し、以後60年近くに及ぶ南北朝の内乱が続いた。', significance:'鎌倉幕府に続く第二の本格的な武家政権を樹立したが、その正統性(北朝擁立の是非)をめぐる長期の内乱は、日本の統治における「正統性」の複雑さを示す事例となった。', debate:'南北朝の並立という異例の事態が、天皇の権威の絶対性・唯一性という観念にどのような影響を与えたか、この内乱が後世の皇統認識に残した影響が論じられる。'} },
  { id:"muromachi_shogunate", name:"室町幕府", category:"dynasty", lat:35.01, lng:135.77, start:1336, end:1573, region:"日本(京都・室町)", relatedIds:["onin_war"], desc:{background:'鎌倉幕府滅亡後の建武の新政(後醍醐天皇による天皇親政の試み)への武士層の不満が、足利尊氏による新たな武家政権樹立の背景となった。', process:'足利尊氏が京都に幕府を開き、南北朝の内乱を経て3代将軍義満の代に最盛期(勘合貿易・北山文化)を迎えたが、8代将軍義政期の応仁の乱を機に将軍権威は急速に失墜し、以後戦国時代へと突入した。', significance:'この時代に発展した禅宗文化(水墨画・茶の湯・能楽)は日本の伝統文化の重要な基層を形成し、また守護大名の自立化という現象は日本における中央集権の弱体化と地方分権化の重要な先例となった。', debate:'この幕府の権力基盤の弱さ(有力守護大名への依存)が、鎌倉幕府と比べてどこまで構造的な脆弱性であったか、戦国時代への移行の必然性が論じられる。'} },
  { id:"ashikaga_yoshimitsu", name:"足利義満", category:"person", parentId:"muromachi_shogunate", lat:35.01, lng:135.77, start:1358, end:1408, region:"室町幕府", desc:{background:'南北朝の内乱による国内の分裂状態を、室町幕府の権威回復を通じて収拾する必要が治世の背景となった。', process:'南北朝の合一を実現して内乱を終結させ、明との勘合貿易(朝貢形式による日明貿易)を開始して経済的利益を得るとともに、京都北山に金閣を建てるなど北山文化と呼ばれる室町文化の最盛期を築いた。', significance:'室町幕府の権威と経済的繁栄を頂点にまで押し上げた将軍として、彼が確立した勘合貿易システムは以後の日本の対外交易における重要な枠組みとなった。', debate:'明皇帝から「日本国王」に冊封されたことを受け入れたこの外交姿勢が、日本の対外的な自立性・独自の国際的地位認識にとってどのような意味を持つものであったかが、東アジア冊封体制論の観点から論じられる。'} },
  { id:"onin_war", name:"応仁の乱", category:"war", lat:35.01, lng:135.77, start:1467, end:1477, region:"日本(京都)", desc:{background:'室町幕府8代将軍足利義政の後継者をめぐる対立と、有力守護大名(細川氏・山名氏)間の勢力争いが複雑に絡み合ったことが、この内乱の背景となった。', process:'京都を主戦場に東西両軍が11年にわたり激しい市街戦を繰り広げ、京都の大半が焼失する甚大な被害をもたらしたが、明確な勝敗がつかないまま自然消滅的に終息した。', significance:'この戦乱により将軍・幕府の権威は完全に失墜し、以後全国各地で守護大名に代わる新興勢力(戦国大名)が実力によって領国を支配する下克上の戦国時代が本格的に始まった。', debate:'この内乱が「勝者なき戦争」として終わったにもかかわらず、なぜこれほど決定的に中央権威の崩壊と地方分権化(戦国時代)を招いたのか、その構造的な影響力の大きさが論じられる。'} },
  { id:"sengoku_period", name:"戦国時代(日本)", category:"event", lat:35.01, lng:135.77, start:1467, end:1590, region:"日本全国", desc:{background:'応仁の乱による室町幕府の権威失墜が、各地で守護大名やその家臣が実力で領国支配権を奪う下克上を可能にする政治的空白を生んだことが背景となった。', process:'織田信長・武田信玄・上杉謙信ら有力戦国大名が領国経営(分国法制定・楽市楽座など)と軍事力強化(鉄砲の導入)を競い合い、最終的に織田信長・豊臣秀吉による天下統一事業を経て徳川家康の江戸幕府開設により終結した。', significance:'約1世紀にわたるこの動乱期は、鉄砲伝来を機とする軍事技術革新や、南蛮貿易を通じたヨーロッパとの本格的な接触など、日本史における重要な変革と国際化の時代であった。', debate:'この時代の「下克上」という現象を、単なる無秩序な権力闘争とみるか、実力主義に基づく新たな社会秩序形成への創造的破壊の過程とみるかで、この時代の歴史的評価が分かれる。'} },

  // ===================== 日本史(近世) =====================
  { id:"oda_nobunaga", name:"織田信長", category:"person", lat:35.13, lng:136.13, start:1534, end:1582, region:"日本(安土)", desc:{background:'尾張の一地方勢力という比較的小さな基盤から出発しながら、既存の権威・慣習にとらわれない革新的な発想を持っていたことが、彼の急速な台頭の背景となった。', process:'桶狭間の戦いでの奇襲勝利を皮切りに勢力を拡大し、鉄砲を効果的に用いた長篠の戦いでの勝利、楽市楽座による経済振興、比叡山焼き討ちなど既存の宗教的権威にも容赦のない姿勢で天下統一事業を進めたが、家臣明智光秀の謀反(本能寺の変)により志半ばで倒れた。', significance:'戦国時代の混乱に終止符を打つ天下統一事業の基礎を築いた革新的指導者として、その政策(楽市楽座・鉄砲の戦術的活用)は後継の豊臣秀吉・徳川家康による統一事業に直接引き継がれた。', debate:'彼を「残虐な独裁者」とみるか「合理的・革新的な近代化の先駆者」とみるかで評価が分かれ、本能寺の変における明智光秀の動機(野心・怨恨・黒幕説など)も日本史上最大級の未解決の謎として論争が続いている。'} },
  { id:"toyotomi_hideyoshi", name:"豊臣秀吉", category:"person", lat:34.69, lng:135.5, start:1537, end:1598, region:"日本(大坂)", relatedIds:["imjin_war"], desc:{background:'低い身分から織田信長に仕え、その卓越した才覚により重用されるに至った経歴が、本能寺の変後の権力継承の背景となった。', process:'明智光秀を討って信長の後継者としての地位を確立し、太閤検地・刀狩による兵農分離を進めて全国統一を完成させたが、朝鮮出兵(文禄・慶長の役)という無謀な対外遠征は失敗に終わり、その死後まもなく豊臣政権は徳川家康により実権を奪われた。', significance:'農民出身から天下人にまで上り詰めた稀有な立身出世の体現者として、太閤検地・刀狩は近世日本の身分制社会(士農工商)の基盤を確立する画期的な統治政策となった。', debate:'朝鮮出兵という彼の対外政策の失敗を、老齢による判断力の衰えという個人的要因に求めるか、統一後の武士階級の不満のはけ口を求める構造的必要性に求めるかで議論がある。'} },
  { id:"tokugawa_ieyasu", name:"徳川家康", category:"person", parentId:"edo_shogunate", lat:35.68, lng:139.65, start:1543, end:1616, region:"江戸幕府", desc:{background:'今川氏・織田氏のもとで人質・従属的立場を長く経験した忍耐強い性格が、関ヶ原の戦いでの覇権確立という最終的な成功の背景となったとされる。', process:'関ヶ原の戦いで実権を確立し征夷大将軍として江戸幕府を開き、大坂の陣で豊臣氏を完全に滅ぼして幕藩体制の基礎を固め、参勤交代・鎖国政策など長期安定統治のための諸制度を整備した。', significance:'260年以上続く江戸幕府を開いた創業者として、その統治体制は日本史上最も長期にわたる安定した平和(「パクス・トクガワーナ」)を実現し、この時代の経済・文化的発展の基盤を築いた。', debate:'「鳴くまで待とう」という逸話に象徴される彼の忍耐強い性格が、実際の政治的成功にどこまで直接的に寄与したか、その現実主義的な統治手法の評価とあわせて論じられる。'} },
  { id:"edo_shogunate", name:"江戸幕府(徳川幕府)", category:"dynasty", lat:35.68, lng:139.65, start:1603, end:1868, region:"日本(江戸)", relatedIds:["sakoku_policy", "shimabara_rebellion", "perry_arrival"], desc:{background:'関ヶ原の戦い・大坂の陣を経て徳川家康が確立した覇権が、長期安定統治のための諸制度整備の背景となった。', process:'参勤交代による大名統制、鎖国政策による対外関係の管理(オランダ・中国・朝鮮・琉球との限定的交流)、身分制度(士農工商)の固定化を通じて260年以上に及ぶ長期の平和と安定を実現したが、19世紀にはペリー来航を機とする開国要求と内政の行き詰まりにより、最終的に大政奉還・王政復古を経て終焉した。', significance:'世界史上稀にみる長期の平和と鎖国による独自の経済・文化発展(元禄文化・化政文化)を実現し、この時代に蓄積された経済的・教育的基盤(識字率の高さなど)は明治維新後の急速な近代化を可能にする重要な土台となった。', debate:'「鎖国」政策を、対外関係を完全に遮断した閉鎖的政策とみるか、長崎・対馬・薩摩・松前という「四つの窓口」を通じた管理された開放性とみるかで、近年の研究では後者の視点が有力になりつつある。'} },
  { id:"sakoku_policy", name:"鎖国", category:"event", lat:32.75, lng:129.87, start:1639, end:1854, region:"日本(長崎)", desc:{background:'キリスト教の拡大への警戒(信者の忠誠が幕府より教会・海外勢力に向かうことへの懸念)と、貿易利益の幕府による独占的管理という二つの動機が、この政策の背景となった。', process:'段階的にポルトガル船の来航禁止・日本人の海外渡航禁止などの措置を重ね、最終的にオランダ・中国とは長崎出島経由、朝鮮とは対馬藩経由、琉球とは薩摩藩経由、蝦夷地とは松前藩経由という限定的な「四つの口」を通じた管理貿易体制を確立した。', significance:'完全な鎖国ではなく厳格に管理された対外関係の維持であったことが近年の研究で明らかにされており、この体制下でも蘭学(西洋学問)を通じた一定の海外情報・技術の継続的な流入は確保されていた。', debate:'この政策を「日本の近代化を遅らせた閉鎖的政策」と否定的に評価する伝統的な見方に対し、「独自の経済・文化発展を可能にした管理された国際関係」として積極的に再評価する近年の研究動向との間で評価が分かれる。'} },
  { id:"shimabara_rebellion", name:"島原の乱", category:"war", lat:32.79, lng:130.37, start:1637, end:1638, region:"日本(島原・天草)", desc:{background:'島原・天草地方における過酷な年貢取り立てとキリシタン弾圧への農民の蓄積した不満が、この大規模反乱の背景となった。', process:'少年天草四郎を指導者(象徴的存在)として農民・キリシタンが原城に立てこもり長期の籠城戦を展開したが、幕府の大軍による総攻撃で反乱軍はほぼ全滅した。', significance:'この反乱の鎮圧を機に幕府はキリシタン弾圧・鎖国政策をさらに強化し、以後日本国内で大規模な武装反乱はほぼ発生しない長期の平和(「パクス・トクガワーナ」)の時代に入った。', debate:'この反乱の性格を「純粋な宗教的反乱(キリシタン一揆)」とみるか「過酷な年貢取り立てへの経済的反発が主因の農民一揆」とみるかで、その本質的な性格づけをめぐる議論が続いている。'} },
  { id:"perry_arrival", name:"黒船来航(ペリー来航)", category:"event", lat:35.25, lng:139.67, start:1853, end:1854, region:"日本(浦賀)", relatedIds:["kanagawa_treaty"], desc:{background:'アメリカが太平洋捕鯨業の補給拠点確保と中国貿易への中継地としての日本開国を強く求めていたことが、この来航の背景となった。', process:'アメリカ東インド艦隊司令長官ペリーが軍艦(黒船)4隻を率いて浦賀に来航しフィルモア大統領の国書を提示、圧倒的な軍事力を背景とした砲艦外交により幕府に開国を迫り、翌年の再来航時に日米和親条約の締結を実現させた。', significance:'200年以上続いた鎖国体制の終焉を告げる決定的な事件として、この開国要求は幕府の権威失墜と尊王攘夷運動の高揚を招き、最終的な江戸幕府崩壊・明治維新への引き金となった。', debate:'この来航がなければ日本の開国・近代化はどのような経路をたどったか、外圧による開国という経験が明治以降の日本の対外認識・国家戦略にどこまで規定的な影響を与えたかが論じられる。'} },
  { id:"kanagawa_treaty", name:"日米和親条約", category:"treaty", lat:34.68, lng:138.95, start:1854, end:1854, region:"日本(下田)", desc:{background:'ペリーの砲艦外交による軍事的圧力のもと、幕府が開国要求への具体的な対応を迫られたことが、この条約締結の直接的背景となった。', process:'下田・箱館の2港を開いて薪水・食料の供給を認め、アメリカに一方的な最恵国待遇を与える内容で締結されたが、本格的な自由貿易は認めない限定的な開国にとどまった。', significance:'この条約を皮切りに英・露・蘭とも同様の条約が結ばれ、以後1858年の日米修好通商条約(不平等条約)へとつながる、日本の開国過程における最初の一歩となった。', debate:'この条約自体はまだ本格的な不平等条約(治外法権・関税自主権喪失)を含んでいなかったことから、開国過程を段階的なプロセスとして理解する必要性が論じられる。'} },

  // ===================== 日本史(近代) =====================
  { id:"meiji_restoration", name:"明治維新", category:"revolution", lat:35.01, lng:135.77, start:1867, end:1889, region:"日本(京都・東京)", relatedIds:["emperor_meiji", "satsuma_rebellion"], desc:{background:'度重なる外圧への対応の失敗による幕府権威の失墜と、下級武士を中心とする尊王攘夷運動・倒幕運動の高まりが、この政治的大転換の背景となった。', process:'薩長同盟を軸とする倒幕勢力が大政奉還・王政復古を経て戊辰戦争で旧幕府勢力を破り、天皇を中心とする新政府のもと廃藩置県・四民平等・徴兵制・殖産興業など急速かつ包括的な近代化改革を断行した。', significance:'非西洋世界において自主的に近代国民国家建設を成し遂げた稀有な成功例として、この急速な近代化はわずか数十年で日清・日露戦争に勝利する国力を築き上げ、アジア・アフリカの他の近代化運動にも大きな影響を与えた。', debate:'この近代化の急速な成功要因を、江戸時代に蓄積されていた経済的・教育的基盤(識字率の高さなど)に求めるか、明治政府指導者の卓越した政治的手腕に求めるかで、比較近代化論上の評価が分かれる。'} },
  { id:"emperor_meiji", name:"明治天皇", category:"person", parentId:"empire_of_japan", lat:35.68, lng:139.65, start:1852, end:1912, region:"大日本帝国(東京)", desc:{background:'幕末の政治的混乱の中、若くして即位したことが、倒幕・新政府樹立という劇的な政治的転換の象徴的中心となる背景となった。', process:'王政復古を経て新政府の名目上の中心として五箇条の御誓文発布・東京遷都を経験し、大日本帝国憲法発布による立憲君主制確立、日清・日露戦争を経た大国化という日本近代化の全過程を統治期間中に見届けた。', significance:'近代日本の国家的アイデンティティの象徴的中心として、その治世(明治時代)は日本が非西洋世界で最も成功した近代化のモデルケースとなった激動の時代の呼称としても用いられ続けている。', debate:'天皇個人の政治的実権の実態(元老・藩閥政治家による実質的な統治との関係)について、立憲君主としての象徴的権威と実際の政治的影響力の程度がどこまでのものであったかが論じられる。'} },
  { id:"empire_of_japan", name:"大日本帝国", category:"nation", lat:35.68, lng:139.65, start:1868, end:1947, region:"日本(東京)", relatedIds:["meiji_constitution", "sino_japanese_war", "russo_japanese_war", "japan_annex_korea", "kanto_earthquake", "manchurian_incident", "second_sino_japanese_war", "pacific_war"], desc:{background:'明治維新による近代国家建設が、天皇を中心とする立憲君主制国家という統治形態確立の背景となった。', process:'大日本帝国憲法制定により立憲君主制の体裁を整え、日清・日露戦争を経て台湾・朝鮮を植民地化し、満洲事変以降は軍部の台頭により対外拡張路線を強め、太平洋戦争での敗北により1945年に崩壊した。', significance:'非西洋世界で最も成功した近代国民国家建設・帝国主義的拡張の事例として、その興隆と崩壊の過程は近代化・軍国主義化・敗戦という20世紀アジア史の縮図ともいえる軌跡を描いた。', debate:'この帝国の性格を「西欧列強に伍する近代国家建設の成功」と評価するか「アジアへの侵略・植民地支配を伴う軍国主義国家」と評価するかで、日本国内外における歴史認識が今も鋭く対立している。'} },
  { id:"meiji_constitution", name:"大日本帝国憲法", category:"treaty", lat:35.68, lng:139.65, start:1889, end:1889, region:"大日本帝国(東京)", desc:{background:'自由民権運動の高まりへの対応と、西欧列強との不平等条約改正のためには立憲国家としての体裁を整える必要があるという認識が、この憲法制定の背景となった。', process:'伊藤博文がプロイセン憲法を主として参考にしつつ起草し、天皇主権のもと限定的な議会(帝国議会)と国民の権利(法律の範囲内での)を規定する欽定憲法として発布された。', significance:'アジアで最初期の近代的成文憲法として、天皇に統治権を集中させつつ立憲主義の形式を備えるという独自の統治モデルを確立し、以後の日本の政治体制の基本枠組みを1945年まで規定し続けた。', debate:'この憲法における天皇の統治権の絶対性と、限定的とはいえ議会・国民の権利規定が併存する構造が、実際の運用において立憲主義的抑制と天皇制絶対主義のどちらの性格をより強く帯びていたかについて、憲法史上の評価が分かれる。'} },
  { id:"satsuma_rebellion", name:"西南戦争", category:"war", lat:31.6, lng:130.56, start:1877, end:1877, region:"日本(鹡児島)", desc:{background:'明治新政府の急速な近代化改革(廃刀令・秩禄処分など)による士族階級の特権喪失と困窮が、旧武士層の不満を高めていたことが背景となった。', process:'西郷隆盛を擁する鹿児島士族が政府への不満から蜂起し、新政府軍と激しい戦闘を繰り広げたが、近代的な徴兵軍を擁する政府軍の前に敗北し西郷は自刃した。', significance:'士族による最後にして最大の武力反乱として、この鎮圧により明治政府の軍事的基盤(徴兵制に基づく近代軍)の優位性が実証され、以後武力による反政府運動は下火となり自由民権運動という言論による政治運動へと不満のはけ口が移行した。', debate:'西郷隆盛という維新の元勲自身が反乱の指導者となったという逆説は、明治維新という近代化事業の内部に存在した理念的対立(急進的近代化への賛否)をどう象徴しているかが論じられる。'} },
  { id:"saigo_takamori", name:"西郷隆盛", category:"person", parentId:"empire_of_japan", lat:31.6, lng:130.56, start:1828, end:1877, region:"大日本帝国(鹿児島)", desc:{background:'薩摩藩士として倒幕運動を主導した実績が、明治新政府における指導的地位確立の背景となった。', process:'維新の元勲として新政府に参加したが、朝鮮への強硬な外交政策(征韓論)をめぐる対立から政府を去り下野し、最終的には不平士族に擁立される形で西南戦争を起こして敗死した。', significance:'維新の英雄でありながら新政府に反旗を翻したという劇的な生涯から「最後の武士」として日本国内外で広く敬愛される存在となり、その悲劇的な最期は日本人の美意識(判官贔屓)に深く訴える物語として文化的にも大きな影響を残した。', debate:'彼の実像(急進的な対外強硬派か、旧来の武士の名誉を重んじる保守的人物か)については、後世の理想化・美化された物語(特に映画・小説を通じたイメージ形成)とどこまで一致するかが、史実と伝説の関係を考える上で論じられる。'} },
  { id:"russo_japanese_war", name:"日露戦争", category:"war", lat:38.9, lng:121.6, start:1904, end:1905, region:"満洲・朝鮮・日本海", desc:{background:'満洲・朝鮮半島における日露両国の勢力争いが、この戦争の背景となった。', process:'日英同盟を後ろ盾に開戦し、旅順攻囲戦・奉天会戦・日本海海戦(バルチック艦隊撃破)で勝利を収めたが、国力の限界からポーツマス条約では賠償金を得られず、この結果への国内の不満は日比谷焼き討ち事件を招いた。', significance:'アジアの新興国が欧州の大国に勝利した史上初の事例として世界的な衝撃を与え、この勝利を機に日本は朝鮮への保護国化・韓国併合を推し進める一方、この勝利は後のアジア・アフリカ諸民族の独立運動にも心理的な鼓舞を与えた。', debate:'この勝利がその後の日本の対外拡張路線(軍国主義化)をどこまで不可避なものとして方向づけたか、この戦争の世界史的意義(非白人国家の勝利という象徴性)と国内的帰結(軍部の発言力増大)との関係が論じられる。'} },
  { id:"kanto_earthquake", name:"関東大震災", category:"event", lat:35.68, lng:139.65, start:1923, end:1923, region:"大日本帝国(東京・横浜)", desc:{background:'関東地方の活発な地震活動という自然地理的条件が、この巨大地震発生の背景にある。', process:'マグニチュード7.9と推定される大地震が東京・横浜を中心に甚大な被害をもたらし、火災による焼死者が犠牲者の大半を占める中、混乱に乗じて朝鮮人・社会主義者への流言飛語に基づく虐殺事件も発生した。', significance:'この震災は東京の都市計画・防災意識に長期的な影響を残す一方、震災時の朝鮮人虐殺は日本近代史における最も深刻な人権侵害・排外主義の事例の一つとして今日まで歴史的検証の対象であり続けている。', debate:'この虐殺における官憲(軍・警察)の関与の程度(積極的な扇動か、流言の黙認・便乗にとどまったか)については史料的検証が続けられており、この事件の歴史的責任の所在をめぐる議論は今も続いている。'} },
  { id:"manchurian_incident", name:"満州事変", category:"event", lat:41.8, lng:123.43, start:1931, end:1932, region:"満洲(奉天)", relatedIds:["manchukuo"], desc:{background:'満洲における日本の権益(南満洲鉄道など)を関東軍が独自の判断で拡大しようとする軍事的野心が、この事変の背景となった。', process:'関東軍が南満洲鉄道の線路を自ら爆破し(柳条湖事件)これを中国側の犯行と偽って軍事行動を開始、政府・軍中央の統制を逸脱する形で満洲全域を占領し、翌年には傀儡国家満洲国を樹立した。', significance:'この事変は軍部(特に出先の関東軍)による独走が政府の方針を事実上追認させる先例となり、以後の日本の対外政策における文民統制の崩壊と軍国主義化を決定的に加速させる転換点となった。', debate:'この事変における軍中央・政府の事後追認という対応が、なぜ軍の独走を処罰せず容認する結果となったのか、日本の文民統制の構造的欠陥として重要な検討課題となっている。'} },
  { id:"manchukuo", name:"満州国", category:"nation", lat:43.88, lng:125.32, start:1932, end:1945, region:"満洲(新京=長春)", desc:{background:'満洲事変を通じて満洲を占領した関東軍が、国際的な批判を回避しつつ実質的支配を継続する方策として傀儡国家樹立を企図したことが背景となった。', process:'清朝最後の皇帝溥儀を執政(後に皇帝)として擁立し「五族協和」を建国理念に掲げたが、実権は関東軍が完全に掌握しており、国際連盟のリットン調査団はこれを日本の傀儡国家と認定し、日本は国際連盟を脱退した。', significance:'この国家樹立と国際連盟脱退は日本の国際的孤立を決定づけ、以後の日中戦争・太平洋戦争へと至る対外強硬路線を不可逆的なものとする重要な転換点となった。', debate:'「五族協和」という建国理念の理想主義的側面と、実際の日本による資源収奪・住民統制という植民地主義的実態との乖離が、この国家の性格をめぐる評価の中心的論点である。'} },

function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

/* =========================================================================
   サイドバー: フィルタリスト生成
   ========================================================================= */
const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];

function renderDesc(desc){
  if(!desc) return '';
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -2100, MAX_YEAR = 2030;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
