<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東アジア史地図 — 世界史探究</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root{
    --bg-chrome:#1b2430;
    --bg-chrome-alt:#212c3a;
    --bg-chrome-alt2:#283544;
    --parchment:#f3ecdc;
    --parchment-alt:#eadfc6;
    --ink:#2a2420;
    --ink-soft:#5b5346;
    --line:#3a4658;
    --line-parchment:#cbb98c;
    --gold:#c99a4a;
    --gold-strong:#e0b567;
    --text-light:#e9e2d0;
    --text-light-soft:#9aa3b3;

    --cat-person:#c0554a;
    --cat-nation:#3f7ea6;
    --cat-dynasty:#8259ac;
    --cat-event:#c99a4a;
    --cat-war:#8a3a3a;
    --cat-revolution:#3f8f74;
    --cat-treaty:#7a6a52;

    --header-h:68px;
    --footer-h:104px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-chrome);
    color:var(--text-light);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Spectral',Georgia,serif; }

  a{color:var(--gold-strong);}

  :focus-visible{
    outline:2px solid var(--gold-strong);
    outline-offset:2px;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  #app-header{
    height:var(--header-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
  }
  #app-header h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text-light);
  }
  #app-header .subtitle{
    margin:2px 0 0;
    font-size:12px;
    color:var(--text-light-soft);
    font-family:'Inter',sans-serif;
  }
  .header-year{
    text-align:right;
  }
  .header-year .label{
    font-size:11px;
    color:var(--text-light-soft);
    display:block;
    margin-bottom:2px;
  }
  .header-year .value{
    font-family:'Spectral',serif;
    font-size:24px;
    font-weight:600;
    color:var(--gold-strong);
    white-space:nowrap;
  }

  /* ---------- Main layout ---------- */
  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }

  /* Sidebar */
  #sidebar{
    width:230px;
    flex:0 0 auto;
    background:var(--bg-chrome-alt);
    border-right:1px solid var(--line);
    padding:18px 16px;
    overflow-y:auto;
  }
  #sidebar h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-light);
  }
  .filter-list{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 6px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
  }
  .filter-row:hover{ background:var(--bg-chrome-alt2); }
  .filter-row input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px; height:14px;
    flex:0 0 auto;
  }
  .swatch{
    width:10px; height:10px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }
  .filter-row .fname{
    flex:1 1 auto;
    font-size:13px;
    color:var(--text-light);
  }
  .filter-row .fcount{
    font-size:11px;
    color:var(--text-light-soft);
  }

  .filter-actions{
    display:flex;
    gap:10px;
    margin:12px 0 18px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--gold-strong);
    font-size:12px;
    padding:0;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .link-btn:hover{ text-decoration:underline; }

  .search-box{
    margin-bottom:18px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .search-box label{
    display:block;
    font-size:12px;
    color:var(--text-light-soft);
    margin-bottom:6px;
  }
  .search-box input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text-light);
    font-size:13px;
    padding:5px 2px;
    font-family:'Inter',sans-serif;
  }
  .search-box input:focus{
    border-bottom-color:var(--gold-strong);
    outline:none;
  }

  .stats{
    font-size:11.5px;
    color:var(--text-light-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .stats b{ color:var(--gold-strong); font-weight:600; }

  /* Map */
  #mapWrap{
    flex:1 1 auto;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg-chrome-alt);
  }
  .leaflet-tile-pane{
    filter:grayscale(18%) sepia(10%) saturate(85%) contrast(0.96) brightness(0.97);
  }
  .entry-label{
    background:rgba(27,36,48,.82) !important;
    border:none !important;
    box-shadow:none !important;
    color:#f3ecdc !important;
    font-family:'Inter',sans-serif;
    font-size:11px;
    padding:1px 6px !important;
    border-radius:3px !important;
  }
  .entry-label::before{ display:none; }

  /* クラスター(ピンの重なり)アイコン */
  .cluster-marker-wrap{ background:none !important; border:none !important; }
  .cluster-badge{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--bg-chrome-alt2);
    border:2px solid var(--gold-strong);
    color:var(--gold-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600;
    box-shadow:0 0 0 3px rgba(27,36,48,.55);
  }
  .leaflet-cluster-spider-leg{
    stroke:var(--gold-strong) !important;
    stroke-opacity:.6 !important;
  }

  /* Detail panel */
  #detailPanel{
    width:340px;
    flex:0 0 auto;
    background:var(--parchment);
    color:var(--ink);
    border-left:1px solid var(--line-parchment);
    overflow-y:auto;
    position:relative;
    transition:margin-right .22s ease;
  }
  #detailPanel.hidden{
    margin-right:-340px;
  }
  @media (prefers-reduced-motion: reduce){
    #detailPanel{ transition:none; }
  }
  #closeDetail{
    position:absolute;
    top:12px; right:12px;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line-parchment);
    background:var(--parchment-alt);
    color:var(--ink);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  #closeDetail:hover{ background:#e0d3ac; }
  #detailContent{ padding:26px 22px 30px; }
  .detail-badge{
    display:inline-block;
    font-size:11px;
    color:#fff;
    padding:3px 9px;
    border-radius:3px;
    margin-bottom:12px;
  }
  #detailContent h3{
    margin:0 0 6px;
    font-size:21px;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
  }
  .detail-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-parchment);
  }
  .detail-meta div{ margin-top:3px; }
  #detailContent p{
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    margin:0;
  }
  .desc-sections{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .desc-section{
    padding-left:12px;
    border-left:3px solid var(--line-parchment);
  }
  .desc-section.sec-background{ border-left-color:#3f7ea6; }
  .desc-section.sec-process{ border-left-color:#c99a4a; }
  .desc-section.sec-significance{ border-left-color:#3f8f74; }
  .desc-section.sec-debate{ border-left-color:#8a3a3a; }
  .desc-label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .desc-section.sec-background .desc-label{ color:#3f7ea6; }
  .desc-section.sec-process .desc-label{ color:#a67c2e; }
  .desc-section.sec-significance .desc-label{ color:#2f7358; }
  .desc-section.sec-debate .desc-label{ color:#8a3a3a; }
  .desc-text{
    font-size:13.5px;
    line-height:1.8;
    color:var(--ink);
    margin:0;
  }
  .detail-empty{
    padding:40px 22px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.8;
  }

  .back-btn{
    display:inline-block;
    background:none;
    border:1px solid var(--line-parchment);
    color:var(--ink-soft);
    font-size:12px;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:hover{ background:var(--parchment-alt); }

  .related-persons{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line-parchment);
  }
  .related-persons h4{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-family:'Inter',sans-serif;
  }
  .related-persons ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .person-list-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:9px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .person-list-item:hover{ background:var(--parchment-alt); }
  .related-cat-badge{
    display:inline-block;
    font-size:9.5px;
    color:#fff;
    padding:1px 6px;
    border-radius:3px;
    margin-right:7px;
    white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .person-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .person-years{
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .related-persons-empty{
    font-size:12px;
    color:var(--ink-soft);
    padding-top:2px;
  }

  /* Footer timeline */
  #timeline{
    height:var(--footer-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 22px;
  }
  #playBtn{
    flex:0 0 auto;
    background:var(--bg-chrome-alt2);
    border:1px solid var(--line);
    color:var(--gold-strong);
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  #playBtn:hover{ background:#31405490; }

  .timeline-track-wrap{
    flex:1 1 auto;
    position:relative;
    padding-top:6px;
    padding-bottom:22px;
  }
  #yearSlider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--line-parchment);
    outline:none;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:16px; height:16px;
    border:none;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
  }
  .ticks{
    position:relative;
    height:16px;
    margin-top:6px;
  }
  .tick{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    font-size:10.5px;
    color:var(--text-light-soft);
    white-space:nowrap;
  }
  .tick::before{
    content:"";
    position:absolute;
    top:-16px; left:50%;
    width:1px; height:6px;
    background:var(--line);
  }

  .speed-control{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .speed-control label{
    font-size:11px;
    color:var(--text-light-soft);
  }
  .speed-control select{
    background:var(--bg-chrome-alt2);
    color:var(--text-light);
    border:1px solid var(--line);
    border-radius:5px;
    padding:6px 8px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }

  /* Responsive: narrow screens */
  @media (max-width: 760px){
    #sidebar{
      width:100%;
      position:absolute;
      z-index:900;
      height:auto;
      max-height:55%;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    #detailPanel{
      position:absolute;
      right:0; left:0; top:auto; bottom:0;
      width:auto;
      height:60%;
      border-left:none;
      border-top:1px solid var(--line-parchment);
      transition:transform .22s ease;
      z-index:950;
    }
    #detailPanel.hidden{
      margin-right:0;
      transform:translateY(100%);
    }
    #timeline{ gap:10px; padding:0 12px; }
    .speed-control label{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <header id="app-header">
    <div>
      <h1>東アジア史 地図で学ぶ世界史</h1>
      <p class="subtitle">紀元前2100年 〜 西暦2030年 ・ 高校世界史探究 学習用(中国・モンゴル・朝鮮・日本)</p>
    </div>
    <div class="header-year">
      <span class="label">現在の年代</span>
      <span class="value" id="yearDisplay">紀元前500年</span>
    </div>
  </header>

  <div id="main">

    <aside id="sidebar">
      <h2>ジャンルで絞り込み</h2>
      <div class="filter-list" id="filterList"></div>
      <p style="font-size:11px; color:var(--text-light-soft); line-height:1.6; margin:8px 2px 0;">
        ※人物は単独のピンではなく、関連する国家・王朝のピンをクリックした先の一覧から見られます。
      </p>

      <div class="filter-actions">
        <button class="link-btn" id="selectAllBtn">すべて表示</button>
        <button class="link-btn" id="selectNoneBtn">すべて解除</button>
      </div>

      <div class="search-box">
        <label for="searchInput">名称で検索</label>
        <input type="text" id="searchInput" placeholder="例: ナポレオン、フランス革命">
      </div>

      <div class="stats">
        <b id="visibleCount">0</b> 件を表示中 / 全 <b id="totalCount">0</b> 件のデータ
      </div>
    </aside>

    <div id="mapWrap">
      <div id="map"></div>
    </div>

    <aside id="detailPanel" class="hidden">
      <button id="closeDetail" aria-label="閉じる">×</button>
      <div id="detailContent">
        <div class="detail-empty">地図上のピンをクリックすると、ここに詳しい解説が表示されます。</div>
      </div>
    </aside>

  </div>

  <footer id="timeline">
    <button id="playBtn">▶ 再生</button>
    <div class="timeline-track-wrap">
      <input type="range" id="yearSlider" min="-2100" max="2030" step="1" value="600">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="speed-control">
      <label for="speedSelect">速度</label>
      <select id="speedSelect">
        <option value="1">×1</option>
        <option value="5" selected>×5</option>
        <option value="20">×20</option>
        <option value="50">×50</option>
      </select>
    </div>
  </footer>

</div>

<script>
/* =========================================================================
   東アジア史 地図アプリ — データ本体
   -------------------------------------------------------------------------
   ジャンル(category)は以下の7種:
     person     人物
     nation     国家
     dynasty    王朝
     event      事件・出来事
     war        戦争・戦い
     revolution 革命
     treaty     条約

   各エントリの形式:
   {
     id:       一意の文字列ID
     name:     表示名(日本語)
     category: 上記7種のいずれか
     lat, lng: 地図上の座標(代表都市・場所)
     start:    存在/在位/発生開始年(西暦。紀元前はマイナスで表現。例: 紀元前500年 = -500)
     end:      終了年(単発の出来事は start と同じか、数年程度の幅を持たせる)
     region:   地域・国名の補助タグ
     desc:     詳細説明文
   }

   ★ データは今後、国・地域ごとに分割して追加していきます。
     新しいブロックを追加する際は、この配列に要素を push する形で
     どんどん拡張できます(下記はコメントで地域ごとに区切り済み)。
   ========================================================================= */

const historicalData = [


  // ===================== 古代中国(夏・殷・周) =====================
  { id:"xia_dynasty", name:"夏王朝", category:"dynasty", lat:34.71, lng:112.69, start:-2070, end:-1600, region:"中国・中原(河南)", desc:{background:'黄河中流域における農業共同体の発展と、治水事業を組織する必要性が、世襲的な王権を持つ最初期の国家形成を促したとされる。', process:'禹が治水事業の功績により舜から禅譲を受けて建国したと伝えられ、以後王位が世襲されるようになったが、その実在を直接示す文字史料は発見されておらず、二里頭遺跡がこれに対応するとの説が有力視されている。', significance:'伝説上は中国最初の王朝として、禅譲から世襲への転換という中国的王権理念の起点に位置づけられ、後世の史書(『史記』夏本紀)における正統な王朝系譜の出発点となった。', debate:'夏王朝の実在性そのものが考古学的に確証されておらず、二里頭遺跡を夏に比定する説と、これを否定し夏を後世の神話的構築物とみる説との間で、中国古代史学上の根本的な論争が続いている。'} },
  { id:"shang_dynasty", name:"殷(商)王朝", category:"dynasty", lat:36.1, lng:114.32, start:-1600, end:-1046, region:"中国・中原(河南)", desc:{background:'黄河下流域における青銅器鋳造技術の発達と、祖先祭祀を中心とする宗教的権威が、王権の正統性を支える基盤となった。', process:'甲骨文字による占卜記録を残し、精緻な青銅器(祭器)の鋳造技術で高度な文明を築いたが、紂王の暴虐な統治への反発から周の武王による牧野の戦いでの敗北を機に滅亡した。', significance:'甲骨文字は現存する最古の体系的な漢字であり、その解読により実在が考古学的に確証された中国最初の王朝として、殷墟の発掘は20世紀中国考古学最大の成果の一つとされる。', debate:'紂王の「暴虐」を伝える記述の多くは周による征服を正当化する後世の歴史叙述である可能性が高く、実際の紂王の統治実態と伝承上のイメージとの乖離が史料批判上の重要な論点となっている。'} },
  { id:"zhou_dynasty", name:"周王朝", category:"dynasty", lat:34.27, lng:108.95, start:-1046, end:-256, region:"中国・関中(陝西)〜中原", relatedIds:["confucius", "spring_autumn", "warring_states", "laozi"], desc:{background:'殷(商)の紂王の暴政への諸侯の不満が高まる中、西方の諸侯であった周の文王・武王が勢力を蓄えたことが建国の背景となった。', process:'武王が牧野の戦いで殷を滅ぼし「天命」思想に基づく統治の正統性を確立、封建制により一族・功臣を各地に分封したが、前771年の犬戎の侵入により都を東方の洛邑へ移す(東遷)と王権は急速に形骸化し、以後春秋・戦国という約550年に及ぶ分裂・抗争の時代に入った。', significance:'「天命」思想(徳を失った王朝は天命を失い交代する)は以後の中国王朝交代の正統性理論(易姓革命)の原型となり、この思想は現在に至るまで中国政治思想の根底に位置づけられている。', debate:'封建制がなぜ長期的には中央権力の弱体化を招いたのか、その制度的な限界(諸侯の自立化を防ぐ仕組みの欠如)が、後の郡県制導入との対比で論じられる。'} },
  { id:"confucius", name:"孔子", category:"person", parentId:"zhou_dynasty", lat:35.6, lng:116.99, start:-551, end:-479, region:"魯(山東)", desc:{background:'春秋時代の礼制崩壊(下克上の風潮)と社会秩序の混乱への危機感が、彼の思想形成の背景となった。', process:'各国を遊説して自らの政治理念(仁・礼による徳治)の実現を訴えたが生前に重用されることはなく、晩年は弟子の教育と古典の整理に専念し、その言行は死後に弟子たちにより『論語』としてまとめられた。', significance:'その思想(儒教)は前漢の武帝による国教化以降2000年以上にわたり中国のみならず東アジア全域(朝鮮・日本・ベトナム)の政治・社会・倫理思想の根幹をなし続けている。', debate:'儒教を「封建的身分秩序を正当化する保守的思想」とみるか「普遍的な仁愛と徳治を説く進歩的な政治哲学」とみるかで、近代以降(特に五四運動期の「孔子打倒」)から現在まで評価が大きく揺れ動いている。'} },
  { id:"laozi", name:"老子", category:"person", parentId:"zhou_dynasty", lat:33.63, lng:111.68, start:-600, end:-470, region:"中国", desc:{background:'春秋時代の社会的混乱と、儒教的な礼制中心の秩序観への懐疑が、無為自然を説く彼の思想形成の背景にあるとされる。', process:'『老子(道徳経)』において万物の根源である「道」への回帰と、作為を排する「無為自然」の統治理念を説いたと伝えられるが、その実在自体を疑う説もある。', significance:'儒教と並ぶ中国思想の二大潮流である道教・道家思想の始祖として位置づけられ、その自然回帰の思想は後の中国美術・文学(山水画・隠遁思想)にも大きな影響を与えた。', debate:'老子という人物の実在性、および『老子』というテキストの成立時期(戦国時代に複数の著者により編纂されたとする説が有力)について、文献学上の論争が続いている。'} },
  { id:"mengzi", name:"孟子", category:"person", parentId:"zhou_dynasty", lat:35.4, lng:117.0, start:-372, end:-289, region:"鄒(山東)", desc:{background:'戦国時代の激しい富国強兵競争と諸子百家の思想的対立の中、孔子の思想を継承・発展させる必要が彼の活動の背景となった。', process:'性善説(人間の本性は本来善であるとする説)を唱え、民衆の福祉を重視する「王道政治」を諸国の君主に説いて回ったが、その理想主義的な主張は当時の実利的な富国強兵路線とは相容れず、直接的な政治的実現には至らなかった。', significance:'「民を貴しと為し、社稷之に次ぎ、君を軽しと為す」という民本思想は、後世の儒教政治思想における為政者への道徳的制約の理論的根拠となり、朱子学における四書の一つとして尊重された。', debate:'彼の性善説と荀子の性悪説という対照的な人間観は、儒教内部における人間性理解の根本的な対立軸として、統治のあり方(徳治か法治か)をめぐる議論にも影響を与え続けている。'} },
  { id:"xunzi", name:"荀子", category:"person", parentId:"zhou_dynasty", lat:35.0, lng:118.0, start:-313, end:-238, region:"趙・楚(蘭陵)", desc:{background:'戦国末期の複数の思想潮流(儒家・法家・道家)が交錯する稷下の学における学術的交流が、彼の思想形成の背景となった。', process:'人間の本性は生来利己的で悪であるとする「性悪説」を唱え、後天的な礼による教化・矯正の必要性を強調し、その弟子である韓非子・李斯はそれぞれ法家思想を大成しのちの秦の統治理念に大きな影響を与えた。', significance:'儒家でありながら法家の理論的源流ともなったその思想は、儒教の枠内に礼と法という統治手法の両面を架橋する独自の位置を占め、後の中国統治思想における「外儒内法」的性格の理論的先駆けとなった。', debate:'儒家の枠内に位置づけられる荀子から、儒教を厳しく否定する法家の韓非子・李斯が輩出されたという思想史上の逆説的な系譜が、儒家思想内部の多様性・振れ幅の大きさを示す事例として論じられる。'} },
  { id:"mozi", name:"墨子", category:"person", parentId:"zhou_dynasty", lat:35.6, lng:116.99, start:-470, end:-391, region:"魯・宋", desc:{background:'儒教の礼制重視や身分に応じた差等的な愛(親疎の別)への批判的立場が、彼独自の思想形成の背景となった。', process:'身分の別なく全ての人を平等に愛する「兼愛」と、戦争による社会的損失を否定する「非攻」を説き、儀礼の簡素化(節葬・節用)を求める実利的・平等主義的な思想を展開し、一時は儒家と並ぶ有力な学派(墨家)を形成した。', significance:'身分を超えた平等な博愛主義と反戦思想は諸子百家の中でも際立って先進的であり、また墨家は独自の論理学・幾何学・防御戦術の研究でも知られる技術者集団としての性格も持っていた。', debate:'これほど先進的な思想を持ちながら秦漢統一以降急速に衰退し歴史の表舞台からほぼ姿を消した墨家の運命について、その組織的性格(準軍事的結社)が統一帝国の統治にとって危険視された結果ではないかという説が論じられる。'} },
  { id:"han_feizi", name:"韓非子", category:"person", parentId:"zhou_dynasty", lat:34.0, lng:113.0, start:-280, end:-233, region:"韓", desc:{background:'荀子に学びつつ、儒教的な徳治の理想論では戦国時代の弱肉強食の現実に対応できないという現実主義的な問題意識が、彼の法家思想確立の背景となった。', process:'法(明文化された規範)・術(君主による臣下の統制術)・勢(君主の権力基盤)を統合する法家思想を体系化し、この理論は同門の李斯を通じて秦の始皇帝の統治実践に直接的な影響を与えた。', significance:'その現実主義的な統治理論は、儒教的な理想主義とは対照的に法による厳格な統治(信賞必罰)を重視する中国政治思想のもう一つの重要な源流となり、秦の中央集権的統一国家建設の理論的基盤を提供した。', debate:'同門であった李斯の讒言により獄死したとされるその最期は、法家思想自体が内包する冷徹な権力闘争の論理を皮肉にも体現する事件として、法家思想の実践がもたらす人間関係の苛烈さを象徴する事例とされる。'} },
  { id:"spring_autumn", name:"春秋時代", category:"event", lat:34.62, lng:112.45, start:-770, end:-403, region:"中国・中原諸国", desc:{background:'周王朝の東遷(前770年)により王権の実質的権威が失われたことが、諸侯が覇権を競う分裂時代到来の背景となった。', process:'斉の桓公・晋の文公など有力諸侯が「尊王攘夷」を掲げて覇者(覇権を握る諸侯)となる体制が続いたが、名目上は周王の権威を認めつつも実質的には各国が自立的な行動をとる緩やかな秩序が長期化した。', significance:'この時代に諸子百家(儒家・道家・法家・墨家など)の思想的活動が花開き、中国思想史上最も創造的な時代の一つとなった、後の戦国時代へと続く長期分裂の前半期である。', debate:'「尊王攘夷」という建前と実際の権力政治との乖離をどう理解すべきか、この時代の国際秩序(緩やかな覇権体制)の性格づけが論じられる。'} },
  { id:"warring_states", name:"戦国時代", category:"event", lat:34.75, lng:113.6, start:-403, end:-221, region:"中国・七雄諸国", desc:{background:'春秋時代を通じた諸侯間の淘汰と有力な卿大夫による国家乗っ取り(晋の三分割=韓・魏・趙の成立など)が、この時代の本格的な分裂・抗争激化の背景となった。', process:'秦・楚・斉・燕・韓・魏・趙の「戦国七雄」が周王の権威をもはや顧みず互いに全面戦争(富国強兵競争)を繰り広げ、鉄製農具の普及による生産力向上と各国の変法(商鞅の変法など)による中央集権化が進んだ。', significance:'この時代の生存競争の中で法家・儒家・道家など諸子百家の思想が実践的に試され、最終的に最も徹底した中央集権改革(商鞅の変法)を行った秦が他の六国を次々と滅ぼして中国を統一した。', debate:'秦の統一を可能にした要因を、商鞅の変法による徹底した国家動員体制の確立に求めるか、地理的優位(関中の要害)に求めるかで議論がある。'} },
  { id:"shang_yang", name:"商鞅", category:"person", parentId:"warring_states", lat:34.33, lng:108.72, start:-390, end:-338, region:"秦(咸陽)", desc:{background:'秦が当時の東方諸国に比べ後進的とみなされていた状況の中、孝公が国力強化のための抜本的改革を求めたことが、彼の登用の背景となった。', process:'法家思想に基づき身分によらない信賞必罰の徹底(軍功による爵位付与)、連座制による相互監視、郡県制の導入など徹底した中央集権的改革(変法)を断行し秦の国力を飛躍的に強化したが、後ろ盾であった孝公の死後、恨みを買っていた貴族層により車裂きの刑に処された。', significance:'彼の改革は秦の富国強兵を実現し後の中国統一の基盤を築いたが、その徹底した法治主義は同時に厳しい弾圧・統制も伴い、後世「秦の苛政」への批判の一因ともなった。', debate:'改革者自身が自らの作った法(連座制)によって処刑されたという逸話は、急進的な制度改革がもたらす政治的リスクを象徴する事例として、その歴史的教訓性が論じられる。'} },

  // ===================== 秦・漢 =====================
  { id:"qin_dynasty", name:"秦王朝", category:"dynasty", lat:34.33, lng:108.72, start:-221, end:-206, region:"中国・咸陽", relatedIds:["qin_shi_huang"], desc:{background:'商鞅の変法以来の徹底した中央集権改革により蓄積された秦の国力が、戦国七雄の中で他国を圧倒する軍事的優位をもたらしたことが統一の背景となった。', process:'始皇帝が六国を次々と滅ぼして中国史上初の統一帝国を樹立し、郡県制・文字・度量衡・車軌の統一など徹底した中央集権化政策を進めたが、過酷な労役(万里の長城・阿房宮建設)と厳格な法治への民衆の不満が高まり、始皇帝死後わずか数年で陳勝・呉広の乱を機に急速に崩壊した。', significance:'中国史上初の統一帝国として、その中央集権的な統治制度(郡県制・皇帝制度)は以後2000年以上続く中国帝政の基本的な統治モデルを確立した画期的な意義を持つ。', debate:'「暴虐な短命王朝」という伝統的な評価に対し、近年は郡県制・文字統一などの制度的達成を積極的に再評価する見方が強まっており、「苛政」の実態と統一事業の歴史的意義のバランスをどうとるべきかが論じられる。'} },
  { id:"qin_shi_huang", name:"始皇帝", category:"person", parentId:"qin_dynasty", lat:34.33, lng:108.72, start:-259, end:-210, region:"秦", desc:{background:'13歳での即位から丞相呂不韋・李斯らの補佐を受けつつ実権を確立し、六国統一という祖先以来の悲願実現を目指したことが治世の背景となった。', process:'六国を次々と征服して中国史上初の統一を達成すると自ら「皇帝」の称号を創始し、郡県制・文字・度量衡の統一、万里の長城建設、焚書坑儒による思想統制を断行する一方、不老不死を求め巨大な兵馬俑を伴う陵墓を築かせた。', significance:'「皇帝」という称号と中央集権的統治制度を創始した中国史上最も影響力の大きい統治者の一人であり、その統一事業の物理的規模(兵馬俑・長城)は今日も世界的な考古学的関心を集めている。', debate:'「暴君」としての伝統的評価(焚書坑儒・過酷な労役)と、中国統一という不朽の歴史的偉業を成し遂げた「創業者」としての評価との間で、時代や政治状況によって評価が大きく振れ続けてきた人物である。'} },
  { id:"chen_sheng_uprising", name:"陳勝・呉広の乱", category:"war", lat:33.97, lng:115.62, start:-209, end:-208, region:"秦(大澤郷)", desc:{background:'秦の過酷な労役・法制度(遅刻すら死罪とする連座的な厳罰主義)への民衆の蓄積した不満が、この反乱の社会的背景となった。', process:'陳勝・呉広ら徴発された農民が、悪天候により徴発地への到着期限に間に合わないことを悟り、どのみち死罪ならばと蜂起に踏み切り、この蜂起は瞬く間に各地に波及して秦帝国の統治基盤を大きく揺るがした。', significance:'「王侯将相いずくんぞ種あらんや(王侯や将軍・宰相に生まれながらの血筋などない)」という言葉に象徴される、中国史上最初の大規模な農民反乱として、以後の中国史における「易姓革命」思想の実践的先例となった。', debate:'この反乱自体は短期間で鎮圧されたが、これが引き金となって秦帝国全体が崩壊に向かったことから、巨大な中央集権帝国の脆弱性(局地的な反乱が全体の崩壊を招く連鎖反応)についての教訓的事例として論じられる。'} },
  { id:"xihan_dynasty", name:"前漢(西漢)", category:"dynasty", lat:34.27, lng:108.95, start:-202, end:8, region:"中国・長安", relatedIds:["liu_bang", "emperor_wu_han", "silk_road_han"], desc:{background:'秦崩壊後の楚漢戦争を勝ち抜いた劉邦が、秦の急進的な中央集権化への反省から、より穏健な統治体制の構築を志向したことが建国の背景となった。', process:'郡県制と封建制を併用する郡国制を採用し、武帝の代に中央集権化を完成させ儒教を国教として採用、シルクロード交易や積極的な対外政策(匈奴討伐)で最盛期を築いたが、外戚・宦官の専横により後期には政治が混乱し、外戚王莽による簒奪(新の建国)で一時中断した。', significance:'儒教の国教化により以後2000年の中国統治理念の基本枠組みを確立し、「漢民族」「漢字」「漢語」という呼称にその名を残すなど、中国文明のアイデンティティの根幹を形成する王朝となった。', debate:'秦の急進的な法家統治から前漢の「外儒内法(表向きは儒教、実質は法家的統治)」への転換が、中国統治理念のどのような本質的な連続性・断絶性を示しているかが論じられる。'} },
  { id:"liu_bang", name:"劉邦(高祖)", category:"person", parentId:"xihan_dynasty", lat:34.27, lng:108.95, start:-256, end:-195, region:"前漢", desc:{background:'農民出身という低い身分から身を起こし、秦末の反乱の混乱の中で頭角を現したことが、彼の台頭の背景となった。', process:'秦滅亡後、宿敵項羽との楚漢戦争を勝ち抜いて中国を再統一し、秦の急進的な法家統治への反省から法を簡素化する一方(法三章)、功臣・一族への分封も行う郡国制を採用して統治基盤を固めた。', significance:'農民出身者が皇帝にまで上り詰めた中国史上最初の事例として、「布衣より天子に至る」という下克上の可能性を体現し、以後の中国史における王朝交代の一つの理念型を提供した。', debate:'彼の統治手法(粗野だが実利的な人材登用術)と、建国後の功臣粛清(韓信ら)という酷薄な側面をどう統合的に評価すべきか、建国者に共通する権力の非情さの問題として論じられる。'} },
  { id:"emperor_wu_han", name:"武帝", category:"person", parentId:"xihan_dynasty", lat:34.27, lng:108.95, start:-156, end:-87, region:"前漢", desc:{background:'文帝・景帝の代に蓄積された国力と、匈奴への対抗という対外的な安全保障上の必要性が、彼の積極的な対外政策の背景となった。', process:'儒教を国教として採用し中央集権を強化する一方、匈奴討伐・西域経営(張騫の西域派遣)を積極的に進めてシルクロード交易の基盤を確立したが、度重なる対外遠征と大規模建設事業により国庫は著しく疲弊した。', significance:'前漢の最盛期を築いた皇帝として、儒教の国教化は以後2000年の中国統治理念を決定づけ、シルクロード開通は東西交易・文化交流の礎を築いた世界史的意義を持つ。', debate:'積極的な対外拡張政策とその財政的代償(重税・専売制導入)のどちらに重きを置いて評価すべきか、「輝かしい版図拡大」と「民衆への負担」のバランスが論じられる。'} },
  { id:"dong_zhongshu", name:"董仲舒", category:"person", parentId:"xihan_dynasty", lat:34.27, lng:108.95, start:-179, end:-104, region:"前漢(長安)", desc:{background:'武帝が中央集権化のための統一的な統治イデオロギーを求めていたことが、彼の儒教国教化建言の背景となった。', process:'陰陽五行説と儒教を融合させた独自の宇宙論的な政治思想(天人相関説)を展開し、武帝に対し儒教を国家の唯一の正統思想として採用し他の諸学派を退けるよう建言した(「罷黜百家、独尊儒術」)。', significance:'この建言により儒教は以後2000年にわたり中国の事実上の国教としての地位を確立し、科挙制度を通じた官僚登用の基本理念としても機能し続けることとなった。', debate:'彼が確立した天人相関説(天災は為政者の失政への天の警告とする思想)が、皇帝権力を正当化すると同時に一定の道徳的制約も課すという二面性を持っていたことが、中国政治思想史上の重要な論点である。'} },
  { id:"sima_qian", name:"司馬遷", category:"person", parentId:"xihan_dynasty", lat:34.27, lng:108.95, start:-145, end:-86, region:"前漢(長安)", desc:{background:'太史令という官職を父から継承し、歴史記録編纂の使命感を強く抱いていたことが、彼の大著述事業の背景となった。', process:'匈奴に投降した将軍李陵を弁護したことで武帝の怒りを買い宮刑(去勢刑)に処されるという屈辱を受けながらも、この逆境の中で中国最初の紀伝体通史『史記』を完成させた。', significance:'『史記』は伝説上の黄帝から前漢武帝期に至る通史として、以後の中国正史(二十四史)の範型となる紀伝体という歴史叙述形式を確立した、中国史学史上最も重要な著作である。', debate:'宮刑という屈辱を受けながらも著述を完成させた彼の動機(「究天人之際、通古今之変」という彼自身の言葉)をどう理解すべきか、逆境が歴史家としての使命感をどう研ぎ澄ませたかが論じられる。'} },
  { id:"silk_road_han", name:"シルクロード(絹の道)の開通", category:"event", lat:43.79, lng:87.6, start:-139, end:100, region:"中央アジア〜中国", desc:{background:'匈奴挟撃のための同盟を求めた武帝が張騫を西域へ派遣したことが、この交易路開通の直接的な契機となった。', process:'張騫は当初の外交目的(大月氏との同盟)は果たせなかったものの、西域諸国に関する詳細な情報を持ち帰り、これを機に中国と中央アジア・西アジア・地中海世界を結ぶ陸上交易路が本格的に開かれ、絹・香辛料・宝石などが取引された。', significance:'この交易路は単なる物品交易にとどまらず仏教の中国伝来やイラン・中央アジアの文化・技術の東方伝播を媒介し、東西文明交流史上決定的な意義を持つグローバルなネットワークの基盤となった。', debate:'この交易路の開通を軍事外交(対匈奴戦略)の副産物とみるか、当初から交易利益を見込んだ意図的な経済政策とみるかで、その歴史的性格づけが論じられる。'} },
  { id:"wang_mang_xin", name:"新(王莽)", category:"dynasty", lat:34.27, lng:108.95, start:8, end:23, region:"中国・長安", desc:{background:'前漢後期の外戚・宦官の専横による政治的混乱と社会格差の拡大が、王莽による簒奪と急進的改革を可能にする土壌となった。', process:'外戚として実権を握った王莽が前漢を簒奪して新を建国し、周代の理想的な制度を模範とする復古的な急進改革(土地の国有化・奴婢売買の禁止・貨幣制度の頻繁な変更)を断行したが、現実離れした改革は社会の大混乱を招き、赤眉の乱などの反乱を経てわずか15年で滅亡した。', significance:'中国史上、儒教の理想(周代の井田制復活など)を字義通りに実現しようとした稀有な急進的改革の試みとして、理念先行の政策がもたらす統治の破綻の典型例と評価される。', debate:'王莽を「儒教理想主義に基づく改革者」と再評価する近代以降の一部の見方(特に社会主義的視点からの再評価)と、伝統的な「簒奪者・偽君子」という否定的評価との間で、評価が大きく分かれる。'} },
  { id:"donghan_dynasty", name:"後漢(東漢)", category:"dynasty", lat:34.62, lng:112.45, start:25, end:220, region:"中国・洛陽", relatedIds:["guangwu_emperor", "yellow_turban_rebellion"], desc:{background:'王莽の急進改革が招いた社会的混乱と各地の反乱(赤眉の乱など)が、漢王朝復興を掲げる勢力の台頭を可能にする条件を整えた。', process:'漢皇族の血を引く劉秀(光武帝)が反乱の中から台頭し漢を復興させたが、後期には幼帝の即位が続き外戚・宦官が交互に実権を握る政治的混乱が深まり、党錮の禁による官僚知識人の弾圧、黄巾の乱を経て各地の群雄割拠状態に陥り、後の三国時代へと移行した。', significance:'漢王朝の正統性を回復させたが、その後期における外戚・宦官の専横パターンは以後の中国王朝に繰り返し現れる構造的な統治問題の先例となった。', debate:'外戚・宦官の専横という現象が、幼帝即位という偶発的要因によるものか、専制君主制という統治構造自体に内在する必然的な弱点であるかが論じられる。'} },
  { id:"guangwu_emperor", name:"光武帝(劉秀)", category:"person", parentId:"donghan_dynasty", lat:34.62, lng:112.45, start:-5, end:57, region:"後漢", desc:{background:'王莽政権への各地の反乱の中、漢皇族の血統という正統性を掲げて勢力を糾合したことが彼の台頭の背景となった。', process:'群雄割拠の中から勝ち残り漢を復興させ、豪族勢力との融和を図りつつ戸籍整理・度量衡統一など内政再建に努め、比較的安定した治世を築いた。', significance:'「光武中興」と呼ばれる漢王朝の実質的な再建者として、その柔軟な統治手法(豪族との妥協)は新王朝樹立時の現実主義的な統治モデルの一例とされる。', debate:'豪族勢力との妥協的な統治が、短期的な安定をもたらした一方で長期的には豪族の経済的・政治的影響力を温存し、後の後漢末期の混乱の遠因となったのではないかという評価がある。'} },
  { id:"cai_lun", name:"蔡倫", category:"person", parentId:"donghan_dynasty", lat:34.62, lng:112.45, start:50, end:121, region:"後漢(洛陽)", desc:{background:'後漢の宮廷において、既存の書写材料(竹簡・絹布)が高価・かさばるという実用上の課題が、新素材開発の動機となった。', process:'樹皮・麻くず・魚網などの安価な材料を用いた製紙法を改良・確立し、この技術は宮廷に献上され広く普及するに至った。', significance:'この製紙技術は後にイスラーム世界を経てヨーロッパへ伝わり(タラス河畔の戦いを機とする技術伝播説が有力)、印刷術と並び人類の知識伝達・保存のあり方を根本的に変えた世界史上最重要の技術革新の一つである。', debate:'彼が製紙法の「発明者」か「改良者」かについては、彼以前にも原始的な製紙技術が存在した可能性を示す考古学的発見があり、技術発展における個人の貢献と累積的な集団的知恵との関係が論じられる。'} },
  { id:"yellow_turban_rebellion", name:"黄巾の乱", category:"war", lat:34.8, lng:114.35, start:184, end:184, region:"後漢・中国各地", desc:{background:'後漢後期の政治腐敗(外戚・宦官の専横)と度重なる天災・飢饉による民衆の困窮が、新興宗教組織を母体とする大規模反乱の社会的背景となった。', process:'太平道の教祖張角が「蒼天已死、黄天当立」を掲げて蜂起し、瞬く間に華北全域に反乱が拡大したが、政府軍と地方豪族の私兵により鎮圧され、この鎮圧過程で台頭した群雄(曹操・劉備・孫権ら)が後の三国時代の主役となっていった。', significance:'この反乱の鎮圧を通じて中央政府の統制力は決定的に弱体化し、地方軍事力を握った群雄が事実上独立する分裂状態を招いた、後漢滅亡と三国分立への直接の転換点である。', debate:'太平道という宗教組織が反乱の主体であったことは、道教の淵源となる民衆宗教運動が政治的動員力を持ち得ることを示す事例として、中国史における宗教と政治反乱の関係を考える重要な先例となっている。'} },

  // ===================== 三国・晋・南北朝 =====================
  { id:"cao_cao", name:"曹操", category:"person", parentId:"wei_kingdom", lat:36.33, lng:114.55, start:155, end:220, region:"魏(鄴)", desc:{background:'黄巾の乱鎮圧を通じて軍事力を蓄え、後漢末の混乱に乗じて華北の覇権確立を目指したことが台頭の背景となった。', process:'官渡の戦いで最大のライバル袁紹を破り華北をほぼ統一したが、赤壁の戦いで孫権・劉備連合軍に大敗し天下統一の野望は頓挫し、自らは皇帝位に就かず後漢の実権を掌握する形にとどめたが、その死後に子の曹丕が漢を廃して魏を建国した。', significance:'卓越した軍事的才能と政治的手腕により華北の再統一を成し遂げた一方、詩人としても優れた業績を残し、後世「治世の能臣、乱世の奸雄」と評される複雑な人物像で知られる。', debate:'彼を「乱世を収拾した英雄」とみるか「漢室を蔑ろにした簒奪者の元凶」とみるかは、儒教的正統史観(蜀漢正統論)と実力主義的評価との間で伝統的に大きく対立してきた論点である。'} },
  { id:"wei_kingdom", name:"魏", category:"dynasty", lat:34.62, lng:112.45, start:220, end:265, region:"中国華北(洛陽)", desc:{background:'曹操が築いた華北の軍事的・政治的基盤の上に、子の曹丕が後漢最後の皇帝から禅譲を受けたことが建国の背景となった。', process:'華北という中国の伝統的な経済的中心地を領有する最有力国として、蜀・呉との三国鼎立状態を保ったが、内部で実権を握った司馬氏が徐々に皇帝権力を掌握し、最終的に司馬炎が魏から禅譲を受けて晋を建国した。', significance:'後漢からの「禅譲」という形式を初めて実践し、この先例は以後の中国王朝交代における正統性演出の定型的パターン(実力による簒奪を形式的な禅譲で糊塗する)を確立した。', debate:'曹丕による禅譲の受け方(後漢皇帝への圧力の実態)と、後に魏から晋への禅譲がほぼ同じパターンで行われたことは、この「禅譲」形式が歴史的にどこまで実質を伴う正統な権力移譲であったかを問い直す重要な事例である。'} },
  { id:"liu_bei", name:"劉備", category:"person", parentId:"shu_han", lat:30.66, lng:104.07, start:161, end:223, region:"蜀漢(成都)", desc:{background:'漢皇族の遠い血筋という出自を掲げつつも、黄巾の乱鎮圧を通じて頭角を現した経歴が、後の蜀漢建国の背景となった。', process:'諸葛亮を三顧の礼で迎えて軍師とし、赤壁の戦いで孫権と同盟して曹操軍を撃退した後、益州(四川)を拠点に蜀漢を建国したが、義弟関羽の敗死への報復として起こした呉への遠征(夷陵の戦い)で大敗し、まもなく病没した。', significance:'漢室再興を掲げる正統性を主張し続けたことから、儒教的正統史観(特に朱子学以降)においては三国の中で最も道義的に正統な存在として位置づけられ、『三国志演義』を通じて理想的な仁君として広く親しまれている。', debate:'史実の劉備と、後世の文学作品(特に『三国志演義』)で理想化された「仁徳の君主」像との乖離がどの程度であるか、正史『三国志』と通俗小説との史料的性格の違いが論じられる。'} },
  { id:"zhuge_liang", name:"諸葛亮(孔明)", category:"person", parentId:"shu_han", lat:30.66, lng:104.07, start:181, end:234, region:"蜀漢(成都)", desc:{background:'劉備の三顧の礼を受け入れ、その理想主義的な漢室再興の大義に共鳴したことが、彼の生涯にわたる献身の背景となったとされる。', process:'「天下三分の計」を献策して蜀漢建国を導き、劉備死後も幼帝劉禅を補佐しつつ北伐(中原奪還)を繰り返し試みたが、国力の差から決定的な戦果を上げられないまま五丈原の陣中で病没した。', significance:'「鞠躬尽瘁、死而後已(身を粉にして力を尽くし、死してのちやむ)」という自らの言葉に象徴される忠誠と献身の理想像として、中国・東アジア全域で「智謀と忠義の体現者」として理想化され続けている。', debate:'彼の軍事的才能(特に北伐の戦略)への評価は、『三国志演義』による誇張された知将イメージと、正史における実際の戦績(限定的な成果)との間でしばしば再検討の対象となる。'} },
  { id:"shu_han", name:"蜀漢", category:"dynasty", lat:30.66, lng:104.07, start:221, end:263, region:"中国西南(益州・成都)", desc:{background:'劉備の漢室再興の大義と、諸葛亮の「天下三分の計」という戦略構想が、この国家建国の思想的・戦略的背景となった。', process:'益州(四川)という地形的に守りやすい地域を拠点に建国され、諸葛亮による内政整備と度重なる北伐(中原への遠征)を試みたが、国力(人口・経済規模)で魏に大きく劣り、最終的に263年に魏(後の晋)により滅ぼされた。', significance:'三国の中で最も国力が弱かったにもかかわらず、その「漢室の正統な継承者」という理念的正統性は後世の歴史叙述(特に朱子学の正統論)において高く評価され続けている。', debate:'国力で劣る蜀漢がなぜ40年以上存続し得たのか、その要因を地形的な守りやすさに求めるか、諸葛亮以下の卓越した人材登用・統治能力に求めるかで議論がある。'} },
  { id:"sun_quan", name:"孫権", category:"person", parentId:"wu_kingdom", lat:32.06, lng:118.79, start:182, end:252, region:"呉(建業)", desc:{background:'父孫堅・兄孫策が築いた江東(長江下流域)の勢力基盤を若くして継承したことが、彼の統治の出発点となった。', process:'赤壁の戦いで劉備と同盟して曹操の南下を阻止し、その後は魏・蜀両国との関係を巧みに使い分けながら江東の支配を安定させ、晩年に呉の皇帝を称した。', significance:'長江以南の江南地域を本格的に開発・統治する政権を確立し、この地域の経済的重要性はこの時代を境に着実に増大していき、後の中国史における江南の経済的中心化の先駆けとなった。', debate:'彼の統治手法(魏・蜀との柔軟な同盟関係の使い分け)を、優れた現実主義的外交とみるか、確固たる理念を欠いた日和見主義とみるかで評価が分かれる。'} },
  { id:"wu_kingdom", name:"呉", category:"dynasty", lat:32.06, lng:118.79, start:222, end:280, region:"中国江南(建業)", desc:{background:'孫氏一族が長江下流域(江東)で築いた地方勢力基盤を、赤壁の戦いでの勝利を機に独立した国家へと発展させたことが建国の背景となった。', process:'長江の天然の要害を活かして魏・蜀両国との抗争・同盟を繰り返しながら江南の開発を進め海上交易(東南アジア・日本方面)も行ったが、蜀漢滅亡後に魏(晋)からの圧力が強まり280年に晋により滅ぼされ三国時代は終焉した。', significance:'長江以南の本格的な開発を進めたことで、以後の中国史における経済的重心の南方への移動という長期的トレンドの出発点となった重要な政権である。', debate:'三国の中で最も長く存続した(魏・蜀滅亡後も存続)にもかかわらず、正統史観においては魏・蜀ほど重視されない傾向があることの背景(儒教的正統論争における位置づけの弱さ)が論じられる。'} },
  { id:"battle_red_cliffs", name:"赤壁の戦い", category:"war", lat:29.72, lng:113.93, start:208, end:208, region:"長江中流(赤壁)", desc:{background:'華北を統一した曹操が南下して中国統一を目指す中、劉備・孫権という南方の二勢力が連合してこれに対抗する必要に迫られたことが背景となった。', process:'劉備・孫権連合軍が、火計を用いた奇襲により長江上の曹操軍の大船団を焼き払い、疫病にも苦しんでいた曹操軍は大敗を喫して撤退した。', significance:'この敗北により曹操による中国統一の野望は頓挫し、以後魏・蜀・呉による三国鼎立という長期の分裂状態が固定化する決定的な転換点となった。', debate:'この戦いの詳細な経過(火計の実行者が周瑜か諸葛亮かなど)は『三国志演義』による文学的脚色が色濃く、正史における実際の戦況との異同が史料批判上の重要な検討課題となっている。'} },
  { id:"jin_western", name:"西晋", category:"dynasty", lat:34.62, lng:112.45, start:265, end:316, region:"中国(洛陽)", desc:{background:'魏の実権を徐々に掌握した司馬氏一族が、禅譲という形式を通じて権力移行を図ったことが建国の背景となった。', process:'司馬炎が魏から禅譲を受けて建国し呉を滅ぼして三国時代を終わらせ中国を再統一したが、一族への大規模な分封と、その後の帝位継承をめぐる皇族間の内乱(八王の乱)により国力を著しく消耗し、異民族(匈奴)の侵入を招いて316年に華北を失陥(永嘉の乱)、江南へ逃れて東晋として存続した。', significance:'三国時代を終わらせた統一王朝でありながらわずか数十年で崩壊し、以後中国は約270年に及ぶ南北分裂時代(魏晋南北朝)に突入することとなった。', debate:'「八王の乱」という皇族間の内紛が、なぜこれほど急速な国力消耗と異民族侵入を招いたのか、この王朝の統治構造(過度な皇族への権力分散)の構造的欠陥が論じられる。'} },
  { id:"sixteen_kingdoms", name:"五胡十六国時代", category:"event", lat:34.27, lng:108.95, start:304, end:439, region:"中国華北", desc:{background:'西晋の八王の乱による混乱と国力消耗が、北方諸民族(匈奴・鮮卑・羯・氐・羌の「五胡」)による華北への進出・建国を招く直接的契機となった。', process:'匈奴系の劉淵による建国を皮切りに、約130年間で五胡を中心とする複数の政権が華北で興亡を繰り返し、この間漢民族の多くは戦乱を逃れて江南へ移住(永嘉の南渡)し、最終的に鮮卑系の北魏が華北を統一した。', significance:'異民族による中国統治という前例のない状況の中で、遊牧民の軍事力と漢民族の統治技術・文化を融合させる統治モデルの試行錯誤が進み、これは後の北魏における本格的な漢化政策への布石となった。', debate:'この時代の異民族政権を「中国史の一部」として扱うべきか「征服王朝」として区別すべきかという問題は、中国史における「中華」概念の境界をめぐる根本的な史学理論上の論点である。'} },
  { id:"northern_wei", name:"北魏", category:"dynasty", lat:40.09, lng:113.3, start:386, end:534, region:"中国華北(平城・洛陽)", relatedIds:["emperor_xiaowen","yungang_longmen_grottoes"], desc:{background:'五胡十六国の混乱を経て、鮮卑族拓跋部が華北統一という軍事的達成を果たしたことが建国の背景となった。', process:'華北を統一し均田制・三長制など後の隋唐にも継承される重要な諸制度を創始し、孝文帝の代には漢化政策(服装・言語・姓のすべてを漢族風に改める)を徹底したが、この急進的な漢化への軍人層(六鎮)の反発が後の東西分裂を招く一因となった。', significance:'均田制・府兵制など隋唐帝国の根幹をなす諸制度の多くがこの王朝に起源を持ち、征服王朝でありながら中国の統治制度の発展に決定的な貢献をした点で、中国史における「征服王朝の中国化」の代表的成功例とされる。', debate:'孝文帝の急進的な漢化政策を、王朝の長期的な統治安定化のための合理的選択とみるか、鮮卑族固有の軍事的活力を損ない王朝分裂を招いた性急な改革とみるかで評価が分かれる。'} },
  { id:"emperor_xiaowen", name:"孝文帝", category:"person", parentId:"northern_wei", lat:34.62, lng:112.45, start:467, end:499, region:"北魏", desc:{background:'祖母馮太后の摂政期に進められた漢化政策の基盤の上に、より徹底した中国化統治を志向したことが治世の背景となった。', process:'都を平城から洛陽へ遷し、鮮卑族固有の服装・言語の使用を禁じ姓を漢族風に改めさせるなど徹底した漢化政策を断行し、均田制の実効的な運用を進めた。', significance:'この漢化政策により北魏は単なる征服王朝から中国的統治理念を体現する王朝へと変貌し、その統治制度は隋唐帝国の礎として継承された。', debate:'この急進的な漢化が北方の軍事拠点(六鎮)を担っていた鮮卑軍人層の疎外感を強め、後の六鎮の乱・東西魏分裂を招く直接的要因となったのではないかという評価が有力である。'} },
  { id:"southern_dynasties", name:"南朝(宋斉梁陳)", category:"dynasty", lat:32.06, lng:118.79, start:420, end:589, region:"中国江南(建康)", relatedIds:["houjing_rebellion"], desc:{background:'西晋滅亡後、江南へ逃れた漢民族政権(東晋)を継承する形で、宋・斉・梁・陳という4王朝が交代しながら江南を統治し続けたことが背景となった。', process:'北方の異民族政権(北朝)と対峙しながら、貴族制社会(門閥貴族による政治独占)のもとで江南の経済開発と貴族文化(六朝文化)の洗練が進んだが、軍事力では概して北朝に劣り、最終的に隋による中国再統一で北朝側に併合される形で終焉した。', significance:'この時代の江南開発は以後の中国経済の重心が南方へ移行する長期的トレンドの重要な段階をなし、六朝文化(詩文・書画)は中国文人文化の重要な源流の一つとなった。', debate:'貴族制社会における門閥貴族の政治独占が、この王朝群の軍事的脆弱性・短命さの構造的要因であったかどうかが、南北朝の比較史的観点から論じられる。'} },

  // ---- 東晋・五胡十六国期の政治と文化 ----
  { id:"dongjin_dynasty", name:"東晋", category:"dynasty", lat:32.06, lng:118.79, start:317, end:420, region:"中国江南(建康)", relatedIds:["feishui_battle"], desc:{background:'永嘉の乱による華北陥落を受け、西晋皇族の一人司馬睿が江南へ逃れて政権を再建したことが建国の背景となった。', process:'北方から移住した貴族層(僑姓貴族)と江南土着の豪族(呉姓貴族)との複雑な政治的均衡の上に成り立つ貴族制社会を築き、前秦の南下(淝水の戦い)を撃退して江南の独立を保ったが、内部の権力闘争を経て最終的に劉裕により簒奪され宋(南朝宋)に取って代わられた。', significance:'江南への漢民族の本格的な大規模移住(永嘉の南渡)を伴うこの政権樹立は、以後の中国史における経済・文化の重心の南方への移行という長期的趨勢の出発点となった。', debate:'この時代の貴族制社会(「王与馬、共天下=王氏と司馬氏が共に天下を治める」と評された貴族の強い政治的影響力)が皇帝権力にとってどこまで統治上の制約となっていたかが論じられる。'} },
  { id:"former_qin", name:"前秦", category:"dynasty", lat:34.27, lng:108.95, start:351, end:394, region:"中国華北(長安)", relatedIds:["feishui_battle"], desc:{background:'五胡十六国の混乱の中、氐族の苻氏が卓越した統治能力を持つ苻堅のもとで急速に勢力を拡大したことが背景となった。', process:'漢人宰相王猛の補佐のもと一時は華北のほぼ全域を統一する大帝国を築いたが、江南の東晋への征服を目指した淝水の戦いでの予想外の大敗を機に急速に瓦解し、諸民族が再び自立して混乱状態に戻った。', significance:'五胡十六国時代において最も統一に近づいた政権として、その急速な崩壊は多民族国家の脆弱性(征服した諸民族の求心力の弱さ)を象徴する事例となった。', debate:'淝水の戦いでのわずか一度の敗北がなぜこれほど急速で完全な帝国崩壊を招いたのか、多民族連合政権に内在する構造的脆弱性の問題として論じられる。'} },
  { id:"fu_jian", name:"苻堅", category:"person", parentId:"former_qin", lat:34.27, lng:108.95, start:338, end:385, region:"前秦(長安)", desc:{background:'氐族の族長家に生まれ、卓越した個人的資質と漢人宰相王猛の登用により急速に勢力を拡大したことが治世の背景となった。', process:'華北のほぼ全域を統一する大帝国を築き上げたが、江南の東晋征服を焦り、諸民族混成の大軍を率いて南下したものの淝水の戦いで壊滅的な敗北を喫し、その後まもなく部下の裏切りにより殺害された。', significance:'多民族の融和的統治(異民族出身者も含む広範な人材登用)を志向した先駆的な統治者であったが、その理想は淝水の戦いでの大敗により実現半ばで潰えた。', debate:'王猛の生前の忠告(東晋への性急な攻撃を戒める進言)を無視した判断が、彼個人の慢心によるものか、当時の政治的圧力(統一への焦り)によるものかが論じられる。'} },
  { id:"feishui_battle", name:"淝水の戦い", category:"war", lat:32.6, lng:116.8, start:383, end:383, region:"淮河流域(淝水)", desc:{background:'華北を統一した前秦の苻堅が、残る江南の東晋を征服して中国全土の統一を目指したことが開戦の背景となった。', process:'数において圧倒的に優勢な前秦の大軍が、東晋の巧みな心理戦(偽情報による混乱誘発)と自軍の統制の乱れにより自壊的な敗北を喫し、これを機に前秦は急速に瓦解した。', significance:'中国史上最も劇的な「寡兵が大軍を破った」戦いの一つとして、これにより南北分裂状態がさらに1世紀以上継続することとなった、中国史の重要な分岐点である。', debate:'この大敗の直接的原因を、前秦軍内部の民族的結束の弱さ(多民族混成軍の指揮系統の脆弱性)に求めるか、東晋側の巧みな戦術(偽情報を利用した混乱誘発)に求めるかで軍事史上の評価が分かれる。'} },
  { id:"wang_xizhi", name:"王羲之", category:"person", parentId:"dongjin_dynasty", lat:30.0, lng:120.6, start:303, end:361, region:"東晋(会稽)", desc:{background:'東晋の貴族社会における文人教養の重視という文化的環境が、書道という芸術ジャンルの高度な発展を促した背景となった。', process:'行書・草書における流麗で個性的な書風を確立し、代表作『蘭亭序』は文人の集いにおける即興の書として作られたとされる。', significance:'「書聖」として以後1500年以上にわたり中国・東アジア全域(日本・朝鮮を含む)の書道における絶対的な模範とされ続けている、中国芸術史上最も影響力の大きい人物の一人である。', debate:'現存する『蘭亭序』の全ての写本が後世の模写であり真跡が失われていることから(伝説では唐の太宗が自らの墓に副葬させたとされる)、その正確な筆致がどこまで再現され得ているかという書道史上の重要な検証課題がある。'} },
  { id:"gu_kaizhi", name:"顧愷之", category:"person", parentId:"dongjin_dynasty", lat:32.06, lng:118.79, start:344, end:406, region:"東晋(建康)", desc:{background:'東晋の貴族文化における絵画への高い関心と、人物の精神性を描写しようとする美意識の高まりが、彼の芸術活動の背景となった。', process:'人物画において単なる外見の再現を超えた精神性の表現(「伝神写照」=対象の精神を伝える描写)を理論化・実践し、女性の理想的な徳目を描いた『女史箴図』などの作品を残した。', significance:'中国絵画理論における「気韻生動」概念の先駆的な実践者として、以後の中国絵画史における人物画・肖像画の美学的基準を確立した重要な画家である。', debate:'現存する『女史箴図』(大英博物館所蔵)が彼自身の真筆か、後世(唐代)の模写かについては美術史上の論争があり、この作品の史料的価値の評価に影響している。'} },
  { id:"tao_yuanming", name:"陶淵明", category:"person", parentId:"dongjin_dynasty", lat:29.7, lng:116.0, start:365, end:427, region:"東晋〜宋(潯陽)", desc:{background:'貴族社会の権力闘争や官僚生活への幻滅が、彼の隠遁・田園生活への傾倒を促す背景となったとされる。', process:'低い官職を歴任した後、「五斗米の為に腰を折る能わず」との言葉を残して官職を辞し、田園での質素な生活を選んで詩作に専念し、理想郷を描いた『桃花源記』などの作品を残した。', significance:'官界からの隠退と田園生活を理想化するこの生き方・詩風は、以後の中国文人文化における「隠逸」の理想像を確立し、後世の詩人・画家に絶大な影響を与え続けている。', debate:'『桃花源記』に描かれる理想郷が、当時の戦乱・社会不安への逃避的な願望の表現か、より積極的な社会批評的意味合いを持つものかについて、文学史上の解釈が分かれる。'} },
  { id:"fotudeng", name:"仏図澄", category:"person", parentId:"sixteen_kingdoms", lat:36.33, lng:114.55, start:232, end:348, region:"後趙(鄴)", desc:{background:'西域(亀茲方面)出身の仏僧として、五胡十六国期の華北における仏教布教という新たな課題に取り組んだことが背景となった。', process:'後趙の石勒・石虎という異民族政権の統治者に取り入り、その神通力(奇跡的な能力)への評判を通じて仏教への保護と布教の基盤を確立した。', significance:'異民族政権のもとでの仏教布教という先例を確立し、この時代に築かれた華北仏教の基盤は後の北魏における仏教の国家的保護(雲崗・龍門石窟造営など)へとつながる重要な布石となった。', debate:'神通力を通じた布教という手法が、仏教の教義的な浸透にどこまで実質的な貢献をしたか、それとも表面的な庇護獲得の手段にとどまったかについて、仏教伝播史上の評価が論じられる。'} },
  { id:"kumarajiva", name:"鳩摩羅什", category:"person", parentId:"sixteen_kingdoms", lat:34.27, lng:108.95, start:344, end:413, region:"後秦(長安)", desc:{background:'中央アジアの亀茲国出身で、幼少期からインド・中央アジアの仏教学を学んだ卓越した学識が、後の大規模な漢訳事業の背景となった。', process:'前秦・後秦の招請により長安に迎えられ(捕虜としての連行を経て)、国家的な大規模翻訳事業を主導して『法華経』『阿弥陀経』『中論』など多数の仏典を漢訳した。', significance:'その流麗で分かりやすい漢訳文体は以後の中国仏教の経典理解の基礎となり、彼の翻訳した経典は東アジア仏教(日本・朝鮮を含む)における最も広く読誦される経典群として今日まで用いられ続けている。', debate:'彼の翻訳が原典の意味に忠実であることと、中国人読者に理解しやすい表現であることのどちらを優先したか、翻訳という営為における「正確性」と「受容しやすさ」の関係が翻訳論・仏教学上の重要な論点となっている。'} },
  { id:"faxian", name:"法顕", category:"person", parentId:"dongjin_dynasty", lat:32.06, lng:118.79, start:337, end:422, region:"東晋→インド", desc:{background:'中国における仏教戒律(律蔵)の不備を痛感し、原典を求めてインドへ赴く必要性を感じたことが、彼の求法の旅の動機となった。', process:'60歳を超える高齢でインドへの陸路の旅に出発し、仏跡を巡拝しつつ多数の仏典を収集し、帰路は海路でスリランカ・東南アジアを経由して帰国、その旅の記録を『仏国記』として著した。', significance:'中国僧による最初期のインド求法旅行の記録として、5世紀初頭の中央アジア・インド・東南アジアの仏教事情を伝える貴重な一次史料となり、後の玄奘の旅にも先例を提供した。', debate:'高齢での過酷な旅程の詳細な記述がどこまで正確な記憶に基づくものか、その旅行記の史料的信頼性が仏教史・南アジア史研究上重要な検討課題となっている。'} },
  { id:"yungang_longmen_grottoes", name:"雲崗・竜門石窟の造営", category:"event", lat:34.62, lng:112.45, start:460, end:528, region:"北魏(大同・洛陽)", desc:{background:'北魏による仏教の国家的保護政策が、大規模な石窟寺院造営という壮大な宗教事業の背景となった。', process:'雲崗石窟は平城遷都期に、龍門石窟は洛陽遷都後にそれぞれ国家的事業として造営され、インド・中央アジア(ガンダーラ)の仏教美術様式を受容しつつ独自の中国的様式へと発展させた。', significance:'この石窟群は仏教美術の中国化(インド的写実様式から中国的な精神性重視の様式への変容)の過程を視覚的に示す世界的に貴重な文化遺産として、1000年以上にわたる造営の連続性も含め東アジア仏教美術史上最重要の資料群である。', debate:'これらの石窟造営が北魏の国家的な政治的威信誇示という側面と、純粋な宗教的敬虔さのどちらをより強く反映しているかについて、美術史・宗教史上の議論がある。'} },
  { id:"houjing_rebellion", name:"侯景の乱", category:"war", lat:32.06, lng:118.79, start:548, end:552, region:"南朝梁(建康)", desc:{background:'南朝梁の武帝が仏教への深い帰依から政治的統治への関心を失いつつあった状況の中、北方からの亡命将軍侯景の受け入れが混乱を招く伏線となった。', process:'侯景が武帝を裏切って反乱を起こし、都建康を包囲・陥落させて武帝を幽閉・餓死させる事態にまで至り、この混乱により梁の国力は決定的に衰退した。', significance:'この反乱による荒廃は南朝の国力を大きく損ない、以後の陳による南朝統治の弱体化、ひいては隋による中国再統一を許す構造的な背景の一つとなった。', debate:'武帝の過度な仏教信仰への傾倒(自ら仏門に入る「捨身」を繰り返した逸話)が、この反乱を招いた統治の弛緩にどこまで直接的に寄与したかが論じられる。'} },

  // ===================== 隋・唐 =====================
  { id:"sui_dynasty", name:"隋王朝", category:"dynasty", lat:34.27, lng:108.95, start:581, end:618, region:"中国(長安・洛陽)", relatedIds:["emperor_yang_sui", "grand_canal_china"], desc:{background:'北朝末期の混乱の中、北周の外戚として実権を握った楊堅が、南北統一という長年の悲願実現を志向したことが建国の背景となった。', process:'楊堅(文帝)が北周から禅譲を受けて建国し陳を滅ぼして南北朝時代を終わらせ約270年ぶりの中国再統一を達成、均田制・府兵制・科挙制度の整備など重要な諸制度を確立したが、次代煬帝による大運河建設・高句麗遠征の失敗という過重な負担への反発から各地で反乱が相次ぎわずか2代で滅亡した。', significance:'科挙制度の創始は以後1300年に及ぶ中国官僚登用制度の根幹となり、南北統一という達成は次代の唐による長期の繁栄の基盤を築いた点で、短命ながら中国史上決定的な意義を持つ王朝である。', debate:'秦と同様「偉大な統一事業を成し遂げながら過酷な負担により短命に終わった王朝」という共通のパターンについて、両者の類似性がどこまで歴史的必然性を持つのか(統一直後の王朝に共通する構造的リスク)が論じられる。'} },
  { id:"emperor_yang_sui", name:"煬帝", category:"person", parentId:"sui_dynasty", lat:34.62, lng:112.45, start:569, end:618, region:"隋", desc:{background:'父文帝が達成した南北統一という基盤の上に、さらなる帝国の威信誇示と統治基盤強化を志向したことが治世の背景となった。', process:'大運河の建設や科挙制度の本格的整備を進める一方、高句麗への三度の遠征がいずれも失敗に終わり、この過重な負担(労役・軍役・重税)への民衆の不満が各地の反乱を誘発し、最終的に部下により殺害された。', significance:'その事業(大運河)は後世に長く経済的恩恵をもたらしたが、その建設・遠征の過程での過酷な収奪は「暴君」としての評価を決定づけ、この評価は秦の始皇帝としばしば比較される。', debate:'大運河建設という長期的に見れば偉大な経済的インフラ整備の功績と、それを実現した過程での民衆への過酷な負担のどちらに重きを置いて評価すべきかという、大規模国家事業一般の功罪評価に関わる典型的な論点である。'} },
  { id:"grand_canal_china", name:"大運河の建設", category:"event", lat:34.62, lng:112.45, start:605, end:610, region:"中国(黄河〜長江)", desc:{background:'南朝の経済発展により江南が中国の穀倉地帯として重要性を増す一方、政治的中心地である華北への物資輸送手段の確保が国家的課題となっていたことが背景となった。', process:'既存の運河を接続・拡張する大規模な土木事業として、膨大な労働力を動員して江南と華北を結ぶ全長数千キロの水路網を完成させたが、この建設過程での過酷な労役は隋滅亡の一因ともなった。', significance:'以後1000年以上にわたり中国の南北を結ぶ経済的動脈として機能し続け、江南の穀物を華北の政治的中心地へ効率的に輸送することを可能にし、中国の経済的統合における最重要インフラの一つとなった。', debate:'この巨大事業の建設費用・人的犠牲(建設に動員された民衆の過酷な労役による多数の死者)と、その後の長期にわたる経済的便益とを、どのように歴史的に総合評価すべきかが論じられる。'} },
  { id:"tang_dynasty", name:"唐王朝", category:"dynasty", lat:34.27, lng:108.95, start:618, end:907, region:"中国(長安)", relatedIds:["emperor_taizong_tang", "wu_zetian", "emperor_xuanzong_tang", "anshi_rebellion", "huangchao_rebellion", "kentoshi_missions", "liangshui_fa"], desc:{background:'隋末の混乱の中、太原の地方長官であった李淵が反乱鎮圧を名目に挙兵し、隋に代わる新王朝樹立を図ったことが建国の背景となった。', process:'李世民(太宗)の代に「貞観の治」と呼ばれる安定した統治を実現し、玄宗の代の「開元の治」で最盛期を迎えたが、安史の乱を境に急速に統治力が衰え、藩鎮(節度使)の自立化と宦官の専横が進み、黄巣の乱を経て907年に滅亡した。', significance:'シルクロード交易の隆盛と国際色豊かな文化(長安の国際都市としての繁栄)を築き、律令制度・科挙制度の整備を通じて日本・朝鮮など周辺諸国の国家建設の模範ともなった、東アジア文明の一大画期をなす王朝である。', debate:'安史の乱を境とする前期・後期の対照的な性格(国際的繁栄から内向きの分権化へ)をどう理解すべきか、この転換の構造的要因(節度使制度の制度的欠陥)が論じられる。'} },
  { id:"emperor_taizong_tang", name:"太宗(李世民)", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:598, end:649, region:"唐", desc:{background:'父李淵の唐建国を軍事的に支えた実績と、兄弟間の後継争い(玄武門の変)を勝ち抜いたことが即位の背景となった。', process:'魏徴ら諫言する臣下を重用し法制度・科挙制度を整備する安定した統治(貞観の治)を実現し、東突厥を服属させるなど対外的な威信も高め、周辺諸民族から「天可汗」と仰がれた。', significance:'「貞観の治」は以後の中国王朝における理想的な統治の模範として繰り返し参照され、その治世は唐の長期繁栄の確固たる基盤を築いた。', debate:'兄弟を殺害して即位した経緯(玄武門の変)という道義的な瑕疵と、その後の卓越した統治実績とをどう総合的に評価すべきかという、権力獲得の手段と統治の実績との関係を考える事例である。'} },
  { id:"wu_zetian", name:"則天武后", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:624, end:705, region:"唐(長安・洛陽)", desc:{background:'高宗の後宮に入り皇后となった後、病弱な高宗に代わり実権を掌握していく中で、自らの皇帝即位という前例のない野心を抱くに至ったことが背景となった。', process:'唐を一時中断させ自ら「周」を建国して中国史上唯一の女性皇帝となり、科挙制度の拡充による新興官僚層の登用を進めて既存の貴族勢力を抑制したが、晩年の退位後に唐が復活した。', significance:'儒教的な男性中心の統治理念が支配的な中国史において女性が皇帝に即位したという前例のない事例として、その統治実績(科挙拡充による人材登用の刷新)は近年再評価が進んでいる。', debate:'伝統的な儒教史観における「簒奪者・悪女」という否定的評価に対し、近年のフェミニズム史学・実証的研究による統治実績の再評価との間で、彼女への評価は大きく変化しつつある。'} },
  { id:"emperor_xuanzong_tang", name:"玄宗", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:685, end:762, region:"唐", desc:{background:'則天武后期の混乱を収拾し、唐の統治基盤を再建する必要性が治世前半の背景となった。', process:'治世前半は名臣を登用し「開元の治」と呼ばれる唐の最盛期を築いたが、晩年は楊貴妃への寵愛にふけり政治への関心を失い、節度使安禄山の反乱(安史の乱)を招いて都長安を追われる屈辱を味わった。', significance:'治世の前半と後半で全く対照的な評価(名君から昏君へ)を受ける稀有な事例として、唐の繁栄の頂点と衰退の始まりの双方を一人の統治者が体現している。', debate:'この「名君から昏君へ」という劇的な転落を、彼個人の資質の変化に帰すか、長期政権に共通する権力の腐敗・慢心という構造的要因に帰すかで評価が分かれる。'} },
  { id:"anshi_rebellion", name:"安史の乱", category:"war", lat:34.62, lng:112.45, start:755, end:763, region:"唐(河北・洛陽・長安)", desc:{background:'玄宗晩年の政治的弛緩と、辺境防衛を担う節度使(特に安禄山)への軍事力集中という制度的な構造的リスクが、この大反乱の背景となった。', process:'節度使安禄山が反乱を起こして都長安・洛陽を陥落させ玄宗は蜀へ逃れる屈辱を味わい、反乱鎮圧には8年もの歳月を要し、この過程で節度使に軍事的自立の道が開かれた。', significance:'この反乱は唐の国力を決定的に消耗させ、以後の唐は各地の節度使(藩鎮)が半独立的な軍事力を保持する分権的体制へと移行し、二度と往時の中央集権的繁栄を回復することはなかった。', debate:'この反乱を境とする唐の急速な衰退の要因を、節度使制度そのものの構造的欠陥に求めるか、玄宗個人の統治能力の劣化(楊貴妃への耽溺)に求めるかで議論がある。'} },
  { id:"huangchao_rebellion", name:"黄巣の乱", category:"war", lat:34.27, lng:108.95, start:875, end:884, region:"唐・中国各地", desc:{background:'唐末の重税と官僚の腐敗、そして塩の専売制による民衆の困窮が、この大規模反乱の社会的背景となった。', process:'科挙に落第した塩の密売商人黄巣が反乱を起こし、一時は都長安を占領して独自の政権(斉)を樹立するまでの勢力を築いたが、最終的に鎮圧されたものの唐の統治基盤に致命的な打撃を与えた。', significance:'この反乱の鎮圧に功のあった節度使たちがさらに自立化を強め、これが唐滅亡後の五代十国という群雄割拠時代への直接的な道を開いた。', debate:'科挙制度における「落第者」が体制への深刻な反乱の指導者となったこの事例は、科挙制度が持つ社会的安全弁としての機能とその限界を考える上で重要な事例として論じられる。'} },
  { id:"xuanzang", name:"玄奘", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:602, end:664, region:"唐(長安)", desc:{background:'中国に伝わっていた仏典の翻訳の不備・不統一に強い問題意識を抱き、原典を求めてインドへ赴く必要性を感じたことが、彼の求法の旅の動機となった。', process:'国禁を犯して密かに出国し、中央アジアの砂漠・パミール高原を越える過酷な旅を経てインドのナーランダ僧院で仏教哲学(唯識思想)を学び、多数の経典を携えて帰国、その旅の記録は『大唐西域記』として著され、後に『西遊記』の題材ともなった。', significance:'膨大な仏典の精確な漢訳事業を主導し法相宗の開祖となったほか、『大唐西域記』は7世紀の中央アジア・インドの詳細な情報を伝える歴史学・考古学上極めて重要な一次史料となっている。', debate:'国禁を犯した密出国という行為が、後に皇帝(太宗)から手厚い保護を受けるに至った経緯は、個人の学問的情熱と国家権力との複雑な関係性を示す興味深い事例として論じられる。'} },
  { id:"yijing_monk", name:"義浄", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:635, end:713, region:"唐(長安)", desc:{background:'先達玄奘の陸路によるインド求法の成功に触発されつつ、より安全な海路でのインド往来という新たな選択肢を模索したことが背景となった。', process:'海路(南シナ海・インド洋経由)でインドへ渡りナーランダ僧院で学び、帰路にシュリーヴィジャヤ王国(スマトラ)に長期滞在して仏典の翻訳・著述に従事し、その旅の記録『南海寄帰内法伝』を残した。', significance:'海路を用いたこの旅程は当時の東南アジア海上交易網の発達を示す重要な証言であり、シュリーヴィジャヤでの長期滞在の記録は当時の東南アジア仏教の実態を知る貴重な史料となっている。', debate:'陸路の玄奘と海路の義浄という対照的な求法の経路の違いが、それぞれの時代の交通インフラ・国際情勢の違いをどう反映しているかが、東西交流史の観点から論じられる。'} },
  { id:"li_bai", name:"李白", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:701, end:762, region:"唐", desc:{background:'道教的な超俗の精神性と、盛唐期の国際色豊かで自由な文化的雰囲気が、彼の奔放な詩風形成の背景となった。', process:'各地を放浪しながら酒と自然を愛する自由奔放な生き方を貫き、玄宗の宮廷に一時仕えたが束縛を嫌って辞し、道教的な神仙思想や豪放な想像力に満ちた詩を数多く残した。', significance:'「詩仙」として杜甫と並び称される唐詩の最高峰の一人であり、その自由奔放な詩風は以後の中国文学における浪漫主義的伝統の頂点として東アジア全域の文学に絶大な影響を与えた。', debate:'彼の生涯を彩る数々の伝説的逸話(酔って水面の月を捕らえようとして溺死したという説など)がどこまで史実か、詩人としての理想化されたイメージの形成過程が文学史上の関心事となっている。'} },
  { id:"du_fu", name:"杜甫", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:712, end:770, region:"唐", desc:{background:'安史の乱という国家的動乱を身をもって経験し、その戦禍と民衆の苦難を目撃したことが、彼の詩風の社会的・写実的性格の背景となった。', process:'安史の乱の混乱の中で各地を放浪し貧困と病苦に苦しみながらも、社会の不条理・民衆の苦難を写実的かつ精緻な律詩の形式で詠み続けた。', significance:'「詩聖」として李白と並び称され、その社会批評的・写実的な詩風は「詩史(詩による歴史記録)」とも評され、以後の中国文学における社会派・写実主義的伝統の頂点として位置づけられる。', debate:'李白の浪漫主義的・非現実的な詩風と、杜甫の写実主義的・社会批評的な詩風という対照的な二大詩人の存在は、唐詩の多様性と中国文学における「理想」と「現実」という二つの美学的極を象徴する事例として論じられる。'} },
  { id:"bai_juyi", name:"白居易", category:"person", parentId:"tang_dynasty", lat:34.27, lng:108.95, start:772, end:846, region:"唐", desc:{background:'科挙に合格し官僚として活躍する中、平易で分かりやすい詩を通じて社会批評を行う姿勢を確立したことが、彼の文学活動の背景となった。', process:'難解な典故を避け庶民にも理解しやすい平易な言葉で詩作を行い、玄宗と楊貴妃の悲恋を詠んだ長編叙事詩『長恨歌』や、社会の不条理を批判する「新楽府」など幅広い作品を残した。', significance:'その平易な詩風は生前から民衆に広く愛誦され、日本の平安貴族文化(『源氏物語』などにおける白居易詩の引用)にも絶大な影響を与えるなど、東アジア全域における最も広く読まれた唐代詩人の一人となった。', debate:'詩の平易さを追求したことが、文学的な洗練度を犠牲にしたのか、むしろ普遍的な訴求力を獲得する上での戦略的な美学的選択であったのかが文学史上論じられる。'} },
  { id:"kentoshi_missions", name:"遣唐使", category:"event", lat:34.69, lng:135.8, start:630, end:894, region:"日本(奈良・平安京)〜唐(長安)", desc:{background:'日本が中国(唐)の先進的な律令制度・仏教文化・国際情勢を直接学ぶ必要性を強く認識したことが、この使節派遣の背景となった。', process:'7世紀から9世紀にかけて十数回にわたり派遣され、多くの留学生・学問僧(阿倍仲麻呂・空海・最澄など)が同行して唐の制度・文化・仏教を学び、危険な航海(遣唐使船の遭難も多発)を伴いながらも継続された。', significance:'この使節を通じて律令制度・仏教(密教など)・漢字文化・都城制(平城京・平安京の設計)など日本の古代国家形成の根幹をなす制度・文化が体系的に導入され、日本文化の基層形成に決定的な役割を果たした。', debate:'菅原道真の建言により894年に停止されたこの使節派遣が、その後の日本文化の「国風化」(仮名文字・大和絵など独自文化の発展)をどこまで直接的に促したかについて、日本文化史上の重要な論点となっている。'} },
  { id:"liangshui_fa", name:"両税法", category:"event", lat:34.27, lng:108.95, start:780, end:780, region:"唐", desc:{background:'安史の乱後の混乱により従来の均田制・租庸調制が実効性を失い(戸籍の混乱・土地制度の崩壊)、新たな税制の必要性が生じたことが背景となった。', process:'宰相楊炎の建言により、従来の人頭税中心の制度から土地・資産に応じて夏・秋の年二回徴税する両税法へと転換し、この改革は以後の中国税制の基本モデルとなった。', significance:'人頭税から資産税への転換は、土地を離れて流動化する人口という新たな社会経済状況に対応する画期的な税制改革として、以後の中国税制史における重要な転換点となった。', debate:'この改革が地方の実情に応じた柔軟な徴税を可能にした一方、地方官による恣意的な税額決定の余地を広げ、新たな不正・搾取の温床ともなったのではないかという批判的評価がある。'} },

  // ===================== 五代十国・宋 =====================
  { id:"five_dynasties", name:"五代十国時代", category:"event", lat:34.8, lng:114.35, start:907, end:960, region:"中国全域", desc:{background:'唐末の黄巣の乱鎮圧を経て自立化した節度使たちが、唐滅亡後の中原の覇権を争ったことが、この分裂時代の背景となった。', process:'後梁・後唐・後晋・後漢・後周という5つの短命王朝が中原で交代する一方、地方には十国と呼ばれる複数の政権が並立し、この混乱の中で燕雲十六州が契丹(遼)に割譲されるなど北方の脅威も深刻化した。', significance:'この分裂と武人政治の混乱への反省が、次の宋王朝における徹底した文治主義(軍人の政治的影響力抑制)への転換を強く動機づけることとなった。', debate:'この時代の政治的混乱の根本原因を、節度使という地方軍事力を統制する中央の制度的失敗に求めるか、唐末以来の社会経済構造の変化(貴族制の崩壊)に求めるかで議論がある。'} },
  { id:"beisong_dynasty", name:"北宋", category:"dynasty", lat:34.8, lng:114.35, start:960, end:1127, region:"中国(開封)", relatedIds:["zhao_kuangyin", "wang_anshi_reform", "jingkang_incident", "woodblock_printing_song"], desc:{background:'五代十国の混乱と武人政治への反省が、趙匡胤による新王朝樹立と文治主義への転換を強く動機づけたことが背景となった。', process:'趙匡胤(太祖)が禅譲を経て建国し「杯酒釈兵権」により有力武将から軍権を平和裏に取り上げて文治主義体制を確立し、科挙制度の拡充と経済的繁栄(貨幣経済の発達・都市の繁栄)を実現したが、軍事力の相対的軽視は北方民族(遼・西夏・金)への劣勢を招き、1127年に金の侵攻により首都開封が陥落した(靖康の変)。', significance:'文治主義による安定した官僚統治と高度な経済・文化的発展(活字印刷・火薬・羅針盤の実用化)を実現した「中国のルネサンス」とも評される時代であったが、軍事的脆弱性という代償を伴った。', debate:'文治主義への徹底した転換が経済・文化的繁栄と引き換えに深刻な軍事的脆弱性をもたらしたという評価は、「文武の均衡」という統治における普遍的課題を考える上での重要な歴史的教訓として論じられる。'} },
  { id:"zhao_kuangyin", name:"趙匡胤(太祖)", category:"person", parentId:"beisong_dynasty", lat:34.8, lng:114.35, start:927, end:976, region:"北宋", desc:{background:'五代最後の後周に仕える将軍として軍事的信望を集めていたことが、部下たちに擁立される形での即位(陳橋の変)の背景となった。', process:'禅譲という形式で後周から帝位を譲り受け宋を建国し、地方軍閥の再来を防ぐため有力武将たちを酒宴の席で説得し穏便に軍権を返上させる「杯酒釈兵権」を実施して中央集権的な文治主義体制を確立した。', significance:'武力によらず酒宴での説得という平和的手法で軍権集中を実現したことは、中国史上稀有な穏健な権力集中の事例として高く評価され、この文治主義体制は宋約320年の統治の基本枠組みとなった。', debate:'この平和的な軍権剥奪の成功は、五代の武断政治への反省という時代の空気を反映したものか、彼個人の卓越した政治的手腕によるものかで評価が分かれる。'} },
  { id:"wang_anshi_reform", name:"王安石の新法", category:"event", lat:34.8, lng:114.35, start:1069, end:1085, region:"北宋", desc:{background:'北宋中期における財政難(冗官・冗兵による支出増大)と、地主・大商人による富の集中への社会的不満が、抜本的な改革の必要性を生んだ背景となった。', process:'神宗の信任を得た王安石が、農民への低利融資(青苗法)・国家による物流統制(均輸法)・募兵制の見直し(保甲法)など広範な改革(新法)を断行したが、既得権益層(旧法党、司馬光ら)の激しい反発を招き、以後新法党・旧法党の党争が数十年にわたり続いて国政を混乱させた。', significance:'国家による市場介入と社会保障的な政策を組み合わせたこの改革は、前近代世界における先進的な経済政策の試みとして評価され、近代以降(特に社会主義的視点から)しばしば再評価の対象となっている。', debate:'この改革を「先進的な国家資本主義的政策」と積極的に評価するか「机上の理論に基づく現実離れした改革で党争による国政混乱を招いた」と否定的に評価するかで、中国経済史上の評価が大きく分かれ続けている。'} },
  { id:"jingkang_incident", name:"靖康の変", category:"event", lat:34.8, lng:114.35, start:1127, end:1127, region:"北宋(開封)", desc:{background:'北宋が金と結んで遼を挟撃した(海上の盟)後、金との関係が悪化し軍事的緊張が高まったことが、この事変の背景となった。', process:'金軍が首都開封を包囲・陥落させ、上皇の徽宗・皇帝の欽宗をはじめとする皇族・官僚数千人を捕虜として北方へ連行し、北宋は事実上滅亡した。', significance:'この屈辱的な事件は「靖康の恥」として中国史上最大級の国家的屈辱の一つとして記憶され、皇族の一人趙構が南方へ逃れて南宋を樹立する直接の契機となった。', debate:'この事変を招いた金との同盟(海上の盟)という外交判断が、遼という緩衝国を自ら滅ぼしてより強大な金と直接対峙する結果を招いた戦略的失策であったかどうかが、外交史上の重要な教訓として論じられる。'} },
  { id:"nansong_dynasty", name:"南宋", category:"dynasty", lat:30.27, lng:120.15, start:1127, end:1279, region:"中国江南(臨安=杭州)", relatedIds:["yue_fei", "maritime_trade_song"], desc:{background:'靖康の変による北宋滅亡という危機の中、皇族趙構が江南で亡命政権を樹立したことが建国の背景となった。', process:'金との抗争(岳飛らの北伐)を経て最終的に金と和議(紹興の和議)を結び淮河を国境とする南北対峙状態が続き、江南の経済発展(海上交易の拡大・稲作の集約化)が進んだが、13世紀にはモンゴル(元)の圧力が強まり1279年の崖山の戦いで完全に滅亡した。', significance:'江南の本格的な経済開発を通じて中国の経済的重心が完全に南方へ移行し、この時代に確立された経済構造・海上交易網は以後の中国経済の基本的な地理的パターンを規定した。', debate:'金との和議(主戦派の岳飛処刑を伴う)を、屈辱的な妥協とみるか、国力の現実を踏まえた合理的な生存戦略とみるかで、この和議とそれを推進した宰相秦檜への評価が今も分かれている。'} },
  { id:"yue_fei", name:"岳飛", category:"person", parentId:"nansong_dynasty", lat:34.8, lng:114.35, start:1103, end:1142, region:"南宋", desc:{background:'靖康の変による北宋滅亡という国家的屈辱への強い義憤が、彼の対金抗戦への献身の背景となった。', process:'南宋軍を率いて金軍相手に度重なる勝利を収め北伐の機運を高めたが、和議を優先する宰相秦檜との対立から「莫須有(あろうことなきにしもあらず)」という曖昧な罪状で投獄され処刑された。', significance:'その悲劇的な最期から「忠義の武将」として後世絶大な尊崇を集め、彼を祀る岳王廟には秦檜夫妻の跪像が置かれ今日まで民衆の怒りの対象とされ続けている中国史上最も愛される英雄の一人である。', debate:'彼を処刑してまで和議を進めた秦檜の判断を、国力の実情を踏まえた現実的な政治判断とみるか、単なる保身のための売国的行為とみるかで、伝統的な忠義史観と近年の実証的再評価との間で議論が続いている。'} },
  { id:"liao_khitan", name:"契丹(遼)", category:"dynasty", lat:44.03, lng:121.08, start:916, end:1125, region:"中国東北・モンゴル高原", desc:{background:'モンゴル高原東部の遊牧民契丹族が、唐末の混乱に乗じて勢力を拡大したことが建国の背景となった。', process:'耶律阿保機が建国し、後晋の建国を支援した見返りに燕雲十六州を獲得、北宋との抗争を経て「澶淵の盟」により宋から歳幣(貢納金)を得る形で長期の平和を築いたが、女真族の金の台頭により1125年に滅ぼされた。', significance:'遊牧的統治(北面官)と農耕地域の中国式統治(南面官)を並存させる二元的統治体制は、以後の征服王朝(金・元・清)の統治モデルの先駆けとなった。', debate:'「澶淵の盟」による宋からの歳幣獲得を、対等な二国間関係を確立した外交的成功とみるか、実質的な宋の弱体化・属国化の兆候とみるかで、宋遼関係の性格づけが論じられる。'} },
  { id:"jin_jurchen", name:"金(女真族)", category:"dynasty", lat:39.9, lng:116.4, start:1115, end:1234, region:"中国華北・東北", desc:{background:'遼の統治下にあった女真族が、その支配への不満から完顔阿骨打のもとで自立を図ったことが建国の背景となった。', process:'遼を滅ぼした後、かつての同盟国北宋にも侵攻して靖康の変を引き起こし華北を征服したが、南宋との対峙状態が続く中、モンゴルの台頭により1234年に南宋との共同作戦もあって滅ぼされた。', significance:'遼の建国からわずか十数年で自立し急速に大帝国を築いた女真族の軍事的躍進は、後の同族(満洲族)による清朝建国のモデルケースともなった。', debate:'金が北宋を滅ぼした後、旧同盟国であった南宋との関係(和議か征服継続か)をめぐる国内の路線対立が、この王朝の対外政策の一貫性のなさにどう影響したかが論じられる。'} },
  { id:"ouyang_xiu", name:"欧陽脩", category:"person", parentId:"beisong_dynasty", lat:34.8, lng:114.35, start:1007, end:1072, region:"北宋", desc:{background:'北宋の文治主義体制のもとで、儒学の復興と古文復興運動(唐宋八大家に代表される簡潔な文体への回帰)が広がっていたことが、彼の学術・文学活動の背景となった。', process:'科挙官僚として政治改革(慶暦の新政)にも関わりつつ、簡潔で力強い古文の文体を確立し、正史『新唐書』『新五代史』の編纂にも携わった。', significance:'唐宋八大家の一人として古文復興運動の中心的指導者となり、その簡潔明瞭な文体は以後の中国散文の規範として長く模範とされ続けた。', debate:'彼が編纂した史書(特に『新五代史』)における厳格な儒教的道徳基準による人物評価(春秋の筆法)が、歴史記述の客観性とどう両立し得るかという史学方法論上の論点が提起される。'} },
  { id:"su_shi", name:"蘇軾(蘇東坡)", category:"person", parentId:"beisong_dynasty", lat:34.8, lng:114.35, start:1037, end:1101, region:"北宋", desc:{background:'王安石の新法をめぐる激しい党争の渦中に身を置き、地方官への左遷・流罪を繰り返し経験したことが、彼の文学・思想の深まりの背景となった。', process:'詩・詞・文・書・画のあらゆる分野で卓越した才能を発揮し、政治的挫折(黄州への左遷など)を通じてかえって達観した人生観に基づく傑作(『赤壁賦』など)を生み出した。', significance:'「万能の文人」として中国文人文化の理想像を体現し、政治的逆境の中でも創作意欲を失わなかったその生き方は、以後の中国知識人にとって精神的な模範となり続けている。', debate:'彼の政治的立場(旧法党でありながら旧法党の一部の過激な姿勢にも批判的であった中間的立場)が、党争という二項対立的な政治状況の中でどう位置づけられるべきかが論じられる。'} },
  { id:"zhu_xi", name:"朱熹(朱子)", category:"person", parentId:"nansong_dynasty", lat:30.27, lng:120.15, start:1130, end:1200, region:"南宋", desc:{background:'北宋期に始まった儒学の哲学的再構築(道学・理学)の流れを集大成する必要性が、彼の学問体系構築の背景となった。', process:'『論語』『孟子』『大学』『中庸』の「四書」を儒学の中心的経典として重視し、「理」と「気」による宇宙論・存在論を体系化した朱子学を確立し、科挙試験の公式解釈として採用されるに至った。', significance:'朱子学は以後中国のみならず朝鮮王朝・江戸日本(林羅山ら)の官学として東アジア全域の政治・社会思想の根幹をなし続け、その影響力は現代に至るまで及んでいる。', debate:'朱子学の厳格な理気二元論的な世界観が、後の陽明学(王陽明)による「心即理」という対抗的な解釈を生み出したことは、儒学内部における合理主義と直観主義の対立軸として東アジア思想史上の重要な論点となっている。'} },
  { id:"woodblock_printing_song", name:"木版印刷・活字印刷の発達", category:"event", lat:34.8, lng:114.35, start:1041, end:1048, region:"北宋", desc:{background:'科挙制度の普及による書籍需要の急増と、経済的繁栄による出版事業への投資余力の増大が、印刷技術発展の背景となった。', process:'木版印刷技術が高度に発達し国家事業としての大蔵経出版などが行われる一方、畢昇による活字印刷(膠泥活字)も発明されたが、漢字の膨大な文字数という制約から木版印刷ほどには普及しなかった。', significance:'この印刷技術の発達により書籍の大量生産・普及が可能となり、科挙受験者層の拡大や学術・文化の広範な普及を促進する、中国における「知識の民主化」の重要な技術的基盤となった。', debate:'活字印刷が漢字文化圏で木版印刷ほど普及しなかった理由(文字数の多さという技術的制約)は、グーテンベルクの活版印刷が西欧で急速に普及した状況との対比で、印刷技術と文字体系の関係を考える比較メディア史上の重要な論点となっている。'} },
  { id:"maritime_trade_song", name:"市舶司と海上交易の発展", category:"event", lat:24.87, lng:118.68, start:960, end:1279, region:"泉州・広州・杭州", desc:{background:'北方の遊牧民国家(遼・金・西夏)との対峙により陸上シルクロードの利用が制約される中、代替的な交易路として海上交易の重要性が高まったことが背景となった。', process:'羅針盤(方位磁針)の実用化と大型ジャンク船の建造技術により、泉州・広州などの港市を拠点に東南アジア・インド洋方面との交易が飛躍的に拡大し、市舶司(海関)による貿易管理制度も整備された。', significance:'この海上交易の発達は「海のシルクロード」の本格的な繁栄をもたらし、中国の陶磁器・絹製品が広く東南アジア・インド洋世界に流通する契機となり、以後の中国海上交易の伝統の基盤を確立した。', debate:'陸上シルクロードから海上交易路への重心移行が、北方民族の圧力という受動的要因によるものか、羅針盤・造船技術という能動的な技術革新によるものかで、この転換の主要因についての評価が分かれる。'} },

  // ===================== モンゴル帝国・元 =====================
  { id:"mongol_empire", name:"モンゴル帝国", category:"nation", lat:47.2, lng:102.85, start:1206, end:1368, region:"モンゴル高原〜ユーラシア全域", relatedIds:["genghis_khan", "ogedei_khan", "kublai_khan"], desc:{background:'モンゴル高原における諸部族間の抗争が続く中、テムジン(チンギス=ハン)が卓越した軍事的・政治的手腕により諸部族を統一したことが建国の背景となった。', process:'十進法に基づく軍事組織と機動力に優れた騎馬軍団により西夏・金・ホラズム=シャー朝を征服し、後継者たちの代にロシア・東欧・中東・中国全土に及ぶ人類史上最大の陸上帝国を築いたが、広大すぎる版図は次第に複数のハン国に分裂していった。', significance:'「パクス=モンゴリカ」と呼ばれる広域的な平和のもとユーラシア規模の交易・文化交流(東西技術の伝播、駅伝制による情報伝達)が活発化し、世界史上初めて東西世界を一つの帝国的秩序のもとに結びつけた画期的な事例である。', debate:'モンゴルの征服・統治を「破壊と殺戮」として否定的に評価する伝統的な見方に対し、近年は「パクス=モンゴリカ」による交易・文化交流の促進という積極的側面を重視するグローバル・ヒストリー的な再評価が進んでいる。'} },
  { id:"genghis_khan", name:"チンギス・ハン", category:"person", parentId:"mongol_empire", lat:47.2, lng:102.85, start:1162, end:1227, region:"モンゴル高原", desc:{background:'幼少期に父を毒殺され部族から見捨てられるという過酷な逆境を生き抜いた経験が、彼の卓越した統率力と実力主義的な組織運営の背景となったとされる。', process:'血縁ではなく能力・忠誠に基づく独自の軍事組織(千戸制)を確立してモンゴル高原の諸部族を統一し、西夏・金・ホラズム=シャー朝への遠征を通じて広大な版図の基礎を築いた。', significance:'血縁的な部族社会から実力主義的な軍事帝国への転換を成し遂げ、彼が確立した統治・軍事システムは子孫たちによる史上最大の陸上帝国建設の礎となった、世界史上最も影響力の大きい征服者の一人である。', debate:'彼の征服戦争における凄惨な破壊・虐殺(特にホラズム=シャー朝征服時)の規模については、当時の史料(特に被征服民側の記録)による誇張の可能性も含め史料批判上の検討が必要である。'} },
  { id:"ogedei_khan", name:"オゴタイ・ハン", category:"person", parentId:"mongol_empire", lat:47.2, lng:102.85, start:1186, end:1241, region:"モンゴル帝国(カラコルム)", desc:{background:'父チンギス=ハンの遺言による指名という正統性を背景に、モンゴル帝国のさらなる拡大と統治体制整備が治世の課題となった。', process:'金を滅ぼして華北を征服する一方、バトゥを西方へ派遣してロシア・東欧への大規模な西征(ヨーロッパ遠征)を成功させ、都カラコルムを建設して帝国の行政基盤を整備した。', significance:'モンゴル帝国の版図を東欧にまで拡大させ、その死去がヨーロッパ遠征軍の帰還(バトゥ軍の撤退)という形でヨーロッパを「モンゴルの脅威」から救ったとされる、世界史上重要な偶然の転機を作った。', debate:'オゴデイの急死がヨーロッパ遠征軍の撤退を招いたという通説について、実際にはすでに遠征の目的(略奪・威力偵察)が一定程度達成されていたため撤退は既定路線であったとする見方もあり、この「if」の歴史的重要性の評価が分かれる。'} },
  { id:"kublai_khan", name:"フビライ・ハン", category:"person", parentId:"yuan_dynasty", lat:39.9, lng:116.4, start:1215, end:1294, region:"元(大都)", desc:{background:'モンケ=ハン死去後の後継争いを勝ち抜き、中国全土の完全征服という祖父チンギス以来の未完の課題実現を志向したことが治世の背景となった。', process:'都を大都(現北京)に定めて中国的な統治体制を積極的に取り入れ、南宋を滅ぼして中国全土を統一し元を建国したが、日本・ベトナム・ジャワへの遠征はいずれも失敗に終わった。', significance:'遊牧民の軍事力と中国の官僚統治システムを融合させた統治モデルを確立し、マルコ=ポーロの旅行記を通じてその繁栄はヨーロッパにも伝えられ大航海時代の東方探求心を刺激する一因ともなった。', debate:'日本への二度の遠征失敗(元寇)の要因を、台風(神風)という偶発的な自然要因に求めるか、そもそも海上遠征という不慣れな作戦への準備不足という構造的要因に求めるかで議論がある。'} },
  { id:"yuan_dynasty", name:"元王朝", category:"dynasty", lat:39.9, lng:116.4, start:1271, end:1368, region:"中国(大都)", relatedIds:["mongol_invasion_japan", "red_turban_rebellion", "yuan_drama"], desc:{background:'フビライ=ハンによる南宋征服という中国全土統一の達成が、この王朝樹立の直接的背景となった。', process:'モンゴル人第一主義に基づく身分制(モンゴル人・色目人・漢人・南人という民族的階層秩序)を敷き、科挙制度を長期間停止するなど中国の伝統的統治慣行とは一線を画す統治を行ったが、この民族的差別構造と紙幣(交鈔)の乱発による経済的混乱への不満が高まり、紅巾の乱を経て1368年に中国本土を放棄しモンゴル高原へ退いた(北元)。', significance:'史上初めて中国全土を異民族が完全に統治した征服王朝として、駅伝制による広域交易網の維持は東西文化交流(マルコ=ポーロの来訪など)を大きく促進したが、その統治期間は約90年と比較的短命に終わった。', debate:'モンゴル人第一主義的な身分制が、この王朝の比較的短命さの主要因であったとする見方に対し、紙幣経済の破綻という経済的要因を重視する見方もあり、この王朝の統治の失敗要因についての評価が分かれる。'} },
  { id:"mongol_invasion_japan", name:"元寇(文永・弘安の役)", category:"war", lat:33.6, lng:130.42, start:1274, end:1281, region:"日本(博多湾)", desc:{background:'フビライ=ハンによる日本への朝貢要求を鎌倉幕府が拒否し続けたことが、この二度にわたる遠征の直接的契機となった。', process:'文永の役(1274年)・弘安の役(1281年)の二度にわたり元・高麗連合軍が九州北部へ来襲したが、いずれも暴風雨(「神風」)による艦隊の壊滅的損害と、日本側の集団戦術への適応もあり撃退に成功した。', significance:'この防衛成功は日本が異民族による征服を免れた重要な歴史的経験として、後世「神国思想」(神風による国土守護という信仰)の形成に決定的な影響を与えたが、恩賞不足への御家人の不満は鎌倉幕府の統治基盤を弱める一因ともなった。', debate:'「神風」という自然現象への過度な強調が、実際の日本側の防衛体制(石塁構築・集団戦術習熟)による軍事的努力を過小評価することにならないか、軍事史的な要因分析のバランスが論じられる。'} },
  { id:"red_turban_rebellion", name:"紅巾の乱", category:"war", lat:33.2, lng:113.0, start:1351, end:1366, region:"中国華中・華南", desc:{background:'元末の紙幣濫発による経済混乱と、モンゴル人優遇の身分制への漢民族の根深い不満が、この大規模反乱の社会的背景となった。', process:'白蓮教という民間宗教結社を母体に紅巾を目印とする反乱勢力が各地で蜂起し、この混乱の中から朱元璋が頭角を現して他の反乱勢力を統合し、最終的に元を北方へ追いやって明を建国した。', significance:'宗教結社を母体とする民衆反乱が最終的に新王朝樹立にまで発展した事例として、白蓮教のような民間信仰が持つ強力な社会的動員力を示す重要な先例となった。', debate:'この反乱の宗教的性格(白蓮教の弥勒下生思想)が、単なる社会経済的不満の表明を超えてどこまで独自の政治的正統性理論を提供したかが論じられる。'} },
  { id:"marco_polo", name:"マルコ・ポーロ", category:"person", parentId:"yuan_dynasty", lat:39.9, lng:116.4, start:1254, end:1324, region:"元(大都)", desc:{background:'ヴェネツィア商人の家系という交易への関心と、モンゴル帝国の広域的な平和(パクス=モンゴリカ)により東西交通が安全になっていたことが、彼の長期旅行を可能にした背景となった。', process:'父・叔父と共に陸路で中国へ渡りフビライ=ハンの宮廷に約17年間仕え、帰国後獄中でその見聞を口述筆記させた旅行記『東方見聞録』が広く流布した。', significance:'この旅行記に描かれた東アジアの繁栄(「黄金の国ジパング」の記述を含む)はヨーロッパ人の東方への憧れを大いに刺激し、コロンブスをはじめとする後の大航海時代の探検者たちに直接的な影響を与えた。', debate:'彼が実際に中国まで到達したのか、それとも中央アジアまでの旅行と伝聞情報を組み合わせて創作した可能性があるのかについて、近年の史料批判研究でも議論が続いている。'} },
  { id:"yuan_drama", name:"元曲(元代演劇)の発展", category:"event", lat:39.9, lng:116.4, start:1234, end:1368, region:"元(大都・杭州)", desc:{background:'元による科挙の長期停止により、伝統的な立身出世の道を断たれた知識人層が、新たな表現の場として演劇創作に活路を見出したことが背景となった。', process:'口語(白話)を用いた台詞と歌唱を組み合わせる雑劇という新たな演劇形式が発展し、関漢卿の『竇娥冤』など社会批判的な内容を含む多くの名作が生み出された。', significance:'中国演劇史上最初の高度に発達した戯曲文学として、後の明清時代の伝奇・京劇にも大きな影響を与え、庶民層への文化的訴求力の高い新たな文学ジャンルを確立した。', debate:'科挙停止という知識人にとっての「不遇」が、かえって新たな文学ジャンル(雑劇)の開花を促したという逆説的な文化史上の現象がどう理解されるべきかが論じられる。'} },

  // ===================== 明・清 =====================
  { id:"ming_dynasty", name:"明王朝", category:"dynasty", lat:39.9, lng:116.4, start:1368, end:1644, region:"中国(南京→北京)", relatedIds:["zheng_he_voyages", "wokou_piracy", "imjin_war", "jingnan_rebellion", "tumu_crisis", "yitiao_bianfa"], desc:{background:'紅巾の乱を通じて頭角を現した朱元璋が、元朝の異民族支配を打倒し漢民族による統治回復を志向したことが建国の背景となった。', process:'朱元璋(洪武帝)が元を北方へ追いやって建国し中央集権的な皇帝独裁体制(宰相制度廃止)を確立、永楽帝の代の鄭和艦隊派遣で国威を高めたが、中期以降は宦官の専横や北方民族(モンゴル・満洲)への対応に苦慮し、内政の腐敗と農民反乱(李自成の乱)により1644年に滅亡した。', significance:'宰相制度を廃止し皇帝への権力集中を極限まで進めた統治体制は中国専制政治の頂点をなし、また万里の長城の現在の姿(煉瓦造りの大規模改修)や紫禁城の建設など、今日に伝わる中国の象徴的建造物の多くがこの時代に築かれた。', debate:'皇帝独裁体制の徹底が、初期の強力な統治を可能にした一方、中期以降の皇帝の資質低下時に統治機構全体を機能不全に陥らせる構造的リスクを内包していたのではないかという評価がある。'} },
  { id:"zhu_yuanzhang", name:"朱元璋(洪武帝)", category:"person", parentId:"ming_dynasty", lat:32.06, lng:118.79, start:1328, end:1398, region:"明(南京)", desc:{background:'貧しい農民出身、さらには一時僧籍にも入るという極めて低い身分からの出発が、紅巾の乱という混乱期における彼の実力主義的な台頭を可能にした。', process:'紅巾軍の一勢力から頭角を現し他の群雄を次々と打倒して元を北方へ追いやり明を建国、猜疑心の強い性格から功臣を大規模に粛清する一方、宰相制度を廃止して皇帝親政体制を確立した。', significance:'劉邦と並び農民出身から皇帝に上り詰めた稀有な事例として、その建国後の徹底した中央集権化・皇帝権力強化策は明清両王朝の専制政治の基本枠組みを決定づけた。', debate:'建国の功臣たちへの大規模な粛清(胡惟庸の獄・藍玉の獄)を、皇帝権力を脅かす潜在的脅威の排除という必要な措置とみるか、過度な猜疑心による理不尽な弾圧とみるかで評価が分かれる。'} },
  { id:"jingnan_rebellion", name:"靖難の変", category:"war", lat:32.06, lng:118.79, start:1399, end:1402, region:"明(南京・北平)", desc:{background:'洪武帝の死後、若い建文帝が有力な諸侯王である叔父たちの勢力削減(削藩)を急速に進めようとしたことが、この内乱の直接的契機となった。', process:'北方に藩王として封じられていた燕王朱棣(後の永楽帝)が「君側の奸を除く」との名目で挙兵し、数年に及ぶ内戦の末に都南京を陥落させ、建文帝は行方不明となった(生存説も伝わる)。', significance:'この内乱により永楽帝という積極的な対外政策を推進する強力な統治者が誕生し、鄭和の大航海など明初の対外的な威信誇示事業の直接的な出発点となった。', debate:'建文帝の最終的な運命(焼死説・逃亡生存説)については史料的に確定しておらず、この不確実性が永楽帝の統治の正統性を巡る後世の言説にも影響を与え続けている。'} },
  { id:"yongle_emperor", name:"永楽帝", category:"person", parentId:"ming_dynasty", lat:39.9, lng:116.4, start:1360, end:1424, region:"明(北京)", desc:{background:'靖難の変での実力による帝位奪取という正統性の弱さを補うため、対外的な威信誇示を通じた統治の正当化を志向したことが治世の背景となった。', process:'鄭和による大艦隊派遣(南海遠征)を通じて朝貢体制を東南アジア・インド洋沿岸にまで拡大し、モンゴルへの親征や首都の北京遷都、大規模な百科事典『永楽大典』編纂などの大事業を次々と推進した。', significance:'明朝の対外的な威信と国力を頂点に押し上げた統治者として、鄭和の大航海は当時世界最大規模の海洋事業であり、この積極的な対外拡張路線は永楽帝一代限りの特異な現象として際立っている。', debate:'彼の死後、後継の皇帝たちが積極的な対外政策(大航海事業)を継続せず内向きの海禁政策へ転じた背景に、この事業の巨大な財政負担への反省があったのか、それとも単に永楽帝個人の対外拡張志向が特異であったのかが論じられる。'} },
  { id:"zheng_he_voyages", name:"鄭和の南海大遠征", category:"event", lat:32.06, lng:118.79, start:1405, end:1433, region:"東南アジア〜インド洋・東アフリカ", desc:{background:'永楽帝が国威発揚と朝貢体制の拡大、あるいは行方不明の建文帝の捜索という複合的な目的を持って、大規模な海洋遠征を計画したことが背景となった。', process:'宦官鄭和が指揮する数百隻・数万人規模の大艦隊が7次にわたり東南アジア・インド洋を航海し、遠くアフリカ東岸にまで到達して各地の朝貢関係を拡大したが、永楽帝死後は財政負担への批判からこの事業は打ち切られ、以後明は内向きの海禁政策へ転じた。', significance:'ヴァスコ=ダ=ガマのインド到達より半世紀以上早く、規模でも遥かに凌駕するこの大航海は、当時の中国の卓越した造船・航海技術を示すが、この事業が継続されなかったことは「機会の逸失」として世界史上しばしば議論される。', debate:'この大航海が打ち切られ海禁政策へ転換したことが、その後の中国の海洋進出における立ち遅れと西欧の大航海時代による世界的優位確立とを分けた歴史の重要な分岐点であったとする「大分岐」論的な視点がしばしば提示される。'} },
  { id:"wokou_piracy", name:"倭寇", category:"event", lat:29.87, lng:121.54, start:1350, end:1588, region:"中国・朝鮮沿岸", desc:{background:'明の海禁政策により正規の交易が制限される中、密貿易と結びついた武装集団(倭寇)が中国・朝鮮沿岸で活発化したことが背景となった。', process:'当初は日本人を中心とする海賊集団であったが、明代中期以降は中国人密貿易商人が主体となる「後期倭寇」へと性格を変え、江南沿岸で深刻な被害をもたらしたが、名将戚継光らによる軍事的鎮圧と海禁政策の緩和(隆慶開関)により終息した。', significance:'この現象は明の硬直的な海禁政策が、かえって非合法な密貿易・海賊行為を助長するという政策の意図せざる結果を示す事例であり、最終的な海禁緩和は東アジア海域における交易秩序の転換点となった。', debate:'「倭寇」の民族構成(日本人主体か中国人主体か)については時期により実態が大きく異なり、この呼称自体が実態を正確に反映しているかどうかについて、東アジア海域史研究上の重要な検討課題となっている。'} },
  { id:"tumu_crisis", name:"土木の変", category:"war", lat:40.1, lng:115.6, start:1449, end:1449, region:"明(土木堡・河北)", desc:{background:'北方のモンゴル系オイラト部との朝貢貿易をめぐる緊張が高まる中、宦官王振の専横により不用意な親征が強行されたことが、この事変の直接的背景となった。', process:'皇帝英宗自らが親征した明軍がオイラトの也先率いる軍に土木堡で包囲され壊滅的な敗北を喫し、皇帝自身が捕虜となるという前代未聞の事態に至った。', significance:'この事変は明の軍事的優位の終焉を象徴する出来事となり、以後明は北方防衛のため万里の長城の大規模な改修・強化(現在に伝わる煉瓦造りの長城の多くはこの時期以降のもの)に注力するようになった。', debate:'この危機に際し北京で新帝(景泰帝)を擁立し抗戦を主導した于謙の決断は、皇帝の身柄を人質にとられた国家がいかに統治の継続性を保つべきかという、前近代国家における「皇帝不在時の統治」の問題を考える重要な事例となっている。'} },
  { id:"wang_yangming", name:"王陽明(王守仁)", category:"person", parentId:"ming_dynasty", lat:30.0, lng:120.6, start:1472, end:1529, region:"明(浙江)", desc:{background:'朱子学の理気二元論的な世界観への疑問と、実際の地方統治・軍事指揮の経験を通じた実践的な知への関心が、彼の独自思想形成の背景となった。', process:'左遷先の貴州の山中での思索(「竜場の悟り」)を経て「心即理」(道理は外部の事物にではなく自らの心に内在する)と「知行合一」を核心とする陽明学を確立し、地方反乱の鎮圧でも実務家として卓越した手腕を発揮した。', significance:'朱子学の権威的な体制教学に対する内発的な批判として陽明学を確立し、この思想は後の日本の幕末志士(大塩平八郎・吉田松陰ら)にも大きな影響を与えるなど、東アジア思想史における重要な対抗的潮流となった。', debate:'陽明学の「知行合一」思想が、既存の社会秩序への従順な適応を説く朱子学に比べより行動主義的・革新的な性格を持つとされることから、この思想と後世の政治的急進主義・革命運動との親和性がしばしば論じられる。'} },
  { id:"yitiao_bianfa", name:"一条鞭法", category:"event", lat:39.9, lng:116.4, start:1581, end:1581, region:"明", desc:{background:'明中期における税制の複雑化・不公正(郷紳層による脱税と農民への負担集中)への対応が、この税制改革の背景となった。', process:'宰相張居正の主導により、複雑化していた各種の税・労役を銀納の単一税に統合する改革を実施し、当時世界的に流通していた新大陸産の銀(メキシコ銀など)の流入とも連動して銀経済化を促進した。', significance:'この税制の簡素化・銀納化は中国経済のグローバルな銀経済への統合を促進し、以後の清代の税制(地丁銀制)にも継承される重要な財政改革であった。', debate:'この改革が新大陸銀の大量流入という当時のグローバルな銀の流れとどう連動していたか、中国経済の「銀への依存」がその後の経済的脆弱性(銀流入停止時の経済混乱)にどうつながったかが世界経済史の観点から論じられる。'} },
  { id:"li_shizhen", name:"李時珍", category:"person", parentId:"ming_dynasty", lat:30.5, lng:113.8, start:1518, end:1593, region:"明(湖広)", desc:{background:'医師の家系に生まれ、既存の本草書(薬物書)の記述の不正確さ・不備を実地調査を通じて痛感したことが、彼の大著述事業の背景となった。', process:'各地を実地調査し薬物の効能・産地・製法を検証しながら約27年をかけて薬物学の集大成『本草綱目』を完成させ、1892種の薬物を分類体系的に記述した。', significance:'この著作は東アジアにおける本草学(薬物学)の最高到達点として、後に日本・朝鮮にも伝わり広く活用され、近代科学的な分類・実証精神の萌芽を示す前近代科学史上の重要な達成と評価される。', debate:'『本草綱目』における分類体系や実証的な検証姿勢が、西欧の同時代の博物学とどこまで類似した科学的方法論を示しているか、東西の科学史における比較研究上の関心事となっている。'} },
  { id:"matteo_ricci", name:"マテオ・リッチ(利瑪竇)", category:"person", parentId:"ming_dynasty", lat:39.9, lng:116.4, start:1552, end:1610, region:"明(北京)", desc:{background:'イエズス会の中国布教方針(現地文化への適応=適応主義)のもと、中国知識人層への布教のためには彼らの学問的関心に応える必要があるという戦略的判断が背景となった。', process:'中国語・儒教古典を深く学び、西洋の科学知識(世界地図・天文学・数学)を紹介することで中国知識人層の信頼と関心を獲得し、徐光啓ら有力官僚との交流を通じてキリスト教布教と西洋科学の紹介を並行して進めた。', significance:'彼が作成した漢文世界地図(『坤輿万国全図』)は中国人の世界認識を大きく広げ、ユークリッド幾何学の漢訳(徐光啓との共訳)は西洋数学の本格的な中国への導入という画期的な文化交流事業となった。', debate:'彼の「適応主義」的布教戦略(祖先崇拝・孔子崇拝を偶像崇拝とみなさず容認する立場)は後にローマ教皇庁との間で「典礼問題」という深刻な神学論争を引き起こし、この対立は最終的に中国におけるキリスト教布教の大幅な制限を招く一因ともなった。'} },
  { id:"xu_guangqi", name:"徐光啓", category:"person", parentId:"ming_dynasty", lat:31.23, lng:121.47, start:1562, end:1633, region:"明(上海)", desc:{background:'マテオ=リッチとの交流を通じて西洋科学の合理性・実用性に強い感銘を受けたことが、彼の西洋学問受容への積極的姿勢の背景となった。', process:'リッチと共同でユークリッド『幾何学原本』を漢訳し、農業技術・水利事業に関する実学的な大著『農政全書』を編纂する一方、自身もキリスト教に入信し中国人としては最高位の官職にまで昇進した。', significance:'西洋科学と中国の伝統的実学とを架橋する先駆的な知識人として、彼の翻訳・著述事業は「西学東漸」(西洋学問の東方伝来)の最初期における最も重要な達成の一つと位置づけられる。', debate:'高位官僚でありながらキリスト教に入信したという事実が、当時の中国知識人社会における思想的開放性・多様性をどこまで示しているか、あるいは彼が例外的存在であったのかが論じられる。'} },
  { id:"qing_dynasty", name:"清王朝", category:"dynasty", lat:39.9, lng:116.4, start:1636, end:1912, region:"中国(北京)", relatedIds:["nurhaci", "kangxi_emperor", "qianlong_emperor", "opium_war", "taiping_rebellion", "second_opium_war", "sino_japanese_war", "boxer_rebellion", "xinhai_revolution", "sanfan_rebellion", "treaty_of_nerchinsk", "diding_yinzhi", "kaozhengxue", "honglou_meng", "yangwu_movement", "wuxu_reform", "tongmenghui", "abolition_of_keju"], desc:{background:'満洲族のヌルハチが女真諸部族を統一し、明の内部混乱(李自成の乱)に乗じて中国進出の機会を得たことが建国の背景となった。', process:'呉三桂の手引きにより山海関を越えて北京を制圧し中国全土を征服、満洲族独自の統治(八旗制)と中国的な官僚制度を併用する二重統治体制のもとで康熙・雍正・乾隆の三代(「康乾盛世」)に最盛期の版図と繁栄を築いたが、19世紀にはアヘン戦争を機に西欧列強の侵略を受け半植民地化が進み、1911年の辛亥革命により1912年に滅亡した。', significance:'中国史上最後の統一王朝として、現在の中国の領土的基盤(モンゴル・チベット・新疆・台湾を含む広大な版図)の多くはこの王朝の征服事業によって確立された。', debate:'満洲族という少数民族が多数派漢民族を約270年にわたり統治し得た要因を、巧みな統治政策(科挙継続・満漢併用制)に求めるか、征服直後の徹底した武力弾圧(辮髪強制・揚州虐殺)による恐怖支配に求めるかで評価が分かれる。'} },
  { id:"nurhaci", name:"ヌルハチ", category:"person", parentId:"qing_dynasty", lat:41.8, lng:123.43, start:1559, end:1626, region:"後金(瀋陽)", desc:{background:'女真族内部の部族間抗争の中、父祖の仇討ちを名目に勢力拡大を開始したことが建国の背景となった。', process:'女真諸部族を統一して独自の軍事・行政組織(八旗制)を創設し、満洲文字を制定するなど民族的アイデンティティの制度的基盤を確立し、後金を建国して明への攻勢を開始した。', significance:'満洲族(後の清)による中国統治の基礎を築いた建国者として、彼が確立した八旗制は清朝約270年の統治の根幹的な軍事・社会組織であり続けた。', debate:'彼が確立した八旗制という軍事組織が、征服王朝としての満洲族の民族的アイデンティティ維持と中国統治の効率性という二つの目的をどこまで両立させ得たかが、清朝統治史における重要な論点である。'} },
  { id:"kangxi_emperor", name:"康熙帝", category:"person", parentId:"qing_dynasty", lat:39.9, lng:116.4, start:1654, end:1722, region:"清", desc:{background:'幼少での即位という不安定な状況の中、三藩の乱という国内的な軍事的危機の克服が治世前半の課題となった。', process:'三藩の乱を鎮圧して国内統治を安定させ、ロシアとの間で対等な国境画定条約(ネルチンスク条約)を締結、学術振興(『康熙字典』編纂)にも尽力し60年以上に及ぶ長期の安定統治を実現した。', significance:'「康乾盛世」と呼ばれる清朝最盛期の礎を築いた統治者として、西洋の科学技術(イエズス会宣教師を通じた暦法・測量術)への高い関心を示すなど、開明的な統治姿勢でも知られる。', debate:'西洋の学問技術への積極的な関心を示しながらも、後継の雍正・乾隆期にはキリスト教布教規制が強化されていったことから、この開明性がどこまで持続的な政策として制度化されたかが論じられる。'} },
  { id:"qianlong_emperor", name:"乾隆帝", category:"person", parentId:"qing_dynasty", lat:39.9, lng:116.4, start:1711, end:1799, region:"清", desc:{background:'祖父康熙帝・父雍正帝が築いた強固な統治基盤の上に、さらなる版図拡大と文化的威信の誇示を志向したことが治世の背景となった。', process:'ジュンガル部を征服して新疆・チベット方面まで版図を拡大し清朝最大版図を実現する一方、大規模な文化事業(『四庫全書』編纂)を推進したが、同時に反体制的とみなされた書物を弾圧する「文字の獄」も行い、晩年は寵臣和珅の専横と財政腐敗が進行した。', significance:'清朝の最盛期(版図・人口・経済規模のいずれも頂点)を体現する統治者であったが、彼の晩年からすでに始まっていた統治の弛緩・腐敗は、次代以降の急速な清朝衰退の伏線となった。', debate:'「十全老人」を自称した彼の治世を「絶頂期」と評価する伝統的な見方に対し、近年はその晩年における統治の弛緩(和珅の専横・人口爆発による社会的圧力の増大)を重視し、すでに衰退の兆候が始まっていたとする見方が有力になっている。'} },
  { id:"sanfan_rebellion", name:"三藩の乱", category:"war", lat:25.0, lng:102.7, start:1673, end:1681, region:"清(雲南・広東・福建)", desc:{background:'清が中国征服に協力した漢人武将(呉三桂ら)に南方の広大な領地を藩王として封じていたことが、その後の中央集権化との対立を招く構造的な背景となった。', process:'康熙帝による藩の削減政策(撤藩)への反発から呉三桂ら三藩が反乱を起こし一時清朝の存続を脅かすほどの勢いを見せたが、最終的に鎮圧され清朝の中央集権的統治体制が確立された。', significance:'この反乱鎮圧により清朝の中国支配は名実ともに確定し、以後は満洲族による安定した長期統治(康乾盛世)への道が開かれた重要な転換点となった。', debate:'征服協力者への大幅な自治権付与という当初の妥協的統治方針が、なぜ長期的には深刻な内乱の火種となったのか、征服王朝における協力者への処遇のあり方をめぐる統治上の教訓が論じられる。'} },
  { id:"treaty_of_nerchinsk", name:"ネルチンスク条約", category:"treaty", lat:51.99, lng:116.55, start:1689, end:1689, region:"清・ロシア国境(ネルチンスク)", desc:{background:'清とロシアがアムール川流域の領有をめぐり軍事的に対峙する中、双方とも他の対外的課題(清は南方、ロシアは西方)を優先したい事情があったことが背景となった。', process:'イエズス会宣教師の通訳・仲介のもとラテン語を公用語とする交渉が行われ、外興安嶺(スタノヴォイ山脈)を国境と定める条約が締結された。', significance:'中国が西洋式の国際法の概念(対等な主権国家間の条約)に基づいて締結した最初の条約として、東アジアの伝統的な冊封・朝貢体制とは異なる新たな国際関係の枠組みを示す画期的な事例である。', debate:'この条約を清がロシアと「対等」に締結し得た事例として積極的に評価する見方と、その後の清が結局伝統的な華夷秩序観から脱却できず19世紀の西欧列強との不平等条約締結を招いたこととの連続性・断絶性が論じられる。'} },
  { id:"diding_yinzhi", name:"地丁銀制", category:"event", lat:39.9, lng:116.4, start:1712, end:1735, region:"清", desc:{background:'人口増加と土地保有の実態把握の困難さが、従来の人頭税(丁銀)徴収の非効率性・不公正さを深刻化させていたことが、この改革の背景となった。', process:'雍正帝の代に本格的に実施され、従来別々に徴収されていた人頭税(丁銀)を土地税(地銀)に組み込んで一本化し、土地を持たない貧困層の税負担を実質的に軽減した。', significance:'この改革により人頭税という前近代中国の伝統的な税制原理が事実上終焉し、以後の中国税制は資産(土地)を基準とする体系へと完全に移行する画期的な財政制度改革となった。', debate:'人頭税廃止が人口把握への行政的インセンティブを弱め、結果として正確な人口統計の作成をかえって困難にしたのではないかという、統治技術上の意図せざる副作用が指摘されることがある。'} },
  { id:"kaozhengxue", name:"考証学の興隆", category:"event", lat:39.9, lng:116.4, start:1644, end:1800, region:"清", desc:{background:'明末清初の政治的混乱への反省から、宋明理学の観念的な思弁を批判し、より実証的・文献学的な学問へ回帰しようとする知的潮流が背景となった。', process:'経書の文献学的・音韻学的な厳密な考証を重視する学問方法論が発展し、清朝の文字の獄による思想統制も影響して、政治的に安全な文献考証・古典研究へ学者の関心が集中する傾向を強めた。', significance:'この実証的な学問手法は近代的な文献学・言語学の先駆的な達成として高く評価され、清代の学術における最も特徴的で生産的な知的営為の一つとなった。', debate:'この考証学への傾倒が、純粋な学問的発展の帰結か、それとも文字の獄という政治的抑圧下での「安全な」学問領域への逃避という側面を強く持っていたかについて、清代思想史上の評価が分かれる。'} },
  { id:"honglou_meng", name:"紅楼夢", category:"event", lat:39.9, lng:116.4, start:1754, end:1791, region:"清(北京)", desc:{background:'清朝中期の貴族社会の繁栄と没落という作者曹雪芹自身の家系の実体験が、この作品の題材・世界観形成の背景となったとされる。', process:'賈家という貴族の大家族の日常生活・恋愛・没落を精緻な人物描写と詩情豊かな文体で描き、儒教的な建前の背後にある人間関係の機微や女性たちの繊細な内面を克明に描写した。', significance:'中国古典小説の最高峰と評される作品として、その精緻な心理描写と社会批評性は後世「紅学」と呼ばれる専門的な研究分野を生み出すほどの学術的関心を集め続けている。', debate:'未完に終わった作品の後半部分(高鶚による補作とされる)が、曹雪芹自身の本来の構想をどこまで正確に反映しているかについて、テキスト成立史上の重要な論争が今も続いている。'} },
  { id:"opium_war", name:"アヘン戦争", category:"war", lat:23.13, lng:113.26, start:1840, end:1842, region:"清(広州)", desc:{background:'イギリスが対中貿易赤字を解消するためインド産アヘンを中国へ密輸出し、これによる中国国内のアヘン中毒蔓延と銀の国外流出が深刻な社会問題となっていたことが背景となった。', process:'欽差大臣林則徐によるアヘン没収・廃棄を機にイギリスが開戦し、近代的な軍事技術(蒸気船・近代火器)を持つイギリス軍が旧式装備の清軍を圧倒し、南京条約により香港島割譲・上海など5港の開港・多額の賠償金支払いを強いられた。', significance:'この敗北を機に清は西欧列強との一連の不平等条約体制に組み込まれ、以後100年に及ぶ中国の「半植民地化」の時代(「屈辱の世紀」)が始まる決定的な画期となった。', debate:'この戦争を「アヘン密輸という不道徳な貿易を強行するための帝国主義的侵略戦争」と評価する見方が国際的に広く共有される一方、当時のイギリス側は「自由貿易の正当な擁護」という論理で正当化しており、この評価の対立は帝国主義の道義的評価をめぐる典型的な論争となっている。'} },
  { id:"second_opium_war", name:"アロー戦争(第二次アヘン戦争)", category:"war", lat:23.13, lng:113.26, start:1856, end:1860, region:"清(広州・北京)", desc:{background:'南京条約後もイギリスが求める貿易のさらなる自由化(内陸部への開放・アヘン貿易の合法化)が満たされないことへの不満が、この戦争の背景となった。', process:'アロー号事件を口実にイギリス・フランス連合軍が出兵し北京を占領、円明園の略奪・破壊という文化的破壊行為を行い、天津条約・北京条約により さらなる開港・キリスト教布教の自由・アヘン貿易の合法化を認めさせた。', significance:'円明園の破壊は中国近代史における最も象徴的な文化的屈辱の記憶として現在まで語り継がれ、この戦争を機に清朝内部でも洋務運動という近代化改革への機運が高まる契機ともなった。', debate:'円明園破壊という行為を、当時の交渉における人質・捕虜への虐待への報復措置として正当化する当時の英仏側の論理と、貴重な文化遺産への不当な破壊行為とみる中国側の評価との間で、この事件の道義的評価が対立している。'} },
  { id:"taiping_rebellion", name:"太平天国の乱", category:"revolution", lat:32.06, lng:118.79, start:1851, end:1864, region:"清(南京)", relatedIds:["hong_xiuquan"], desc:{background:'アヘン戦争後の重税と社会不安、そしてキリスト教の影響を受けた洪秀全独自の宗教思想(自らをイエスの弟と称する)が、この大規模反乱の背景となった。', process:'「滅満興漢」を掲げ土地の均分など急進的な社会改革を志向する太平天国を樹立し南京を都に一時は中国南部の広範囲を制圧したが、内部の権力闘争(天京事変)による弱体化と、曾国藩・李鴻章ら漢人官僚が組織した郷勇(義勇軍)による鎮圧を受け、14年に及ぶ内戦の末1864年に鎮圧された。', significance:'推定2000万人以上ともされる犠牲者を出した19世紀最大級の内戦として清朝の統治基盤を大きく揺るがし、この鎮圧を通じて台頭した漢人官僚(曾国藩・李鴻章ら)の勢力拡大は、後の洋務運動や清朝末期の地方軍事化の重要な起点となった。', debate:'この反乱を「農民革命運動の先駆」として肯定的に評価する中国共産党史観と、キリスト教的異端思想に基づく破壊的な内乱として否定的に評価する見方との間で、政治的立場によって評価が大きく異なる。'} },
  { id:"hong_xiuquan", name:"洪秀全", category:"person", parentId:"taiping_rebellion", lat:32.06, lng:118.79, start:1814, end:1864, region:"太平天国(南京)", desc:{background:'科挙に度重なる失敗を経験し、その挫折の中で得た宗教的啓示体験(自らをイエスの弟とする幻視)が、彼の独自の宗教思想確立の背景となった。', process:'キリスト教の教えを独自に解釈した「拝上帝会」を組織して信者を集め、土地の均分と男女平等を掲げる太平天国を樹立して天王を称したが、南京占領後は宗教的な神秘主義に耽り実務を側近に委ねる中、内部の権力闘争(天京事変)を招き、最終的な鎮圧の中で病死した。', significance:'キリスト教という外来宗教の中国的変容による独自の千年王国的運動として、その急進的な社会改革理念(男女平等・土地均分)は中国近代史における最初期の革命的社会思想の先駆けとされる。', debate:'彼の思想を「本格的なキリスト教信仰」とみるか「伝統的な中国民間宗教の千年王国思想にキリスト教の衣をまとわせただけ」とみるかについて、比較宗教学上の評価が分かれる。'} },
  { id:"zeng_guofan", name:"曾国藩", category:"person", parentId:"qing_dynasty", lat:32.06, lng:118.79, start:1811, end:1872, region:"清(湖南・南京)", desc:{background:'太平天国の急速な拡大に対し既存の八旗・緑営という正規軍が有効に機能しなかったことが、地方官僚による独自の義勇軍組織(湘軍)結成の背景となった。', process:'郷里湖南で組織した湘軍を率いて太平天国鎮圧の中心的役割を果たし、この功績を背景に洋務運動(西洋技術導入による富国強兵)の推進者としても活動した。', significance:'清朝の正規軍に代わる地方義勇軍が国家の存亡を左右する主力となったこの経験は、以後の清末における地方軍事力の台頭(督撫の実権拡大)という構造的変化の出発点となった。', debate:'彼が率いた地方義勇軍(湘軍)の台頭が、中央政府の軍事的統制力を長期的に弱め、清朝崩壊後の軍閥割拠状況の遠因となったのではないかという、権力の地方分散化の歴史的帰結が論じられる。'} },
  { id:"li_hongzhang", name:"李鴻章", category:"person", parentId:"qing_dynasty", lat:39.9, lng:116.4, start:1823, end:1901, region:"清(北京・天津)", desc:{background:'太平天国鎮圧における淮軍組織の実績と、曾国藩の後継者としての地位確立が、彼の洋務運動における主導的役割の背景となった。', process:'西洋式の軍需工業・海軍(北洋艦隊)建設を推進する洋務運動の中心的推進者として活動したが、日清戦争での北洋艦隊壊滅という壊滅的敗北を経験し、下関条約の交渉という屈辱的な役割も担うこととなった。', significance:'清末における最も有力な地方実力者・外交官として、その洋務運動の限界(制度改革を伴わない技術導入にとどまったこと)は日清戦争敗北という形で露呈し、より根本的な政治改革の必要性を痛感させる契機となった。', debate:'洋務運動全体を「器物のみの近代化にとどまり政治制度の改革を欠いた不徹底な近代化」と評価する見方が広く共有されているが、当時の政治的制約(保守派の抵抗)の中でどこまでの改革が現実的に可能であったかという弁護的な視点も存在する。'} },
  { id:"yangwu_movement", name:"洋務運動", category:"event", lat:39.9, lng:116.4, start:1861, end:1895, region:"清", desc:{background:'アロー戦争・太平天国という二重の危機を経験した清朝が、西洋の軍事技術の圧倒的優位を痛感したことが、この改革運動の背景となった。', process:'「中体西用」(中国の伝統的な政治・倫理制度を維持しつつ西洋の技術のみを導入する)という理念のもと、軍需工場・造船所の設立や近代的海軍(北洋艦隊)の建設を進めたが、政治制度そのものの改革には踏み込まなかった。', significance:'この運動により一定の近代的軍事工業基盤が築かれたが、その限界は日清戦争での壊滅的敗北によって露呈し、以後より根本的な政治制度改革(変法運動)を求める機運を高める契機となった。', debate:'「中体西用」という理念自体が、技術と制度を分離できるという前提に立っていたことが、この近代化運動の根本的な限界であったとする見方が広く共有されており、日本の明治維新(制度改革も含む包括的近代化)との対比でしばしば論じられる。'} },
  { id:"sino_japanese_war", name:"日清戦争", category:"war", lat:38.9, lng:121.6, start:1894, end:1895, region:"朝鮮・清(遼東半島)", relatedIds:["donghak_peasant_revolution"], desc:{background:'朝鮮半島における清・日両国の勢力争いと、日本の朝鮮への影響力拡大を目指す積極政策が、この戦争の背景となった。', process:'朝鮮の東学党の乱への出兵を機に開戦し、近代化改革(明治維新)を経た日本軍が洋務運動にとどまっていた清軍を陸海両面で圧倒し、下関条約により台湾・遼東半島(後に三国干渉で返還)の割譲と朝鮮の独立(清の宗主権否定)を認めさせた。', significance:'この敗北は洋務運動という技術偏重の近代化の限界を決定的に露呈させ、より根本的な政治制度改革(変法運動)への機運を一気に高めるとともに、東アジアにおける中国中心の伝統的な国際秩序(冊封体制)の実質的な終焉を意味した。', debate:'この戦争の帰趨を分けた要因を、日本の徹底した近代化改革(明治維新の包括性)に求めるか、清朝内部の政治的分裂(李鴻章の淮軍が事実上孤立して戦った)に求めるかで、比較近代化論の観点から議論される。'} },
  { id:"boxer_rebellion", name:"義和団事件", category:"event", lat:39.9, lng:116.4, start:1899, end:1901, region:"清(北京)", desc:{background:'列強による中国分割の進展とキリスト教布教の拡大への民衆の反発、そして義和団という排外的な民間武術結社の台頭が、この事変の背景となった。', process:'「扶清滅洋」を掲げる義和団が各地で外国人・キリスト教徒を襲撃し、これを保守派官僚が支持して外国公使館を包囲する事態にまで発展したが、8か国連合軍の軍事介入により鎮圧され、北京議定書により巨額の賠償金と外国軍隊の北京駐留権を認めさせられた。', significance:'この事変とその後の巨額賠償金・列強駐留権の受諾は清朝の権威を決定的に失墜させ、以後の清朝は保守派主導ながらも新政と呼ばれる本格的な近代化改革(科挙廃止・立憲準備)へと転じざるを得なくなった。', debate:'義和団を「排外的で非合理な迷信集団」と否定的に評価する見方と「帝国主義的侵略への民衆的な抵抗運動の一形態」として再評価する見方との間で、ナショナリズム的な歴史観の変遷とともに評価が大きく変化してきた。'} },
