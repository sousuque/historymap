  { id:"haitian_revolution", name:"ハイチ革命", category:"revolution", lat:18.59, lng:-72.31, start:1791, end:1804, region:"ハイチ(サン=ドマング)", relatedIds:["republic_of_haiti"], desc:{background:'フランス革命の「自由・平等」理念が、サン=ドマングの奴隷たちに自らの解放を求める思想的正当性を与えたことが、大規模蜂起の背景となった。', process:'トゥーサン・ルーヴェルチュールらが指導した奴隷たちの大規模な蜂起に始まり、ナポレオンが派遣した鎮圧軍を撃退して1804年に世界初の黒人共和国として独立を達成した。', significance:'史上唯一成功した大規模な奴隷反乱として世界史上特筆され、この革命はフランスにルイジアナ売却を決断させる一因ともなり、また周辺の奴隷制社会に大きな衝撃と警戒を与えた。', debate:'この革命が「自由・平等」を掲げたフランス革命自身の理念の帰結であったにもかかわらず、フランス(および他の奴隷制国家)がハイチを長期にわたり国際的に孤立させ賠償金を強いた経緯は、西洋の「普遍的理念」の適用における人種的二重基準を示す事例として批判的に論じられる。'} },
  { id:"republic_of_haiti", name:"ハイチ共和国", category:"nation", lat:18.59, lng:-72.31, start:1804, end:2030, region:"ハイチ(ポルトープランス)", desc:{background:'奴隷反乱という前例のない手段による建国であったことが、他の奴隷制国家からの強い警戒と国際的孤立を招く構造的背景となった。', process:'独立の代償としてフランスへ「独立賠償金」の支払いを長期にわたり強いられ(2000年代まで実質的な負担が続いたとされる)、これが慢性的な財政難と低開発の一因になったと指摘されている。20世紀にはアメリカによる占領(1915-34年)やデュヴァリエ父子の独裁を経験し、たびたびの政変・自然災害(2010年大地震など)にも見舞われた。', significance:'世界初の黒人共和国という歴史的偉業にもかかわらず西半球最貧国の一つとされる困難な国家運営が続いており、独立時の「代償」がその後の発展にどう影響したかを考える上で重要な事例となっている。', debate:'「独立賠償金」がハイチの慢性的貧困の主因であるとする近年の有力な見方(2022年のニューヨーク・タイムズ紙による大規模調査報道なども)に対し、フランスは公式な謝罪や返還にはまだ応じておらず、植民地清算・賠償責任論の重要な現在進行形の論点となっている。'} },

  // ===================== キューバ =====================
  { id:"spanish_colonial_cuba", name:"スペイン領キューバ", category:"nation", lat:23.13, lng:-82.38, start:1511, end:1898, region:"キューバ(ハバナ)", relatedIds:["spanish_american_war_cuba"], desc:{background:'カリブ海の他のスペイン植民地が次々と独立する19世紀初頭においても、キューバがスペインにとって重要な砂糖生産植民地であり続けたことが、長期の植民地支配継続の背景となった。', process:'ハバナを拠点にスペインが約400年にわたり統治し、サトウキビ・プランテーションと奴隷労働に依存する経済構造を持ったが、19世紀後半には独立を求める十年戦争(1868-78年)やホセ・マルティらが率いた独立戦争(1895年-)が続き、1898年の米西戦争でアメリカが介入しスペインの支配は終焉した。', significance:'ラテンアメリカ大陸諸国が1820年代までに独立を達成した後も、キューバはスペイン最後の主要植民地として約半世紀遅れて独立を迎えており、この「遅れた独立」の背景要因は比較植民地史上の重要な検討対象である。', debate:'キューバの独立が遅れた要因を、砂糖経済における奴隷制依存の強さ(独立が奴隷解放と直結することへの地主層の恐れ)に求めるか、スペインにとっての「最後の海外領土」としての執着に求めるかで議論がある。'} },
  { id:"spanish_american_war_cuba", name:"米西戦争(キューバ)", category:"war", lat:20.02, lng:-75.83, start:1898, end:1898, region:"キューバ(サンティアゴ・デ・クーバ)", desc:{background:'キューバ独立戦争へのアメリカ世論の同情の高まりと、戦艦メイン号爆沈事件という直接的な引き金が、アメリカの参戦を後押しした。', process:'アメリカがスペインと開戦し、サンティアゴ湾の海戦でスペイン艦隊が壊滅し短期間でアメリカが勝利、パリ条約によりスペインはキューバの独立を承認した。', significance:'実際にはアメリカがプラット修正条項により内政・外交に強い介入権を留保し、キューバは事実上の保護国として出発することとなった、独立戦争の成果が第三国の介入により変質した典型例である。', debate:'この戦争を「キューバ解放のための人道的介入」とみるか「アメリカによるカリブ海覇権確立のための帝国主義的機会主義」とみるかで、アメリカの対外政策史における評価が分かれる。'} },
  { id:"cuban_republic_1902", name:"キューバ共和国(革命前)", category:"nation", lat:23.13, lng:-82.38, start:1902, end:1959, region:"キューバ(ハバナ)", relatedIds:["batista_dictatorship"], desc:{background:'米西戦争後のパリ条約によりスペイン支配は終焉したものの、アメリカが憲法にプラット修正条項を組み込ませたことが、名目的独立と実質的従属の二重構造を生んだ。', process:'アメリカの軍事介入権(グアンタナモ基地の租借を含む)を認めさせられるなど経済・政治両面でアメリカへの強い従属が続き、砂糖モノカルチャー経済のもとで観光・娯楽産業も発展したが、政治腐敗と貧富の格差が深刻化し1959年のキューバ革命により体制は終焉した。', significance:'「独立国家でありながら実質的にはアメリカの保護領」という状況は、20世紀の「新植民地主義」概念を体現する代表的事例として、ラテンアメリカにおける対米従属論の重要な参照点となっている。', debate:'プラット修正条項の存在が、後のキューバ革命における強い反米ナショナリズムの歴史的土壌をどこまで形成したかは、革命の起源を理解する上での重要な論点である。'} },
  { id:"batista_dictatorship", name:"バティスタ独裁政権", category:"nation", lat:23.13, lng:-82.38, start:1952, end:1959, region:"キューバ(ハバナ)", relatedIds:["cuban_revolution"], desc:{background:'アメリカ資本・マフィアとの緊密な結びつきが、バティスタ政権の経済的基盤を支えると同時に、国民の反発を招く汚職・格差構造を固定化させたことが背景にある。', process:'軍人フルヘンシオ・バティスタが1952年のクーデターで再び政権を奪取して独裁体制を敷き、アメリカ資本とマフィアが結びついた観光・賭博産業が繁栄する一方、汚職と反対派弾圧が横行し国民の不満は増大、フィデル・カストロら革命勢力の武装闘争を招いた。', significance:'1959年元日にバティスタは国外へ逃亡し、この政権の腐敗と対米従属的性格は、以後のキューバ革命政権の強い反米路線を正当化する歴史的文脈を提供した。', debate:'バティスタ政権下の経済発展(一定の工業化・都市化)と社会的格差拡大のどちらを重視するかで、革命前キューバ社会の実態評価が分かれる。'} },
  { id:"cuban_revolution", name:"キューバ革命", category:"revolution", lat:23.13, lng:-82.38, start:1953, end:1959, region:"キューバ全土(シエラ・マエストラ山脈)", relatedIds:["fidel_castro","che_guevara","socialist_cuba"], desc:{background:'バティスタ独裁への広範な国民的不満と、キューバにおける度重なる対米従属の歴史的記憶が、急進的な革命運動への支持を集める土壌となった。', process:'フィデル・カストロら若手革命家がモンカダ兵営襲撃(1953年)の失敗を経てメキシコに亡命、その後ヨットグランマ号でキューバに上陸しシエラ・マエストラ山中でゲリラ戦を展開し、チェ・ゲバラらも加わり農民の支持を広げながら勢力を拡大し1959年元日にバティスタ独裁政権を打倒した。', significance:'以後キューバは社会主義体制へと転換し、ラテンアメリカにおける社会主義革命の最も成功した事例として、以後半世紀以上にわたる中南米左翼運動の理念的模範となった。', debate:'革命当初のカストロの政治的立場(民主的改革者かマルクス主義者か)については、革命後の急速な社会主義化がどの時点から意図されていたかをめぐり歴史家の間で見解が分かれている。'} },
  { id:"fidel_castro", name:"フィデル・カストロ", category:"person", parentId:"socialist_cuba", lat:23.13, lng:-82.38, start:1926, end:2016, region:"キューバ(ハバナ)", desc:{background:'法律家としての教育を受けながらバティスタ独裁への強い反発を抱いたことが、モンカダ兵営襲撃という無謀ともいえる武装蜂起への参加を促した。', process:'キューバ革命を指導し以後半世紀近くにわたりキューバの最高指導者であり続け、革命後は土地改革・産業国有化を進めて社会主義体制へと舵を切り、ソ連との緊密な関係のもとでアメリカとの対立(経済封鎖・ピッグス湾侵攻・キューバ危機など)を経験しながらも政権を維持した。', significance:'中南米左翼運動の象徴的存在であり続け、2008年に病気を理由に弟ラウルへ権限を委譲するまで半世紀近くにわたり一国の最高指導者であり続けた、20世紀世界史上最も長期に権力を保持した指導者の一人である。', debate:'カストロ政権を「反帝国主義・社会福祉の実現者」とみるか「一党独裁と言論統制の抑圧者」とみるかで、国際的評価は今も鋭く対立し続けている。'} },
  { id:"socialist_cuba", name:"社会主義キューバ", category:"nation", lat:23.13, lng:-82.38, start:1959, end:2030, region:"キューバ(ハバナ)", relatedIds:["bay_of_pigs_invasion","cuban_missile_crisis"], desc:{background:'アメリカとの断交・経済封鎖という孤立状況が、代替の後ろ盾としてソ連陣営への急速な接近を不可避にしたことが背景にある。', process:'アメリカとの対立からソ連陣営に接近し経済的にも深く依存したが、1991年のソ連崩壊後は「特別期間」と呼ばれる深刻な経済危機に直面し、アメリカによる長期の経済封鎖が続く中でも無償の医療・教育制度など独自の社会主義的成果を国際的にアピールし続けた。', significance:'2015年にはアメリカとの国交正常化交渉も進んだが、その後も両国関係は緊張と緩和を繰り返しており、冷戦終結後も存続し続ける数少ない社会主義国家として国際政治上特異な位置を占め続けている。', debate:'アメリカの経済封鎖(禁輸措置)がキューバの経済的困難の主因か、それとも社会主義計画経済自体の非効率性が主因かは、キューバ経済の停滞要因をめぐる長年の政治的・経済学的論争である。'} },
  { id:"bay_of_pigs_invasion", name:"ピッグス湾侵攻", category:"war", lat:22.13, lng:-81.13, start:1961, end:1961, region:"キューバ(ピッグス湾)", desc:{background:'革命直後のキューバの社会主義化路線を警戒したアメリカが、カストロ政権打倒のための秘密工作を計画したことが、この作戦の直接的背景となった。', process:'アメリカ中央情報局(CIA)の支援・訓練を受けたキューバ亡命者部隊がキューバ南岸に上陸したが、事前の空爆計画が縮小されるなど作戦の不備もありキューバ軍によりわずか3日で撃退される完全な失敗に終わった。', significance:'この事件はケネディ政権の外交的失点となる一方、カストロ政権にとってはソ連への接近と社会主義体制強化を正当化する契機ともなり、翌年のキューバ危機へとつながる緊張の重要な前段階となった。', debate:'この作戦失敗の責任を、ケネディ大統領の土壇場での空爆支援縮小の決断に求めるか、CIAの計画自体の杜撰さに求めるかで、アメリカの対外諜報工作史における教訓的検証が続けられている。'} },
  { id:"cuban_missile_crisis", name:"キューバ危機", category:"event", lat:23.13, lng:-82.38, start:1962, end:1962, region:"キューバ・アメリカ・ソ連", desc:{background:'ピッグス湾侵攻という直接的な軍事的脅威を受けたキューバが、自国防衛のためソ連の核ミサイル配備提案を受け入れたことが、この危機の直接的背景となった。', process:'ソ連がキューバに核ミサイルを配備しようとしていることが発覚し、アメリカが海上封鎖で対抗、米ソが全面核戦争の瀬戸際まで対峙したが、ケネディとフルシチョフの水面下の交渉によりソ連のミサイル撤去とアメリカのトルコからのミサイル撤去・キューバ不可侵の約束という妥協が成立し、13日間の緊張は回避された。', significance:'この危機を機に米ソ間にホットラインが設置されるなど、以後の緊張緩和(デタント)への転機ともなった、冷戦史上最も核戦争に近づいた瞬間として世界史的に極めて重要な事件である。', debate:'この危機の「解決」を米国の勝利(ソ連の譲歩)と単純化する従来の見方に対し、アメリカ側もトルコのミサイル撤去という相応の譲歩を行っていたことを重視する近年の研究(機密解除文書に基づく)は、危機の「勝者」をめぐる歴史認識を修正しつつある。'} },
  { id:"che_guevara", name:"チェ・ゲバラ", category:"person", parentId:"cuban_revolution", lat:23.13, lng:-82.38, start:1928, end:1967, region:"アルゼンチン・キューバ・ボリビア", relatedIds:["che_guevara_death_bolivia"], desc:{background:'アルゼンチン出身の医師でありながら中南米を旅した経験(モーターサイクル・ダイアリーズに描かれる)を通じ、地域全体の貧困と抑圧の現実を目の当たりにしたことが、革命思想への傾倒を促した。', process:'カストロと共にキューバ革命を戦った後、革命後は国立銀行総裁・工業相などを歴任したが、世界革命の理想を追ってキューバを離れ、コンゴでの活動を経てボリビアで新たなゲリラ戦を指導するも、1967年に政府軍に捕らえられ処刑された。', significance:'国際的なゲリラ指導者として、その理想主義的な生涯は死後、世界中の若者文化・革命運動の象徴(その肖像は最も複製された政治的イメージの一つ)となった。', debate:'ゲバラを「純粋な理想主義的国際主義者」とみるか「非現実的な革命輸出論者(フォコ理論の失敗)」とみるかで、彼の軍事的・政治的評価は今も分かれ続けている。'} },
  { id:"che_guevara_death_bolivia", name:"ゲバラのボリビアでのゲリラ活動と死", category:"event", lat:-18.33, lng:-63.95, start:1966, end:1967, region:"ボリビア(バジェグランデ・ラ・イゲラ)", desc:{background:'キューバでの成功体験に基づく「フォコ理論」(少数の献身的なゲリラが農民蜂起を誘発できるとする戦略)を他国でも再現しようとする信念が、ボリビア潜入の理論的動機となった。', process:'ボリビアの山岳地帯に潜入し少数のゲリラ部隊を率いて武装闘争を展開したが、現地農民の支持を得られず、アメリカの支援を受けたボリビア軍の掃討作戦により部隊は追い詰められ、1967年10月にゲバラは捕らえられ処刑された。', significance:'この死は皮肉にも彼を中南米左翼運動における不滅の殉教者的象徴へと押し上げることとなり、革命運動における「英雄的死」がその政治的遺産をどう増幅させるかを示す象徴的事例となった。', debate:'ボリビアでの失敗の要因を、現地の言語・文化的隔たり(ケチュア語圏でのスペイン語による組織化の困難)に求めるか、フォコ理論そのものの理論的欠陥(農民の自発的支持を過大評価した点)に求めるかで、ゲリラ戦略史上の重要な教訓として議論される。'} },

  // ===================== エクアドル =====================
  { id:"real_audiencia_quito", name:"キト大統領庁(スペイン植民地時代)", category:"nation", lat:-0.18, lng:-78.47, start:1563, end:1822, region:"エクアドル(キト)", desc:{background:'アンデス山脈中央部という地理的条件が、ペルー副王領・ヌエバグラナダ副王領いずれの中心地からも隔たった独自の行政単位設置を必要とさせたことが背景にある。', process:'キト(現エクアドル)を中心に高等司法行政機関として設置され、時期によりペルー副王領・ヌエバグラナダ副王領の管轄下を移りながらも独自の地域的一体性を保持し続けた。', significance:'この行政単位としての一体性が、後の大コロンビアからのエクアドル分離独立(1830年)における領域的根拠となり、現在のエクアドルの国境線の歴史的起源を形作った。', debate:'植民地期の行政区分(アウディエンシア)がどこまで後の独立国家の国境線を規定したかは、ラテンアメリカにおける「植民地の遺産」としての国境形成論の重要な検討事例である。'} },
  { id:"ecuador_republic", name:"エクアドル共和国", category:"nation", lat:-0.18, lng:-78.47, start:1830, end:2030, region:"エクアドル(キト)", relatedIds:["ecuador_peru_border_conflict"], desc:{background:'大コロンビアの解体という広域国家の分裂が、独自の国民的アイデンティティの形成途上にあったエクアドルの分離独立を可能にした。', process:'1830年に大コロンビアから分離独立して以降、保守派(教会の権威重視)と自由派(世俗主義)の激しい対立、沿岸部(グアヤキル)と高地(キト)の地域対立が続く不安定な政治史をたどったが、20世紀後半には石油収入を軸とする経済発展も進んだ。', significance:'地域間対立(高地対沿岸部)という国内構造は現在に至るまでエクアドル政治の重要な争点であり続けており、この地域対立の構図はラテンアメリカの多くの国に共通する国民統合の課題を象徴する事例となっている。', debate:'エクアドルの政治的不安定さ(20世紀だけで多数の大統領が任期途中で交代)の要因を、地域対立の根深さに求めるか、石油収入をめぐる分配政治の失敗に求めるかで議論がある。'} },
  { id:"ecuador_peru_border_conflict", name:"エクアドル・ペルー国境紛争", category:"war", lat:-3.5, lng:-80.27, start:1941, end:1998, region:"エクアドル・ペルー国境地帯(アマゾン上流域)", relatedIds:["rio_protocol_1942"], desc:{background:'アマゾン川上流域の境界が植民地期のアウディエンシア境界の曖昧さに起因して未確定であったことが、独立後長期にわたる両国間の領土紛争の根本的背景となった。', process:'19世紀の独立以来断続的に武力衝突を繰り返し(1941年・1981年・1995年の紛争を含む)、特に1941年の戦争でエクアドルはアマゾン地域の広大な領土を喪失した。', significance:'この紛争は南米で最も長期化した国境紛争の一つとして知られ、その最終的解決(1998年)は南米における平和的な国境紛争解決の重要な事例となった。', debate:'1941年の敗戦・領土喪失を「不当な力による割譲」とするエクアドル側の歴史認識と、条約に基づく正当な国境画定とするペルー側の認識との相違は、両国関係における歴史認識問題として長く尾を引いた。'} },
  { id:"rio_protocol_1942", name:"リオ議定書", category:"treaty", lat:-22.91, lng:-43.17, start:1942, end:1942, region:"ブラジル(リオデジャネイロ)", desc:{background:'第二次世界大戦下で米州の団結を重視するアメリカの外交的仲介が、1941年の武力紛争を早期に終結させる国際的圧力として作用した。', process:'アメリカ・ブラジル・アルゼンチン・チリの保証国のもとでエクアドルとペルーの国境が画定されたが、エクアドル側はこの合意を不当な圧力下での押し付けとみなし、後年その正当性を再三問題視した。', significance:'この議定書はその後半世紀以上にわたり両国関係の火種として残り続け、1995年にも再び武力衝突(セネパ紛争)が発生するなど、国境画定条約の実効性の限界を示す事例となった。', debate:'大国(米・ブラジル等)の保証のもとで結ばれた国境条約が、当事国の一方(エクアドル)の不満を長期間解消できなかったことは、国際的仲介による紛争解決の持続可能性を問う事例として国際関係論上の検討対象となっている。'} },

  // ===================== ウルグアイ =====================
  { id:"jose_gervasio_artigas", name:"ホセ・ヘルバシオ・アルティガス", category:"person", parentId:"uruguayan_republic", lat:-34.9, lng:-56.16, start:1764, end:1850, region:"ウルグアイ(バンダ・オリエンタル)", desc:{background:'ブエノスアイレスを中心とする中央集権的な独立運動の方針に対し、東方州(現ウルグアイ)における連邦主義的な自治要求が高まっていたことが、彼の指導的地位確立の背景となった。', process:'スペインからの独立と東方州の自治を求めて戦い、ブエノスアイレスの中央集権主義とも対立を深めたが、後にブラジル(ポルトガル)軍の侵攻を受け敗れて亡命を余儀なくされた。', significance:'今日「ウルグアイ建国の父」として国民的に敬愛されており、彼が唱えた連邦主義・地方自治の理念は、ウルグアイが最終的にアルゼンチン・ブラジルいずれにも属さない独立国家として成立する思想的原点となった。', debate:'アルティガスの連邦主義構想を、単なるウルグアイのナショナリズムの起源とみるか、より広く南米南部(ラプラタ地域全体)における反中央集権的な地域主義の理念的先駆者とみるかで、その歴史的射程の評価が分かれる。'} },
  { id:"cisplatine_war", name:"シスプラティーナ戦争", category:"war", lat:-34.9, lng:-56.16, start:1825, end:1828, region:"ウルグアイ・アルゼンチン・ブラジル(バンダ・オリエンタル)", relatedIds:["uruguay_independence"], desc:{background:'ブラジル帝国による東方州(シスプラティーナ州として)併合に対し、アルゼンチン(ラプラタ連合州)がこれに反発したことが開戦の直接的背景となった。', process:'ブラジルとアルゼンチンとの間で戦われたが、いずれも決定的勝利を収められず、両国の緩衝国として独立したウルグアイを樹立するというイギリスの仲介案を受け入れる形で終結した。', significance:'この結果、ウルグアイはブラジル・アルゼンチンという二大国の間の緩衝国として独立を果たすこととなり、大国間の勢力均衡の産物として国家が誕生する典型的事例となった。', debate:'ウルグアイの独立を、住民自身の自決権の発露とみるか、英・ブラジル・アルゼンチンという外部勢力の勢力均衡上の都合による人為的な緩衝国家創出とみるかで、国家形成の主体性をめぐる議論がある。'} },
  { id:"uruguay_independence", name:"ウルグアイ独立(モンテビデオ予備条約)", category:"event", lat:-34.9, lng:-56.16, start:1828, end:1828, region:"ウルグアイ(モンテビデオ)", desc:{background:'ブラジル・アルゼンチン両国が互いに東方州の単独領有を認められない膠着状態にあったことが、第三の選択肢としての独立国家樹立を可能にした。', process:'イギリスの仲介による1828年のモンテビデオ条約により、ブラジル・アルゼンチンいずれの領土ともならない緩衝独立国家として建国された。', significance:'南米における「緩衝国家」の代表例として、大国間の勢力均衡がいかに新興国家の誕生を規定するかを示す国際関係論上重要な事例となっている。', debate:'この独立の主たる推進力を現地住民(アルティガス以来の自治要求)の主体的意思に求めるか、英国の対外政策上の利害(ラプラタ川河口の自由航行確保)に求めるかで評価が分かれる。'} },
  { id:"uruguayan_republic", name:"ウルグアイ東方共和国", category:"nation", lat:-34.9, lng:-56.16, start:1830, end:2030, region:"ウルグアイ(モンテビデオ)", relatedIds:["batlle_reforms"], desc:{background:'緩衝国家として独立したがゆえに国内基盤が脆弱であったことが、独立後長期にわたる政党間内戦(コロラド党対ブランコ党)の構造的背景となった。', process:'19世紀を通じ二大政党(コロラド党・ブランコ党)間の内戦が頻発する不安定な時代を経たが、20世紀初頭のバッジェ大統領による改革(バッジェ改革)により南米で最も進んだ社会福祉国家の一つへと発展した。', significance:'「南米のスイス」と称されるほどの安定した民主主義と社会保障制度を確立した事例として、ラテンアメリカにおける小国の安定的発展モデルとしてしばしば参照される。', debate:'19世紀の党派対立の激しさと20世紀の急速な安定化との落差の要因を、バッジェ個人の改革手腕に求めるか、より構造的な条件(小国ゆえの統治の容易さ)に求めるかで議論がある。'} },
  { id:"batlle_reforms", name:"バジェ・イ・オルドニェスの社会改革", category:"event", lat:-34.9, lng:-56.16, start:1903, end:1929, region:"ウルグアイ(モンテビデオ)", desc:{background:'19世紀を通じた党派対立の疲弊とウルグアイ社会における世俗主義・進歩主義思想の浸透が、抜本的な社会改革への機運を高めていた。', process:'ホセ・バッジェ・イ・オルドニェス大統領が主導し、労働時間規制・年金制度・国営企業設立・政教分離・離婚制度導入など広範な社会民主主義的改革を断行した。', significance:'20世紀初頭としては世界的にも先進的な社会福祉国家の枠組みを確立し、以後長くウルグアイが「南米の福祉国家モデル」と呼ばれる基礎を築いた画期的な改革であった。', debate:'この改革がウルグアイの狭小な国土・人口という特殊条件(統治の容易さ)に依存した成功であり、他のラテンアメリカ大国にそのまま応用できるモデルかどうかは比較政治学上議論がある。'} },

  // ===================== パラグアイ =====================
  { id:"paraguay_francia_dictatorship", name:"パラグアイ独立とフランシア博士の独裁", category:"nation", lat:-25.28, lng:-57.63, start:1811, end:1840, region:"パラグアイ(アスンシオン)", desc:{background:'独立直後のラプラタ地域における政治的混乱の中、パラグアイが近隣諸国からの干渉を強く警戒したことが、極端な鎖国政策の背景となった。', process:'ホセ・ガスパル・ロドリゲス・デ・フランシアが「エル・スプレモ(至高の存在)」と称して26年にわたり国境を閉ざす鎖国的な独裁体制を敷き、外国貿易をほぼ完全に統制した。', significance:'他のラテンアメリカ諸国とは対照的な極端な自給自足・孤立主義路線を追求した稀有な事例として、小国の独立維持戦略の一つの極端な形態を示している。', debate:'この鎖国政策を、外国資本による搾取・従属を回避した先見的な経済的自立戦略と評価する見方と、単なる個人独裁による国家の停滞とみる見方とが対立している。'} },
  { id:"chaco_war", name:"チャコ戦争", category:"war", lat:-22.0, lng:-60.0, start:1932, end:1935, region:"パラグアイ・ボリビア国境(グラン・チャコ)", desc:{background:'太平洋戦争(硝石戦争)で海への出口を失ったボリビアが、グランチャコ地域での石油資源発見(実際には過大評価であった)を機に新たな出口を求めたことが、開戦の背景となった。', process:'ボリビアとパラグアイとの間でグランチャコ地方の領有をめぐり戦われ、当初優勢と目されたボリビア軍が地理・補給の不利から苦戦し、最終的にパラグアイが係争地の大半を確保する形で終結した。', significance:'20世紀の南米における最も凄惨な国家間戦争の一つとして、両国に深刻な人的損失をもたらし、皮肉にも戦後の調査でチャコ地域には当初期待されたほどの石油資源が存在しないことが判明した。', debate:'開戦の背景とされた石油資源の存在について、当時の外国石油会社(スタンダード・オイルとシェル)の利権争いがどこまで開戦を煽ったかは、資源をめぐる国家間戦争と多国籍企業の関係を考える上での重要な論点である。'} },
  { id:"stroessner_dictatorship", name:"ストロエスネル独裁政権", category:"nation", lat:-25.28, lng:-57.63, start:1954, end:1989, region:"パラグアイ(アスンシオン)", desc:{background:'チャコ戦争後のパラグアイの政治的混乱と内戦が、軍部出身の強力な指導者による長期安定統治への希求を生んでいた。', process:'アルフレド・ストロエスネルが1954年のクーデターで政権を握り、35年に及ぶ長期の権威主義体制のもとで反対派を徹底的に弾圧し、後の「コンドル作戦」にも積極的に関与した。', significance:'ラテンアメリカにおける最長不倒の軍事独裁政権の一つとして、冷戦下の反共主義を名目とした人権侵害の集積地としての性格を強く帯びた事例である。', debate:'ストロエスネル政権を「共産主義の脅威から国を守った安定政権」とみるか「南米における人権侵害の温床(コンドル作戦の中心的拠点)」とみるかで、パラグアイ国内の評価は今も分裂している。'} },

  // ===================== ボリビア(20世紀) =====================
  { id:"bolivian_national_revolution_1952", name:"1952年ボリビア革命", category:"revolution", lat:-16.5, lng:-68.15, start:1952, end:1952, region:"ボリビア(ラパス)", desc:{background:'チャコ戦争敗北による軍・エリート層への信頼失墜と、鉱山労働者・先住民農民の窮乏化が、革命勢力(民族革命運動=MNR)台頭の社会的基盤となった。', process:'民族革命運動(MNR)が武装蜂起して政権を樹立し、錫鉱山の国有化・土地改革・先住民への参政権拡大(普通選挙制導入)など急進的な社会改革を断行した。', significance:'ラテンアメリカにおいて先住民人口の多い国での数少ない包括的社会革命の成功例として、先住民の政治参加拡大という点で1990年代以降の先住民運動再興の歴史的先駆けとなった。', debate:'この革命の社会的成果(土地改革・参政権拡大)がその後の軍事クーデター(1964年)によりどこまで後退させられたかについては、改革の持続可能性をめぐる評価が分かれる。'} },
  { id:"evo_morales_era", name:"エボ・モラレス政権(先住民初の大統領)", category:"event", lat:-16.5, lng:-68.15, start:2006, end:2019, region:"ボリビア(ラパス)", desc:{background:'1952年革命以来の先住民の政治的疎外の継続と、新自由主義的な資源(天然ガス)民営化政策への国民的不満が、初の先住民出身大統領誕生の背景となった。', process:'先住民出身のエボ・モラレスが2006年に大統領に就任し天然ガス産業の国有化や新憲法制定を通じた先住民の権利拡大を進め、資源収入を財源とする貧困削減で高い支持を得たが、2019年の選挙不正疑惑を機に混乱が生じ辞任・亡命を余儀なくされた(後に帰国)。', significance:'ボリビア史上初の先住民出身大統領として、長年抑圧されてきた先住民の政治的復権を象徴する存在となり、21世紀ラテンアメリカの「ピンクの潮流」における重要な事例となった。', debate:'2019年の退陣を「不正選挙への当然の民主的是正(事実上のクーデター説を否定する立場)」とみるか「軍部関与を伴う実質的なクーデター」とみるかで、国内外の評価が大きく対立している。'} },

  // ===================== 中米諸国(国家史) =====================
  { id:"guatemala_republic", name:"グアテマラ共和国", category:"nation", lat:14.63, lng:-90.51, start:1847, end:2030, region:"グアテマラ(グアテマラシティ)", relatedIds:["guatemalan_civil_war"], desc:{background:'中米連邦解体後の独自の国家形成の中、少数の大地主・軍部エリートによる支配構造が早期から固定化されたことが、その後の政治的特質を規定した。', process:'コーヒー・バナナのプランテーション経済を基盤に少数エリート支配が続き、1944年の「10月革命」による民主化の試みも1954年のアメリカ支援クーデターで頓挫し、以後長期の軍事政権と内戦(1960-96年)を経験した。', significance:'アメリカの介入(ユナイテッド・フルーツ社の権益保護)による民主的改革の頓挫という経緯は、中米における「バナナ共和国」型の対米従属構造の代表的事例として国際的に知られている。', debate:'1954年クーデターにおけるアメリカ企業(ユナイテッド・フルーツ社)の利害とCIAの冷戦戦略のどちらがより決定的な動機であったかは、アメリカの中米政策研究における中心的論点である。'} },
  { id:"el_salvador_republic", name:"エルサルバドル共和国", category:"nation", lat:13.69, lng:-89.19, start:1841, end:2030, region:"エルサルバドル(サンサルバドル)", relatedIds:["el_salvador_civil_war","football_war"], desc:{background:'中米で最も人口密度が高く土地が希少な国土条件のもと、少数の大地主家系(「14家族」)によるコーヒー経済の独占が早くから確立されたことが、その後の社会構造を規定した。', process:'コーヒー経済に依存する寡頭支配体制が長く続き、1932年には共産主義者蜂起とされる農民反乱への軍による大量虐殺(「ラ・マタンサ」、推定数万人が犠牲)が発生するなど、格差と抑圧の構造が深刻化し、これが後の内戦(1980-92年)の遠因となった。', significance:'1932年の虐殺は以後長くエルサルバドル社会に暗い記憶として残り、20世紀後半の内戦とその後の和平プロセスに至る同国の政治構造を理解する上での重要な歴史的起点となっている。', debate:'1932年の虐殺の対象が実際に共産主義運動の参加者に限定されていたか、先住民系農民全般への無差別的弾圧であったかについては、歴史人口学的な検証を含め議論が続いている。'} },
  { id:"honduras_republic", name:"ホンジュラス共和国(バナナ共和国)", category:"nation", lat:14.1, lng:-87.22, start:1838, end:2030, region:"ホンジュラス(テグシガルパ)", relatedIds:["football_war"], desc:{background:'中米連邦解体後、比較的小規模な国内エリート層のもとで農業(特にバナナ)輸出経済への依存が急速に強まったことが、対米従属構造の背景となった。', process:'アメリカ資本(ユナイテッド・フルーツ社など)によるバナナ・プランテーション経営が国内経済・政治に強い影響力を持ち「バナナ共和国」の典型例とされたが、20世紀後半は比較的穏健な政軍関係のもとで推移し、周辺国のような大規模内戦は経験しなかった。', significance:'「バナナ共和国」という呼称そのものの発祥地とされ、外国企業が一国の経済・政治を左右する新植民地主義的構造の典型例として国際的に広く言及される事例となっている。', debate:'ホンジュラスが周辺国(グアテマラ・エルサルバドル・ニカラグア)のような大規模内戦を免れた要因を、統治の安定性に求めるか、逆に政治的無関心・変革の欠如(現状維持)の結果とみるかで評価が分かれる。'} },
  { id:"nicaragua_republic", name:"ニカラグア共和国", category:"nation", lat:12.11, lng:-86.24, start:1838, end:2030, region:"ニカラグア(マナグア)", relatedIds:["somoza_dynasty","sandinista_revolution"], desc:{background:'中米連邦解体後の保守派・自由派の党派対立に加え、大西洋・太平洋を結ぶ運河建設候補地としての地政学的重要性が、外国(特にアメリカ)の介入を招く構造的背景となった。', process:'19世紀半ばのアメリカ人冒険家ウィリアム・ウォーカーによる一時占領事件や度重なるアメリカ海兵隊の軍事介入・占領(1912-33年)を経験し、これに対する抵抗運動を率いたアウグスト・サンディーノの名は後のサンディニスタ革命運動に引き継がれた。', significance:'アメリカによる度重なる直接軍事介入の対象となった事例として、中米における「棍棒外交」「ドル外交」の典型例であり、この歴史的記憶は20世紀後半のサンディニスタ革命の反米ナショナリズムの土壌となった。', debate:'アメリカの度重なる軍事介入を「地域の安定化・秩序維持」とみる当時の公式説明に対し、運河建設候補地・投資保護という経済的利害こそが真の動機であったとする批判的見解が現在の主流である。'} },
  { id:"somoza_dynasty", name:"ソモサ一族の独裁(ニカラグア)", category:"dynasty", lat:12.11, lng:-86.24, start:1936, end:1979, region:"ニカラグア(マナグア)", relatedIds:["sandinista_revolution"], desc:{background:'アメリカ海兵隊撤退に際して組織された国家警備隊の指揮権を握ったソモサ・ガルシアが、サンディーノ暗殺という強硬手段により政敵を排除したことが、王朝的独裁確立の直接的契機となった。', process:'ソモサ一族が3代・約43年にわたりニカラグアを支配し、国家警備隊を私兵化して反対派を弾圧する一方、国富と土地の多くを一族の所有に帰す縁故的な蓄財を行ったが、1979年サンディニスタ革命により打倒された。', significance:'アメリカが「彼は確かに悪党だが、我々の悪党だ」(フランクリン・ルーズベルトの発言とされる)と評したと伝えられるように、冷戦下でアメリカが反共の見返りに独裁を黙認した典型的事例として国際政治学上頻繁に引用される。', debate:'アメリカによるソモサ政権への長期支持が、結果的により急進的な反米左翼革命(サンディニスタ)を招いたという「安定優先政策の逆説」は、冷戦期の対外政策の是非を考える上で重要な教訓的事例とされる。'} },
  { id:"costa_rica_republic", name:"コスタリカ共和国", category:"nation", lat:9.93, lng:-84.08, start:1848, end:2030, region:"コスタリカ(サンホセ)", relatedIds:["costa_rican_civil_war_1948","costa_rica_army_abolition"], desc:{background:'植民地時代から比較的小規模な自作農中心の社会構造(大農園制が発達しにくい地勢)であったことが、周辺国とは異なる比較的平等な社会の形成を促した。', process:'中米連邦解体後、比較的穏健な政治的発展をたどり、1948年の内戦を経て軍隊を廃止するという中米では例外的な道を歩み、以後は教育・医療への手厚い投資により「中米の楽園」とも称される安定した民主主義国家として発展した。', significance:'軍事費を教育・福祉に振り向けることができたことが、周辺の中米諸国とは対照的な政治的安定と高い人間開発指数を実現する重要な要因になったと評価されている。', debate:'コスタリカの「例外的」安定の要因を、植民地期からの社会構造(大地主層の不在)という歴史的与件に求めるか、1948年内戦後の軍隊廃止という制度的選択に求めるかで、比較政治学上の議論がある。'} },
  { id:"costa_rican_civil_war_1948", name:"コスタリカ内戦", category:"war", lat:9.93, lng:-84.08, start:1948, end:1948, region:"コスタリカ(サンホセ)", relatedIds:["costa_rica_army_abolition"], desc:{background:'1948年大統領選挙結果をめぐる不正疑惑と、それに対する改革派の反発が、短期間ながら激しい内戦へと発展する直接的引き金となった。', process:'ホセ・フィゲーレスが率いる反乱軍が政府軍を破り、勝利したフィゲーレスは暫定政権を率いて軍隊の廃止という歴史的決断を下し、社会保障制度の拡充など進歩的な改革も断行した。', significance:'この内戦を最後にコスタリカは中米で唯一恒久的な軍隊を持たない国家となり、以後の政治的安定と民主主義の定着に決定的な役割を果たした画期的な転換点となった。', debate:'フィゲーレスが内戦の勝者でありながら独裁化せず民主的な体制へ権力を移譲したことは、中米の他のカウディーリョ的指導者と一線を画す事例として、その動機(理念か戦略的計算か)が論じられる。'} },
  { id:"costa_rica_army_abolition", name:"常備軍の廃止", category:"event", lat:9.93, lng:-84.08, start:1949, end:1949, region:"コスタリカ(サンホセ)", desc:{background:'1948年内戦を勝ち抜いたフィゲーレスが、軍部のクーデターの脅威を将来にわたり排除したいという政治的意図を持っていたことが、この歴史的決断の直接的背景となった。', process:'暫定政権を率いたフィゲーレスが憲法により常備軍を廃止し、以後の国防予算は教育・医療・福祉分野へと振り向けられた。', significance:'軍事クーデターが頻発した中米地域において「軍隊を持たない国」という稀有な道を選択したことで、以後70年以上にわたり中米で唯一のクーデターのない安定した民主主義を実現する制度的基盤となった。', debate:'軍隊廃止という選択が中米の他の小国にも応用可能な普遍的モデルとなり得るか、コスタリカ特有の歴史的条件(社会的平等・地政学的位置)に依存した特殊な成功例に過ぎないかは、比較政治学上の重要な検討課題である。'} },

function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

const filterListEl = document.getElementById('filterList');
Object.entries(CATEGORY_CONFIG).forEach(([key, cfg])=>{
  const count = historicalData.filter(d=>d.category===key).length;
  const row = document.createElement('label');
  row.className = 'filter-row';
  row.innerHTML = `
    <input type="checkbox" data-cat="${key}" checked>
    <span class="swatch" style="background:${cfg.color}"></span>
    <span class="fname">${cfg.label}</span>
    <span class="fcount">${count}</span>
  `;
  filterListEl.appendChild(row);
});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

/* =========================================================================
   詳細パネル
   ========================================================================= */
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');

let currentDetailEntry = null;

function getCurrentYear(){
  return parseInt(document.getElementById('yearSlider').value, 10);
}

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    ${renderDesc(entry.desc)}
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

const DESC_SECTION_CONFIG = [
  { key:'background',    label:'背景(なぜ起きたか)',           cls:'sec-background' },
  { key:'process',       label:'経過(何が決定的だったか)',       cls:'sec-process' },
  { key:'significance',  label:'意義・影響(何を変えたか)',       cls:'sec-significance' },
  { key:'debate',        label:'論点・史学上の論争',             cls:'sec-debate' },
];

function renderDesc(desc){
  if(!desc) return '';
  // 後方互換: 万一プレーン文字列のdescが残っていた場合はそのまま1段落で表示
  if(typeof desc === 'string'){
    return `<p>${desc}</p>`;
  }
  const sections = DESC_SECTION_CONFIG
    .filter(sec => desc[sec.key])
    .map(sec => `
      <div class="desc-section ${sec.cls}">
        <span class="desc-label">${sec.label}</span>
        <p class="desc-text">${desc[sec.key]}</p>
      </div>`)
    .join('');
  return `<div class="desc-sections">${sections}</div>`;
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -3000, MAX_YEAR = 2030;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>
