<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Regions</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover-border: rgba(56, 189, 248, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 960px;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        .grid-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            list-style: none;
        }

        .card-link {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.75rem 1.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        /* カードのホバー効果 */
        .card-link:hover {
            transform: translateY(-4px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px -10px var(--accent-glow);
            background: rgba(30, 41, 59, 0.85);
        }

        .region-en {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .region-ja {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .arrow-icon {
            align-self: flex-end;
            margin-top: 1.5rem;
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
            transition: transform 0.3s ease, stroke 0.3s ease;
        }

        .card-link:hover .arrow-icon {
            transform: translateX(4px);
            stroke: #38bdf8;
        }

        /* レスポンシブ対応（スマホ表示時） */
        @media (max-width: 640px) {
            header h1 {
                font-size: 2rem;
            }
            .grid-nav {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>World Regions</h1>
            <p>地域を選択して詳細ページへ移動します</p>
        </header>

        <main>
            <nav>
                <ul class="grid-nav">
                    <li>
                        <a href="europe.html" class="card-link">
                            <div>
                                <div class="region-en">Europe</div>
                                <div class="region-ja">ヨーロッパ</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                    <li>
                        <a href="middleeast.html" class="card-link">
                            <div>
                                <div class="region-en">Middle East</div>
                                <div class="region-ja">中東</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                    <li>
                        <a href="eastasia.html" class="card-link">
                            <div>
                                <div class="region-en">East Asia</div>
                                <div class="region-ja">東アジア</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                    <li>
                        <a href="southasia.html" class="card-link">
                            <div>
                                <div class="region-en">South Asia</div>
                                <div class="region-ja">南アジア</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                    <li>
                        <a href="africa.html" class="card-link">
                            <div>
                                <div class="region-en">Africa</div>
                                <div class="region-ja">アフリカ</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                    <li>
                        <a href="america.html" class="card-link">
                            <div>
                                <div class="region-en">America</div>
                                <div class="region-ja">アメリカ</div>
                            </div>
                            <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                        </a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>

</body>
</html>
