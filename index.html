  { id:'innocent_iv', name:'インノケンティウス4世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1195, end:1254, region:'教皇領',
    desc:'モンゴル帝国の脅威に対応するため、修道士プラノ=カルピニを使節としてモンゴル宮廷へ派遣した教皇。皇帝フリードリヒ2世とも激しく対立し、リヨン公会議で彼の廃位を宣言するなど、皇帝権に対する教皇権の優位を追求した。' },
  { id:'clement_v', name:'クレメンス5世', category:'person', parentId:'papal_states', lat:43.95, lng:4.81, start:1264, end:1314, region:'教皇領→アヴィニョン',
    desc:'フランス王フィリップ4世の強い圧力のもとで教皇庁をアヴィニョンへ移した教皇(教皇のバビロン捕囚の開始)。在位中にはフィリップ4世の要求に屈してテンプル騎士団の解散も命じ、教皇権のフランス王権への従属を印象づけた。' },
  { id:'gregory_xi', name:'グレゴリウス11世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1329, end:1378, region:'教皇領(アヴィニョン→ローマ)',
    desc:'「教皇のバビロン捕囚」に終止符を打ち、教皇庁をアヴィニョンからローマへ帰還させた教皇。しかし彼の死の直後にローマとアヴィニョンでそれぞれ別の教皇が擁立される事態となり、教会大分裂(大シスマ)が始まった。' },
  { id:'urban_vi', name:'ウルバヌス6世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1318, end:1389, region:'教皇領(ローマ)',
    desc:'グレゴリウス11世の死後にローマで選出された教皇。彼の選出に不満を持つ枢機卿団がアヴィニョンで対立教皇(クレメンス7世)を擁立したため、ローマとアヴィニョンに教皇が並び立つ教会大分裂(大シスマ)が生じた。' },
  { id:'clement_vii_avignon_antipope', name:'クレメンス7世(アヴィニョン対立教皇)', category:'person', lat:43.95, lng:4.81, start:1342, end:1394, region:'アヴィニョン(対立教皇庁)',
    desc:'ウルバヌス6世の教皇選出に反発した枢機卿団によってアヴィニョンで擁立された対立教皇。以後ローマ教皇と並び立ち、ヨーロッパ諸国もそれぞれの支持に分かれたため、教会大分裂(大シスマ)は数十年にわたり収拾がつかなくなった。' },
  { id:'western_schism', name:'教会大分裂(西方教会分裂・大シスマ)', category:'event', lat:43.95, lng:4.81, start:1378, end:1417, region:'ローマ・アヴィニョン',
    desc:'ローマとアヴィニョンに同時に教皇が並び立ち、ヨーロッパ諸国がそれぞれの教皇を支持して分裂した事態。一時は3人の教皇が並立する事態にまで至ったが、コンスタンツ公会議(1414〜18年)で新教皇が選出されて分裂は収拾された。' },
  { id:'wycliffe', name:'ウィクリフ', category:'person', parentId:'plantagenet_dynasty', lat:51.75, lng:-1.26, start:1320, end:1384, region:'イングランド(オックスフォード)',
    desc:'聖書の英訳を進め、教会の世俗的な富や教皇の権威を批判した神学者。その教えは大陸のヤン=フスにも影響を与え、宗教改革の先駆者(「宗教改革の暁の明星」)とも評される。コンスタンツ公会議で教説は異端とされ、死後に遺骸を掘り起こして焼く処分まで行われた。' },

  // ===================== 追加ボリューム ラウンド5: ネーデルラント(オランダ) + 北欧補完 =====================
  { id:'dutch_republic', name:'ネーデルラント連邦共和国', category:'nation', lat:52.37, lng:4.90, start:1581, end:1795, region:'ネーデルラント北部(現オランダ)',
    desc:'スペインからの独立を宣言した北部7州が結成した連邦国家。商業・金融・海運で繁栄して「オランダの黄金時代」を築いたが、1795年のフランス革命軍の侵攻によりバタヴィア共和国に取って代わられた。' },
  { id:'william_of_orange_silent', name:'オラニエ公ウィレム(沈黙公)', category:'person', parentId:'dutch_republic', lat:52.37, lng:4.90, start:1533, end:1584, region:'ネーデルラント',
    desc:'スペインに対するネーデルラント独立戦争を指導した貴族。当初カトリックであったが後にプロテスタントに改宗し、「オランダ建国の父」と称される。独立達成を見ることなく、スペインに雇われた刺客に暗殺された。' },
  { id:'duke_of_alba', name:'アルバ公', category:'person', lat:52.37, lng:4.90, start:1507, end:1582, region:'スペイン領ネーデルラント',
    desc:'フェリペ2世の命でネーデルラントの反乱鎮圧にあたったスペインの将軍・総督。「血の審議会」による恐怖政治で反乱をかえって激化させ、その過酷な統治はネーデルラント独立戦争(八十年戦争)の重要な引き金となった。' },
  { id:'dutch_east_india_company', name:'連合東インド会社(VOC)', category:'nation', lat:52.37, lng:4.90, start:1602, end:1799, region:'ネーデルラント(アジア各地に拠点)',
    desc:'世界初の株式会社とされる特許貿易会社。アジア(特に東南アジア)における香辛料貿易を独占し、バタヴィア(現ジャカルタ)を拠点に事実上の統治機構も備えて「もう一つの国家」とまで称されたが、経営難により1799年に解散した。' },
  { id:'grotius', name:'グロティウス', category:'person', parentId:'dutch_republic', lat:52.37, lng:4.90, start:1583, end:1645, region:'ネーデルラント連邦共和国',
    desc:'『戦争と平和の法』を著し、自然法に基づく国際法の基礎を築いた法学者。海洋の自由航行を説く『海洋自由論』でも知られ、「国際法の父」と称される。三十年戦争期のヨーロッパで自然法思想の普及に大きく貢献した。' },
  { id:'spinoza', name:'スピノザ', category:'person', parentId:'dutch_republic', lat:52.37, lng:4.90, start:1632, end:1677, region:'ネーデルラント連邦共和国',
    desc:'汎神論的な立場から神と自然を同一視する独自の哲学体系を展開した哲学者。デカルトの合理主義を継承しつつ独自の一元論を構築し、後の啓蒙思想にも大きな影響を与えた。' },
  { id:'rembrandt', name:'レンブラント', category:'person', parentId:'dutch_republic', lat:52.37, lng:4.90, start:1606, end:1669, region:'ネーデルラント連邦共和国',
    desc:'明暗法(光と影の対比)を駆使した「夜警」などの作品で知られるオランダ黄金時代を代表する画家。市民や商人の肖像画・集団肖像画を数多く手がけ、当時繁栄した市民社会の姿を色濃く反映した。' },
  { id:'vermeer', name:'フェルメール', category:'person', parentId:'dutch_republic', lat:52.37, lng:4.90, start:1632, end:1675, region:'ネーデルラント連邦共和国',
    desc:'「真珠の耳飾りの少女」などの作品で知られるオランダ黄金時代の画家。柔らかな光の表現と静謐な室内風景の描写を得意とし、生前は無名に近かったが19世紀以降再評価されて広く知られるようになった。' },
  { id:'gustav_vasa', name:'グスタフ=ヴァーサ', category:'person', lat:59.33, lng:18.06, start:1496, end:1560, region:'スウェーデン',
    desc:'カルマル同盟からの離脱を果たし、スウェーデンの独立と国王としての地位を確立した人物。ヴァーサ朝の始祖となり、ルター派を国教として採用するなど近代スウェーデン国家の基礎を築いた。' },

  // ===================== 追加ボリューム ラウンド6: ローマ共和政/帝政・オスマン帝国・ザクセン朝・イスラーム王朝 =====================
  { id:'macedonian_wars', name:'マケドニア戦争', category:'war', lat:40.77, lng:22.52, start:-215, end:-148, region:'マケドニア王国・ギリシャ',
    desc:'ローマとマケドニア王国との間で4次にわたり戦われた一連の戦争。カルタゴのハンニバルと同盟したマケドニア王フィリップ5世との対決に始まり、第3次でマケドニア王国を滅ぼしてローマの属州とし、第4次(偽フィリップの反乱)の鎮圧を経てバルカン半島におけるローマの支配を確定させた。ギリシャ諸ポリスもこの過程で事実上ローマの影響下に組み込まれていった。' },
  { id:'social_war_rome', name:'同盟市戦争(イタリア)', category:'war', lat:42.09, lng:13.83, start:-91, end:-88, region:'イタリア半島',
    desc:'ローマに軍事的に協力しながらローマ市民権を持たなかったイタリア半島の同盟市(ソキイ)が、市民権付与を求めて起こした反乱戦争。軍事的には決着がつかない中、ローマは譲歩して同盟市側にローマ市民権を段階的に付与する法を制定してこれを鎮静化させ、結果的にイタリア半島の住民のほぼ全てがローマ市民権を得る画期となった。' },
  { id:'mithridatic_wars', name:'ミトリダテス戦争', category:'war', lat:42.03, lng:35.15, start:-88, end:-63, region:'ポントス王国・小アジア',
    desc:'小アジア北部の黒海沿岸に勢力を築いたポントス王ミトリダテス6世と、ローマとの間で3次にわたり戦われた戦争。ミトリダテスはローマの属州支配への不満を背景に一時小アジア全域のローマ人を虐殺するなど猛威を振るったが、スラ・ルクルス・ポンペイウスら歴代の将軍による遠征でついに打倒され、ローマの小アジア・シリア方面への支配拡大の契機となった。' },
  { id:'sertorian_war', name:'セルトリウス戦争', category:'war', lat:39.47, lng:-0.38, start:-80, end:-72, region:'イベリア半島(ヒスパニア)',
    desc:'スラの独裁に反発してイベリア半島(ヒスパニア)に逃れたマリウス派の将軍セルトリウスが、現地住民の支持を得て事実上独立政権を樹立し、本国の元老院派軍と戦った内戦。ポンペイウスらの派遣軍を相手に長く互角以上に戦ったが、最終的に部下の裏切りによって暗殺され鎮圧された。共和政末期の内乱が属州にまで波及したことを示す事例である。' },
  { id:'battle_teutoburg', name:'トイトブルク森の戦い', category:'war', lat:52.05, lng:8.55, start:9, end:9, region:'ゲルマニア(ライン川以東)',
    desc:'ゲルマン人指導者アルミニウスに率いられた諸部族が、ローマの属州総督ウァルス率いる3個軍団を待ち伏せして壊滅させた戦い。この大敗によりローマはライン川以東のゲルマニア征服を断念し、以後ライン川・ドナウ川を帝国の事実上の境界線とする防衛戦略へ転換した、帝国の拡大の限界を示す象徴的な戦いとなった。' },

  { id:'mark_antony', name:'アントニウス', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-83, end:-30, region:'ローマ共和政',
    desc:'カエサルの腹心として仕え、その死後は第二回三頭政治の一角を占めてブルートゥスら暗殺者を打倒した将軍・政治家。東方領土の統治を担う中でプトレマイオス朝の女王クレオパトラと結び、オクタウィアヌスとの対立を深めていった。アクティウムの海戦でオクタウィアヌスに敗れると、エジプトでクレオパトラとともに自害し、これによりローマの内乱は終結してオクタウィアヌスの単独支配(帝政)への道が開かれた。' },
  { id:'fabius_maximus', name:'ファビウス(クンクタトル)', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-280, end:-203, region:'ローマ共和政',
    desc:'第二次ポエニ戦争でハンニバル軍との正面決戦を避け、持久戦・遅滞戦術によって敵を消耗させる戦略(フェビアン戦略)を取った独裁官。この慎重な戦術は当初「臆病者」と批判され「クンクタトル(遅延者)」と渾名されたが、カンナエの戦いでの大敗後にはその有効性が見直され、結果的にローマがハンニバルとの消耗戦を耐え抜く基盤を作った人物として再評価された。' },
  { id:'tiberius_emperor', name:'ティベリウス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:-42, end:37, region:'ローマ帝国',
    desc:'アウグストゥスの養子として第2代皇帝に即位した人物。軍事・行政の実務能力には優れていたが陰気で猜疑心の強い性格とされ、治世後半はカプリ島に引きこもって近衛軍長官セイヤヌスに政務を委任し、その専横と粛清によって元老院との関係を悪化させた。イエスの磔刑もこの治世下の出来事とされる。' },
  { id:'caligula', name:'カリグラ帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:12, end:41, region:'ローマ帝国',
    desc:'即位当初は寛大な統治で歓迎されたが、まもなく異常な浪費や残虐な振る舞い、自らを神格化する言動が目立つようになった第3代皇帝。「暴君」の代名詞的存在として後世に伝えられるが、これらの逸話には敵対的な元老院系史料による誇張も含まれるとみる見方もある。近衛軍将校らの陰謀により暗殺され、短い治世に終わった。' },
  { id:'claudius_emperor', name:'クラウディウス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:-10, end:54, region:'ローマ帝国',
    desc:'カリグラ暗殺後、身体的障害のため軽視されていたところを近衛軍に擁立されて即位した第4代皇帝。周囲の予想に反して有能な統治者であることを示し、ブリタンニア(現イギリス)征服を開始するなど帝国の版図拡大にも寄与したが、私生活では妻や解放奴隷の影響を強く受け、最終的に妻(後妻アグリッピナ、ネロの母)に毒殺されたとも伝えられる。' },
  { id:'titus_emperor', name:'ティトゥス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:39, end:81, region:'ローマ帝国',
    desc:'父ウェスパシアヌスからユダヤ戦争の指揮を引き継ぎ、エルサレム攻略・神殿破壊(70年)を成し遂げた将軍で、父の死後に第2代フラウィウス朝皇帝として即位した。父が着工したコロッセウム(円形闘技場)を完成させて盛大な落成式を行い、ヴェスヴィオ火山の大噴火(ポンペイ埋没)やローマの大火・疫病への対応にも尽力するなど「人類の喜び」と称される善政を敷いたが、在位2年余りで病没した。' },
  { id:'domitian', name:'ドミティアヌス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:51, end:96, region:'ローマ帝国',
    desc:'フラウィウス朝最後の皇帝。ライン川・ドナウ川方面の防衛強化に努め、行政面でも一定の成果を上げたが、元老院を軽視し自らを「主にして神(ドミヌス=エト=デウス)」と称させるなど専制的傾向を強め、反対派への猜疑心から粛清を繰り返した。最終的に宮廷内の陰謀により暗殺され、元老院は彼の記録を抹消する「記録抹殺刑(ダムナティオ=メモリアエ)」を科した。' },
  { id:'antoninus_pius', name:'アントニヌス=ピウス', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:86, end:161, region:'ローマ帝国',
    desc:'五賢帝の一人で、養父ハドリアヌスの路線を継いで対外的にはほぼ平和を保ち、内政の充実に専念した皇帝。在位中一度もローマを離れず属州視察も行わなかったとされるほど内政に専念し、その安定した統治は「ローマの平和」の最も円熟した時期を体現するものと評される。養子として迎えたマルクス=アウレリウスに帝位を継承させた。' },
  { id:'commodus', name:'コンモドゥス', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:161, end:192, region:'ローマ帝国',
    desc:'マルクス=アウレリウスの実子で、五賢帝時代以来の「有能な人物を養子に迎えて後継とする」慣行を破り、実子として初めて帝位を世襲した皇帝。統治への関心を欠き剣闘士としての活動に熱中するなど奇矯な振る舞いが目立ち、側近政治と恐怖政治により元老院との関係も悪化した。最終的に近衛隊長らの陰謀で暗殺され、その死後は帝位をめぐる内乱(五皇帝の年)が勃発して「3世紀の危機」の前触れとなった。' },
  { id:'septimius_severus', name:'セウェルス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:145, end:211, region:'ローマ帝国(北アフリカ出身)',
    desc:'コンモドゥス暗殺後の内乱(五皇帝の年)を勝ち抜いて即位し、セウェルス朝を開いた北アフリカ(レプティス=マグナ)出身の皇帝。「兵士を富ませよ、他は無視せよ」との遺言に象徴されるように軍人への俸給引き上げなど軍を優遇する統治で権力基盤を固め、元老院の権威をさらに形骸化させて軍事力に依拠する専制的な帝政の傾向を強めた。この軍隊優遇路線は、後の軍人皇帝時代(3世紀の危機)における軍の政治介入を助長する一因ともなった。' },
  { id:'aurelian', name:'アウレリアヌス', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:214, end:275, region:'ローマ帝国',
    desc:'3世紀の危機のただ中で即位し、分離独立していたガリア帝国とパルミラ王国(ゼノビア女王)をわずか数年で相次いで攻略し、事実上3分裂していた帝国を再統一した軍人皇帝。「世界の修復者(レスティトゥトル=オルビス)」と称され、ゲルマン人の侵入に備えてローマ市を囲む城壁(アウレリアヌス城壁)を新たに築くなど、次代ディオクレティアヌスによる本格的な帝国再建の土台を築いた。' },

  { id:'safavid_empire', name:'サファヴィー朝', category:'nation', lat:38.08, lng:46.29, start:1501, end:1736, region:'イラン(タブリーズ→イスファハーン)',
    desc:'イスマーイール1世がイランに建てたシーア派(十二イマーム派)国家。シーア派を国教として国民統合の核とし、スンナ派のオスマン帝国とはチャルディランの戦いをはじめ長期にわたり抗争を続けた。アッバース1世の治世に最盛期を迎え新首都イスファハーンを整備したが、18世紀にアフガン人の侵入を受けて衰退・滅亡した。' },
  { id:'mamluk_sultanate', name:'マムルーク朝', category:'nation', lat:30.04, lng:31.24, start:1250, end:1517, region:'エジプト・シリア',
    desc:'アイユーブ朝の軍事奴隷(マムルーク)出身者たちが実権を握って建てたエジプト・シリアの王朝。バイバルスのもとでモンゴル軍(アインジャールートの戦い)や十字軍勢力を撃退してイスラーム世界の守護者としての名声を確立し、東西交易(香辛料交易)の中継地として繁栄したが、1517年にセリム1世率いるオスマン帝国に征服されて滅亡した。' },
  { id:'battle_nicopolis', name:'ニコポリスの戦い', category:'war', lat:43.70, lng:24.90, start:1396, end:1396, region:'バルカン半島(現ブルガリア)',
    desc:'バヤジット1世率いるオスマン軍が、ハンガリー王ジギスムントを中心にフランス・ドイツなど西欧諸国からも参加した十字軍を撃破した戦い。この勝利によりオスマン帝国のバルカン支配は決定的なものとなり、西欧のキリスト教世界に対しオスマンの脅威を強く印象づける結果となった。' },
  { id:'battle_ankara', name:'アンカラの戦い', category:'war', lat:39.93, lng:32.86, start:1402, end:1402, region:'アナトリア(現トルコ)',

/* =========================================================================
   年号の表示フォーマット
   ========================================================================= */
function formatYear(y){
  y = Math.round(y);
  if(y < 0) return `紀元前${Math.abs(y)}年`;
  if(y === 0) return `紀元1年`;
  return `西暦${y}年`;
}
function formatYearShort(y){
  y = Math.round(y);
  if(y < 0) return `前${Math.abs(y)}`;
  return `${y}`;
}

});
filterListEl.addEventListener('change', (e)=>{
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const cat = cb.dataset.cat;
  if(cb.checked) activeCategories.add(cat);
  else activeCategories.delete(cat);
  updateMap();
});

document.getElementById('selectAllBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = true;
    activeCategories.add(cb.dataset.cat);
  });
  updateMap();
});
document.getElementById('selectNoneBtn').addEventListener('click', ()=>{
  document.querySelectorAll('#filterList input[type=checkbox]').forEach(cb=>{
    cb.checked = false;
  });
  activeCategories.clear();
  updateMap();
});

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  updateMap();
});

/* =========================================================================
   詳細パネル
   ========================================================================= */
const detailPanel = document.getElementById('detailPanel');
const detailContent = document.getElementById('detailContent');

let currentDetailEntry = null;

function getCurrentYear(){
  return parseInt(document.getElementById('yearSlider').value, 10);
}

// entry(国家・王朝・事件など)に紐づく人物、および entry.relatedIds で明示的に
// リンクされた国家・王朝(同盟/敵対関係)・事件・戦争・革命・条約などを、
// 年代に関わらず全て取得(古い順)。表示中のジャンルでフィルタする。
function getRelatedItems(entry){
  if(activeCategories.size === 0) return null;

  const byParent = historicalData.filter(p => p.category === 'person' && p.parentId === entry.id);

  const explicitIds = entry.relatedIds || [];
  const byExplicit = explicitIds
    .map(id => historicalData.find(d => d.id === id))
    .filter(Boolean);

  const merged = [...byParent];
  for(const item of byExplicit){
    if(item.id !== entry.id && !merged.some(m => m.id === item.id)) merged.push(item);
  }

  return merged
    .filter(d => activeCategories.has(d.category))
    .sort((a,b)=> a.start - b.start);
}

function showDetail(entry, parentEntry){
  currentDetailEntry = entry;
  const cfg = CATEGORY_CONFIG[entry.category];

  const backHtml = parentEntry
    ? `<button class="back-btn" data-back-id="${parentEntry.id}">← ${parentEntry.name} に戻る</button>`
    : '';

  let relatedHtml = '';
  {
    const related = getRelatedItems(entry);
    if(related !== null){
      if(related.length > 0){
        const items = related.map(p => {
          const pCfg = CATEGORY_CONFIG[p.category];
          return `
          <li class="person-list-item" data-person-id="${p.id}">
            <span class="person-name"><span class="related-cat-badge" style="background:${pCfg.color}">${pCfg.label}</span>${p.name}</span>
            <span class="person-years">${formatYear(p.start)} 〜 ${formatYear(p.end)}</span>
          </li>`;
        }).join('');
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語(${related.length}件・古い順)</h4>
            <ul>${items}</ul>
          </div>`;
      } else {
        relatedHtml = `
          <div class="related-persons">
            <h4>この国・王朝に関連する用語</h4>
            <div class="related-persons-empty">関連する用語データはありません。</div>
          </div>`;
      }
    }
  }

  const metaLabel = entry.category === 'person' ? '活躍した年代(生没年)' : '時期';

  detailContent.innerHTML = `
    ${backHtml}
    <span class="detail-badge" style="background:${cfg.color}">${cfg.label}</span>
    <h3>${entry.name}</h3>
    <div class="detail-meta">
      <div>${metaLabel}: ${formatYear(entry.start)} 〜 ${formatYear(entry.end)}</div>
      <div>地域: ${entry.region || '—'}</div>
    </div>
    <p>${entry.desc}</p>
    ${relatedHtml}
  `;
  detailPanel.classList.remove('hidden');
}

// 動的に生成される「戻る」ボタン・人物リスト項目のクリックをイベント委譲で処理
detailContent.addEventListener('click', (e)=>{
  const personItem = e.target.closest('.person-list-item');
  if(personItem){
    const person = historicalData.find(d => d.id === personItem.dataset.personId);
    if(person) showDetail(person, currentDetailEntry);
    return;
  }
  const backBtn = e.target.closest('.back-btn');
  if(backBtn){
    const parent = historicalData.find(d => d.id === backBtn.dataset.backId);
    if(parent) showDetail(parent);
    return;
  }
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  detailPanel.classList.add('hidden');
});

/* =========================================================================
   マーカー描画・年代フィルタリング
   ========================================================================= */
function createMarker(entry){
  const cfg = CATEGORY_CONFIG[entry.category];
  const marker = L.circleMarker([entry.lat, entry.lng], {
    radius:7,
    weight:2,
    color:'#f3ecdc',
    fillColor:cfg.color,
    fillOpacity:0.92,
  });
  marker.bindTooltip(entry.name, {
    permanent:true,
    direction:'right',
    offset:[9,0],
    className:'entry-label',
  });
  marker.on('click', ()=> showDetail(entry));
  return marker;
}

function updateMap(){
  const year = parseInt(document.getElementById('yearSlider').value, 10);
  document.getElementById('yearDisplay').textContent = formatYear(year);

  markerLayer.clearLayers();
  let visibleCount = 0;
  const term = searchTerm.toLowerCase();

  historicalData.forEach(entry=>{
    if(!activeCategories.has(entry.category)) return;
    if(year < entry.start || year > entry.end) return;
    if(term && !entry.name.toLowerCase().includes(term)) return;
    // 国家・王朝に紐づく人物は、そのピンをクリックした先の一覧からのみ表示する
    if(entry.category === 'person' && entry.parentId) return;
    const marker = createMarker(entry);
    markerLayer.addLayer(marker);
    visibleCount++;
  });

  document.getElementById('visibleCount').textContent = visibleCount;
  document.getElementById('totalCount').textContent = historicalData.length;
}

/* =========================================================================
   年表(タイムライン)スライダー
   ========================================================================= */
const yearSlider = document.getElementById('yearSlider');
yearSlider.addEventListener('input', updateMap);

// 目盛り(500年刻み)を生成
const ticksEl = document.getElementById('ticks');
const MIN_YEAR = -3000, MAX_YEAR = 2000;
for(let y = MIN_YEAR; y <= MAX_YEAR; y += 500){
  const pct = (y - MIN_YEAR) / (MAX_YEAR - MIN_YEAR) * 100;
  const tick = document.createElement('div');
  tick.className = 'tick';
  tick.style.left = pct + '%';
  tick.textContent = formatYearShort(y);
  ticksEl.appendChild(tick);
}

/* =========================================================================
   再生(自動再生)機能
   ========================================================================= */
const playBtn = document.getElementById('playBtn');
const speedSelect = document.getElementById('speedSelect');
let playing = false;
let playTimer = null;

function startPlaying(){
  playing = true;
  playBtn.textContent = '⏸ 停止';
  playTimer = setInterval(()=>{
    const step = parseInt(speedSelect.value, 10);
    let v = parseInt(yearSlider.value, 10) + step;
    if(v > MAX_YEAR){ v = MIN_YEAR; }
    yearSlider.value = v;
    updateMap();
  }, 180);
}
function stopPlaying(){
  playing = false;
  playBtn.textContent = '▶ 再生';
  clearInterval(playTimer);
}
playBtn.addEventListener('click', ()=>{
  if(playing) stopPlaying();
  else startPlaying();
});

/* =========================================================================
   初期描画
   ========================================================================= */
updateMap();

</script>

</html>
