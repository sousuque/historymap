  { id:'demosthenes', name:'デモステネス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-384, end:-322, region:'アテネ',
    desc:'マケドニアの南下政策に対し、アテネ市民に警鐘を鳴らし続けた弁論家・政治家。フィリッポス2世を非難する一連の演説「フィリッピカ(対フィリッポス弾劾演説)」で知られ、アテネ・テーベ連合の結成を主導してカイロネイアの戦いに臨んだが敗北した。敗戦後もなおマケドニア支配への抵抗を訴え続け、アレクサンドロス大王の死後に蜂起した反マケドニア戦争(ラミア戦争)の敗北を受けて服毒自殺した。ポリスの自由と独立を最後まで訴え続けた人物として評価される。' },
  { id:'hasmonean_revolt', name:'マカベア戦争', category:'war', lat:31.78, lng:35.22, start:-167, end:-160, region:'ユダヤ(セレウコス朝支配下)',
    desc:'セレウコス朝によるヘレニズム化強制と宗教弾圧に対し、ユダ・マカバイらユダヤ人が起こした反乱。反乱の成功により事実上独立したユダヤ人国家(ハスモン朝)が成立した。' },
  { id:'hasmonean_dynasty', name:'ハスモン朝', category:'dynasty', lat:31.78, lng:35.22, start:-140, end:-37, region:'ユダヤ',
    desc:'マカベア戦争の結果成立したユダヤ人による独立王朝。後にローマの影響下に入り、最終的にローマの後ろ盾を得たヘロデ王家に取って代わられた。' },
  { id:'thales', name:'タレース', category:'person', lat:37.76, lng:27.28, start:-624, end:-546, region:'ミレトス(イオニア)',
    desc:'従来神話によって説明されていた自然現象を、観察と理性によって説明しようとした、西洋最初の哲学者(自然哲学者)とされる人物。万物の根源(アルケー)を「水」であると説き、あらゆる事象を一つの原理から統一的に説明しようとする姿勢は、以後のギリシャ自然哲学(ミレトス学派)の出発点となった。日食を予言したという逸話や、ピラミッドの影の長さから高さを算出したという逸話も伝えられ、実用的な観測・測量の知識にも長けていたとされる。' },
  { id:'pythagoras', name:'ピタゴラス', category:'person', lat:40.1, lng:17.24, start:-582, end:-496, region:'南イタリア(クロトン)',
    desc:'「万物は数である」として、数的秩序・調和(ハルモニア)こそが宇宙の根本原理であると説いた哲学者・数学者。南イタリアのクロトンに宗教的色彩の強い教団を組織し、輪廻転生を信じて肉食を戒めるなど、禁欲的な共同生活を営んだ。直角三角形の三辺の関係を示す「ピタゴラスの定理」で知られるが、その探求は純粋数学というより、数を通じて宇宙の神秘を解き明かそうとする宗教的探求の性格が強かった。' },
  { id:'heraclitus', name:'ヘラクレイトス', category:'person', lat:37.95, lng:27.36, start:-535, end:-475, region:'エフェソス',
    desc:'「万物は流転する」の言葉で知られる哲学者。世界の本質を絶えざる変化と、対立するものの調和(ロゴス)に求めた。' },
  { id:'democritus', name:'デモクリトス', category:'person', lat:40.85, lng:24.75, start:-460, end:-370, region:'アブデラ(トラキア)',
    desc:'万物は分割不可能な微粒子「原子(アトム)」から構成されるとする原子論を唱えた哲学者。近代科学の原子概念の源流の一つとされる。' },
  { id:'protagoras', name:'プロタゴラス', category:'person', lat:37.98, lng:23.73, start:-490, end:-420, region:'アブデラ/アテネ',
    desc:'「人間は万物の尺度である」の言葉で知られる代表的なソフィスト(弁論術の教師)。相対主義的な思想はソクラテスら伝統的哲学者から批判された。' },
  { id:'hesiod', name:'ヘシオドス', category:'person', lat:38.42, lng:23.02, start:-750, end:-650, region:'ボイオティア',
    desc:'『労働と日々』や神々の系譜を説く『神統記』で知られる叙事詩人。ホメロスと並び称される古代ギリシャ最初期の詩人の一人。' },
  { id:'aeschylus', name:'アイスキュロス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-525, end:-456, region:'アテネ',
    desc:'それまで一人の俳優と合唱隊のみで構成されていた悲劇に、第二の俳優を導入して対話劇としての構成を確立し、ギリシャ悲劇を単なる祭礼から芸術形式へと高めた劇作家。現存する唯一の完全な三部作『オレステイア』などの作品は、神々の意志と人間の運命・正義の関係を壮大なスケールで描いた。自らマラトンの戦いに一兵士として参加したとも伝えられ、その従軍経験がペルシア戦争を主題とする作品『ペルシア人』にも反映されているとされる。' },
  { id:'sophocles', name:'ソフォクレス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-497, end:-406, region:'アテネ',
    desc:'第三の俳優を導入して人物間の心理的葛藤をより複雑に描けるようにし、ギリシャ悲劇を芸術的頂点に導いたとされる劇作家。代表作『オイディプス王』では、知らずして父を殺し母を娶るという運命から逃れようとしてかえってそれを実現してしまう主人公を通じ、人間の意志と抗いがたい運命との葛藤を描き、後世「悲劇の理想形」として高く評価された(アリストテレス『詩学』でも模範として言及される)。' },
  { id:'euripides', name:'エウリピデス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-480, end:-406, region:'アテネ',
    desc:'伝統的な英雄像や神々への敬虔さを相対化し、嫉妬や復讐心に苦しむ女性(『メディア』)など、人間の内面の心理的リアリズムを追求した悲劇作家。ペロポネソス戦争下で高まった伝統的価値観への懐疑や合理主義的な風潮を作品に反映させ、しばしば同時代人からは急進的とみなされたが、その心理描写は後のヨーロッパ演劇に大きな影響を与えた。' },
  { id:'aristophanes', name:'アリストファネス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-446, end:-386, region:'アテネ',
    desc:'ペロポネソス戦争下のアテネの政治・社会を鋭く風刺した喜劇作家(古喜劇の代表者)。女性たちが夫に性的関係を拒否することで戦争終結を迫るという奇抜な筋立ての『女の平和(リューシストラテー)』のほか、デマゴーグ(扇動政治家)やソクラテスら知識人への風刺劇も手がけ、当時のアテネ民主政における言論の自由の広さを今に伝える貴重な史料ともなっている。' },
  { id:'herodotus', name:'ヘロドトス', category:'person', lat:37.03, lng:27.43, start:-484, end:-425, region:'ハリカルナッソス(小アジア)',
    desc:'エジプトから黒海沿岸、ペルシア帝国内部にまで及ぶ広範な旅行に基づき、諸民族の地理・風習・伝承を体系的に記録した『歴史(ヒストリアイ)』の著者。ペルシア戦争を主題としつつ、単なる戦記にとどまらず異民族の文化を客観的に紹介しようとする姿勢から「歴史の父」と称される。ただし伝聞や伝承をそのまま採録する箇所も多く、史料批判に基づくトゥキディデスの手法としばしば対比される。' },
  { id:'thucydides', name:'トゥキディデス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-460, end:-400, region:'アテネ',
    desc:'自らも将軍としてペロポネソス戦争に従軍した経験を持ち、同時代史であるこの戦争を厳密な史料批判と実証的な記述で描いた『戦史』の著者。神々の意志による説明を排し、人間の権力欲や国家間の力関係(パワーポリティクス)という現実主義的な視点から歴史の因果関係を分析する手法は、近代実証史学の先駆と評価される。「強者は欲することをなし、弱者は耐えるべきことに耐える」という言葉に代表されるその現実主義的な国際政治観は、後の国際関係論にも影響を与えた。' },
  { id:'hippocrates', name:'ヒポクラテス', category:'person', lat:36.89, lng:26.93, start:-460, end:-370, region:'コス島',
    desc:'病気を迷信ではなく自然現象として捉える医学の基礎を築いた「医学の父」。「ヒポクラテスの誓い」は現代の医療倫理にも影響を残している。' },
  { id:'diogenes', name:'ディオゲネス', category:'person', lat:37.98, lng:23.73, start:-412, end:-323, region:'アテネ(出身シノペ)',
    desc:'樽(甕)に住み、無欲・自然に従う生き方を実践した犬儒学派(キュニコス派)の代表的哲学者。アレクサンドロス大王に対しても物怖じしなかった逸話で知られる。' },
  { id:'zeno_stoic', name:'ゼノン(ストア派)', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-334, end:-262, region:'アテネ(出身キプロス)',
    desc:'キプロス出身でアテネに移り住み、彩色柱廊(ストア=ポイキレ)で講義を行ったことからストア派と呼ばれる学派を創始した哲学者。理性(ロゴス)に従って自然と調和して生きることを理想とし、外的な運命や情念に動じない不動心(アパテイア)を重視するその禁欲的な倫理思想は、ポリス的な共同体が解体しヘレニズム世界が広域化する中で、個人の内面的な自足を求める思潮として広く受容され、後にローマ帝政期には支配者層(セネカ・マルクス=アウレリウス=アントニヌスら)にも深く浸透した。' },
  { id:'epicurus', name:'エピクロス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-341, end:-270, region:'アテネ',
    desc:'快楽(ヘードネー)こそが善であり人生の目的であるとするエピクロス派(快楽主義)を創始した哲学者。ただしその「快楽」とは感覚的な享楽の追求ではなく、欲望を最小限に抑えて心を乱す不安(特に死への恐怖)を取り除いた、平静で乱されない心の状態(アタラクシア)を指すものであった。「エピクロスの園」と呼ばれる学園を営んで政治参加からの隠遁的な生活を説き、公共的な生に価値を置くポリス的価値観からの離脱という点で、ストア派とともにヘレニズム期の個人主義的な思潮を代表する。' },
  { id:'archimedes', name:'アルキメデス', category:'person', lat:37.07, lng:15.29, start:-287, end:-212, region:'シチリア(シラクサ)',
    desc:'浮力の原理(アルキメデスの原理)やてこの原理などを発見した古代最大の科学者・数学者の一人。ローマ軍によるシラクサ攻囲戦の際に殺されたと伝えられる。' },
  { id:'euclid', name:'エウクレイデス(ユークリッド)', category:'person', parentId:'ptolemaic_egypt', lat:31.2, lng:29.92, start:-330, end:-260, region:'アレクサンドリア',
    desc:'『原論(ストイケイア)』を著し、公理から論証を積み上げる幾何学の体系を確立した数学者。その手法は2000年以上にわたり数学教育の基礎であり続けた。' },
  { id:'eratosthenes', name:'エラトステネス', category:'person', parentId:'ptolemaic_egypt', lat:31.2, lng:29.92, start:-276, end:-194, region:'アレクサンドリア',
    desc:'アレクサンドリア図書館長を務めた学者。日時計の影の角度の違いから地球の周囲の長さをかなりの精度で算出したことで知られる。' },
  { id:'aristarchus', name:'アリスタルコス', category:'person', parentId:'ptolemaic_egypt', lat:31.2, lng:29.92, start:-310, end:-230, region:'サモス島/アレクサンドリア',
    desc:'太陽を中心に地球が公転するという太陽中心説(地動説)を史上初めて提唱したとされる天文学者。コペルニクスに先立つこと約1800年の先駆的な業績であったが、当時は主流の説とはならなかった。' },

  /* =====================================================================
     ①-4 ローマ世界 補完データ(身分闘争・共和政期人物・帝政期人物など)
     ===================================================================== */
  { id:'struggle_of_orders', name:'身分闘争(聖山事件〜ホルテンシウス法)', category:'event', lat:41.9, lng:12.49, start:-494, end:-287, region:'ローマ',
    desc:'王政廃止後の共和政初期、政治権力(公職・元老院議席)や土地・婚姻の権利を独占する貴族(パトリキ)に対し、重装歩兵として軍事的貢献を担いながら権利を持たない平民(プレブス)が処遇改善を求めて起こした長期の身分闘争。平民が武装したまま都市を離れて立てこもる「聖山事件」のような実力行使を通じて護民官(平民の権利を守る特別公職)の設置を勝ち取り、十二表法による法の明文化、リキニウス・セクスティウス法による公職開放を経て、前287年のホルテンシウス法で平民会決議が元老院の承認なしに国法として成立することが認められ、法制度上の身分平等がほぼ達成された。' },
  { id:'licinian_sextian_laws', name:'リキニウス・セクスティウス法', category:'event', lat:41.9, lng:12.49, start:-367, end:-367, region:'ローマ',
    desc:'護民官リキニウスとセクスティウスが提案し、2名の執政官(コンスル)のうち少なくとも1人を平民から選出することを義務づけるとともに、貴族による公有地占有の上限を定めるなどした法律。国家の最高官職である執政官職が平民にも開放されたことで、以後平民出身の有力者が新貴族(ノビレス)として元老院の中核を占めるようになり、身分闘争の実質的な決着点として重要な画期をなした。' },
  { id:'samnite_wars', name:'サムニウム戦争', category:'war', lat:41.57, lng:14.24, start:-343, end:-290, region:'イタリア中南部',
    desc:'イタリア中南部の山岳地帯を拠点とする勇猛な民族サムニウム人と、中部イタリアの覇権をめぐって3次にわたり戦われた戦争。第2次ではローマ軍がカウディウムの隘路で包囲され屈辱的な降伏を強いられる大敗も経験したが、最終的にローマが勝利してイタリア中部の支配権を確立し、続くピュロス戦争を経たイタリア半島統一事業の重要な段階となった。' },
  { id:'pyrrhic_war', name:'ピュロス戦争', category:'war', lat:40.47, lng:17.23, start:-280, end:-275, region:'イタリア南部(タレントゥム)',
    desc:'南イタリアのギリシャ植民市タレントゥムがローマとの紛争に際し、ギリシャ本土エピロスの王ピュロスに援軍を要請したことで始まった戦争。ピュロスは象部隊を投入するなどして緒戦で勝利を重ねたものの、いずれも自軍に甚大な損害を出す割に合わない勝利であったため、「これ以上勝利すればこちらが滅びる」との言葉が伝えられ、「ピュロスの勝利」の語源となった。最終的にはローマが勝利し、南イタリアのギリシャ植民市群も制圧してイタリア半島全土の統一を完成させ、地中海世界への進出(ポエニ戦争)の足がかりを得た。' },
  { id:'pyrrhus_epirus', name:'ピュロス王', category:'person', lat:39.6, lng:20.3, start:-319, end:-272, region:'エピロス',
    desc:'イタリア半島に遠征し、緒戦でローマ軍を撃退したエピロスの王。しかし勝利のたびに深刻な損害を被り「もう一度勝利したら我々は破滅だ」と語ったとされ、割に合わない勝利を指す「ピュロスの勝利」の語源となった。' },
  { id:'scipio_africanus', name:'スキピオ(大アフリカヌス)', category:'person', parentId:'rome_republic', lat:41.9, lng:12.49, start:-236, end:-183, region:'ローマ',
    desc:'第二次ポエニ戦争において、まずイベリア半島のカルタゴ勢力を一掃した後、自ら北アフリカへ遠征してカルタゴ本国を脅かし、イタリアから呼び戻されたハンニバルをザマの戦い(前202年)で撃破した将軍。この勝利によりカルタゴは事実上無力化され、ローマは西地中海における覇権を確立した。「アフリカを制した者」を意味する「アフリカヌス」の称号を得て国民的英雄となったが、晩年は政敵の攻撃を受けて公職を退き失意のうちに没した。' },
  { id:'spartacus_revolt', name:'スパルタクスの反乱', category:'war', lat:40.83, lng:14.43, start:-73, end:-71, region:'イタリア(ウェスウィウス山周辺)',
    desc:'トラキア出身の剣闘士奴隷スパルタクスが、剣闘士養成所からの脱走をきっかけに蜂起した、共和政ローマ末期最大規模の奴隷反乱。逃亡奴隷や困窮した自由民が続々と合流して一時は数万人規模に膨れ上がり、複数のローマ軍を撃破してイタリア半島南部を席巻したが、最終的にクラッススの軍勢に鎮圧され、捕らえられた反乱参加者6000人がアッピア街道沿いに磔にされるという凄惨な結末を迎えた。この反乱の規模は、当時のローマ社会がいかに奴隷労働(特に大農場ラティフンディアでの酷使)に依存していたかを浮き彫りにした。' },
  { id:'cicero', name:'キケロ', category:'person', parentId:'rome_republic', lat:41.9, lng:12.49, start:-106, end:-43, region:'ローマ',
    desc:'「新人(ノウス・ホモ)」でありながら卓越した弁論術で執政官にまで昇りつめた政治家・弁論家・哲学者。カティリナの陰謀を未然に摘発するなど共和政秩序の擁護者を自任し続け、カエサル暗殺後の混乱期にはアントニウスの野心を弾劾する演説「フィリッピカ」を行って激しく対立した。しかし第二回三頭政治が成立するとその粛清対象に含まれ、殺害された。その豊富な著作(『国家論』『義務論』ほか多数の書簡)はラテン語散文の模範とされ、ルネサンス期の人文主義者にも大きな影響を与えた。' },
  { id:'brutus', name:'ブルートゥス', category:'person', parentId:'rome_republic', lat:41.9, lng:12.49, start:-85, end:-42, region:'ローマ',
    desc:'カエサルの側近でありながら、共和政の伝統と自由の擁護を大義に掲げてカッシウスらとともにカエサル暗殺(前44年)を主導した政治家。暗殺後、市民の支持を得られず(むしろカエサルの遺言や葬儀演説を機に民衆の反発を招いた)ローマを離れ、東方属州で軍を組織したが、オクタウィアヌス・アントニウス連合軍との内戦(フィリッピの戦い)に敗れて自害した。共和政理念のための行動が結果的に共和政の最終的崩壊を早めたという逆説は、後世さまざまな評価を呼んでいる。' },
  { id:'cato_elder', name:'カトー(大カトー)', category:'person', parentId:'rome_republic', lat:41.9, lng:12.49, start:-234, end:-149, region:'ローマ',
    desc:'質実剛健なローマ古来の伝統的価値観(モス=マイオルム)を体現し、ギリシャ文化の流入がもたらす奢侈や道徳的退廃を厳しく批判した政治家・文人。監察官(ケンソル)として綱紀粛正に努めたことから「大カトー(監察官カトー)」と呼ばれる。晩年、演説の結びに必ず「カルタゴは滅ぼされねばならない(デレンダ・エスト・カルタゴ)」と付け加えたと伝えられ、カルタゴの経済的復興への警戒感を煽って第三次ポエニ戦争開戦の世論形成を後押しした。' },
  { id:'jewish_war_rome', name:'ユダヤ戦争', category:'war', lat:31.78, lng:35.22, start:66, end:73, region:'ユダヤ(パレスチナ)',
    desc:'ローマの支配に対するユダヤ人の大規模反乱。皇帝ウェスパシアヌス・ティトゥス親子により鎮圧され、エルサレム神殿は破壊されてユダヤ人のディアスポラ(離散)が進んだ。' },
  { id:'nero', name:'ネロ', category:'person', parentId:'rome_empire', lat:41.9, lng:12.49, start:37, end:68, region:'ローマ帝国',
    desc:'幼くして即位し、当初は師セネカらの補佐のもと安定した治世を送ったが、次第に母や妻を殺害するなど暴君化していった皇帝。64年のローマ大火の後、自らへの放火疑惑をそらすためキリスト教徒を放火犯に仕立てて大規模に迫害したと伝えられる(使徒ペテロ・パウロの殉教もこの頃とされる)。属州反乱や近衛軍・元老院の離反を招いて追い詰められ、最終的に自ら命を絶ち、これによりアウグストゥス以来続いたユリウス=クラウディウス朝は断絶した。' },
  { id:'vespasian', name:'ウェスパシアヌス', category:'person', parentId:'rome_empire', lat:41.9, lng:12.49, start:9, end:79, region:'ローマ帝国',
    desc:'ネロ死後の内乱(「4皇帝の年」)を収拾して即位し、フラウィウス朝を開いた皇帝。属州総督としてユダヤ戦争(ユダヤ人の反乱)の鎮圧にあたっていた最中に軍の推戴を受けて皇帝となり、戦争自体は子ティトゥスが引き継いでエルサレム神殿の破壊とともに終結させた。財政再建に努める一方、内乱で傷ついた元老院との融和や自らの権威づけのため、ネロの黄金宮殿跡地に巨大な円形闘技場(のちのコロッセウム)の建設を開始し、民衆への娯楽提供を通じた支配の安定化を図った。' },
  { id:'constitutio_antoniniana', name:'アントニヌス勅令', category:'treaty', lat:41.9, lng:12.49, start:212, end:212, region:'ローマ帝国',
    desc:'皇帝カラカラが、帝国内のほぼ全ての自由民に対してローマ市民権を一律に付与した勅令。それまで市民権はイタリア本国民や特別に認められた属州民に限られ、属州民との間に法的・税制上の格差が存在していたが、この勅令によりその格差は制度上解消された。背景には、市民権拡大による相続税・解放奴隷税など市民のみに課される税収の増加を狙う財政的動機があったとも指摘され、帝国の一体性強化と財政難への対応という2つの側面を併せ持つ改革であった。' },
  { id:'caracalla', name:'カラカラ帝', category:'person', parentId:'rome_empire', lat:41.9, lng:12.49, start:188, end:217, region:'ローマ帝国',
    desc:'弟ゲタを暗殺して単独皇帝となった、性急で残忍な性格で知られる皇帝。アントニヌス勅令(212年)により帝国内のほぼ全自由民にローマ市民権を付与し、「ローマ市民」と「属州民」という古典的な区分を実質的に解消したことは、帝国の一体性を高める一方、市民権が持っていた特権的価値そのものを薄めることにもなった。ローマ市内に壮大な公共浴場(カラカラ浴場)を建設して民衆の支持獲得を図ったが、遠征中に部下に暗殺され、その死は軍人皇帝時代(3世紀の危機)の混乱の先触れともなった。' },
  { id:'valerian', name:'ウァレリアヌス帝', category:'person', parentId:'rome_empire', lat:41.9, lng:12.49, start:200, end:260, region:'ローマ帝国',
    desc:'ササン朝ペルシア王シャープール1世との戦い(エデッサの戦い、260年)で大敗し、講和交渉の場で捕虜として捕らえられた皇帝。ローマ皇帝が生きたまま敵国の捕虜となった史上唯一の事例であり、屈辱的な扱い(王の踏み台にされたとの伝承もある)を受けたまま獄中で没したとされる。この事件はローマの威信を大きく傷つけ、帝国各地で軍人による相次ぐ皇帝僭称と分裂状態を招くなど、「3世紀の危機」の深刻さを象徴する出来事として記憶される。' },
  { id:'council_of_nicaea', name:'ニケーア公会議', category:'event', lat:40.43, lng:29.72, start:325, end:325, region:'ビザンティウム近郊(ニカイア)',
    desc:'コンスタンティヌス帝が招集した最初の公会議。アリウス派を異端として退け、三位一体説に基づくニケーア信条を確立し、キリスト教の教義統一が図られた。' },
  { id:'augustine', name:'アウグスティヌス', category:'person', parentId:'rome_empire', lat:36.83, lng:7.76, start:354, end:430, region:'北アフリカ(ヒッポ)',
    desc:'『告白録』『神の国』を著したキリスト教最大の教父の一人。原罪や恩寵の教義を体系化し、その思想は中世を通じて西欧キリスト教世界に絶大な影響を与えた。' },


  /* =====================================================================
     ③ イギリス史 追加データ(アングロサクソン〜20世紀)
     ===================================================================== */
  { id:'anglo_saxon_heptarchy', name:'アングロサクソン七王国(ヘプターキー)', category:'nation', lat:52.63, lng:-1.13, start:500, end:927, region:'ブリテン島(イングランド)',
    desc:'ローマ軍撤退後のブリテン島に、ゲルマン系のアングル人・サクソン人・ジュート人が大陸から渡来して築いた複数の王国群。ウェセックス・マーシア・ノーサンブリア・ケント・イースト=アングリアなど有力な王国が覇権を争う中、9世紀にはヴァイキング(デーン人)の侵攻という共通の脅威に直面し、これを撃退したアルフレッド大王のウェセックス王家が次第に他の諸王国を統合する中心的地位を確立、10世紀前半のアゼルスタン王の代に統一されたイングランド王国が成立した。' },
  { id:'alfred_the_great', name:'アルフレッド大王', category:'person', parentId:'anglo_saxon_heptarchy', lat:51.06, lng:-1.31, start:849, end:899, region:'ウェセックス王国',
    desc:'ヴァイキング(デーン人)の侵攻によりアングロサクソン諸王国の大半が制圧される中、唯一独立を守り抜いたウェセックス王。デーン人と結んだ協定(グスラムとの条約)によりイングランドを事実上東西に分割し(東側はデーンロウとしてデーン人の法慣習下に置く)、自らの支配地域では要塞都市網(バーの建設)や常備軍の整備など防衛体制を強化した。学問・教育の振興にも力を入れ、ラテン語文献の英語(古英語)への翻訳事業や年代記の編纂を進め、「大王」の称号を得た唯一のイングランド王として、その後のウェセックス王家によるイングランド統一の礎を築いた。' },
  { id:'danelaw', name:'デーンロウ(デーン人支配地域)', category:'event', lat:53.8, lng:-1.55, start:878, end:954, region:'イングランド北東部',
    desc:'ヴァイキング(デーン人)がイングランド北東部を占領して独自の法と慣習を敷いた地域。アルフレッド大王との条約により画定され、後のイングランド統一の過程で徐々に王権のもとに再編入された。' },
  { id:'cnut_the_great', name:'クヌート(カヌート)大王', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:995, end:1035, region:'イングランド・デンマーク・ノルウェー',
    desc:'デンマーク王家出身で、征服によりイングランド王位も獲得し、さらにノルウェーも支配下に収めて北海を囲む広大な「北海帝国」を一代で築いた王。征服者でありながらイングランドの法や教会を尊重する統治を行い、アングロサクソン系貴族とも融和を図って比較的安定した統治を実現したが、この帝国は彼個人の権威に強く依存する結びつきであったため、その死後まもなく後継者間の争いで急速に瓦解し、最終的にアングロサクソン系の王(証聖王エドワード)が復位した。' },
  { id:'domesday_book', name:'ドゥームズデイ・ブック(土地台帳)の作成', category:'event', lat:51.51, lng:-0.13, start:1085, end:1086, region:'イングランド',
    desc:'征服王ウィリアム1世の命により作成された、イングランド全土の土地・財産の詳細な調査記録。徴税や支配の基礎資料として利用され、中世ヨーロッパでも例を見ない精密な統計資料として知られる。' },
  { id:'henry_ii_plantagenet', name:'ヘンリ2世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1133, end:1189, region:'イングランド(プランタジネット朝)',
    desc:'母方を通じてイングランド王位を、父方を通じてアンジュー伯領を、妻(アリエノール=ダキテーヌ)を通じてアキテーヌ公領をそれぞれ相続し、フランス王領をも上回る広大な所領(アンジュー帝国)を築いてプランタジネット朝を開いた王。巡回裁判官の派遣や陪審制度の導入など司法制度の整備を通じてイングランド独自の慣習法(コモン=ロー)の基礎を築き、地方領主による恣意的な裁判に代わる統一的な王の裁判制度を確立した。友人でもあった大司教トマス=ベケットとの叙任権をめぐる対立の末、彼が家臣に暗殺される事件を招いたことでも知られる。' },
  { id:'thomas_becket', name:'トマス・ベケット', category:'person', lat:51.28, lng:1.08, start:1119, end:1170, region:'イングランド(カンタベリ大司教)',
    desc:'国王ヘンリ2世と教会の権限をめぐり対立したカンタベリ大司教。国王側近の騎士らに殺害され、後に列聖されてカンタベリは中世ヨーロッパ有数の巡礼地となった。' },
  { id:'richard_i_lionheart', name:'リチャード1世(獅子心王)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1157, end:1199, region:'イングランド(プランタジネット朝)',
    desc:'第3回十字軍でサラディン率いるアイユーブ朝と互角に渡り合い、エルサレム奪還こそ果たせなかったもののキリスト教徒の聖地巡礼権を確保する休戦協定を結んだ「獅子心王」。帰路オーストリアで捕らえられ神聖ローマ皇帝に多額の身代金を要求されるなど数奇な運命をたどり、在位10年のうちイングランドに滞在したのはごくわずかで、統治の実務は弟ジョンや官僚に委ねられていた。この不在がちな統治と重い身代金・軍事費の負担は、次代ジョン王期の財政難とマグナ=カルタにつながる伏線ともなった。' },
  { id:'john_lackland', name:'ジョン(欠地王)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1166, end:1216, region:'イングランド(プランタジネット朝)',
    desc:'兄リチャード1世の身代金負担や、フランス王フィリップ2世との戦争でフランス国内の所領(ノルマンディー・アンジューなど)の大半を失ったことから「欠地王(失地王)」と渾名された王。戦費調達のための重税、教皇との対立(一時破門)、恣意的な司法運用などが諸侯の強い反発を招き、封建的な貴族の伝統的権利の確認を求める諸侯連合の圧力に屈して、国王の恣意的な課税・逮捕を制限するマグナ=カルタ(大憲章、1215年)の承認に追い込まれた。この文書は後世、議会主権・法の支配・国民の自由の源流として再解釈され、立憲主義の象徴的文書となった。' },
  { id:'edward_i_england', name:'エドワード1世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1239, end:1307, region:'イングランド(プランタジネット朝)',
    desc:'ウェールズを征服して直接支配下に組み込み、スコットランドへの度重なる侵攻を繰り返したことから「スコットランド人のハンマー」と呼ばれた王。戦費調達のため聖職者・貴族に加え各州・各都市の代表も招集した「模範議会(モデル=パーラメント、1295年)」を開催し、この身分代表制の形式が後のイギリス議会(特に庶民院)の原型となった。ユダヤ人追放令(1290年)を発するなど宗教的不寛容な政策もとった。' },
  { id:'edward_iii_england', name:'エドワード3世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1312, end:1377, region:'イングランド(プランタジネット朝)',
    desc:'母方を通じたフランス王位継承権を主張し、フランス王家(ヴァロワ朝)の即位に異議を唱えて百年戦争を開始した王。クレシーの戦いで長弓兵を用いた戦術により騎士中心のフランス軍を破るなど緒戦を優位に進め、長期の治世のもとイングランドは軍事的に大きく躍進した。騎士道精神を体現する栄誉あるガーター勲章を創設して国内貴族の結束を図る一方、この戦争の戦費調達の必要から議会(特に課税承認権を持つ庶民院)の役割が拡大し、王権と議会の関係にも大きな影響を与えた。' },
  { id:'peasants_revolt', name:'ワット・タイラーの乱(農民一揆)', category:'war', lat:51.51, lng:-0.13, start:1381, end:1381, region:'イングランド南東部',
    desc:'重い人頭税への不満から発生した、中世イングランド最大の農民反乱。ロンドンまで進軍する勢いを見せたが、指導者ワット・タイラーが交渉の場で殺害され鎮圧された。農奴制衰退の一因ともなった。' },
  { id:'wat_tyler', name:'ワット・タイラー', category:'person', lat:51.51, lng:-0.13, start:1341, end:1381, region:'イングランド',
    desc:'1381年の農民反乱(ワット・タイラーの乱)を指導した人物。ロンドンで国王リチャード2世との直接交渉に及んだが、交渉の場で市長らに殺害された。' },
  { id:'wars_of_roses', name:'薔薇戦争', category:'war', lat:52.58, lng:-1.13, start:1455, end:1487, region:'イングランド',
    desc:'ヘンリ6世の統治能力の欠如と百年戦争敗北への不満を背景に、王位継承をめぐって勃発したランカスター家(赤薔薇の紋章)とヨーク家(白薔薇の紋章)の内乱。有力諸侯がそれぞれの陣営に分かれて争う中で多くの貴族家系が断絶・弱体化し、最終的に両家の血を引くヘンリ=テューダー(ヘンリ7世)がボズワースの戦い(1485年)でリチャード3世を破って勝利、ヨーク家のエリザベスと結婚して両家の対立を統合し、テューダー朝を開くことで長期の内乱は終結した。この内乱を通じた有力貴族の疲弊は、結果的に次代テューダー朝における王権の強化・中央集権化を容易にする土壌ともなった。' },
  { id:'henry_vi_england', name:'ヘンリ6世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1421, end:1471, region:'イングランド(ランカスター朝)',
    desc:'生後間もなく即位した王で、成人後も統治能力に乏しく、断続的な精神疾患にも悩まされた。その治世下で百年戦争は劣勢に転じてフランスにおける領土をほぼ全て失い、対外的な失政への不満が国内の王位継承をめぐる対立(ランカスター家対ヨーク家)を先鋭化させて薔薇戦争が勃発、廃位と復位を繰り返す異例の経過をたどった末、最終的に幽閉先のロンドン塔で殺害されたとされる。' },
  { id:'edward_iv_england', name:'エドワード4世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1442, end:1483, region:'イングランド(ヨーク朝)',
    desc:'薔薇戦争でランカスター家を破り、ヨーク朝を開いた王。羊毛輸出関税の直接管理や貿易振興など財政・商業政策にも力を入れて王室財政の立て直しに成功したが、その死後は幼い息子たち(「塔の中の王子たち」)が弟リチャード3世によって王位を簒奪され、後に消息を絶ったことで王権の正統性をめぐる混乱を再燃させ、薔薇戦争の最終局面(テューダー朝の成立)へとつながる伏線となった。' },
  { id:'richard_iii_england', name:'リチャード3世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1452, end:1485, region:'イングランド(ヨーク朝)',
    desc:'兄エドワード4世の死後、甥の少年王エドワード5世の王位を簒奪して即位したイングランド最後のプランタジネット王。甥である「塔の中の王子たち」の失踪(暗殺したとの疑惑が根強い)は彼の評判を大きく損ない、この不信感を背景に亡命中のランカスター系ヘンリ=テューダーが挙兵、ボズワースの戦い(1485年)で敗死して薔薇戦争は終結した。2012年に駐車場跡地から遺骨が発見され話題となったことでも知られ、シェークスピア劇での極悪人としての描写は後世の評価に大きな影響を与えた。' },
  { id:'henry_vii_tudor', name:'ヘンリ7世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1457, end:1509, region:'イングランド(テューダー朝)',
    desc:'ランカスター家の傍流出身ながら、亡命先から帰還してボズワースの戦いに勝利しテューダー朝を開いた王。ヨーク家のエリザベス=オブ=ヨークと結婚して両家の血統を統合することで薔薇戦争の根本的な対立に終止符を打ち、王権に反抗しがちな有力貴族の私兵(家臣団)を制限する法整備や、星室庁裁判所を通じた貴族統制により王権を強化した。倹約的な財政運営と貿易振興(羊毛産業保護)によって王室財政を立て直し、次代ヘンリ8世期の安定した治世の基盤を築いた。' },
  { id:'tudor_dynasty', name:'テューダー朝', category:'dynasty', lat:51.51, lng:-0.13, start:1485, end:1603, region:'イングランド',
    desc:'薔薇戦争を終結させたヘンリ7世に始まる王朝。ヘンリ8世の離婚問題に端を発する宗教改革(イギリス国教会の創設)を経て、メアリ1世のカトリック復古とエリザベス1世のプロテスタント体制再確立という宗教的動揺を経験した。エリザベス1世治下ではスペイン無敵艦隊の撃退や海外進出の開始、シェークスピアに代表される文化的繁栄など「黄金時代」を謳歌し、イングランドが近世ヨーロッパの主権国家として確立する基盤を築いたが、彼女が生涯独身を貫いたため嗣子なく断絶し、スコットランド王家(ステュアート家)に王位が移ることになった。' },
  { id:'henry_viii', name:'ヘンリ8世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1491, end:1547, region:'イングランド(テューダー朝)',
    desc:'兄の未亡人キャサリンとの離婚(男子継承者を得るため)を教皇に認められなかったことを機に、ローマ教皇と決別してイギリス国教会を創設(首長令、1534年)し、修道院を解散してその広大な土地・財産を没収した王。生涯に6回結婚し、そのうち2人の王妃を処刑したことでも知られる。この宗教改革は当初教義的な動機よりも王の私的な離婚問題と王権強化(教会財産の接収による財政基盤拡大)を主眼としたものであったが、結果的にイングランドの主権国家化(教皇権からの独立)を大きく進める画期となった。' },
  { id:'english_reformation', name:'イギリス国教会の成立(イギリス宗教改革)', category:'event', lat:51.51, lng:-0.13, start:1534, end:1559, region:'イングランド',
    desc:'国王ヘンリ8世の離婚問題を機に、首長法(1534年)によりローマ教皇の権威を排して国王を頂点とするイギリス国教会が成立した宗教改革。教義的にはカトリックに近い要素を残しつつ、政治的には教皇からの独立を実現した。' },
  { id:'mary_i_england', name:'メアリ1世(ブラッディ・メアリ)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1516, end:1558, region:'イングランド(テューダー朝)',
    desc:'父ヘンリ8世の宗教改革によって離縁された母キャサリンの娘で、カトリックの復興を図りプロテスタントを弾圧(約300人を火刑に処した)したことから「ブラッディ=メアリ(血まみれのメアリ)」と呼ばれた女王。スペイン王フェリペ2世と結婚してカトリック陣営との結びつきを強めようとしたが、国民の反発を招き子にも恵まれず、対仏戦争でカレー(イングランド最後の大陸領土)を喪失するなど不人気な治世に終わり、その死後は異母妹エリザベス1世が即位してプロテスタント体制に回帰した。' },
  { id:'elizabeth_i', name:'エリザベス1世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1533, end:1603, region:'イングランド(テューダー朝)',
    desc:'姉メアリ1世のカトリック復古路線を転換し、穏健なプロテスタント路線(国教会の教義と儀礼の中間的な統一、統一令・信仰箇条の制定)でイギリス国教会体制を確立した女王。スペイン無敵艦隊を撃退して海上覇権への足がかりを築き、東インド会社の設立を認可するなど海外進出の基礎も固めた。シェークスピアら文人が活躍したこの時代は「エリザベス朝の黄金時代」と呼ばれる一方、後継者問題(生涯独身を貫き「処女王」と称された)を未解決のまま残したため、テューダー朝はその死をもって断絶し、王位はスコットランド王家(ステュアート家)に移った。' },
  { id:'spanish_armada', name:'スペイン無敵艦隊(アルマダ)の敗北', category:'war', lat:50.37, lng:-4.14, start:1588, end:1588, region:'イギリス海峡',
    desc:'スペイン王フェリペ2世が、プロテスタント国イングランドの征服とオランダ独立戦争へのイングランドの介入阻止を目的として派遣した大艦隊(「無敵艦隊」)。イングランド艦隊は機動力に優れた小型軽快船と長射程の艦砲を活かした戦術で対抗し、決定打こそ与えられなかったものの艦隊を混乱させ、さらに撤退の途中で暴風雨(「プロテスタントの風」と称された)に見舞われたスペイン艦隊は壊滅的な損害を被った。この敗北はスペインの海上覇権に大きな陰りをもたらす一方、イングランドの海洋国家・海軍国としての自信と国際的地位向上を象徴する出来事となった。' },
  { id:'james_i_england', name:'ジェームズ1世(イングランド王)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1566, end:1625, region:'イングランド・スコットランド同君連合',
    desc:'スコットランド王ジェームズ6世として即位していたが、エリザベス1世が嗣子なく没したことでイングランド王も兼ね、両国の同君連合(共通の王を戴きつつ議会・法制度は別)を成立させた王。『欽定訳聖書』の編纂を主導する一方、王権神授説を強く唱えて「王は神から直接権力を授かった存在であり議会にも法にも拘束されない」との主張を展開、課税や外交をめぐり議会との対立を深めた。この王権神授説と議会主権の対立は、次代チャールズ1世期の内戦(清教徒革命)へと直結する火種を残した。' },
  { id:'commonwealth_england', name:'イングランド共和国(コモンウェルス)', category:'nation', lat:51.51, lng:-0.13, start:1649, end:1660, region:'イングランド',
    desc:'チャールズ1世処刑後に成立した、イングランド史上唯一の共和政体制。当初は議会主導の統治を志向したが、議会内部の対立や急進派(水平派など)の台頭に手を焼いたクロムウェルが議会を武力で解散し、護国卿として事実上の軍事独裁権を握るに至った(護国卿政治)。厳格な清教徒的道徳統制(劇場閉鎖など娯楽の制限)は民衆の不満を蓄積させ、クロムウェルの死後まもなく後継体制は混乱に陥り、結局は亡命中のチャールズ2世を迎える王政復古によって幕を閉じた。' },
  { id:'oliver_cromwell', name:'オリバー・クロムウェル', category:'person', parentId:'commonwealth_england', lat:51.51, lng:-0.13, start:1599, end:1658, region:'イングランド共和国',
    desc:'清教徒(ピューリタン)の信仰に基づく規律ある新型軍(ニューモデル軍)を組織し、これを率いて議会派を勝利に導いた軍人・政治家。国王チャールズ1世を処刑して共和政(コモンウェルス)を樹立した後、内部対立に手を焼いた議会を武力で解散させ、自ら護国卿に就任して事実上の軍事独裁権を握った。対外的にはオランダ・スペインとの戦争で海運国としての地位を高めた一方、アイルランドへの徹底的な軍事制圧(虐殺を伴う)は現在も現地で強い反感の対象として記憶されている。厳格な清教徒道徳に基づく統制(演劇・娯楽の禁止)は民衆の不満を蓄積させ、その死後まもなく体制は崩壊した。' },
  { id:'charles_ii_restoration', name:'チャールズ2世(王政復古)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1630, end:1685, region:'イングランド',
    desc:'クロムウェル死後の混乱を経て、議会の招請により大陸から帰還し王政を復活させた王(王政復古)。当初は議会・国民との融和を図る現実的な統治を志向したが、晩年はフランス(ルイ14世)からの資金援助と引き換えにカトリックへの内密の傾倒を強め、専制的な傾向を強めて議会との緊張を再燃させた。この治世下で王位継承候補(弟ジェームズ)のカトリック信仰をめぐる対立から、後のホイッグ・トーリという二大政党の原型となる政治集団が形成された。' },
  { id:'james_ii_england', name:'ジェームズ2世', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1633, end:1701, region:'イングランド',
    desc:'兄チャールズ2世の跡を継いだ、公然のカトリック教徒であった王。カトリック教徒の公職就任を可能にする政策(信仰自由宣言)を強行して議会・国教会双方の強い反発を招き、男子の誕生(カトリックの王位継承が半永久化する懸念)を機に危機感を強めた議会有力者が、プロテスタントの娘メアリとその夫ウィリアム(オランダ総督)に介入を要請した。ほとんど無血のうちに軍事的抵抗を放棄して大陸へ亡命し(名誉革命)、この追放とウィリアム3世・メアリ2世の即位、権利章典の制定により、議会主権に基づく立憲君主政の基礎が確立した。' },
  { id:'act_of_union_1707', name:'1707年合同法(イングランド・スコットランド合同)', category:'treaty', lat:55.95, lng:-3.19, start:1707, end:1707, region:'グレートブリテン島',
    desc:'イングランドとスコットランドがそれぞれの議会で可決し、両国を統合してグレートブリテン王国を成立させた法律。スコットランドは深刻な財政危機(ダリエン計画の失敗)に直面しており経済的な便益(イングランドの海外市場・植民地貿易へのアクセス)を、イングランドはハノーヴァー家によるプロテスタント王位継承の確実な承継(スコットランドがステュアート家の王位僭称者を擁立するリスクの排除)をそれぞれ主な動機として合意に至った。両国の議会は統合されて単一のグレートブリテン議会となったが、スコットランドは独自の法制度・教会(長老派教会)・教育制度を保持することが認められ、これは現代に至るまでイギリスの地域的多様性を規定する要因となっている。' },
  { id:'george_i_britain', name:'ジョージ1世', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1660, end:1727, region:'グレートブリテン王国',
    desc:'アン女王の死により、遠縁ながらプロテスタントの血筋という条件(王位継承法)を満たす者として、ドイツのハノーファー選帝侯から迎えられた最初のハノーヴァー朝の王。英語をほとんど解さず、イギリス政治への関心も薄かったため、内閣(特に事実上の首席大臣ウォルポール)に統治の実務を委ねる傾向が強まり、国王が閣議を主宰しない慣行が定着、これが後の責任内閣制(「王は君臨すれども統治せず」)発展の重要な一因となった。' },
  { id:'robert_walpole', name:'ロバート・ウォルポール', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1676, end:1745, region:'グレートブリテン王国',
    desc:'南海泡沫事件(南海会社バブル崩壊)の財政的混乱の収拾に手腕を発揮して信任を得た政治家。「初代首相(プライム=ミニスター)」の異名で呼ばれる存在となり、国王(特に英語に疎いジョージ1世)ではなく議会(下院)の多数派の支持に基づいて統治する責任内閣制の慣行を確立、下院で多数派の支持を失えば内閣が総辞職するという後の立憲君主政・議院内閣制の核心原則の土台を築いた。約20年におよぶ長期政権を通じ平和外交と財政の安定を重視する現実的な統治を行った。' },
  { id:'seven_years_war', name:'七年戦争', category:'war', lat:51.34, lng:12.37, start:1756, end:1763, region:'ヨーロッパ・北米・インドなど世界各地',
    desc:'プロイセン・イギリスとオーストリア・フランス・ロシアなどが対立した大規模な国際戦争。ヨーロッパ本土だけでなく北米(フレンチ・インディアン戦争)やインドにも戦線が広がり、「最初の世界大戦」とも評される。イギリスはこの戦争でフランスから北米・インドの覇権を大きく奪った。' },
  { id:'queen_victoria', name:'ヴィクトリア女王', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1819, end:1901, region:'グレートブリテン及びアイルランド連合王国',
    desc:'64年に及ぶ治世のもとイギリスが産業革命の成果を最大限に享受し、「世界の工場」「パクス=ブリタニカ」と呼ばれる経済的・軍事的最盛期を迎えた女王。夫アルバート公の死後は長く喪に服して公務から遠ざかったが、晩年にはディズレーリの提案でインド皇帝の称号も兼ね、大英帝国の絶頂期を象徴する存在となった。彼女の治世(ヴィクトリア朝)は、道徳的厳格さと社会的規範の重視、階級社会の成熟、女性の役割をめぐる保守的な家庭観など、独特の時代精神(ヴィクトリアニズム)を体現するものとしても記憶される。' },
  { id:'disraeli', name:'ベンジャミン・ディズレーリ', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1804, end:1881, region:'イギリス',
    desc:'ユダヤ系出身という当時としては異色の経歴を持ちながら保守党を率いて首相となった政治家。スエズ運河会社の株式を買収してエジプトへの影響力を確保し、ヴィクトリア女王に「インド皇帝」の称号を贈るなど積極的な帝国主義政策(「ビーコンズフィールド主義」)を推進する一方、労働者階級への選挙権拡大(1867年第2次選挙法改正)や公衆衛生法の制定など、保守党による社会改革(「一国保守主義」)にも取り組み、労働者層の支持獲得を図った。' },
  { id:'gladstone', name:'ウィリアム・グラッドストン', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1809, end:1898, region:'イギリス',
    desc:'自由党を率い、生涯に4度にわたり首相を務めた政治家。財政均衡と自由貿易を重視する古典的自由主義の立場から行財政改革・選挙法改正(1884年第3次選挙法改正)・教育改革を推進したが、晩年に党の分裂を賭して取り組んだアイルランド自治法案は、自由党内の反対派(自由統一党の離反)や貴族院の抵抗により2度にわたり否決され、アイルランド自治は実現しないまま20世紀に持ち越されることになった。ライバルであった保守党のディズレーリとの対比(自由主義的改革対帝国主義)は、ヴィクトリア朝後期の政治対立の縮図としてしばしば語られる。' },
  { id:'corn_laws_repeal', name:'穀物法の廃止', category:'event', lat:51.51, lng:-0.13, start:1846, end:1846, region:'イギリス',
    desc:'地主階級の利益保護のため穀物輸入に高関税を課していた穀物法を、コブデン・ブライトらが組織した反穀物法同盟の運動と、アイルランド大飢饉の深刻化を直接のきっかけとして、保守党の首相ピールが自らの党の伝統的支持基盤(地主層)の反対を押し切って廃止した出来事。安価な輸入穀物の流入により労働者の生活費(パン価格)が抑えられ、これにより工業資本家は名目賃金を上昇させずに労働者を確保できるようになったことから、この決定は自由貿易主義への政策転換と、地主階級に代わり産業資本家階級がイギリス経済政策の主導権を握ったことを象徴する画期とされる。ピール自身はこの決定により保守党を分裂させ、まもなく首相の座を追われた。' },
  { id:'irish_famine', name:'アイルランド大飢饉(ジャガイモ飢饉)', category:'event', lat:53.35, lng:-6.26, start:1845, end:1849, region:'アイルランド',
    desc:'ジャガイモ疫病(疫病菌)による数年連続の大凶作を直接の原因とする大規模な飢饉。当時のアイルランドは人口の多くが単一品種のジャガイモに主食を依存する脆弱な農業構造にあり、しかもイギリス政府(自由放任主義的な経済思想)の対応が遅れ限定的であったことが被害を深刻化させたとされる。100万人以上が餓死し、さらに100万人以上が北米などへ移住(大量移民)したとされ、人口の激減はアイルランド社会に長期にわたる傷跡を残し、イギリス統治への不信・怒りはその後のアイルランド独立運動(フィニアン運動、後の自治運動・独立戦争)が高まる大きな背景となった。' },
  { id:'chartism', name:'チャーティスト運動', category:'event', lat:53.48, lng:-2.24, start:1838, end:1857, region:'イギリス(工業都市中心)',
    desc:'1832年の第1次選挙法改正が中産階級にしか選挙権を拡大しなかったことへの不満から、労働者階級が「人民憲章(ピープルズ=チャーター)」を掲げて展開した最初期の大規模な組織的政治運動。成年男性普通選挙権・無記名投票・議員の財産資格撤廃・議員への歳費支給など6つの要求は議会に複数回請願として提出されたが、いずれも否決され当時は実現しなかった。しかし労働者階級が自らの政治的権利拡大を求めて組織的に行動したこの運動は、後の労働組合運動・労働党結成の先駆けとなり、掲げられた要求の大半は19世紀末までに(男子普通選挙権を除き、段階的に)実現されることになった。' },
  { id:'crimean_war', name:'クリミア戦争', category:'war', lat:44.6, lng:34.0, start:1853, end:1856, region:'クリミア半島(黒海沿岸)',
    desc:'ロシアの南下政策をめぐり、オスマン帝国とそれを支援するイギリス・フランスがロシアと戦った戦争。ナイティンゲールの看護活動で知られるほか、ロシアの敗北は国内改革(農奴解放など)を促す契機となった。' },
  { id:'suffragette_movement', name:'女性参政権運動(サフラジェット)', category:'revolution', lat:51.51, lng:-0.13, start:1865, end:1918, region:'イギリス',
    desc:'エメリン=パンクハーストらが率いる婦人社会政治連盟(WSPU)を中心に、女性への参政権付与を求めて展開された運動。当初の穏健な請願運動(サフラジスト)では成果が上がらなかったことから、店舗のガラス窓破壊や放火、ハンガーストライキ(獄中での強制摂食を招いた)といった過激な直接行動(サフラジェット)へと戦術を先鋭化させ、社会に大きな衝撃を与えた。第一次世界大戦中に女性が軍需工場などで果たした貢献も追い風となり、大戦終結直後の1918年、一定の年齢・財産条件のもとで女性参政権が初めて認められ(1928年には男女平等の普通選挙が実現)、20世紀における市民権拡大の重要な画期となった。' },
  { id:'boer_war', name:'ボーア戦争(南アフリカ戦争)', category:'war', lat:-26.2, lng:28.05, start:1899, end:1902, region:'南アフリカ',
    desc:'イギリスと、オランダ系入植者(ボーア人)が建てたトランスヴァール共和国・オレンジ自由国との間で戦われた戦争。イギリスは勝利し南アフリカを併合したが、強制収容所の使用など苛烈な戦争として国際的な批判も招いた。' },
  { id:'easter_rising', name:'イースター蜂起', category:'war', lat:53.35, lng:-6.26, start:1916, end:1916, region:'アイルランド(ダブリン)',
    desc:'アイルランドの独立を求めてダブリンで起きた武装蜂起。当初は市民の支持を得られず短期間で鎮圧されたが、指導者の処刑が世論を硬化させ、その後のアイルランド独立運動を大きく後押しした。' },
  { id:'irish_independence', name:'アイルランド自由国の成立', category:'event', lat:53.35, lng:-6.26, start:1921, end:1922, region:'アイルランド',
    desc:'英愛条約により、アイルランド島南部にイギリス連邦内の自治領としてアイルランド自由国が成立した出来事。北部アイルランド(北アイルランド)はイギリスに残留し、後の紛争の火種を残した。' },
  { id:'nhs_welfare_state', name:'福祉国家の建設(国民保健サービス発足)', category:'event', lat:51.51, lng:-0.13, start:1945, end:1948, region:'イギリス',
    desc:'第二次世界大戦後、アトリー労働党政権のもとで進められた社会保障制度の整備。1948年に発足した国民保健サービス(NHS)は原則無料の医療を提供する制度として、「ゆりかごから墓場まで」と呼ばれる福祉国家体制の中核となった。' },
  { id:'thatcher', name:'マーガレット・サッチャー', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1925, end:2013, region:'イギリス',
    desc:'イギリス史上初の女性首相として「鉄の女」の異名をとった保守党の首相(在任1979〜1990年)。長期にわたる経済停滞(「英国病」)からの脱却を掲げ、国有企業の民営化、規制緩和、労働組合の権限抑制(炭鉱労働者ストライキとの対決)など新自由主義的な構造改革(サッチャリズム)を断行して経済を立て直す一方、フォークランド紛争(1982年)での勝利は国民的な支持を高めた。しかしこの強硬な政治手法と格差拡大は国内に深い分断も残し、不人気な人頭税(コミュニティ=チャージ)導入を機に党内の支持を失って退陣した。' },
  { id:'falklands_war', name:'フォークランド紛争', category:'war', lat:-51.8, lng:-59.5, start:1982, end:1982, region:'南大西洋(フォークランド諸島)',
    desc:'アルゼンチンが領有権を主張して占領したフォークランド諸島を、イギリスが軍を派遣して奪還した紛争。サッチャー政権の威信を大きく高め、国内的な人気回復につながった。' },
  { id:'good_friday_agreement', name:'ベルファスト合意(グッドフライデー合意)', category:'treaty', lat:54.6, lng:-5.93, start:1998, end:1998, region:'北アイルランド(ベルファスト)',
    desc:'北アイルランドにおけるプロテスタント系住民とカトリック系住民との長年の紛争(北アイルランド紛争)に終止符を打った和平合意。自治政府の設置などを定め、長期にわたった暴力の連鎖に一応の終わりをもたらした。' },

  /* =====================================================================
     ④ フランス史 追加データ(カペー朝〜第五共和政)
     ===================================================================== */
  { id:'hugh_capet', name:'ユーグ・カペー', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:940, end:996, region:'フランス',
    desc:'カロリング朝断絶の危機に際し、西フランク貴族の合議によって選出されて即位し、カペー朝を開いた王。当初の王領(直轄地)はパリとオルレアンを結ぶごく狭い地域に限られ、シャンパーニュ・ノルマンディー・アキテーヌなど有力諸侯の方がはるかに広大な領地と実質的な独立性を有していたため、王権は名目的なものに過ぎなかった。しかし世襲による安定した王位継承と、この家系が800年以上にわたりフランス王位を保持し続けたことで、長期的には中央集権化の礎となった。' },
  { id:'capetian_dynasty', name:'カペー朝', category:'dynasty', lat:48.86, lng:2.35, start:987, end:1328, region:'フランス',
    desc:'ユーグ=カペーに始まる王朝。当初は王権が弱く諸侯が事実上独立した支配を行っていたが、フィリップ2世がイングランド王家の大陸領を奪って王領を倍増させ、ルイ9世が公正な統治で王権の権威を高め、フィリップ4世が三部会招集や教皇との対決を通じて王権の優位を確立するなど、歴代の王が着実に中央集権化を進めた。1328年、シャルル4世の死により男系直系が断絶し、傍系のヴァロワ家が即位したが、この王位継承問題こそが百年戦争の引き金となった。' },
  { id:'philip_ii_augustus', name:'フィリップ2世(尊厳王)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1165, end:1223, region:'フランス',
    desc:'「尊厳王」と呼ばれた王。イングランド王ジョン(欠地王)がフランス国内に有していた広大な所領(アンジュー帝国、ノルマンディー・アンジュー・アキテーヌなど)の大半を封建法上の理由(臣従義務違反)を口実に没収・征服し、王領を一挙に数倍に拡大した。神聖ローマ皇帝・イングランド王らの連合軍をブーヴィーヌの戦い(1214年)で破ってこの領土拡大を確定させ、この勝利は王権の威信を大きく高めるとともに、イングランドでは敗北の余波がマグナ=カルタ(大憲章)締結という王権制限につながるなど、英仏両国のその後の政治発展に対照的な影響を与えた。' },
  { id:'louis_ix_saint', name:'ルイ9世(聖王)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1214, end:1270, region:'フランス',
    desc:'公正な統治(「樫の木の下の裁判」の逸話で知られる直接の司法介入)で知られ、死後カトリック教会から列聖された唯一のフランス国王。国内では地方行政官(バイイ・セネシャル)の監督強化や王国貨幣の統一など統治機構の整備を進めて王権の実質的な浸透を図った一方、対外的には敬虔な信仰心から第6回・第7回十字軍を自ら率いて主導したが、いずれもエジプト・チュニジアでの遠征失敗に終わり、自身も第7回遠征中にチュニスで疫病により陣没した。' },
  { id:'philip_iv_fair', name:'フィリップ4世(端麗王)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1268, end:1314, region:'フランス',
    desc:'「端麗王」と呼ばれた王。フランドル(毛織物産業の富)への課税や聖職者への課税をめぐって教皇ボニファティウス8世と激しく対立し、その軍勢に教皇をアナーニで一時捕縛させる(アナーニ事件)という前例のない実力行使に出て、教皇権に対する王権の優位を決定的に示した。この対立の過程で聖職者・貴族に加え都市代表(第三身分)も交えた三部会を初めて招集し、身分制議会を通じた国民的支持の調達という新たな統治手法を確立した。後継教皇クレメンス5世を事実上の影響下に置いて教皇庁をアヴィニョンに移させ(教皇のバビロン捕囚)、また莫大な負債を帳消しにするためテンプル騎士団を異端として弾圧・解散させその財産を没収するなど、王権強化のためには既存の宗教的権威をも従属させる現実主義的な統治を徹底した。' },
  { id:'avignon_papacy', name:'教皇のバビロン捕囚(アヴィニョン捕囚)', category:'event', lat:43.95, lng:4.81, start:1309, end:1377, region:'アヴィニョン(南フランス)',
    desc:'フランス王フィリップ4世の圧力のもと、教皇庁がローマからアヴィニョンへ移された出来事。以後約70年間、歴代教皇はフランス王の強い影響下に置かれ、教皇権威の低下を象徴する事件となった。' },
  { id:'templars_suppression', name:'テンプル騎士団の弾圧・解散', category:'event', lat:48.86, lng:2.35, start:1307, end:1314, region:'フランス',
    desc:'フィリップ4世が財政難と騎士団の莫大な富を背景に、テンプル騎士団を異端の罪で弾圧した事件。団長ジャック・ド・モレーらは処刑され、騎士団は解散に追い込まれた。' },
  { id:'valois_dynasty', name:'ヴァロワ朝', category:'dynasty', lat:48.86, lng:2.35, start:1328, end:1589, region:'フランス',
    desc:'カペー家男系断絶後、傍系のヴァロワ伯フィリップ6世が即位した王朝。イングランド王エドワード3世が母方を通じてフランス王位継承権を主張したことから百年戦争(1339〜1453年)が勃発し、一時はイングランドにパリを含む北フランスを占領される危機に陥ったが、ジャンヌ=ダルクの登場を機にシャルル7世が反攻に転じて勝利した。以後フランソワ1世期のイタリア戦争(対ハプスブルク家)、アンリ2世死後のユグノー戦争(宗教内戦)を経て王朝は男系断絶し、ブルボン家のアンリ4世に王位が移った。' },
  { id:'charles_vii_france', name:'シャルル7世(勝利王)', category:'person', parentId:'france_kingdom', lat:47.9, lng:1.91, start:1403, end:1461, region:'フランス',
    desc:'「勝利王」と呼ばれた王。即位当初は北フランスの大半をイングランド・ブルゴーニュ派に占領され「ブールジュの王」と揶揄される劣勢にあったが、ジャンヌ=ダルクの登場を機に反攻に転じ、オルレアン解放とランスでの戴冠式を経て国内の支持を回復した。戦争を通じて常備軍(勅令中隊)の創設や恒久的な直接税(タイユ)の徴収制度を整えるなど軍制・財政の改革を進め、百年戦争終結(1453年)とともにイングランド勢力を大陸からほぼ完全に駆逐して、以後のフランス王権の中央集権化を大きく前進させた。' },
  { id:'louis_xi_france', name:'ルイ11世(蜘蛛王)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1423, end:1483, region:'フランス',
    desc:'「蜘蛛王」と渾名された、謀略と外交を駆使する現実主義的な王。当時フランス王権最大の脅威であったブルゴーニュ公シャルル(突進公)を、スイス諸邦やロレーヌ公と結んで対抗させ、シャルルの戦死後にブルゴーニュ公領の大半を併合するなど、武力よりも計略・買収・離間策を好んで用いて有力諸侯を各個撃破していった。この治世を通じて王領は大幅に拡大し、後のフランス絶対王政確立に向けた重要な地ならしとなった。' },
  { id:'italian_wars', name:'イタリア戦争', category:'war', lat:45.46, lng:9.19, start:1494, end:1559, region:'イタリア半島',
    desc:'イタリアの覇権をめぐり、フランス(ヴァロワ家)と神聖ローマ帝国・スペイン(ハプスブルク家)が半世紀以上にわたり争った一連の戦争。最終的にハプスブルク家が優位に立ち、イタリアにおけるフランスの野望は挫折した。' },
  { id:'francis_i_france', name:'フランソワ1世', category:'person', parentId:'france_kingdom', lat:48.8, lng:2.12, start:1494, end:1547, region:'フランス',
    desc:'神聖ローマ皇帝カール5世のライバルとして、イタリアの覇権とヨーロッパにおける威信をめぐりイタリア戦争を戦い続けた王。パヴィアの戦いで大敗し自ら捕虜となる屈辱を味わいながらも、オスマン帝国のスレイマン1世と同盟する(キリスト教国とイスラーム国家の初の本格的同盟)など柔軟な外交で対抗した。レオナルド=ダ=ヴィンチを晩年フランスに招き、フォンテーヌブロー宮殿の造営やコレージュ=ド=フランスの設立を進めるなど、イタリア=ルネサンス文化をフランスに本格的に移植した文化的君主としても知られる。' },
  { id:'henry_ii_france', name:'アンリ2世', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1519, end:1559, region:'フランス',
    desc:'フランソワ1世の子。父の代からのイタリア戦争を継続し、カトー=カンブレジ条約(1559年)で最終的にハプスブルク家優位のうちにこれを終結させたが、その和平を祝う馬上槍試合中の事故で急死した。彼の急死は、幼い息子たちが相次いで即位する不安定な状況と、王妃カトリーヌ=ド=メディシスによる長期の摂政・後見政治を招き、新旧両派(カトリックとユグノー)の対立が抑えられなくなってユグノー戦争(宗教内戦)へと突入していく直接の契機となった。' },
  { id:'catherine_de_medici', name:'カトリーヌ・ド・メディシス', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1519, end:1589, region:'フランス',
    desc:'アンリ2世の王妃で、フィレンツェのメディチ家出身。夫の急死後、幼い息子たち(フランソワ2世・シャルル9世・アンリ3世)の摂政・後見として長年フランス政治の実権を握った。当初はカトリック・ユグノー両派の融和(宥和)政策を模索したが、宗教対立の激化を抑えきれず、1572年の聖バルテルミの虐殺(サンバルテルミの虐殺)ではユグノー指導者殺害を容認・関与したとされ、ユグノー戦争の泥沼化に大きな責任を負うことになった。' },
  { id:'french_wars_of_religion', name:'ユグノー戦争(フランス宗教戦争)', category:'war', lat:48.86, lng:2.35, start:1562, end:1598, region:'フランス',
    desc:'カトリックとカルヴァン派新教徒(ユグノー)との間で断続的に戦われた内戦。国土は荒廃したが、最終的にユグノーから改宗したブルボン家のアンリ4世がナントの王令を発して収拾した。' },
  { id:'st_bartholomew_massacre', name:'サンバルテルミの虐殺', category:'event', lat:48.86, lng:2.35, start:1572, end:1572, region:'パリ',
    desc:'カトリック勢力がユグノー(新教徒)を大量に殺害した事件。パリでの虐殺は地方にも波及し、数千人から数万人ともいわれる犠牲者を出し、宗教戦争をいっそう激化させた。' },
  { id:'henry_iv_france', name:'アンリ4世', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1553, end:1610, region:'フランス',
    desc:'ユグノー(プロテスタント)の指導者ブルボン家アンリ(ナヴァル王)として即位が決まったが、カトリック教徒多数のパリ入城のためカトリックに改宗し(「パリはミサに値する」の言葉で知られる)、ブルボン朝を開いた王。1598年のナントの王令によりユグノーに一定の信仰の自由と要塞都市の保有を認めてユグノー戦争(約30年続いた宗教内戦)を終結させ、宰相シュリーの補佐のもとで財政再建と農業振興に努めて、荒廃した王国の復興を軌道に乗せた。しかし依然として続く宗教的緊張の中、カトリック狂信者に暗殺されるという劇的な最期を遂げた。' },
  { id:'edict_of_nantes', name:'ナントの王令', category:'treaty', lat:47.22, lng:-1.55, start:1598, end:1598, region:'フランス(ナント)',
    desc:'アンリ4世が発した勅令。カトリックを国教としつつユグノー(新教徒)に一定の信仰の自由と要塞都市の保持を認め、長期化したユグノー戦争を終結させた画期的な宗教的寛容策。' },
  { id:'bourbon_dynasty', name:'ブルボン朝', category:'dynasty', lat:48.86, lng:2.35, start:1589, end:1792, region:'フランス',
    desc:'ユグノー(プロテスタント)の指導者であったナヴァル王アンリ(アンリ4世)がカトリックに改宗して即位した王朝。リシュリュー・マザランの補佐のもとで貴族勢力(フロンドの乱)を抑え込み、ルイ14世期に「朕は国家なり」に象徴される絶対王政の頂点を迎えてヨーロッパ随一の強国となったが、度重なる対外戦争による財政悪化と、ルイ16世期の財政破綻・凶作・啓蒙思想の広まりが重なってフランス革命を招き、1792年王政は廃止されて国王も処刑された(その後王政復古を経て1830年七月革命で最終的に断絶)。' },
  { id:'louis_xiii_france', name:'ルイ13世', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1601, end:1643, region:'フランス',
    desc:'9歳で即位した王。母后マリー=ド=メディシスの摂政期を経て親政を開始すると、宰相リシュリューを重用してその統治を全面的に委ね、王権に抵抗する大貴族の陰謀を次々に鎮圧するとともに、軍事拠点となっていたユグノーの要塞都市ラ=ロシェルを攻略してその政治的・軍事的自立性を奪った。国内の中央集権化と対外的な三十年戦争への介入(反ハプスブルク政策)を同時に進めたこの治世は、次代ルイ14世期の絶対王政確立への直接の土台を築いた。' },
  { id:'richelieu', name:'リシュリュー(枢機卿宰相)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1585, end:1642, region:'フランス',
    desc:'ルイ13世のもとで宰相を務めたカトリック聖職者・政治家。国内では地方長官(アンタンダン)を各地に派遣して国王直属の行政網を整備し、大貴族の陰謀を弾圧するとともにユグノーの軍事的拠点ラ=ロシェルを攻略してその政治的独立性を解体するなど、「国王の権威の下への統一」を徹底した。対外的には三十年戦争において、自国がカトリック国でありながら神聖ローマ皇帝(ハプスブルク家)の勢力削減を優先し新教国側(スウェーデンなど)を財政支援するという、宗教よりも国益(レゾン=デタ)を最優先する現実主義外交を展開し、この路線は近代国際政治における国家理性の先駆的実践として評価される。' },
  { id:'mazarin', name:'マザラン(枢機卿宰相)', category:'person', parentId:'france_kingdom', lat:48.86, lng:2.35, start:1602, end:1661, region:'フランス',
    desc:'リシュリューの後継としてイタリア出身ながら宰相に登用され、幼少のルイ14世とその母后アンヌ=ドートリッシュを支えた宰相。中央集権化の強化に反発した高等法院や貴族による大規模な反乱(フロンドの乱、1648〜53年)に直面したが、これを鎮圧して王権の優位を再確認させ、若きルイ14世に貴族への根深い不信感を植え付ける契機ともなった。対外的には三十年戦争を終結させたウェストファリア条約(1648年)、続くスペインとのピレネー条約(1659年)を通じてフランスに有利な国境線と大国としての地位を確立し、次代の絶対王政最盛期の外交的基盤を整えた。' },
  { id:'fronde', name:'フロンドの乱', category:'revolution', lat:48.86, lng:2.35, start:1648, end:1653, region:'フランス',
    desc:'ルイ14世の幼少期、宰相マザランの専制に反発した高等法院・貴族が起こした一連の反乱。最終的に王権側が勝利し、この経験は成人後のルイ14世が強力な絶対王政を志向する一因になったとされる。' },
  { id:'revocation_edict_nantes', name:'ナントの王令廃止(フォンテーヌブローの勅令)', category:'event', lat:48.4, lng:2.7, start:1685, end:1685, region:'フランス(フォンテーヌブロー)',
    desc:'ルイ14世がナントの王令を廃止し、プロテスタント信仰を事実上禁止した勅令。多数の有能なユグノーが国外(オランダ・プロイセン・イギリスなど)へ亡命し、フランスは経済的に大きな損失を被った。' },
  { id:'war_spanish_succession', name:'スペイン継承戦争', category:'war', lat:48.86, lng:2.35, start:1701, end:1714, region:'ヨーロッパ全域',
    desc:'スペイン=ハプスブルク家の断絶を機に、ルイ14世の孫をスペイン王に据えようとしたフランスと、それに反対するイギリス・オーストリアなどが戦った大戦争。ユトレヒト条約により終結し、フランスの覇権的膨張には歯止めがかけられた。' },
  { id:'louis_xv_france', name:'ルイ15世', category:'person', parentId:'france_kingdom', lat:48.8, lng:2.12, start:1710, end:1774, region:'フランス',
    desc:'ルイ14世のひ孫にあたり、幼くして即位した王(摂政期を経て親政)。七年戦争(1756〜63年)でイギリスに敗れ、パリ条約(1763年)で北米(カナダ)・インドの拠点の大半を失うなど、祖父の代に築かれた大国としての対外的威信を大きく低下させた。国内では高等法院との対立が続いて行財政改革は停滞し、寵妃ポンパドゥール夫人らの影響力をめぐる宮廷内対立も相まって統治は次第に停滞、財政赤字は拡大の一途をたどり、この治世の負の遺産が孫ルイ16世期のフランス革命を準備することになった。' },
  { id:'estates_general_1789', name:'三部会の招集(1789年)', category:'event', lat:48.8, lng:2.12, start:1789, end:1789, region:'ヴェルサイユ',
    desc:'財政総監ネッケルの進言を受け、財政危機打開のための新税承認を目的として、ルイ16世が実に175年ぶりに招集した聖職者・貴族・平民の三身分からなる身分制議会。議決方法(身分別か頭数別か)をめぐり、平民出身議員が人口の圧倒的多数を占める第三身分の発言力強化を求めて特権身分と激しく対立し、交渉が決裂すると第三身分は独自に「国民議会」の成立を宣言(球戯場の誓い)して憲法制定を目指すに至った。この身分制議会という旧来の枠組み自体からの離脱こそが、フランス革命勃発の直接の引き金となった。' },
  { id:'tennis_court_oath', name:'テニスコートの誓い', category:'event', lat:48.8, lng:2.12, start:1789, end:1789, region:'ヴェルサイユ',
    desc:'三部会から分離した第三身分の代表らが、憲法制定まで解散しないことを誓った宣言。国民議会(後の憲法制定国民議会)の成立を宣言する行為であり、革命の出発点の一つとされる。' },
  { id:'storming_bastille', name:'バスティーユ牢獄襲撃', category:'war', lat:48.85, lng:2.37, start:1789, end:1789, region:'パリ',
    desc:'国王による軍隊のパリ集結と改革派財務総監ネッケルの罷免に危機感を強めたパリ市民が、武器弾薬の入手を目的に、専制の象徴とみなされていた牢獄・要塞バスティーユを武装蜂起して攻略した事件。守備隊は降伏したが、群衆は司令官を殺害してその首をさらすなど、革命の暴力的性格を早くも露呈させた。国王がパリへの軍事介入を断念せざるを得なくなったこの事件は、絶対王政の権威が実力によって覆されうることを示した革命の始まりの象徴とされ、7月14日は現在もフランスの革命記念日(建国記念日)とされている。' },
  { id:'declaration_rights_of_man', name:'人間と市民の権利の宣言(人権宣言)', category:'treaty', lat:48.8, lng:2.12, start:1789, end:1789, region:'フランス',
    desc:'国民議会が採択した、自由・平等・国民主権・所有権の不可侵などを謳う宣言。アメリカ独立宣言や啓蒙思想の影響を強く受け、以後の近代憲法・人権思想の基本文書として各国に大きな影響を与えた。' },
  { id:'reign_of_terror', name:'恐怖政治', category:'event', lat:48.86, lng:2.35, start:1793, end:1794, region:'フランス',
    desc:'対外戦争の劣勢とヴァンデーの反乱など国内の反革命蜂起という内外の危機を背景に、ジャコバン派(山岳派)・ロベスピエールらが公安委員会を通じて非常体制を敷き、反革命容疑者法のもとで容疑者を次々に裁判の形式を簡略化してギロチンで処刑した時期。国王・王妃をはじめ、穏健派のジロンド派、さらには革命派内部の対立者(エベール派・ダントン派)にまで粛清の対象が及び、数万人が処刑・投獄された。過剰な暴力への反動と権力集中への恐怖から、最終的にロベスピエール自身もテルミドールのクーデタで失脚・処刑され、この時期は終結した。' },
  { id:'directory_france', name:'総裁政府', category:'nation', lat:48.86, lng:2.35, start:1795, end:1799, region:'フランス',
    desc:'ロベスピエール処刑(テルミドールのクーデタ)後の反動の中、1795年憲法により発足した5人の総裁による集団指導体制。急進化した革命の反動として穏健な有産市民層(ブルジョワジー)が実権を握ったが、左右両翼(王党派とジャコバン派残党)からの絶えざる攻撃と経済混乱、対外戦争の重圧に苦しみ、政治的基盤は終始不安定であった。この機能不全の中、対外戦争で名声を高めていたナポレオン=ボナパルトが1799年のブリュメール18日のクーデタで総裁政府を打倒し、フランス革命は実質的な終わりを迎えた。' },
  { id:'coup_18_brumaire', name:'ブリュメール18日のクーデタ', category:'event', lat:48.86, lng:2.35, start:1799, end:1799, region:'パリ',
    desc:'対外戦争の劣勢と国内の政情不安に有効な対応ができずにいた総裁政府に対し、エジプト遠征から帰国したナポレオン=ボナパルトが、シェイエスら一部の総裁と結んで軍を動員し、議会を武力で威嚇して憲法を停止させたクーデタ。これにより総裁政府は倒され、ナポレオン・シェイエス・デュコスの3統領からなる統領政府が樹立されたが、まもなくナポレオンが第一統領として事実上の独裁権を握り、フランス革命は実質的に終結してナポレオン時代が始まった。' },
  { id:'french_empire_napoleon', name:'フランス帝国(第一帝政)', category:'nation', lat:48.86, lng:2.35, start:1804, end:1815, region:'フランス',
    desc:'国民投票を経てナポレオン1世が皇帝に即位して成立した帝政。『ナポレオン法典(民法典)』の制定により、革命の成果である法の下の平等・私有財産の不可侵・世俗的婚姻などをフランス法制度に確定させ、その後占領地にも広く移植して近代ヨーロッパ大陸法の原型を提供した。軍事的にはアウステルリッツの戦いなどでヨーロッパの大半を征服・従属させて大陸封鎖令でイギリス経済封鎖を試みたが、ロシア遠征(1812年)の壊滅的失敗を機に急速に瓦解し、1814年の退位、百日天下を経て1815年のワーテルローの敗北で完全に崩壊した。' },
  { id:'bourbon_restoration', name:'ブルボン復古王政', category:'event', lat:48.86, lng:2.35, start:1814, end:1830, region:'フランス',
    desc:'ナポレオン没落後、ブルボン家の王政が復活した時期。ルイ18世・シャルル10世のもとで革命前の体制への回帰が図られたが、七月革命により再び王政は倒れた。' },
  { id:'louis_xviii', name:'ルイ18世', category:'person', parentId:'bourbon_dynasty', lat:48.86, lng:2.35, start:1755, end:1824, region:'フランス',
    desc:'フランス革命で処刑されたルイ16世の弟。ナポレオン没落後、対仏大同盟諸国の後押しを受けて即位し、王政復古(ブルボン復古王政)を開始した。革命前への完全な回帰は不可能と判断し、両院制議会や個人の自由・所有権の保障を含む立憲的な憲章(シャルト)を自ら発布して、革命の主要な成果と王政の伝統的権威との折り合いを模索する比較的穏健な統治を行ったが、王党派(特に弟シャルルを支持する超王党派)との間には常に緊張関係を抱えていた。' },
  { id:'charles_x_france', name:'シャルル10世', category:'person', parentId:'bourbon_dynasty', lat:48.86, lng:2.35, start:1757, end:1836, region:'フランス',
    desc:'兄ルイ18世の穏健路線に飽き足らない超王党派に推されて即位した王。亡命貴族への補償金支給、教会権威の復活、出版統制の強化など反動的・専制的な政治を強め、選挙結果を無視して自由主義的な下院を解散、報道の自由を停止する勅令(七月勅令)を発布したことがパリ市民の武装蜂起(七月革命、1830年)を招いた。わずか3日間の市街戦(栄光の三日間)で退位・亡命に追い込まれ、これによりブルボン朝の直系(本家)は断絶し、傍系オルレアン家のルイ=フィリップに王位が移った。' },
  { id:'july_revolution_1830', name:'七月革命', category:'revolution', lat:48.86, lng:2.35, start:1830, end:1830, region:'パリ',
    desc:'シャルル10世の反動政治に対しパリ市民が蜂起した革命。国王は亡命に追い込まれ、代わって自由主義的な貴族ルイ・フィリップを王に迎える七月王政が成立した。' },
  { id:'july_monarchy', name:'七月王政', category:'nation', lat:48.86, lng:2.35, start:1830, end:1848, region:'フランス',
    desc:'シャルル10世の反動政治への反発から起きた七月革命(1830年)を受け、貴族院・議会の推戴によりオルレアン家のルイ=フィリップが「フランス人の王」として即位した立憲君主政。制限選挙制のもと銀行家・大資本家など高額納税者(金融ブルジョワジー)が政治を独占する体制であったため、産業革命の進展で台頭した産業資本家や労働者層は選挙権拡大(選挙法改正)を要求し続け、この要求を弾圧したことが1848年の二月革命を招く直接の原因となった。' },
  { id:'louis_philippe', name:'ルイ・フィリップ', category:'person', parentId:'july_monarchy', lat:48.86, lng:2.35, start:1773, end:1850, region:'フランス',
    desc:'七月革命の混乱を収拾するため、自由主義貴族や銀行家らの推戴で「フランス人の王」として迎えられたオルレアン家出身の王。当初は市民的で開明的な君主として歓迎されたが、統治の実態は制限選挙制のもとで銀行家・大資本家など高額納税者(金融ブルジョワジー)の利益を優先するものであり、産業革命の進展で台頭した産業資本家や労働者からの選挙権拡大要求を一貫して弾圧し続けた。この抑圧的姿勢への反発が1848年の二月革命を招き、退位・亡命に追い込まれてフランスにおける王政は事実上終焉した。' },
  { id:'february_revolution_1848_france', name:'二月革命', category:'revolution', lat:48.86, lng:2.35, start:1848, end:1848, region:'パリ',
    desc:'七月王政下での制限選挙制への不満と、選挙法改正運動(改革宴会)への政府の弾圧を機にパリで勃発した革命。市街戦の末、国王ルイ=フィリップは退位・亡命し、臨時政府のもとで男性普通選挙制の導入と第二共和政の成立が宣言された。当初は労働者の権利拡充(国立作業場の設置など社会主義的施策)も試みられたが、財政負担への批判からまもなく反動化し、この過程で強い指導力を求める世論がルイ=ナポレオンの大統領当選を後押しした。フランスでのこの革命の波及は、ウィーン体制下で抑圧されていたドイツ・オーストリア・イタリアなど各地の自由主義・国民主義運動を触発し、同年の「1848年革命(諸国民の春)」という汎ヨーロッパ的な激動を引き起こす震源となった。' },
  { id:'second_republic_france', name:'第二共和政', category:'nation', lat:48.86, lng:2.35, start:1848, end:1852, region:'フランス',
    desc:'二月革命を受けて成立した共和政。男性普通選挙(制限のない男子普通選挙としては世界初の本格実施例の一つ)による大統領選挙で、ナポレオン1世の名声を利用したルイ=ナポレオン(ボナパルトの甥)が圧勝したが、任期満了を控えた1851年、再選を禁じる憲法規定を無視してクーデタを断行し独裁権を握った。翌1852年に国民投票を経て皇帝に即位(ナポレオン3世)し、第二共和政はわずか4年で幕を閉じた。' },
  { id:'napoleon_iii', name:'ナポレオン3世(ルイ・ナポレオン)', category:'person', parentId:'second_empire_france', lat:48.86, lng:2.35, start:1808, end:1873, region:'フランス',
    desc:'ナポレオン1世の甥で、第二共和政の大統領選挙に「ナポレオン」の名声を利用して圧勝した後、任期満了直前にクーデタを断行して独裁権を握り、国民投票を経て皇帝に即位した(第二帝政)。国内ではパリの大改造(オスマンによる都市改造)や鉄道網整備を通じた産業革命の進展、労働者への一定の譲歩(スト権の部分的容認)など権威主義と大衆迎合を組み合わせた統治(ボナパルティズム)を展開し、対外的にはクリミア戦争・イタリア統一戦争への介入で国威発揚を図った。しかし対外政策の破綻(メキシコ出兵の失敗)が続く中、エムス電報事件を機に開戦した普仏戦争でスダンの戦いに大敗し自ら捕虜となって帝政は崩壊、第三共和政の成立を招いた。' },
  { id:'second_empire_france', name:'フランス第二帝政', category:'nation', lat:48.86, lng:2.35, start:1852, end:1870, region:'フランス',
    desc:'ナポレオン3世が国民投票により皇帝に即位して成立した権威主義的な帝政。オスマン(セーヌ県知事)によるパリの大改造(放射状大通りの建設など)や鉄道網整備を通じた産業革命の進展、万国博覧会の開催などで国威を発揚し「フランスの黄金時代」とも評される繁栄を実現した一方、対外的な威信獲得を狙った積極外交(クリミア戦争・イタリア統一戦争への介入、メキシコ出兵の失敗)を重ね、最終的にはエムス電報事件に乗じたビスマルクの挑発に応じて開戦した普仏戦争でスダンの戦いに大敗、皇帝自身が捕虜となって帝政は崩壊した。' },
  { id:'franco_prussian_war', name:'普仏戦争', category:'war', lat:49.71, lng:4.95, start:1870, end:1871, region:'フランス・ドイツ',
    desc:'スペイン王位継承問題をめぐるエムス電報事件を機にフランスが宣戦布告し、プロイセンとフランスの間で戦われた戦争。プロイセンは参謀総長モルトケの周到な動員計画のもと圧勝を重ね、スダンの戦いでナポレオン3世自身を捕虜として第二帝政を崩壊に追い込んだ。戦後、プロイセン主導で南ドイツ諸邦をも統合したドイツ帝国がヴェルサイユ宮殿で成立する一方、敗れたフランスはフランクフルト条約で資源豊かなアルザス・ロレーヌ地方の割譲と巨額の賠償金支払いを強いられ、その領土喪失への対独復讐心(ルヴァンシュ)は以後数十年にわたりフランスの対外政策を規定し、第一次世界大戦へとつながる独仏対立の遠因となった。' },
  { id:'paris_commune', name:'パリ・コミューン', category:'revolution', lat:48.86, lng:2.35, start:1871, end:1871, region:'パリ',
    desc:'普仏戦争敗北後の混乱の中、パリの労働者・市民が樹立した自治政府。史上初の労働者階級による政権とも評されるが、臨時政府軍により約2か月で武力鎮圧され、多数の死者を出した(「血の週間」)。' },
  { id:'third_republic_france', name:'フランス第三共和政', category:'nation', lat:48.86, lng:2.35, start:1870, end:1940, region:'フランス',
    desc:'普仏戦争敗北とパリ=コミューンの鎮圧を経て成立し、第二次世界大戦でのドイツ降伏まで存続した、フランス史上最も長命な共和政。当初は王党派も含む不安定な議会構成であったが次第に共和政が定着し、第一次世界大戦では甚大な人的損害を払いながらも勝利国となった。一方でユダヤ人将校への冤罪事件をめぐり国論を二分したドレフュス事件は、共和政擁護派と反共和・反ユダヤ主義勢力との対立を先鋭化させ、後の政教分離法(1905年)にもつながった。世界恐慌後の政情不安の中で1940年のドイツへの敗北(電撃戦)により崩壊した。' },
  { id:'dreyfus_affair', name:'ドレフュス事件', category:'event', lat:48.86, lng:2.35, start:1894, end:1906, region:'フランス',
    desc:'ユダヤ系軍人ドレフュス大尉がスパイ容疑で不当に有罪とされた冤罪事件。作家ゾラの公開書簡「われ弾劾す」などを機に世論を二分する大論争に発展し、フランス社会における反ユダヤ主義や軍・教会の影響力が問題視される契機となった。' },
  { id:'vichy_france', name:'ヴィシー政権', category:'nation', lat:46.13, lng:3.42, start:1940, end:1944, region:'フランス(南部・ヴィシー)',
    desc:'第二次世界大戦でドイツに電撃的に敗北したフランスが、第一次世界大戦の英雄ペタン元帥を首班として休戦後に成立させた対独協力政権。「国民革命」を掲げて共和政の理念(自由・平等・友愛)を否定する権威主義体制を敷き、ドイツの要求に応じてユダヤ人の強制送還に自ら加担するなど、傀儡政権としての性格を強めていった。連合軍のノルマンディー上陸・パリ解放を経て崩壊し、戦後ペタンら指導者は対独協力(コラボラシオン)の罪で裁かれた。' },
  { id:'free_france', name:'自由フランス', category:'nation', lat:51.51, lng:-0.13, start:1940, end:1944, region:'ロンドン(亡命政府)〜フランス各地',
    desc:'ドイツへの休戦に反対したド=ゴール将軍が、亡命先のロンドンでBBCラジオ放送を通じて「徹底抗戦」を呼びかけて結成した亡命政府・抵抗運動。当初は少数派に過ぎなかったが、国内の対独レジスタンス運動を糾合し、連合国からも(当初は消極的にではあるが)フランスを代表する勢力として認知されるようになった。1944年の連合軍ノルマンディー上陸とパリ解放を主導し、フランス共和国臨時政府を樹立してフランスを戦勝国側に位置づけることに成功した。' },
  { id:'charles_de_gaulle', name:'シャルル・ド・ゴール', category:'person', parentId:'fifth_republic_france', lat:48.86, lng:2.35, start:1890, end:1970, region:'フランス',
    desc:'第二次世界大戦でドイツへの休戦に反対し、ロンドンで自由フランスを率いて対独抵抗を主導した軍人・政治家。パリ解放後は臨時政府主席となったが、政党間の対立と議会主導の政治体制(第四共和政)に不満を抱いて一時政界を退いた。アルジェリア独立をめぐる危機で軍のクーデタが懸念される中、全権を委ねられて復帰し、強力な大統領権限を柱とする新憲法(第五共和政憲法)を制定してその初代大統領に就任、最終的にはアルジェリアの独立を承認する一方、核武装(独自の核抑止力)や北大西洋条約機構(NATO)軍事機構からの脱退など、米ソいずれにも従属しない「大国フランス」の独自路線(ゴーリズム)を追求した。' },
  { id:'fourth_republic_france', name:'フランス第四共和政', category:'nation', lat:48.86, lng:2.35, start:1946, end:1958, region:'フランス',
    desc:'第二次世界大戦後、対独協力への反省から強力な大統領権限を避け、議会(特に下院)優位の議院内閣制を採用して発足した共和政。マーシャル=プランを活用した戦後復興や欧州統合の推進(シューマン=プラン、ECSC発足)で成果を上げたが、比例代表制のもとで小党分立が続き内閣が頻繁に交代する慢性的な政情不安に陥った。特にインドシナ戦争の敗北に続くアルジェリア戦争の泥沼化は体制の危機を招き、1958年、軍のクーデタ懸念の中でド=ゴールに全権が委ねられ、新憲法制定を経て第五共和政に移行した。' },
  { id:'algerian_war', name:'アルジェリア戦争', category:'war', lat:36.75, lng:3.06, start:1954, end:1962, region:'アルジェリア',
    desc:'フランスからの独立を求めるアルジェリア民族解放戦線(FLN)とフランスとの間で戦われた独立戦争。凄惨な戦闘とテロが続き、フランス国内の政治危機(第四共和政崩壊)も招いたが、最終的に1962年にアルジェリアは独立を達成した。' },
  { id:'fifth_republic_france', name:'フランス第五共和政', category:'nation', lat:48.86, lng:2.35, start:1958, end:2000, region:'フランス',
    desc:'アルジェリア危機を収拾するため復帰したド=ゴールの主導で制定された新憲法のもとで成立した、現行のフランスの政治体制。国民の直接選挙で選ばれる強力な大統領(国家元首・軍最高司令官)と、議会に責任を負う首相・内閣を組み合わせた半大統領制を採用し、第四共和政の反省から行政権の安定を重視した点に特徴がある。ド=ゴール自身は1968年の五月革命(学生・労働者の異議申し立て)への対応をめぐり翌1969年に退陣したが、その後も体制自体は安定して継続し、現在に至るまでフランス政治の基本枠組みであり続けている。' },

  /* =====================================================================
     ⑤ ドイツ・神聖ローマ帝国・オーストリア(ハプスブルク) 追加データ
     ===================================================================== */
  { id:'frederick_barbarossa', name:'フリードリヒ1世(バルバロッサ)', category:'person', parentId:'hre', lat:50.78, lng:6.08, start:1122, end:1190, region:'神聖ローマ帝国',
    desc:'シュタウフェン朝の皇帝で、「バルバロッサ(赤髭)」の異名で知られる。皇帝権の実質的な基盤強化を狙って北イタリアの富裕な諸都市への支配を強めようとしたが、これに反発した諸都市が結成したロンバルディア同盟と長期にわたり抗争を繰り広げ、レニャーノの戦い(1176年)で大敗を喫するなど決定的な成果は得られなかった。第3回十字軍遠征の途上、小アジアの川を渡河中に溺死したと伝えられ、後世「赤髭王が眠りから覚めてドイツを再興する」という伝説が生まれるほど、国民的英雄として長く記憶された。' },
  { id:'frederick_ii_hre', name:'フリードリヒ2世(シュタウフェン朝)', category:'person', parentId:'hre', lat:50.78, lng:6.08, start:1194, end:1250, region:'神聖ローマ帝国・シチリア王国',
    desc:'母方からシチリア王位を継承し、多言語(6か国語)に通じ、天文学・医学など諸学問を奨励する開明的な統治で「世界の驚異(ストゥポル=ムンディ)」と称された皇帝。第6回十字軍では戦闘によらず外交交渉のみでエルサレムの一時的な返還を実現するという異例の成果を上げたが、この非武力路線はかえって教皇の不興を買い、破門を複数回受けるなど教皇としばしば激しく対立した。ドイツ本国よりシチリア統治に力を注いだ結果、ドイツでは諸侯への大幅な権限委譲を余儀なくされて領邦分立が進み、彼の死後、後継者たちが相次いで敗死・処刑されて男系が断絶すると、帝国は「大空位時代」と呼ばれる皇帝不在の混乱期に突入した。' },
  { id:'great_interregnum', name:'大空位時代', category:'event', lat:50.78, lng:6.08, start:1254, end:1273, region:'神聖ローマ帝国',
    desc:'シュタウフェン朝断絶後、有力候補が乱立して実質的な皇帝不在(あるいは実効支配の及ばない名目的な皇帝のみ)の状態が続いた時期。中央権力の空白の中、諸侯・自由都市は事実上独立した外交・軍事行動をとるようになり、都市同士が自衛のため同盟(ライン都市同盟など)を結成する動きも進んで、帝国の分権的な性格をいっそう強める結果となった。この混乱は、ハプスブルク家のルドルフ1世が選帝侯の合議によって新皇帝に選出されたことでようやく収拾されたが、以後の皇帝権はこの空位期間を経てさらに弱体化した状態からの再出発を余儀なくされた。' },
  { id:'golden_bull_1356', name:'金印勅書', category:'treaty', lat:50.11, lng:14.44, start:1356, end:1356, region:'神聖ローマ帝国(プラハ)',
    desc:'皇帝カール4世が、皇帝選出手続きの明確化と混乱防止を目的に発布した勅令。マインツ・ケルン・トリーアの3大司教とベーメン王・ライン宮中伯・ザクセン公・ブランデンブルク辺境伯の4世俗諸侯、あわせて7人の選帝侯を正式に定め、多数決による皇帝選出の手続きを確立するとともに、選帝侯領の分割不可・長子相続を定めてその世襲的な地位を保障した。教皇の承認を選挙の要件から明確に排除した点でも、教皇権に対する帝国(世俗権力)の自立性を示す意味を持ち、以後500年近くにわたりこの手続きが維持される、神聖ローマ帝国の事実上の根本法(憲法的文書)として機能した。' },
  { id:'maximilian_i_habsburg', name:'マクシミリアン1世', category:'person', parentId:'habsburg', lat:48.21, lng:16.37, start:1459, end:1519, region:'神聖ローマ帝国(ハプスブルク家)',
    desc:'婚姻政策によりブルゴーニュ公女マリーとの結婚でネーデルラント・フランシュ=コンテを、子フィリップとスペイン王女フアナの結婚でスペインを、孫の代のハンガリー・ボヘミア王家との婚姻協定でこれらの王国をも、それぞれハプスブルク家にもたらした皇帝。「汝、幸いなるオーストリアよ、結婚せよ(戦は他家に任せよ)」の言葉で知られるこの婚姻戦略により、直接の戦争によらずして一代でハプスブルク家の勢力範囲を劇的に拡大し、孫カール5世の代に実現する「日の沈まぬ帝国」の基礎を築いた。帝国統治の面でも帝国クライス(統治区分)制度の導入など行政改革を試みたが、財政基盤の弱さから実効性には限界があった。' },
  { id:'charles_v_hre', name:'カール5世(神聖ローマ皇帝/カルロス1世)', category:'person', parentId:'hre', lat:50.78, lng:6.08, start:1500, end:1558, region:'神聖ローマ帝国・スペイン',
    desc:'父方からハプスブルク家領・神聖ローマ皇帝位を、母方からスペイン王位(カルロス1世として)を、それぞれ相続して「日の沈まぬ帝国」と称される広大な領土を統治した皇帝。フランス王フランソワ1世とはイタリアの覇権をめぐりイタリア戦争を繰り返し(パヴィアの戦いで捕虜とするなど優位に戦いを進めた)、国内ではルターの宗教改革への対応に苦慮してヴォルムス帝国議会でルターを断罪する一方、諸侯の信仰選択を認めるアウクスブルクの和議(1555年)により事実上宗教分裂を追認せざるを得なかった。広大すぎる領土の統治に限界を感じ、晩年は退位してスペイン・ネーデルラントを子フェリペ2世に、オーストリア・神聖ローマ皇帝位を弟フェルディナント1世にそれぞれ分割相続させ、修道院に隠棲して生涯を閉じた。' },
  { id:'diet_of_worms', name:'ヴォルムス帝国議会(ルター召喚)', category:'event', lat:49.63, lng:8.36, start:1521, end:1521, region:'神聖ローマ帝国(ヴォルムス)',
    desc:'皇帝カール5世が、広まりつつあったルターの教説の是非を審理するため召集した帝国議会。ルターは自説の撤回を強く求められたが、「聖書と明白な理性によって論破されない限り、良心に反することはできない」として撤回を拒否し、その結果「ヴォルムス勅令」により法の保護外に置かれる(帝国追放刑、何人も彼を保護・援助してはならないとされる)厳しい処分を受けた。しかし庇護者ザクセン選帝侯フリードリヒ(賢明公)がルターを一時的にヴァルトブルク城に匿って保護したため生き延び、この間に聖書のドイツ語訳という重要な事業を成し遂げて、宗教改革運動はかえってさらに拡大していくことになった。' },
  { id:'peasants_war_germany', name:'ドイツ農民戦争', category:'war', lat:49.79, lng:9.93, start:1524, end:1525, region:'ドイツ南西部',
    desc:'重税や賦役、領主による共有地(森林・牧草地)の囲い込みなど封建的な圧政に対し、ルターの教え(すべての信徒は神の前で平等であるとする「万人司祭主義」)にも影響を受けた農民たちが、南西ドイツを中心に蜂起した、宗教改革期最大規模の社会反乱。ミュンツァーら急進的な指導者は社会的平等の実現をも求めて既存秩序への直接的な挑戦を掲げたが、ルター自身は当初農民の窮状に同情を示しつつも、暴力的な蜂起が社会秩序全体の崩壊を招くことを恐れて最終的に諸侯による鎮圧を支持する立場に転じ(「盗み殺す農民の暴徒に対して」)、反乱は諸侯連合軍により徹底的に鎮圧されて数万人の農民が犠牲になった。この反乱の失敗は、以後の宗教改革がルターと世俗諸侯との協調関係を基軸に展開していく方向性を決定づけた。' },
  { id:'schmalkaldic_war', name:'シュマルカルデン戦争', category:'war', lat:50.78, lng:6.08, start:1546, end:1547, region:'神聖ローマ帝国',
    desc:'プロテスタント諸侯が結成したシュマルカルデン同盟と皇帝カール5世との間で戦われた戦争。皇帝軍が勝利したものの新教の勢力を完全に抑えることはできず、最終的にアウクスブルクの和議へとつながった。' },
  { id:'peace_augsburg', name:'アウクスブルクの和議', category:'treaty', lat:48.37, lng:10.9, start:1555, end:1555, region:'神聖ローマ帝国(アウクスブルク)',
    desc:'「領邦の宗教はその領邦の支配者が決定する(アウクスブルクの原則、キウス=レギオ、エイウス=レリギオ)」との原則により、諸侯・帝国都市それぞれの支配者がカトリックかルター派かを選択する権利を認め、住民には限定的な移住の自由(信仰の合わない領邦からの退去権)のみが認められた講和。この妥協により帝国内での宗教内戦は一旦収束したが、カルヴァン派は公認対象から除外されたままであり(1648年のウェストファリア条約でようやく公認)、さらに聖界諸侯領がプロテスタントに改宗した場合の扱い(聖界留保)をめぐる解釈対立も未解決のまま残されたため、この不完全な妥協は約60年後の三十年戦争という、より大規模な宗教内戦の火種を残すこととなった。' },
  { id:'ferdinand_ii_hre', name:'フェルディナント2世', category:'person', parentId:'hre', lat:50.78, lng:6.08, start:1578, end:1637, region:'神聖ローマ帝国',
    desc:'イエズス会の教育を受けた熱心なカトリック信者で、自領内のプロテスタントを強制的にカトリックに改宗させる強硬な再カトリック化政策を進めた皇帝。ボヘミア王としてのこの宗教政策への反発から、プロテスタント貴族がプラハ王宮の窓から皇帝使節を投げ落とす「プラハ窓外投擲事件」(1618年)が発生し、これが三十年戦争勃発の直接の引き金となった。ヴァレンシュタインら傭兵隊長を起用して戦争を優位に進めた時期もあったが、その治世を通じてドイツ全土は戦禍により荒廃し続け、戦争が彼の死後も四半世紀近く継続する長期化を決定づけた。' },
  { id:'wallenstein', name:'ヴァレンシュタイン', category:'person', parentId:'hre', lat:50.08, lng:14.44, start:1583, end:1634, region:'神聖ローマ帝国(皇帝軍)',
    desc:'三十年戦争で皇帝軍を率いた傭兵隊長・将軍。皇帝の財政負担を軽減するため、占領地からの徴発(「戦争が戦争を養う」方式)によって自弁で大規模な私兵軍を組織・維持する手法をとり、これが戦争を長期化・広域化させる一因ともなった。デンマーク・スウェーデンとの戦いで軍事的成功を収めて絶大な権力を握ったが、独自の外交交渉(敵対勢力との単独講和の模索)を進めるなど皇帝の統制を超えた動きを見せたことから次第に警戒されるようになり、最終的に皇帝の命を受けた部下によって暗殺された。' },
  { id:'sweden_great_power', name:'スウェーデン(バルト帝国時代)', category:'nation', lat:59.33, lng:18.06, start:1611, end:1721, region:'バルト海沿岸',
    desc:'グスタフ=アドルフのもとで軍制改革を進め、三十年戦争への介入を機に北欧の大国(バルト帝国)として台頭したスウェーデン。北方戦争の敗北によりバルト海の覇権をロシアに譲った。' },
  { id:'gustav_adolf_sweden', name:'グスタフ=アドルフ', category:'person', parentId:'sweden_great_power', lat:59.33, lng:18.06, start:1594, end:1632, region:'スウェーデン',
    desc:'「北方の獅子」と称されたスウェーデン王。近代的な軍制改革を行い、三十年戦争にプロテスタント側で参戦してドイツ深くまで進撃したが、リュッツェンの戦いで戦死した。' },
  { id:'prussia_kingdom', name:'プロイセン王国', category:'nation', lat:52.52, lng:13.4, start:1701, end:1871, region:'北ドイツ(ブランデンブルク・プロイセン)',
    desc:'ブランデンブルク選帝侯フリードリヒ3世が、スペイン継承戦争での皇帝への軍事協力の見返りとして王号を認められ、フリードリヒ1世として即位したことで成立した国家。人口・資源に乏しい分散的な領土構成を補うべく、軍人王フリードリヒ=ヴィルヘルム1世が徹底した倹約財政と強力な常備軍・効率的な官僚制を築き上げ、この基盤の上に立ったフリードリヒ2世(大王)がオーストリア継承戦争・七年戦争でシュレジエンを獲得してヨーロッパの五大国の一角を占めるまでに成長した。19世紀にはビスマルクの指導下でオーストリアを排除した「小ドイツ主義」に基づくドイツ統一を主導し、最終的にドイツ帝国の中核となった。' },
  { id:'hohenzollern_dynasty', name:'ホーエンツォレルン家', category:'dynasty', lat:52.52, lng:13.4, start:1415, end:1918, region:'ブランデンブルク・プロイセン・ドイツ帝国',
    desc:'ブランデンブルク辺境伯家に始まり、プロイセン王家、さらにドイツ帝国の皇帝家へと発展した名門。軍事力と官僚制を重視する「軍隊国家」プロイセンの統治理念を体現し、フリードリヒ2世(啓蒙専制君主としての改革と対外拡張)、ヴィルヘルム1世(ビスマルクを登用したドイツ統一の完成者)、ヴィルヘルム2世(積極的な世界政策で第一次世界大戦を招いた最後の皇帝)ら対照的な性格の君主を輩出し、ドイツ近代史の展開の中心的役割を果たしたが、第一次世界大戦の敗北とドイツ革命により1918年に退位、君主政としての歴史に幕を閉じた。' },
  { id:'frederick_william_i_prussia', name:'フリードリヒ・ヴィルヘルム1世(軍人王)', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.4, start:1688, end:1740, region:'プロイセン王国',
    desc:'華美な宮廷生活を嫌い、徹底した倹約財政と軍備増強に生涯を捧げた「軍人王」。国庫収入の大半を軍事費に充て、身長の高い兵士だけを集めた「ポツダムの巨人擲弾兵」を偏愛したことでも知られる一方、実戦にはほとんど投入せず、むしろ効率的な官僚制(将軍参事会の設置)や義務教育制度の整備など内政面での基盤づくりに注力した。この徹底した緊縮財政と軍事的準備により蓄積された国力とヨーロッパ有数の精強な常備軍は、子フリードリヒ2世が即位直後からシュレジエン奪取に踏み切る軍事的躍進を可能にする直接の基盤となった。' },
  { id:'frederick_the_great', name:'フリードリヒ2世(大王)', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.4, start:1712, end:1786, region:'プロイセン王国',
    desc:'啓蒙専制君主を代表する王で、若き日には音楽・哲学を愛好し父との確執も経験したが、即位するや父の遺した軍事力を駆使してオーストリア継承戦争・七年戦争でハプスブルク家からシュレジエン(繊維工業が盛んな豊かな地域)を奪い、プロイセンをヨーロッパ五大国の一角に押し上げた。内政では宗教的寛容政策や司法改革、農業技術の普及(ジャガイモ栽培の奨励)などを進める一方、「君主は国家第一の下僕」との言葉に象徴される啓蒙的な統治理念を掲げつつも、実態は徹底した中央集権的専制を貫いた。ヴォルテールら啓蒙思想家との親交でも知られる文化的君主でもあった。' },
  { id:'war_austrian_succession', name:'オーストリア継承戦争', category:'war', lat:50.78, lng:17.03, start:1740, end:1748, region:'ヨーロッパ全域(発端はシュレジエン)',
    desc:'ハプスブルク家の女子相続(マリア=テレジア)の正当性を、プロイセンなどが否定して始めた戦争。プロイセンはシュレジエンの獲得に成功し、以後オーストリアとプロイセンはドイツの覇権をめぐり激しく対立することになった。' },
  { id:'partitions_of_poland', name:'ポーランド分割', category:'event', lat:52.23, lng:21.01, start:1772, end:1795, region:'ポーランド',
    desc:'ロシア・プロイセン・オーストリアの3国が3次にわたりポーランド領を分割・併合した出来事。1795年の第3次分割によりポーランドという国家は地図上から完全に消滅し、19世紀を通じて独立回復運動が続いた。' },
  { id:'pragmatic_sanction', name:'国事詔書(プラグマティッシェ・ザンクツィオン)', category:'treaty', lat:48.21, lng:16.37, start:1713, end:1713, region:'神聖ローマ帝国(ハプスブルク家)',
    desc:'皇帝カール6世が発した、男子継承者がいない場合でも娘(マリア=テレジア)にハプスブルク家領の一括相続を認めさせるための詔書。諸国に承認させたが、カール6世の死後、プロイセンなどがこれを無視してオーストリア継承戦争が勃発した。' },
  { id:'maria_theresa', name:'マリア=テレジア', category:'person', parentId:'habsburg', lat:48.21, lng:16.37, start:1717, end:1780, region:'ハプスブルク家(オーストリア)',
    desc:'父カール6世の国事詔書(プラグマティッシェ=ザンクツィオン)による娘への一括相続の取り決めにもかかわらず、即位直後にプロイセンのシュレジエン侵攻を招いてオーストリア継承戦争が勃発、シュレジエンを失うという痛手を負った女帝。この敗北を教訓に、宰相カウニッツの主導で伝統的な宿敵フランスと同盟する「外交革命」を成し遂げてシュレジエン奪還を狙った七年戦争に臨んだが果たせなかった一方、国内では中央集権化・軍制改革・初等教育制度の整備などの内政改革を断行してハプスブルク家領を立て直し、その治世を通じて40年近くの間に16人の子をもうけ(そのうちの一人がフランス王妃マリー=アントワネット)「ヨーロッパの祖母」とも呼ばれた。' },
  { id:'joseph_ii_habsburg', name:'ヨーゼフ2世', category:'person', parentId:'habsburg', lat:48.21, lng:16.37, start:1741, end:1790, region:'ハプスブルク家(オーストリア)',
    desc:'母マリア=テレジアとの共同統治を経て単独統治者となった、啓蒙専制君主の代表格とされる皇帝。農奴解放令(1781年)、宗教寛容令(プロテスタント・ユダヤ教徒への信仰の自由付与)、修道院の大量解散、検閲の大幅緩和など、上からの急進的な近代化改革を矢継ぎ早に断行したが、伝統的な貴族・教会の既得権益を大きく侵害するこれらの改革は各地(特にネーデルラント、ハンガリー)で強い反発と反乱を招き、彼の死後、多くの改革が後継者によって撤回されることとなった。この急進改革の挫折は、「上からの改革」の限界を示す事例としてしばしば言及される。' },
  { id:'austrian_empire', name:'オーストリア帝国', category:'nation', lat:48.21, lng:16.37, start:1804, end:1867, region:'中央ヨーロッパ',
    desc:'神聖ローマ帝国の解体(1806年)を見越したフランツ2世が、皇帝位喪失後もハプスブルク家の権威を維持するため先んじて新設した世襲帝国(「オーストリア皇帝」の称号)。ウィーン会議後はメッテルニヒのもとで保守反動体制(ウィーン体制)の中心的な守護者としてヨーロッパの正統主義・現状維持を主導したが、国内にドイツ人・ハンガリー人・スラヴ系諸民族など多数の民族を抱える多民族国家であったため、1848年革命でハンガリー独立運動をはじめとする各民族のナショナリズムの噴出に激しく揺さぶられ続けた。ドイツ統一の主導権をめぐる普墺戦争での敗北により国際的地位が大きく後退したことを機に、ハンガリーの自治要求に応じてオーストリア=ハンガリー帝国(二重帝国)へと再編された。' },
  { id:'metternich', name:'メッテルニヒ', category:'person', parentId:'austrian_empire', lat:48.21, lng:16.37, start:1773, end:1859, region:'オーストリア帝国',
    desc:'フランス革命・ナポレオン戦争の混乱を経験し、ナポレオン没落後のヨーロッパ秩序再建を目指すウィーン会議(1814〜15年)を主導した外相・宰相。「会議は踊る、されど進まず」と評された会議を、フランス代表タレーランの提唱する正統主義(革命前の王朝・国境の復活)と列強間の勢力均衡の原則でまとめ上げ、以後約30年にわたりヨーロッパの国際秩序(ウィーン体制)を主導し続けた。神聖同盟・四国同盟を通じて自由主義・ナショナリズム運動を各地で徹底的に弾圧する保守反動的な政策を展開したが、1848年革命(三月革命)でウィーンの民衆蜂起に直面すると自らも亡命を余儀なくされ、その体制は崩壊した。' },
  { id:'frankfurt_parliament', name:'フランクフルト国民議会', category:'event', lat:50.11, lng:8.68, start:1848, end:1849, region:'ドイツ(フランクフルト)',
    desc:'1848年三月革命の高まりを受け、ドイツ統一と自由主義的な国民国家建設を目指して、各邦から選出された代表がフランクフルトのパウロ教会に集まって開催された、ドイツ史上初の自由選挙による国民議会。オーストリア(多民族帝国)を含めた統一を目指す「大ドイツ主義」と、オーストリアを除外しプロイセン中心の統一を目指す「小ドイツ主義」との路線対立で紛糾しつつも、最終的に自由主義的な帝国憲法草案を採択してプロイセン王フリードリヒ=ヴィルヘルム4世に皇帝即位を要請したが、国王は「どぶの中の冠」(革命によって民衆から差し出された帝位)を受けることを拒否したため、この「下からの」統一の試みは成果なく解散に追い込まれた。この挫折は、ドイツ統一が結局は自由主義者の理想ではなく、ビスマルクによる「上からの」現実政治(軍事力を背景とした統一)によって実現されることを予告するものとなった。' },
  { id:'austro_prussian_war', name:'普墺戦争', category:'war', lat:50.19, lng:15.83, start:1866, end:1866, region:'中央ヨーロッパ(ケーニヒグレーツ)',
    desc:'ドイツ統一の主導権(大ドイツ主義か小ドイツ主義か)と、共同管理下にあったシュレスヴィヒ・ホルシュタイン両公国の処遇をめぐる対立から、プロイセンとオーストリアが戦った短期決戦の戦争。ビスマルクは事前にイタリア(オーストリア領ヴェネツィアの獲得を狙う)と同盟を結んでオーストリアを南北から挟撃する体制を整え、モルトケの指揮のもと鉄道を活用した迅速な動員によりケーニヒグレーツ(サドヴァ)の戦いでオーストリア軍を圧倒的に撃破した。この敗北によりオーストリアはドイツ統一の主導権から完全に排除され(「小ドイツ主義」の実質的確定)、プロイセンを中心とする北ドイツ連邦が結成される一方、ビスマルクはオーストリアへの過酷な処罰を避けて将来の協調の余地を残す寛大な講和(プラハ条約)を結ぶという、次の戦争(普仏戦争)を見据えた慎重な外交判断を示した。' },
  { id:'north_german_confederation', name:'北ドイツ連邦', category:'nation', lat:52.52, lng:13.4, start:1867, end:1871, region:'北ドイツ',
    desc:'普墺戦争でオーストリアを排除した後、プロイセンを中心にマイン川以北の北ドイツ諸邦が結成した連邦国家。プロイセン主導の強力な連邦制と、男性普通選挙による連邦議会(ただし予算の実権は依然プロイセン王・宰相が握る)を組み合わせた憲法構造は、後のドイツ帝国憲法の直接のひな型となった。首相(宰相)を兼ねたビスマルクが事実上の指導者として外交・軍事の実権を握り、南ドイツ諸邦(バイエルンなど)を巻き込んだ普仏戦争の勝利を経て、1871年にドイツ帝国成立の直接の母体として発展的に解消した。' },
  { id:'austria_hungary', name:'オーストリア=ハンガリー帝国', category:'nation', lat:48.21, lng:16.37, start:1867, end:1918, region:'中央ヨーロッパ',
    desc:'普墺戦争敗北によりドイツにおける主導権を完全に失ったオーストリアが、内部から強まるハンガリーの自治要求に対応するため、オーストリア皇帝がハンガリー国王を兼ねる二重君主国として再編した国家(アウスグライヒ体制、1867年)。外交・軍事・関税は共通としつつ、内政・議会はオーストリア側とハンガリー側でそれぞれ独立するという複雑な統治構造をとり、さらに国内にはドイツ人・ハンガリー人(マジャール人)に加えチェコ人・ポーランド人・南スラヴ系諸民族など多数の少数民族を抱えていたため、各民族の自治・独立要求への対応に苦慮し続けた。皇太子暗殺事件(サライェヴォ事件)を機に開戦した第一次世界大戦の敗北とともに、各民族がそれぞれ独立国家を樹立して帝国は解体した。' },
  { id:'franz_joseph_i', name:'フランツ=ヨーゼフ1世', category:'person', parentId:'austria_hungary', lat:48.21, lng:16.37, start:1830, end:1916, region:'オーストリア=ハンガリー帝国',
    desc:'1848年革命の混乱の中、18歳で即位し68年に及ぶ長期治世でオーストリア帝国からオーストリア=ハンガリー帝国への移行(アウスグライヒ)を主導した皇帝。普墺戦争の敗北による国際的地位の後退、多民族国家内部の絶えざるナショナリズムの噴出という困難に直面し続け、私生活でも皇后エリザベト(シシィ)の暗殺、皇太子ルドルフの心中事件など不幸に見舞われた。皇位継承者(甥)フランツ=フェルディナント大公の暗殺(サライェヴォ事件、1914年)を受けてセルビアに宣戦布告し第一次世界大戦の開戦当事国となったが、帝国の終焉を見ることなく大戦中の1916年に没した。' },
  { id:'wilhelm_i_germany', name:'ヴィルヘルム1世', category:'person', parentId:'german_empire', lat:52.52, lng:13.4, start:1797, end:1888, region:'ドイツ帝国',
    desc:'プロイセン王としてビスマルクを首相に登用し、普墺・普仏戦争を経てドイツ統一を実現、ヴェルサイユ宮殿で初代ドイツ皇帝に即位した人物。もともと軍拡には積極的であったが政治的には保守的な性格で、ビスマルクの大胆な外交・戦争戦略に当初は消極的な場面もあったとされるが、最終的にはビスマルクを厚く信任し、内政・外交の実務のほぼ全てを宰相に委ねる統治スタイルを貫いた。この「皇帝は君臨し、宰相ビスマルクが統治する」という関係性は、彼の在位中のドイツ帝国の安定した対外政策(ビスマルク体制による勢力均衡)を可能にした重要な要因であった。' },
  { id:'wilhelm_ii_germany', name:'ヴィルヘルム2世', category:'person', parentId:'german_empire', lat:52.52, lng:13.4, start:1859, end:1941, region:'ドイツ帝国',
    desc:'祖父の代からの功労者であったビスマルクと対立し、即位からまもなくこれを罷免して親政を開始した最後のドイツ皇帝。ビスマルクの慎重な大陸勢力均衡外交から一転し、大艦隊建造による海軍力増強とアフリカ・太平洋への積極的な植民地獲得を掲げる世界政策(ヴェルトポリティーク)を推進してイギリスとの建艦競争・対立を招き、複雑な同盟網の破棄(ロシアとの再保障条約更新拒否)によりヨーロッパの勢力均衡を不安定化させた。この対外強硬路線は第一次世界大戦の一因ともなり、大戦の敗北とキール軍港での水兵反乱に端を発するドイツ革命の中、オランダへ亡命して退位した。' },
  { id:'weimar_republic', name:'ヴァイマル共和国', category:'nation', lat:50.98, lng:11.33, start:1919, end:1933, region:'ドイツ',
    desc:'第一次世界大戦敗北とドイツ革命による帝政崩壊を受けて成立した共和国。比例代表制・男女普通選挙権・広範な基本権保障を特徴とするヴァイマル憲法は当時世界最も民主的な憲法の一つと評されたが、この比例代表制は小党分立を招いて連立政権が頻繁に交代する不安定な政局を生んだ。ヴェルサイユ条約の巨額賠償金負担に伴うハイパーインフレーション(1923年)、続く世界恐慌による大量失業という二度の深刻な経済危機は中間層の生活基盤を破壊し、既存の議会政治への不信を決定的なものにして、この混乱の中でナチ党が急速に支持を拡大、ヒンデンブルク大統領によるヒトラー首相任命(1933年)を経てわずか14年で崩壊した。' },
  { id:'hyperinflation_1923', name:'ハイパーインフレーション(1923年)', category:'event', lat:52.52, lng:13.4, start:1923, end:1923, region:'ドイツ',
    desc:'ヴェルサイユ条約に定められた巨額の賠償金支払いの遅延を口実としたフランス・ベルギー軍によるルール工業地帯の占領(1923年)と、これに対するドイツ政府の「消極的抵抗」(ストライキによる生産停止)への財政支援のための通貨増発を直接の引き金として、ドイツマルクの価値が天文学的に暴落した未曾有の経済危機。パン1個の価格が数十億マルクに達するなど、年金生活者や預金を持つ中間層の資産は実質的に紙くず同然となって壊滅的な打撃を受け、既存の共和政体制・議会政治への不信と幻滅を社会に深く植え付けて、この経験は後のナチ党をはじめとする急進的な政治勢力が支持を拡大する重要な土壌の一つになったとされる。新通貨レンテンマルクの導入とドーズ案による賠償支払い方式の緩和により危機は一応収拾された。' },
  { id:'hindenburg', name:'ヒンデンブルク', category:'person', parentId:'weimar_republic', lat:52.52, lng:13.4, start:1847, end:1934, region:'ヴァイマル共和国',
    desc:'第一次世界大戦緒戦のタンネンベルクの戦いでロシア軍を撃破し、国民的英雄となった将軍から、ヴァイマル共和国第2代大統領(1925年選出)となった人物。当初は共和政への忠誠を誓いつつも内心では帝政復古を望む保守的な立場であったとされ、世界恐慌後の政局混乱の中、大統領緊急令を多用する権威主義的な統治を許容した。最晩年、周囲の助言を受けてヒトラーを首相に任命した(1933年1月)ことが、結果的にナチ党の合法的な政権掌握とその後の独裁体制確立への決定的な道を開くこととなった。' },
  { id:'austrian_republic_first', name:'オーストリア第一共和国', category:'nation', lat:48.21, lng:16.37, start:1918, end:1938, region:'オーストリア',
    desc:'オーストリア=ハンガリー帝国解体後、ドイツ語圏のみを領域として成立した小国。帝国時代に多民族圏全体を市場としていた工業・行政基盤が国境の縮小により機能不全に陥り、経済的自立が極めて困難であったため、当初は隣接するドイツとの合邦(アンシュルス)を志向する世論も強かったが連合国により禁止された。国内では保守派(キリスト教社会党、武装組織ハイムヴェーア)と社会主義左派(社会民主党、武装組織シュッツブント)の対立が激化して一時内戦状態(1934年二月内乱)にまで至り、その後成立した権威主義的な「オーストロファシズム」体制も、1938年にヒトラーの圧力下での住民投票を経てナチス=ドイツに併合(アンシュルス)され消滅した。' },
  { id:'anschluss', name:'オーストリア併合(アンシュルス)', category:'event', lat:48.21, lng:16.37, start:1938, end:1938, region:'オーストリア',
    desc:'「同一民族(ドイツ民族)の統一」というパン=ゲルマン主義的な大義名分を掲げ、ナチス=ドイツがオーストリアを事実上の軍事的圧力下で併合した出来事。ヴェルサイユ条約・サン=ジェルマン条約で独墺合邦が明確に禁止されていたにもかかわらず、ドイツ軍のオーストリア進駐という既成事実を作った上で事後的に実施された住民投票では9割を超える異例の高い支持(強制と情報操作の下でのものとされる)を得たとされる。この併合は、ヴェルサイユ体制の平和的な現状変更の限界を国際社会に露呈させ、続くズデーテン地方併合(ミュンヘン協定)、チェコスロヴァキア解体へと連なるヒトラーの領土拡張路線をさらに加速させる契機となった。' },
  { id:'west_germany_frg', name:'ドイツ連邦共和国(西ドイツ)', category:'nation', lat:50.73, lng:7.1, start:1949, end:1990, region:'旧西側占領地域(ボン)',
    desc:'第二次世界大戦後、米英仏の占領地域(西側3地区)を基盤に成立した議会制民主主義国家。冷戦下でソ連占領地域(東ドイツ)との分断国家となったが、アデナウアー首相のもとでフランスとの和解(欧州石炭鉄鋼共同体への参加)と西側陣営への統合(NATO加盟)を進めつつ、通貨改革とマーシャル=プランの援助を背景に「経済の奇跡(ヴィルトシャフツヴンダー)」と呼ばれる急速な復興・高度経済成長を実現し、欧州統合の中心的な一員として国際的地位を回復した。1990年、東ドイツを編入する形でドイツ再統一を達成した。' },
  { id:'east_germany_gdr', name:'ドイツ民主共和国(東ドイツ)', category:'nation', lat:52.52, lng:13.4, start:1949, end:1990, region:'旧ソ連占領地域',
    desc:'第二次世界大戦後、ソ連占領地域を基盤に成立した社会主義国家。計画経済とドイツ社会主義統一党(SED)による一党支配体制のもと東側陣営の優等生とされたが、西ドイツとの経済格差から住民の西側への流出が続いたため、1961年にベルリンの壁を構築して東西の往来を物理的に遮断する厳格な統制体制を敷いた。1989年、ソ連のペレストロイカの影響や東欧諸国の民主化連鎖の中で大規模な民主化デモ(ライプツィヒの月曜デモなど)が高まり、同年11月のベルリンの壁崩壊を経て、翌1990年に西ドイツへ編入される形でドイツ統一が実現し、国家としての歴史を終えた。' },
  { id:'adenauer', name:'コンラート・アデナウアー', category:'person', parentId:'west_germany_frg', lat:50.73, lng:7.1, start:1876, end:1967, region:'ドイツ連邦共和国(西ドイツ)',
    desc:'ナチス時代に市長職を追われるなど迫害を経験した後、戦後西ドイツ初代首相(在任1949〜1963年)としてキリスト教民主同盟(CDU)を率いた政治家。社会的市場経済(自由な市場経済に社会保障制度を組み合わせる路線)のもとでの「経済の奇跡」を後押しし、長年の宿敵フランスとの和解(欧州石炭鉄鋼共同体への参加、後のEU統合の礎)、NATO加盟による西側陣営への確固たる統合を推進して、敗戦国であった西ドイツの国際的地位回復に大きく貢献した。この「西側統合」路線は、東西ドイツ分断の固定化という批判も受けたが、戦後西ドイツの外交政策の基本方針として長く継承された。' },
  { id:'german_reunification', name:'ドイツ再統一', category:'event', lat:52.52, lng:13.4, start:1990, end:1990, region:'ドイツ',
    desc:'東欧革命の連鎖の中で起きたベルリンの壁崩壊(1989年11月)後の急速な政治変動を経て、東ドイツが西ドイツの基本法(憲法)の適用地域として編入される形(西ドイツによる東ドイツの吸収合併)で実現したドイツの再統一(1990年10月)。統一に際しては、米英仏ソの旧戦勝4カ国と東西ドイツによる「2プラス4条約」でドイツの主権回復と最終的な国境画定(オーデル=ナイセ線の確定)が国際的に承認され、統一後のドイツがNATO加盟国として存続することもソ連(ゴルバチョフ)の同意を得た。冷戦の象徴であったドイツ分断の解消は、冷戦終結を最も象徴的に体現する出来事の一つとされる。' },
  { id:'austrian_state_treaty', name:'オーストリア国家条約', category:'treaty', lat:48.21, lng:16.37, start:1955, end:1955, region:'オーストリア(ウィーン)',
    desc:'第二次世界大戦後、米英仏ソの4か国による分割占領下にあったオーストリアが、永世中立を宣言することと引き換えに主権を回復した条約。冷戦下で東西どちらの陣営にも属さない立場を選択した。' },
  { id:'second_austrian_republic', name:'オーストリア第二共和国', category:'nation', lat:48.21, lng:16.37, start:1945, end:2000, region:'オーストリア',
    desc:'第二次世界大戦後、連合国(米英仏ソ)の分割占領を経て再建されたオーストリアの共和国。1955年の国家条約により占領を終結させると同時に、永世中立を国是として掲げることで東西いずれの陣営にも属さない独自の立場を確保し、冷戦下でも東西交流の窓口としての役割を果たした。安定した二大政党(国民党と社会党)による連立政治のもと経済的繁栄を実現し、1995年には欧州連合(EU)にも加盟して、ヨーロッパの政治・経済統合に本格的に参画するに至った。' },
  { id:'saxon_dynasty', name:'ザクセン朝(オットー朝)', category:'dynasty', lat:50.78, lng:6.08, start:919, end:1024, region:'東フランク・神聖ローマ帝国',
    relatedIds:['henry_i_germany','otto_i','hre'],
    desc:'東フランク王国内の有力な一部族(ザクセン人)出身のハインリヒ1世が、カロリング家断絶後の東フランク諸侯の選挙で国王に選ばれたことに始まる王朝。子のオットー1世がレヒフェルトの戦いでマジャール人を撃退した軍事的名声を背景に教皇から皇帝の冠を授けられ(962年)、これが神聖ローマ帝国の実質的な出発点となった。以後歴代皇帝は「帝国教会政策」(教会組織を統制し行政・軍事の担い手として利用する政策)を通じて世俗諸侯に対抗する統治基盤を築いたが、オットー3世の理想主義的な「ローマ帝国再興」構想の挫折を経て、嗣子のなかったハインリヒ2世(聖ハインリヒ)の死により直系が断絶し、次代ザリエル朝に王統が移った。' },
  { id:'henry_i_germany', name:'ハインリヒ1世', category:'person', lat:52.27, lng:10.52, start:876, end:936, region:'東フランク王国',
    desc:'非フランク系(ザクセン人)として初めて東フランク王となった人物。マジャール人の侵入に対する防衛体制を整え、その子オットー1世による皇帝戴冠・神聖ローマ帝国建国の土台を築いた。' },
  { id:'hohenstaufen_dynasty', name:'シュタウフェン朝', category:'dynasty', lat:50.78, lng:6.08, start:1138, end:1254, region:'神聖ローマ帝国',
    desc:'シュヴァーベン公家出身で、皇帝コンラート3世に始まりフリードリヒ1世(バルバロッサ)・フリードリヒ2世を輩出した王朝。皇帝権の実質的な基盤強化を狙ってイタリア政策(北イタリア諸都市=ロンバルディア同盟の制圧、シチリア王国の獲得)に積極的に介入し、一時はシチリアからドイツにまたがる大領域を築いたが、この介入は教皇との激しい対立(複数回の破門)を招き続けた。フリードリヒ2世の死後、後継者たちが次々に非業の死を遂げて男系が断絶すると、帝国は皇帝不在の「大空位時代」という深刻な権力の空白期に陥った。' },
  { id:'charles_iv_hre', name:'カール4世', category:'person', parentId:'hre', lat:50.11, lng:14.44, start:1316, end:1378, region:'神聖ローマ帝国(ボヘミア王兼任)',
    desc:'ボヘミア王(ルクセンブルク家出身)を兼ねた皇帝で、幼少期をフランス宮廷で過ごしフランス文化にも通じた教養人。金印勅書(1356年)を発布して皇帝を選出する7人の選帝侯(聖俗の有力諸侯)とその手続きを明文化し、以後の皇帝選挙における混乱・介入を防ぐ帝国の事実上の根本法を確立した一方、この文書は諸侯の高度な自立性(裁判権・貨幣鋳造権など)も同時に保障するものであり、結果的に帝国の分権的性格を法的に追認する内容でもあった。ドイツ本国よりも自らの本拠地ボヘミアの整備に力を注ぎ、プラハにカレル大学(中欧最古の大学)を創設するなど、プラハを帝都に準じる学術・文化の中心都市に育て上げた。' },
  { id:'concordat_worms', name:'ヴォルムス協約', category:'treaty', lat:49.63, lng:8.36, start:1122, end:1122, region:'神聖ローマ帝国(ヴォルムス)',
    desc:'皇帝ハインリヒ5世と教皇カリストゥス2世の間で結ばれ、約半世紀近く続いた叙任権闘争(カノッサの屈辱で頂点に達した対立)に一応の決着をつけた協約。聖職者の霊的な叙任(指輪・杖の授与)は教会側(教皇)の権限に、世俗的な権限を象徴する封土の授与(笏の授与)は皇帝側の権限にそれぞれ帰属させることで、宗教的権威と世俗的権威を制度的に分離する妥協案が採用された。この妥協は完全な解決とは言えなかったものの、聖俗両権力の役割を明確に切り分けるという発想は、以後のヨーロッパにおける教会と国家の関係のあり方に長期的な影響を与えた。' },
  { id:'ferdinand_i_hre', name:'フェルディナント1世', category:'person', parentId:'hre', lat:48.21, lng:16.37, start:1503, end:1564, region:'神聖ローマ帝国・オーストリア',
    desc:'カール5世の弟で、兄からオーストリア・ボヘミア・ハンガリーの所領を分与されてハプスブルク家オーストリア系の始祖となった皇帝。兄カール5世の退位を受けて神聖ローマ皇帝位を継承し、ルターの宗教改革以降深刻化していた宗教対立の収拾に努めて、諸侯の信仰選択権を認めるアウクスブルクの和議(1555年、兄の在位中に成立)のもとでの現実的な宗教共存路線を継続した。オスマン帝国のハンガリー方面への圧力にも直面し続け、以後のハプスブルク家によるオスマン帝国との長期的な対抗関係(第1次ウィーン包囲以降)の一翼を担った。' },
  { id:'brandenburg_margraviate', name:'ブランデンブルク辺境伯国', category:'nation', lat:52.52, lng:13.4, start:1157, end:1618, region:'北ドイツ(ブランデンブルク)',
    desc:'神聖ローマ帝国の選帝侯領の一つとして東方植民(ドイツ人の東方への入植)の過程で形成された辺境伯国。1415年以降ホーエンツォレルン家が皇帝ジギスムントから封じられて統治するようになり、当初は帝国内でも比較的目立たない中規模領邦であったが、1618年に東方の(旧ドイツ騎士団領を世俗化した)プロイセン公国と同君連合を結成(ブランデンブルク=プロイセン)、飛び地を抱える分散的な領土構成ながら着実に力を蓄え、後のプロイセン王国、さらにはドイツ帝国の直接の母体となる重要な出発点となった。' },
  { id:'charles_vi_hre', name:'カール6世', category:'person', parentId:'hre', lat:48.21, lng:16.37, start:1685, end:1740, region:'神聖ローマ帝国・オーストリア',
    desc:'男子後継者に恵まれず、娘マリア=テレジアへのハプスブルク家領(オーストリア・ボヘミア・ハンガリーなど)の分割不可・一括相続を諸国に事前に承認させるため、長年にわたり外交努力を重ねて国事詔書(プラグマティッシェ=ザンクツィオン)を各国に受諾させた皇帝。しかし彼の死後、これを承認していたはずのプロイセン王フリードリヒ2世がいち早くシュレジエンに侵攻して国事詔書を反故にし、オーストリア継承戦争が勃発するなど、生前の周到な外交努力にもかかわらず継承問題は結局大きな国際紛争を招く結果となった。' },
  { id:'war_polish_succession', name:'ポーランド継承戦争', category:'war', lat:52.23, lng:21.01, start:1733, end:1738, region:'ポーランド・イタリア',
    desc:'ポーランド王位継承をめぐり、フランス・スペインとオーストリア・ロシアが対立した戦争。主戦場はむしろイタリアとなり、最終的にロレーヌ公国がフランスに、ナポリ・シチリアがスペイン系ブルボン家に帰属することで決着した。' },
  { id:'treaty_hubertusburg', name:'フベルトゥスブルク条約', category:'treaty', lat:51.29, lng:12.98, start:1763, end:1763, region:'ザクセン(フベルトゥスブルク)',
    desc:'七年戦争における中央ヨーロッパ戦線(プロイセン・オーストリア間)を終結させた講和条約。プロイセンによるシュレジエン領有が最終的に確定し、プロイセンがヨーロッパの列強としての地位を不動のものとした。' },
  { id:'second_schleswig_war', name:'デンマーク戦争(第2次シュレスヴィヒ戦争)', category:'war', lat:54.78, lng:9.44, start:1864, end:1864, region:'シュレスヴィヒ・ホルシュタイン(デンマーク国境地帯)',
    desc:'シュレスヴィヒ・ホルシュタイン両公国の帰属をめぐり、プロイセン・オーストリアの連合軍がデンマークを破った戦争。ビスマルクによるドイツ統一戦争の第一段階と位置づけられ、勝利後の両公国の管理をめぐる対立が次の普墺戦争を誘発した。' },
  { id:'treaty_tilsit', name:'ティルジット条約', category:'treaty', lat:55.08, lng:21.89, start:1807, end:1807, region:'東プロイセン(ティルジット)',
    desc:'ナポレオンが、敗北したプロイセン・ロシアとそれぞれ結んだ講和条約。プロイセンは領土の半分近くと人口を失う屈辱的な内容となり、この衝撃が後のプロイセンにおける諸改革(シュタイン・ハルデンベルクの改革)の出発点となった。' },
  { id:'francis_ii_hre', name:'フランツ2世(神聖ローマ皇帝/フランツ1世としてオーストリア皇帝)', category:'person', parentId:'hre', lat:48.21, lng:16.37, start:1768, end:1835, region:'神聖ローマ帝国・オーストリア帝国',
    desc:'最後の神聖ローマ皇帝。ナポレオンが皇帝を称し(1804年)フランス支配下のドイツ諸邦がライン同盟を結成するなど神聖ローマ帝国の存続基盤が事実上崩壊する中、ハプスブルク家の帝位としての権威を維持するため、先んじて「オーストリア皇帝フランツ1世」の地位を新設して自ら即位した。翌1806年、ナポレオンからの圧力(帝位放棄の実質的な要求)のもと、ついに神聖ローマ帝国の解体を正式に宣言し、962年のオットー1世戴冠以来約840年続いた帝国はここに名実ともに消滅した。' },
  { id:'reinsurance_treaty', name:'再保障条約', category:'treaty', lat:52.52, lng:13.4, start:1887, end:1887, region:'ドイツ帝国・ロシア',
    desc:'ビスマルクがフランスの孤立とロシアとの対立回避を狙って結んだ独露間の秘密条約。ビスマルク辞任後の1890年に更新されずに失効し、これがロシアとフランスの接近(露仏同盟)を招く一因となった。' },

  /* =====================================================================
     ⑥ スペイン・ポルトガル 追加データ
     ===================================================================== */
  { id:'castile_kingdom', name:'カスティリャ王国', category:'nation', lat:40.42, lng:-3.7, start:1065, end:1479, region:'イベリア半島中央部',
    desc:'レコンキスタ(国土回復運動)を主導したイベリア半島最大の王国。羊毛産業(メスタと呼ばれる牧羊業者組合)を経済的基盤とし、諸侯・教会・都市代表からなる身分制議会(コルテス)を通じた統治を行った。1479年、イサベル1世とアラゴン王フェルナンド2世の結婚を通じた同君連合によりアラゴン王国と統合されて事実上のスペイン王国が成立し、1492年のグラナダ陥落によりレコンキスタを完成させると同時に、コロンブスの新大陸到達を主に財政面で支援する母体ともなった。' },
  { id:'aragon_kingdom', name:'アラゴン王国', category:'nation', lat:41.65, lng:-0.88, start:1035, end:1479, region:'イベリア半島東部(バルセロナ・バレンシアを含む)',
    desc:'地中海貿易(バルセロナを中心とする商業ネットワーク)で栄えたイベリア半島東部の王国。シチリア・サルデーニャ・ナポリなど地中海の島々・南イタリアにまで領土を広げる「地中海帝国」的性格を持ち、各構成領域(アラゴン・カタルーニャ・バレンシアなど)がそれぞれ独自の議会(コルテス)や法制度を保持する連合王国的な統治体制をとった。1479年、フェルナンド2世とイサベル1世の結婚を通じたカスティリャ王国との同君連合によりスペイン王国の一角を形成したが、統合後も長らくこの地域的な自治・法制度上の独自性を保持し続けた。' },
  { id:'isabella_i_castile', name:'イサベル1世(カトリック女王)', category:'person', parentId:'castile_kingdom', lat:40.42, lng:-3.7, start:1451, end:1504, region:'カスティリャ王国',
    desc:'アラゴン王フェルナンドとの結婚により事実上のスペイン統一を実現した女王。1492年という同じ年のうちに、グラナダ陥落によるレコンキスタの完了、ユダヤ教徒追放令の発布(宗教的統一の徹底)、そしてコロンブスの航海支援による新大陸への道という3つの画期的な出来事を成し遂げ、この年はしばしばスペイン近世史の決定的な転換点とされる。夫婦は教皇から「カトリック両王」の称号を授与され、異端審問制度の整備を通じて宗教的にも国家的にも均質な近世スペインの基礎を築いた。' },
  { id:'ferdinand_ii_aragon', name:'フェルナンド2世(カトリック王)', category:'person', parentId:'aragon_kingdom', lat:41.65, lng:-0.88, start:1452, end:1516, region:'アラゴン王国',
    desc:'イサベル1世と結婚してスペイン統一の一翼を担った王。夫妻は教皇から「カトリック両王」の称号を授けられ、国内ではユダヤ教徒追放(1492年)やイスラーム教徒(モリスコ)への改宗強制など宗教的統一策を徹底する一方、対外的にはイタリア戦争でフランスと戦ってナポリ王国を獲得するなど、地中海における領土的野心も追求した現実主義的な統治者であった。' },
  { id:'portugal_kingdom', name:'ポルトガル王国', category:'nation', lat:38.72, lng:-9.14, start:1139, end:2000, region:'イベリア半島西部',
    desc:'レコンキスタの過程でカスティリャ王国から独立して成立した王国。15世紀のエンリケ航海王子による組織的な航海事業を出発点に、バルトロメウ=ディアスの喜望峰到達、ヴァスコ=ダ=ガマのインド航路開拓を経て、アフリカ沿岸からインド洋・東南アジアにまで進出する広大な海洋帝国(交易拠点のネットワークを軸とする「商業帝国」)を築き、大航海時代の先駆けとしてスペインに先んじた繁栄を実現した。しかし1580年から60年間はスペイン王による同君連合下に置かれ(フェリペ2世の継承)、独立回復後も次第にオランダ・イギリスにアジア交易の主導権を奪われて国力は相対的に後退していった。' },
  { id:'henry_navigator', name:'エンリケ航海王子', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1394, end:1460, region:'ポルトガル王国',
    desc:'自ら航海はせずとも航海士の育成や探検事業を組織的に支援した王子。アフリカ西岸の探検を推進し、後のポルトガルによるインド航路開拓や大航海時代の基盤を築いた。' },
  { id:'john_ii_portugal', name:'ジョアン2世', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1455, end:1495, region:'ポルトガル王国',
    desc:'「完全王」と呼ばれた王。バルトロメウ=ディアスの喜望峰到達を後押しし、スペインとのトルデシリャス条約交渉でも自国に有利な境界線を引き出すなど、海洋進出政策を強力に推進した。' },
  { id:'bartolomeu_dias', name:'バルトロメウ=ディアス', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1450, end:1500, region:'ポルトガル王国',
    desc:'アフリカ最南端の喜望峰に到達した最初のヨーロッパ人航海者。この到達によりインド洋への航路が理論上開かれ、後のヴァスコ=ダ=ガマのインド到達への道を切り開いた。' },
  { id:'vasco_da_gama', name:'ヴァスコ=ダ=ガマ', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1460, end:1524, region:'ポルトガル王国',
    desc:'喜望峰を回ってインドのカリカットに到達し、ヨーロッパとアジアを結ぶ直接の航路を初めて切り開いた航海者。この航路開拓によりポルトガルは香辛料貿易を独占的に握る海洋帝国への道を歩み始めた。' },
  { id:'treaty_tordesillas', name:'トルデシリャス条約', category:'treaty', lat:41.5, lng:-5.0, start:1494, end:1494, region:'カスティリャ(トルデシリャス)',
    desc:'コロンブスの新大陸到達直後、ポルトガルとスペインの間で新たな「発見」地の帰属をめぐる対立が生じたため、教皇アレクサンデル6世(スペイン出身)の調停のもとで両国が合意した境界画定条約。教皇が定めた原案よりポルトガルに有利な形で境界線(教皇子午線)を西方へ移動させ、この線を根拠にブラジル(境界線の東側)はポルトガル領、南米大陸の大半(西側)はスペイン領とされて、両国による世界分割の出発点となった。' },
  { id:'treaty_zaragoza', name:'サラゴサ条約', category:'treaty', lat:41.65, lng:-0.88, start:1529, end:1529, region:'アラゴン(サラゴサ)',
    desc:'トルデシリャス条約で大西洋側にのみ引かれていた境界線を地球の裏側(太平洋側)にまで延長し、両国の勢力圏分割を完成させた条約。特に価値の高い香辛料(丁子・肉荳蔲)の産地であったモルッカ諸島(香料諸島)の帰属をめぐる両国の争いを、ポルトガルが金銭(35万ドゥカート)を支払ってスペインの権利を買い取る形で収拾し、地球規模でのスペイン・ポルトガルの勢力圏分割(トルデシリャス・サラゴサ両条約による地球の東西分割)を完成させた。' },
  { id:'afonso_albuquerque', name:'アルブケルケ', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1453, end:1515, region:'ポルトガル王国(インド)',
    desc:'ゴア・マラッカ・ホルムズなど インド洋の要衝を次々に占領し、ポルトガルのアジア海上帝国の基礎を築いた提督。武力による要塞・拠点支配を通じて香辛料貿易の独占を図る「ポルトガル方式」を確立した。' },
  { id:'cabral', name:'カブラル', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1467, end:1520, region:'ポルトガル王国',
    desc:'インドへ向かう艦隊を率いる途上、意図的か偶然かは議論があるものの南米大陸(現ブラジル)に漂着し、ポルトガルによるブラジル領有の端緒を開いた航海者。' },
  { id:'columbus_navigator', name:'コロンブス', category:'person', lat:37.23, lng:-6.9, start:1451, end:1506, region:'スペイン(カスティリャ)に仕えたジェノヴァ出身の航海者',
    desc:'西回り航路でアジアに到達できると信じ(実際の地球の大きさを過小評価する誤算に基づく)、当初打診したポルトガル王室には拒否されたものの、最終的にスペイン女王イサベル1世の支援を得てカリブ海の島々に到達したジェノヴァ出身の航海者。本人は生涯これをアジア(インディアス)の一部と信じ続け、以後4回の航海を行って中南米沿岸を探索したが、結果的にヨーロッパ人による新大陸「発見」の端緒を開き、その名は誤って「西インド諸島」という地名に残ることになった。' },
  { id:'amerigo_vespucci', name:'アメリゴ=ヴェスプッチ', category:'person', lat:43.77, lng:11.26, start:1454, end:1512, region:'フィレンツェ出身、スペイン・ポルトガルに仕えた航海者',
    desc:'南米大陸沿岸を探査し、これがアジアの一部ではなく従来ヨーロッパに知られていなかった新たな大陸(「新世界」)であると初めて明確に主張した航海者・地理学者。彼の航海記録を紹介したドイツの地図製作者ヴァルトゼーミュラーが、その功績を称えて彼のラテン語名(アメリクス)にちなみ新大陸を「アメリカ」と命名した地図を作成したことから、この呼称がヨーロッパ全体に広まり定着した。' },
  { id:'balboa', name:'バルボア', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1475, end:1519, region:'スペイン',
    desc:'パナマ地峡を横断し、ヨーロッパ人として初めて太平洋(彼が「南の海」と呼んだ海)に到達し、これをスペイン国王の名において領有宣言した探検家。この到達は、新大陸がアジアの一部ではなく独立した大陸であり、さらにその先に別の大洋が広がっていることを示す決定的な証拠となり、後のマゼランによる太平洋横断・世界周航への地理的知識を準備した。しかし後任総督との対立から反逆罪に問われ、最終的に処刑されるという悲劇的な最期を迎えた。' },
  { id:'magellan', name:'マゼラン(マガリャンイス)', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1480, end:1521, region:'スペインに仕えたポルトガル出身の航海者',
    desc:'スペイン王カルロス1世の支援を受け、大西洋から南米大陸南端の海峡(後のマゼラン海峡)を抜けて太平洋へ出て、西回りでの世界周航によりモルッカ諸島(香料諸島)へ到達しようと試みた航海者。フィリピンの現地紛争に介入して戦死し自身は航海を完遂できなかったが、副官エルカーノに率いられた艦隊の一部(1隻・18名)が航海を継続してスペインに帰還し、史上初の世界周航を成し遂げて地球球体説を実証するとともに、地球が想定より遥かに大きいことを明らかにした。' },
  { id:'cortes_conquistador', name:'コルテス', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1485, end:1547, region:'スペイン(コンキスタドール)',
    desc:'わずかな兵力でメキシコのアステカ王国を滅ぼしたスペイン人征服者(コンキスタドール)。アステカに服属させられ重税・生贄の徴発に不満を抱いていた周辺部族(トラスカラ人など)を巧みに味方に引き入れる分断統治の戦略と、鉄砲・馬・鉄製武具などの軍事的優位、さらに現地に持ち込まれた天然痘の大流行(先住民に免疫がなく人口を激減させた)が重なり、短期間で広大な領土を征服してメキシコを新スペイン副王領の中核とした。' },
  { id:'pizarro', name:'ピサロ', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1478, end:1541, region:'スペイン(コンキスタドール)',
    desc:'南米のインカ帝国を征服したスペイン人征服者(コンキスタドール)。内乱(王位継承争い)で疲弊していたインカ帝国の隙を突き、皇帝アタワルパを謀略により捕らえ、莫大な身代金(部屋いっぱいの黄金・銀)を受け取っておきながら処刑するという背信的な手段で帝国の中枢を無力化した。わずか200名足らずの手勢でありながら、鉄砲・馬・鉄製武具といった軍事技術の圧倒的優位と、征服後に発見されたポトシ銀山などの莫大な銀資源によって、インカの広大な領土と富をスペインにもたらした。' },
  { id:'las_casas', name:'ラス=カサス', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1484, end:1566, region:'スペイン(西インド諸島)',
    desc:'新大陸で征服者(エンコミエンダ制のもとで先住民を酷使する入植者)による先住民への過酷な扱いを目撃し、聖職者として先住民の権利保護を強く訴えるようになった人物。『インディアスの破壊についての簡潔な報告』を著してスペイン国王・宮廷に先住民虐待の実態を告発し、その働きかけは先住民保護を定めた「インディアス新法」(1542年)の制定にもつながった。ヨーロッパ人以外の民族の権利を対等な人間として擁護する彼の思想は、後の国際法・人権思想における自然権概念の先駆者の一人として高く評価される。' },
  { id:'pope_alexander_vi', name:'教皇アレクサンデル6世', category:'person', lat:41.9, lng:12.49, start:1431, end:1503, region:'ローマ教皇庁(出身アラゴン)',
    desc:'ボルジア家出身の教皇。スペイン・ポルトガル両国の新大陸をめぐる争いを調停し、トルデシリャス条約の前提となった教皇子午線を設定したことで知られる。' },
  { id:'philip_ii_spain', name:'フェリペ2世', category:'person', parentId:'spain_kingdom', lat:40.42, lng:-3.7, start:1527, end:1598, region:'スペイン王国',
    desc:'カルロス1世(カール5世)の子で、スペイン最盛期を築いた王。新大陸(ポトシ銀山など)からもたらされる銀の富を背景に、熱心なカトリック擁護者としてオスマン帝国海軍をレパントの海戦で撃破し、ポルトガル王位も継承して(同君連合)版図を最大化した。しかしオランダ独立戦争の泥沼化とイングランド支援への報復として送ったスペイン無敵艦隊の壊滅的敗北(1588年)は「太陽の沈まぬ帝国」の限界を露呈させ、度重なる戦費調達による国家財政の破綻(複数回のデフォルト)は晩年の治世に暗い影を落とした。' },
  { id:'dutch_revolt', name:'オランダ独立戦争(八十年戦争)', category:'war', lat:52.37, lng:4.9, start:1568, end:1648, region:'ネーデルラント(現オランダ・ベルギー)',
    desc:'スペイン支配とカトリック強制への反発から、ネーデルラント北部諸州が起こした独立戦争。オラニエ公ウィレムらに率いられ、事実上1609年の休戦で独立を確立、1648年のウェストファリア条約で国際的にも正式承認された。' },
  { id:'battle_lepanto', name:'レパントの海戦', category:'war', lat:38.28, lng:21.44, start:1571, end:1571, region:'ギリシャ沖(レパント/ナフパクトス沖)',
    desc:'スペイン・ヴェネツィアなどのキリスト教連合艦隊が、オスマン帝国艦隊を撃破した海戦。地中海における「無敵」オスマン海軍の威信に打撃を与えた戦いとして、当時のヨーロッパで大きく喧伝された。' },
  { id:'catalan_revolt', name:'カタルーニャの反乱', category:'revolution', lat:41.39, lng:2.16, start:1640, end:1652, region:'スペイン(カタルーニャ)',
    desc:'三十年戦争の戦費調達のためオリバーレス公が進めた増税・軍事負担の均等化政策(「連合の方策」)への反発から、カタルーニャがフランスの支援を得てスペイン王権からの離脱・独立を試みた反乱。一時はフランス王への忠誠を宣言してフランスの保護下に入ったが、最終的にスペイン軍によって鎮圧された。この反乱はほぼ同時期に起きたポルトガルの独立revolt(1640年)とあわせて、フェリペ4世治下のスペイン中央集権化政策の限界と、多民族・多地域から成る「複合君主政」としてのスペインの構造的脆弱性を露呈させた。' },
  { id:'treaty_cateau_cambresis', name:'カトー=カンブレジ条約', category:'treaty', lat:50.15, lng:3.53, start:1559, end:1559, region:'フランス北部',
    desc:'フランスとスペイン(ハプスブルク家)との間でイタリア戦争を終結させた講和条約。イタリアにおけるスペインの優位が確定し、以後イタリア半島は長くスペインの強い影響下に置かれた。' },
