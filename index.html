  { id:'treaty_pyrenees', name:'ピレネー条約', category:'treaty', lat:42.67, lng:1.02, start:1659, end:1659, region:'フランス・スペイン国境(ピレネー山脈)',
    desc:'フランスとスペインの間で三十年戦争終結後も続いていた戦争(フランス=スペイン戦争)を終結させた条約。スペインはフランドル地方の一部やルシヨン地方などをフランスに割譲し、あわせてルイ14世とスペイン王女マリー=テレーズの結婚(持参金の支払いを条件に彼女の王位継承権放棄を定める)も取り決められたが、後にこの持参金が実際には支払われなかったことを口実に、ルイ14世は妻の継承権を根拠としてスペイン領ネーデルラントへの侵攻(南ネーデルラント継承戦争)を正当化した。この条約を機にヨーロッパにおける両国の力関係はフランス優位へと決定的に転換した。' },
  { id:'philip_v_spain', name:'フェリペ5世', category:'person', parentId:'spain_kingdom', lat:40.8, lng:2.12, start:1683, end:1746, region:'スペイン王国',
    desc:'ルイ14世の孫で、スペイン継承戦争を経てスペイン王位に就きブルボン朝を開いた王。この即位はフランス・スペイン両ブルボン家の結合(将来の合邦)を懸念するイギリス・オランダ・オーストリアなど諸国の反発を招き、大戦争(スペイン継承戦争)の直接の原因となったが、最終的にユトレヒト条約で「両国は永久に合邦しない」ことを条件に王位が承認された。国内ではフランス式の中央集権的な行政制度を導入し(新組織王令)、地方(アラゴン連合王国側)の伝統的特権を廃止するなど、フランス絶対王政をモデルとした統治体制への転換を進めた。' },
  { id:'peninsular_war', name:'スペイン独立戦争(半島戦争)', category:'war', lat:40.42, lng:-3.7, start:1808, end:1814, region:'イベリア半島',
    desc:'ナポレオンがポルトガル制圧の名目でスペインに派兵し、さらにスペイン王家を退位させて兄ジョゼフを傀儡王に据えたことへの反発から、スペイン民衆が各地でゲリラ戦(ゲリラの語源となった戦術)を展開して抵抗した戦争。正規軍同士の戦いでは苦戦する場面もあったが、ウェリントン率いるイギリス軍の介入とポルトガル・スペイン双方でのゲリラ的消耗戦が組み合わさってフランス軍の兵力を長期間拘束し続け、「スペインの潰瘍」と呼ばれるほどナポレオン軍を消耗させて、その後のロシア遠征失敗と並ぶナポレオン没落の重要な一因となった。' },
  { id:'carlist_wars', name:'カルリスタ戦争', category:'war', lat:43.26, lng:-2.94, start:1833, end:1876, region:'スペイン(バスク・カタルーニャ地方など)',
    desc:'フェルナンド7世の死後、女児継承を認める勅令(プラグマティカ)を不服として弟カルロスが王位を主張したことに端を発し、王位継承問題と表裏一体で伝統的地域特権(フエロス)の維持を求める保守的なカルロス派(カルリスタ)と、中央集権的な自由主義体制を志向する政府側との間で断続的に戦われた一連の内戦。バスク・カタルーニャなど地方の伝統的自治を守ろうとするカルリスタの主張は、地方分権とスペイン国家統合をめぐる対立軸として、その後もスペイン近現代政治(20世紀の内戦にまで連なる地域対立)に長く影響を残した。' },
  { id:'spanish_liberal_revolution_1820', name:'スペイン立憲革命(1820年革命)', category:'revolution', lat:36.53, lng:-6.29, start:1820, end:1823, region:'スペイン',
    desc:'南米植民地への派遣を命じられていた軍人リエゴらが、遠征への不満も背景に蜂起し、フェルナンド7世が復古後に廃棄していた1812年カディス憲法の復活と自由主義的改革を国王に強制した革命(「自由主義の三年間」)。この自由主義体制はしかし、ウィーン体制下の神聖同盟(特にフランス)による軍事介入(「サン=マルタンの百万の息子たち」)を招き、わずか3年で崩壊して専制王政に引き戻された。この鎮圧はまた、本国の混乱に乗じて独立運動が加速していたラテンアメリカ植民地の独立を後押しする結果ともなった。' },
  { id:'spanish_glorious_revolution_1868', name:'スペイン九月革命(名誉革命)', category:'revolution', lat:36.13, lng:-5.35, start:1868, end:1868, region:'スペイン(カディス)',
    desc:'財政悪化と専制的統治への不満から、進歩派の軍人・政治家が蜂起して女王イサベル2世を追放した革命。その後の王位をめぐる混乱では、プロイセン系のホーエンツォレルン家候補者を新国王に擁立しようとする動きがフランスの猛反発を招き(エムス電報事件を誘発し普仏戦争の引き金の一つとなった)、最終的にイタリア系のアマデオ1世が短期間即位した後、一時的な共和政(第一共和政)樹立を経て、最終的にはブルボン家のアルフォンソ12世の復位により王政に復帰するなど、ヨーロッパ国際政治にも大きな波紋を広げた。' },
  { id:'second_spanish_republic', name:'スペイン第二共和政', category:'nation', lat:40.42, lng:-3.7, start:1931, end:1939, region:'スペイン',
    desc:'王党派・共和派を問わず広範な批判を浴びていた国王アルフォンソ13世が地方選挙での共和派圧勝を受けて亡命し、無血で成立した共和政。土地改革(大土地所有制の是正)、政教分離(教会財産の国有化・修道会解散)、地域自治(カタルーニャなどへの自治権付与)、軍制改革など急進的な近代化改革を試みたが、これに反発する地主・教会・軍部などの保守勢力と、改革の不徹底に不満を強める労働者・農民勢力(アナーキスト・社会主義勢力)との間で左右の対立が先鋭化し、1936年の総選挙での人民戦線勝利を機に軍部(フランコら)が反乱を起こしてスペイン内戦へと突入した。' },
  { id:'spanish_civil_war', name:'スペイン内戦', category:'war', lat:40.42, lng:-3.7, start:1936, end:1939, region:'スペイン',
    desc:'人民戦線内閣に対し、フランコ将軍らが率いる軍部が反乱を起こして始まった内戦。ファシズム陣営のドイツ・イタリアが反乱軍(国民戦線)側に航空戦力(コンドル軍団など)や兵器を供与し、ゲルニカ爆撃のような無差別爆撃の実験場ともなった一方、ソ連や各国から集まった国際義勇兵が共和国側を支援するなど、事実上の「第二次世界大戦の前哨戦」としての性格を帯びた。英仏を中心とする不干渉政策は結果的に反乱軍側を利する形となり、最終的にフランコ側が勝利して以後約36年間続く独裁体制の出発点となった。' },
  { id:'spanish_state_franco', name:'フランコ体制(スペイン国)', category:'nation', lat:40.42, lng:-3.7, start:1939, end:1975, region:'スペイン',
    desc:'スペイン内戦に勝利したフランコによる長期独裁体制。当初は枢軸国寄りの姿勢を示しつつ正式参戦は回避する慎重な外交により体制の存続を図り、第二次世界大戦後は国際的孤立を経験したものの、冷戦の進行とともに反共の砦としてアメリカなど西側陣営に受け入れられて国際社会に復帰した。1960年代以降は観光業の振興や外資導入による経済成長(「スペインの奇跡」)を実現する一方、政治的自由は厳しく制限され続け、フランコの死(1975年)を機に、彼自身が指名した後継の国王フアン=カルロス1世のもとでの民主化へと移行した。' },
  { id:'francisco_franco', name:'フランシスコ=フランコ', category:'person', parentId:'spanish_state_franco', lat:40.42, lng:-3.7, start:1892, end:1975, region:'スペイン',
    desc:'スペイン内戦を勝利に導き、以後約36年間にわたり独裁体制を敷いた軍人・国家元首。「総統(カウディーリョ)」として国家・軍・唯一政党(ファランヘ党)の権力を一身に集め、反共産主義を掲げて西側陣営に接近する一方、国内では厳格な統制・言論弾圧と、カタルーニャ語などの地域言語・文化の抑圧による強圧的な中央集権化を続けた。第二次世界大戦では枢軸国寄りの姿勢を示しつつも正式参戦は回避する現実主義的な外交により体制存続を図り、晩年には後継者としてブルボン家のフアン=カルロスを国王に指名して、死後の穏健な体制移行(民主化)への布石を残した。' },
  { id:'spanish_transition_democracy', name:'スペイン民主化(スペインへの移行)', category:'event', lat:40.42, lng:-3.7, start:1975, end:1978, region:'スペイン',
    desc:'フランコの死後、後継者に指名されていた国王フアン=カルロス1世が独裁体制の継続ではなく自ら主導して進めた民主化の過程。旧体制の政治家スアレスを首相に起用して政党の合法化・自由選挙の実施を進め、1978年の新憲法制定により立憲君主政のもとでの議会制民主主義を確立した。1981年には一部軍人によるクーデタ未遂(23-F)が起きたが、国王自らテレビ演説で民主主義体制の維持を国民に訴えてこれを鎮静化させ、独裁から民主政への平和的な移行(「協約による移行」)を成し遂げた事例として国際的にも高く評価された。' },

  /* =====================================================================
     ⑦ ロシア史 追加データ(キエフ公国〜モスクワ大公国〜ロマノフ朝〜ソ連〜現代)
     ===================================================================== */
  { id:'rurik', name:'リューリク', category:'person', lat:58.52, lng:31.28, start:830, end:879, region:'ノヴゴロド(伝承上のルーシ建国者)',
    desc:'スラヴ人・フィン人の招請によりノヴゴロドの支配者になったと伝えられるノルマン系ルーシ人の首長。彼に始まるとされる系譜(リューリク朝)は、その後700年以上にわたりロシアの支配者を輩出し続けた。' },
  { id:'rurik_dynasty', name:'リューリク朝', category:'dynasty', lat:55.75, lng:37.62, start:862, end:1598, region:'ノヴゴロド・キエフ・モスクワ',
    desc:'伝説的な首長リューリクに始まるとされる、ロシア史上最も長く続いた王朝。当初キエフ公国を中心としたが、モンゴル支配下でモスクワ大公国が徴税代行者として台頭すると支配の中心を移し、イヴァン3世・イヴァン4世のもとでロシア統一とツァーリ専制の確立を成し遂げた。しかしイヴァン4世の子フョードル1世が嗣子なく没したことで直系が断絶し、これが動乱時代(スムータ)と呼ばれる長期の内乱・外国干渉を招く直接の要因となった。' },
  { id:'vladimir_i_kiev', name:'ウラディミル1世(聖公)', category:'person', parentId:'kievan_rus', lat:55.75, lng:37.62, start:958, end:1015, region:'キエフ公国',
    desc:'当初は複数の異教の神々を祀る多神教を国家統合の手段として整備しようとしたが、周辺諸国の一神教(イスラーム・ユダヤ教・カトリック・ギリシャ正教)を比較検討した末、ビザンツ皇女アンナとの結婚を条件にギリシャ正教への改宗を選び、これをキエフ公国の国教と定めた公。この選択により、以後のロシアは西欧カトリック世界とは異なるビザンツ(東ローマ)文明の宗教的・文化的影響下で発展することとなり、教会スラヴ語による典礼やキリル文字の使用などその影響は現代にまで及んでいる。' },
  { id:'novgorod_republic', name:'ノヴゴロド公国(共和政)', category:'nation', lat:58.52, lng:31.28, start:1136, end:1478, region:'ロシア北西部(ノヴゴロド)',
    desc:'公が市民集会(ヴェーチェ)によって選出・追放される、他のロシア諸公国とは一線を画す共和政的な統治形態をとった有力都市国家。バルト海交易(ハンザ同盟の在外商館も置かれた)で経済的に繁栄し、アレクサンドル=ネフスキーの指導のもとスウェーデン軍・ドイツ騎士団の侵攻も撃退して独立を保ったが、モスクワ大公国の統一事業が進む中でイヴァン3世に攻略・併合され、その独自の自治的伝統は失われた。' },
  { id:'golden_horde', name:'キプチャク=ハン国(ジョチ=ウルス、黄金の大群)', category:'nation', lat:48.14, lng:46.85, start:1242, end:1502, region:'南ロシア・中央アジア草原地帯',
    desc:'モンゴル帝国の西方遠征を主導したバトゥが、南ロシア・中央アジア草原地帯に建てた国家(ジョチ=ウルス)。ロシア諸公国を直接統治せず、貢納と忠誠を条件に現地の公(クニャージ)による自治を認める間接支配体制(「タタールのくびき」)を約240年にわたり敷いた。内紛や諸公国(特にモスクワ大公国)の抵抗が強まる中で次第に弱体化し、クリミア=ハン国・カザン=ハン国など複数の後継国家に分裂して解体した。' },
  { id:'mongol_yoke', name:'タタールのくびき(モンゴルによるロシア支配)', category:'event', lat:55.75, lng:37.62, start:1237, end:1480, region:'ロシア諸公国',
    desc:'バトゥの西征以降、ロシア諸公国がキプチャク=ハン国の間接支配・貢納の下に置かれた約240年間を指す呼称。モスクワ大公国はハンの徴税代行者として台頭し、皮肉にもこの支配体制の中でロシア統一の中心的地位を築いていった。' },
  { id:'alexander_nevsky', name:'アレクサンドル=ネフスキー', category:'person', lat:59.93, lng:30.36, start:1221, end:1263, region:'ノヴゴロド・ウラディミル大公国',
    desc:'西からの十字軍勢力(スウェーデン軍をネヴァ河畔の戦いで、ドイツ騎士団を「氷上の戦い」でそれぞれ)撃退し、カトリック世界による西方からの軍事的・宗教的圧力を退けた公。一方でモンゴル(キプチャク=ハン国)に対しては軍事的抵抗を放棄し貢納に応じる恭順策をとって実利的にロシア諸公国の存続を図るという、東西で全く異なる対応を使い分けた現実主義的な統治者であった。この選択は後世「正教とロシアの独自性を西方カトリックの脅威から守った英雄」として神格化され、ロシア正教会からも列聖された。' },
  { id:'moscow_grand_duchy', name:'モスクワ大公国', category:'nation', lat:55.75, lng:37.62, start:1263, end:1547, region:'ロシア(モスクワ)',
    desc:'キプチャク=ハン国の徴税代行者としての地位を巧みに利用して力を蓄え、ロシア諸公国統一の中心となった公国。教会(府主教座)を誘致して精神的権威も獲得し、イヴァン3世の代にはノヴゴロドなど周辺諸公国を次々に併合するとともにモンゴルへの貢納を拒否して「タタールのくびき」を完全に脱した。ビザンツ帝国滅亡後は「モスクワは第三のローマ」との理念を掲げ、正教世界の後継者としての正統性を主張しつつ、次代イヴァン4世による中央集権的なツァーリ専制国家(ロシア・ツァーリ国)への移行を準備した。' },
  { id:'ivan_iii_great', name:'イヴァン3世(大帝)', category:'person', parentId:'moscow_grand_duchy', lat:55.75, lng:37.62, start:1440, end:1505, region:'モスクワ大公国',
    desc:'モンゴル(キプチャク=ハン国)への貢納を拒否して(「ウグラ河畔の対峙」)、約240年続いた「タタールのくびき」を実質的に終わらせた大公。ノヴゴロド公国・トヴェリ公国など周辺の有力諸公国を次々に併合・服属させてロシア統一を大きく前進させ、ビザンツ帝国最後の皇帝の姪ソフィアと結婚してビザンツの後継者としての権威も取り込み、初めて「全ロシアの君主(ゴスダーリ)」を称してツァーリ専制国家の礎を築いた。' },
  { id:'tsardom_russia', name:'ロシア・ツァーリ国', category:'nation', lat:55.75, lng:37.62, start:1547, end:1721, region:'ロシア',
    desc:'イヴァン4世が「ツァーリ(皇帝、カエサルに由来)」の称号を正式に採用して成立した国家。中央集権化と専制強化が進められたが、イヴァン4世死後にリューリク朝が断絶すると深刻な内乱(動乱時代)に陥り、国民的抵抗運動を経てミハイル=ロマノフが新皇帝に選出されてロマノフ朝が開かれた。以後ピョートル1世が西欧化改革を進めて皇帝(インペラートル)を称しロシア帝国の成立を宣言するまで、この国号のもとでの統治が続いた。' },
  { id:'ivan_iv_terrible', name:'イヴァン4世(雷帝)', category:'person', parentId:'tsardom_russia', lat:55.75, lng:37.62, start:1530, end:1584, region:'ロシア・ツァーリ国',
    desc:'幼くして即位し、諸侯の内紛を経験した後、正式に「ツァーリ」の称号を採用した最初の君主。当初は法典編纂や身分制議会(ゼムスキー=ソボル)の開催など統治機構の整備を進め、カザン=ハン国・アストラハン=ハン国を征服してヴォルガ川流域を制圧、イェルマークの遠征によるシベリア進出も開始させた。しかし妻の死後は精神的に不安定化し、直属の親衛隊(オプリーチニキ)を用いて貴族(ボヤーレ)を弾圧する恐怖政治(オプリーチニナ)を敷いて国内を疲弊させ、さらには激情に駆られて実子を殴殺したとも伝えられ、その死後の後継者不在がロシアを動乱時代へと導く遠因となった。' },
  { id:'time_of_troubles', name:'動乱時代(スムータ)', category:'event', lat:55.75, lng:37.62, start:1598, end:1613, region:'ロシア',
    desc:'リューリク朝がイヴァン4世の子フョードル1世の死により断絶したことに端を発し、複数の皇位僭称者(偽ドミトリーなど)の乱立、有力貴族間の権力闘争、さらにはポーランド・スウェーデンによる軍事介入(ポーランド軍によるモスクワ占領を含む)が重なって深刻な内乱・無政府状態が続いた時期。この対外的危機に対し、ミーニンとポジャルスキーが率いる国民的な義勇軍(民衆蜂起)がモスクワからポーランド軍を駆逐し、全国会議(ゼムスキー=ソボル)によってミハイル=ロマノフが新たな皇帝に選出されて、ロマノフ朝の成立とともにようやく収拾された。' },
  { id:'michael_romanov', name:'ミハイル=ロマノフ', category:'person', parentId:'tsardom_russia', lat:55.75, lng:37.62, start:1596, end:1645, region:'ロシア・ツァーリ国',
    desc:'動乱時代の混乱(皇位僭称者の乱立、ポーランド・スウェーデンの介入)を収拾するため、全国から集められた身分制議会(全国会議、ゼムスキー=ソボル)の選挙によって皇帝に選出された人物。有力貴族出身ながら政治経験の浅さゆえにかえって諸勢力の妥協点として受け入れられたとされ、以後1917年の革命に至るまで300年以上ロシアを統治し続けるロマノフ朝を開いた。' },
  { id:'romanov_dynasty', name:'ロマノフ朝', category:'dynasty', lat:55.75, lng:37.62, start:1613, end:1917, region:'ロシア',
    desc:'動乱時代の混乱収拾のため全国会議(ゼムスキー=ソボル)で選出されたミハイル=ロマノフに始まる王朝。ピョートル1世の西欧化改革とエカチェリーナ2世期の対外拡張(ポーランド分割・南下政策)によりロシアをヨーロッパの大国に押し上げたが、19世紀後半以降は近代化の遅れが専制への不満を蓄積させ、日露戦争の敗北や第一次世界大戦の長期化がその矛盾を一気に噴出させて、1917年のロシア革命により300年以上続いた統治は終焉を迎えた。' },
  { id:'catherine_ii_great', name:'エカチェリーナ2世(大帝)', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1729, end:1796, region:'ロシア帝国',
    desc:'ドイツ諸侯出身ながら、無能な夫ピョートル3世を廃する宮廷クーデタで即位した女帝。啓蒙専制君主としてヴォルテールら啓蒙思想家と文通し学芸を奨励する一方、プガチョフの農民反乱を機に農奴制への締め付けをむしろ強化するなど内政面では保守的な統治にとどまった。対外的にはオスマン帝国との戦争でクリミア半島を獲得して黒海への進出を確保し、プロイセン・オーストリアと結んでポーランド分割(3回)に参加してポーランドを消滅させるなど、積極的な対外拡張によりロシアの大国化を大きく前進させた。' },
  { id:'pugachev_rebellion', name:'プガチョフの乱', category:'revolution', lat:51.53, lng:46.03, start:1773, end:1775, region:'ロシア南部・ヴォルガ川流域',
    desc:'皇帝を僭称するコサックのプガチョフに率いられた、農民・コサックによる大規模な反乱。エカチェリーナ2世治下最大の内乱となったが鎮圧され、以後農奴に対する統制はむしろ強化された。' },
  { id:'patriotic_war_1812', name:'祖国戦争(1812年、ナポレオンのロシア遠征)', category:'war', lat:55.75, lng:37.62, start:1812, end:1812, region:'ロシア',
    desc:'ナポレオンの大軍によるロシア侵攻とその壊滅的な敗退を指す戦争。ロシア軍は焦土作戦をとってモスクワを放棄し、冬将軍と補給線の途絶がフランス軍を壊滅させ、ナポレオン没落の決定的な転機となった。' },
  { id:'decembrist_revolt', name:'デカブリストの乱', category:'revolution', lat:59.93, lng:30.36, start:1825, end:1825, region:'ロシア(サンクトペテルブルク)',
    desc:'ナポレオン戦争でロシア軍が西欧に遠征した際に自由主義思想に触れた青年貴族将校たちが、ニコライ1世の即位に際して憲法制定や農奴制廃止を求めて起こした武装蜂起。皇帝直属軍によって即座に鎮圧され首謀者は処刑・シベリア流刑に処されたが、貴族出身のエリート層自らが専制打倒を目指した点で、ロシアにおける最初の近代的・組織的な反体制運動として、後のナロードニキ運動や革命運動に大きな精神的影響を残した。' },
  { id:'nicholas_i_russia', name:'ニコライ1世', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1796, end:1855, region:'ロシア帝国',
    desc:'デカブリストの乱の鎮圧という試練の中で即位し、以後その反動として国内外の自由主義・国民主義運動を徹底的に弾圧し続けた皇帝。1848年革命の際にはハンガリー革命鎮圧にも軍事介入して「ヨーロッパの憲兵」と呼ばれる保守反動体制の守護者としての役割を担った。しかし対外的な威信をかけたクリミア戦争でイギリス・フランスに敗れ、ロシアの軍事的・産業的後進性(鉄道網の未整備、農奴制に基づく非効率な経済)が白日のもとにさらされ、その衝撃のさなかに没した。' },
  { id:'emancipation_serfs_russia', name:'農奴解放令', category:'event', lat:55.75, lng:37.62, start:1861, end:1861, region:'ロシア帝国',
    desc:'クリミア戦争敗北が露呈させた軍事的・経済的後進性への危機感を背景に、アレクサンドル2世が発した、ロシア農民を領主への人格的隷属状態(農奴制)から解放する勅令。人身の自由は認められたものの、農民は土地を無償で得られず、高額な買い戻し金(償還金)を長期にわたり分割で領主に支払う義務を負わされる不完全な解放にとどまり、多くの農民は共同体(ミール)に事実上縛り付けられ続けたため、農民の根本的な不満は解消されず、後のナロードニキ運動や1905年革命の伏線となった。' },
  { id:'alexander_ii_russia', name:'アレクサンドル2世', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1818, end:1881, region:'ロシア帝国',
    desc:'クリミア戦争敗北が露呈させたロシアの後進性を克服すべく、農奴解放令(1861年)をはじめとする一連の近代化改革(「大改革」、地方自治制度ゼムストヴォの導入、司法改革、軍制改革など)を進めた皇帝。しかし土地を伴わない不完全な農奴解放は農民の不満を解消できず、改革の停滞・後退に苛立ちを強めた急進的なナロードニキ(人民主義者)勢力からテロの標的とされ続け、最終的に「人民の意志」による爆弾テロで暗殺された。' },
  { id:'alexander_iii_russia', name:'アレクサンドル3世', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1845, end:1894, region:'ロシア帝国',
    desc:'父アレクサンドル2世暗殺の衝撃から、改革路線を転換して反動的な専制強化・反改革政策を進めた皇帝。フランス資本の導入によるシベリア鉄道建設など急速な国家主導の工業化を推進する一方で、地方自治(ゼムストヴォ)の権限縮小や、少数民族へのロシア化政策、ユダヤ人への組織的迫害(ポグロム)の黙認・助長など抑圧的な統治を強めた。この強権的な安定は表面的なものにとどまり、次代ニコライ2世期の社会矛盾激化への布石ともなった。' },
  { id:'nicholas_ii_russia', name:'ニコライ2世', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1868, end:1918, region:'ロシア帝国',
    desc:'ロマノフ朝最後の皇帝。1905年革命では十月宣言により国会(ドゥーマ)開設などの譲歩を余儀なくされながらも専制の本質を維持しようとし、日露戦争の敗北に続き、第一次世界大戦への参戦がもたらした深刻な物資不足と厭戦気分の高まりが国内の不満を決定的に爆発させた。1917年のロシア革命(二月革命)により退位に追い込まれ、皇帝として初めて内乱状態の中で拘束される屈辱を味わい、翌1918年には家族もろとも銃殺されてロマノフ朝300年の歴史に終止符が打たれた。' },
  { id:'revolution_1905_russia', name:'1905年革命(第一次ロシア革命)', category:'revolution', lat:59.93, lng:30.36, start:1905, end:1907, region:'ロシア帝国',
    desc:'日露戦争の劣勢による社会不安の中、平和的な請願行進の民衆に軍が発砲した「血の日曜日事件」を機に、労働者のストライキ・農民暴動・少数民族の自治要求・軍の一部反乱(戦艦ポチョムキンなど)が全国的に連鎖した革命運動。追い詰められた皇帝ニコライ2世は十月宣言を発して国会(ドゥーマ)の開設や基本的市民的自由の保障を約束し、この譲歩によって革命運動は一時収束したが、その後実際に運用された選挙制度は限定的なもので専制の根本的な変革には至らず、社会の不満は解消されないまま1917年の革命へと持ち越されることになった。' },
  { id:'rasputin', name:'ラスプーチン', category:'person', lat:59.93, lng:30.36, start:1869, end:1916, region:'ロシア帝国(宮廷)',
    desc:'シベリア出身の放浪の祈祷師で、血友病を患う皇太子アレクセイの症状を(催眠術的な効果ともいわれる方法で)一時的に和らげたことをきっかけに、皇后アレクサンドラの絶大な信頼を獲得した人物。第一次世界大戦中は皇帝が前線に出た留守を預かる皇后への影響力を通じて事実上の人事介入まで行うようになり、その放埓な私生活とあいまって宮廷の権威と皇室への信頼を大きく損なった。危機感を強めた保守派貴族らによって最終的に暗殺されたが、時すでに遅く、この一件は帝政ロシアの権威失墜を象徴する出来事として革命前夜の空気を色濃く反映するものとなった。' },
  { id:'russian_civil_war', name:'ロシア内戦', category:'war', lat:55.75, lng:37.62, start:1917, end:1922, region:'ロシア全土',
    desc:'十月革命で権力を握ったボリシェヴィキ(赤軍)と、これに反発する旧体制派・穏健派・民族主義勢力などからなる反革命派(白軍)との間で戦われた内戦。イギリス・フランス・アメリカ・日本など連合国も反革命派を支援して干渉戦争を展開したが統一した戦略を欠き、トロツキーの指導のもと組織化された赤軍が内線の利(中央の交通網を確保する地理的優位)を活かして各個撃破に成功、最終的に勝利を収めた。この内戦下で導入された戦時共産主義(食糧の強制徴発、産業の全面国有化)は経済を著しく疲弊させ、戦後のネップ(新経済政策)への転換を余儀なくさせることになった。' },
  { id:'stalin', name:'スターリン', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1878, end:1953, region:'ソビエト連邦',
    desc:'党の実務を掌握する書記長の地位を足がかりに、レーニン死後の後継者争い(トロツキーの「世界革命論」に対し「一国社会主義論」を掲げて対抗)を制してソ連の最高指導者となった人物。国家主導による強引な農業集団化と急速な重工業化(五カ年計画)を強行して短期間での軍事大国化を実現した一方、農業集団化への抵抗は大飢饉(ホロドモールなど)による膨大な餓死者を、政敵や潜在的反対者への大粛清は数百万人ともいわれる犠牲者をそれぞれ生み出す、凄惨な代償を伴う近代化を強行した。' },
  { id:'trotsky', name:'トロツキー', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1879, end:1940, region:'ソビエト連邦',
    desc:'十月革命の軍事的成功と、その後の内戦における赤軍創設・指揮に大きく貢献した革命家・軍事指導者。世界規模での同時革命の必要性を説く「世界革命論(永続革命論)」を掲げ、一国内での社会主義建設の可能性を説くスターリンの「一国社会主義論」と激しく対立、レーニン死後の後継者争いに敗れて国外追放となった。亡命先を転々とした末、最終的にはメキシコでスターリンの放った刺客により暗殺された。' },
  { id:'five_year_plans', name:'五カ年計画', category:'event', lat:55.75, lng:37.62, start:1928, end:1941, region:'ソビエト連邦',
    desc:'スターリンのもとで実施された、国家計画委員会(ゴスプラン)が主導する国家主導型の急速な工業化・農業集団化計画。重工業(鉄鋼・機械・エネルギー)を優先的に育成する政策は短期間での軍事大国化・工業国化に一定の成果を上げ、後の独ソ戦を戦い抜く産業基盤ともなったが、農業集団化(コルホーズ・ソフホーズの設立)に対する農民の抵抗を武力で弾圧し、穀物の強制徴発は特にウクライナなどで大飢饉(ホロドモール)を引き起こして膨大な犠牲者を出すなど、成果の裏に凄惨な人的代償を伴うものであった。' },
  { id:'great_purge', name:'大粛清', category:'event', lat:55.75, lng:37.62, start:1936, end:1938, region:'ソビエト連邦',
    desc:'スターリンが党・軍・一般市民の中から政敵や潜在的な反対者とみなした人々を大規模に処刑・強制収容所(グラーグ)送りにした弾圧。見せしめ裁判(モスクワ裁判)を通じてかつての革命の同志(ジノヴィエフ、ブハーリンら)まで次々に「人民の敵」として粛清の対象となり、犠牲者は数百万人に上るとされる。特に赤軍の有能な将校の多くもこの粛清で失われたため軍の指揮系統は著しく弱体化し、独ソ戦初期にソ連軍が大敗を重ねる一因ともなった。' },
  { id:'great_patriotic_war', name:'独ソ戦(大祖国戦争)', category:'war', lat:55.75, lng:37.62, start:1941, end:1945, region:'ソビエト連邦(東部戦線)',
    desc:'第二次世界大戦における独ソ間の戦い。緒戦でドイツの奇襲侵攻を受け大きな損害を被ったが、スターリングラードの戦いなどを経て反攻に転じ、最終的にベルリンを占領してドイツを降伏させた。ソ連の犠牲者は2000万人を超えるとされる。' },
  { id:'battle_stalingrad', name:'スターリングラードの戦い', category:'war', lat:48.71, lng:44.5, start:1942, end:1943, region:'ソ連南部(スターリングラード)',
    desc:'独ソ戦の帰趨を決した市街戦。ドイツ第6軍が壊滅・降伏し、独ソ戦における攻守の転換点となった、第二次世界大戦全体を通じても最大級の激戦とされる。' },
  { id:'khrushchev', name:'フルシチョフ', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1894, end:1971, region:'ソビエト連邦',
    desc:'スターリン死後の権力闘争を制し、ソ連共産党第20回大会でスターリンの個人崇拝と大粛清を公然と告発する「スターリン批判」を行った指導者。この批判は東欧諸国での自由化運動(ハンガリー動乱など)を誘発する一方、東西陣営間の緊張緩和(「雪どけ」)や平和共存路線を進める契機ともなった。キューバ危機では核戦争の瀬戸際まで至りながらアメリカと妥協して核戦争を回避したが、この譲歩や国内改革の停滞への不満から、最終的に党内クーデタで解任された。' },
  { id:'cuban_missile_crisis', name:'キューバ危機', category:'event', lat:23.11, lng:-82.36, start:1962, end:1962, region:'キューバ・アメリカ・ソ連',
    desc:'ソ連によるキューバへの核ミサイル配備をめぐり、アメリカとソ連が核戦争の瀬戸際まで対峙した冷戦最大の危機。最終的に両首脳の交渉により回避され、以後米ソ間にホットラインが設置されるなど緊張緩和の契機ともなった。' },
  { id:'brezhnev', name:'ブレジネフ', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1906, end:1982, region:'ソビエト連邦',
    desc:'フルシチョフ失脚後、約18年にわたり集団指導体制の中心としてソ連を率いた指導者。対外的には米国とのSALT(戦略兵器制限交渉)などデタント(緊張緩和)を進め、「ブレジネフ=ドクトリン」により東欧圏への統制(チェコ事件への軍事介入など)を維持したが、国内では硬直した官僚制と改革の停滞が続き、後に「停滞の時代」と呼ばれる経済成長の鈍化・技術的立ち遅れを招いた。この長期停滞の蓄積が、後継のゴルバチョフによる改革の必要性を生み出す土壌となった。' },
  { id:'gorbachev', name:'ゴルバチョフ', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1931, end:2022, region:'ソビエト連邦',
    desc:'ソ連の経済的停滞を打開すべく、ペレストロイカ(建て直し)による経済・政治体制改革とグラスノスチ(情報公開)による言論統制緩和を掲げた最後の指導者。「新思考外交」により米国との軍拡競争を終わらせ、東欧諸国への内政不干渉(ブレジネフ=ドクトリンの放棄)を通じて冷戦終結に大きく貢献したが、情報公開が引き出した体制批判と各共和国の民族主義的な独立要求は制御不能なまでに拡大し、1991年の保守派クーデタ未遂を経て求心力を完全に失い、同年末にソ連そのものの解体という結果を招いた。' },
  { id:'perestroika_glasnost', name:'ペレストロイカとグラスノスチ', category:'event', lat:55.75, lng:37.62, start:1985, end:1991, region:'ソビエト連邦',
    desc:'ゴルバチョフが推進した改革路線。経済の立て直し(ペレストロイカ)と言論統制の緩和(グラスノスチ)を目指したが、抑えられていた民族対立や自由化要求が噴出し、結果的にソ連解体を早める一因となった。' },
  { id:'russian_federation', name:'ロシア連邦', category:'nation', lat:55.75, lng:37.62, start:1991, end:2000, region:'ロシア',
    desc:'ソ連解体に伴い成立した独立国家。初代大統領エリツィンのもとで国営企業の急速な民営化と価格自由化(ショック療法)による市場経済への移行を進めたが、旧共産党幹部らへの富の集中(オリガルヒの台頭)や急激なインフレ・生活水準の低下を招き、混乱と経済格差の拡大が1990年代を通じて深刻な政治・経済の不安定をもたらした。この混乱の収拾を託される形で、世紀の変わり目にプーチンへと権力が移譲された。' },
  { id:'yeltsin', name:'エリツィン', category:'person', parentId:'russian_federation', lat:55.75, lng:37.62, start:1931, end:2007, region:'ロシア連邦',
    desc:'保守派クーデタに対する抵抗運動を主導して国民的英雄となり、ソ連解体を実質的に主導してロシア連邦の初代大統領となった政治家。国営企業の急速な民営化と価格自由化(ショック療法)による市場経済への移行を強行したが、急激なインフレと生活水準の悪化、少数の新興財閥(オリガルヒ)への富の集中を招いて経済は混乱、分離独立を求めるチェチェン紛争にも直面するなど内政は終始不安定であった。健康悪化と支持率低下の中、世紀末に後継者プーチンへ大統領職を譲って引退した。' },

  /* =====================================================================
     ⑧ イタリア史 追加データ(中世都市国家〜ルネサンス〜統一〜現代)
     ===================================================================== */
  { id:'venice_republic', name:'ヴェネツィア共和国', category:'nation', lat:45.44, lng:12.34, start:697, end:1797, region:'イタリア北東部(ヴェネツィア)',
    desc:'干潟の上に築かれた海洋都市国家。東地中海貿易とビザンツ・イスラーム世界との仲介貿易で栄え、独自の寡頭共和政(ドージェを元首とする)を長く維持したが、ナポレオンの侵攻により消滅した。' },
  { id:'genoa_republic', name:'ジェノヴァ共和国', category:'nation', lat:44.41, lng:8.93, start:1005, end:1797, region:'イタリア北西部(ジェノヴァ)',
    desc:'西地中海貿易で栄えた海洋都市国家。ヴェネツィアと激しい商業的・軍事的抗争(ヴェネツィア=ジェノヴァ戦争)を繰り広げ、コロンブスの出身地としても知られる。' },
  { id:'florence_republic', name:'フィレンツェ共和国', category:'nation', lat:43.77, lng:11.26, start:1115, end:1532, region:'イタリア中部(フィレンツェ)',
    desc:'毛織物業と金融業(為替・銀行)で栄えた都市共和国。メディチ家が事実上の支配者となって以降ルネサンス文化の一大中心地として繁栄したが、最終的にメディチ家によるフィレンツェ公国(のちトスカーナ大公国)へと移行し共和政は終焉した。' },
  { id:'papal_states', name:'教皇領', category:'nation', lat:41.9, lng:12.49, start:754, end:1870, region:'イタリア中部(ローマ中心)',
    desc:'フランク王ピピンの寄進によって成立したとされる、ローマ教皇が世俗的な支配者を兼ねる国家。イタリア半島中部に長く存続したが、1870年にイタリア王国に併合され、教皇の世俗的支配権は消滅した(「ローマ問題」の発端)。' },
  { id:'duchy_milan', name:'ミラノ公国', category:'nation', lat:45.46, lng:9.19, start:1395, end:1535, region:'イタリア北部(ミラノ)',
    desc:'ヴィスコンティ家、次いでスフォルツァ家が支配した北イタリアの有力国家。イタリア戦争の主戦場の一つとなり、最終的にハプスブルク家(スペイン系)の支配下に組み込まれた。' },
  { id:'kingdom_sicily', name:'シチリア王国(両シチリア王国)', category:'nation', lat:38.12, lng:13.36, start:1130, end:1816, region:'イタリア南部・シチリア島',
    desc:'ノルマン人ルッジェーロ2世が建てた王国。ノルマン・アラブ・ビザンツの文化が融合した独自の宮廷文化で知られ、後にホーエンシュタウフェン家・アンジュー家・アラゴン家などの支配者を経て、1816年に両シチリア王国として再編された。' },
  { id:'roger_ii_sicily', name:'ルッジェーロ2世', category:'person', parentId:'kingdom_sicily', lat:38.12, lng:13.36, start:1095, end:1154, region:'シチリア王国',
    desc:'ノルマン人としてシチリアに強力な王国を築いた王。ノルマン・アラブ・ビザンツ・ラテンの文化が交わる寛容で洗練された宮廷を築き、地中海有数の学芸の中心地とした。' },
  { id:'battle_legnano', name:'レニャーノの戦い', category:'war', lat:45.6, lng:8.92, start:1176, end:1176, region:'イタリア北部(レニャーノ)',
    desc:'北イタリア諸都市が結成したロンバルディア同盟が、神聖ローマ皇帝フリードリヒ1世(バルバロッサ)の軍を破った戦い。この勝利により北イタリア諸都市は事実上の自治を確保し、皇帝のイタリア政策に大きな打撃を与えた。' },
  { id:'dante_alighieri', name:'ダンテ', category:'person', lat:43.77, lng:11.26, start:1265, end:1321, region:'フィレンツェ',
    desc:'イタリア語(トスカーナ方言)による大叙事詩『神曲』を著した詩人。ラテン語ではなく口語(俗語)で高度な文学作品を著したことは、後のイタリア語・ヨーロッパ各国語による文学発展の先駆けとなった。' },
  { id:'petrarch', name:'ペトラルカ', category:'person', lat:43.77, lng:11.26, start:1304, end:1374, region:'イタリア(フィレンツェ出身)',
    desc:'古典古代の文献研究(人文主義)の先駆者とされる詩人・学者。「ルネサンスの父」とも呼ばれ、その古典復興の姿勢はイタリア・ルネサンス全体の知的基盤を用意した。' },
  { id:'boccaccio', name:'ボッカチォ', category:'person', lat:43.77, lng:11.26, start:1313, end:1375, region:'フィレンツェ',
    desc:'黒死病流行下のフィレンツェを舞台にした短編集『デカメロン』を著した作家。人間の世俗的な欲望や機知を生き生きと描き、後のヨーロッパ文学に大きな影響を与えた。' },
  { id:'cosimo_medici', name:'コジモ=デ=メディチ', category:'person', parentId:'medici', lat:43.77, lng:11.26, start:1389, end:1464, region:'フィレンツェ',
    desc:'銀行業で蓄えた富を背景にフィレンツェの事実上の支配者となった、メディチ家繁栄の基礎を築いた人物。学者・芸術家の庇護者としてプラトン=アカデミーの設立を支援するなど、ルネサンス文化の発展に大きく貢献した。' },
  { id:'lorenzo_medici', name:'ロレンツォ=デ=メディチ(豪華王)', category:'person', parentId:'medici', lat:43.77, lng:11.26, start:1449, end:1492, region:'フィレンツェ',
    desc:'「イル・マニーフィコ(豪華王)」と称されたメディチ家最盛期の当主。ボッティチェリやミケランジェロら多くの芸術家を庇護し、フィレンツェをルネサンス文化の絶頂に導いた。' },
  { id:'savonarola', name:'サヴォナローラ', category:'person', lat:43.77, lng:11.26, start:1452, end:1498, region:'フィレンツェ',
    desc:'贅沢や享楽を厳しく糾弾し、一時フィレンツェの事実上の指導者となった急進的な修道士。「虚栄の焼却」で美術品や書物を焼かせるなど神権政治的な統治を敷いたが、教皇と対立して破門され、最終的に火刑に処された。' },
  { id:'cesare_borgia', name:'チェーザレ=ボルジア', category:'person', lat:41.9, lng:12.49, start:1475, end:1507, region:'イタリア(教皇領)',
    desc:'教皇アレクサンデル6世の子で、武力と謀略を駆使して中部イタリアに一時的な支配圏を築いた武将。マキァヴェリが『君主論』で理想的な新君主の一例として取り上げたことでも知られる。' },
  { id:'machiavelli', name:'マキァヴェリ', category:'person', lat:43.77, lng:11.26, start:1469, end:1527, region:'フィレンツェ',
    desc:'『君主論』を著した政治思想家・外交官。統治における宗教・道徳よりも実効性を重視する現実主義的な政治観を説き、近代政治学の先駆者とされる。' },
  { id:'botticelli', name:'ボッティチェリ', category:'person', lat:43.77, lng:11.26, start:1445, end:1510, region:'フィレンツェ',
    desc:'『ヴィーナスの誕生』『春(プリマヴェーラ)』などで知られる画家。ギリシャ神話を主題にしながらも優美な線描を特徴とする作風は、盛期ルネサンス絵画への橋渡しとなった。' },
  { id:'michelangelo', name:'ミケランジェロ', category:'person', lat:43.77, lng:11.26, start:1475, end:1564, region:'フィレンツェ・ローマ',
    desc:'彫刻『ダヴィデ像』、システィーナ礼拝堂天井画・壁画『最後の審判』などで知られる万能の芸術家。彫刻家としての矜持を持ちながらも絵画・建築(サン=ピエトロ大聖堂の設計)にも卓越した業績を残した。' },
  { id:'raphael', name:'ラファエロ', category:'person', lat:41.9, lng:12.49, start:1483, end:1520, region:'ローマ(出身ウルビーノ)',
    desc:'調和と均整のとれた古典的な画風で盛期ルネサンス絵画の理想を体現した画家。ヴァチカン宮殿の壁画『アテネの学堂』などで知られ、37歳の若さで没した。' },
  { id:'pope_julius_ii', name:'教皇ユリウス2世', category:'person', parentId:'papal_states', lat:41.9, lng:12.49, start:1443, end:1513, region:'教皇領',
    desc:'「戦う教皇」と呼ばれた軍事的・政治的に積極的な教皇。サン=ピエトロ大聖堂の再建に着手し、ミケランジェロやラファエロら当代随一の芸術家を教皇庁に集めてルネサンス美術の一大パトロンとなった。' },
  { id:'napoleonic_kingdom_italy', name:'イタリア王国(ナポレオン期)', category:'nation', lat:45.46, lng:9.19, start:1805, end:1814, region:'イタリア北部(ミラノ)',
    desc:'ナポレオンが自ら王を兼ねて成立させた衛星王国。フランス式の行政・法制度がイタリアに導入され、意図せずして後のイタリア統一運動(リソルジメント)の素地の一つを用意することになった。' },
  { id:'kingdom_sardinia_piedmont', name:'サルデーニャ王国(ピエモンテ)', category:'nation', lat:45.07, lng:7.69, start:1720, end:1861, region:'イタリア北西部(トリノ)・サルデーニャ島',
    desc:'サヴォイア家が統治した、イタリア諸国の中で唯一独立を保った王国。19世紀にはイタリア統一運動の中心的な役割を担い、最終的にイタリア王国の母体となった。' },
  { id:'mazzini', name:'マッツィーニ', category:'person', lat:45.46, lng:9.19, start:1805, end:1872, region:'イタリア',
    desc:'「青年イタリア」を組織し、共和主義に基づくイタリア統一を訴えた革命家・思想家。彼自身の理想(共和政)は実現しなかったものの、その情熱的な統一運動はガリバルディら後進の活動家に大きな影響を与えた。' },
  { id:'young_italy_movement', name:'青年イタリア(ジョーヴィネ・イタリア)', category:'event', lat:44.41, lng:8.93, start:1831, end:1848, region:'イタリア',
    desc:'マッツィーニが結成した秘密結社・政治運動。共和政に基づくイタリア統一を掲げ武装蜂起を繰り返したがいずれも失敗に終わったものの、統一への機運を広める重要な思想的原動力となった。' },
  { id:'carlo_alberto', name:'カルロ=アルベルト', category:'person', parentId:'kingdom_sardinia_piedmont', lat:45.07, lng:7.69, start:1798, end:1849, region:'サルデーニャ王国',
    desc:'1848年革命の高まりの中、オーストリアに対して独立戦争を仕掛けたサルデーニャ王。戦いに敗れて退位に追い込まれたが、彼が発布した自由主義的な憲法(アルベルト憲章)は後のイタリア王国憲法の基礎となった。' },
  { id:'cavour', name:'カヴール', category:'person', parentId:'kingdom_sardinia_piedmont', lat:45.07, lng:7.69, start:1810, end:1861, region:'サルデーニャ王国',
    desc:'サルデーニャ王国首相として、フランスとの同盟によりオーストリアを排除する巧みな外交でイタリア統一を主導した政治家。統一直前に急死したが、その現実主義的な統一路線はイタリア王国建国の最大の功労者と評価される。' },
  { id:'garibaldi', name:'ガリバルディ', category:'person', lat:38.12, lng:13.36, start:1807, end:1882, region:'イタリア',
    desc:'義勇軍「赤シャツ隊」を率いて両シチリア王国を征服し、その征服地をサルデーニャ王に献上してイタリア統一に大きく貢献した軍人・革命家。私心のない行動から「両世界の英雄」として国民的英雄となった。' },
  { id:'expedition_of_thousand', name:'千人隊の遠征', category:'war', lat:38.12, lng:13.36, start:1860, end:1860, region:'イタリア南部・シチリア島',
    desc:'ガリバルディが約1000人の義勇兵(赤シャツ隊)を率いてシチリア・ナポリの両シチリア王国を征服した遠征。征服した領土をサルデーニャ王ヴィットーリオ=エマヌエーレ2世に献上し、イタリア統一を大きく前進させた。' },
  { id:'victor_emmanuel_ii', name:'ヴィットーリオ=エマヌエーレ2世', category:'person', parentId:'kingdom_of_italy', lat:45.07, lng:7.69, start:1820, end:1878, region:'サルデーニャ王国→イタリア王国',
    desc:'サルデーニャ王としてカヴールを登用し統一事業を進め、統一後は初代イタリア国王となった人物。「祖国の父」と呼ばれ、その柔軟な立憲君主としての姿勢がイタリア統一の実現を支えた。' },
  { id:'kingdom_of_italy', name:'イタリア王国', category:'nation', lat:41.9, lng:12.49, start:1861, end:1946, region:'イタリア',
    desc:'サルデーニャ王国を中心にイタリア半島の大半を統一して成立した王国。1870年に教皇領(ローマ)を併合して統一を完成させたが、ファシズムの台頭と第二次世界大戦の敗北を経て、1946年の国民投票により王政は廃止された。' },
  { id:'capture_of_rome_1870', name:'ローマ占領(ポルタ=ピア占領)', category:'event', lat:41.9, lng:12.49, start:1870, end:1870, region:'ローマ',
    desc:'イタリア王国軍が教皇領の首都ローマを占領した出来事。これによりイタリア統一は完成したが、教皇はイタリア王国の主権を認めず「ヴァチカンの囚人」を自称し、教皇領問題(ローマ問題)は1929年のラテラノ条約まで未解決のまま残った。' },
  { id:'mussolini', name:'ムッソリーニ', category:'person', parentId:'fascist_italy', lat:41.9, lng:12.49, start:1883, end:1945, region:'イタリア(ファシスト政権)',
    desc:'ファシスト党を率い「ローマ進軍」により政権を掌握した独裁者。「ドゥーチェ(統領)」として全体主義体制を築き、ヒトラーと枢軸を結んで第二次世界大戦に参戦したが、敗色濃厚となる中で失脚し、最終的にパルチザンに処刑された。' },
  { id:'march_on_rome', name:'ローマ進軍', category:'event', lat:41.9, lng:12.49, start:1922, end:1922, region:'イタリア',
    desc:'ムッソリーニ率いるファシスト党員がローマに向けて示威行進を行い、国王に恫喝的圧力をかけて首相の座を獲得した事件。以後ムッソリーニは急速に独裁体制を築き上げていった。' },
  { id:'fascist_italy', name:'ファシスト政権下のイタリア', category:'nation', lat:41.9, lng:12.49, start:1922, end:1943, region:'イタリア',
    desc:'ムッソリーニのファシスト党による一党独裁体制。国王を形式的な元首として残しつつ事実上の独裁を敷き、エチオピア侵攻やドイツとの枢軸形成など対外膨張を進めたが、連合軍のシチリア上陸を機にムッソリーニは失脚した。' },
  { id:'lateran_treaty', name:'ラテラノ条約', category:'treaty', lat:41.9, lng:12.49, start:1929, end:1929, region:'イタリア(ローマ)',
    desc:'ムッソリーニ政権とローマ教皇庁との間で結ばれた協定。ヴァチカン市国の独立を承認する代わりに教皇の世俗的権威をヴァチカン市国内に限定し、1870年以来続いた「ローマ問題」に決着をつけた。' },
  { id:'italian_social_republic', name:'イタリア社会共和国(サロ共和国)', category:'nation', lat:45.6, lng:10.6, start:1943, end:1945, region:'イタリア北部(サロ)',
    desc:'イタリア降伏後、ドイツの支援下でムッソリーニが北イタリアに樹立した傀儡国家。事実上ドイツの占領統治の道具にすぎず、連合軍とパルチザンの攻勢の前に短期間で崩壊した。' },
  { id:'italian_referendum_1946', name:'イタリア王政廃止国民投票', category:'event', lat:41.9, lng:12.49, start:1946, end:1946, region:'イタリア',
    desc:'ファシズムと戦争協力の責任を問われた王政の存廃を問うた国民投票。僅差で共和政支持が勝り、サヴォイア王家は退位・亡命に追い込まれてイタリア共和国が成立した。' },
  { id:'italian_republic', name:'イタリア共和国', category:'nation', lat:41.9, lng:12.49, start:1946, end:2000, region:'イタリア',
    desc:'国民投票による王政廃止を経て成立した共和国。戦後復興(「イタリアの奇跡」と呼ばれる高度経済成長)を遂げ、ヨーロッパ統合(EC/EU)の原加盟国の一つとして国際社会に復帰した。' },

  /* =====================================================================
     ⑨ 北欧・東欧 追加データ(ポーランド、ハンガリー・ボヘミア、バルカン、北欧諸国)
     ===================================================================== */
  { id:'poland_kingdom', name:'ポーランド王国(ピャスト朝〜ヤゲウォ朝)', category:'nation', lat:52.23, lng:21.01, start:966, end:1569, region:'ポーランド',
    desc:'ミェシュコ1世のキリスト教受容(966年)を起源とする王国。ヤゲウォ朝のもとリトアニアと同君連合を結んで東欧の大国となったが、1569年のルブリン合同によりポーランド=リトアニア共和国(一体国家)へと発展的に統合された。' },
  { id:'casimir_iii_poland', name:'カジミェシュ3世(大王)', category:'person', parentId:'poland_kingdom', lat:50.06, lng:19.94, start:1310, end:1370, region:'ポーランド王国',
    desc:'「農民の王」とも呼ばれた名君。国内法の整備やクラクフ大学の創設など内政の充実に努め、跡継ぎに恵まれなかったことが、後のリトアニアとの同君連合(ヤゲウォ朝成立)への道を開いた。' },
  { id:'jagiellon_dynasty', name:'ヤゲウォ朝', category:'dynasty', lat:52.23, lng:21.01, start:1386, end:1572, region:'ポーランド・リトアニア',
    desc:'リトアニア大公ヤギェウォがポーランド女王と結婚して開いた王朝。ポーランドとリトアニアの同君連合を通じて東欧最大級の勢力を築き、ドイツ騎士団を破るなど地域の大国として存在感を示した。' },
  { id:'polish_lithuanian_commonwealth', name:'ポーランド=リトアニア共和国(共和国)', category:'nation', lat:52.23, lng:21.01, start:1569, end:1795, region:'ポーランド・リトアニア・ウクライナ方面',
    desc:'ルブリン合同によりポーランド王国とリトアニア大公国が統合されて成立した貴族共和政国家。「黄金の自由」と呼ばれる強い貴族の権利(自由拒否権など)が特徴だったが、これが後の統治機能不全とロシア・プロイセン・オーストリアによる3次にわたるポーランド分割を招いた。' },
  { id:'jan_sobieski', name:'ヤン3世ソビエスキ', category:'person', parentId:'polish_lithuanian_commonwealth', lat:52.23, lng:21.01, start:1629, end:1696, region:'ポーランド=リトアニア共和国',
    desc:'ウィーン包囲でオスマン帝国軍を撃退し、キリスト教世界の危機を救ったポーランド王。この勝利によりオスマン帝国のヨーロッパへの拡大は決定的に食い止められたが、ポーランド自体の国力衰退は止められなかった。' },
  { id:'battle_vienna_1683', name:'第2次ウィーン包囲(ウィーンの戦い)', category:'war', lat:48.21, lng:16.37, start:1683, end:1683, region:'オーストリア(ウィーン)',
    desc:'オスマン帝国の大軍によるウィーン包囲を、ポーランド王ヤン3世ソビエスキ率いる救援軍が撃破した戦い。この敗北を境にオスマン帝国は守勢に転じ、ヨーロッパにおける「オスマンの脅威」は終わりを迎えた。' },
  { id:'tadeusz_kosciuszko', name:'コシューシコ', category:'person', parentId:'polish_lithuanian_commonwealth', lat:52.23, lng:21.01, start:1746, end:1817, region:'ポーランド=リトアニア共和国',
    desc:'アメリカ独立戦争にも義勇兵として参加した軍人。祖国に戻り、ロシアなどによる分割・支配に抵抗する蜂起(コシューシコの蜂起)を指導したが敗れ、この蜂起の失敗はポーランド分割(消滅)を決定づけた。' },
  { id:'kosciuszko_uprising', name:'コシューシコの蜂起', category:'revolution', lat:52.23, lng:21.01, start:1794, end:1794, region:'ポーランド',
    desc:'ロシア・プロイセンによる分割支配に抵抗して起きた民族蜂起。当初は一定の成功を収めたが最終的に鎮圧され、この敗北の結果1795年の第3次ポーランド分割によりポーランドという国家は地図上から消滅した。' },
  { id:'duchy_warsaw', name:'ワルシャワ大公国', category:'nation', lat:52.23, lng:21.01, start:1807, end:1815, region:'ポーランド',
    desc:'ナポレオンがプロイセン領ポーランドを基に樹立した衛星国家。ポーランド人にとって独立回復の希望となったが、ナポレオン没落とともに解体し、ウィーン会議でロシア領「ポーランド立憲王国」に再編された。' },
  { id:'congress_poland', name:'ポーランド立憲王国(会議王国)', category:'nation', lat:52.23, lng:21.01, start:1815, end:1915, region:'ポーランド(ロシア領)',
    desc:'ウィーン会議によりロシア皇帝を国王として成立した、自治権を持つポーランド。しかし度重なる蜂起(1830年・1863年など)への弾圧を経て自治権は次第に剥奪され、実質的にロシア帝国に組み込まれていった。' },
  { id:'second_polish_republic', name:'ポーランド第二共和国', category:'nation', lat:52.23, lng:21.01, start:1918, end:1939, region:'ポーランド',
    desc:'第一次世界大戦後、123年ぶりに独立を回復したポーランド。しかし1939年、独ソ不可侵条約の秘密議定書に基づきドイツとソ連に東西から分割侵攻され、再び独立を失った。' },
  { id:'polish_government_exile', name:'ポーランド亡命政府', category:'event', lat:51.51, lng:-0.13, start:1939, end:1945, region:'ロンドン(亡命政府)',
    desc:'ドイツ・ソ連による分割占領後、ロンドンに樹立されたポーランドの亡命政府。国内軍(アルミア・クラヨヴァ)を通じてレジスタンス運動を指導したが、戦後は英米に承認されず、ソ連の後ろ盾を得た共産政権に取って代わられた。' },
  { id:'solidarity_movement', name:'連帯(ソリダルノシチ)運動', category:'revolution', lat:54.35, lng:18.65, start:1980, end:1989, region:'ポーランド(グダニスク)',
    desc:'ワレサを指導者に、グダニスクの造船所労働者を中心として結成された東欧初の自主管理労働組合。共産党政権と粘り強く交渉・対峙を続け、1989年の円卓会議を経て東欧革命の先駆けとなる非共産政権樹立を実現した。' },
  { id:'lech_walesa', name:'レフ=ワレサ', category:'person', parentId:'solidarity_movement', lat:54.35, lng:18.65, start:1943, end:2000, region:'ポーランド',
    desc:'「連帯」を率いた電気工出身の労働運動指導者。共産政権を交渉によって平和的に退陣させる原動力となり、1990年には東欧革命後のポーランド初代大統領に選出された。' },
  { id:'hungary_kingdom', name:'ハンガリー王国', category:'nation', lat:47.5, lng:19.04, start:1000, end:1526, region:'中央ヨーロッパ(パンノニア平原)',
    desc:'マジャール人がパンノニア平原に定住して建てた王国。イシュトヴァーン1世のもとキリスト教国として成立し、東欧有数の強国として発展したが、モハーチの戦いでオスマン帝国に大敗し王国は事実上解体、領土は分割された。' },
  { id:'stephen_i_hungary', name:'イシュトヴァーン1世(聖イシュトヴァーン)', category:'person', parentId:'hungary_kingdom', lat:47.5, lng:19.04, start:969, end:1038, region:'ハンガリー王国',
    desc:'マジャール人を統合してハンガリー王国を建国し、キリスト教(カトリック)を国教と定めた初代国王。ハンガリーの「建国の父」として今日でも国民的な崇敬を集めている。' },
  { id:'bohemia_kingdom', name:'ベーメン王国(ボヘミア王国)', category:'nation', lat:50.08, lng:14.44, start:1198, end:1806, region:'中央ヨーロッパ(現チェコ)',
    desc:'神聖ローマ帝国内で選帝侯の地位を持つ有力な王国。カール4世の時代にプラハは帝国随一の文化都市として繁栄したが、フス戦争などの混乱を経て、最終的にハプスブルク家の支配下に組み込まれた。' },
  { id:'jan_hus', name:'ヤン=フス', category:'person', lat:50.08, lng:14.44, start:1369, end:1415, region:'ボヘミア王国',
    desc:'教会の腐敗(贖宥状販売など)を批判し、聖書に基づく信仰を説いた宗教改革の先駆者。コンスタンツ公会議で異端とされ火刑に処されたが、その死は支持者たちによる大規模な反乱(フス戦争)を引き起こした。' },
  { id:'hussite_wars', name:'フス戦争', category:'war', lat:50.08, lng:14.44, start:1419, end:1434, region:'ボヘミア王国',
    desc:'ヤン=フスの処刑に反発したフス派(主に農民・都市民)が、皇帝・教会側の十字軍と戦った戦争。フス派は独自の戦術(荷車を用いた陣形)で何度も十字軍を撃退し、最終的に一定の宗教的譲歩を勝ち取った。' },
  { id:'battle_mohacs', name:'モハーチの戦い', category:'war', lat:45.99, lng:18.68, start:1526, end:1526, region:'ハンガリー(モハーチ)',
    desc:'オスマン帝国スルタン、スレイマン1世がハンガリー軍を壊滅させた戦い。ハンガリー国王が戦死して王国は事実上崩壊し、領土はオスマン支配地域・ハプスブルク支配地域・トランシルヴァニア公国に3分割された。' },
  { id:'hungarian_revolution_1848', name:'ハンガリー1848年革命', category:'revolution', lat:47.5, lng:19.04, start:1848, end:1849, region:'ハンガリー',
    desc:'コシュートらに指導された、オーストリア支配からの独立とハンガリー国民国家樹立を目指した革命。一時独立を宣言するまでに至ったが、オーストリアの要請を受けたロシア軍の介入により鎮圧された。' },
  { id:'kossuth', name:'コシュート', category:'person', lat:47.5, lng:19.04, start:1802, end:1894, region:'ハンガリー',
    desc:'1848年革命でハンガリーの独立運動を主導した政治家。革命は鎮圧され亡命を余儀なくされたが、その理念は後のアウスグライヒ(1867年、オーストリア=ハンガリー帝国成立)によるハンガリーの自治獲得に結実した。' },
  { id:'hungarian_revolution_1956', name:'ハンガリー動乱(1956年革命)', category:'revolution', lat:47.5, lng:19.04, start:1956, end:1956, region:'ハンガリー(ブダペスト)',
    desc:'スターリン批判の影響下、自由化と中立化・ワルシャワ条約機構脱退を求めて起きた民衆蜂起。ソ連が軍事介入して徹底的に鎮圧し、多数の死者と亡命者を出したが、東側陣営の抑圧的な実態を世界に強く印象づけた。' },
  { id:'czechoslovakia_first_republic', name:'チェコスロヴァキア第一共和国', category:'nation', lat:50.08, lng:14.44, start:1918, end:1938, region:'チェコスロヴァキア',
    desc:'オーストリア=ハンガリー帝国解体後に成立した、東欧では数少ない安定した民主主義国家。しかしミュンヘン協定によりズデーテン地方をドイツに割譲させられ、事実上の独立を失った。' },
  { id:'munich_agreement', name:'ミュンヘン協定', category:'treaty', lat:48.14, lng:11.58, start:1938, end:1938, region:'ドイツ(ミュンヘン)',
    desc:'英仏がチェコスロヴァキアの頭越しに、ドイツによるズデーテン地方併合を容認した宥和政策の象徴的協定。「我々の時代の平和」との期待に反し、翌年のドイツによるチェコ全土占領・ポーランド侵攻を防げず、宥和政策の失敗の代名詞となった。' },
  { id:'prague_spring', name:'プラハの春', category:'revolution', lat:50.08, lng:14.44, start:1968, end:1968, region:'チェコスロヴァキア(プラハ)',
    desc:'ドプチェク第一書記のもとで進められた「人間の顔をした社会主義」を掲げる自由化改革運動。ソ連・ワルシャワ条約機構軍の軍事介入(チェコ事件)により圧殺されたが、後の東欧民主化運動に大きな精神的影響を残した。' },
  { id:'velvet_revolution', name:'ビロード革命', category:'revolution', lat:50.08, lng:14.44, start:1989, end:1989, region:'チェコスロヴァキア',
    desc:'大規模なデモと市民の圧力により、流血をほとんど伴わずに共産党政権を退陣に追い込んだ革命。劇作家ハヴェルが大統領に選出され、東欧革命の中でも特に平和的な政権交代の象徴とされる。' },
  { id:'czechoslovakia_dissolution', name:'チェコスロヴァキア解体(ビロード離婚)', category:'event', lat:48.15, lng:17.11, start:1993, end:1993, region:'チェコスロヴァキア',
    desc:'民族対立というより政治的合意に基づき、チェコとスロヴァキアが平和的に分離・独立した出来事。武力衝突を伴わなかったことから「ビロード離婚」とも呼ばれる。' },
  { id:'serbian_empire', name:'セルビア王国・帝国', category:'nation', lat:44.79, lng:20.45, start:1217, end:1371, region:'バルカン半島中部',
    desc:'ネマニッチ朝のもとで発展した中世セルビアの王国・帝国。ステファン=ドゥシャンの時代にバルカン半島の大半を支配する最盛期を迎えたが、彼の死後急速に分裂・弱体化し、後にオスマン帝国に征服された。' },
  { id:'stefan_dusan', name:'ステファン=ドゥシャン', category:'person', parentId:'serbian_empire', lat:44.79, lng:20.45, start:1308, end:1355, region:'セルビア帝国',
    desc:'「皇帝」を自称しバルカン半島の大半を支配する大帝国を築いたセルビア中世最盛期の統治者。独自の法典を編纂するなど国家体制を整えたが、その死後帝国は急速に瓦解した。' },
  { id:'battle_kosovo_1389', name:'コソヴォの戦い', category:'war', lat:42.66, lng:21.15, start:1389, end:1389, region:'バルカン半島(コソヴォ)',
    desc:'オスマン帝国軍がセルビア連合軍を破った戦い。両軍指導者がともに戦死する激戦となり、この敗北を機にセルビアをはじめバルカン諸国は次第にオスマン帝国の支配下に組み込まれていった。セルビア民族の記憶において特別な意味を持つ戦いとされる。' },
  { id:'bulgarian_empire_second', name:'ブルガリア帝国(第二次)', category:'nation', lat:43.43, lng:25.64, start:1185, end:1396, region:'バルカン半島東部',
    desc:'第一次ブルガリア帝国のビザンツによる征服後、独立を回復して成立した帝国。一時バルカン半島の強国として復興したが、内紛や周辺国との抗争で弱体化し、最終的にオスマン帝国に征服された。' },
  { id:'balkan_wars', name:'バルカン戦争', category:'war', lat:42.7, lng:23.32, start:1912, end:1913, region:'バルカン半島',
    desc:'バルカン同盟諸国(セルビア・ブルガリア・ギリシャ・モンテネグロ)がオスマン帝国からバルカン半島の領土を奪った第1次、続いて戦利品の分配をめぐり同盟国同士が争った第2次からなる戦争。オスマン帝国のヨーロッパ領はほぼ消滅し、複雑化した領土問題は第一次世界大戦の伏線ともなった。' },
  { id:'kalmar_union', name:'カルマル同盟', category:'nation', lat:55.68, lng:12.57, start:1397, end:1523, region:'デンマーク・ノルウェー・スウェーデン',
    desc:'デンマーク女王マルグレーテ1世が主導し、デンマーク・ノルウェー・スウェーデンの3王国を同一君主のもとに統合した同君連合。スウェーデンの反発から動揺を繰り返し、最終的にスウェーデンの離脱・独立(1523年)により事実上解体した。' },
  { id:'margaret_i_denmark', name:'マルグレーテ1世', category:'person', parentId:'kalmar_union', lat:55.68, lng:12.57, start:1353, end:1412, region:'デンマーク',
    desc:'幼い養子を王に立てつつ自ら実権を握り、カルマル同盟によって北欧3王国の同君連合を実現した「北欧のセミラミス」と称される女性君主。強力な指導力で北欧の政治的統合を一時的に成し遂げた。' },
  { id:'denmark_kingdom', name:'デンマーク王国', category:'nation', lat:55.68, lng:12.57, start:950, end:2000, region:'北欧(ユトランド半島)',
    desc:'ヴァイキング時代以来の伝統を持つ北欧最古級の王国。クヌート大王の時代には北海帝国の中心となり、近世にはバルト海の覇権をめぐりスウェーデンとしばしば争いながらも、今日まで存続する立憲君主国となっている。' },
  { id:'norway_kingdom', name:'ノルウェー王国', category:'nation', lat:59.91, lng:10.75, start:872, end:2000, region:'北欧(スカンディナヴィア半島西部)',
    desc:'ヴァイキング時代に統一されたとされる王国。中世以降デンマーク・スウェーデンとの同君連合下に置かれる時期が長く続いたが、1905年にスウェーデンから平和的に分離独立し、現在の立憲君主国としての歩みを始めた。' },
  { id:'great_northern_war', name:'大北方戦争', category:'war', lat:59.33, lng:18.06, start:1700, end:1721, region:'バルト海沿岸',
    desc:'ロシアのピョートル1世を中心とする連合とスウェーデンとの間で戦われた戦争。スウェーデンは大敗してバルト海の覇権を失い(バルト帝国の終焉)、代わってロシアがバルト海に進出し大国としての地位を確立した。' },
  { id:'charles_xii_sweden', name:'カール12世', category:'person', parentId:'sweden_great_power', lat:59.33, lng:18.06, start:1682, end:1718, region:'スウェーデン',
    desc:'若くして即位し、大北方戦争でロシア・デンマーク・ポーランドなどの連合軍を相手に善戦した「北方の英雄」。しかしポルタヴァの戦いでロシアに大敗して以降劣勢に転じ、その戦死とともにスウェーデンの大国としての地位も終わりを迎えた。' },
  { id:'sweden_kingdom_modern', name:'スウェーデン王国(近現代)', category:'nation', lat:59.33, lng:18.06, start:1721, end:2000, region:'北欧(スカンディナヴィア半島東部)',
    desc:'大北方戦争敗北後、大国としての地位を失った後のスウェーデン。以後は対外的な中立政策を志向し、20世紀には高度な社会保障制度(福祉国家)を発展させた平和的な立憲君主国として知られるようになった。' },
  { id:'norway_independence_1905', name:'ノルウェー独立(スウェーデンとの同君連合解消)', category:'event', lat:59.91, lng:10.75, start:1905, end:1905, region:'ノルウェー',
    desc:'国民投票を経て、スウェーデンとの同君連合を平和的に解消し完全独立を達成した出来事。武力衝突を伴わない円満な分離として、北欧における平和的な国家関係の象徴ともされる。' },

  /* =====================================================================
     ⑩ 20世紀深掘り 追加データ(二つの大戦・冷戦・欧州統合・ユーゴ紛争)
     ===================================================================== */
  { id:'sarajevo_assassination', name:'サライェヴォ事件', category:'event', lat:43.86, lng:18.41, start:1914, end:1914, region:'ボスニア(サライェヴォ)',
    desc:'セルビア人青年プリンツィプがオーストリア皇太子フランツ=フェルディナント夫妻を暗殺した事件。オーストリアがセルビアに宣戦布告し、同盟関係の連鎖により瞬く間にヨーロッパ主要国を巻き込む第一次世界大戦へと発展した。' },
  { id:'battle_verdun', name:'ヴェルダンの戦い', category:'war', lat:49.16, lng:5.38, start:1916, end:1916, region:'フランス(ヴェルダン)',
    desc:'第一次世界大戦最長・最大級の消耗戦。「ヴェルダンを流血させる」というドイツ軍の作戦目的通り両軍に膨大な死傷者を出したが、フランス軍が要塞群を守り抜き、西部戦線の膠着状態を象徴する戦いとなった。' },
  { id:'battle_somme', name:'ソンムの戦い', category:'war', lat:49.98, lng:2.72, start:1916, end:1916, region:'フランス(ソンム)',
    desc:'第一次世界大戦で最も多くの死傷者を出した戦いの一つ。開戦初日だけでイギリス軍が約6万人の死傷者を出すなど、戦車や機関銃が支配する塹壕戦の凄惨さを象徴する戦闘となった。' },
  { id:'league_of_nations', name:'国際連盟', category:'nation', lat:46.2, lng:6.14, start:1920, end:1946, region:'スイス(ジュネーヴ)',
    desc:'第一次世界大戦の惨禍を教訓に、ウィルソン米大統領の提唱で設立された史上初の恒久的な国際平和機構。しかし提唱国アメリカ自身が不参加となり、有効な制裁手段も欠いたため、1930年代の侵略行為を阻止できず、第二次世界大戦を防げなかった。' },
  { id:'treaty_locarno', name:'ロカルノ条約', category:'treaty', lat:46.17, lng:8.79, start:1925, end:1925, region:'スイス(ロカルノ)',
    desc:'ドイツと英仏など周辺諸国が、西欧における国境の現状維持と相互不可侵を約した一連の条約。「ロカルノの精神」と呼ばれる国際協調ムードを生み出し、ドイツの国際連盟加盟(1926年)にもつながったが、後にヒトラーにより一方的に破棄された。' },
  { id:'great_depression', name:'世界恐慌', category:'event', lat:40.71, lng:-74.01, start:1929, end:1939, region:'アメリカ発、ヨーロッパ全域に波及',
    desc:'ニューヨーク株式市場の大暴落に端を発した世界的な経済危機。ヨーロッパ各国でも大量失業と社会不安が広がり、ドイツにおけるナチ党の台頭をはじめ、各国での急進的な政治勢力の伸長を招く大きな要因となった。' },
  { id:'popular_front_france', name:'人民戦線内閣(フランス)', category:'event', lat:48.86, lng:2.35, start:1936, end:1938, region:'フランス',
    desc:'世界恐慌下の社会不安とファシズムの脅威に対抗するため、社会党・共産党などが結集して成立した左派連立政権(ブルム内閣)。週40時間労働制や有給休暇の導入など労働者保護政策を進めたが、内部対立や国際情勢の悪化の中で短期間で瓆壊した。' },
  { id:'battle_britain', name:'バトル=オブ=ブリテン(イギリス本土航空戦)', category:'war', lat:51.51, lng:-0.13, start:1940, end:1940, region:'イギリス上空',
    desc:'ドイツ空軍による本格的なイギリス上陸作戦の前提となる制空権獲得を目指した航空戦。イギリス空軍が寡兵ながらレーダー網などを活用して防衛に成功し、ドイツによる本土上陸作戦(アシカ作戦)を断念させた。' },
  { id:'d_day_normandy', name:'ノルマンディー上陸作戦(D-デイ)', category:'war', lat:49.34, lng:-0.68, start:1944, end:1944, region:'フランス(ノルマンディー)',
    desc:'連合軍がフランス北岸ノルマンディーに大規模な上陸作戦を敢行した、史上最大級の水陸両用作戦。この成功により西部戦線が本格的に開かれ、ドイツは東西から挟撃される形で敗北への道を辿ることになった。' },
  { id:'holocaust', name:'ホロコースト(ユダヤ人大量虐殺)', category:'event', lat:50.03, lng:19.18, start:1941, end:1945, region:'ドイツ占領下のヨーロッパ全域',
    desc:'ナチス・ドイツが組織的に実行した、ユダヤ人を中心とする大量虐殺政策。強制収容所・絶滅収容所(アウシュヴィッツなど)で約600万人のユダヤ人をはじめ、ロマ・障害者・政治犯など多数の人々が殺害された、人類史上最も凄惨な犯罪の一つとされる。' },
  { id:'yalta_conference', name:'ヤルタ会談', category:'treaty', lat:44.5, lng:34.16, start:1945, end:1945, region:'ソ連(クリミア半島ヤルタ)',
    desc:'米英ソの首脳(ローズヴェルト・チャーチル・スターリン)が、戦後のヨーロッパ処理や国際連合設立などを協議した会談。ドイツ・ヨーロッパの戦後分割の大枠が事実上ここで合意され、後の東西冷戦の原型ともなった。' },
  { id:'potsdam_conference', name:'ポツダム会談', category:'treaty', lat:52.4, lng:13.06, start:1945, end:1945, region:'ドイツ(ポツダム)',
    desc:'ドイツ降伏後、米英ソの首脳がドイツの戦後処理方針(非軍事化・民主化・分割占領統治など)や対日処理方針(ポツダム宣言)を協議した会談。会談の途中でチャーチルが選挙で退陣するなど、戦後の国際政治の転換点にもなった。' },
  { id:'nuremberg_trials', name:'ニュルンベルク裁判', category:'event', lat:49.45, lng:11.08, start:1945, end:1946, region:'ドイツ(ニュルンベルク)',
    desc:'連合国がナチス・ドイツの指導者らを「平和に対する罪」「人道に対する罪」などで裁いた国際軍事裁判。国家指導者個人の国際法上の刑事責任を初めて本格的に問うた画期的な裁判として、後の国際刑事法の発展に大きな影響を与えた。' },
  { id:'marshall_plan', name:'マーシャル=プラン(ヨーロッパ復興計画)', category:'treaty', lat:48.86, lng:2.35, start:1948, end:1952, region:'西ヨーロッパ諸国',
    desc:'アメリカが西欧諸国の戦後復興を支援するために実施した大規模な経済援助計画。ソ連・東欧はこれを拒否・排除されたことで東西陣営の経済的分断が決定的になり、また西欧諸国間の経済協力(後の欧州統合)の出発点ともなった。' },
  { id:'nato_founding', name:'北大西洋条約機構(NATO)の設立', category:'treaty', lat:50.85, lng:4.35, start:1949, end:1949, region:'アメリカ・カナダ・西欧諸国',
    desc:'ソ連の脅威に対抗するため、アメリカを中心に西側諸国が結成した集団防衛機構。加盟国への攻撃を全加盟国への攻撃とみなす集団的自衛権の原則(第5条)を掲げ、冷戦を通じて西側陣営の軍事的支柱であり続けた。' },
  { id:'warsaw_pact', name:'ワルシャワ条約機構', category:'treaty', lat:52.23, lng:21.01, start:1955, end:1991, region:'ソ連・東欧諸国',
    desc:'西ドイツのNATO加盟に対抗して、ソ連を中心とする東欧社会主義国が結成した軍事同盟。加盟国の自由化の動き(ハンガリー動乱・プラハの春)を軍事介入によって抑え込む役割も果たしたが、東欧革命後の1991年に解体した。' },
  { id:'council_of_europe', name:'欧州評議会', category:'treaty', lat:48.58, lng:7.75, start:1949, end:2000, region:'ヨーロッパ諸国(ストラスブール)',
    desc:'民主主義・人権・法の支配の擁護を目的に設立された国際機関(EUとは別組織)。欧州人権条約を採択し、欧州人権裁判所を通じて加盟国内の人権保障水準の向上に大きな役割を果たしている。' },
  { id:'berlin_wall_built', name:'ベルリンの壁建設', category:'event', lat:52.52, lng:13.4, start:1961, end:1961, region:'ドイツ(ベルリン)',
    desc:'東ドイツが西ベルリンとの境界に構築した壁。東側から西側への大量の人口流出を食い止める目的で建設され、以後28年間にわたり東西冷戦の分断を象徴する構造物として存在し続けた。' },
  { id:'helsinki_accords', name:'ヘルシンキ宣言(全欧安全保障協力会議)', category:'treaty', lat:60.17, lng:24.94, start:1975, end:1975, region:'フィンランド(ヘルシンキ)',
    desc:'東西両陣営が国境の不可侵と人権尊重を相互に確認した緊張緩和(デタント)期の合意文書。人権条項は東側諸国内の反体制運動を勇気づける結果となり、後の東欧革命に至る長期的な布石の一つとなったとされる。' },
  { id:'chernobyl_disaster', name:'チェルノブイリ原発事故', category:'event', lat:51.28, lng:30.22, start:1986, end:1986, region:'ソ連(ウクライナ、チェルノブイリ)',
    desc:'原子炉の爆発により史上最悪級の放射能汚染を引き起こした原子力発電所事故。ソ連政府の情報隠蔽体質が国内外で強く批判され、ゴルバチョフ自身も後にグラスノスチ(情報公開)を加速させる契機になったと語っている。' },
  { id:'european_coal_steel_community', name:'欧州石炭鉄鋼共同体(ECSC)', category:'treaty', lat:48.86, lng:2.35, start:1951, end:2002, region:'フランス・西ドイツ・イタリア・ベネルクス3国',
    desc:'フランス外相シューマンの提案(シューマン=プラン)に基づき、独仏の石炭・鉄鋼生産を共同管理下に置くことで戦争を物理的に不可能にすることを狙った共同体。後の欧州経済共同体(EEC)・EUへとつながる、ヨーロッパ統合の最初の一歩となった。' },
  { id:'treaty_of_rome', name:'ローマ条約(EEC発足)', category:'treaty', lat:41.9, lng:12.49, start:1957, end:1957, region:'イタリア(ローマ)',
    desc:'ECSC加盟6か国が調印し、関税同盟と共同市場の形成を目指す欧州経済共同体(EEC)を発足させた条約。経済統合を通じて平和と繁栄を築くという、後の欧州連合(EU)にまで受け継がれる統合の基本理念を確立した。' },
  { id:'schengen_agreement', name:'シェンゲン協定', category:'treaty', lat:49.51, lng:6.36, start:1985, end:1985, region:'ルクセンブルク(シェンゲン)',
    desc:'加盟国間の国境検査を撤廃し、人の自由な移動を実現することを目指した協定。当初は一部の国のみで始まったが、後に多くのEU加盟国が参加する「シェンゲン圏」へと発展し、ヨーロッパ統合を市民生活の面で実感させる制度となった。' },
  { id:'euro_currency_launch', name:'ユーロ導入', category:'event', lat:50.11, lng:8.68, start:1999, end:1999, region:'欧州連合加盟国(フランクフルトに欧州中央銀行)',
    desc:'欧州連合の単一通貨ユーロが、まず銀行間取引・資本市場向けの決済通貨として導入された出来事(紙幣・硬貨の流通開始は2002年)。マーストリヒト条約に定められた経済通貨同盟(EMU)の中核的な達成であり、欧州統合の象徴的な到達点となった。' },
  { id:'sfr_yugoslavia', name:'ユーゴスラヴィア社会主義連邦共和国', category:'nation', lat:44.79, lng:20.45, start:1945, end:1992, region:'バルカン半島西部',
    desc:'チトーの指導のもと、複数の民族・共和国からなる連邦制社会主義国家として成立した国。ソ連とは一線を画す独自の「非同盟」路線をとり多民族の共存を保ったが、チトーの死後民族対立が再燃し、冷戦終結後の1990年代初頭に内戦を伴いながら解体した。' },
  { id:'tito', name:'チトー', category:'person', parentId:'sfr_yugoslavia', lat:44.79, lng:20.45, start:1892, end:1980, region:'ユーゴスラヴィア',
    desc:'パルチザン闘争を指導して自力でドイツからの解放を達成し、戦後ユーゴスラヴィアの指導者となった人物。ソ連と距離を置く独自路線(非同盟主義)を掲げ、複数の民族・共和国を強い指導力でまとめ上げたが、その死後まもなく国は民族対立により分裂へと向かった。' },
  { id:'yugoslav_wars', name:'ユーゴスラヴィア紛争', category:'war', lat:44.79, lng:20.45, start:1991, end:2000, region:'旧ユーゴスラヴィア諸地域',
    desc:'連邦解体に伴い、スロヴェニア・クロアチア・ボスニアなど各共和国の独立と、それに反対するセルビア(旧連邦軍)との間で発生した一連の内戦・民族紛争の総称。ヨーロッパで第二次世界大戦後最悪規模の犠牲者と「民族浄化」という言葉を生んだ凄惨な紛争となった。' },
  { id:'bosnian_war', name:'ボスニア紛争', category:'war', lat:43.86, lng:18.41, start:1992, end:1995, region:'ボスニア=ヘルツェゴビナ',
    desc:'ボスニアの独立宣言を機に、セルビア人・クロアチア人・ボシュニャク人(ムスリム人)の間で発生した民族紛争。「民族浄化」と呼ばれる組織的な虐殺・追放行為が横行し、ヨーロッパに大きな衝撃を与えた。' },
  { id:'srebrenica_massacre', name:'スレブレニツァの虐殺', category:'event', lat:44.1, lng:19.3, start:1995, end:1995, region:'ボスニア=ヘルツェゴビナ(スレブレニツァ)',
    desc:'国連の「安全地帯」に指定されていたスレブレニツァで、セルビア人勢力が数千人規模のボシュニャク人男性・少年を殺害した事件。第二次世界大戦後のヨーロッパにおける最悪のジェノサイド(集団虐殺)と認定されている。' },
  { id:'dayton_agreement', name:'デイトン合意', category:'treaty', lat:48.86, lng:2.35, start:1995, end:1995, region:'アメリカ(デイトン)で協議、パリで調印',
    desc:'ボスニア紛争を終結させた包括的和平合意。ボスニア=ヘルツェゴビナを2つの構成体(セルビア人主体のスルプスカ共和国とボシュニャク・クロアチア人主体の連邦)からなる複雑な国家として存続させる枠組みを定めた。' },
  { id:'kosovo_war', name:'コソヴォ紛争', category:'war', lat:42.66, lng:21.16, start:1998, end:1999, region:'コソヴォ(旧ユーゴスラヴィア、セルビア)',
    desc:'アルバニア系住民の独立・自治要求とセルビアの弾圧が衝突した紛争。人道的介入を掲げたNATOがセルビアを空爆するという、国連安保理決議を経ない介入として国際法上の議論を呼ぶ形で事態収拾が図られた。' },

  /* =====================================================================
     ⑪ ゲルマン人国家 + 世界史年表.txt 照合による補完データ
     ===================================================================== */
  { id:'visigothic_kingdom', name:'西ゴート王国', category:'nation', lat:39.86, lng:-4.02, start:418, end:720, region:'南フランス(トロサ)→イベリア半島(トレド)',
    desc:'ローマ帝国内に定住した西ゴート人が建てた国家。当初はアリウス派キリスト教を奉じていたが、レカレド1世の代にアタナシウス派(カトリック)へ改宗してヒスパノ=ローマ系住民との統合を進めた。当初は南フランスのトロサ(トゥールーズ)を都としたが、フランク王国クローヴィスとの戦い(ヴイエの戦い)に敗れて勢力圏を南方へ後退させ、以後イベリア半島に移りトレドを都とした。王位継承をめぐる内紛で弱体化していたところを、711年からのウマイヤ朝イスラーム軍の侵攻を受けて短期間で瓦解し、720年頃までに事実上滅亡した。' },
  { id:'alaric', name:'アラリック', category:'person', parentId:'visigothic_kingdom', lat:41.9, lng:12.49, start:370, end:410, region:'西ゴート王国',
    desc:'西ゴート人の王。410年にローマ市を占領・略奪し(ローマ劫略)、800年近く外敵の手を逃れてきた「永遠の都」の陥落として当時の人々に大きな衝撃を与えた。まもなく南イタリアで病死した。' },
  { id:'ostrogothic_kingdom', name:'東ゴート王国', category:'nation', lat:45.44, lng:10.99, start:493, end:553, region:'イタリア半島',
    desc:'テオドリックがオドアケルを倒してイタリアに建てた国家。ローマの制度・文化を尊重した統治で一時安定をもたらしたが、東ローマ皇帝ユスティニアヌスによる「ゴート戦争」を経て滅ぼされた。' },
  { id:'theodoric_great', name:'テオドリック(大王)', category:'person', parentId:'ostrogothic_kingdom', lat:45.44, lng:10.99, start:454, end:526, region:'東ゴート王国',
    desc:'オドアケルを倒して東ゴート王国を建てた王。ローマの行政制度や元老院を存続させ、ゲルマンとローマの共存を図る統治を行い、「賢王」として知られた。' },
  { id:'gothic_war_justinian', name:'ゴート戦争', category:'war', lat:41.9, lng:12.49, start:535, end:554, region:'イタリア半島',
    desc:'ビザンツ(東ローマ)皇帝ユスティニアヌスが、旧西ローマ領の再征服(レコンクィスタ)を目指して東ゴート王国に対して行った戦争。ビザンツが勝利し東ゴート王国は滅亡したが、20年に及ぶ戦火でイタリアは荒廃し、その隙をついて後にランゴバルド人が侵入することになった。' },
  { id:'vandal_kingdom', name:'ヴァンダル王国', category:'nation', lat:36.85, lng:10.32, start:429, end:534, region:'北アフリカ(カルタゴ)',
    desc:'ヴァンダル人が北アフリカに建てた国家。地中海の制海権を握り一時はローマ自体も略奪したが、ユスティニアヌスの命を受けた将軍ベリサリウスの遠征により滅ぼされた。' },
  { id:'gaiseric', name:'ガイセリック', category:'person', parentId:'vandal_kingdom', lat:36.85, lng:10.32, start:389, end:477, region:'ヴァンダル王国',
    desc:'北アフリカに強力な王国を築き、455年にはローマ市を略奪した王。地中海の制海権を握り、当時のローマ世界にとって最大の脅威の一つとなった。' },
  { id:'burgundian_kingdom', name:'ブルグンド王国', category:'nation', lat:45.76, lng:4.83, start:411, end:534, region:'ガリア東部(現フランス東部)',
    desc:'ブルグンド人がガリア東部(現在のフランス東部・スイス西部)に建てた国家。独自の法典(ブルグンド法典)を持ったが、534年にフランク王国に征服されその領土に組み込まれた。' },
  { id:'lombard_kingdom', name:'ランゴバルド王国', category:'nation', lat:45.46, lng:9.19, start:568, end:774, region:'イタリア北部(パヴィア)',
    desc:'ゲルマン系のランゴバルド人が北イタリアに建てた国家。ビザンツの弱体化した隙を突いて建国され、教皇領を脅かしたことがフランク王国(ピピン・カール大帝)の介入を招き、最終的にカール大帝により征服・併合された。' },
  { id:'peace_of_callias', name:'カリアスの和約', category:'treaty', lat:37.98, lng:23.73, start:-449, end:-449, region:'アテネ・アケメネス朝ペルシア間',
    desc:'アテネとペルシアの間で結ばれたとされる講和。これによりおよそ半世紀に及んだペルシア戦争は正式に終結した(実際に結ばれたか否かについては史料上の議論もある)。' },
  { id:'corinthian_war', name:'コリント戦争', category:'war', lat:37.94, lng:22.93, start:-395, end:-387, region:'ギリシャ(コリントほか)',
    desc:'スパルタの強大化を警戒するアテネ・テーベ・コリントなどが、ペルシアの支援も受けて戦った戦争。決着がつかないまま「大王の和約」によって終結し、結果的にペルシアの介入を招くギリシャ諸ポリスの弱体化を印象づけた。' },
  { id:'kings_peace_387', name:'大王の和約', category:'treaty', lat:37.98, lng:23.73, start:-387, end:-387, region:'ギリシャ・アケメネス朝ペルシア間',
    desc:'ペルシア王の仲裁という形でコリント戦争を終結させた和約。小アジアのギリシャ人諸都市をペルシア領と認める内容で、ギリシャ本土のポリス間の対立にペルシアが介入する先例となった。' },
  { id:'battle_poitiers_1356', name:'ポワティエの戦い', category:'war', lat:46.58, lng:0.34, start:1356, end:1356, region:'フランス(ポワティエ)',
    desc:'百年戦争中の会戦。エドワード黒太子率いるイングランド軍がフランス軍を破り、フランス王ジャン2世を捕虜とする大勝利を収めた。クレシーの戦いと並び、長弓を用いたイングランド軍の戦術的優位を示した戦いとされる。' },
  { id:'swiss_independence_1499', name:'スイスの事実上の独立(シュヴァーベン戦争)', category:'event', lat:47.37, lng:8.54, start:1499, end:1499, region:'スイス',
    desc:'スイス誓約同盟(スイス盟約者団)が神聖ローマ皇帝マクシミリアン1世との戦争(シュヴァーベン戦争)に勝利し、事実上帝国からの独立を達成した出来事。国際的な正式承認は1648年のウェストファリア条約まで待つことになる。' },
  { id:'war_devolution', name:'南ネーデルラント継承戦争(権利委譲戦争)', category:'war', lat:50.85, lng:4.35, start:1667, end:1668, region:'南ネーデルラント(現ベルギー)',
    desc:'ルイ14世が王妃の相続権を口実にスペイン領ネーデルラントへの侵攻を開始した戦争。フランスの急速な膨張を警戒したオランダ・イギリス・スウェーデンの三国同盟の圧力により、比較的短期間で終結した。' },
  { id:'khmelnytsky_uprising', name:'フメリニツキーの乱(ウクライナ、コサックの反乱)', category:'war', lat:50.45, lng:30.52, start:1648, end:1657, region:'ウクライナ(ポーランド=リトアニア共和国領)',
    desc:'コサックの指導者フメリニツキーが、ポーランド支配と農奴制・宗教的抑圧に反発して起こした大規模な反乱。ポーランド=リトアニア共和国は大きく国力を消耗し、コサックがロシアの保護を求めたことがロシアのウクライナ進出の足がかりともなった。' },
  { id:'stenka_razin_revolt', name:'ステンカ=ラージンの反乱', category:'revolution', lat:51.53, lng:46.03, start:1670, end:1671, region:'ロシア南部・ヴォルガ川流域',
    desc:'コサックの首領ステンカ=ラージンが率いた、農民・コサックによる大規模な反乱。ヴォルガ川流域を席巻したが最終的に鎮圧され、指導者は処刑された。プガチョフの乱と並ぶロシア史上有数の民衆反乱とされる。' },
  { id:'treaty_karlowitz', name:'カルロヴィッツ条約', category:'treaty', lat:45.2, lng:19.93, start:1699, end:1699, region:'ハンガリー(カルロヴィッツ)',
    desc:'第2次ウィーン包囲失敗後の対オスマン大同盟戦争(大トルコ戦争)を終結させた条約。オスマン帝国はハンガリーの大半をオーストリアに割譲するなど大幅に領土を失い、この条約を境にオスマン帝国は明確に守勢・後退局面に入った。' },
  { id:'treaty_methuen', name:'メシュエン条約', category:'treaty', lat:38.72, lng:-9.14, start:1703, end:1703, region:'イギリス・ポルトガル間',
    desc:'イギリスとポルトガルの間で結ばれた通商条約。ポルトガル産ワインの英国市場での優遇と引き換えにイギリス製毛織物のポルトガル市場への輸出を認めさせ、以後ポルトガルは事実上イギリスの経済的影響下に組み込まれていった。' },
  { id:'diplomatic_revolution_1756', name:'外交革命', category:'event', lat:48.21, lng:16.37, start:1756, end:1756, region:'オーストリア・フランス間',
    desc:'長年敵対してきたハプスブルク家(オーストリア)とブルボン家(フランス)が、プロイセンの台頭に対抗するため同盟関係を結んだ、ヨーロッパ国際政治における劇的な提携転換。この新たな同盟関係のもとで七年戦争が戦われた。' },
  { id:'treaty_kucuk_kaynarca', name:'キュチュク=カイナルジャ条約', category:'treaty', lat:43.75, lng:27.85, start:1774, end:1774, region:'オスマン帝国・ロシア間',
    desc:'露土戦争(第一次)を終結させた条約。ロシアは黒海沿岸への進出と、オスマン帝国領内のギリシャ正教徒保護権を獲得し、以後のロシアの南下政策・オスマン帝国内政干渉の重要な足がかりとなった。' },
  { id:'vendee_revolt', name:'ヴァンデーの反乱', category:'war', lat:46.87, lng:-0.85, start:1793, end:1796, region:'フランス西部(ヴァンデー地方)',
    desc:'徴兵制や聖職者への締め付けに反発した、フランス西部の農民・カトリック信者による反革命的な反乱。革命政府軍により凄惨な弾圧を受け多数の犠牲者を出し、フランス革命が抱えた地方・宗教との深刻な断絶を象徴する事件となった。' },
  { id:'greek_war_independence', name:'ギリシア独立戦争', category:'war', lat:37.98, lng:23.73, start:1821, end:1832, region:'ギリシャ',
    desc:'オスマン帝国支配からの独立を求めてギリシャ人が蜂起した戦争。イギリス・フランス・ロシアの支援(ナヴァリノの海戦での介入など)もあって独立を達成し、ヨーロッパにおけるナショナリズム運動の先駆けとして各国に大きな影響を与えた。' },
  { id:'kingdom_of_greece', name:'ギリシア王国', category:'nation', lat:37.98, lng:23.73, start:1832, end:1973, region:'ギリシャ',
    desc:'独立戦争の結果、列強の後ろ盾のもとバイエルン王家から国王を迎えて成立した王国。度重なる政変やクーデタ、王政と共和政の間の混乱を経ながらも存続したが、1973年の軍事政権下で王政は廃止された。' },
  { id:'polish_november_uprising', name:'ポーランド11月蜂起', category:'revolution', lat:52.23, lng:21.01, start:1830, end:1831, region:'ポーランド立憲王国(ロシア領)',
    desc:'ロシア支配下のポーランド立憲王国で起きた武装蜂起。フランス七月革命の影響も受けて発生したが、ロシア軍により鎮圧され、以後ポーランドの自治権は大幅に縮小された。' },
  { id:'polish_january_uprising', name:'ポーランド1月蜂起', category:'revolution', lat:52.23, lng:21.01, start:1863, end:1864, region:'ポーランド(ロシア領)',
    desc:'ロシア支配に対する2度目の大規模な武装蜂起。今回も鎮圧に終わり、以後ロシアは統治政策を強め、ポーランドの民族的自治はさらに厳しく制限されることになった。' },
  { id:'young_turk_revolution', name:'青年トルコ革命', category:'revolution', lat:41.01, lng:28.98, start:1908, end:1908, region:'オスマン帝国',
    desc:'「青年トルコ人」と呼ばれる将校・知識人グループが、専制的なスルタン、アブデュルハミト2世に対して憲法(ミドハト憲法)の復活を要求した革命。一定の近代化改革が進められたが、多民族国家オスマン帝国内の民族運動の高まりを抑えることはできなかった。' },
  { id:'treaty_brest_litovsk', name:'ブレスト=リトフスク条約', category:'treaty', lat:52.1, lng:23.68, start:1918, end:1918, region:'ロシア(ブレスト=リトフスク)',
    desc:'十月革命後の即時講和を求める世論を背景に、ソヴィエト政権がドイツ・オーストリアなど同盟国側と結んだ単独講和条約。ロシアは広大な西部領土(ポーランド・バルト三国・フィンランド・ウクライナなど、人口・農地・工業生産力の相当部分を含む)を失う極めて過酷な内容であったが、内戦(ロシア内戦)への対処を最優先するレーニンはこの屈辱的な条件を受け入れた。この条約自体は同年のドイツの敗北により事実上無効となったが、この講和は連合国からのソヴィエト政権への不信・敵視を強め、対ソ干渉戦争(諸外国のロシア内戦介入)の一因ともなった。' },
  { id:'treaty_saint_germain', name:'サン=ジェルマン条約', category:'treaty', lat:48.9, lng:2.09, start:1919, end:1919, region:'フランス(サン=ジェルマン)',
    desc:'第一次世界大戦の講和条約の一つで、敗戦国オーストリアと連合国との間で結ばれた。オーストリア=ハンガリー帝国は解体され、オーストリアは小国として再出発するとともにドイツとの合邦(アンシュルス)を禁じられた。' },
  { id:'treaty_neuilly', name:'ヌイイ条約', category:'treaty', lat:48.88, lng:2.27, start:1919, end:1919, region:'フランス(ヌイイ)',
    desc:'第一次世界大戦の講和条約の一つで、敗戦国ブルガリアと連合国との間で結ばれた。ブルガリアは領土の一部(エーゲ海沿岸など)を失い、賠償金支払いや軍備制限を課された。' },
  { id:'treaty_trianon', name:'トリアノン条約', category:'treaty', lat:48.8, lng:2.12, start:1920, end:1920, region:'フランス(ヴェルサイユ、トリアノン宮殿)',
    desc:'第一次世界大戦の講和条約の一つで、敗戦国ハンガリーと連合国との間で結ばれた。ハンガリーは旧王国領土の約3分の2、人口の3分の2を失う極めて過酷な内容となり、以後のハンガリーの対外政策(領土回復要求)に長く影響を残した。' },
  { id:'treaty_sevres', name:'セーヴル条約', category:'treaty', lat:48.83, lng:2.21, start:1920, end:1920, region:'フランス(セーヴル)',
    desc:'第一次世界大戦の講和条約の一つで、敗戦国オスマン帝国と連合国との間で結ばれた。帝国領の大半を英仏の委任統治領などに分割する過酷な内容で、これに反発するトルコ民族運動(ムスタファ=ケマル)の高揚を招き、後にローザンヌ条約により改定された。' },
  { id:'polish_soviet_war', name:'ソヴィエト=ポーランド戦争', category:'war', lat:52.23, lng:21.01, start:1919, end:1921, region:'ポーランド・ウクライナ・ベラルーシ方面',
    desc:'独立回復直後のポーランドと、革命政権下のソヴィエト=ロシアとの間で戦われた国境戦争。ソヴィエト軍がワルシャワ近郊まで迫ったが、ポーランド軍が「ヴィスワ川の奇跡」と呼ばれる反攻で撃退し、ポーランドに有利な国境線が確定した。' },
  { id:'battle_warsaw_1920', name:'ワルシャワの戦い(ヴィスワ川の奇跡)', category:'war', lat:52.23, lng:21.01, start:1920, end:1920, region:'ポーランド(ワルシャワ)',
    desc:'ソヴィエト=ポーランド戦争の帰趨を決した戦い。ピウスツキ率いるポーランド軍が、ワルシャワ目前まで迫っていたソ連赤軍を奇跡的な反撃で撃破し、ポーランドの独立と東方国境を守り抜いた。' },
  { id:'treaty_rapallo', name:'ラパロ条約', category:'treaty', lat:44.35, lng:9.23, start:1922, end:1922, region:'イタリア(ラパロ)',
    desc:'国際的に孤立していたドイツとソヴィエト=ロシアが、互いの賠償請求権を放棄し国交を樹立した条約。両「のけ者」国家の接近は西側諸国に警戒感を与え、秘密裏の軍事協力にもつながったとされる。' },
  { id:'treaty_lausanne', name:'ローザンヌ条約', category:'treaty', lat:46.52, lng:6.63, start:1923, end:1923, region:'スイス(ローザンヌ)',
    desc:'トルコ革命後のトルコ共和国が、過酷なセーヴル条約に代えて連合国と結び直した条約。治外法権の撤廃や関税自主権の回復など、トルコの主権回復に大きく寄与した。' },
  { id:'kellogg_briand_pact', name:'不戦条約(ケロッグ=ブリアン条約)', category:'treaty', lat:48.86, lng:2.35, start:1928, end:1928, region:'フランス(パリ)',
    desc:'国際紛争解決の手段として戦争に訴えることを放棄すると宣言した多国間条約。実効的な制裁手段を欠いていたため後の侵略行為を防げなかったが、「戦争の違法化」という理念は国際法の発展に大きな足跡を残した。' },
  { id:'molotov_ribbentrop_pact', name:'独ソ不可侵条約', category:'treaty', lat:55.75, lng:37.62, start:1939, end:1939, region:'ソ連(モスクワ)',
    desc:'ドイツとソ連が相互不可侵を約した条約。秘密議定書でポーランドや東欧における両国の勢力圏分割を取り決めており、この条約締結の直後にドイツはポーランドへの侵攻を開始し第二次世界大戦が始まった。' },
  { id:'winter_war', name:'ソ連=フィンランド戦争(冬戦争)', category:'war', lat:60.17, lng:24.94, start:1939, end:1940, region:'フィンランド',
    desc:'独ソ不可侵条約の秘密議定書に基づき、ソ連がフィンランドに侵攻した戦争。フィンランドは劣勢ながら善戦して当初ソ連軍に大きな損害を与えたが、最終的に領土の一部割譲を余儀なくされる講和を受け入れた。' },
  { id:'portuguese_carnation_revolution', name:'カーネーション革命(ポルトガル民主化)', category:'revolution', lat:38.72, lng:-9.14, start:1974, end:1974, region:'ポルトガル(リスボン)',
    desc:'青年将校らのクーデタを機に、市民が兵士の銃口にカーネーションの花を差した無血革命。40年以上続いたポルトガルの独裁体制(エスタド・ノヴォ)を打倒し、民主化とアフリカ植民地の独立容認への道を開いた。' },
  { id:'kingdom_of_romania', name:'ルーマニア王国', category:'nation', lat:44.43, lng:26.1, start:1881, end:1947, region:'ルーマニア',
    desc:'モルダヴィアとワラキアの統合を経て成立した国が、1881年に王国として独立を宣言した。第一次世界大戦後にトランシルヴァニアなどを獲得し領土を拡大したが、第二次世界大戦後の共産化により1947年に王政は廃止された。' },
  { id:'ceausescu', name:'チャウシェスク', category:'person', lat:44.43, lng:26.1, start:1918, end:1989, region:'ルーマニア社会主義共和国',
    desc:'独自路線の外交(西側とも一定の関係を保持)で一時注目された一方、国内では個人崇拝と秘密警察による過酷な独裁体制を敷いた指導者。1989年のルーマニア革命により失脚し、即決裁判の末に処刑された東欧革命の中でも異例の劇的な最期を遂げた。' },
  { id:'romanian_revolution_1989', name:'ルーマニア革命', category:'revolution', lat:44.43, lng:26.1, start:1989, end:1989, region:'ルーマニア',
    desc:'東欧革命の中で唯一、流血を伴う激しい市街戦となった革命。独裁者チャウシェスク夫妻が処刑されるという衝撃的な結末を迎え、ルーマニアの共産党一党独裁体制は崩壊した。' },

  // ===================== 追加ボリューム ラウンド1: ドイツ・神聖ローマ帝国 =====================
  { id:'duchy_prussia', name:'プロイセン公国', category:'nation', lat:54.71, lng:20.45, start:1525, end:1701, region:'東プロイセン(旧ドイツ騎士団領)',
    desc:'ドイツ騎士団総長アルブレヒトがルター派に改宗して騎士団領を世俗化し、ポーランド王の宗主権下に成立させた公国。1618年にブランデンブルク選帝侯家と同君連合を結び(ブランデンブルク=プロイセン)、1701年には王国へ格上げされてプロイセン王国の直接の母体となった。' },
  { id:'brandenburg_prussia', name:'ブランデンブルク=プロイセン', category:'nation', lat:52.52, lng:13.40, start:1618, end:1701, region:'北ドイツ・東プロイセン(同君連合)',
    desc:'ホーエンツォレルン家がブランデンブルク選帝侯領とプロイセン公国を同君連合として統治した国家。大選帝侯フリードリヒ=ヴィルヘルムのもとで常備軍と官僚制を整備して中央集権化を進め、1701年にプロイセン王国として王号を獲得した。' },

  { id:'catholic_reformation', name:'カトリック改革(対抗宗教改革)', category:'event', lat:46.07, lng:11.12, start:1545, end:1563, region:'イタリア(トリエント)を中心に南欧・中欧',
    desc:'宗教改革の広がりに対抗してカトリック教会内部で進められた自己刷新運動。トリエント公会議(1545〜63年)で教義の再確認と規律の引き締めを行い、イエズス会などの新修道会による布教活動を通じてカトリックの勢力挽回を図った。' },
  { id:'march_revolution_1848', name:'三月革命(ウィーン・ベルリン)', category:'event', lat:48.21, lng:16.37, start:1848, end:1849, region:'オーストリア(ウィーン)・プロイセン(ベルリン)',
    desc:'フランス二月革命の影響を受けてウィーンとベルリンでほぼ同時に勃発した民衆蜂起。ウィーンでは学生・市民の蜂起によりメッテルニヒが亡命に追い込まれ、ベルリンでも国王が一時譲歩したが、フランクフルト国民議会によるドイツ統一の試みは結局挫折し、翌年までに各地の運動は鎮圧された。' },
  { id:'ems_dispatch', name:'エムス電報事件', category:'event', lat:50.34, lng:7.71, start:1870, end:1870, region:'プロイセン(エムス)',
    desc:'スペイン王位継承問題をめぐるプロイセン王とフランス大使の会談内容を、ビスマルクが挑発的な文面に改変して新聞に公表した事件。これに激怒したフランスが宣戦布告する形となり、普仏戦争開戦の直接のきっかけとなった。' },

  { id:'siege_vienna_1529', name:'第1次ウィーン包囲', category:'war', lat:48.21, lng:16.37, start:1529, end:1529, region:'オーストリア(ウィーン)',
    desc:'スレイマン1世率いるオスマン帝国軍がハプスブルク家の都ウィーンを包囲した戦い。冬の到来と補給の困難によりオスマン軍は撤退し、ヨーロッパ内陸部へのオスマン帝国の拡大に一つの歯止めがかかった。' },
  { id:'war_league_augsburg', name:'アウクスブルク同盟戦争(ファルツ戦争・九年戦争)', category:'war', lat:49.40, lng:8.67, start:1688, end:1697, region:'ライン地方(プファルツ)・神聖ローマ帝国・ネーデルラント・イギリス',
    desc:'ルイ14世のフランスがプファルツ選帝侯領の継承権を主張して侵攻したことに端を発し、神聖ローマ帝国・イギリス・ネーデルラントなどアウクスブルク同盟諸国と戦った戦争。フランスは目立った領土的成果を得られず、ライスワイク条約で講和した。' },

  { id:'henry_iv_hre', name:'ハインリヒ4世', category:'person', parentId:'hre', lat:49.31, lng:8.44, start:1050, end:1106, region:'神聖ローマ帝国',
    desc:'聖職叙任権をめぐって教皇グレゴリウス7世と激しく対立した皇帝。一度は破門されてカノッサで許しを乞うたが(カノッサの屈辱)、後に体制を立て直して再び教皇と争い、対立は子の代のヴォルムス協約でようやく一応の決着をみた。' },
  { id:'sigismund_hre', name:'ジギスムント', category:'person', parentId:'hre', lat:50.08, lng:14.44, start:1368, end:1437, region:'神聖ローマ帝国・ボヘミア王国・ハンガリー王国',
    desc:'コンスタンツ公会議を招集して教会大分裂(大シスマ)の収拾とフスの異端宣告・処刑を主導した皇帝。フスの処刑に反発したベーメンでフス戦争が勃発し、その鎮圧に晩年まで苦慮した。' },
  { id:'frederick_wise_saxony', name:'フリードリヒ(ザクセン選帝侯・賢明公)', category:'person', parentId:'hre', lat:51.87, lng:12.65, start:1463, end:1525, region:'神聖ローマ帝国(ザクセン選帝侯領)',
    desc:'ヴィッテンベルク大学を擁するザクセン選帝侯。ルターの庇護者として知られ、ヴォルムス帝国議会後に彼をヴァルトブルク城へ匿うなど、宗教改革の初期の展開を政治的に支えた。' },
  { id:'ulrich_von_hutten', name:'フッテン', category:'person', parentId:'hre', lat:50.56, lng:9.68, start:1488, end:1523, region:'神聖ローマ帝国',
    desc:'人文主義者・帝国騎士出身の文筆家。教皇や聖職者を鋭く批判する著作でルターの宗教改革を支持し、帝国騎士戦争にも関与したが敗れ、失意のうちに亡命先で没した。' },
  { id:'thomas_muntzer', name:'ミュンツァー', category:'person', parentId:'hre', lat:51.21, lng:10.45, start:1489, end:1525, region:'神聖ローマ帝国(ドイツ農民戦争)',
    desc:'急進的な宗教改革者。ルターとは異なり社会的平等の実現を訴えて既存秩序の変革を目指し、ドイツ農民戦争では農民軍の指導者の一人となったが、諸侯連合軍に敗れて処刑された。' },
  { id:'melanchthon', name:'メランヒトン', category:'person', parentId:'hre', lat:51.87, lng:12.65, start:1497, end:1560, region:'神聖ローマ帝国(ヴィッテンベルク)',
    desc:'ルターの盟友でヴィッテンベルク大学の神学者・人文主義者。ルター派の教義を体系的にまとめた「アウクスブルク信仰告白」を起草し、宗教改革の理論的整備に大きく貢献した。' },
  { id:'gutenberg', name:'グーテンベルク', category:'person', parentId:'hre', lat:49.99, lng:8.25, start:1400, end:1468, region:'神聖ローマ帝国(マインツ)',
    desc:'金属活字と印刷機を組み合わせた活版印刷術を実用化した発明家。「グーテンベルク聖書」の印刷で知られるこの技術は瞬く間にヨーロッパ各地へ広まり、宗教改革や科学革命における知識の普及に大きく貢献した。' },
  { id:'kepler', name:'ケプラー', category:'person', parentId:'hre', lat:50.08, lng:14.44, start:1571, end:1630, region:'神聖ローマ帝国(プラハ)',
    desc:'神聖ローマ皇帝ルドルフ2世に仕えた天文学者。師ティコ=ブラーエの観測データをもとに、惑星が太陽を焦点とする楕円軌道を描くことを示す「ケプラーの法則」を確立し、ガリレイらとともに近代天文学の基礎を築いた。' },
  { id:'leibniz', name:'ライプニッツ', category:'person', parentId:'hre', lat:52.38, lng:9.73, start:1646, end:1716, region:'神聖ローマ帝国(ハノーファー)',
    desc:'微積分法をニュートンとほぼ同時期に独自に発見した哲学者・数学者。「モナド論」に代表される合理主義哲学を展開し、ベルリン科学アカデミーの設立にも尽力した万能の知識人。' },
  { id:'kant', name:'カント', category:'person', parentId:'prussia_kingdom', lat:54.71, lng:20.45, start:1724, end:1804, region:'プロイセン王国(ケーニヒスベルク)',
    desc:'生涯のほとんどを故郷ケーニヒスベルクで過ごした啓蒙思想の代表的哲学者。『純粋理性批判』などを著して経験論と合理論を統合し、ドイツ観念論の基礎を築いて後のフィヒテやヘーゲルらに大きな影響を与えた。' },
  { id:'stein_prussia', name:'シュタイン', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.40, start:1757, end:1831, region:'プロイセン王国',
    desc:'ティルジット条約後の危機の中でプロイセン改革に着手した政治家。農民解放(農奴制廃止)や都市自治制の導入など一連の近代化改革を主導し、その路線は後任のハルデンベルクに引き継がれた。' },
  { id:'hardenberg', name:'ハルデンベルク', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.40, start:1750, end:1822, region:'プロイセン王国',
    desc:'シュタインの後を継いでプロイセン改革を推進した宰相。営業の自由化や行政・税制改革を進める一方、ウィーン会議にプロイセン代表として出席し、戦後のヨーロッパ秩序の形成にも関わった。' },
  { id:'fichte', name:'フィヒテ', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.40, start:1762, end:1814, region:'プロイセン王国(ベルリン)',
    desc:'ナポレオン占領下のベルリンで連続講演「ドイツ国民に告ぐ」を行い、ドイツ人としての国民意識の覚醒を訴えた哲学者。新設のベルリン大学の初代総長も務め、ドイツ観念論の発展とナショナリズムの高揚に大きな影響を与えた。' },
  { id:'goethe', name:'ゲーテ', category:'person', parentId:'hre', lat:50.98, lng:11.33, start:1749, end:1832, region:'神聖ローマ帝国・ドイツ諸邦(ヴァイマル)',
    desc:'『若きウェルテルの悩み』『ファウスト』などで知られるドイツ古典主義文学の代表的作家。ヴァイマル公国の要職も務め、シラーらと親交を結んで「ヴァイマル古典主義」と呼ばれる文化的黄金期を築いた。' },
  { id:'schiller', name:'シラー', category:'person', parentId:'hre', lat:50.98, lng:11.33, start:1759, end:1805, region:'神聖ローマ帝国・ドイツ諸邦(ヴァイマル)',
    desc:'『群盗』『ヴィルヘルム=テル』などの戯曲で知られる詩人・劇作家。ゲーテと並ぶドイツ古典主義文学の代表者であり、自由と人間性の解放を主題とする作品群は後世に大きな影響を与えた。' },
  { id:'brothers_grimm', name:'グリム兄弟', category:'person', lat:51.31, lng:9.48, start:1785, end:1863, region:'ドイツ諸邦(ヘッセン、ドイツ連邦)',
    desc:'『グリム童話集』や『ドイツ語辞典』の編纂で知られる言語学者・民俗学者の兄弟。民間伝承や言語の収集・研究を通じてドイツ文化の共通の基盤を提示しようとし、統一以前のドイツ=ナショナリズムの文化的土台の形成にも寄与した。' },
  { id:'wagner_composer', name:'ヴァーグナー', category:'person', parentId:'german_empire', lat:49.95, lng:11.57, start:1813, end:1883, region:'ドイツ(バイロイト)',
    desc:'『ニーベルングの指環』などの楽劇で知られる作曲家。専用の祝祭劇場をバイロイトに建設して自作を上演し、民族色の濃い題材と壮大な音楽劇はドイツ統一期のナショナリズムとも結びついて熱狂的に受容された。' },
  { id:'hegel', name:'ヘーゲル', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.40, start:1770, end:1831, region:'プロイセン王国(ベルリン)',
    desc:'ベルリン大学教授として絶大な影響力を誇った哲学者。弁証法を用いて歴史や精神の発展過程を体系的に捉える哲学を築き、その思想は右派・左派に分かれて継承され、左派からマルクスの唯物史観が生み出された。' },
  { id:'karl_marx', name:'マルクス', category:'person', parentId:'prussia_kingdom', lat:49.76, lng:6.64, start:1818, end:1883, region:'プロイセン王国(トリーア)、のちロンドンで亡命生活',
    desc:'プロイセン王国領トリーア出身の哲学者・経済学者。エンゲルスと『共産党宣言』を著して階級闘争と社会主義革命を提唱し、主著『資本論』では資本主義経済の構造を分析、国際労働運動と社会主義思想に絶大な影響を与えた。' },
  { id:'engels', name:'エンゲルス', category:'person', parentId:'prussia_kingdom', lat:51.26, lng:7.15, start:1820, end:1895, region:'プロイセン王国(ヴッパータール)',
    desc:'プロイセン王国領の紡績工場経営者の家に生まれた思想家。マルクスの盟友・支援者として『共産党宣言』を共同執筆し、マルクスの死後は未完だった『資本論』続巻の編纂にも尽力して科学的社会主義の確立に貢献した。' },
  { id:'friedrich_list', name:'リスト(経済学者)', category:'person', parentId:'prussia_kingdom', lat:48.49, lng:9.20, start:1789, end:1846, region:'ドイツ諸邦(ヴュルテンベルク)',
    desc:'保護貿易主義の立場から幼稚産業保護論を唱えた経済学者。ドイツ諸邦間の関税同盟(ドイツ関税同盟、1834年発足)の実現を提唱・後押しし、経済面からドイツの国民経済形成と統一への地ならしを行った。' },
  { id:'lassalle', name:'ラサール', category:'person', parentId:'prussia_kingdom', lat:52.52, lng:13.40, start:1825, end:1864, region:'プロイセン王国(ベルリン)',
    desc:'全ドイツ労働者協会を結成した社会主義者。普通選挙権の獲得と国家の援助による生産協同組合の設立を主張する国家社会主義的な路線をとり、後のドイツ社会主義運動(社会主義労働者党、のちのSPD)の源流の一つとなった。' },
  { id:'bebel', name:'ベーベル', category:'person', parentId:'german_empire', lat:52.52, lng:13.40, start:1840, end:1913, region:'ドイツ帝国',
    desc:'ドイツ社会民主党(SPD)の指導的な創設者の一人。ビスマルクの社会主義者鎮圧法下でも党勢を維持・拡大し、マルクス主義的な綱領(エアフルト綱領)のもとでドイツ最大級の政党へと成長させた。' },
  { id:'helmholtz', name:'ヘルムホルツ', category:'person', parentId:'german_empire', lat:52.52, lng:13.40, start:1821, end:1894, region:'ドイツ帝国(ベルリン)',
    desc:'エネルギー保存則の定式化に貢献した物理学者・生理学者。視覚・聴覚の生理学的研究でも先駆的業績を残し、ベルリン大学教授として当時のドイツ自然科学界を主導した。' },
  { id:'rontgen', name:'レントゲン', category:'person', parentId:'german_empire', lat:49.79, lng:9.93, start:1845, end:1923, region:'ドイツ帝国(ヴュルツブルク)',
    desc:'ヴュルツブルク大学で未知の放射線(X線)を発見した物理学者。この発見は医療診断への応用に道を開き、その功績により第1回ノーベル物理学賞を受賞した。' },
  { id:'liebig', name:'リービヒ', category:'person', lat:50.58, lng:8.68, start:1803, end:1873, region:'ドイツ諸邦(ヘッセン、ギーセン)',
    desc:'有機化学の基礎を築くとともに、植物の生育に必要な無機養分を明らかにして化学肥料の実用化に道を開いた化学者(農芸化学の祖)。ギーセン大学に近代的な化学実験教育の手法を確立し、多くの門下生を育てた。' },
  { id:'daimler', name:'ダイムラー', category:'person', parentId:'german_empire', lat:48.78, lng:9.18, start:1834, end:1900, region:'ドイツ帝国(シュトゥットガルト)',
    desc:'高速回転が可能な軽量ガソリンエンジンを開発し、それを用いたオートバイや自動車を実用化した技術者・企業家。設立した会社は後にダイムラー=ベンツ社へとつながり、自動車産業の先駆者の一人となった。' },
  { id:'diesel_rudolf', name:'ディーゼル', category:'person', parentId:'german_empire', lat:48.37, lng:10.90, start:1858, end:1913, region:'ドイツ帝国(アウクスブルク)',
    desc:'燃料を圧縮熱で自己着火させる新型内燃機関(ディーゼルエンジン)を発明した技術者。ガソリンエンジンより熱効率が高いこの機関は船舶・鉄道・大型車両などの動力源として普及し、後の産業に大きな影響を与えた。' },
  { id:'koch', name:'コッホ', category:'person', parentId:'german_empire', lat:52.52, lng:13.40, start:1843, end:1910, region:'ドイツ帝国(ベルリン)',
    desc:'炭疽菌・結核菌・コレラ菌を発見した細菌学者。病原体を特定する手法(コッホの原則)を確立して近代細菌学の基礎を築き、その功績により1905年にノーベル生理学・医学賞を受賞した。' },

  // ===================== 追加ボリューム ラウンド2: イギリス(イングランド・ブリテン) =====================
  { id:'plantagenet_dynasty', name:'プランタジネット朝', category:'dynasty', lat:51.51, lng:-0.13, start:1154, end:1399, region:'イングランド',
    desc:'アンジュー伯家出身のヘンリ2世に始まる王朝。一時はフランス西部にまで及ぶ広大な領土(アンジュー帝国)を有したが、次第に大陸領土を失い、百年戦争を戦う中でランカスター家とヨーク家に王統が分かれて終焉した。' },
  { id:'lancaster_dynasty', name:'ランカスター朝', category:'dynasty', lat:51.51, lng:-0.13, start:1399, end:1461, region:'イングランド',
    desc:'ヘンリ4世がリチャード2世を廃位して開いた王朝。百年戦争後半を戦ったが戦況は次第に悪化し、王位継承をめぐるヨーク家との内戦(薔薇戦争)の末に打倒された。' },
  { id:'york_dynasty', name:'ヨーク朝', category:'dynasty', lat:51.51, lng:-0.13, start:1461, end:1485, region:'イングランド',
    desc:'薔薇戦争でランカスター家を破ったエドワード4世が開いた王朝。リチャード3世の代にボズワースの戦いでヘンリ7世(テューダー家)に敗れ、短期間で断絶した。' },
  { id:'stuart_dynasty', name:'ステュアート朝', category:'dynasty', lat:51.51, lng:-0.13, start:1603, end:1714, region:'イングランド(・スコットランド)',
    desc:'スコットランド王家出身のジェームズ1世が、テューダー朝断絶後にイングランド王を兼ねて成立させた王朝。王権神授説を掲げて議会と対立を深め、清教徒革命による共和政期の中断を挟みつつ、名誉革命や1707年の合同法を経験し、アン女王の死により断絶した。' },

  { id:'egbert_wessex', name:'エグバート', category:'person', parentId:'anglo_saxon_heptarchy', lat:51.06, lng:-1.31, start:775, end:839, region:'ウェセックス王国',
    desc:'ウェセックス王として七王国の他の諸王を服属させ、「イングランド人の王」と称されたアングロサクソンの王。この勝利によりウェセックスがイングランド統一の中心となり、のちのアルフレッド大王による統一事業の基盤を築いた。' },
  { id:'henry_iii_england', name:'ヘンリ3世', category:'person', parentId:'plantagenet_dynasty', lat:51.51, lng:-0.13, start:1207, end:1272, region:'イングランド',
    desc:'マグナ・カルタの精神を軽視した専制的な統治で諸侯の反発を招いた王。シモン=ド=モンフォールらの反乱により身柄を拘束され、聖職者・貴族に加え各州・都市の代表も招集した会議が開かれる契機となった(イギリス議会の起源)。' },
  { id:'simon_de_montfort', name:'シモン=ド=モンフォール', category:'person', parentId:'plantagenet_dynasty', lat:51.51, lng:-0.13, start:1208, end:1265, region:'イングランド',
    desc:'ヘンリ3世の専制に対する諸侯反乱を主導した貴族。国王を捕虜として実権を握り、1265年に聖職者・貴族に加え各州・都市の代表も招集した会議を開催し、後のイギリス議会(下院)の起源になったとされる。' },
  { id:'black_prince', name:'エドワード黒太子', category:'person', parentId:'plantagenet_dynasty', lat:51.85, lng:-1.36, start:1330, end:1376, region:'イングランド(百年戦争)',
    desc:'エドワード3世の長男で百年戦争前半のイングランド軍を率いた皇太子。クレシーの戦いやポワティエの戦いで長弓を用いた戦術によりフランス軍を打ち破ったが、父より先に没したため王位には就かなかった。' },
  { id:'charles_i_england', name:'チャールズ1世', category:'person', parentId:'stuart_dynasty', lat:51.51, lng:-0.13, start:1600, end:1649, region:'イングランド',
    desc:'王権神授説に基づく専制的な統治を進めて議会と激しく対立した王。課税をめぐる対立から内戦(清教徒革命)が勃発し、議会派に敗れて捕らえられ、国王として異例の裁判の末に処刑された。' },
  { id:'filmer', name:'フィルマー', category:'person', parentId:'stuart_dynasty', lat:51.28, lng:0.52, start:1588, end:1653, region:'イングランド',
    desc:'『パトリアーカ(家父長権論)』を著し、王権は家父長権に由来するとして王権神授説を理論的に正当化した政治思想家。名誉革命後にロックが『統治二論』で反論の対象としたことでも知られる。' },
  { id:'edward_coke', name:'コーク(クック)', category:'person', parentId:'stuart_dynasty', lat:51.51, lng:-0.13, start:1552, end:1634, region:'イングランド',
    desc:'コモン=ローの権威を説き、国王大権に対する法の優位を主張した法律家。下院議長として権利の請願(1628年)の起草を主導し、国王の恣意的な課税や不当逮捕に対する議会の権利を明確化しようとした。' },
  { id:'mary_queen_of_scots', name:'メアリ=ステュアート(スコットランド女王)', category:'person', lat:55.95, lng:-3.19, start:1542, end:1587, region:'スコットランド王国',
    desc:'幼くしてスコットランド女王となり、フランス王太子妃も務めたステュアート家の女王。カトリックであったため従妹エリザベス1世と対立し、王位継承をめぐる陰謀への関与を疑われて幽閉の末に処刑された。その子ジェームズ1世がイングランド王を兼ねてステュアート朝を開いた。' },
  { id:'william_iii_england', name:'ウィリアム3世(ウィレム3世)', category:'person', parentId:'stuart_dynasty', lat:51.51, lng:-0.13, start:1650, end:1702, region:'イングランド(・ネーデルラント)',
    desc:'オランダ総督でありながら名誉革命により妻メアリ2世と共同でイギリス王に迎えられた王。権利の章典を承認して立憲君主政の基礎を固め、対外的にはルイ14世のフランスと対抗する諸戦争を主導した。' },
  { id:'mary_ii_england', name:'メアリ2世', category:'person', parentId:'stuart_dynasty', lat:51.51, lng:-0.13, start:1662, end:1694, region:'イングランド',
    desc:'ジェームズ2世の娘で、名誉革命により夫ウィリアム3世と共同統治の王に迎えられた女王。プロテスタントの王位継承を確定させ、以後のイギリス立憲君主政の出発点を作った。' },
  { id:'anne_queen', name:'アン(女王)', category:'person', parentId:'stuart_dynasty', lat:51.51, lng:-0.13, start:1665, end:1714, region:'イングランド・スコットランド',
    desc:'ステュアート朝最後の君主。1707年の合同法によりイングランドとスコットランドを統合してグレートブリテン王国を成立させ、彼女の死後は嗣子がなかったため遠縁のハノーヴァー家(ジョージ1世)が王位を継承した。' },
  { id:'edward_vi_england', name:'エドワード6世', category:'person', parentId:'tudor_dynasty', lat:51.51, lng:-0.13, start:1537, end:1553, region:'イングランド',
    desc:'ヘンリ8世の子で、幼少で即位しプロテスタント化を大きく前進させた王。一般祈祷書の制定などイギリス国教会のプロテスタント色を強めたが、若くして病没し、姉メアリ1世のカトリック復古を招いた。' },
  { id:'francis_bacon', name:'フランシス=ベーコン', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1561, end:1626, region:'イングランド',
    desc:'「知は力なり」の言葉で知られる経験論哲学の祖。観察と実験に基づく帰納法を提唱して近代科学の方法論に大きな影響を与え、イギリス経験論の出発点となった。' },
  { id:'thomas_hobbes', name:'ホッブズ', category:'person', parentId:'england_kingdom', lat:51.58, lng:-2.10, start:1588, end:1679, region:'イングランド',
    desc:'『リヴァイアサン』を著した政治哲学者。自然状態を「万人の万人に対する闘争」と捉え、秩序維持のため人々が契約により強大な主権者(国家)に自然権を譲渡すべきだとする社会契約説を展開し、絶対王政を理論的に擁護した。' },
  { id:'john_locke', name:'ロック', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1632, end:1704, region:'イングランド',
    desc:'『統治二論』で抵抗権(革命権)を含む社会契約説を展開した哲学者。生命・自由・財産を守るための政府という考え方は名誉革命を理論的に正当化し、後のアメリカ独立宣言やフランス人権宣言にも大きな影響を与えた。' },
  { id:'isaac_newton', name:'ニュートン', category:'person', parentId:'england_kingdom', lat:52.20, lng:0.12, start:1642, end:1727, region:'イングランド',
    desc:'万有引力の法則と運動の三法則を『プリンキピア』で体系化した自然科学者。微積分法もライプニッツとほぼ同時期に独自に確立し、その力学体系は近代科学(物理学)の基礎として長く支配的な影響力を持った。' },
  { id:'adam_smith', name:'アダム=スミス', category:'person', parentId:'uk_britain', lat:56.11, lng:-3.16, start:1723, end:1790, region:'グレートブリテン王国(スコットランド)',
    desc:'『諸国民の富(国富論)』を著した古典派経済学の創始者。個人の自由な経済活動(「見えざる手」)が結果的に社会全体の利益をもたらすとして重商主義を批判し、自由放任(レッセ=フェール)の経済思想を体系化した。' },
  { id:'george_iii_britain', name:'ジョージ3世', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1738, end:1820, region:'グレートブリテン王国',
    desc:'アメリカ植民地への課税強化と独立戦争の敗北、フランス革命・ナポレオン戦争期の対仏戦争を経験した王。晩年は精神疾患により摂政(のちのジョージ4世)が政務を代行した。' },
  { id:'wilberforce', name:'ウィルバーフォース', category:'person', parentId:'uk_britain', lat:53.77, lng:-0.34, start:1759, end:1833, region:'グレートブリテン王国',
    desc:'奴隷貿易廃止運動を主導した政治家・奴隷解放運動家。長年の議会活動の末、1807年に奴隷貿易廃止法、死の直前の1833年には奴隷制度そのものを廃止する法律の成立にこぎつけた。' },
  { id:'earl_grey', name:'グレイ(伯爵)', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1764, end:1845, region:'イギリス',
    desc:'首相として1832年の選挙法改正(第1回選挙法改正)を実現させた政治家。腐敗選挙区を整理して産業資本家層に選挙権を拡大し、以後段階的に進む議会制度改革の出発点を作った。' },
  { id:'cobden', name:'コブデン', category:'person', parentId:'uk_britain', lat:53.48, lng:-2.24, start:1804, end:1865, region:'イギリス(マンチェスター)',
    desc:'ジョン=ブライトとともに反穀物法同盟を組織した自由貿易論者。マンチェスターを拠点に穀物法廃止(1846年)の実現に尽力し、その後のイギリス自由貿易体制の確立に大きな役割を果たした。' },
  { id:'john_bright', name:'ブライト', category:'person', parentId:'uk_britain', lat:53.61, lng:-2.16, start:1811, end:1889, region:'イギリス',
    desc:'コブデンとともに反穀物法同盟を率いた急進的自由主義の政治家。穀物法廃止運動やその後の選挙法改正運動でも活躍し、自由貿易と議会改革を掲げる中産階級の代弁者として知られた。' },
  { id:'robert_peel', name:'ピール', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1788, end:1850, region:'イギリス',
    desc:'首相として穀物法廃止(1846年)を断行し、保守党を分裂させた政治家。内相時代にはロンドン警視庁を創設して近代警察制度の基礎を築いたことでも知られる。' },
  { id:'palmerston', name:'パーマーストン', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1784, end:1865, region:'イギリス',
    desc:'アヘン戦争やクリミア戦争期に外相・首相として強硬な対外政策(「砲艦外交」)を主導した政治家。イギリスの国益を最優先する現実主義的な外交を展開し、ヴィクトリア朝中期のイギリスの国際的影響力拡大を象徴する人物となった。' },
  { id:'nightingale', name:'ナイティンゲール', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1820, end:1910, region:'イギリス',
    desc:'クリミア戦争に従軍し、野戦病院での衛生環境改善によって傷病兵の死亡率を大幅に低下させた看護師。帰国後は近代看護教育の体系化に尽力し、「クリミアの天使」として看護学の母と称される。' },
  { id:'daniel_oconnell', name:'オコンネル', category:'person', parentId:'uk_britain', lat:53.35, lng:-6.26, start:1775, end:1847, region:'イギリス(アイルランド)',
    desc:'カトリック協会を組織してアイルランドにおけるカトリック教徒への差別撤廃を求める運動を主導した政治家。1829年のカトリック教徒解放法の成立を実現させ、「解放者」と称された。' },

  // ===================== 追加ボリューム ラウンド3: ロシア(補完)・イタリア/教皇 =====================
  { id:'bering', name:'ベーリング', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1681, end:1741, region:'ロシア帝国(カムチャツカ探検隊)',
    desc:'ピョートル1世の命でカムチャツカ探検隊を率いたデンマーク出身の探検家。ユーラシア大陸とアメリカ大陸を隔てる海峡(ベーリング海峡)を発見・踏査し、ロシアの極東・北太平洋進出の先駆けとなった。' },
  { id:'yermak', name:'イェルマーク', category:'person', parentId:'tsardom_russia', lat:58.20, lng:68.25, start:1532, end:1585, region:'ロシア・ツァーリ国(シベリア)',
    desc:'コサックの首領としてシベリア=ハン国を破り、ロシアのシベリア進出の端緒を開いた人物。イヴァン4世の後ろ盾を得た遠征により、広大なシベリアが次第にロシアの支配下に組み込まれていく契機を作った。' },
  { id:'boris_godunov', name:'ボリス=ゴドゥノフ', category:'person', parentId:'tsardom_russia', lat:55.75, lng:37.62, start:1551, end:1605, region:'ロシア・ツァーリ国',
    desc:'イヴァン4世没後に摂政として実権を握り、後に自ら皇帝(ツァーリ)に即位した人物。農民の移動を制限する法令を強化して農奴制の確立を進めたが、彼の死後は後継者をめぐる大混乱(動乱時代)に陥った。' },

  { id:'gregory_i', name:'グレゴリウス1世(大教皇)', category:'person', lat:41.90, lng:12.49, start:540, end:604, region:'ローマ教会',
    desc:'修道士出身で教皇に選出され、教皇の権威を大きく高めた「大教皇」。ゲルマン人(アングロ=サクソン人など)への布教を積極的に推進してカトリックの勢力圏を西欧全域へ拡大し、グレゴリオ聖歌の整備でも知られる。' },
  { id:'gregory_vii', name:'グレゴリウス7世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1015, end:1085, region:'教皇領',
    desc:'クリュニー修道院改革の精神を受け継ぎ、聖職売買や聖職者の妻帯を禁じるとともに、皇帝による聖職叙任権を否定して皇帝ハインリヒ4世と激しく対立した教皇。破門されたハインリヒ4世に許しを乞わせた「カノッサの屈辱」で知られる。' },
  { id:'urban_ii', name:'ウルバヌス2世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1035, end:1099, region:'教皇領',
    desc:'クレルモン公会議(1095年)で聖地イェルサレムの奪還を訴え、第1回十字軍の派遣を提唱した教皇。この呼びかけに西欧諸国から多数の諸侯・騎士が参加し、以後約200年におよぶ十字軍運動の口火が切られた。' },
  { id:'innocent_iii', name:'インノケンティウス3世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1161, end:1216, region:'教皇領',
    desc:'「教皇は太陽、皇帝は月」と称される教皇権の絶頂期を築いた教皇。イングランド王ジョンやフランス王フィリップ2世らヨーロッパ諸国の王を次々と屈服させ、第4回十字軍やアルビジョワ十字軍の提唱者としても知られる。' },
  { id:'boniface_viii', name:'ボニファティウス8世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1235, end:1303, region:'教皇領',
    desc:'フランス王フィリップ4世と聖職者への課税をめぐり激しく対立した教皇。フィリップ4世の軍勢にアナーニで一時捕縛される屈辱を受け(アナーニ事件)まもなく憤死し、以後教皇権は大きく後退して「教皇のバビロン捕囚」への道を開いた。' },
  { id:'anagni_incident', name:'アナーニ事件', category:'event', lat:41.75, lng:13.15, start:1303, end:1303, region:'イタリア(アナーニ)',
    desc:'フランス王フィリップ4世が聖職者への課税をめぐり教皇ボニファティウス8世と対立し、その軍勢が教皇をアナーニで一時捕縛した事件。教皇は間もなく憤死し、以後教皇権は著しく後退して「教皇のバビロン捕囚」(アヴィニョン捕囚)へとつながった。' },
  { id:'leo_x', name:'レオ10世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1475, end:1521, region:'教皇領',
    desc:'メディチ家出身の教皇。サン=ピエトロ大聖堂再建費用の調達のため贖宥状(免罪符)の販売を認めたことがルターの九十五カ条の論題(1517年)を招き、宗教改革の直接のきっかけを作った。後にルターを破門した。' },
  { id:'paul_iii', name:'パウルス3世', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1468, end:1549, region:'教皇領',
    desc:'カトリック改革(対抗宗教改革)を主導した教皇。トリエント公会議を招集して教義の再確認と規律の刷新を図り、イグナティウス=ロヨラらが結成したイエズス会を正式に承認して海外布教や教育を通じたカトリックの勢力挽回を後押しした。' },
  { id:'giotto', name:'ジョット', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1267, end:1337, region:'フィレンツェ共和国',
    desc:'平面的なビザンツ様式から脱し、写実的で立体感のある人物表現を初めて追求した画家。「ルネサンス絵画の父」と称され、パドヴァのスクロヴェーニ礼拝堂の壁画などにその革新性が示されている。' },
  { id:'masaccio', name:'マサッチョ', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1401, end:1428, region:'フィレンツェ共和国',
    desc:'遠近法(透視図法)を絵画に本格的に取り入れた初期ルネサンスの画家。写実的な人体表現と明暗法を駆使したフレスコ画により、レオナルドやミケランジェロら後代の画家に大きな影響を与えたが、27歳の若さで没した。' },
  { id:'donatello', name:'ドナテルロ', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1386, end:1466, region:'フィレンツェ共和国',
    desc:'古代彫刻の研究に基づき写実的な人体表現を追求した初期ルネサンスの彫刻家。ブロンズ製の裸体像「ダヴィデ」は、古代以来初めて等身大の裸体彫刻として制作された記念碑的作品とされる。' },
  { id:'brunelleschi', name:'ブルネレスキ', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1377, end:1446, region:'フィレンツェ共和国',
    desc:'線遠近法(透視図法)の理論を確立した建築家。古代ローマ建築の研究に基づき、フィレンツェ大聖堂(サンタ=マリア=デル=フィオーレ)の巨大な円蓋(クーポラ)を無支柱で完成させ、ルネサンス建築の先駆けとなった。' },
  { id:'ghiberti', name:'ギベルティ', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1378, end:1455, region:'フィレンツェ共和国',
    desc:'フィレンツェ洗礼堂の青銅製扉「天国の門」を製作した彫刻家。この扉の制作コンペにはブルネレスキらも参加して競い合い、初期ルネサンス美術の幕開けを象徴する出来事として知られる。' },
  { id:'bramante', name:'ブラマンテ', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:1444, end:1514, region:'教皇領(ローマ)',
    desc:'盛期ルネサンス建築を代表する建築家。教皇ユリウス2世の命でサン=ピエトロ大聖堂新築工事の最初の設計を手がけ、集中式プランに基づく古典的で調和のとれた建築様式を確立した。' },

  // ===================== 追加ボリューム ラウンド4: スペイン・ポルトガル + 教皇(厚み増し) =====================
  { id:'cordoba_caliphate', name:'後ウマイヤ朝(コルドバ)', category:'nation', lat:37.88, lng:-4.78, start:756, end:1031, region:'イベリア半島(コルドバ)',
    relatedIds:['umayyad_caliphate','nasrid_granada'],
    desc:'ダマスクスのウマイヤ朝が滅亡した際、一族の一人がイベリア半島へ逃れて建てた国。当初は首長国であったが、929年にアブド=アッラフマーン3世がカリフを称してカリフ国となり、コルドバは西方イスラーム世界随一の学術・文化都市として繁栄した。' },
  { id:'abd_al_rahman_iii', name:'アブド=アッラフマーン3世', category:'person', parentId:'cordoba_caliphate', lat:37.88, lng:-4.78, start:891, end:961, region:'後ウマイヤ朝(コルドバ)',
    desc:'後ウマイヤ朝の全盛期を築いた君主。929年に自らカリフを称してバグダードのアッバース朝カリフ、カイロのファーティマ朝カリフと並び立ち、コルドバを壮麗な学問・文化の中心都市として発展させた。' },
  { id:'nasrid_granada', name:'ナスル朝(グラナダ王国)', category:'nation', lat:37.18, lng:-3.60, start:1238, end:1492, region:'イベリア半島南部(グラナダ)',
    desc:'イベリア半島に残った最後のイスラーム王朝。アルハンブラ宮殿を造営するなど独自の文化を花開かせたが、1492年にカスティリャ・アラゴン連合軍に降伏してグラナダが陥落し、レコンキスタが完了した。' },
  { id:'john_i_portugal', name:'ジョアン1世(ポルトガル)', category:'person', parentId:'portugal_kingdom', lat:38.72, lng:-9.14, start:1357, end:1433, region:'ポルトガル王国',
    desc:'アヴィス朝を開いた王。アルジュバロータの戦い(1385年)でカスティリャ軍を破ってポルトガルの独立を確定させ、その子エンリケ航海王子のもとで大航海時代の先駆けとなる海外進出の基礎を築いた。' },
  { id:'toscanelli', name:'トスカネリ', category:'person', parentId:'florence_republic', lat:43.77, lng:11.26, start:1397, end:1482, region:'フィレンツェ共和国',
    desc:'地球球体説に基づき、大西洋を西へ航海すればアジアに到達できるとする地図・書簡をコロンブスに送った天文学者・地理学者。彼の理論はコロンブスの西回り航路構想を後押しする重要な根拠となった。' },

  { id:'leo_i', name:'レオ1世(大教皇)', category:'person', lat:41.90, lng:12.49, start:400, end:461, region:'ローマ教会',
    desc:'フン人の王アッティラと会見してローマへの進撃を思いとどまらせたとされる教皇。「大教皇」と呼ばれる教皇の一人で、教皇の首位性(使徒ペトロの後継者としての権威)を理論的に主張し、西方教会における教皇権の基礎を築いた。' },
  { id:'leo_iii_pope', name:'レオ3世(教皇)', category:'person', parentId:'papal_states', lat:41.90, lng:12.49, start:750, end:816, region:'教皇領',
    desc:'800年のクリスマスにフランク王カール(のちのカール大帝)へ西ローマ皇帝の帝冠を授けた教皇。これにより西ヨーロッパに古代ローマ帝国の後継者を称する新たな皇帝権が生まれ、東ローマ皇帝と対抗しうる西欧世界の独自性が示された。' },
