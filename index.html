<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ヨーロッパ史地図 — 世界史探究</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root{
    --bg-chrome:#1b2430;
    --bg-chrome-alt:#212c3a;
    --bg-chrome-alt2:#283544;
    --parchment:#f3ecdc;
    --parchment-alt:#eadfc6;
    --ink:#2a2420;
    --ink-soft:#5b5346;
    --line:#3a4658;
    --line-parchment:#cbb98c;
    --gold:#c99a4a;
    --gold-strong:#e0b567;
    --text-light:#e9e2d0;
    --text-light-soft:#9aa3b3;

    --cat-person:#c0554a;
    --cat-nation:#3f7ea6;
    --cat-dynasty:#8259ac;
    --cat-event:#c99a4a;
    --cat-war:#8a3a3a;
    --cat-revolution:#3f8f74;
    --cat-treaty:#7a6a52;

    --header-h:68px;
    --footer-h:104px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-chrome);
    color:var(--text-light);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Spectral',Georgia,serif; }

  a{color:var(--gold-strong);}

  :focus-visible{
    outline:2px solid var(--gold-strong);
    outline-offset:2px;
  }

  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  #app-header{
    height:var(--header-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
  }
  #app-header h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:.01em;
    color:var(--text-light);
  }
  #app-header .subtitle{
    margin:2px 0 0;
    font-size:12px;
    color:var(--text-light-soft);
    font-family:'Inter',sans-serif;
  }
  .header-year{
    text-align:right;
  }
  .header-year .label{
    font-size:11px;
    color:var(--text-light-soft);
    display:block;
    margin-bottom:2px;
  }
  .header-year .value{
    font-family:'Spectral',serif;
    font-size:24px;
    font-weight:600;
    color:var(--gold-strong);
    white-space:nowrap;
  }

  /* ---------- Main layout ---------- */
  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }

  /* Sidebar */
  #sidebar{
    width:230px;
    flex:0 0 auto;
    background:var(--bg-chrome-alt);
    border-right:1px solid var(--line);
    padding:18px 16px;
    overflow-y:auto;
  }
  #sidebar h2{
    font-size:14px;
    font-weight:600;
    margin:0 0 12px;
    color:var(--text-light);
  }
  .filter-list{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .filter-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:6px 6px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
  }
  .filter-row:hover{ background:var(--bg-chrome-alt2); }
  .filter-row input[type="checkbox"]{
    accent-color:var(--gold);
    width:14px; height:14px;
    flex:0 0 auto;
  }
  .swatch{
    width:10px; height:10px;
    border-radius:50%;
    flex:0 0 auto;
    box-shadow:0 0 0 1px rgba(0,0,0,.25);
  }
  .filter-row .fname{
    flex:1 1 auto;
    font-size:13px;
    color:var(--text-light);
  }
  .filter-row .fcount{
    font-size:11px;
    color:var(--text-light-soft);
  }

  .filter-actions{
    display:flex;
    gap:10px;
    margin:12px 0 18px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--gold-strong);
    font-size:12px;
    padding:0;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .link-btn:hover{ text-decoration:underline; }

  .search-box{
    margin-bottom:18px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .search-box label{
    display:block;
    font-size:12px;
    color:var(--text-light-soft);
    margin-bottom:6px;
  }
  .search-box input{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text-light);
    font-size:13px;
    padding:5px 2px;
    font-family:'Inter',sans-serif;
  }
  .search-box input:focus{
    border-bottom-color:var(--gold-strong);
    outline:none;
  }

  .stats{
    font-size:11.5px;
    color:var(--text-light-soft);
    border-top:1px solid var(--line);
    padding-top:12px;
  }
  .stats b{ color:var(--gold-strong); font-weight:600; }

  /* Map */
  #mapWrap{
    flex:1 1 auto;
    position:relative;
    min-width:0;
  }
  #map{
    position:absolute; inset:0;
    background:var(--bg-chrome-alt);
  }
  .leaflet-tile-pane{
    filter:grayscale(18%) sepia(10%) saturate(85%) contrast(0.96) brightness(0.97);
  }
  .entry-label{
    background:rgba(27,36,48,.82) !important;
    border:none !important;
    box-shadow:none !important;
    color:#f3ecdc !important;
    font-family:'Inter',sans-serif;
    font-size:11px;
    padding:1px 6px !important;
    border-radius:3px !important;
  }
  .entry-label::before{ display:none; }

  /* クラスター(ピンの重なり)アイコン */
  .cluster-marker-wrap{ background:none !important; border:none !important; }
  .cluster-badge{
    width:32px; height:32px;
    border-radius:50%;
    background:var(--bg-chrome-alt2);
    border:2px solid var(--gold-strong);
    color:var(--gold-strong);
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600;
    box-shadow:0 0 0 3px rgba(27,36,48,.55);
  }
  .leaflet-cluster-spider-leg{
    stroke:var(--gold-strong) !important;
    stroke-opacity:.6 !important;
  }

  /* Detail panel */
  #detailPanel{
    width:340px;
    flex:0 0 auto;
    background:var(--parchment);
    color:var(--ink);
    border-left:1px solid var(--line-parchment);
    overflow-y:auto;
    position:relative;
    transition:margin-right .22s ease;
  }
  #detailPanel.hidden{
    margin-right:-340px;
  }
  @media (prefers-reduced-motion: reduce){
    #detailPanel{ transition:none; }
  }
  #closeDetail{
    position:absolute;
    top:12px; right:12px;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line-parchment);
    background:var(--parchment-alt);
    color:var(--ink);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  #closeDetail:hover{ background:#e0d3ac; }
  #detailContent{ padding:26px 22px 30px; }
  .detail-badge{
    display:inline-block;
    font-size:11px;
    color:#fff;
    padding:3px 9px;
    border-radius:3px;
    margin-bottom:12px;
  }
  #detailContent h3{
    margin:0 0 6px;
    font-size:21px;
    font-weight:600;
    line-height:1.35;
    color:var(--ink);
  }
  .detail-meta{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:16px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line-parchment);
  }
  .detail-meta div{ margin-top:3px; }
  #detailContent p{
    font-size:14px;
    line-height:1.85;
    color:var(--ink);
    margin:0;
  }
  .detail-empty{
    padding:40px 22px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.8;
  }

  .back-btn{
    display:inline-block;
    background:none;
    border:1px solid var(--line-parchment);
    color:var(--ink-soft);
    font-size:12px;
    padding:5px 10px;
    border-radius:4px;
    margin-bottom:16px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:hover{ background:var(--parchment-alt); }

  .related-persons{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--line-parchment);
  }
  .related-persons h4{
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    margin:0 0 8px;
    font-family:'Inter',sans-serif;
  }
  .related-persons ul{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .person-list-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:9px 8px;
    border-radius:4px;
    cursor:pointer;
  }
  .person-list-item:hover{ background:var(--parchment-alt); }
  .related-cat-badge{
    display:inline-block;
    font-size:9.5px;
    color:#fff;
    padding:1px 6px;
    border-radius:3px;
    margin-right:7px;
    white-space:nowrap;
    font-family:'Inter',sans-serif;
  }
  .person-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .person-years{
    font-size:11px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .related-persons-empty{
    font-size:12px;
    color:var(--ink-soft);
    padding-top:2px;
  }

  /* Footer timeline */
  #timeline{
    height:var(--footer-h);
    flex:0 0 auto;
    background:var(--bg-chrome);
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 22px;
  }
  #playBtn{
    flex:0 0 auto;
    background:var(--bg-chrome-alt2);
    border:1px solid var(--line);
    color:var(--gold-strong);
    border-radius:20px;
    padding:9px 16px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    white-space:nowrap;
  }
  #playBtn:hover{ background:#31405490; }

  .timeline-track-wrap{
    flex:1 1 auto;
    position:relative;
    padding-top:6px;
    padding-bottom:22px;
  }
  #yearSlider{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:2px;
    background:var(--line-parchment);
    outline:none;
    margin:0;
    display:block;
  }
  #yearSlider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
    margin-top:0;
  }
  #yearSlider::-moz-range-thumb{
    width:16px; height:16px;
    border:none;
    border-radius:50%;
    background:var(--gold-strong);
    box-shadow:0 0 0 4px rgba(224,181,103,.22);
    cursor:pointer;
  }
  .ticks{
    position:relative;
    height:16px;
    margin-top:6px;
  }
  .tick{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    font-size:10.5px;
    color:var(--text-light-soft);
    white-space:nowrap;
  }
  .tick::before{
    content:"";
    position:absolute;
    top:-16px; left:50%;
    width:1px; height:6px;
    background:var(--line);
  }

  .speed-control{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .speed-control label{
    font-size:11px;
    color:var(--text-light-soft);
  }
  .speed-control select{
    background:var(--bg-chrome-alt2);
    color:var(--text-light);
    border:1px solid var(--line);
    border-radius:5px;
    padding:6px 8px;
    font-size:12px;
    font-family:'Inter',sans-serif;
  }

  /* Responsive: narrow screens */
  @media (max-width: 760px){
    #sidebar{
      width:100%;
      position:absolute;
      z-index:900;
      height:auto;
      max-height:55%;
      box-shadow:0 8px 18px rgba(0,0,0,.35);
    }
    #detailPanel{
      position:absolute;
      right:0; left:0; top:auto; bottom:0;
      width:auto;
      height:60%;
      border-left:none;
      border-top:1px solid var(--line-parchment);
      transition:transform .22s ease;
      z-index:950;
    }
    #detailPanel.hidden{
      margin-right:0;
      transform:translateY(100%);
    }
    #timeline{ gap:10px; padding:0 12px; }
    .speed-control label{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <header id="app-header">
    <div>
      <h1>ヨーロッパ史 地図で学ぶ世界史</h1>
      <p class="subtitle">紀元前3000年 〜 西暦2000年 ・ 高校世界史探究 学習用</p>
    </div>
    <div class="header-year">
      <span class="label">現在の年代</span>
      <span class="value" id="yearDisplay">紀元前500年</span>
    </div>
  </header>

  <div id="main">

    <aside id="sidebar">
      <h2>ジャンルで絞り込み</h2>
      <div class="filter-list" id="filterList"></div>
      <p style="font-size:11px; color:var(--text-light-soft); line-height:1.6; margin:8px 2px 0;">
        ※人物は単独のピンではなく、関連する国家・王朝のピンをクリックした先の一覧から見られます。
      </p>

      <div class="filter-actions">
        <button class="link-btn" id="selectAllBtn">すべて表示</button>
        <button class="link-btn" id="selectNoneBtn">すべて解除</button>
      </div>

      <div class="search-box">
        <label for="searchInput">名称で検索</label>
        <input type="text" id="searchInput" placeholder="例: ナポレオン、フランス革命">
      </div>

      <div class="stats">
        <b id="visibleCount">0</b> 件を表示中 / 全 <b id="totalCount">0</b> 件のデータ
      </div>
    </aside>

    <div id="mapWrap">
      <div id="map"></div>
    </div>

    <aside id="detailPanel" class="hidden">
      <button id="closeDetail" aria-label="閉じる">×</button>
      <div id="detailContent">
        <div class="detail-empty">地図上のピンをクリックすると、ここに詳しい解説が表示されます。</div>
      </div>
    </aside>

  </div>

  <footer id="timeline">
    <button id="playBtn">▶ 再生</button>
    <div class="timeline-track-wrap">
      <input type="range" id="yearSlider" min="-3000" max="2000" step="1" value="-500">
      <div class="ticks" id="ticks"></div>
    </div>
    <div class="speed-control">
      <label for="speedSelect">速度</label>
      <select id="speedSelect">
        <option value="1">×1</option>
        <option value="5" selected>×5</option>
        <option value="20">×20</option>
        <option value="50">×50</option>
      </select>
    </div>
  </footer>

</div>

<script>
/* =========================================================================
   ヨーロッパ史 地図アプリ — データ本体
   -------------------------------------------------------------------------
   ジャンル(category)は以下の7種:
     person     人物
     nation     国家
     dynasty    王朝
     event      事件・出来事
     war        戦争・戦い
     revolution 革命
     treaty     条約

   各エントリの形式:
   {
     id:       一意の文字列ID
     name:     表示名(日本語)
     category: 上記7種のいずれか
     lat, lng: 地図上の座標(代表都市・場所)
     start:    存在/在位/発生開始年(西暦。紀元前はマイナスで表現。例: 紀元前500年 = -500)
     end:      終了年(単発の出来事は start と同じか、数年程度の幅を持たせる)
     region:   地域・国名の補助タグ
     desc:     詳細説明文
   }

   ★ データは今後、国・地域ごとに分割して追加していきます。
     新しいブロックを追加する際は、この配列に要素を push する形で
     どんどん拡張できます(下記はコメントで地域ごとに区切り済み)。
   ========================================================================= */

const historicalData = [

  // ===================== 古代オリエント・エーゲ海世界 =====================
  { id:'egypt_old', name:'古代エジプト(ファラオの時代)', category:'nation', lat:30.04, lng:31.24, start:-3000, end:-30, region:'エジプト',
    desc:'ナイル川流域に成立した古代文明。ファラオを頂点とする中央集権国家が長期にわたり存続し、ピラミッドなどの建造物や象形文字(ヒエログリフ)を残した。プトレマイオス朝の滅亡(前30年)をもって古代エジプト王朝は終焉を迎える。' },
  { id:'minoan', name:'ミノア文明(クレタ文明)', category:'nation', lat:35.30, lng:25.16, start:-2700, end:-1450, region:'ギリシャ・クレタ島',
    desc:'クレタ島を中心に栄えた地中海最古級の青銅器文明。クノッソス宮殿に代表される高度な建築技術を持ち、線文字Aを使用した。火山噴火や地震などを経て衰退したとされる。' },
  { id:'mycenae', name:'ミケーネ文明', category:'nation', lat:37.73, lng:22.76, start:-1600, end:-1100, region:'ギリシャ本土',
    desc:'ギリシャ本土に成立した青銅器文明で、線文字Bを用いた。堅固な城塞王宮を各地に築き、トロイア戦争の伝承の背景にもなったとされる。前1200年頃の「海の民」の活動などを経て崩壊した。' },
  { id:'troy_war', name:'トロイア戦争(伝承)', category:'war', lat:39.96, lng:26.24, start:-1194, end:-1184, region:'小アジア(トロイア)',
    desc:'ホメロスの叙事詩『イリアス』に描かれる伝説的な戦争。ギリシャ連合軍が小アジアのトロイアを攻略したとされ、後世の考古学発掘(シュリーマンら)によって都市トロイアの実在が確認された。' },
  { id:'phoenicia', name:'フェニキア(都市国家群)', category:'nation', lat:33.27, lng:35.20, start:-1200, end:-539, region:'地中海東岸(レバント)',
    desc:'ティルス・シドンなどの港市を拠点に地中海貿易で栄えたセム系の海洋民族。表音文字であるフェニキア文字は後のギリシャ文字・アルファベットの起源となった。' },

  // ===================== 古代ギリシャ =====================
  { id:'sparta', name:'スパルタ', category:'nation', lat:37.08, lng:22.43, start:-900, end:-192, region:'ギリシャ・ペロポネソス',
    desc:'リュクルゴス制と呼ばれる国制のもと、少数の市民(スパルティアタイ)が多数の隷属民(ヘイロータイ)を軍事力で支配する特異な社会を築いたポリス。市民は幼少期から共同生活(アゴゲー)で徹底した軍事教練を受け、私有財産や貨幣経済を厳しく制限されるなど、徹底した軍国主義体制と市民間の平等主義を両立させた点でアテネと対照をなす。この閉鎖的な体制はペルシア戦争・ペロポネソス戦争でギリシャ世界随一の陸軍国家としての地位を支えたが、征服地拡大が困難で市民団(スパルティアタイ)の人口が先細り、前4世紀以降は急速に国力を失った。' },
  { id:'athens_polis', name:'アテネ(ポリス)', category:'nation', lat:37.98, lng:23.73, start:-800, end:-146, region:'ギリシャ・アッティカ',
    desc:'エーゲ海交易と銀山(ラウレイオン)の富を背景に発展した古代ギリシャ最大級のポリス。前6世紀のソロン・ペイシストラトス・クレイステネスの改革を経て、前5世紀には成人男性市民全員が民会に参加する直接民主政を完成させ、ペリクレス時代にはデロス同盟の盟主として最盛期を迎えた。パルテノン神殿に象徴される古典文化が花開いた一方、参政権は成人男性市民に限られ、女性・在留外人(メトイコイ)・奴隷は除外されるなど、民主政の恩恵は限定的でもあった。ペロポネソス戦争の敗北後は政治的覇権を失うが、哲学・学問の中心地としての地位は長く保たれた。' },
  { id:'solon', name:'ソロン', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-638, end:-558, region:'アテネ',
    desc:'貴族と平民の対立が激化する中、調停者(アルコン)に選ばれてアテネの改革に着手した政治家。債務による市民の奴隷化を禁じ(負債の帳消しを含む「重荷おろし」)、血統ではなく財産の多寡によって参政権と義務を定める財産政治(ティモクラシー)を導入して平民にも一定の政治参加の道を開いた。血縁的身分制に代わる新たな政治原理を打ち出した点で、後のクレイステネスの改革を経て完成する民主政の出発点と位置づけられる。' },
  { id:'persian_wars', name:'ペルシア戦争', category:'war', lat:37.98, lng:23.73, start:-499, end:-449, region:'ギリシャ・アケメネス朝ペルシア',
    desc:'小アジアのイオニア植民市の反乱(イオニアの反乱)への介入を機に、アケメネス朝ペルシアがギリシャ本土へ侵攻したことで始まった一連の戦争。数に勝るペルシア軍に対し、ギリシャ諸ポリスはマラトンの戦い・テルモピュライの戦い・サラミスの海戦・プラタイアの戦いで抵抗し、最終的に撃退に成功した。この勝利はギリシャ人の「自由」と東方専制(ペルシア)への優越意識を強め、海軍の主力を担った下層市民(無産市民)の発言力向上を通じてアテネの民主政をさらに発展させた。戦後結成されたデロス同盟は、やがてアテネによる事実上の帝国支配の道具へと変質していく。' },
  { id:'pericles', name:'ペリクレス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-495, end:-429, region:'アテネ',
    desc:'将軍職に連続して選出され、約30年にわたりアテネの実質的な指導者であり続けた政治家。民会・民衆裁判所への参加者に日当を支給する制度を整えて下層市民の政治参加を実質化し、アテネ民主政を完成の域に導いた。デロス同盟の資金を流用してパルテノン神殿をはじめとする大規模な公共建築事業を推進し、アテネを政治・文化両面でギリシャの中心に押し上げた一方、同盟諸市への強硬姿勢はスパルタとの緊張を高めペロポネソス戦争の一因ともなった。開戦後まもなく疫病(伝染病)で命を落とし、その死はアテネの指導力低下を招いたとされる。' },
  { id:'peloponnesian_war', name:'ペロポネソス戦争', category:'war', lat:37.98, lng:23.73, start:-431, end:-404, region:'ギリシャ',
    desc:'アテネの勢力拡大とデロス同盟の帝国化に対する警戒から、スパルタを中心とするペロポネソス同盟との間で勃発した全ギリシャを巻き込む大戦争。当初は陸戦に強いスパルタと海軍に勝るアテネが一進一退を続けたが、シケリア遠征の大失敗やペルシアの資金援助を受けたスパルタの海軍力強化により戦局はスパルタ有利に傾き、前404年アテネは降伏した。長期にわたる戦争はポリス社会全体を疲弊させ、市民間の党派対立や傭兵の増加を招くなど、古典期ポリス社会の変質・衰退を決定づける転換点となった。' },
  { id:'macedonia', name:'マケドニア王国', category:'nation', lat:40.77, lng:22.52, start:-808, end:-168, region:'マケドニア',
    desc:'ギリシャ人からは半ば「異民族」とみなされていたギリシャ北方の王国。フィリッポス2世が軍制改革(サリッサと呼ばれる長槍を用いた密集戦術=ファランクスの改良)によって強力な常備軍を築き、カイロネイアの戦い(前338年)でアテネ・テーベ連合軍を破ってギリシャ本土の覇権を握った。その子アレクサンドロス大王のもとで東方遠征を行い、ペルシア帝国を滅ぼして史上空前の大帝国へと発展し、ギリシャ文化と東方文化が融合するヘレニズム世界の基盤を築いた。' },
  { id:'alexander', name:'アレクサンドロス大王', category:'person', parentId:'macedonia', lat:40.77, lng:22.52, start:-356, end:-323, region:'マケドニア',
    desc:'父フィリッポス2世の急死を受けて20歳で即位し、東方遠征を開始したマケドニア王。イッソスの戦い・ガウガメラの戦いでアケメネス朝ペルシアの大軍を撃破してこれを滅ぼし、エジプトからインダス川流域にまで至る空前の大帝国を築いた。各地に自らの名を冠したアレクサンドリアを建設してギリシャ人を植民させ、現地の文化・制度とギリシャ文化を融合させる融和政策(ペルシア式儀礼の採用や集団結婚の実施など)を進めたことで、コスモポリタニズムを特徴とするヘレニズム文化が形成される土台を作った。32歳で急死すると帝国はディアドコイ(後継者)たちの争いにより分裂した。' },

  // ===================== 古代ローマ =====================
  { id:'rome_kingdom', name:'ローマ王政', category:'nation', lat:41.90, lng:12.49, start:-753, end:-509, region:'イタリア・ローマ',
    desc:'伝承ではロムルスによって建国されたとされるローマ最初期の王政期。7代の王が統治し、後半にはエトルリア人の王も即位するなどエトルリア文化の強い影響を受けた。最後の王タルクィニウス(尊大王)の専制に対する貴族の反発から前509年に王政が廃止されて共和政に移行し、以後ローマ人は王政(レックス)そのものを忌避する政治文化を長く保持した。' },
  { id:'rome_republic', name:'ローマ共和政', category:'nation', lat:41.90, lng:12.49, start:-509, end:-27, region:'イタリア・ローマ',
    relatedIds:['carthage','punic_wars','samnite_wars','pyrrhic_war','social_war_rome','mithridatic_wars','sertorian_war','macedonian_wars','spartacus_revolt','struggle_of_orders','twelve_tables','licinian_sextian_laws','gracchi_reform','first_triumvirate','rubicon_crossing','second_triumvirate'],
    desc:'王政廃止後に成立した共和政。任期1年・2名同僚制の執政官(コンスル)を中心に、貴族(パトリキ)からなる元老院が事実上の国政を主導する体制を築いた。当初は貴族が権力を独占していたが、身分闘争を通じて平民(プレブス)も徐々に政治参加の道を得て、前3世紀までにイタリア半島を統一、続くポエニ戦争・マケドニア戦争を経て地中海世界全域に覇権を広げた。しかし急速な対外拡大は中小農民の没落や属州統治をめぐる利権争いを生み、前2世紀末以降は内乱の1世紀と呼ばれる混乱期に陥っていく。' },
  { id:'punic_wars', name:'ポエニ戦争', category:'war', lat:36.85, lng:10.32, start:-264, end:-146, region:'ローマ・カルタゴ',
    desc:'ローマと西地中海交易を支配していたフェニキア系都市国家カルタゴとの間で、シチリア・西地中海の覇権をめぐり3次にわたり戦われた戦争。第2次ではカルタゴの将軍ハンニバルがアルプスを越えてイタリアに侵入しカンナエの戦いなどでローマ軍を撃破する危機を招いたが、スキピオがザマの戦いでハンニバルを破って形勢を逆転した。第3次でカルタゴは徹底的に破壊され(「カルタゴ滅ぶべし」の言葉で知られる大カトーが開戦を主導)、ローマは西地中海の覇権を確立して属州支配による経済的繁栄と、それに伴う社会構造の変質(奴隷制大農場ラティフンディアの拡大、中小農民の没落)という新たな課題を抱えることになった。' },
  { id:'hannibal', name:'ハンニバル', category:'person', parentId:'carthage', lat:36.85, lng:10.32, start:-247, end:-183, region:'カルタゴ',
    desc:'カルタゴの将軍。第二次ポエニ戦争でアルプスを越えてイタリアに侵攻し、カンナエの戦いなどでローマ軍を苦しめたが、最終的にザマの戦いで敗れた。' },
  { id:'caesar', name:'ユリウス・カエサル', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-100, end:-44, region:'ローマ',
    desc:'閥族派(元老院派)に対抗する平民派の政治家として頭角を現し、第一回三頭政治を経てガリア遠征(前58〜51年)で全ガリアを征服し軍事的名声と莫大な富、精強な軍団を獲得した政治家・軍人。元老院がポンペイウスと結んで軍団解散を命じると、ルビコン川を越えて内戦に踏み切り、ポンペイウス派を破って事実上の独裁権(終身独裁官)を握った。負債整理や属州統治の改革、ユリウス暦の制定など多方面の改革を進めたが、その権力集中を王政復活への動きと警戒したブルートゥス・カッシウスら共和派によって元老院内で暗殺され、結果的に共和政の完全な崩壊を早めることとなった。' },
  { id:'rome_empire', name:'ローマ帝国', category:'nation', lat:41.90, lng:12.49, start:-27, end:476, region:'地中海世界全域',
    relatedIds:['pax_romana','crisis_third_century','edict_of_milan','division_roman_empire','battle_teutoburg','jewish_war_rome','constitutio_antoniniana','sack_of_rome_410','fall_wroman'],
    desc:'アウグストゥスの即位により成立した帝政ローマ。地中海世界を統一する巨大帝国として繁栄したが、3世紀の危機や度重なる異民族侵入を経て、476年に西方帝国が滅亡した。' },
  { id:'augustus', name:'アウグストゥス(オクタウィアヌス)', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:-63, end:14, region:'ローマ',
    desc:'カエサルの養子(姉の孫)として内乱に勝ち残り、事実上の帝政を開始した人物。「第一の市民(プリンケプス)」と称して共和政の制度・形式(元老院や執政官)を外見上は温存しつつ、護民官特権・軍最高指揮権などを一身に集めて実質的な専制君主として君臨する「元首政(プリンキパトゥス)」という統治形態を確立した。約200年続く「ローマの平和(パクス・ロマーナ)」の礎を築き、行政・軍制・財政の各面で帝政の基本的な枠組みを整えた。' },
  { id:'christianity_rise', name:'キリスト教の成立と拡大', category:'event', lat:31.77, lng:35.21, start:1, end:392, region:'パレスチナ〜ローマ帝国全域',
    desc:'パレスチナに起こった宗教運動が地中海世界に広まり、迫害を経ながらも信徒を増やした。313年のミラノ勅令で公認され、392年には帝国の国教とされ、後のヨーロッパ社会の精神的基盤の一つとなった。' },
  { id:'diocletian', name:'ディオクレティアヌス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:244, end:311, region:'ローマ帝国',
    desc:'軍人皇帝時代の混乱(3世紀の危機)を収拾し、帝国を東西南北の4人の統治者(正帝2名・副帝2名)で分割統治する四帝分治制(テトラルキア)を導入した皇帝。元首政の形式すら廃して「主(ドミヌス)」として臣下に跪拝を求める専制君主政(ドミナトゥス)へと統治形態を転換し、物価統制令の発布や税制改革によって財政の立て直しも図った。晩年にはキリスト教徒への大規模な迫害(最後の大迫害)を行ったが、その死後まもなくコンスタンティヌスによってキリスト教公認へと政策は大きく転換した。' },
  { id:'constantine', name:'コンスタンティヌス大帝', category:'person', parentId:'rome_empire', lat:41.01, lng:28.98, start:272, end:337, region:'ローマ帝国',
    desc:'軍人皇帝間の内乱を勝ち抜いて帝国を再統一した皇帝。ミラノ勅令(313年)でキリスト教信仰を公認して迫害政策を転換し、ニケーア公会議(325年)を主催してアタナシウス派を正統教義と定めるなど、国家がキリスト教の教義論争に介入する先例を作った。ビザンティウムを新首都コンスタンティノープルとして整備し帝国の重心を東方へ移したことは、後の東西ローマ分裂と東ローマ(ビザンツ)帝国の長期存続を準備することにもなった。' },
  { id:'fall_wroman', name:'西ローマ帝国の滅亡', category:'event', lat:41.90, lng:12.49, start:476, end:476, region:'イタリア',
    desc:'ゲルマン人傭兵隊長オドアケルが、少年皇帝ロムルス・アウグストゥルスを廃位して皇帝位を東ローマ皇帝に返上した出来事。これにより西ローマ帝国は形式上も消滅し、以後西ヨーロッパは東ゴート・フランク・ヴァンダルなどゲルマン諸国家が分立する時代に入った。ただし実態としては既に5世紀初頭からゲルマン人の大移動・定住が進んでおり、476年は象徴的な区切りに過ぎず、古代から中世への移行は長期的な過程として捉える見方が近年は有力である。' },
  { id:'byzantine', name:'ビザンツ帝国(東ローマ帝国)', category:'nation', lat:41.01, lng:28.98, start:395, end:1453, region:'東地中海世界',
    desc:'コンスタンティノープルを首都とし、西ローマ滅亡後も約1000年にわたり存続した東ローマ帝国。ギリシャ正教とローマ法・ギリシャ文化を融合させた独自の文明を築いた。' },
  { id:'justinian', name:'ユスティニアヌス1世', category:'person', parentId:'byzantine', lat:41.01, lng:28.98, start:482, end:565, region:'ビザンツ帝国',
    desc:'ビザンツ皇帝。『ローマ法大全』の編纂やハギア・ソフィア大聖堂の建設で知られ、一時的に旧西ローマ領の一部を再征服した。' },

  // ===================== フランク王国〜中世前期 =====================
  { id:'franks', name:'フランク王国', category:'nation', lat:48.86, lng:2.35, start:481, end:843, region:'西ヨーロッパ(現フランス・ドイツ)',
    desc:'ライン川下流域を本拠としたゲルマン系フランク人が、他のゲルマン部族と異なりアタナシウス派(カトリック)への改宗という道を選んで建てた王国。クローヴィスの改宗によりガロ=ローマ系住民やローマ教会の支持を得たことが、他のアリウス派ゲルマン国家(西ゴート・ヴァンダルなど)に比べた長期的な安定と発展の鍵となった。宮宰(マヨル=ドムス)のカロリング家が実権を握り、カール大帝のもとで西ヨーロッパの大半を統一して800年に西ローマ皇帝の帝冠を得たが、843年のヴェルダン条約による分割相続を機に東・西・中部フランクに分裂し、それぞれ後のドイツ・フランス・イタリアの原型となった。' },
  { id:'clovis', name:'クローヴィス1世', category:'person', parentId:'franks', lat:48.86, lng:2.35, start:466, end:511, region:'フランク王国',
    desc:'メロヴィング朝フランク王国の建国者。周辺のフランク諸小王国を統合し、ガリア北部を支配していた最後のローマ系勢力(シアグリウス)を破ってガリアの大半を制圧した。妃クロティルドの勧めもあってアタナシウス派(カトリック)キリスト教に改宗したことは、周囲のアリウス派ゲルマン諸国(西ゴート・ブルグンドなど)とは一線を画す選択であり、ガロ=ローマ系住民やローマ教会の支持を得て支配の正統性を高め、以後のフランク王権とローマ教会の緊密な結びつきの出発点となった。' },
  { id:'charlemagne', name:'カール大帝(シャルルマーニュ)', category:'person', parentId:'franks', lat:50.78, lng:6.08, start:747, end:814, region:'フランク王国',
    desc:'カロリング朝の王。父ピピン(小ピピン)の事業を継いでランゴバルド王国を征服しイタリア北部を併合、ザクセン人を武力で征服してキリスト教化するなど征服戦争を重ね、西ヨーロッパの大半を統一する大帝国を築いた。800年、教皇レオ3世よりローマで西ローマ皇帝の帝冠を授けられたことは、古代ローマ帝国の権威を継承する新たな皇帝権を西ヨーロッパに生み出し、以後の東ローマ皇帝との対抗関係の中で西欧世界の独自性を示す象徴的出来事となった。宮廷に学者を招いてラテン語文化の復興(カロリング=ルネサンス)を促した一方、その死後は孫の代でヴェルダン条約・メルセン条約により帝国は分割相続され、東・西フランクと中部フランクに分裂した。' },
  { id:'hre', name:'神聖ローマ帝国', category:'nation', lat:50.78, lng:6.08, start:962, end:1806, region:'中央ヨーロッパ(ドイツ・イタリア)',
    desc:'オットー1世の戴冠(962年)に始まる帝国で、名目上は古代ローマ帝国の後継者・西欧キリスト教世界の守護者としての普遍的権威を有したが、実態は多数の領邦(諸侯領・自由都市・聖界諸侯領)が分立するゆるやかな連合体であった。皇帝は世襲ではなく選帝侯による選挙で選ばれ、叙任権闘争や大空位時代を経て皇帝権はイタリア政策の失敗とともに次第に形骸化し、金印勅書(1356年)により領邦分立が法的にも追認された。三十年戦争後のウェストファリア条約でこの分権的性格は決定的なものとなり、ナポレオンによる圧力(ライン同盟結成)の中、1806年に皇帝フランツ2世が退位を宣言して解体した。' },
  { id:'viking_age', name:'ヴァイキング時代', category:'event', lat:60.39, lng:5.32, start:793, end:1066, region:'北欧・北大西洋沿岸',
    desc:'スカンディナヴィア半島出身のノルマン人(ヴァイキング)が交易・略奪・植民のため各地に進出した時代。イングランド・フランス北部・ロシア方面などに大きな影響を残した。' },
  { id:'norman_conquest', name:'ノルマン・コンクエスト', category:'event', lat:50.86, lng:0.49, start:1066, end:1066, region:'イングランド',
    desc:'ノルマンディー公ウィリアムがヘースティングズの戦いでイングランド王ハロルド2世を破り、イングランドを征服した出来事。イングランド王権の基礎とフランス的封建制度をもたらした。' },
  { id:'william_conqueror', name:'ウィリアム1世(征服王)', category:'person', parentId:'england_kingdom', lat:51.51, lng:-0.13, start:1028, end:1087, region:'イングランド・ノルマンディー',
    desc:'ノルマンディー公でありながら、遠縁のイングランド王位継承権を主張してイングランドに侵攻し、ヘースティングズの戦いでアングロサクソン王ハロルド2世を破ってイングランド王となった人物(ノルマン=コンクエスト)。フランス式の封建制度を導入して全国の土地をノルマン人諸侯に再分配する中央集権的な統治体制を築き、支配権を正確に把握するための土地台帳『ドゥームズデイ=ブック』を作成させた。この征服により、イングランドの支配層はフランス語を話すノルマン貴族に一新され、以後長期にわたりイングランド王がフランス国内に領土を持つという、英仏関係を規定する構造が生まれた。' },

  // ===================== 中世盛期(十字軍〜百年戦争) =====================
  { id:'crusades', name:'十字軍', category:'war', lat:31.77, lng:35.21, start:1096, end:1291, region:'中東・ヨーロッパ',
    desc:'聖地エルサレム奪還を掲げ、ローマ教皇の呼びかけで西ヨーロッパ諸国が繰り返し行った遠征。宗教的動機に加え、東西交易の拡大や教皇権の伸張ももたらした。' },
  { id:'magna_carta', name:'マグナ・カルタ(大憲章)', category:'treaty', lat:51.44, lng:-0.57, start:1215, end:1215, region:'イングランド',
    desc:'フランスでの相次ぐ敗北と重税に苦しめられた諸侯が、国王ジョンに突きつけた要求をまとめた文書。国王であっても法の下にあり、貴族の同意なしに新たな課税を行えないこと、法に基づかない逮捕・投獄を行わないこと(適正手続きの原則)などを定めた。制定当時は主に諸侯階級の封建的特権を確認する文書としての性格が強かったが、17世紀の議会派によって王権に対する議会・国民の権利を根拠づける文書として再解釈・再利用され、後のイギリス立憲主義、さらにはアメリカ独立宣言など近代民主主義思想の源流の一つとして位置づけられるに至った。' },
  { id:'mongol_invasion_europe', name:'モンゴルのヨーロッパ遠征', category:'war', lat:47.50, lng:19.04, start:1236, end:1242, region:'東欧(ロシア・ハンガリー)',
    desc:'バトゥ率いるモンゴル軍がロシア諸公国を征服し、さらにハンガリー・ポーランドへ侵攻した遠征。東ヨーロッパ社会に大きな衝撃を与えた。' },
  { id:'hundred_years_war', name:'百年戦争', category:'war', lat:48.86, lng:2.35, start:1337, end:1453, region:'イングランド・フランス',
    desc:'エドワード3世が母方を通じたフランス王位継承権を主張してヴァロワ朝フランス王家に異議を唱えたことに端を発し、断続的に戦われた長期戦争。クレシー・ポワティエの戦いでは長弓兵を活用したイングランド軍が騎士中心のフランス軍を破って優勢に立ったが、ジャンヌ=ダルクの登場を機にフランス側が反攻に転じ、常備軍・課税制度の整備も進めて最終的に勝利、イングランド勢力をほぼ大陸から駆逐した。この長期戦争を通じて両国それぞれで国王への権力集中(常備軍・恒久的課税制度)と国民意識の形成が進み、中世的な封建社会から近世の主権国家体制への移行を促す重要な画期となった。' },
  { id:'joan_of_arc', name:'ジャンヌ・ダルク', category:'person', parentId:'france_kingdom', lat:47.90, lng:1.91, start:1412, end:1431, region:'フランス',
    desc:'百年戦争末期、シャルル7世側が劣勢に立たされる中、「神の啓示を受けた」と称してシノン城で王太子シャルルに謁見し、その信任を得てオルレアン包囲戦の解放(1429年)を主導した農民出身の少女。この勝利を機に士気を回復したフランス軍はランスでのシャルル7世戴冠を実現し、以後の反攻の転機を作った。しかしコンピエーニュでブルゴーニュ派に捕らえられてイングランド側に引き渡され、宗教裁判で異端・魔女とされて火刑に処された。死後まもなくフランスは百年戦争に勝利し、後に彼女の名誉は回復されて国民的英雄・聖女として顕彰されるに至った。' },
  { id:'black_death', name:'黒死病(ペスト大流行)', category:'event', lat:43.30, lng:5.37, start:1347, end:1351, region:'ヨーロッパ全域',
    desc:'中央アジアから交易路を通じてヨーロッパに広がった疫病。ヨーロッパ人口の3分の1近くが失われたとされ、荘園制の崩壊など社会構造にも大きな変化をもたらした。' },
  { id:'ottoman_conquest', name:'コンスタンティノープル陥落', category:'event', lat:41.01, lng:28.98, start:1453, end:1453, region:'ビザンツ帝国・オスマン帝国',
    desc:'オスマン帝国スルタン、メフメト2世がコンスタンティノープルを攻略し、ビザンツ帝国は滅亡した。多くのギリシャ人学者が西方に逃れ、ルネサンスにも影響を与えたとされる。' },

  // ===================== ルネサンス・大航海時代・宗教改革 =====================
  { id:'renaissance', name:'ルネサンス', category:'event', lat:43.77, lng:11.26, start:1400, end:1600, region:'イタリア中心に西欧全域',
    desc:'古典古代の文化を再評価し、人間性を重視する「人文主義(ヒューマニズム)」を核とした文化運動。イタリア諸都市で花開き、美術・建築・科学など幅広い分野に革新をもたらした。' },
  { id:'medici', name:'メディチ家', category:'dynasty', lat:43.77, lng:11.26, start:1434, end:1737, region:'フィレンツェ',
    desc:'銀行業で富を築き、フィレンツェの事実上の支配者となった一族。芸術家・学者の庇護者としてルネサンス文化の発展を強力に後押しした。' },
  { id:'leonardo', name:'レオナルド・ダ・ヴィンチ', category:'person', parentId:'medici', lat:43.77, lng:11.26, start:1452, end:1519, region:'イタリア',
    desc:'画家・科学者・技術者として万能の才を発揮したルネサンスを代表する人物。『モナ・リザ』『最後の晩餐』などの作品のほか、解剖学・機械設計の研究でも知られる。' },
  { id:'columbus', name:'コロンブスの新大陸到達', category:'event', lat:37.23, lng:-6.90, start:1492, end:1492, region:'スペイン→カリブ海',
    desc:'スペイン女王イサベル1世の支援を受けたコロンブスが大西洋を横断し、カリブ海の島々(サン=サルバドル島)に到達した出来事。当初の目的であったアジア(インド・中国)への西回り航路開拓には失敗したものの(コロンブス自身は生涯これをアジアの一部と信じ続けた)、結果的にヨーロッパ人にとって未知であった新大陸の存在を明らかにし、以後の本格的な新大陸進出・「大航海時代」の始まりと、大西洋を挟んだ両半球間の生物・文化・疫病の交流(コロンブス交換)を引き起こす画期的な出来事となった。' },
  { id:'habsburg', name:'ハプスブルク家', category:'dynasty', lat:48.21, lng:16.37, start:1282, end:1918, region:'オーストリア・スペイン等',
    desc:'元々スイス周辺の一貴族に過ぎなかったが、婚姻政策(「戦争は他家に任せよ、汝、幸いなるオーストリアよ、結婚せよ」)を通じてブルゴーニュ・スペイン・ボヘミア・ハンガリーなど広大な領域を一代ごとに継承・拡大した名門王家。カール5世の代には「日の沈まぬ帝国」と呼ばれる最大版図を築いたが、その広大さゆえに一族内でスペイン系とオーストリア系に分裂し、以後別々の道を歩んだ。オーストリア系は神聖ローマ皇帝位をほぼ世襲的に保持し続け、帝国解体後もオーストリア(=ハンガリー)帝国の帝室として近世ヨーロッパの国際政治に長きにわたり影響力を持ち続けたが、第一次世界大戦の敗北とともに1918年に退位、多民族帝国とともに歴史的役割を終えた。' },
  { id:'luther', name:'マルティン・ルター', category:'person', parentId:'hre', lat:51.87, lng:12.65, start:1483, end:1546, region:'神聖ローマ帝国(ドイツ)',
    desc:'「人は善行によってではなく信仰のみによって義とされる」との確信(信仰義認説)から、贖宥状(免罪符)販売を批判する「九十五カ条の論題」(1517年)をヴィッテンベルク城教会の扉に掲示し、宗教改革の口火を切った神学者。教皇からの破門とヴォルムス帝国議会での主張撤回要求を拒否したが、庇護者ザクセン選帝侯フリードリヒによってヴァルトブルク城に匿われ、その滞在中に新約聖書のドイツ語訳を完成させて、聖書に基づく個人の信仰(聖書主義・万人司祭主義)を説く運動をドイツ全土に広めた。ドイツ農民戦争に際しては当初農民に同情的であったが、急進化した反乱には強く反対して諸侯の鎮圧を支持するなど、社会秩序の維持を重んじる保守的な一面も示した。' },
  { id:'reformation', name:'宗教改革', category:'event', lat:51.87, lng:12.65, start:1517, end:1555, region:'ドイツを中心に西欧全域',
    desc:'教会の権威よりも聖書に基づく個人の信仰(聖書主義)を重視し、ローマ=カトリック教会の贖宥状販売や聖職者の腐敗を批判した宗教改革運動。ルターの「九十五カ条の論題」(1517年)に端を発し、聖書のドイツ語訳による民衆への直接的な信仰の普及や、印刷術の発達による思想の急速な拡散を通じてドイツ全土、さらにはスイス(ツヴィングリ、カルヴァン)や北欧へと広がった。ドイツ農民戦争やシュマルカルデン戦争など政治・社会的な対立とも複雑に絡み合いながら展開し、1555年のアウクスブルクの和議で諸侯の信仰選択権(ただしルター派に限定)が認められて帝国内での宗教的な現実共存が図られたが、カルヴァン派を排除したこの妥協は不完全なものにとどまり、後の三十年戦争の火種を残した。' },

  // ===================== 主権国家体制の形成(近世) =====================
  { id:'thirty_years_war', name:'三十年戦争', category:'war', lat:50.08, lng:14.44, start:1618, end:1648, region:'神聖ローマ帝国(ドイツ)',
    desc:'ボヘミアでのプロテスタント貴族の反乱(プラハ窓外投擲事件)に端を発し、当初はドイツ国内の新旧両派の宗教対立という性格であったが、デンマーク・スウェーデン・フランスなど周辺列強が次々に介入したことで、実質的には反ハプスブルク(神聖ローマ皇帝)の国際的な覇権争いへと変質していった、ヨーロッパ史上最も破壊的な戦争の一つ。特にカトリック国フランスが、宗教的立場を超えて新教国スウェーデンを財政支援しつつ最終的に自ら参戦した事実は、宗教よりも国家理性(レゾン=デタ)を優先する近代的な国際政治の論理の台頭を象徴した。ドイツは長期の戦乱・略奪・疫病により人口の3分の1近くを失うとも言われる壊滅的な荒廃を被り、戦後のウェストファリア条約は主権国家を単位とする近代国際秩序の出発点とされる。' },
  { id:'peace_westphalia', name:'ウェストファリア条約', category:'treaty', lat:51.96, lng:7.63, start:1648, end:1648, region:'神聖ローマ帝国',
    desc:'三十年戦争を終結させた講和条約(ミュンスターとオスナブリュックで個別に締結)。神聖ローマ帝国内の約300の諸侯にほぼ完全な主権(外交権・条約締結権を含む)が公式に認められて帝国の分権的性格が国際的にも決定的なものとなり、あわせてカルヴァン派もルター派と同様に公認宗派として認められて宗教的不寛容の一因が緩和された。オランダ(ネーデルラント連邦共和国)とスイスの独立も国際的に正式承認され、この条約により確立された「各国の対等な主権と内政不干渉」を原則とする国際秩序は「ウェストファリア体制」と呼ばれ、現代に至る主権国家体制(国際法上の主権平等原則)の出発点として位置づけられる。' },
  { id:'louis14', name:'ルイ14世', category:'person', parentId:'france_kingdom', lat:48.80, lng:2.12, start:1638, end:1715, region:'フランス',
    desc:'「太陽王」と呼ばれたフランス絶対王政の代表的君主。宰相マザランの死後は宰相職を置かず親政を敷き、コルベールを起用した重商主義政策(コルベルティズム)で国内産業の育成と財政基盤の強化を図る一方、ヴェルサイユ宮殿を築いて諸侯・貴族をそこに集住させることで彼らを宮廷儀礼に縛り付け、政治的自立性を奪う手法(宮廷貴族化)で王権への従属を徹底した。「朕は国家なり」の言葉に象徴される王権神授説に基づく専制を敷いたが、対外的にはファルツ戦争・スペイン継承戦争など長期の対外戦争を繰り返して財政を圧迫し、ナントの王令廃止によるユグノーの国外流出も国力低下を招くなど、晩年の治世はむしろ大国フランスの限界を露呈するものともなった。' },
  { id:'english_civil_war', name:'イギリス内戦(清教徒革命)', category:'revolution', lat:52.39, lng:-1.00, start:1642, end:1651, region:'イングランド',
    desc:'課税や宗教政策(国教会の儀礼強化)をめぐる国王チャールズ1世と議会との対立から勃発した内戦。清教徒(ピューリタン)を中心とする議会派が、クロムウェルの組織した規律ある新型軍(ニューモデル軍)を軸に国王派(騎士党)を破り、国王を捕らえて裁判にかけて処刑するという、ヨーロッパで前例のない国王処刑を断行した。これにより一時的に共和政(コモンウェルス)が樹立されたが、この急進的な体制転換はクロムウェルの護国卿政治を経て最終的に破綻し、王政復古へと至った。' },
  { id:'glorious_revolution', name:'名誉革命', category:'revolution', lat:51.51, lng:-0.13, start:1688, end:1689, region:'イングランド',
    desc:'カトリック復興を図り専制的傾向を強めた国王ジェームズ2世に対し、議会の有力者たちがプロテスタントの娘メアリとその夫でオランダ総督のウィリアムに軍事介入を要請した政変。ジェームズ2世がほとんど抵抗せず大陸へ逃亡したため流血をほぼ伴わずに体制転換が実現し(「無血革命」)、新王ウィリアム3世・メアリ2世が受諾した「権利の宣言」が「権利章典(1689年)」として法制化され、国王の権限を法により明確に制限し議会の同意なき課税・常備軍維持を禁じるなど、議会主権に基づく立憲君主政の基礎が確立した。この体制転換の理論的正当化はジョン=ロックの社会契約説・抵抗権論によって与えられ、後のフランス啓蒙思想やアメリカ独立にも大きな影響を与えた。' },
  { id:'peter_great', name:'ピョートル1世(大帝)', category:'person', parentId:'russian_empire', lat:59.93, lng:30.36, start:1672, end:1725, region:'ロシア',
    desc:'西欧諸国を自ら視察(大使節団)して技術・制度を学び、帰国後にロシアの西欧化改革を強力に推し進めた皇帝(ツァーリ)。西欧式軍隊・官僚制・暦法の導入、教会統制の強化(聖務会院の設置)など上からの近代化を徹底する一方、大北方戦争でスウェーデンを破ってバルト海への出口を確保し、新首都サンクトペテルブルクを建設して「西欧への窓」とした。その専制的で急進的な改革はロシアを軍事・外交上の大国に押し上げたが、農奴制を温存したままの近代化という矛盾は、後々までロシア社会の根本的課題として残ることになった。' },
  { id:'russian_empire', name:'ロシア帝国', category:'nation', lat:59.93, lng:30.36, start:1721, end:1917, region:'ロシア',
    desc:'ピョートル1世が「インペラートル(皇帝)」を称して以降のロシア。西欧化改革と大北方戦争によるバルト海進出を出発点に、エカチェリーナ2世期のポーランド分割・南下政策を経て東欧・中央アジア・シベリアにまたがる広大な版図を築いた専制国家。19世紀半ば以降は近代化の遅れ(産業革命の立ち遅れ、農奴制の残存)が対外的な劣勢(クリミア戦争敗北)や国内の社会矛盾激化を招き、農奴解放令や大改革を経てもなお専制の根本的変革には至らず、第一次世界大戦の重圧の中で1917年のロシア革命により崩壊した。' },
  { id:'enlightenment', name:'啓蒙思想', category:'event', lat:48.86, lng:2.35, start:1685, end:1789, region:'フランス・イギリスを中心に西欧全域',
    desc:'理性による社会・政治の合理的な理解を重視した思想潮流。ロック・モンテスキュー・ルソーらの思想は、フランス革命など後の市民革命に大きな影響を与えた。' },

  // ===================== フランス革命〜ナポレオン、ウィーン体制 =====================
  { id:'french_revolution', name:'フランス革命', category:'revolution', lat:48.86, lng:2.35, start:1789, end:1799, region:'フランス',
    desc:'財政危機打開のための三部会招集(1789年5月)を発端に、第三身分(平民)が国民議会を結成して憲法制定を宣言したことから始まった、絶対王政とアンシャン=レジーム(身分制的旧体制)を打倒する市民革命。バスティーユ牢獄襲撃(7月14日)、封建的特権の廃止宣言、人権宣言の採択(1789年8月)を経て立憲君主政が試みられたが、国王一家の国外逃亡未遂(ヴァレンヌ逃亡事件)や対外戦争の激化を機に革命は急進化し、1792年王政廃止・共和政宣言、翌1793年国王処刑へと至った。ジャコバン派による恐怖政治とその崩壊(テルミドールのクーデタ)を経て、最終的に1799年のブリュメール18日のクーデタでナポレオンが実権を握り、革命は事実上終結した。「自由・平等・友愛」の理念と、国民主権・法の下の平等といった原則は、以後のヨーロッパおよび世界各地の政治変革に決定的な影響を与えた。' },
  { id:'robespierre', name:'ロベスピエール', category:'person', parentId:'french_revolution', lat:48.86, lng:2.35, start:1758, end:1794, region:'フランス',
    desc:'「腐敗しない男」と称された弁護士出身の政治家。国民公会でジャコバン派(山岳派)の指導的立場に立ち、対外戦争と内乱(ヴァンデーの反乱など)の危機を理由に公安委員会を通じた非常体制を敷いて、反革命容疑者を次々にギロチンで処刑する恐怖政治を主導した。「徳と恐怖」を掲げ理念的な共和国建設を目指したが、粛清の対象が革命派内部(エベール派・ダントン派)にまで及んで求心力を失い、1794年のテルミドールのクーデタで失脚、皮肉にも自らが確立した略式処刑の手続きにより裁判を経ずして処刑された。' },
  { id:'napoleon', name:'ナポレオン・ボナパルト', category:'person', parentId:'napoleonic_wars', lat:48.86, lng:2.35, start:1769, end:1821, region:'フランス',
    desc:'フランス革命の混乱の中、対イタリア遠征などでの軍功により台頭し、ブリュメール18日のクーデタで実権を握った軍人・皇帝。国内では中央集権的な行政制度(県知事制度)を整備し、革命の成果を法制化した『ナポレオン法典(民法典)』を制定して法の下の平等・私有財産の不可侵などの原則を確立、フランス銀行の設立や公教育制度(リセ)の整備も進めた。対外的にはアウステルリッツの戦い(三帝会戦)などでヨーロッパの大半を征服・従属させて自らの親族を各地の王位に就け、大陸封鎖令によるイギリス経済封鎖を試みたが、スペイン反乱(半島戦争)の泥沼化とロシア遠征(1812年)の壊滅的失敗を機に急速に没落、最終的にワーテルローの敗北で流刑地セントヘレナに送られ同地で没した。' },
  { id:'napoleonic_wars', name:'ナポレオン戦争', category:'war', lat:48.86, lng:2.35, start:1803, end:1815, region:'ヨーロッパ全域',
    desc:'フランス革命戦争を継承し、ナポレオン率いるフランスと、これに対抗する対仏大同盟諸国(イギリス・オーストリア・ロシア・プロイセンなど)との間で繰り返された一連の戦争。アウステルリッツの戦い(三帝会戦、1805年)などでナポレオンは陸戦において連戦連勝を重ね大陸のほぼ全域を勢力下に置いたが、トラファルガーの海戦(1805年)でイギリス海軍に敗れて制海権を握れなかったことが大陸封鎖令という不完全な対英経済戦の限界を露呈させた。スペインでのゲリラ的抵抗(半島戦争)とロシア遠征(1812年)の大敗で軍事的優位が崩れると、諸国民戦争(ライプツィヒの戦い、1813年)での敗北を経て1814年ナポレオンは退位、翌年の百日天下も最終的にワーテルローの戦いでの敗北に終わり、ウィーン体制と呼ばれる新たな国際秩序の成立につながった。' },
  { id:'congress_vienna', name:'ウィーン会議', category:'treaty', lat:48.21, lng:16.37, start:1814, end:1815, region:'オーストリア(ウィーン)',
    desc:'ナポレオン戦争後のヨーロッパ秩序を再編するために開かれた国際会議。正統主義と勢力均衡を原則とし、以後のウィーン体制の枠組みを形づくった。' },
  { id:'industrial_revolution', name:'産業革命', category:'event', lat:53.48, lng:-2.24, start:1760, end:1840, region:'イギリスを起点に西欧全域',
    desc:'蒸気機関の実用化などを背景に、手工業から機械制工業への生産様式の転換が進んだ変革。イギリスに始まり、都市化や資本主義経済の発展を世界的に加速させた。' },

  // ===================== 国民国家の形成(19世紀後半) =====================
  { id:'unification_italy', name:'イタリア統一', category:'event', lat:41.90, lng:12.49, start:1861, end:1871, region:'イタリア',
    desc:'サルデーニャ王国を中心に、カヴール・ガリバルディらの活動を経て分立していたイタリア諸邦が統一された過程。1861年にイタリア王国が成立し、1871年にはローマも併合された。' },
  { id:'unification_germany', name:'ドイツ統一(ドイツ帝国成立)', category:'event', lat:52.52, lng:13.40, start:1871, end:1871, region:'ドイツ',
    desc:'プロイセンを中心に、デンマーク戦争・普墺戦争・普仏戦争という一連の戦争を通じてドイツ諸邦の統一が達成された出来事。宰相ビスマルクは「小ドイツ主義」(オーストリアを排除しプロイセンを中心とする統一)を貫き、普仏戦争の勝利により南ドイツ諸邦(バイエルンなど)も北ドイツ連邦への参加を決断、1871年1月、敗れたフランスの首都近郊ヴェルサイユ宮殿の「鏡の間」という屈辱的な場所で、プロイセン王ヴィルヘルム1世がドイツ皇帝に即位する統一の儀式が行われた。この「上から」の武力による急速な統一は、後発国ドイツが議会制民主主義よりも権威主義的な国家体制(プロイセン的な軍国主義・官僚制の色濃い連邦国家)を色濃く残したまま近代国家として出発する結果を招いたと評価される。' },
  { id:'bismarck', name:'オットー・フォン・ビスマルク', category:'person', parentId:'german_empire', lat:52.52, lng:13.40, start:1815, end:1898, region:'プロイセン・ドイツ帝国',
    desc:'「鉄血演説」(1862年、「現下の大問題は演説や多数決によってではなく、鉄と血によってのみ解決される」)で知られる、議会の反対を押し切って軍拡を断行したプロイセン首相。デンマーク戦争・普墺戦争・普仏戦争という3つの戦争を巧みな外交(相手を孤立させ他国の介入を防ぐ)によって計画的に遂行し、「小ドイツ主義」(オーストリアを排除しプロイセン中心)によるドイツ統一を実現した。統一後は複雑な同盟網(三帝同盟、独墺伊三国同盟、再保障条約など)を張り巡らせてフランスの孤立化とヨーロッパの現状維持(勢力均衡)を図る一方、国内ではカトリック教会を統制する文化闘争(クルトゥルカンプ)や社会主義者鎮圧法による労働運動抑圧を進めたが、世界政策を志向するヴィルヘルム2世との対立から1890年に辞任に追い込まれた。' },

  // ===================== 二つの世界大戦 =====================
  { id:'wwi', name:'第一次世界大戦', category:'war', lat:43.86, lng:18.41, start:1914, end:1918, region:'ヨーロッパ全域(サライェヴォに端を発する)',
    desc:'サライェヴォ事件を契機に、同盟国側と協商国側に分かれて戦われた総力戦。塹壕戦による長期の消耗戦となり、多数の死傷者を出したのち同盟国側の敗北で終結した。' },
  { id:'russian_revolution', name:'ロシア革命', category:'revolution', lat:59.93, lng:30.36, start:1917, end:1917, region:'ロシア',
    desc:'第一次世界大戦下の物資不足・厭戦気分の高まりを背景に勃発した二月革命により、帝政ロシアは崩壊して臨時政府とソヴィエト(労働者・兵士評議会)が並存する二重権力状態に陥った。戦争継続を掲げる臨時政府への不満が高まる中、レーニン率いるボリシェヴィキが「すべての権力をソヴィエトへ」と訴えて十月革命を成功させ、世界初の社会主義国家樹立への道を開いた。この革命は「自由・平等」を掲げたフランス革命とは異なり、資本主義を打倒し労働者・農民が主権を握る共産主義社会の実現を掲げた点で、20世紀の世界史に決定的な影響を及ぼした。' },
  { id:'lenin', name:'ウラジーミル・レーニン', category:'person', parentId:'ussr', lat:55.75, lng:37.62, start:1870, end:1924, region:'ロシア・ソビエト連邦',
    desc:'マルクス主義を独自に発展させ、労働者階級を指導する少数精鋭の職業革命家集団(前衛党)による革命を主張したボリシェヴィキの指導者。亡命先から帰国し「四月テーゼ」で即時のソヴィエト権力樹立を訴え、臨時政府の混乱に乗じた十月革命で権力を掌握した。内戦(戦時共産主義)を勝ち抜いて1922年にソビエト連邦を樹立する一方、経済の疲弊を受けて一時的に市場経済的要素を導入する新経済政策(ネップ)にも転じるなど、理念と現実の間で柔軟に路線転換を図った。' },
  { id:'treaty_versailles', name:'ヴェルサイユ条約', category:'treaty', lat:48.80, lng:2.12, start:1919, end:1919, region:'フランス',
    desc:'第一次世界大戦の講和条約。敗戦国ドイツに巨額の賠償金と領土割譲、軍備制限を課し、国際連盟の設立も定めたが、後のドイツの不満と第二次世界大戦の一因ともなった。' },
  { id:'ussr', name:'ソビエト社会主義共和国連邦(ソ連)', category:'nation', lat:55.75, lng:37.62, start:1922, end:1991, region:'ロシア・東欧・中央アジア',
    desc:'ロシア革命後の内戦を経て1922年に成立した、世界初の社会主義を掲げる連邦国家。共産党一党独裁体制のもと、スターリンの指導下で農業集団化と五カ年計画による強制的な工業化を進めて短期間で軍事大国化に成功し、第二次世界大戦の勝利国として米国と並ぶ超大国の地位を築いた(冷戦)。しかし中央統制的な計画経済の非効率と、東欧諸国への支配・軍拡競争による国力の消耗が長期的な停滞を招き、ゴルバチョフのペレストロイカ改革が引き起こした求心力低下の中、1991年に解体した。' },
  { id:'wwii', name:'第二次世界大戦', category:'war', lat:52.23, lng:21.01, start:1939, end:1945, region:'ヨーロッパ・世界各地(ポーランド侵攻に始まる)',
    desc:'ドイツのポーランド侵攻を機に始まった史上最大規模の戦争。枢軸国と連合国に分かれて戦われ、ホロコーストなど深刻な人道的惨禍を伴いながら、1945年に連合国側の勝利で終結した。' },
  { id:'hitler', name:'アドルフ・ヒトラー', category:'person', parentId:'nazi_germany', lat:52.52, lng:13.40, start:1889, end:1945, region:'ドイツ',
    desc:'第一次世界大戦への従軍経験と敗戦・ヴェルサイユ条約への強い不満を背景に、反ユダヤ主義と反共産主義、ドイツ民族の優越性を説く人種主義的なイデオロギーを掲げてナチ党の指導者となった人物。世界恐慌下の大量失業とヴァイマル共和政への不信を背景に選挙で躍進し、1933年に首相に任命されると、国会議事堂放火事件を口実に全権委任法を成立させて議会制民主主義を事実上停止、独裁体制(総統原理)を確立した。ミュンヘン会談での宥和政策を利用してズデーテン地方併合・オーストリア併合を進めた後、ポーランド侵攻(1939年)で第二次世界大戦を引き起こし、占領地でユダヤ人を組織的に絶滅させるホロコーストを主導したが、最終的にソ連軍のベルリン包囲下で自殺した。' },
  { id:'nazi_germany', name:'ナチス・ドイツ(第三帝国)', category:'nation', lat:52.52, lng:13.40, start:1933, end:1945, region:'ドイツ',
    desc:'世界恐慌下の経済的混乱と、ヴァイマル共和政の政治的機能不全に乗じて合法的な手続きを通じて政権を獲得したヒトラー率いるナチ党による一党独裁体制。全権委任法により議会制民主主義を事実上停止させ、公共事業(アウトバーン建設など)や再軍備による失業対策で国民の支持を集める一方、ユダヤ人をはじめとする「劣等民族」への迫害を組織的に推進した。「生存圏(レーベンスラウム)」獲得を掲げた侵略的な対外拡張(オーストリア併合、ズデーテン地方併合、ポーランド侵攻)は第二次世界大戦を引き起こし、その過程でホロコーストという未曾有の大量虐殺を実行したが、1945年の全面降伏により崩壊、指導者は戦後の国際軍事裁判(ニュルンベルク裁判)で裁かれた。' },
  { id:'churchill', name:'ウィンストン・チャーチル', category:'person', parentId:'uk_britain', lat:51.51, lng:-0.13, start:1874, end:1965, region:'イギリス',
    desc:'第二次世界大戦中、ドイツの電撃的な勝利が続く中でチェンバレンに代わって首相に就任し、「血と労苦と涙と汗」の演説で徹底抗戦を国民に呼びかけてイギリス本土航空戦を戦い抜いた政治家。アメリカ・ソ連との連合(米英ソ首脳会談)を主導して対独戦を勝利に導いたが、戦後まもない総選挙では国内改革(福祉国家建設)を掲げる労働党に敗れて一時下野した。戦後は「鉄のカーテン」演説(1946年)でソ連圏と西側の分断を象徴的に表現し、冷戦の始まりを世界に印象づけた。' },

  // ===================== 戦後・冷戦・現代ヨーロッパ =====================
  { id:'cold_war', name:'冷戦', category:'event', lat:52.52, lng:13.40, start:1947, end:1991, region:'ヨーロッパを中心に世界全域',
    desc:'アメリカを中心とする資本主義陣営とソ連を中心とする社会主義陣営との間の対立構造。ドイツは東西に分断され、直接の軍事衝突は避けられたものの緊張が長く続いた。' },
  { id:'berlin_wall_fall', name:'ベルリンの壁崩壊', category:'event', lat:52.52, lng:13.40, start:1989, end:1989, region:'ドイツ(ベルリン)',
    desc:'東西冷戦の象徴であったベルリンの壁が市民の手で取り壊された出来事。東欧諸国の民主化(東欧革命)を象徴し、翌年のドイツ再統一へとつながった。' },
  { id:'ussr_dissolution', name:'ソ連崩壊', category:'event', lat:55.75, lng:37.62, start:1991, end:1991, region:'ソビエト連邦',
    desc:'ゴルバチョフの改革(ペレストロイカ)を経て、1991年にソビエト連邦が解体し、ロシア連邦をはじめとする独立国家群が誕生した。冷戦の終結を決定づけた。' },
  { id:'maastricht_treaty', name:'マーストリヒト条約(EU発足)', category:'treaty', lat:50.85, lng:5.69, start:1992, end:1992, region:'オランダ(マーストリヒト)',
    desc:'欧州共同体(EC)加盟国が調印した条約で、翌1993年に発効し欧州連合(EU)が発足した。共通通貨(後のユーロ)導入への道を開くなど、欧州統合を大きく前進させた。' },

  /* =====================================================================
     ① 古代(エーゲ海・ギリシャ・ローマ)追加データ
     ===================================================================== */

  // ---- 青銅器時代の終焉 ----
  { id:'sea_peoples', name:'「海の民」の活動と青銅器時代の崩壊', category:'event', lat:35.60, lng:35.78, start:-1200, end:-1150, region:'地中海東岸(ウガリットほか)',
    desc:'出自不明の複数の集団「海の民」が東地中海各地を襲撃し、ヒッタイト帝国の崩壊やミケーネ文明の衰退、エジプト新王国の弱体化を招いたとされる。この時期を境に青銅器時代の国際秩序が大きく変容した。' },
  { id:'homer', name:'ホメロス', category:'person', lat:38.42, lng:27.14, start:-800, end:-750, region:'イオニア地方(推定)',
    desc:'叙事詩『イリアス』(トロイア戦争末期を描く)と『オデュッセイア』(英雄オデュッセウスの帰還譚)の作者とされる伝説的な詩人。実在や生没年、単独の作者か複数の吟遊詩人による口承詩の集成かについては古来議論があり(「ホメロス問題」)確定していないが、両叙事詩はポリス成立以前の英雄時代の記憶を伝えるとともに、ギリシャ人共通の文化的・道徳的規範として教育の基礎教材となり、後のギリシャ人のアイデンティティ形成に決定的な役割を果たした。' },

  // ---- 古典期ギリシャ ----
  { id:'themistocles', name:'テミストクレス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-524, end:-459, region:'アテネ',
    desc:'ペルシアの再侵攻を予見し、ラウレイオン銀山の収益を軍艦建造に充てるよう主張して、アテネを地中海有数の海軍国家に育てた政治家・将軍。サラミス沖の狭い海峡にペルシア艦隊をおびき寄せる策略でこれを撃破し(サラミスの海戦)、ペルシア戦争の帰趨を決定づけた。しかし強大化した権力への警戒から陶片追放(オストラシズム)にかけられて国外追放となり、最終的にはかつての敵国ペルシアの宮廷に身を寄せて生涯を終えるという皮肉な結末をたどった。' },
  { id:'leonidas', name:'レオニダス1世', category:'person', parentId:'sparta', lat:38.80, lng:22.54, start:-540, end:-480, region:'スパルタ',
    desc:'第二次ペルシア戦争でギリシャ連合軍の一部を率い、テルモピュライの隘路でペルシア大軍を迎え撃ったスパルタ王。寡兵ながら地の利を活かして数日にわたり進撃を阻んだが、裏切りにより退路(迂回路)を突かれると、主力部隊を撤退させたうえで自らは300人のスパルタ兵らとともに最後まで戦って全滅した。この犠牲的な抵抗はペルシア軍の進撃を遅らせてサラミスの海戦の準備期間を稼いだとされ、以後ギリシャ人の自由と勇気の象徴として長く語り継がれた。' },
  { id:'battle_marathon', name:'マラトンの戦い', category:'war', lat:38.15, lng:23.97, start:-490, end:-490, region:'アッティカ(マラトン)',
    desc:'アテネへ侵攻したペルシア軍を、将軍ミルティアデスの指揮するアテネ軍(スパルタの援軍を得られなかった)が数的劣勢にもかかわらず両翼包囲戦術によって撃退した会戦。この勝利によりギリシャ人は「東方の大帝国も打ち破れる」という自信を得て、以後のペルシア戦争を戦い抜く精神的支柱となった。勝利を伝えるためアテネまで走り抜いた伝令の故事が、近代オリンピックのマラソン競技の起源となったことでも知られる。' },
  { id:'battle_thermopylae', name:'テルモピュライの戦い', category:'war', lat:38.80, lng:22.54, start:-480, end:-480, region:'ギリシャ中部',
    desc:'狭い山道でスパルタ王レオニダス率いる少数のギリシャ軍がペルシア大軍を一時的に食い止めた戦い。最終的にギリシャ軍は全滅したが、その抵抗は後の反攻の時間を稼いだ。' },
  { id:'battle_salamis', name:'サラミスの海戦', category:'war', lat:37.97, lng:23.48, start:-480, end:-480, region:'サラミス島沖',
    desc:'第二次ペルシア戦争において、テミストクレスの主導でギリシャ艦隊をサラミス海峡の狭い水域に配置し、数に勝るペルシア艦隊を誘い込んで大打撃を与えた海戦。狭い海域では大型のペルシア艦船が機動力を発揮できず混乱に陥り、ギリシャ側の軽快な三段櫂船が各個撃破に成功した。この勝利によりペルシア王クセルクセス1世は自ら軍を率いて撤退し、翌年のプラタイアの戦いでの陸上勝利と合わせてペルシア戦争の帰趨を決定づける転換点となった。' },
  { id:'socrates', name:'ソクラテス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-469, end:-399, region:'アテネ',
    desc:'「無知の知」を自覚させる問答法(産婆術)によって、絶対的な真理や普遍的な徳の追求を人々に促した哲学者。自然現象の探求が中心であったそれ以前の自然哲学に対し、「人間はいかに生きるべきか」という倫理的問題へと哲学の関心を転換させ、西洋哲学の出発点を築いたと評される。著作は残さず、弟子プラトンの対話篇を通じてその思想が伝えられる。ペロポネソス戦争後の混乱期に、国家の神々を認めず青年を堕落させたとして告発され、死刑判決を受けると、逃亡を勧める弟子たちの説得を退けて自ら毒杯をあおぎ、法への服従を貫いて生涯を終えた。' },
  { id:'plato', name:'プラトン', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-427, end:-347, region:'アテネ',
    desc:'ソクラテスの刑死に衝撃を受け、感覚では捉えられない永遠不変の真の実在(イデア)こそが本質であるとするイデア論を体系化した哲学者。アテネ郊外に学園アカデメイア(のち約900年間存続)を開設して多くの弟子を育てた。主著『国家』では、統治者が知恵(イデアの認識)を備えた哲学者であるべきだとする「哲人政治」の理想を説き、衆愚政治に陥りがちな現実の民主政治への批判的視座を示した。' },
  { id:'aristotle', name:'アリストテレス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-384, end:-322, region:'アテネ/マケドニア',
    desc:'プラトンのイデア論を批判し、個物に内在する形相を重視する現実主義的な立場から、論理学・自然学・倫理学・政治学・詩学など、ほぼ全学問分野にわたる体系化を進めた「万学の祖」。マケドニア王フィリッポス2世に招かれ、若きアレクサンドロスの家庭教師を務めたことでも知られる。主著『政治学』では現実に存在する158のポリスの国制を実証的に比較分析し、中間層(中産市民)の厚みが政治的安定をもたらすと論じるなど、経験的観察に基づく学問方法はその後の西洋学問の規範となった。' },
  { id:'philip_ii_macedon', name:'フィリッポス2世', category:'person', parentId:'macedonia', lat:40.77, lng:22.52, start:-382, end:-336, region:'マケドニア',
    desc:'人質としてテーベに送られていた青年期にエパミノンダスらの軍制を学び、帰国後にサリッサ(長槍)を用いた密集戦術ファランクスを改良して強力な常備軍を編成した王。ギリシャ諸ポリスの内紛(神聖戦争など)に介入して勢力を拡大し、これを警戒したデモステネスらの呼びかけでアテネ・テーベが結成した連合軍をカイロネイアの戦い(前338年)で撃破、ギリシャ諸ポリスにコリントス同盟(ヘラス同盟)を結成させて事実上の盟主となった。対ペルシア遠征を計画していたが暗殺によって志半ばで倒れ、事業は子アレクサンドロス大王に引き継がれた。' },
  { id:'battle_chaeronea', name:'カイロネイアの戦い', category:'war', lat:38.49, lng:22.84, start:-338, end:-338, region:'ギリシャ中部(カイロネイア)',
    desc:'マケドニア軍がアテネ・テーベ連合軍を破った戦い。この敗北によりギリシャの主要ポリスは事実上マケドニアの支配下に入り、ポリスの政治的自立の時代が終わりを迎えた。' },

  // ---- ヘレニズム世界 ----
  { id:'diadochi_wars', name:'ディアドコイ戦争(後継者戦争)', category:'war', lat:32.54, lng:44.42, start:-322, end:-301, region:'旧アレクサンドロス帝国領内',
    desc:'アレクサンドロス大王の急死後、後継の地位や領土をめぐって部下の将軍(ディアドコイ)たちが繰り広げた一連の戦争。この結果、大帝国はプトレマイオス朝・セレウコス朝・アンティゴノス朝などに分裂した。' },
  { id:'ptolemaic_egypt', name:'プトレマイオス朝エジプト', category:'nation', lat:31.20, lng:29.92, start:-305, end:-30, region:'エジプト(アレクサンドリア)',
    desc:'アレクサンドロスの部将プトレマイオスが開いたヘレニズム王朝。首都アレクサンドリアはギリシャ文化と東方文化が融合する学術・文化の中心地として栄えたが、クレオパトラ7世の死とともにローマに併合された。' },
  { id:'seleucid_empire', name:'セレウコス朝シリア', category:'nation', lat:36.20, lng:36.16, start:-312, end:-63, region:'シリア・メソポタミア',
    desc:'アレクサンドロスの部将セレウコスが開いたヘレニズム王朝で、旧帝国の中で最大の版図を誇った。次第に領土を失い縮小し、最終的にローマの将軍ポンペイウスによってシリア属州とされた。' },
  { id:'antigonid_macedon', name:'アンティゴノス朝マケドニア', category:'nation', lat:40.77, lng:22.52, start:-306, end:-168, region:'マケドニア',
    desc:'アレクサンドロスの部将アンティゴノスの家系が治めたマケドニア本国の王朝。ローマとの戦争(マケドニア戦争)に敗れ、ピュドナの戦い(前168年)後にローマの支配下に組み込まれた。' },

  // ---- ローマ共和政の変質 ----
  { id:'twelve_tables', name:'十二表法', category:'event', lat:41.90, lng:12.49, start:-451, end:-450, region:'ローマ',
    desc:'護民官の要求を受け、それまで神官(貴族)が独占的に解釈・運用していた慣習法を、10人委員会(のち12人)が成文化してフォルム(広場)に公示した、ローマ最古の成文法。私法(財産・家族関係)から刑事罰まで広く規定し、法が明文化・公開されたことで貴族による恣意的な法解釈に一定の歯止めがかかった。以後のローマ法発展の出発点となり、後の万民法・自然法思想を経て近代ヨーロッパ大陸法の源流ともなった。' },
  { id:'gracchi_reform', name:'グラックス兄弟の改革', category:'event', lat:41.90, lng:12.49, start:-133, end:-121, region:'ローマ',
    desc:'ポエニ戦争後の対外拡大に伴う長期従軍や属州からの安価な穀物流入により没落した中小自作農を再建するため、護民官に就いた兄ティベリウスと弟ガイウスのグラックス兄弟が、大土地所有(ラティフンディア)を制限し公有地を農民に再分配しようとした改革。中小農民層はローマ軍団兵力の基盤でもあったため、その没落は軍事力の弱体化にも直結する深刻な問題であったが、既得権益を守ろうとする元老院派の激しい反発を受け、兄弟はいずれも非業の死を遂げた。この改革の挫折と、それに伴う政治的暴力の常態化は、以後1世紀続く「内乱の1世紀」の幕開けと位置づけられる。' },
  { id:'marius', name:'マリウス', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-157, end:-86, region:'ローマ',
    desc:'属州総督としてユグルタ戦争などで軍功を挙げ、無産市民を志願兵として編成し国家が装備を支給する軍制改革(マリウスの軍制改革)を断行した将軍・政治家。これにより軍隊の性格は市民の兵役義務に基づく市民軍から、将軍個人に忠誠を誓う職業軍人(私兵化)へと大きく変質し、将軍が自らの軍事力を背景に政治権力を握る道を開いた。政敵スラとの権力争い(内乱)は、この軍の私兵化がもたらした最初の深刻な帰結であり、以後のカエサルらによる軍事独裁の先例となった。' },
  { id:'sulla', name:'スラ', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-138, end:-78, region:'ローマ',
    desc:'マリウス派との内乱に勝利すると、軍を率いて武力でローマに進軍し(史上初のローマ市への軍事侵攻)、独裁官(ディクタトル、本来は半年任期の非常大権)に就任した将軍・政治家。政敵の名を公示して財産没収・殺害を合法化する粛清(プロスクリプティオ)を断行して数千人を粛清した一方、元老院の権威と伝統的な共和政秩序の回復を図る一連の改革(護民官権限の縮小など)を行い、改革の完了後は自ら独裁官の地位を退いて隠棲した。しかし軍事力を背景とした権力掌握という前例は、後のカエサルらに引き継がれることになった。' },
  { id:'first_triumvirate', name:'第一回三頭政治', category:'event', lat:41.90, lng:12.49, start:-60, end:-53, region:'ローマ',
    desc:'執政官選出などをめぐり元老院と対立していたカエサル・ポンペイウス・大富豪クラッススの3人が、互いの利害の一致から結んだ非公式の政治同盟。公職に基づかない私的な合意でありながら国政を左右する実権を握り、共和政の制度的枠組みが有力者間の私的な取引によって空洞化していく様相を示した。クラッススがパルティアとの戦いで戦死すると同盟の均衡が崩れ、残るカエサルとポンペイウスの対立が先鋭化して内乱(カエサルの内戦)に至った。' },
  { id:'pompey', name:'ポンペイウス', category:'person', parentId:'rome_republic', lat:41.90, lng:12.49, start:-106, end:-48, region:'ローマ',
    desc:'若くして軍功を挙げ「大王(マグヌス)」の異名をとった将軍・政治家。海賊掃討やミトリダテス戦争での勝利により東方に広大な属州を確保し絶大な名声を得て、第一回三頭政治の一角を占めた。しかし元老院派に接近してカエサルとの対立を深め、内戦(カエサルの内戦)ではファルサロスの戦いで大敗、逃亡先のエジプトでプトレマイオス朝の廷臣に暗殺されるという劇的な最期を遂げた。' },
  { id:'rubicon_crossing', name:'ルビコン川渡河', category:'event', lat:44.06, lng:12.57, start:-49, end:-49, region:'イタリア(ルビコン川)',
    desc:'軍団解散と単独での帰還を命じる元老院の決定を、事実上の政治的抹殺と判断したカエサルが、属州総督としての権限の及ぶ北イタリアと本国の境界をなすルビコン川を、「賽は投げられた」と述べて軍を率いて越えた出来事。属州総督が軍を率いて本国に侵入することは重大な反逆行為であり、この一線を越えたことでカエサルとポンペイウス派との内戦は不可避となった。「ルビコンを渡る」は、以後「後戻りのできない決定的な行動に出る」ことを意味する慣用句として西洋文化に定着した。' },
  { id:'cleopatra', name:'クレオパトラ7世', category:'person', parentId:'ptolemaic_egypt', lat:31.20, lng:29.92, start:-69, end:-30, region:'プトレマイオス朝エジプト',
    desc:'プトレマイオス朝最後の女王。カエサル、次いでアントニウスと結び王国の存続を図ったが、アクティウムの海戦での敗北後、ローマの支配を受け入れず自ら命を絶ったと伝えられる。' },
  { id:'second_triumvirate', name:'第二回三頭政治', category:'event', lat:41.90, lng:12.49, start:-43, end:-33, region:'ローマ',
    desc:'カエサル暗殺後の混乱の中、その養子オクタウィアヌス・カエサルの腹心アントニウス・有力武将レピドゥスの3人が、第一回三頭政治とは異なり法(護民官法)に基づいて正式に結成した政治同盟。三頭政治法により5年間の非常大権を得て、暗殺の首謀者ブルートゥス・カッシウスらを掃討するとともに、キケロを含む政敵を計画的に粛清した。共通の敵を打倒した後は実権をめぐるオクタウィアヌスとアントニウスの対立が先鋭化し、レピドゥスが失脚した後、最終的にアクティウムの海戦での対決に至った。' },
  { id:'battle_actium', name:'アクティウムの海戦', category:'war', lat:38.95, lng:20.75, start:-31, end:-31, region:'ギリシャ(アクティウム沖)',
    desc:'オクタウィアヌスの艦隊が、アントニウスとクレオパトラの連合艦隊を破った海戦。この勝利によりオクタウィアヌスはローマ唯一の支配者となり、共和政から帝政への移行が決定的となった。' },

  // ---- 帝政ローマ ----
  { id:'pax_romana', name:'パクス・ロマーナ(ローマの平和)', category:'event', lat:41.90, lng:12.49, start:-27, end:180, region:'ローマ帝国全域',
    desc:'アウグストゥスの元首政確立からマルクス=アウレリウスの治世末(いわゆる五賢帝時代の終わり)までの、帝国内部が比較的安定し繁栄を謳歌した約200年間を指す呼称。辺境では属州反乱やゲルマン人との戦争が絶えなかったものの、帝国内では「ローマの平和」のもとで街道網・水道橋などのインフラが整備され、地中海世界規模での交易・都市文化が発展した。この繁栄はしかし征服による経済的余剰の供給が前提となっており、対外拡大が限界に達した2世紀末以降、帝国は財政的・軍事的な行き詰まり(3世紀の危機)に直面していくことになる。' },
  { id:'trajan', name:'トラヤヌス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:53, end:117, region:'ローマ帝国',
    desc:'五賢帝の一人で、属州出身者として初めて皇帝となった人物。ダキア戦争(現ルーマニア方面)やパルティア遠征(メソポタミア方面)を通じてローマ帝国の版図を史上最大にまで広げ、征服地の富を用いて公共建築事業(トラヤヌスのフォルムなど)も盛んに行った。この最大版図はしかし同時に防衛線の過剰な伸長を意味し、次代ハドリアヌス帝による防衛重視への路線転換を招くことになった。' },
  { id:'hadrian', name:'ハドリアヌス帝', category:'person', parentId:'rome_empire', lat:55.00, lng:-2.50, start:76, end:138, region:'ローマ帝国(ブリタンニア)',
    desc:'拡大しすぎた帝国の防衛線を現実的な範囲に整理し、対外拡張から内政充実へと国家戦略を転換した五賢帝の一人。ブリタンニア(現イギリス)北部に「ハドリアヌスの長城」を築いて異民族の侵入に備えるなど、帝国各地の国境防備を固める一方、帝国内を精力的に巡察して属州行政の実情把握と整備にも努めた。この防衛線固定化の方針は、以後のローマ帝国が基本的に守勢に回っていく転換点とも位置づけられる。' },
  { id:'marcus_aurelius', name:'マルクス・アウレリウス帝', category:'person', parentId:'rome_empire', lat:41.90, lng:12.49, start:121, end:180, region:'ローマ帝国',
    desc:'ストア派哲学を修めた「哲人皇帝」として知られ、著書『自省録』(陣中で綴られたとされる)で内省的な思索を残した皇帝。治世後半はゲルマン人(マルコマンニ人など)のドナウ川方面への侵入や、遠征軍が持ち帰ったとされる疫病(天然痘とも)の大流行に悩まされ続けた。ストア的な理性による自己統制を理想としつつ現実には戦争に明け暮れたその治世の終わりは、伝統的に「ローマの平和」の終焉、および以後の帝国衰退の始まりとして位置づけられる。' },
  { id:'crisis_third_century', name:'3世紀の危機', category:'event', lat:41.90, lng:12.49, start:235, end:284, region:'ローマ帝国',
    desc:'マルクス=アウレリウス死後の皇帝暗殺・簒奪の連鎖(軍人皇帝時代)、ゲルマン人・ササン朝ペルシアなど周辺勢力の侵入激化、属州の分離独立(ガリア帝国・パルミラ王国の自立)、インフレーションと貨幣改鋳による経済混乱が同時進行した、約50年間にわたる帝国存亡の危機。一時は帝国が事実上3分裂する事態にまで至ったが、アウレリアヌス帝が帝国を再統一し、続くディオクレティアヌス帝の統治機構・軍制・税制にわたる抜本的改革によって帝国は立て直された。' },
  { id:'edict_of_milan', name:'ミラノ勅令', category:'treaty', lat:45.46, lng:9.19, start:313, end:313, region:'イタリア(ミラノ)',
    desc:'コンスタンティヌス帝と東の皇帝リキニウスが連名で発した勅令。それまで断続的に行われてきたキリスト教徒への迫害政策を転換し、帝国内での信仰の自由とキリスト教会の財産返還を認めた。国家によるキリスト教公認は、以後キリスト教が帝国内で急速に勢力を拡大し、392年のテオドシウス帝による国教化を経て、ヨーロッパ中世世界の精神的基盤を形成していく出発点となった。' },
  { id:'battle_adrianople', name:'アドリアノープルの戦い', category:'war', lat:41.68, lng:26.56, start:378, end:378, region:'トラキア(アドリアノープル)',
    desc:'西ゴート族がローマ軍を破り、皇帝ウァレンスが戦死した戦い。ゲルマン人に対するローマ軍の優位が崩れたことを印象づけた戦いとされる。' },
  { id:'theodosius_i', name:'テオドシウス1世', category:'person', parentId:'rome_empire', lat:45.46, lng:9.19, start:347, end:395, region:'ローマ帝国',
    desc:'帝国を再び一時的に統一した最後の皇帝。392年にアタナシウス派キリスト教を唯一の国教と定めて異教(伝統的多神教)の祭儀を全面的に禁止し、翌年には古代オリンピック競技も異教的祭儀として廃止させるなど、キリスト教国家としての性格を決定的なものにした。死に際して帝国を2人の息子(アルカディウス、ホノリウス)にそれぞれ分割相続させたことが、事実上恒久的な東西分裂の出発点となった。' },
  { id:'division_roman_empire', name:'ローマ帝国の東西分裂', category:'event', lat:41.90, lng:12.49, start:395, end:395, region:'ローマ帝国',
    desc:'テオドシウス1世の死(395年)に際し、帝国が長男アルカディウスの東方(コンスタンティノープル中心)と次男ホノリウスの西方(ローマ中心)に分割相続された出来事。行政上の分割にとどまるはずが、以後両者が再統合されることはなく事実上恒久的な分裂となった。ゲルマン人の侵入圧力に対し財政・軍事基盤の弱い西方は476年に滅亡するのに対し、経済的に豊かで防衛にも有利な東方(ビザンツ帝国)はその後約1000年にわたり存続することとなり、東西の命運を大きく分けることになった。' },
  { id:'sack_of_rome_410', name:'西ゴート族によるローマ略奪', category:'event', lat:41.90, lng:12.49, start:410, end:410, region:'イタリア(ローマ)',
    desc:'西ゴート王アラリックが率いる軍勢がローマ市を包囲・占領し、3日間にわたり略奪を行った事件。ガリアなどからの帝国防衛のためゲルマン人傭兵に大きく依存していたローマが、その傭兵集団自身によって「永遠の都」を蹂躙されるに至ったことは、800年近く外敵の占領を受けたことのなかった首都の権威失墜を象徴し、当時のローマ人に精神的にも大きな衝撃を与えた(アウグスティヌスが『神の国』を著す直接の契機ともなった)。' },
  { id:'attila_hun', name:'アッティラ', category:'person', lat:47.50, lng:19.04, start:406, end:453, region:'パンノニア(フン族)',
    desc:'フン族の王。バルカン半島からガリア・イタリアにかけて大規模な侵攻を繰り返し、東西ローマ双方を震え上がらせた。キリスト教徒の年代記作者からは「神の鞭」と恐れられた。' },
  { id:'odoacer', name:'オドアケル', category:'person', lat:44.42, lng:12.20, start:433, end:493, region:'イタリア(ラヴェンナ)',
    desc:'ゲルマン系(スキリ族出身とされる)の傭兵隊長。ローマ軍内のゲルマン人傭兵の不満を背景に反乱を起こし、476年に少年皇帝ロムルス・アウグストゥルスを廃位して西ローマ皇帝の帝冠(印章)を東ローマ皇帝ゼノンに返上し、自らは「イタリア王」を称して事実上の支配者となった。皇帝位を置かずゲルマン人が直接統治するこの体制は西ローマ帝国の名実ともの終焉を告げるものであったが、後に東ローマ皇帝の命を受けた東ゴート王テオドリックによって攻め滅ぼされた。' },

  /* =====================================================================
     人物の「所属国家・王朝」を紐づけるために必要な基幹国家データ
     (英・仏・西・独などは後の章でさらに詳しく拡充する)
     ===================================================================== */
  { id:'carthage', name:'カルタゴ', category:'nation', lat:36.85, lng:10.32, start:-814, end:-146, region:'北アフリカ(現チュニジア)',
    desc:'フェニキア人が北アフリカに築いた植民市を起源とする海洋国家。地中海西部の交易で栄えたが、ローマとの3次にわたるポエニ戦争に敗れ、前146年に完全に破壊されて滅亡した。' },
  { id:'england_kingdom', name:'イングランド王国', category:'nation', lat:51.51, lng:-0.13, start:927, end:1707, region:'ブリテン島(イングランド)',
    desc:'ウェセックス王家のもとでアングロサクソン七王国が統一されて成立した王国。1066年のノルマン・コンクエスト以降はフランス系の王朝(ノルマン朝・プランタジネット朝)を戴き、大陸領土(アンジュー帝国)の保持・喪失を経る中でマグナ=カルタや議会(模範議会)の発展など王権を制約する制度が育まれた。百年戦争・薔薇戦争という対外・対内の長期戦争を経てテューダー朝のもとで主権国家として確立し、宗教改革を経験した後、1707年のスコットランドとの合同法によりグレートブリテン王国へと発展的に解消した。' },
  { id:'france_kingdom', name:'フランス王国', category:'nation', lat:48.86, lng:2.35, start:987, end:1792, region:'フランス',
    desc:'カロリング朝断絶後、西フランク貴族の推挙でユーグ=カペーが即位したことに始まる王国。当初は王領がパリ周辺の狭小な地域に限られ、諸侯(特にイングランド王を兼ねるノルマンディー公・アンジュー伯家)の力が王権を凌ぐ状態であったが、歴代の王が婚姻・没収・戦争によって王領を拡大し、百年戦争を経て中央集権化を大きく前進させた。ヴァロワ朝・ブルボン朝と王朝を替えながらイタリア戦争・宗教戦争を経験し、ルイ14世のもとで絶対王政の絶頂を迎えたが、財政破綻とアンシャン=レジームへの不満からフランス革命が勃発し、1792年王政は廃止された。' },
  { id:'spain_kingdom', name:'スペイン王国', category:'nation', lat:40.42, lng:-3.70, start:1479, end:2000, region:'イベリア半島',
    desc:'カスティリャ王国とアラゴン王国の同君連合(カトリック両王の結婚)により事実上成立した王国。カルロス1世(神聖ローマ皇帝カール5世)・フェリペ2世の時代には新大陸の銀とヨーロッパ随一の陸軍を背景に「太陽の沈まぬ帝国」として最盛期を迎えたが、オランダ独立戦争の長期化や無敵艦隊の敗北、度重なる対外戦争による財政破綻(相次ぐ国家破産)により17世紀には急速に国力を消耗し「スペインの没落」と呼ばれる長期停滞に陥った。18世紀のブルボン朝への交替、19〜20世紀の度重なる内戦・革命・独裁を経ながらも、20世紀末の民主化によって安定した立憲君主政国家として存続している。' },
  { id:'german_empire', name:'ドイツ帝国', category:'nation', lat:52.52, lng:13.40, start:1871, end:1918, region:'ドイツ',
    desc:'普仏戦争の勝利を受け、プロイセン王ヴィルヘルム1世を皇帝としてヴェルサイユ宮殿で成立が宣言された統一国家。25の領邦(王国・大公国・自由市)からなる連邦国家でありながら、プロイセンが人口・面積・軍事力で圧倒的な比重を占め、宰相ビスマルクのもとで社会主義者鎮圧法による労働運動の抑圧と、世界初の社会保険制度(疾病・労災・老齢年金保険)による労働者の懐柔を組み合わせた「アメとムチ」の統治で急速な工業化と大国化を遂げた。しかしヴィルヘルム2世期の積極的な世界政策(ヴェルトポリティーク)と建艦競争は列強との緊張を高め、最終的に第一次世界大戦の敗北とキール軍港での水兵反乱に端を発するドイツ革命により帝政は崩壊した。' },
  { id:'uk_britain', name:'グレートブリテン王国(のちの連合王国)', category:'nation', lat:51.51, lng:-0.13, start:1707, end:2000, region:'ブリテン諸島',
    desc:'1707年合同法によるイングランドとスコットランドの統合で成立した王国。1801年にはアイルランドとも合同し「グレートブリテン及びアイルランド連合王国」となる一方、責任内閣制の確立(ウォルポール)を通じて議会主権に基づく立憲君主政を段階的に成熟させ、産業革命の先駆けとなって19世紀には世界の工業生産・海運・金融の中心として「世界の工場」の地位を確立、史上最大級の版図を持つ大英帝国を築いた(パクス=ブリタニカ)。20世紀には2度の世界大戦を経て国力は相対的に後退し、多くの植民地が独立する脱植民地化の時代を迎えたが、福祉国家体制の構築とサッチャー改革を経て現在に至る。' },

  /* =====================================================================
     ② 中世 — ビザンツ・イスラーム世界との関係を含む中世 追加データ
     ===================================================================== */

  // ---- イスラーム世界の形成と拡大 ----
  { id:'muhammad', name:'ムハンマド', category:'person', lat:21.42, lng:39.83, start:570, end:632, region:'アラビア半島(メッカ・メディナ)',
    desc:'アラビア半島に生まれ、唯一神アッラーの啓示を受けたとしてイスラーム教を創始した預言者。メッカでの迫害を逃れメディナへ移った「ヒジュラ(聖遷、622年)」はイスラーム暦元年とされ、晩年までにアラビア半島の大部分を統一した。' },
  { id:'rashidun_caliphate', name:'正統カリフ時代', category:'nation', lat:24.47, lng:39.61, start:632, end:661, region:'アラビア半島〜西アジア',
    desc:'ムハンマドの死後、選挙で選ばれた4代のカリフ(後継者)が共同体を指導した時代。シリア・エジプト・ペルシアを次々に征服し、ビザンツ帝国とササン朝ペルシアの領土を大きく奪った。第4代カリフ、アリーの暗殺後にウマイヤ朝が成立し終わる。' },
  { id:'umayyad_caliphate', name:'ウマイヤ朝', category:'nation', lat:33.51, lng:36.29, start:661, end:750, region:'ダマスクス(シリア)を首都に西アジア〜北アフリカ・イベリア半島',
    relatedIds:['abbasid_caliphate','cordoba_caliphate','byzantine'],
    desc:'ダマスクスを首都としたイスラーム初の世界帝国。北アフリカからイベリア半島にまで領土を広げたが、トゥール・ポワティエ間の戦いでフランク王国に敗れて西方への拡大が止まり、後にアッバース家の革命で倒された。' },
  { id:'battle_tours', name:'トゥール・ポワティエ間の戦い', category:'war', lat:46.66, lng:0.34, start:732, end:732, region:'フランス中西部',
    desc:'イベリア半島から北上したウマイヤ朝軍を、フランク王国の宮宰カール・マルテルが撃退した戦い。この勝利によりイスラーム勢力の西ヨーロッパへの本格的な進出は食い止められた。' },
  { id:'abbasid_caliphate', name:'アッバース朝', category:'nation', lat:33.34, lng:44.39, start:750, end:1258, region:'バグダードを首都に西アジア全域',
    relatedIds:['umayyad_caliphate','cordoba_caliphate'],
    desc:'ウマイヤ朝を倒して成立したイスラーム王朝。新首都バグダードは学問・商業の一大中心地として繁栄し(最盛期の「イスラーム文明の黄金期」)、ギリシャ哲学の翻訳・研究などを通じて後のヨーロッパのルネサンスにも影響を与えた。13世紀にモンゴル軍の侵攻で滅亡した。' },
  { id:'iconoclasm', name:'聖像禁止令(聖像破壊運動)', category:'event', lat:41.01, lng:28.98, start:726, end:843, region:'ビザンツ帝国',
    desc:'ビザンツ皇帝レオン3世が発した、聖像(イコン)崇拝を偶像崇拝として禁じる勅令に端を発する論争と運動。西方教会との対立を深める一因となり、後の東西教会分裂の遠因の一つとなった。' },
  { id:'battle_manzikert', name:'マンジケルトの戦い', category:'war', lat:39.14, lng:42.68, start:1071, end:1071, region:'アナトリア東部',
    desc:'セルジューク朝トルコ軍がビザンツ帝国軍を破り、皇帝ロマノス4世を捕虜とした戦い。この敗北によりビザンツはアナトリア内陸部の大半を失い、後の十字軍派遣を要請する一因となった。' },

  // ---- 東西教会の分裂とスラヴ世界 ----
  { id:'east_west_schism', name:'東西教会分裂(大シスマ)', category:'event', lat:41.01, lng:28.98, start:1054, end:1054, region:'ローマ・コンスタンティノープル',
    desc:'教義・典礼・首位権をめぐる対立から、ローマ教皇とコンスタンティノープル総主教が互いを破門しあった事件。これにより、キリスト教世界はローマ=カトリック教会とギリシャ正教会に恒久的に分裂した。' },
  { id:'cyril_methodius', name:'キュリロスとメトディオス', category:'person', lat:42.70, lng:23.32, start:826, end:885, region:'ビザンツ帝国(スラヴ人布教)',
    desc:'ビザンツ帝国出身の兄弟宣教師。スラヴ人への布教のためにグラゴル文字(後のキリル文字のもとになった文字)を考案し、スラヴ語による典礼を広めた。東方正教会がスラヴ世界(ロシア・セルビア・ブルガリアなど)に広まる基礎を築いた。' },
  { id:'kievan_rus', name:'キエフ公国(キエフ・ルーシ)', category:'nation', lat:50.45, lng:30.52, start:882, end:1240, region:'東スラヴ(現ウクライナ・ロシア)',
    desc:'ノルマン系のルーシ人(ヴァリャーグ)が東スラヴ人の地に交易路の拠点として建てた国家連合。ウラディミル1世がビザンツ皇女との結婚を機にギリシャ正教を受け入れ国教と定めたことは、以後のロシアが西欧カトリック文明とは異なる独自の文化圏(ビザンツ=正教文明圏)を形成していく決定的な転換点となった。しかし諸公国への分裂(封建的分立化)が進んで統一性を失い、13世紀のモンゴル(バトゥ)の侵攻を受けて事実上解体、以後約240年にわたるモンゴルの間接支配(タタールのくびき)下に置かれることになった。' },
  { id:'bulgarian_empire', name:'ブルガリア帝国(第一次)', category:'nation', lat:42.70, lng:23.32, start:681, end:1018, region:'バルカン半島',
    desc:'バルカン半島に成立したブルガール人とスラヴ人の国家。しばしばビザンツ帝国と激しく争ったが、1018年にビザンツ皇帝バシレイオス2世に征服され、一時滅亡した。' },

  // ---- ビザンツ帝国の展開 ----
  { id:'theodora_byzantine', name:'テオドラ(ユスティニアヌス1世妃)', category:'person', lat:41.01, lng:28.98, start:500, end:548, parentId:'byzantine', region:'ビザンツ帝国',
    desc:'女優出身という異例の経歴からユスティニアヌス1世の皇后となった女性。532年のニカの乱で動揺する夫を鼓舞して踏みとどまらせたと伝えられ、女性の権利保護など内政面でも影響力を発揮した。' },
  { id:'nika_riots', name:'ニカの乱', category:'event', lat:41.01, lng:28.98, start:532, end:532, region:'コンスタンティノープル',
    desc:'戦車競走の観客同士の対立から発展した、ユスティニアヌス1世の治世最大の暴動。首都は大きな被害を受けたが、鎮圧後にハギア・ソフィア大聖堂の再建など大規模な事業が進められた。' },
  { id:'hagia_sophia', name:'ハギア・ソフィア大聖堂の建設', category:'event', lat:41.01, lng:28.98, start:532, end:537, region:'コンスタンティノープル',
    desc:'ユスティニアヌス1世が再建させた大聖堂。巨大なドームを持つビザンツ建築の最高傑作とされ、後にオスマン帝国の支配下でモスクに、現在は再びモスクとして使われている。' },
  { id:'macedonian_dynasty', name:'マケドニア朝(ビザンツ)', category:'dynasty', lat:41.01, lng:28.98, start:867, end:1056, region:'ビザンツ帝国',
    desc:'バシレイオス1世に始まるビザンツ帝国の王朝で、帝国の「中期の全盛期」を築いた。バシレイオス2世の時代にブルガリア帝国を征服するなど最大版図を実現し、文化的にも「マケドニア朝ルネサンス」と呼ばれる復興が見られた。' },
  { id:'komnenian_dynasty', name:'コムネノス朝(ビザンツ)', category:'dynasty', lat:41.01, lng:28.98, start:1081, end:1185, region:'ビザンツ帝国',
    desc:'マンジケルトの戦い後の混乱期を乗り切ったビザンツの王朝。初代アレクシオス1世は西方に救援を求め、これが第1回十字軍の契機の一つとなった。一時的な国勢回復(コムネノス朝ルネサンス)を実現したが、第4回十字軍によって王朝は終焉を迎えた。' },
  { id:'fourth_crusade', name:'第4回十字軍とコンスタンティノープル占領', category:'war', lat:41.01, lng:28.98, start:1202, end:1204, region:'コンスタンティノープル',
    desc:'本来の目的地(エジプト)から逸れ、ヴェネツィア商人の意向もあってビザンツの首都コンスタンティノープルを攻撃・占領した十字軍。この結果ラテン帝国が建てられ、ビザンツ帝国は一時的に亡命政権(ニカイア帝国)に分裂した。' },
  { id:'palaiologan_dynasty', name:'パレオロゴス朝(ビザンツ最後の王朝)', category:'dynasty', lat:41.01, lng:28.98, start:1261, end:1453, region:'ビザンツ帝国',
    desc:'ニカイア帝国からコンスタンティノープルを奪回して復興したビザンツ最後の王朝。もはやかつての大帝国ではなく周辺のエーゲ海勢力の一つに過ぎなかったが、その滅亡(1453年)まで千年余のローマ帝国の命脈を保った。' },
  { id:'mehmed_ii', name:'メフメト2世', category:'person', lat:41.01, lng:28.98, start:1432, end:1481, parentId:'ottoman_empire', region:'オスマン帝国',
    desc:'1453年にコンスタンティノープルを攻略し、ビザンツ帝国を滅ぼしたオスマン帝国のスルタン。「征服者」と称され、征服後はコンスタンティノープル(イスタンブル)を新首都として整備し、多民族・多宗教を包摂する統治体制を築いた。' },
  { id:'ottoman_empire', name:'オスマン帝国', category:'nation', lat:41.01, lng:28.98, start:1299, end:1922, region:'アナトリア〜バルカン半島・中東・北アフリカ',
    relatedIds:['byzantine','ottoman_conquest','battle_kosovo_1389','battle_nicopolis','battle_ankara','battle_varna','battle_mohacs','siege_vienna_1529','battle_vienna_1683','battle_chaldiran','battle_preveza','safavid_empire','mamluk_sultanate','young_turk_revolution'],
    desc:'アナトリアの一君侯国から興り、ビザンツ帝国を滅ぼしてバルカン半島・中東・北アフリカにまたがる大帝国に成長したイスラーム国家。スレイマン1世の時代に最盛期を迎え、東西交易とヨーロッパの国際政治に長く大きな影響を及ぼしたが、第一次世界大戦の敗北により解体した。' },

  // ---- 西ヨーロッパ中世世界(封建社会・教皇権)の補強 ----
  { id:'treaty_verdun', name:'ヴェルダン条約', category:'treaty', lat:49.16, lng:5.38, start:843, end:843, region:'フランク王国',
    desc:'カール大帝の孫の代に、フランク王国を東・西・中部の3つに分割した条約。この分割は現在のフランス・ドイツ・イタリアの原型を形づくったとされ、フランク王国はこれ以降統一を回復することはなかった。' },
  { id:'otto_i', name:'オットー1世(大帝)', category:'person', lat:50.78, lng:6.08, start:912, end:973, parentId:'hre', region:'東フランク(ドイツ)',
    desc:'ハインリヒ1世の子で、レヒフェルトの戦い(955年)でマジャール人(ハンガリー人の祖先)の侵入を決定的に撃退し、キリスト教世界の守護者としての軍事的名声を確立した東フランク王。この功績と、教会組織を国王の統制下に置いて行政・軍事の担い手として活用する「帝国教会政策」による強固な統治基盤を背景に、962年、教皇ヨハネス12世から皇帝の冠を授けられた。この戴冠は、古代ローマ帝国の後継者を称する皇帝権が西方に恒久的に確立されたことを意味し、神聖ローマ帝国の実質的な始まりとされる。' },
  { id:'investiture_controversy', name:'叙任権闘争(カノッサの屈辱)', category:'event', lat:44.53, lng:10.45, start:1075, end:1122, region:'神聖ローマ帝国・イタリア(カノッサ)',
    desc:'修道院改革運動(クリュニー改革)を背景に聖職売買・聖職者妻帯の禁止を掲げる教皇グレゴリウス7世が、聖職者(司教)の任命権(叙任権)を世俗の皇帝から教会の手に取り戻そうとしたことに端を発する争い。皇帝ハインリヒ4世がこれに反発して教皇廃位を宣言すると、教皇は逆に皇帝を破門し、国内諸侯の離反を恐れたハインリヒ4世は雪の降るカノッサ城門前で3日間裸足で立ち続けて許しを乞うという屈辱的な譲歩を強いられた(「カノッサの屈辱」、1077年)。この事件は一時的な教皇権の劇的な優位を示したが、その後もハインリヒ4世は体制を立て直して教皇と再び争い続け、最終的に子ハインリヒ5世の代のヴォルムス協約(1122年)で聖職叙任(宗教的権限)は教会側に、世俗的な封土授与は皇帝側にそれぞれ帰属させる妥協により、半世紀近く続いたこの争いに一応の決着がついた。' },
  { id:'feudalism_manorialism', name:'封建社会(封建制と荘園制)の成立', category:'event', lat:48.86, lng:2.35, start:800, end:1100, region:'西ヨーロッパ全域',
    desc:'主君と家臣が土地(封土)の給与を通じて双務的な主従関係を結ぶ封建制と、荘園を単位とする農業経営(荘園制)を基盤とした社会体制。中央権力の弱体化とノルマン人・マジャール人・イスラーム勢力の侵入という混乱の中で西ヨーロッパ各地に定着した。' },
  { id:'medieval_towns', name:'中世都市の成立と発展', category:'event', lat:50.11, lng:8.68, start:1000, end:1300, region:'西ヨーロッパ全域(ドイツ・イタリア・フランドルなど)',
    desc:'商業の復活を背景に各地で自治権を持つ都市が発達した現象。ドイツの「皇帝直属都市」やイタリアの自治都市(コムーネ)、北ドイツ諸都市が結成したハンザ同盟などが代表例で、市民階級(ブルジョワジー)成長の母体となった。' },
  { id:'hanseatic_league', name:'ハンザ同盟', category:'nation', lat:53.87, lng:10.68, start:1241, end:1669, region:'北ドイツ・バルト海沿岸(リューベック中心)',
    desc:'リューベックを中心に北ドイツ・バルト海沿岸の諸都市が、遠隔地商人の相互保護と交易利権の独占を目的に結成した商業・軍事同盟。加盟都市は独自の関税免除や交易特権を求めてデンマークなど周辺国と戦争も辞さず、北海・バルト海交易(毛皮・木材・穀物・海産物・毛織物)をほぼ独占的に支配し、最盛期にはロンドン(スティールヤード)・ノヴゴロド・ブリュージュ・ベルゲンなど各地に在外商館(コントール)を構える一大商業ネットワークを築いた。しかし新航路の開拓(大西洋貿易への重心移動)や、オランダ・イギリスなど新興海洋勢力の台頭、加盟都市間の利害対立などにより次第に衰退し、17世紀には事実上解体した。' },
  { id:'reconquista', name:'レコンキスタ(国土回復運動)', category:'war', lat:37.18, lng:-3.60, start:718, end:1492, region:'イベリア半島',
    desc:'711年のイスラーム勢力(ウマイヤ朝)によるイベリア半島征服後、北部の山岳地帯に逃れたキリスト教徒諸勢力(アストゥリアス王国など)が、約780年の歳月をかけてイスラーム勢力の支配地域を奪還していった長期にわたる過程。カスティリャ・アラゴン・ポルトガルなど複数のキリスト教国家がそれぞれ独自に南進を進め、この過程で獲得した征服地には十字軍的な宗教的正当化(聖ヤコブ=サンティアゴ信仰など)が付与された。1492年、最後のイスラーム勢力の拠点ナスル朝グラナダが陥落してレコンキスタは完了し、同年のユダヤ教徒追放・コロンブスの新大陸到達とあわせてスペインの大国化と宗教的均質化の出発点となった。' },
  { id:'teutonic_order', name:'ドイツ騎士団', category:'dynasty', lat:54.42, lng:18.66, start:1190, end:1525, region:'バルト海沿岸(プロイセン)',
    desc:'第3回十字軍の中、ドイツ系の巡礼者・傷病兵の救護を目的に結成された宗教騎士団。聖地でのキリスト教勢力後退を受けて活動の場を北方に移し、ポーランド王の要請で異教徒プロイセン人の征服・キリスト教化(北方十字軍)に乗り出すと、バルト海沿岸のプロイセン地方を武力で征服してドイツ騎士団領という独自の宗教国家を築いた。しかしタンネンベルクの戦い(1410年)でポーランド=リトアニア連合軍に大敗して以降は衰退し、最終的に総長アルブレヒトが宗教改革の波に乗じてルター派に改宗、騎士団領を世俗化してプロイセン公国とすることで、その支配体制は終焉を迎えた。' },

  /* =====================================================================
     ①-2 古代オリエント世界 追加データ
     (「1章 オリエントと地中海世界」を漏れなく収録するための補完)
     ===================================================================== */

  // ---- メソポタミア ----
  { id:'sumer', name:'シュメール(都市国家群)', category:'nation', lat:30.96, lng:46.10, start:-3500, end:-2000, region:'メソポタミア南部',
    desc:'人類最古の都市文明。ウル・ウルク・ラガシュなどの都市国家が分立し、楔形文字・六十進法・ジッグラト(聖塔)などを生み出した。『ギルガメシュ叙事詩』は現存する世界最古の文学作品の一つとされる。' },
  { id:'cuneiform_invention', name:'楔形文字の発明', category:'event', lat:31.32, lng:45.64, start:-3400, end:-3000, region:'メソポタミア(ウルク)',
    desc:'シュメール人が粘土板に葦の茎などで刻んで生み出した、人類最古とされる文字体系。当初は絵文字的だったが、次第に音を表す表音的な要素を持つ体系へと発展し、後の西アジア諸民族にも広く使用された。' },
  { id:'akkadian_empire', name:'アッカド王国', category:'nation', lat:32.54, lng:44.42, start:-2334, end:-2154, region:'メソポタミア',
    desc:'サルゴン(1世)がシュメールの都市国家群を征服して建てた、史上最初の統一国家(領域国家)とされる王国。セム語系のアッカド人による支配は、後のメソポタミア諸国家の一つの型となった。' },
  { id:'sargon_akkad', name:'サルゴン1世', category:'person', lat:32.54, lng:44.42, start:-2334, end:-2279, parentId:'akkadian_empire', region:'アッカド王国',
    desc:'シュメールの諸都市国家を征服し、史上初めて広域を統一支配する王国(アッカド王国)を築いたとされる王。以後のメソポタミアにおける「帝国」的統治の先駆けとなった。' },
  { id:'babylon_old', name:'古バビロニア王国(バビロン第1王朝)', category:'nation', lat:32.54, lng:44.42, start:-1894, end:-1595, region:'メソポタミア',
    desc:'アムル人がバビロンを都に建てた王朝。ハンムラビ王のもとでメソポタミア全域を統一したが、その後衰退し、ヒッタイトの侵攻により滅ぼされた。' },
  { id:'hammurabi', name:'ハンムラビ王', category:'person', lat:32.54, lng:44.42, start:-1810, end:-1750, parentId:'babylon_old', region:'古バビロニア王国',
    desc:'古バビロニア王国の最盛期を築いた王。「目には目を、歯には歯を」の同害復讐の原則で知られる『ハンムラビ法典』を制定し、身分による刑罰の差なども定めた、現存する最古級の成文法典の一つを残した。' },
  { id:'hittites', name:'ヒッタイト', category:'nation', lat:40.02, lng:34.62, start:-1680, end:-1180, region:'アナトリア(現トルコ)',
    desc:'鉄製武器と戦車(チャリオット)をいち早く実用化した軍事強国。古バビロニア王国を滅ぼし、エジプトとはカデシュの戦いで激突した。「海の民」の活動などをきっかけに前1180年頃に崩壊した。' },
  { id:'battle_kadesh', name:'カデシュの戦い', category:'war', lat:34.65, lng:36.53, start:-1274, end:-1274, region:'シリア(カデシュ)',
    desc:'エジプトのラメセス2世とヒッタイトが激突した、記録に残る人類史上最大級の戦車戦。勝敗は決しなかったが、双方が大きな損害を受け、後の平和条約締結につながった。' },
  { id:'treaty_kadesh', name:'エジプト・ヒッタイト平和条約(カデシュの和約)', category:'treaty', lat:34.65, lng:36.53, start:-1258, end:-1258, region:'エジプト・ヒッタイト間',
    desc:'カデシュの戦いの後に結ばれた、ラメセス2世とヒッタイト王ハットゥシリ3世による講和条約。相互不可侵と軍事同盟などを定めた、現存する史料で確認できる世界最古の国際平和条約とされる。' },
  { id:'assyria_empire', name:'アッシリア(新アッシリア帝国)', category:'nation', lat:36.36, lng:43.15, start:-900, end:-612, region:'メソポタミア北部',
    desc:'鉄製武器・戦車・騎兵を駆使した軍事国家。前7世紀にはエジプトからメソポタミアまでを支配し、史上初めてオリエント全域を統一する「世界帝国」となったが、過酷な統治への反発から諸民族の反乱を招き、前612年に新バビロニアとメディアの連合軍に都ニネヴェを陥落させられて滅んだ。' },
  { id:'ashurbanipal', name:'アッシュルバニパル王', category:'person', lat:36.36, lng:43.15, start:-685, end:-627, parentId:'assyria_empire', region:'アッシリア',
    desc:'アッシリア最盛期の王。都ニネヴェに大図書館を建設し、メソポタミア各地から集めた粘土板文書を収蔵させた。この図書館は後世の考古学者による楔形文字解読・メソポタミア史研究に決定的な役割を果たした。' },
  { id:'media_kingdom', name:'メディア王国', category:'nation', lat:34.80, lng:48.51, start:-728, end:-550, region:'イラン高原北西部',
    desc:'インド=ヨーロッパ語系イラン人が建てた王国。新バビロニアと同盟してアッシリアを滅ぼし、「4王国分立」の一角を占めたが、服属していたペルシア人のキュロス2世に滅ぼされ、アケメネス朝成立の母体となった。' },
  { id:'neo_babylonia', name:'新バビロニア王国(カルデア)', category:'nation', lat:32.54, lng:44.42, start:-625, end:-539, region:'メソポタミア',
    desc:'セム語系のカルデア人がメソポタミアに建てた王国。アッシリアを滅ぼして「4王国分立」の一つとなり、ネブカドネザル2世のもとで最盛期を迎えたが、前539年にアケメネス朝ペルシアのキュロス2世に滅ぼされた。' },
  { id:'nebuchadnezzar_ii', name:'ネブカドネザル2世', category:'person', lat:32.54, lng:44.42, start:-634, end:-562, parentId:'neo_babylonia', region:'新バビロニア王国',
    desc:'新バビロニア王国の最盛期を築いた王。ユダ王国を滅ぼしてイェルサレムの住民を強制的にバビロンへ連行した(バビロン捕囚)ほか、「空中庭園」の伝説でも知られる。' },
  { id:'babylonian_captivity', name:'バビロン捕囚', category:'event', lat:32.54, lng:44.42, start:-597, end:-538, region:'新バビロニア(バビロン)',
    desc:'新バビロニアに征服されたユダ王国の住民が、都バビロンへ強制的に移住させられた出来事。前538年、新バビロニアを滅ぼしたアケメネス朝ペルシアのキュロス2世の勅令によって解放された。この苦難の経験はユダヤ教の民族的自覚を強める大きな契機となった。' },

  // ---- リディアと4王国分立 ----
  { id:'lydia', name:'リディア', category:'nation', lat:38.49, lng:28.04, start:-680, end:-546, region:'アナトリア西部',
    desc:'アナトリア西部に成立した王国。世界で最初に金属貨幣(コイン)を鋳造した国とされ、王クロイソスの時代に繁栄したが、アケメネス朝ペルシアのキュロス2世に滅ぼされた。' },
  { id:'croesus', name:'クロイソス王', category:'person', lat:38.49, lng:28.04, start:-595, end:-546, parentId:'lydia', region:'リディア',
    desc:'莫大な富で知られたリディア最後の王。「クロイソスのように富める」という慣用句にその名を残すが、アケメネス朝ペルシアのキュロス2世との戦いに敗れ、リディアは滅亡した。' },

  // ---- アケメネス朝ペルシア ----
  { id:'achaemenid_persia', name:'アケメネス朝ペルシア', category:'nation', lat:29.94, lng:52.89, start:-550, end:-330, region:'イラン高原を中心に西アジア全域',
    desc:'イラン人のキュロス2世が建国し、メディア・リディア・新バビロニアを次々に滅ぼしてオリエントを再統一した史上初の「世界帝国」。各州に総督(サトラップ)を置き「王の道」と呼ばれる幹線道路を整備するなど、広大な領土を統治する仕組みを整えたが、前330年にアレクサンドロス大王の東方遠征により滅ぼされた。' },
  { id:'cyrus_the_great', name:'キュロス2世(大王)', category:'person', lat:29.94, lng:52.89, start:-600, end:-530, parentId:'achaemenid_persia', region:'アケメネス朝ペルシア',
    desc:'アケメネス朝ペルシアの建国者。メディア・リディア・新バビロニアを征服してオリエントを統一し、バビロン捕囚下にあったユダヤ人を解放するなど、被征服民の宗教・慣習を尊重する統治で知られる。' },
  { id:'cambyses_ii', name:'カンビュセス2世', category:'person', lat:29.94, lng:52.89, start:-529, end:-522, parentId:'achaemenid_persia', region:'アケメネス朝ペルシア',
    desc:'キュロス2世の子で第2代の王。エジプトを征服してアケメネス朝の支配下に組み込み、オリエント全域の再統一を完成させた。' },
  { id:'darius_i', name:'ダレイオス1世', category:'person', lat:29.94, lng:52.89, start:-550, end:-486, parentId:'achaemenid_persia', region:'アケメネス朝ペルシア',
    desc:'アケメネス朝の最盛期を築いた王。全国を約20の州に分けてサトラップ(総督)を配置し、「王の道」や駅伝制を整えるなど中央集権的な統治機構を確立したが、ギリシア遠征(ペルシア戦争)ではマラトンの戦いで敗れた。' },
  { id:'xerxes_i', name:'クセルクセス1世', category:'person', lat:29.94, lng:52.89, start:-518, end:-465, parentId:'achaemenid_persia', region:'アケメネス朝ペルシア',
    desc:'ダレイオス1世の子。父の遺志を継いで大軍を率いてギリシアに再侵攻し、テルモピュライの戦いでは勝利したもののサラミスの海戦で大敗し、ギリシア征服には失敗した。' },
  { id:'darius_iii', name:'ダレイオス3世', category:'person', lat:29.94, lng:52.89, start:-380, end:-330, parentId:'achaemenid_persia', region:'アケメネス朝ペルシア',
    desc:'アケメネス朝最後の王。アレクサンドロス大王の東方遠征を受けて各地で敗北を重ね、最終的に部下に暗殺され、220年余り続いたアケメネス朝は滅亡した。' },
  { id:'zoroastrianism', name:'ゾロアスター教の成立', category:'event', lat:35.70, lng:51.42, start:-1200, end:-600, region:'イラン高原(生没年・成立年代には諸説あり)',
    desc:'預言者ゾロアスター(ザラスシュトラ)が説いたとされる、善神アフラ・マズダと悪神アーリマンとの対立を軸とする善悪二元論的な宗教。成立年代には諸説あるが、アケメネス朝以降のイランで広く信仰され、最後の審判や天国・地獄などの観念は後のユダヤ教・キリスト教・イスラーム教にも影響を与えたとされる。' },

  // ---- 古代エジプト(王朝史の補強) ----
  { id:'hieroglyph_invention', name:'ヒエログリフ(神聖文字)の使用開始', category:'event', lat:29.98, lng:31.13, start:-3200, end:-3000, region:'エジプト',
    desc:'古代エジプトで用いられた表語・表音混合の文字体系。神殿や墓の壁面・パピルスに記され、19世紀にロゼッタ・ストーンの解読によってその読み方が明らかにされた。' },
  { id:'khufu', name:'クフ王', category:'person', lat:29.98, lng:31.13, start:-2589, end:-2566, parentId:'egypt_old', region:'古代エジプト(古王国)',
    desc:'古王国第4王朝のファラオ。ギザに現存する中で最大のピラミッド(大ピラミッド)を建造させたとされ、その建設には強力な王権と組織的な労働動員の仕組みが必要だったと考えられている。' },
  { id:'pyramid_giza', name:'ギザの大ピラミッド建設', category:'event', lat:29.98, lng:31.13, start:-2560, end:-2540, region:'エジプト(ギザ)',
    desc:'クフ王のために建造された、現存する古代世界七不思議の中で唯一ほぼ完全な形で残る巨大建造物。ファラオの絶大な権力と、当時の高度な測量・建築技術を示す象徴とされる。' },
  { id:'hatshepsut', name:'ハトシェプスト女王', category:'person', lat:29.98, lng:31.13, start:-1507, end:-1458, parentId:'egypt_old', region:'古代エジプト(新王国)',
    desc:'新王国第18王朝の女性ファラオ。男性のファラオに扮した像を残すなど異例の統治を行い、対外遠征よりも交易(プント遠征)や大規模な神殿建築で知られる、比較的平和な治世を築いた。' },
  { id:'akhenaten', name:'アクエンアテン(アメンホテプ4世)', category:'person', lat:29.98, lng:31.13, start:-1351, end:-1334, parentId:'egypt_old', region:'古代エジプト(新王国)',
    desc:'太陽神アテンのみを信仰させる宗教改革を断行したファラオ。多神教の伝統的な神官団の力を削ぐ狙いもあったとされるが、改革は彼の死後まもなく撤回された。王妃ネフェルティティの美しい胸像でも知られる。' },
  { id:'ramesses_ii', name:'ラメセス2世', category:'person', lat:29.98, lng:31.13, start:-1279, end:-1213, parentId:'egypt_old', region:'古代エジプト(新王国)',
    desc:'新王国第19王朝のファラオ。ヒッタイトとのカデシュの戦いを戦い、後に史上最古級の平和条約を結んだ。アブ・シンベル神殿をはじめ各地に壮大な建造物を残し、新王国最盛期を代表する王とされる。' },

  // ---- 古代イスラエル(ヘブライ人) ----
  { id:'ancient_israel', name:'古代イスラエル(ヘブライ王国)', category:'nation', lat:31.77, lng:35.21, start:-1020, end:-586, region:'パレスチナ',
    desc:'ヘブライ人(イスラエル人)がパレスチナに建てた王国。サウル・ダビデ・ソロモンの3代で統一王国として繁栄したが、ソロモンの死後、北のイスラエル王国と南のユダ王国に分裂。イスラエルは前722年にアッシリアに、ユダは前586年に新バビロニアに滅ぼされた。この民族的苦難の中で、唯一神ヤハウェを信仰するユダヤ教が確立していった。' },
  { id:'david_king', name:'ダビデ王', category:'person', lat:31.77, lng:35.21, start:-1040, end:-970, parentId:'ancient_israel', region:'古代イスラエル',
    desc:'イスラエル人の統一王国第2代の王。周辺諸民族との戦いを経てイェルサレムを征服して都と定め、イスラエル王国の基礎を固めた、ユダヤ教・キリスト教・イスラーム教いずれにおいても重要視される王。' },
  { id:'solomon_king', name:'ソロモン王', category:'person', lat:31.77, lng:35.21, start:-990, end:-931, parentId:'ancient_israel', region:'古代イスラエル',
    desc:'ダビデ王の子で、イスラエル統一王国の最盛期を築いた王。イェルサレムに壮麗な神殿(第一神殿、ソロモン神殿)を建設したが、その死後王国は南北に分裂した。「ソロモンの知恵」の逸話でも知られる。' },
  { id:'fall_of_israel_assyria', name:'イスラエル王国の滅亡', category:'event', lat:32.28, lng:35.30, start:-722, end:-722, region:'パレスチナ北部(イスラエル王国)',
    desc:'南北分裂後の北イスラエル王国が、アッシリアの侵攻によって滅ぼされた出来事。住民の多くが各地に強制移住させられ、その後の消息がたどれなくなったことから「失われた10支族」の伝承を生んだ。' },

  // ---- オリエント: パルティア・ササン朝ほか補完 ----
  { id:'mitanni_kingdom', name:'ミタンニ王国', category:'nation', lat:36.83, lng:40.22, start:-1500, end:-1300, region:'北メソポタミア・シリア北部',
    desc:'フルリ人を中心にインド=イラン系の要素も持つとされる王国。最盛期にはヒッタイト・エジプトと並ぶ勢力を誇ったが、両者に挟撃されて衰退し、後にアッシリアに併合された。' },
  { id:'kassite_babylon', name:'カッシート朝バビロン', category:'dynasty', lat:32.54, lng:44.42, start:-1595, end:-1155, region:'バビロン',
    desc:'古バビロニア王国滅亡後、約400年にわたりバビロンを支配した異民族王朝。出自ははっきりしないが、長期の安定した統治のもとバビロンの伝統文化を保護・継承した。' },
  { id:'elam_kingdom', name:'エラム', category:'nation', lat:32.19, lng:48.26, start:-2700, end:-539, region:'イラン高原南西部(スサ)',
    desc:'スサを中心にメソポタミアの東に栄えた王国。しばしばメソポタミア諸国と抗争・交流を繰り返し、アッシリアに一時征服された後、最終的にアケメネス朝ペルシアに統合された。' },
  { id:'hyksos', name:'ヒクソスの支配', category:'event', lat:30.79, lng:31.82, start:-1650, end:-1550, region:'エジプト(ナイル・デルタ、アヴァリス)',
    desc:'シリア・パレスチナ方面から流入した系統不明の異民族集団がエジプト北部を支配した時代。馬と戦車を初めてエジプトにもたらしたとされ、その駆逐(前1550年頃)を機にエジプト新王国が始まった。' },
  { id:'thutmose_iii', name:'トトメス3世', category:'person', parentId:'egypt_old', lat:25.72, lng:32.6, start:-1481, end:-1425, region:'古代エジプト(新王国)',
    desc:'積極的な対外遠征によりエジプトの版図をシリアからヌビアにまで広げ、新王国の最大版図を実現したファラオ。その軍事的手腕から「エジプトのナポレオン」とも称される。' },
  { id:'moses', name:'モーセ', category:'person', lat:28.54, lng:33.97, start:-1391, end:-1271, region:'伝承上の人物(エジプト〜シナイ半島)',
    desc:'旧約聖書に登場する指導者。エジプトで隷属状態にあったヘブライ人を率いて脱出させ(出エジプト)、シナイ山で十戒を授かったと伝えられる。史実性は不確かだが、ユダヤ教・キリスト教・イスラーム教に共通する重要人物である。' },
  { id:'parthia', name:'パルティア(アルサケス朝)', category:'nation', lat:33.09, lng:44.58, start:-247, end:224, region:'イラン高原・メソポタミア',
    desc:'遊牧イラン系のパルニ族が興した国家。ヘレニズム勢力(セレウコス朝)を排除してイラン高原からメソポタミアを支配し、後にローマと東方で対峙する大国となったが、224年にササン朝に取って代わられた。' },
  { id:'mithridates_i_parthia', name:'ミトラダテス1世', category:'person', parentId:'parthia', lat:33.09, lng:44.58, start:-195, end:-132, region:'パルティア',
    desc:'パルティアの実質的な建国者とされる王。セレウコス朝からメソポタミアを奪い、パルティアを地域大国へと発展させた。' },
  { id:'sassanid_persia', name:'ササン朝ペルシア', category:'nation', lat:33.09, lng:44.58, start:224, end:651, region:'イラン高原・メソポタミア',
    desc:'アルデシール1世が興したイラン系の王朝国家。ゾロアスター教を国教とし、ローマ(ビザンツ)と長期にわたり抗争を繰り広げたが、7世紀に正統カリフ時代のイスラーム勢力に征服され滅亡した。' },
  { id:'ardashir_i', name:'アルデシール1世', category:'person', parentId:'sassanid_persia', lat:33.09, lng:44.58, start:180, end:242, region:'ササン朝ペルシア',
    desc:'パルティアを倒してササン朝を建国した王。ゾロアスター教を国教と定め、中央集権的な統治体制の基礎を築いた。' },
  { id:'shapur_i', name:'シャープール1世', category:'person', parentId:'sassanid_persia', lat:33.09, lng:44.58, start:215, end:270, region:'ササン朝ペルシア',
    desc:'ローマ皇帝ウァレリアヌスをエデッサの戦いで捕虜とするなど、ローマに対して優位に戦いを進めた王。' },
  { id:'battle_edessa', name:'エデッサの戦い', category:'war', lat:37.16, lng:38.79, start:260, end:260, region:'メソポタミア北部(エデッサ)',
    desc:'ササン朝ペルシア王シャープール1世がローマ軍を破り、ローマ皇帝ウァレリアヌスを捕虜とした戦い。ローマ皇帝が敵国の捕虜となった史上唯一の事例とされ、「3世紀の危機」を象徴する事件となった。' },
  { id:'khosrow_i', name:'ホスロー1世', category:'person', parentId:'sassanid_persia', lat:33.09, lng:44.58, start:501, end:579, region:'ササン朝ペルシア',
    desc:'ササン朝の最盛期を築いた王。行政・税制改革を行い、東ローマ(ビザンツ)のユスティニアヌス1世としばしば争った。' },
  { id:'mani_prophet', name:'マニ', category:'person', lat:33.09, lng:44.58, start:216, end:274, region:'ササン朝ペルシア(メソポタミア)',
    desc:'ゾロアスター教・キリスト教・仏教などの要素を融合した独自の宗教(マニ教)を創始した宗教家。マニ教は東西に広く伝播したが、後にササン朝で異端として弾圧され、彼自身も獄死したと伝えられる。' },
  { id:'hephthalites', name:'エフタル(白いフン族)', category:'nation', lat:36.72, lng:67.11, start:450, end:560, region:'中央アジア(バクトリア方面)',
    desc:'中央アジアの遊牧民族。ササン朝やインドのグプタ朝を圧迫する強勢を誇ったが、6世紀にササン朝と突厥の挟撃を受けて崩壊した。' },

  /* =====================================================================
     ①-3 ギリシア世界 補完データ(政治家・哲学者・文人・科学者など)
     ===================================================================== */
  { id:'draco_laws', name:'ドラコンの立法', category:'event', lat:37.98, lng:23.73, start:-621, end:-621, region:'アテネ',
    desc:'それまで慣習法に頼り貴族が恣意的に運用していたアテネの法を、成文化して公開した最初の試み。窃盗のような軽微な罪にも死刑を科すなど極めて過酷な内容であったが、法が明文化・公開されたことで貴族による恣意的な裁判・法運用に一定の歯止めがかかり、「法の支配」という観念がアテネに根付く出発点となった。この厳格さから、現在でも過酷な規則を英語で「draconian(ドラコン的)」と形容する語源となっている。' },
  { id:'peisistratos', name:'ペイシストラトス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-600, end:-527, region:'アテネ',
    desc:'ソロンの改革後もなお続いた貴族間・地域間の対立に乗じ、非合法的な手段(私兵の武装蜂起)で権力を掌握した僭主。強権的な独裁ではあったが、貴族の大土地所有制を抑制して中小農民を保護し、公共事業や祭礼(パンアテナイア祭など)の整備を通じてアテネ市民全体の一体感醸成にも寄与した。皮肉にも、こうした僭主政による貴族勢力の弱体化が、その死後にクレイステネスが民主政改革を断行する土壌を整えることになった。' },
  { id:'cleisthenes', name:'クレイステネス', category:'person', parentId:'athens_polis', lat:37.98, lng:23.73, start:-570, end:-508, region:'アテネ',
    desc:'僭主政の打倒後、血縁に基づく旧来の4部族制を、地域(デーモス)を基盤とする10部族制へと再編し、氏族・貴族の政治的影響力を制度的に解体した政治家。僭主の再来を防ぐため、市民の投票によって危険人物を10年間国外追放する陶片追放(オストラシズム)の制度も導入した。これら一連の改革により成人男性市民全員が政治参加の基盤を得たことから、「アテネ民主政の父」と評される。' },
  { id:'ionian_revolt', name:'イオニアの反乱', category:'war', lat:37.53, lng:27.27, start:-499, end:-493, region:'小アジア(イオニア地方)',
    desc:'アケメネス朝支配下のイオニア地方のギリシャ人諸都市が起こした反乱。アテネなどが支援したことがペルシアの怒りを買い、ペルシア戦争の直接の引き金となった。' },
  { id:'battle_plataea', name:'プラタイアの戦い', category:'war', lat:38.22, lng:23.27, start:-479, end:-479, region:'ギリシャ中部(プラタイア)',
    desc:'ペルシア戦争における最後の大規模な陸上決戦。ギリシャ連合軍がペルシア陸軍を撃破し、ギリシャ本土からペルシア勢力を一掃した。' },
  { id:'delian_league', name:'デロス同盟', category:'nation', lat:37.98, lng:23.73, start:-478, end:-404, region:'エーゲ海諸都市(アテネを盟主に)',
    desc:'ペルシアの再侵攻に備え、アテネを盟主として結成された軍事同盟。次第にアテネによる事実上の帝国的支配の道具と化し、この変質がペロポネソス戦争の一因となった。' },
  { id:'epaminondas', name:'エパミノンダス', category:'person', lat:38.32, lng:23.32, start:-418, end:-362, region:'テーベ',
    desc:'テーベの将軍・政治家。従来の横一列の戦列に対し、片翼に兵力を集中させて敵の主力を突破する「斜線陣」という戦術革新を用い、レウクトラの戦い(前371年)で当時無敵とされたスパルタ軍主力を撃破した。この勝利によりスパルタの軍事的権威は失墜し、隷属下にあったメッセニアを解放するなどテーベを一時的にギリシャの覇権国家に押し上げたが、マンティネイアの戦いでの戦死とともにテーベの覇権も短期間で終わり、ポリス間の抗争が続く中でマケドニアの台頭を招く一因となった。' },
